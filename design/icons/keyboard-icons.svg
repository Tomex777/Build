<svg xmlns="http://www.w3.org/2000/svg" width="336" height="96" viewBox="0 0 336 96" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
  <!--
    Keyboard icon master. Every symbol uses a 24x24 optical grid and the
    same 1.8-unit rounded stroke. Runtime ImageVectors in KeyboardIcons.kt
    mirror this geometry so the Android IME does not depend on font glyphs.
  -->
  <defs>
    <symbol id="clipboard" viewBox="0 0 24 24">
      <path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2M9 5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v1.5H9Z"/>
    </symbol>
    <symbol id="emoji" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="8.5"/><path d="M8.6 9.4h.02M15.38 9.4h.02M8.2 13.6c.8 1.6 2.05 2.4 3.8 2.4s3-.8 3.8-2.4"/>
    </symbol>
    <symbol id="voice" viewBox="0 0 24 24">
      <rect x="9" y="4" width="6" height="11" rx="3"/><path d="M6.5 11.5v.7a5.5 5.5 0 0 0 11 0v-.7M12 17.7V21M9.2 21h5.6"/>
    </symbol>
    <symbol id="editor" viewBox="0 0 24 24">
      <path d="m5 19 3.1-.65 10.4-10.4a1.77 1.77 0 0 0-2.5-2.5L5.6 15.85ZM14.7 6.75l2.55 2.55M7.2 7.1V4.6M5.95 5.85h2.5M19.3 14.4v3.2M17.7 16h3.2"/>
    </symbol>
    <symbol id="tone" viewBox="0 0 24 24">
      <path d="M4 6h5M13 6h7M11 4v4M4 12h9M17 12h3M15 10v4M4 18h3M11 18h9M9 16v4"/>
    </symbol>
    <symbol id="research" viewBox="0 0 24 24">
      <circle cx="10.5" cy="10.5" r="6"/><path d="m15 15 5 5M19 4v3M17.5 5.5h3"/>
    </symbol>
    <symbol id="input-picker" viewBox="0 0 24 24">
      <path d="M4 6a1 1 0 0 1 1-1h14a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1h-5.2M4 6v10a1 1 0 0 0 1 1h5.2M7 8.5h1M10 8.5h1M13 8.5h1M16 8.5h1M7 12h1M10 12h1M13 12h4M12 15v6m-2.3-2.3L12 21l2.3-2.3"/>
    </symbol>
    <symbol id="shift" viewBox="0 0 24 24">
      <path d="m5 11 7-7 7 7h-3.5v9h-7v-9Z"/>
    </symbol>
    <symbol id="backspace" viewBox="0 0 24 24">
      <path d="M9 6h11a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H9l-6-6Zm3 3.5 5 5m0-5-5 5"/>
    </symbol>
    <symbol id="enter" viewBox="0 0 24 24">
      <path d="M19 5v6a3 3 0 0 1-3 3H6m3-3.5L5.5 14 9 17.5"/>
    </symbol>
    <symbol id="globe" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="8.5"/><path d="M3.9 9h16.2M3.9 15h16.2M12 3.5c-2.2 2.3-3.4 5.15-3.4 8.5S9.8 18.2 12 20.5M12 3.5c2.2 2.3 3.4 5.15 3.4 8.5s-1.2 6.2-3.4 8.5"/>
    </symbol>
  </defs>
  <g transform="translate(0 0)"><use href="#clipboard"/></g>
  <g transform="translate(24 0)"><use href="#emoji"/></g>
  <g transform="translate(48 0)"><use href="#voice"/></g>
  <g transform="translate(72 0)"><use href="#editor"/></g>
  <g transform="translate(96 0)"><use href="#tone"/></g>
  <g transform="translate(120 0)"><use href="#research"/></g>
  <g transform="translate(144 0)"><use href="#input-picker"/></g>
  <g transform="translate(168 0)"><use href="#shift"/></g>
  <g transform="translate(192 0)"><use href="#backspace"/></g>
  <g transform="translate(216 0)"><use href="#enter"/></g>
  <g transform="translate(240 0)"><use href="#globe"/></g>
</svg>
