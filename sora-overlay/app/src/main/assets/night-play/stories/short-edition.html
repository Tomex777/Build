const reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const storageKey='night-play-fiction-reading-speed';
const progressKey='night-play-last-call-v2';
const flagNames=['ally','truth','mercy','seal'];
let flags={};
function saveProgress(id){try{localStorage.setItem(progressKey,JSON.stringify({scene:id,flags}))}catch{}}
function choose(dest,effects){
 if(!choicesReady)return;
 if(dest==='start')flags={};
 for(const key of flagNames)if(effects?.[key]===true)flags[key]=true;
 play(dest);
 window.scrollTo({top:0,behavior:'instant'});
}

try{const saved=localStorage.getItem(storageKey);if(['cinematic','quick','instant'].includes(saved))root.pace.value=saved}catch{}
let sceneId='start',run=0,timers=[],observers=[],steps=[],revealing=false,choicesReady=false;
const stamp=()=>performance.now();
const wait=(fn,ms)=>{const t=setTimeout(fn,Math.max(0,ms));timers.push(t)};
function clearMotion(){
 run++;revealing=false;
 for(const t of timers)clearTimeout(t);timers=[];
 for(const o of observers)o.disconnect();observers=[];
}
function settle(line){line.classList.remove('pending','go');line.classList.add('settled')}
function settleAll(){for(const line of steps)settle(line)}
function showChoices(){
 if(choicesReady)return;
 choicesReady=true;revealing=false;
 root.choices.classList.remove('pending');
 for(const b of root.choices.querySelectorAll('button'))b.disabled=false;
}
function revealAll(){
 if(!revealing)return;
 clearMotion();settleAll();showChoices()
}
function createLine(beat){
 const p=document.createElement('p');p.className='step pending';p.setAttribute('aria-label',beat.text);
 for(const part of beat.text.split(/(\s+)/)){
  if(!part)continue;
  if(/^\s+$/.test(part)){p.appendChild(document.createTextNode(part));continue}
  const span=document.createElement('span');span.className='word';
  span.textContent=part;span.setAttribute('aria-hidden','true');p.appendChild(span);
 }
 return p
}
function buildChoices(options){
 const frag=document.createDocumentFragment();
 options.filter(option=>!option[3]||flags[option[3]]).forEach(([label,dest,effects],i)=>{
  const b=document.createElement('button');b.type='button';b.className='choice';
  const num=document.createElement('span');num.className='choice-number';num.textContent=String(i+1);
  const text=document.createElement('span');text.className='choice-label';text.textContent=label;
  b.append(num,text);b.disabled=true;b.addEventListener('click',()=>choose(dest,effects));frag.appendChild(b);
 });
 root.choices.replaceChildren(frag);root.choices.classList.add('pending')
}
function scatter(line,speed){
 const spans=line.querySelectorAll('.word');
 const range=Math.min(900,Math.max(280,spans.length*8))*speed;
 const fade=900*speed;
 line.style.setProperty('--fade',Math.round(fade)+'ms');
 for(const sp of spans)sp.style.animationDelay=Math.round(Math.random()*range)+'ms';
 line.classList.remove('pending');line.classList.add('go');
 wait(()=>settle(line),range+fade+60);
 return stamp()+range+fade*.6
}
function visible(line){
 const r=line.getBoundingClientRect(),h=window.innerHeight||document.documentElement.clientHeight;
 return r.top<h*.94&&r.bottom>0
}
function whenVisible(line,current){
 return new Promise(resolve=>{
  if(current!==run||visible(line)||!('IntersectionObserver' in window)){resolve();return}
  const io=new IntersectionObserver(entries=>{
   if(current!==run||entries.some(e=>e.isIntersecting)){io.disconnect();resolve()}
  },{rootMargin:'0px 0px -6% 0px'});
  io.observe(line);observers.push(io)
 });
}
function play(id){
 if(!Object.prototype.hasOwnProperty.call(scenes,id))return;
 clearMotion();sceneId=id;choicesReady=false;
 const scene=scenes[id];
 saveProgress(id);
 document.title='The Last Call · NIGHT Play';
 steps=scene.beats.map(createLine);
 root.story.replaceChildren(...steps);
 buildChoices(scene.options);
 root.menu.open=false;
 root.restart.hidden=id==='start'||(scene.options.length===1&&scene.options[0][1]==='start');
 if(reduced||root.pace.value==='instant'){settleAll();showChoices();return}
 revealing=true;
 const current=run;
 const speed=root.pace.value==='quick'?.48:1;
 let idx=0,readable=stamp();
 function next(){
  if(current!==run)return;
  if(idx===steps.length){
   wait(()=>{if(current===run)showChoices()},Math.max(0,readable-stamp()));
   return
  }
  const line=steps[idx++];
  whenVisible(line,current).then(()=>{
   if(current!==run)return;
   readable=Math.max(readable,scatter(line,speed));
   next();
  });
 }
 next()
}
root.story.addEventListener('pointerup',()=>{if(revealing)revealAll()});
document.addEventListener('keydown',event=>{
 if(!revealing||event.repeat||event.altKey||event.ctrlKey||event.metaKey)return;
 if((event.key===' '||event.key==='Enter')&&!['BUTTON','INPUT','SELECT','TEXTAREA'].includes(document.activeElement?.tagName||'')){
  event.preventDefault();revealAll()
 }
});
root.pace.addEventListener('change',()=>{
 try{localStorage.setItem(storageKey,root.pace.value)}catch{}
 play(sceneId)
});
root.restart.addEventListener('click',()=>{flags={};play('start');window.scrollTo({top:0,behavior:'instant'})});
document.addEventListener('pointerdown',event=>{if(root.menu.open&&!root.menu.contains(event.target))root.menu.open=false});
let resume='start';
try{
 const saved=JSON.parse(localStorage.getItem(progressKey)||'null');
 if(saved&&Object.prototype.hasOwnProperty.call(scenes,saved.scene)){
  resume=saved.scene;
  for(const key of flagNames)if(saved.flags?.[key]===true)flags[key]=true;
 }
}catch{}
play(resume)
})();
</script>
