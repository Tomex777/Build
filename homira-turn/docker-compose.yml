services:
  coturn:
    image: coturn/coturn:4.18.0
    restart: unless-stopped
    network_mode: host
    command:
      - --fingerprint
      - --use-auth-secret
      - --static-auth-secret=${TURN_SHARED_SECRET}
      - --realm=${TURN_REALM}
      - --server-name=${TURN_REALM}
      - --external-ip=${TURN_EXTERNAL_IP}
      - --listening-port=3478
      - --min-port=49160
      - --max-port=49200
      - --no-cli
      - --no-multicast-peers
      - --stale-nonce=600
      - --no-tls
      - --no-dtls
      - --log-file=stdout
      - --simple-log
