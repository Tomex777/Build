<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="120" y1="60" x2="900" y2="970" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2D3ACB"/>
      <stop offset=".50" stop-color="#171E73"/>
      <stop offset="1" stop-color="#090E35"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
      gradientTransform="translate(512 500) rotate(90) scale(390)">
      <stop stop-color="#7E86FF" stop-opacity=".24"/>
      <stop offset="1" stop-color="#7E86FF" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="iconClip"><rect width="1024" height="1024" rx="216"/></clipPath>

    <!-- Exact S-shaped mask: black keys are visible only inside the white keyboard body. -->
    <mask id="sBodyMask" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <rect width="1024" height="1024" fill="black"/>
      <path
        d="M718 250
           C648 183 533 161 426 192
           C325 221 271 290 288 363
           C307 443 391 471 519 499
           C664 531 755 570 752 657
           C749 746 667 803 561 815
           C454 827 359 788 299 720"
        fill="none"
        stroke="white"
        stroke-width="190"
        stroke-linecap="round"
        stroke-linejoin="round"/>
    </mask>
  </defs>

  <g clip-path="url(#iconClip)">
    <rect width="1024" height="1024" fill="url(#bg)"/>
    <circle cx="512" cy="500" r="390" fill="url(#glow)"/>

    <!-- White S = the white-key keyboard bed. -->
    <path
      d="M718 250
         C648 183 533 161 426 192
         C325 221 271 290 288 363
         C307 443 391 471 519 499
         C664 531 755 570 752 657
         C749 746 667 803 561 815
         C454 827 359 788 299 720"
      fill="none"
      stroke="#FAFBFF"
      stroke-width="190"
      stroke-linecap="round"
      stroke-linejoin="round"/>

    <!--
      Natural black-key rhythm around the S:
      2 keys / gap / 3 keys / gap / 2 keys / gap / 3 keys / gap / 2+3.
      Keys are straight rectangles. They extend across the edge, then sBodyMask
      clips them so every visible key begins exactly at the S boundary.
    -->
    <g fill="#09102F" mask="url(#sBodyMask)">
      <!-- GROUP 2: top -->
      <rect x="556" y="126" width="42" height="132" rx="7" transform="rotate(3 577 188)"/>
      <rect x="474" y="124" width="42" height="132" rx="7" transform="rotate(-4 495 186)"/>

      <!-- GROUP 3: upper-left bend -->
      <rect x="356" y="148" width="42" height="134" rx="7" transform="rotate(-25 375 209)"/>
      <rect x="282" y="198" width="42" height="134" rx="7" transform="rotate(-46 301 260)"/>
      <rect x="240" y="273" width="42" height="134" rx="7" transform="rotate(-67 259 335)"/>

      <!-- GROUP 2: middle, entering straight from upper edge -->
      <rect x="408" y="367" width="42" height="142" rx="7" transform="rotate(5 429 425)"/>
      <rect x="492" y="384" width="42" height="142" rx="7" transform="rotate(7 513 442)"/>

      <!-- GROUP 3: right bend -->
      <rect x="661" y="465" width="138" height="42" rx="7" transform="rotate(-27 720 486)"/>
      <rect x="708" y="528" width="138" height="42" rx="7" transform="rotate(-45 767 549)"/>
      <rect x="734" y="604" width="138" height="42" rx="7" transform="rotate(-67 793 625)"/>

      <!-- GROUP 2: lower edge -->
      <rect x="596" y="763" width="42" height="140" rx="7" transform="rotate(-6 617 824)"/>
      <rect x="511" y="775" width="42" height="140" rx="7" transform="rotate(2 532 836)"/>

      <!-- clear group gap -->

      <!-- GROUP 3: lower-left finish -->
      <rect x="399" y="754" width="42" height="140" rx="7" transform="rotate(12 420 815)"/>
      <rect x="322" y="718" width="42" height="140" rx="7" transform="rotate(28 343 779)"/>
      <rect x="260" y="664" width="42" height="140" rx="7" transform="rotate(45 281 725)"/>
    </g>
  </g>
</svg>