<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f8f9f6"><meta name="description" content="Five responsive action games in NIGHT Play."><title>NIGHT Play · Action Arcade</title><link rel="stylesheet" href="/game-shell.css"><link rel="stylesheet" href="/action/style.css"><script>if(new URLSearchParams(location.search).get('game')==='runner')location.replace('/action/dino/');</script><script src="/action/games.js" defer></script></head>
<body>
<svg class="night-svg-defs" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><symbol id="night-mark" viewBox="0 0 108 108"><path fill="#0B0F11" d="M0 0h108v108H0z"/><path fill="#F4F5F6" d="M24 54 C24 37.43 37.43 24 54 24 C70.57 24 84 37.43 84 54 L24 54 Z"/><path fill="#F4F5F6" d="M22 66h64v6H22z"/></symbol><symbol id="icon-back" viewBox="0 0 24 24"><path d="M15.5 5 8.5 12l7 7M9 12h12"/></symbol><symbol id="icon-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 0-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 0-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 0 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915"/></symbol><symbol id="icon-restart" viewBox="0 0 24 24"><path d="M20 11A8 8 0 1 1 17.9 5.6M20 3v7h-7"/></symbol><symbol id="icon-pause" viewBox="0 0 24 24"><path d="M9 5v14M15 5v14"/></symbol><symbol id="icon-play" viewBox="0 0 24 24"><path d="m8 5 11 7-11 7Z"/></symbol></svg>
<header class="night-shell-header"><a class="night-back" href="/games" aria-label="Back to games"><svg class="night-ico" aria-hidden="true"><use href="#icon-back"></use></svg><span class="night-text">Games</span></a><a class="night-brand" href="/dashboard" aria-label="NIGHT Play home"><svg class="night-brand-mark"><use href="#night-mark"></use></svg><strong>NIGHT <em>PLAY</em></strong></a><button type="button" class="night-settings" id="settingsButton" aria-label="Game settings"><svg class="night-ico" aria-hidden="true"><use href="#icon-settings"></use></svg><span class="night-text">Settings</span></button></header>
<main class="night-action-main">
<section class="night-game-intro"><span class="night-eyebrow">ACTION ARCADE</span><h1 id="title">Fruit Slice</h1><p id="subtitle">Swipe clean. Avoid the bombs.</p></section>
<div class="night-play-hud" aria-label="Game score"><div class="night-hud-value"><small id="scoreLabel">SCORE</small><strong id="score">0</strong></div><div class="night-hud-value"><small id="bestLabel">PERSONAL BEST</small><strong id="best">0</strong></div><div class="night-hud-value"><small id="statLabel">LIVES</small><strong id="stat">3</strong></div><button type="button" id="pauseButton" class="action-pause" aria-label="Pause game"><svg class="night-ico" aria-hidden="true"><use href="#icon-pause"></use></svg></button></div>
<section class="action-stage" aria-label="Game arena"><canvas id="screen" width="390" height="550" aria-label="Interactive action game area. Touch, swipe or use keyboard controls." tabindex="0"></canvas><div class="action-overlay" id="overlay" role="status"><div class="action-overlay-card"><span class="action-overlay-kicker" id="overlayTag">READY?</span><strong id="overlayTitle">Fruit Slice</strong><p id="overlayText">Swipe fruit and avoid bombs.</p><button id="overlayStart" type="button">Start game</button></div></div><div class="action-touch" id="touchControls" aria-label="Game controls" hidden></div></section>
<div class="night-action-row action-actions"><button class="primary" type="button" id="restart"><svg class="night-ico" aria-hidden="true"><use href="#icon-restart"></use></svg> New game</button></div>
<p id="message" class="action-message" aria-live="polite"></p>
</main>
<dialog class="night-sheet" id="settingsDialog" aria-labelledby="settingsHeading"><div class="night-sheet-head"><h2 id="settingsHeading">Game settings</h2><button class="night-sheet-close" type="button" id="settingsClose" aria-label="Close settings"><svg class="night-ico" aria-hidden="true"><path d="M6 6 18 18M18 6 6 18"/></svg></button></div><div class="night-sheet-body"><span class="night-sheet-label">AUDIO</span><button type="button" id="soundToggle" class="action-setting-option" aria-pressed="true">Sound effects · On</button><span class="night-sheet-label">GAMEPLAY</span><button type="button" id="touchToggle" class="action-setting-option" aria-pressed="true">On-screen controls · On</button><button type="button" id="motionToggle" class="action-setting-option" aria-pressed="false">Reduced effects · Off</button><span class="night-sheet-label">HOW TO PLAY</span><p id="rules" class="night-sheet-rule"></p></div></dialog></body></html>
