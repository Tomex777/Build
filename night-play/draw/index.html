<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f8f9f6"><title>Draw & Guess · NIGHT Play</title><link rel="stylesheet" href="/game-shell.css"><link rel="stylesheet" href="/draw/style.css"><script src="/draw/game.js" defer></script></head><body>
<svg class="night-svg-defs" aria-hidden="true"><symbol id="night-mark" viewBox="0 0 108 108"><path fill="#0b0f11" d="M0 0h108v108H0z"/><path fill="#f4f5f6" d="M24 54a30 30 0 0 1 60 0H24M22 66h64v6H22z"/></symbol><symbol id="icon-back" viewBox="0 0 24 24"><path d="m15 5-7 7 7 7M9 12h12"/></symbol></svg>
<header class="night-shell-header"><a class="night-back" href="/games" aria-label="Back to NIGHT Play games"><svg class="night-ico"><use href="#icon-back"/></svg><span class="night-text">Games</span></a><a class="night-brand" href="/dashboard" aria-label="NIGHT Play home"><svg class="night-brand-mark"><use href="#night-mark"/></svg><strong>NIGHT <em>PLAY</em></strong></a></header>
<main><div class="night-game-intro"><span class="night-eyebrow">ONLINE PARTY GAME</span><h1>Draw &amp; Guess</h1><p>One artist. Everyone else guesses on their own phone.</p></div><section id="lobby" aria-live="polite"><p>Checking connection…</p></section>
<section id="game" hidden><div class="draw-hud"><strong id="word"></strong><span id="round"></span><time id="clock"></time></div><canvas id="canvas" width="800" height="600" aria-label="Shared drawing canvas. The current artist draws with a finger or mouse."></canvas><div id="tools" hidden aria-label="Drawing tools"><div class="inks" role="group" aria-label="Ink colour"></div><button id="clear" type="button">Clear</button></div><form id="guessForm" hidden><label class="sr-only" for="guess">Your guess</label><input id="guess" maxlength="24" autocomplete="off" placeholder="What is the artist drawing?" required><button type="submit">Guess</button></form><p id="roundStatus" role="status"></p><button id="next" type="button" hidden>Next artist</button><ol id="log" aria-label="Recent guesses" aria-live="polite"></ol></section>
<div id="players" aria-label="Players and scores"></div><p id="error" role="status" aria-live="polite"></p></main></body></html>
