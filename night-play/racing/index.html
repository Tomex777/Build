<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f8f9f6"><title>Racing · NIGHT Play</title><link rel="stylesheet" href="/game-shell.css"><link rel="stylesheet" href="/racing/style.css"><script src="/racing/game.js" defer></script></head><body>
<svg class="night-svg-defs" aria-hidden="true"><symbol id="night-mark" viewBox="0 0 108 108"><path fill="#0b0f11" d="M0 0h108v108H0z"/><path fill="#f4f5f6" d="M24 54a30 30 0 0 1 60 0H24M22 66h64v6H22z"/></symbol><symbol id="back" viewBox="0 0 24 24"><path d="m15 5-7 7 7 7M9 12h12"/></symbol><symbol id="pause-icon" viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></symbol></svg>
<header class="night-shell-header"><a class="night-back" href="/games" aria-label="Back to NIGHT Play games"><svg class="night-ico"><use href="#back"/></svg><span class="night-text">Games</span></a><a class="night-brand" href="/dashboard" aria-label="NIGHT Play home"><svg class="night-brand-mark"><use href="#night-mark"/></svg><strong>NIGHT <em>PLAY</em></strong></a><button class="night-settings" id="pause" type="button" aria-label="Pause race" disabled><svg class="night-ico"><use href="#pause-icon"/></svg><span class="night-text" id="pauseLabel">Pause</span></button></header>
<main><div class="race-heading"><h1>Racing</h1><p>Coastal sprint · 2.5 km</p></div><div class="race-hud" aria-label="Race progress"><div><small>POSITION</small><strong id="position">4 / 4</strong></div><div><small>DISTANCE</small><strong id="distance">0 m</strong></div><div><small>SPEED</small><strong id="speed">0</strong></div></div>
<div class="track"><canvas id="track" width="420" height="640" tabindex="0" aria-label="Racing track. Drag to steer, or use the left and right arrow keys. Hold Space to brake."></canvas><section class="race-cover" id="cover" aria-labelledby="coverTitle"><span id="coverTag">COASTAL SPRINT</span><h2 id="coverTitle">Take the lead.</h2><p id="coverCopy">Pass three rivals and reach the finish first. Drag to steer. Stay on the road; three collisions end your race.</p><button type="button" id="start">Start race</button></section></div>
<div class="race-controls"><p id="status" role="status" aria-live="polite">Drag to steer · Arrow keys on keyboard</p><button type="button" id="brake" aria-label="Hold to brake" disabled>Brake</button></div></main></body></html>
