<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f8f9f6"><title>NIGHT Play · Arcade</title><link rel="stylesheet" href="/arcade/style.css"><link rel="stylesheet" href="/game-shell.css"></head>
<body><svg class="night-svg-defs" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><symbol id="night-mark" viewBox="0 0 108 108"><path fill="#0B0F11" d="M0 0h108v108H0z"/><path fill="#F4F5F6" d="M24 54 C24 37.43 37.43 24 54 24 C70.57 24 84 37.43 84 54 L24 54 Z"/><path fill="#F4F5F6" d="M22 66h64v6H22z"/></symbol><symbol id="icon-back" viewBox="0 0 24 24"><path d="M15.5 5 8.5 12l7 7M9 12h12"/></symbol><symbol id="icon-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915"/></symbol><symbol id="icon-restart" viewBox="0 0 24 24"><path d="M20 11A8 8 0 1 1 17.9 5.6M20 3v7h-7"/></symbol></svg>
<header class="night-shell-header"><a class="night-back" href="/games" aria-label="Back to NIGHT Play games"><svg class="night-ico"><use href="#icon-back"></use></svg><span class="night-text">Games</span></a><a class="night-brand" href="/dashboard" aria-label="NIGHT Play home"><svg class="night-brand-mark"><use href="#night-mark"></use></svg><strong>NIGHT <em>PLAY</em></strong></a><button type="button" class="night-settings" id="settingsButton" aria-label="Arcade game settings"><svg class="night-ico"><use href="#icon-settings"></use></svg><span class="night-text">Settings</span></button></header>
<main><section class="night-game-intro" aria-label="Current arcade game"><span class="night-eyebrow" id="type">NIGHT ARCADE</span><h1 id="title">Wing Hop</h1><p id="subtitle">Tap to fly, glide through the gaps.</p></section>
<div class="night-play-hud" aria-label="Your game scores"><div class="night-hud-value"><small>SCORE</small><strong id="score">0</strong></div><div class="night-hud-value"><small>PERSONAL BEST</small><strong id="best">0</strong></div><button type="button" id="blockPause" class="block-pause" aria-label="Pause or resume Block Drop" hidden>Ⅱ</button><button type="button" id="wingSkin" class="wing-skin-button" aria-label="Switch bird artwork" hidden>CHANGE BIRD</button></div>
<section class="layout"><div class="play"><div class="canvas-shell" id="canvasShell"><canvas id="screen" width="360" height="600" aria-label="Game board. Use touchscreen or the controls below."></canvas><div id="mineboard" hidden></div></div>
<div class="touchbar" id="touchbar" aria-label="Game touch controls"></div>
<div class="night-action-row"><button class="primary" type="button" id="restart"><svg class="night-ico"><use href="#icon-restart"></use></svg> New game</button></div>
<p id="message" role="status" aria-live="polite"></p><div id="extra" class="arcade-extras"></div>
</div></section></main>
<dialog class="night-sheet" id="settingsDialog" aria-labelledby="settingsHeading"><div class="night-sheet-head"><h2 id="settingsHeading">Game settings</h2><button type="button" class="night-sheet-close" id="settingsClose" aria-label="Close settings"><svg class="night-ico" width="19" height="19" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
<div class="night-sheet-body"><span class="night-sheet-label">SWITCH GAME</span>
<nav id="picks" class="night-sheet-switcher" aria-label="Pick an arcade game"><button data-game="bird" type="button">Wing Hop</button><button data-game="blocks" type="button">Block Drop</button><button data-game="mines" type="button">Minesweeper</button><button data-game="maze" type="button">Maze Chase</button></nav>
<span class="night-sheet-label">HOW TO PLAY</span><p id="rules" class="night-sheet-rule"></p>
<p class="night-sheet-note">Arcade games are solo. Best scores remain on your phone; online leaderboards are not enabled.</p></div></dialog>

<script src="/arcade/games.js" defer></script></body></html>
