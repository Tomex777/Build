name: NIGHT Browser Agent 6 - Library CI

on:
  push:
    branches: [agent/browser-06-library]
    paths:
      - 'night-browser/**'
      - '.github/workflows/night-browser-agent06-ci.yml'
  pull_request:
    branches: [feature/night-browser-multi-agent-20261020]
    paths:
      - 'night-browser/**'
      - '.github/workflows/night-browser-agent06-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  library-compile-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-37.1 build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'
      - name: Compile and test NIGHT Browser (Agent 6)
        run: gradle --no-daemon --stacktrace -p night-browser :app:testDebugUnitTest :app:assembleDebug
      - name: Store APK for device QA
        uses: actions/upload-artifact@v4
        with:
          name: night-browser-agent-06-debug-apks
          path: night-browser/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
