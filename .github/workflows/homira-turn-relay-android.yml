name: Homira TURN Relay Android

on:
  workflow_dispatch:
  push:
    branches: [homira-call-ci]
    paths:
      - 'homira-android/**'
      - 'homira-supabase/functions/turn-credentials/**'
      - '.github/workflows/homira-turn-relay-android.yml'

concurrency:
  group: homira-turn-relay-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build relay-only debug APK
        working-directory: homira-android
        run: gradle :app:assembleDebug -PHOMIRA_FORCE_TURN_RELAY=true --stacktrace

      - name: Upload relay-only APK
        uses: actions/upload-artifact@v4
        with:
          name: homira-turn-relay-debug
          path: homira-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
