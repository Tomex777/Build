name: Night Extensions Regression

on:
  push:
    branches:
      - night-groq-key-pool-ci
    paths:
      - "whatsapp-ai-android/night-extension-sdk/**"
      - "whatsapp-ai-android/extensions/**"
      - "whatsapp-ai-android/settings.gradle.kts"
      - "whatsapp-ai-android/build.gradle.kts"
      - "whatsapp-ai-android/gradle/libs.versions.toml"
      - ".github/workflows/night-extension-regression.yml"
  workflow_dispatch:

concurrency:
  group: night-extensions-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  animepahe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android 36 SDK
        run: |
          SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/16.0/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Guard extensions from launcher
        run: |
          if grep -R -n -E 'android.intent.action.MAIN|android.intent.category.LAUNCHER' whatsapp-ai-android/extensions/*/src/main/AndroidManifest.xml; then
            echo "Night extensions must not expose launcher activities."
            exit 1
          fi

      - name: Guard Night-owned media responsibilities
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path("whatsapp-ai-android/extensions/animepahe")
          service = (root / "src/main/java/com/night/extensions/animepahe/AnimePaheNightExtensionService.kt").read_text()
          client = (root / "src/main/java/com/night/extensions/animepahe/AnimePaheClient.kt").read_text()

          assert "TYPE_DOWNLOAD" not in service, "AnimePahe must not own a download-status message type"
          assert 'id = "parallel_downloads"' not in service, "Download concurrency belongs to Night core"
          assert "parallelDownloads" not in client, "AnimePahe session must not own Night download concurrency"
          assert not (root / "src/main/java/com/night/extensions/animepahe/AnimePaheHlsPlaylist.kt").exists(), "HLS segment parsing belongs to Night core"
          assert "NightExtensionStandardActions" in service and ".DOWNLOAD_MEDIA" in service, "Resolved source must hand download action to Night"
          assert "NightExtensionStandardActions" in service and ".REFRESH_MEDIA" in service, "AnimePahe must refresh expired provider URLs for Night"
          assert "downloadPageUrl" not in client, "AnimePahe must not carry a private download-page path"
          assert '.put("mediaUrl", resolved.url)' in service, "Resolved payload must expose the media URL"
          assert '.put("headers", headers)' in service, "Resolved payload must expose provider headers"
          PY

      - name: Test SDK and AnimePahe extension
        run: |
          cd whatsapp-ai-android
          chmod +x gradlew
          ./gradlew \
            :night-extension-sdk:assembleDebug \
            :extensions:animepahe:testDebugUnitTest \
            :extensions:animepahe:assembleDebug \
            --stacktrace

      - name: Upload AnimePahe extension APK
        uses: actions/upload-artifact@v4
        with:
          name: night-animepahe-extension-apk
          path: whatsapp-ai-android/extensions/animepahe/build/outputs/apk/debug/animepahe-debug.apk
          if-no-files-found: error

      - name: Upload AnimePahe unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: night-animepahe-test-reports
          path: |
            whatsapp-ai-android/extensions/animepahe/build/reports/tests/testDebugUnitTest/
            whatsapp-ai-android/extensions/animepahe/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore
