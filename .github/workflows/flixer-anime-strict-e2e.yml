name: Flixer anime strict E2E

on:
  push:
    branches: [anime-e2e-continuation-20260930]
    paths:
      - '.github/workflows/flixer-anime-strict-e2e.yml'

permissions:
  contents: read

jobs:
  strict:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null
          mkdir -p proof
      - name: Drive real Flixer watch route
        shell: bash
        run: |
          cat > flixer.mjs <<'NODE'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/153.0.0.0 Safari/537.36';
          const browser=await chromium.launch({headless:true,args:['--autoplay-policy=no-user-gesture-required','--disable-blink-features=AutomationControlled']});
          const ctx=await browser.newContext({userAgent:UA,ignoreHTTPSErrors:true,viewport:{width:1365,height:900}});
          const page=await ctx.newPage();
          const out={site:'https://flixer.su',query:'One Piece',api:[],media:[],actions:[],proofs:[]};

          page.on('response',async r=>{
            try{
              const h=await r.allHeaders(),ct=h['content-type']||'',u=r.url();
              if(/plsdontscrapemelove|\/api\//i.test(u)){
                out.api.push({url:u,status:r.status(),contentType:ct,requestHeaders:await r.request().allHeaders()});
              }
              if(/\.(?:m3u8|mpd|mp4|m4s|ts)(?:$|\?)/i.test(u)||/mpegurl|dash\+xml|^video\//i.test(ct)){
                out.media.push({url:u,status:r.status(),contentType:ct,requestHeaders:await r.request().allHeaders()});
              }
            }catch{}
          });

          async function prove(m){
            const h={...m.requestHeaders,'User-Agent':UA};
            for(const k of Object.keys(h))if(k.startsWith(':')||['host','content-length','accept-encoding','connection'].includes(k.toLowerCase()))delete h[k];
            try{
              const r=await ctx.request.get(m.url,{headers:h,timeout:25000,failOnStatusCode:false});
              const b=await r.body(),ct=r.headers()['content-type']||'';
              if(/\.m3u8(?:$|\?)/i.test(m.url)||/mpegurl/i.test(ct)){
                const s=b.toString('utf8');
                if(!s.trimStart().startsWith('#EXTM3U'))return {kind:'hls',status:r.status(),pass:false};
                const ls=s.split(/\r?\n/).map(x=>x.trim()).filter(x=>x&&!x.startsWith('#'));
                if(!ls.length)return {kind:'hls',status:r.status(),pass:false};
                let child=new URL(ls[0],m.url).href;
                let cr=await ctx.request.get(child,{headers:h,timeout:25000,failOnStatusCode:false});
                let cb=await cr.body(),cct=cr.headers()['content-type']||'';
                if((/\.m3u8(?:$|\?)/i.test(child)||/mpegurl/i.test(cct))&&cb.toString('utf8').trimStart().startsWith('#EXTM3U')){
                  const parts=cb.toString('utf8').split(/\r?\n/).map(x=>x.trim()).filter(x=>x&&!x.startsWith('#'));
                  if(parts.length){
                    child=new URL(parts[0],child).href;
                    cr=await ctx.request.get(child,{headers:{...h,Range:'bytes=0-131071'},timeout:25000,failOnStatusCode:false});
                    cb=await cr.body();
                  }
                }
                return {kind:'hls',masterStatus:r.status(),childStatus:cr.status(),childBytes:cb.length,pass:[200,206].includes(cr.status())&&cb.length>2048};
              }
              return {kind:'direct',status:r.status(),bytes:b.length,contentType:ct,pass:[200,206].includes(r.status())&&b.length>2048};
            }catch(e){return {pass:false,error:String(e)}}
          }

          try{
            const sr=await page.goto('https://flixer.su/search?q=One%20Piece',{waitUntil:'domcontentloaded',timeout:55000});
            await page.waitForTimeout(5000);
            out.searchStatus=sr?.status()??null;
            out.searchTitle=await page.title();
            out.cards=await page.locator('a[href]').evaluateAll(xs=>xs.map(a=>({
              text:(a.innerText||a.textContent||'').replace(/\s+/g,' ').trim(),
              href:a.href
            })).filter(x=>/one piece/i.test(x.text+' '+x.href)).slice(0,30));
            const watch=out.cards.find(x=>/\/watch\//i.test(x.href))||out.cards[0];
            out.selected=watch||null;
            if(!watch?.href)throw new Error('No One Piece watch href');
            const wr=await page.goto(watch.href,{waitUntil:'domcontentloaded',timeout:55000});
            await page.waitForTimeout(7000);
            out.watchStatus=wr?.status()??null;
            out.watchUrl=page.url();

            for(const rx of [/play/i,/watch/i,/episode\s*1/i,/^1$/]){
              const el=page.getByText(rx).first();
              if(await el.count())try{await el.click({timeout:1600});out.actions.push(String(rx));await page.waitForTimeout(2500)}catch{}
            }
            for(let round=0;round<7;round++){
              for(const f of page.frames()){
                try{
                  const v=f.locator('video').first();
                  if(await v.count())await v.evaluate(el=>{el.muted=true;el.volume=0;el.play().catch(()=>{});});
                  const b=f.locator('button[aria-label*="play" i],button[title*="play" i],.vjs-big-play-button,.jw-icon-playback,[class*="play" i]').first();
                  if(await b.count())try{await b.click({timeout:800})}catch{}
                }catch{}
              }
              await page.waitForTimeout(1800);
            }

            let max=0,dur=0,ready=false;
            for(const f of page.frames()){
              try{
                const vs=await f.locator('video').evaluateAll(xs=>xs.map(v=>({t:v.currentTime,d:Number.isFinite(v.duration)?v.duration:0,r:v.readyState,w:v.videoWidth,h:v.videoHeight})));
                for(const v of vs){max=Math.max(max,v.t||0);dur=Math.max(dur,v.d||0);if(v.r>=2&&v.w>0&&v.h>0)ready=true}
              }catch{}
            }
            out.player={maxCurrentTime:max,maxDuration:dur,ready,advanced:max>=1,frameCount:page.frames().length};
            out.media=[...new Map(out.media.map(x=>[x.url,x])).values()];
            out.api=[...new Map(out.api.map(x=>[x.url,x])).values()];
            for(const m of out.media.filter(x=>[200,206].includes(x.status)).slice(0,20)){
              const p=await prove(m);out.proofs.push({url:m.url,proof:p});if(p.pass)break;
            }
            out.pass=Boolean(out.player.advanced||out.proofs.some(x=>x.proof?.pass));
            out.verdict=out.pass?'STRICT_PASS':out.media.length?'MEDIA_NOT_PROVEN':out.api.length?'API_ACTIVE_NO_MEDIA':'NO_PLAYER_PATH';
          }catch(e){out.error=String(e);out.pass=false;out.verdict='ERROR'}

          fs.writeFileSync('proof/result.json',JSON.stringify(out,null,2));
          console.log(JSON.stringify({
            searchStatus:out.searchStatus,cardCount:out.cards?.length||0,selected:out.selected,
            watchStatus:out.watchStatus,watchUrl:out.watchUrl,apiCount:out.api.length,mediaCount:out.media.length,
            player:out.player,winningProof:out.proofs.find(x=>x.proof?.pass)||null,
            pass:out.pass,verdict:out.verdict,error:out.error||null
          },null,2));
          await browser.close();
          NODE
          node flixer.mjs
      - name: Upload proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flixer-anime-strict-e2e
          path: proof/result.json
          if-no-files-found: error
