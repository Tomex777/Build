name: Lyra Standalone Android CI

on:
  workflow_dispatch:
  push:
    branches: [spotui-standalone-ci]
    paths:
      - 'spotui-overlay/**'
      - 'spotui-ci/**'
      - 'sora-overlay/youtube-music-extension/**'
      - 'sora-ci/import_spotui_innertube.sh'
      - '.github/workflows/spotui-standalone-ci.yml'

concurrency:
  group: spotui-standalone-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: Checkout pinned shared YouTube engine
        uses: actions/checkout@v4
        with:
          repository: Tomex777/Build
          ref: 7054b555fc107df98189df1127bdbd7f230fcf26
          path: _shared-youtube-engine

      - name: Import pinned SpotUI Innertube
        run: bash sora-ci/import_spotui_innertube.sh

      - name: Reconstruct Android build root
        run: |
          set -euo pipefail
          rm -rf /tmp/spotui-src /tmp/sora.zip /tmp/spotui-artifacts
          cat sora-ci/chunks/part-*.txt | base64 -d > /tmp/sora.zip
          unzip -q /tmp/sora.zip -d /tmp/spotui-src
          ROOT=/tmp/spotui-src/Sora_Android_v0_1
          test -f "$ROOT/settings.gradle.kts"

          cp -R sora-overlay/. "$ROOT/"
          cp -R spotui-overlay/. "$ROOT/"

          python3 - "$ROOT/settings.gradle.kts" <<'PY'
          from pathlib import Path
          import os, sys
          p = Path(sys.argv[1])
          text = p.read_text()
          additions = [
              'include(":youtube-innertube")',
              'include(":spotui-source-api")',
              'include(":spotui-app")',
              'include(":spotui-youtube-music-extension")',
          ]
          for line in additions:
              if line not in text:
                  text += "\n" + line + "\n"
          p.write_text(text)
          PY

          echo "SPOTUI_ROOT=$ROOT" >> "$GITHUB_ENV"
          mkdir -p /tmp/spotui-artifacts

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android 36 SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'

      - name: Build and stage pinned reusable Shared YouTube Engine AARs
        run: |
          set -euo pipefail
          ENGINE_ROOT="$GITHUB_WORKSPACE/_shared-youtube-engine/youtube-engine"
          gradle --no-daemon -p "$ENGINE_ROOT" \
            :youtube-engine-api:assembleRelease \
            :youtube-engine-core:assembleRelease
          LIBS="$SPOTUI_ROOT/spotui-youtube-music-extension/libs"
          mkdir -p "$LIBS"
          cp "$ENGINE_ROOT/youtube-engine-api/build/outputs/aar/youtube-engine-api-release.aar" \
            "$LIBS/youtube-engine-api-release.aar"
          cp "$ENGINE_ROOT/youtube-engine-core/build/outputs/aar/youtube-engine-core-release.aar" \
            "$LIBS/youtube-engine-core-release.aar"
          ls -lh "$LIBS"/youtube-engine-*-release.aar

      - name: Build core, reusable-engine consumer and host proof
        working-directory: ${{ env.SPOTUI_ROOT }}
        run: >
          gradle --stacktrace
          :spotui-app:assembleDebug
          :spotui-youtube-music-extension:assembleDebug
          :spotui-youtube-music-extension:assembleDebugAndroidTest

      - name: Prove source isolation
        working-directory: ${{ env.SPOTUI_ROOT }}
        run: |
          set -euo pipefail
          CORE_DEPS="$(gradle -q :spotui-app:dependencies --configuration debugRuntimeClasspath)"
          EXT_DEPS="$(gradle -q :spotui-youtube-music-extension:dependencies --configuration debugRuntimeClasspath)"
          if grep -q 'project :youtube-innertube' <<<"$CORE_DEPS"; then
            echo "SpotUI core still depends on youtube-innertube" >&2
            exit 1
          fi
          grep -q 'project :spotui-source-api' <<<"$CORE_DEPS"
          grep -q 'project :youtube-innertube' <<<"$EXT_DEPS"
          EXT_BUILD="$SPOTUI_ROOT/spotui-youtube-music-extension/build.gradle.kts"
          grep -q 'libs/youtube-engine-core-release.aar' "$EXT_BUILD"
          grep -q 'libs/youtube-engine-api-release.aar' "$EXT_BUILD"
          test -s "$SPOTUI_ROOT/spotui-youtube-music-extension/libs/youtube-engine-core-release.aar"
          test -s "$SPOTUI_ROOT/spotui-youtube-music-extension/libs/youtube-engine-api-release.aar"
          if grep -q 'project :youtube-engine-core' <<<"$EXT_DEPS"; then
            echo "Lyra extension compiled against engine source instead of reusable AARs" >&2
            exit 1
          fi
          grep -q 'project :spotui-source-api' <<<"$EXT_DEPS"
          if grep -q 'project :youtube-engine-core' <<<"$CORE_DEPS"; then
            echo "Lyra UI core must not own YouTube extraction" >&2
            exit 1
          fi
          echo "Source isolation verified: shared engine is owned only by the YouTube source extension."

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Pass runner DNS resolvers to Android emulator
        run: |
          set -euo pipefail
          DNS_SERVERS="$(awk '$1 == "nameserver" { print $2 }' /etc/resolv.conf | sed '/^127\./d; /^::1$/d' | head -n 2 | paste -sd, -)"
          if [[ -z "$DNS_SERVERS" ]]; then DNS_SERVERS="8.8.8.8,1.1.1.1"; fi
          printf 'EMULATOR_DNS_SERVERS=%s\n' "$DNS_SERVERS" >> "$GITHUB_ENV"
          echo "Emulator DNS resolvers: $DNS_SERVERS"

      - name: Smoke test live app (challenge-aware)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -dns-server ${{ env.EMULATOR_DNS_SERVERS }}
          script: bash "$GITHUB_WORKSPACE/spotui-ci/spotui-live-smoke.sh"

      - name: Build ARM64 Galaxy A16 APK
        if: always()
        run: |
          cd "$SPOTUI_ROOT"
          gradle --no-daemon \
            :spotui-app:assembleDebug \
            :spotui-app:assembleRelease \
            :spotui-youtube-music-extension:assembleRelease \
            -PSPOTUI_ARM64_ONLY=true

      - name: Stage APK
        if: always()
        run: |
          cp "$SPOTUI_ROOT/spotui-app/build/outputs/apk/debug/spotui-app-debug.apk" /tmp/spotui-artifacts/Lyra-arm64-debug.apk || true
          find "$SPOTUI_ROOT/spotui-app/build/outputs/apk/release" -type f -name '*.apk' -exec cp {} /tmp/spotui-artifacts/Lyra-arm64-release.apk \; 2>/dev/null || true
          cp "$SPOTUI_ROOT/spotui-youtube-music-extension/build/outputs/apk/debug/spotui-youtube-music-extension-debug.apk" /tmp/spotui-artifacts/Lyra-YouTube-Music-source-debug.apk || true
          find "$SPOTUI_ROOT/spotui-youtube-music-extension/build/outputs/apk/release" -type f -name '*.apk' -exec cp {} /tmp/spotui-artifacts/Lyra-YouTube-Music-source-release.apk \; 2>/dev/null || true
          cp "$SPOTUI_ROOT/spotui-youtube-music-extension/libs/youtube-engine-api-release.aar" /tmp/spotui-artifacts/ || true
          cp "$SPOTUI_ROOT/spotui-youtube-music-extension/libs/youtube-engine-core-release.aar" /tmp/spotui-artifacts/ || true
          ls -lh /tmp/spotui-artifacts || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lyra-standalone-android
          path: /tmp/spotui-artifacts
          if-no-files-found: error
          retention-days: 14
