name: MSCC Azure

concurrency:
  group: mscc-azure
  cancel-in-progress: true

on:
  push:
    branches: [mscc-azure]
    paths:
      - 'mscc/**'
      - '.github/workflows/mscc-azure.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Install dependencies
        working-directory: mscc
        run: npm install --no-audit --no-fund
      - name: Syntax check all MSCC modules
        working-directory: mscc
        run: npm run check
      - name: Guard against fixed A/B runtime assumptions
        working-directory: mscc
        run: |
          ! grep -Fq "Destination must be A or B" index.js
          ! grep -Fq "accounts.get('B')" index.js
          ! grep -Fq "item.account === 'B'" index.js
          grep -Fq "await loadAccounts()" index.js
          grep -Fq "createAccount," index.js
          grep -Fq "perAccountCcOverride: true" index.js
          grep -Fq "writeRuntimeRegistry()" index.js

      - name: Verify dynamic account registry migration
        working-directory: mscc
        run: |
          node --input-type=module <<'NODE'
          import { AccountRegistry, legacyAccountRecords } from './account-registry.js'
          import { rm } from 'node:fs/promises'

          const root = '/tmp/mscc-account-registry-test'
          await rm(root, { recursive:true, force:true })
          const registry = new AccountRegistry({
            file: root + '/data/accounts.json',
            authRoot: root + '/auth',
            maxAccounts: 5,
            legacy: legacyAccountRecords({
              accountA:'234000000001',
              accountB:'234000000002',
              authA:root + '/legacy-a',
              authB:root + '/legacy-b',
            }),
          })
          const migrated = await registry.load()
          if (migrated.length !== 2) throw new Error('Legacy A/B migration failed')
          if (registry.get('A').authDir !== root + '/legacy-a') throw new Error('Legacy A auth path changed')
          if (registry.get('B').authDir !== root + '/legacy-b') throw new Error('Legacy B auth path changed')
          const third = await registry.create({ phoneNumber:'234000000003', displayName:'Work' })
          const fourth = await registry.create({ phoneNumber:'234000000004', displayName:'Archive' })
          if (third.id !== 'account-3' || fourth.id !== 'account-4') throw new Error('Stable generated IDs are wrong')
          const reloaded = new AccountRegistry({ file:root + '/data/accounts.json', authRoot:root + '/auth', maxAccounts:5 })
          await reloaded.load()
          if (reloaded.list().length !== 4) throw new Error('Registry persistence failed')
          if (reloaded.get('ACCOUNT-3')?.displayName !== 'Work') throw new Error('Case-insensitive ID lookup failed')
          const removed = await reloaded.remove('account-4')
          if (!removed.authPreserved) throw new Error('Remove must preserve auth by default')
          console.log('Dynamic account registry migration OK')
          NODE
      - name: Verify local pairing control stays on loopback
        working-directory: mscc
        shell: bash
        run: |
          node --input-type=module <<'NODE' >/tmp/mscc-local-control.log 2>&1 &
          import { startWebPanel } from './web-panel.js'
          const accounts = [
            { id:'A', enabled:true, connected:false, status:'offline', numberMasked:'234••••0001', indexCount:0, indexLimit:5000, pairingMode:'', pairingCode:'', pairingQr:'', pairingError:'' },
            { id:'B', enabled:true, connected:false, status:'offline', numberMasked:'234••••0002', indexCount:0, indexLimit:5000, pairingMode:'', pairingCode:'', pairingQr:'', pairingError:'' },
            { id:'work-3', enabled:true, connected:false, status:'offline', numberMasked:'234••••0003', indexCount:0, indexLimit:5000, pairingMode:'', pairingCode:'', pairingQr:'', pairingError:'' },
            { id:'archive-4', enabled:true, connected:false, status:'offline', numberMasked:'234••••0004', indexCount:0, indexLimit:5000, pairingMode:'', pairingCode:'', pairingQr:'', pairingError:'' },
          ]
          startWebPanel({
            port: 18787,
            localControlPort: 18788,
            password: 'test-password',
            sessionSecret: 'test-secret',
            getState: async () => ({ version:'test', destination:'A', settings:{}, capabilities:{addAccount:true}, entitlements:{maxAccounts:10}, accounts, system:{} }),
            createAccount: async ({ phoneNumber, displayName }) => {
              const row = { id:'account-5', enabled:true, connected:false, status:'offline', numberMasked:String(phoneNumber), displayName:String(displayName || ''), indexCount:0, indexLimit:5000, pairingMode:'', pairingCode:'', pairingQr:'', pairingError:'' }
              accounts.push(row)
              return { ok:true, account:row }
            },
            pairAccount: async (id, mode) => {
              const row = accounts.find(x => x.id === id)
              row.pairingMode = mode
              row.pairingCode = mode === 'code' ? 'ABCD-EFGH' : ''
              row.pairingQr = mode === 'qr' ? 'data:image/png;base64,AA==' : ''
              return { ok:true }
            },
            reconnectAccount: async () => ({ ok:true }),
            disconnectAccount: async id => ({ ok:true, account:id, status:'offline' }),
            removeAccount: async id => ({ ok:true, account:id, authPreserved:true }),
            repairAccount: async (id, mode) => {
              const row = accounts.find(x => x.id === id)
              row.pairingMode = mode
              return { ok:true }
            },
            setSetting: async () => {},
            setDestination: async account => account,
            reloadCommands: async () => ['autocc', 'replycc', 'reloadcommands'],
            reloadModule: async id => ({ ok:true, module:id, commands:['autocc', 'replycc', 'reloadcommands'] }),
          })
          setInterval(() => {}, 1000)
          NODE
          echo $! >/tmp/mscc-local-control.pid
          for i in {1..20}; do
            curl -fsS http://127.0.0.1:18788/state >/tmp/mscc-pair-state.json && break
            sleep .25
          done
          grep -q '"id":"work-3"' /tmp/mscc-pair-state.json
          curl -fsS -H 'Content-Type: application/json' -d '{"phoneNumber":"234000000005","displayName":"Extra"}' http://127.0.0.1:18788/accounts | grep -q '"id":"account-5"'
          curl -fsS -H 'Content-Type: application/json' -d '{"mode":"code"}' http://127.0.0.1:18788/accounts/work-3/pair
          curl -fsS http://127.0.0.1:18788/state | grep -q 'ABCD-EFGH'
          curl -fsS -H 'Content-Type: application/json' -d '{"mode":"qr"}' http://127.0.0.1:18788/accounts/archive-4/repair
          curl -fsS http://127.0.0.1:18788/state | grep -q '"pairingMode":"qr"'
          curl -fsS -H 'Content-Type: application/json' -d '{"account":"archive-4"}' http://127.0.0.1:18788/destination | grep -q '"destination":"archive-4"'
          curl -fsS -X POST http://127.0.0.1:18788/modules/mscc-core-commands/reload | grep -q '"module":"mscc-core-commands"'
          curl -fsS -X POST -H 'Content-Type: application/json' -d '{}' http://127.0.0.1:18788/accounts/work-3/disconnect | grep -q '"status":"offline"'
          curl -fsS -X DELETE http://127.0.0.1:18788/accounts/work-3 | grep -q '"authPreserved":true'
          curl -fsS -X POST http://127.0.0.1:18788/commands/reload | grep -q '"reloadcommands"'
          kill "$(cat /tmp/mscc-local-control.pid)" 2>/dev/null || true
      - name: Validate drop-in command registry
        working-directory: mscc
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { loadCommands, dispatchCommand } from './commands/registry.js'

          const registry = await loadCommands(new URL('./commands/', import.meta.url))
          const required = ['autocc', 'replycc', 'antidelete', 'status', 'ping', 'help', 'ram', 'settings', 'uptime', 'accounts', 'index', 'disk', 'version', 'destination', 'reloadcommands']
          for (const name of required) {
            if (!registry.commands.has(name)) throw new Error('Missing command: ' + name)
          }

          const settings = { autoCc: false, replyCc: true, antiDelete: true }
          const replies = []
          const ctx = {
            controller: true,
            settings,
            reply: async text => replies.push(String(text)),
            setSetting: async (key, value) => { settings[key] = value },
            setDestination: async value => { ctx.destination = value },
            reloadCommands: async () => registry.canonical.map(command => command.name),
            statusText: async ping => ping ? 'pong-status' : 'status',
            diagnostics: () => ({
              version: '1.8.0',
              destination: 'A',
              indexLimit: 5000,
              retentionHours: 24,
              waVersion: '2.3000.0',
              accounts: [
                { id: 'A', enabled: true, connected: true, status: 'connected', numberMasked: '234••••0001', indexCount: 12 },
                { id: 'B', enabled: true, connected: false, status: 'offline', numberMasked: '234••••0002', indexCount: 4 },
              ],
            }),
          }

          if (!(await dispatchCommand(registry, '.autocc on', ctx))) throw new Error('autocc not dispatched')
          if (!settings.autoCc) throw new Error('autocc did not toggle')
          if (!(await dispatchCommand(registry, '.ram', ctx))) throw new Error('ram not dispatched')
          if (!(await dispatchCommand(registry, '.help', ctx))) throw new Error('help not dispatched')
          if (!(await dispatchCommand(registry, '.accounts', ctx))) throw new Error('accounts not dispatched')
          if (!(await dispatchCommand(registry, '.index', ctx))) throw new Error('index not dispatched')
          if (!(await dispatchCommand(registry, '.version', ctx))) throw new Error('version not dispatched')
          if (!(await dispatchCommand(registry, '.disk', ctx))) throw new Error('disk not dispatched')
          if (!(await dispatchCommand(registry, '.destination B', ctx))) throw new Error('destination not dispatched')
          if (!(await dispatchCommand(registry, '.reloadcommands', ctx))) throw new Error('reloadcommands not dispatched')
          if (!replies.some(x => x.includes('.autocc'))) throw new Error('help did not list commands')
          const toggles = registry.canonical.filter(c => c.setting?.key)
          const toggleKeys = toggles.map(c => c.setting.key).sort()
          if (toggleKeys.join(',') !== 'antiDelete,autoCc,replyCc') throw new Error('Unexpected Cortex toggle schema: ' + toggleKeys.join(','))
          const toggleDefaults = Object.fromEntries(toggles.map(c => [c.setting.key, c.setting.default === true]))
          if (toggleDefaults.autoCc !== false || toggleDefaults.replyCc !== true || toggleDefaults.antiDelete !== true) {
            throw new Error('Unexpected command setting defaults: ' + JSON.stringify(toggleDefaults))
          }

          const denied = await dispatchCommand(registry, '.status', { ...ctx, controller: false })
          if (denied) throw new Error('owner-only command executed for non-controller')
          console.log('MSCC command registry OK:', registry.canonical.map(c => c.name).sort().join(', '))
          NODE
