name: MSCC Azure

on:
  push:
    branches: [mscc-azure]
    paths:
      - 'mscc/**'
      - '.github/workflows/mscc-azure.yml'
  pull_request:
    branches: [mscc-azure]
    paths:
      - 'mscc/**'
      - '.github/workflows/mscc-azure.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mscc-azure-${{ github.ref }}
  # Never interrupt a VM installation halfway through because another push arrived.
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Install MSCC dependencies
        working-directory: mscc
        run: npm install --no-audit --no-fund
      - name: Check complete runtime and command regression suite
        working-directory: mscc
        run: npm run check
      - name: Verify account registry, lifecycle, identity and routing
        working-directory: mscc
        run: |
          npm run check:sessions
          npm run check:inbound
          npm run check:routing
          npm run check:account-controls
          node session-diagnostics-selftest.js
      - name: Verify shared utilities and source selection
        working-directory: mscc
        run: |
          npm run check:utils
          npm run check:sources
          npm run check:series-flow
      - name: Verify independent pairing and lyrics regressions
        working-directory: mscc
        run: |
          node music-flow-selftest.js
          node account-controls-selftest.js
          node panel-login-throttle-selftest.js
      - name: Validate Azure installer and source helper scripts
        working-directory: mscc
        shell: bash
        run: |
          set -euo pipefail
          bash -n install-azure.sh tools/install-flaresolverr-tor.sh tools/test-animepahe-azure.sh
          bash -n tools/deploy-azure-ssh.sh tools/deploy-azure-ssh-selftest.sh
          bash tools/deploy-azure-ssh-selftest.sh
          bash -n tools/mscc-github-deploy-wrapper.sh tools/mscc-github-deploy-wrapper-selftest.sh tools/azure-main-ssh-monitor.sh tools/azure-main-ssh-monitor-selftest.sh
          bash tools/azure-main-ssh-monitor-selftest.sh
          bash tools/azure-singleton-flock-selftest.sh
          bash tools/mscc-github-deploy-wrapper-selftest.sh
          node --check tools/azure-youtube-diagnostics.mjs
          node tools/azure-youtube-diagnostics-selftest.mjs
          node --check tools/azure-main-diagnostics.mjs
          node --check tools/azure-main-diagnostics-selftest.mjs
          node tools/azure-main-diagnostics-selftest.mjs
          grep -Fq 'mscc-github-deploy-wrapper.sh' install-azure.sh
          bash -n tools/azure-release-switch-selftest.sh
          bash tools/azure-release-switch-selftest.sh
          bash -n tools/azure-config-rollback-selftest.sh
          bash tools/azure-config-rollback-selftest.sh
          bash -n tools/azure-cortex-acl-selftest.sh
          bash tools/azure-cortex-acl-selftest.sh
          bash -n tools/azure-source-stack-reuse-selftest.sh
          bash tools/azure-source-stack-reuse-selftest.sh
          bash -n tools/install-personality-art.sh tools/personality-art-selftest.sh
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          bash tools/personality-art-selftest.sh
          node tools/azure-smoke-selftest.mjs
          grep -Fq 'readlink -f "$BASE/current/tools/azure-smoke.mjs"' install-azure.sh
          grep -Eq '^VERSION="[0-9]+\.[0-9]+\.[0-9]+"$' install-azure.sh
          grep -Fq 'SOURCE_REF="${MSCC_SOURCE_REF:-mscc-azure}"' install-azure.sh
          grep -Fq 'archive/$SOURCE_REF.tar.gz' install-azure.sh
          ! grep -Fq 'CC_DESTINATION_ACCOUNT' index.js
          ! grep -Fq 'CC_DESTINATION_ACCOUNT' .env.example
          grep -Fq 'fixedCcDestination: true' index.js
          grep -Fq 'changeCcDestination: false' index.js
          grep -Fq 'perAccountCcOverride: false' index.js
          test -d commands
          test -d private-commands
      - name: Build chess renderer proof
        working-directory: mscc
        run: node chess-preview.js
      - name: Upload chess renderer preview
        uses: actions/upload-artifact@v4
        with:
          name: mscc-chess-preview
          path: mscc/artifacts/chess-preview.png
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy tested MSCC commit to Azure
    needs: validate
    # PRs never receive server credentials or deploy. Protected environment
    # approval (if configured) is required before accessing production secrets.
    if: github.event_name == 'push' && github.ref == 'refs/heads/mscc-azure'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    environment: mscc-production
    steps:
      - name: Check out the exact verified commit
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: SSH deploy (verified host key, pinned commit, health + rollback)
        env:
          MSCC_SSH_HOST: ${{ secrets.MSCC_SSH_HOST }}
          MSCC_SSH_USER: ${{ secrets.MSCC_SSH_USER }}
          MSCC_SSH_KEY: ${{ secrets.MSCC_SSH_KEY }}
          MSCC_SSH_KNOWN_HOSTS: ${{ secrets.MSCC_SSH_KNOWN_HOSTS }}
          MSCC_SSH_PORT: ${{ vars.MSCC_SSH_PORT }}
        run: bash mscc/tools/deploy-azure-ssh.sh
