name: Annie editor and Canvas repair acceptance

on:
  push:
    branches: [annie-rc-editor-canvas-repair-20261011]
    paths:
      - 'annie-android/**'
      - '.github/workflows/annie-editor-canvas-repair.yml'
  workflow_dispatch:

concurrency:
  group: annie-editor-canvas-repair-${{ github.ref }}
  cancel-in-progress: true

jobs:
  editor-canvas-acceptance:
    name: Android ${{ matrix.api }} editor and Canvas repair
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        api: [26, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'
      - name: Validate overlay, run JVM tests and compile device tests
        shell: bash
        run: |
          set -euo pipefail
          python3 annie-android/scripts/test-repair-contract.py
          python3 annie-android/scripts/repair-m0b-merge.py
          sh annie-android/scripts/check-annie-types.sh
          gradle --no-daemon --stacktrace -p annie-android :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Install Android emulator and API system image
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install emulator
          bash annie-android/ci/install-emulator-system-image.sh ${{ matrix.api }}
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run editor regression and all native Canvas tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -partition-size 4096
          script: bash annie-android/ci/run-editor-canvas-repair.sh
      - name: Upload repair evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: annie-editor-canvas-api${{ matrix.api }}
          path: |
            annie-android/build/repair-reports/
            annie-android/app/build/test-results/
          if-no-files-found: error
          retention-days: 7
