name: Annie image pan bounds build acceptance

on:
  push:
    branches: [annie-rc-image-pan-20261011]
    paths:
      - 'annie-android/**'
      - '.github/workflows/annie-image-pan.yml'
  workflow_dispatch:

concurrency:
  group: annie-image-pan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image-pan-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'
      - name: Validate overlay and build with all JVM regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 annie-android/scripts/test-repair-contract.py
          python3 annie-android/scripts/repair-m0b-merge.py
          sh annie-android/scripts/check-annie-types.sh
          gradle --no-daemon --stacktrace -p annie-android :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: annie-image-pan-unit-tests
          path: annie-android/app/build/test-results/
          if-no-files-found: error
