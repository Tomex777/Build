name: SubsPlease API map

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/subsplease-api-map.yml'

permissions:
  contents: write

jobs:
  map:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Probe SubsPlease public API
        shell: bash
        run: |
          mkdir -p diagnostics
          python3 - <<'PY'
          import urllib.request, urllib.error, json, re, html, xml.etree.ElementTree as ET
          from urllib.parse import quote, urljoin

          UA='Mozilla/5.0 (Linux; Android 16; SM-A165F) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Mobile Safari/537.36'
          out={'homepage':{},'scripts':[],'api':[],'rss':[]}

          def fetch(url):
              req=urllib.request.Request(url,headers={'User-Agent':UA,'Accept':'*/*'})
              try:
                  with urllib.request.urlopen(req,timeout=30) as r:
                      b=r.read(3000000)
                      return {'status':r.status,'url':r.geturl(),'headers':dict(r.headers),'body':b.decode('utf-8','ignore')}
              except urllib.error.HTTPError as e:
                  try:b=e.read(3000000)
                  except:b=b''
                  return {'status':e.code,'url':url,'headers':dict(e.headers),'body':b.decode('utf-8','ignore'),'error':'HTTPError'}
              except Exception as e:
                  return {'status':None,'url':url,'headers':{},'body':'','error':repr(e)}

          home=fetch('https://subsplease.org/')
          out['homepage']={
              'status':home.get('status'),'finalUrl':home.get('url'),
              'contentType':home.get('headers',{}).get('Content-Type'),
              'preview':home.get('body','')[:8000]
          }

          srcs=[]
          for m in re.finditer(r'<script\b[^>]*\bsrc\s*=\s*["\']([^"\']+)',home.get('body',''),re.I):
              src=urljoin(home.get('url') or 'https://subsplease.org/',html.unescape(m.group(1)))
              if src not in srcs: srcs.append(src)

          discovered=set()
          for src in srcs:
              r=fetch(src)
              body=r.get('body','')
              endpoints=sorted(set(re.findall(r'(?:"|\')((?:https?:)?//[^"\']+|/api/\?[^"\']*|api/\?[^"\']*|/rss[^"\']*)',body,re.I)))
              api_snips=[]
              for mm in re.finditer(r'.{0,350}(?:/api/\?|f=schedule|f=search|f=latest|f=show|/rss/).{0,700}',body,re.I|re.S):
                  s=re.sub(r'\s+',' ',mm.group(0))
                  api_snips.append(s[:1200])
                  if len(api_snips)>=30: break
              out['scripts'].append({
                  'url':src,'status':r.get('status'),'contentType':r.get('headers',{}).get('Content-Type'),
                  'endpoints':endpoints[:100],'apiSnippets':api_snips
              })
              for ep in endpoints:
                  if '/api/' in ep:
                      discovered.add(urljoin(src,ep))

          candidates=[
              'https://subsplease.org/api/?f=schedule',
              'https://subsplease.org/api/?f=schedule&h=true',
              'https://subsplease.org/api/?f=latest',
              'https://subsplease.org/api/?f=latest&tz=Etc/UTC',
              'https://subsplease.org/api/?f=search&s='+quote('One Piece'),
              'https://subsplease.org/api/?f=search&tz=Etc/UTC&s='+quote('One Piece'),
              'https://subsplease.org/api/?f=search&s='+quote('Frieren'),
          ]
          for u in sorted(discovered):
              if len(candidates)>=25: break
              if u not in candidates:candidates.append(u)

          for url in candidates:
              r=fetch(url)
              body=r.get('body','')
              parsed=None
              try: parsed=json.loads(body)
              except: pass
              summary=None
              if isinstance(parsed,dict):
                  summary={'type':'object','keys':list(parsed.keys())[:80]}
                  for k,v in list(parsed.items())[:5]:
                      if isinstance(v,(dict,list,str,int,float,bool)) or v is None:
                          summary[str(k)]=v if isinstance(v,(str,int,float,bool)) or v is None else (
                              {'type':'list','length':len(v),'sample':v[:2]} if isinstance(v,list) else {'type':'object','keys':list(v.keys())[:40]}
                          )
              elif isinstance(parsed,list):
                  summary={'type':'list','length':len(parsed),'sample':parsed[:3]}
              out['api'].append({
                  'url':url,'status':r.get('status'),'finalUrl':r.get('url'),
                  'contentType':r.get('headers',{}).get('Content-Type'),
                  'jsonSummary':summary,'bodyPreview':body[:10000]
              })

          rss_urls=[
              'https://subsplease.org/rss',
              'https://subsplease.org/rss/?r=1080',
              'https://subsplease.org/rss/?r=720',
              'https://subsplease.org/rss/?r=sd',
              'https://subsplease.org/rss?t=',
              'https://subsplease.org/rss/?r=1080&t='
          ]
          for url in rss_urls:
              r=fetch(url)
              body=r.get('body','')
              items=[]
              try:
                  root=ET.fromstring(body)
                  for item in root.findall('.//item')[:5]:
                      rec={}
                      for ch in list(item):
                          tag=ch.tag.split('}')[-1]
                          if tag in ('title','link','guid','pubDate','description','category'):
                              rec[tag]=ch.text
                      items.append(rec)
              except Exception: pass
              out['rss'].append({
                  'url':url,'status':r.get('status'),'finalUrl':r.get('url'),
                  'contentType':r.get('headers',{}).get('Content-Type'),
                  'items':items,'bodyPreview':body[:5000]
              })

          with open('diagnostics/subsplease-api-map.json','w') as f:json.dump(out,f,indent=2)
          print(json.dumps(out,indent=2)[:100000])
          PY

      - name: Commit result
        if: always()
        run: |
          test -f diagnostics/subsplease-api-map.json || echo '{"error":"no result"}' > diagnostics/subsplease-api-map.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add diagnostics/subsplease-api-map.json
          git commit -m "record SubsPlease API map" || true
          git push || true
