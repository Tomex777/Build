name: KickAss browser-session strict E2E

on:
  push:
    branches: [anime-e2e-continuation-20260930]
    paths:
      - '.github/workflows/kickass-browser-session-e2e.yml'

permissions:
  contents: read

jobs:
  strict:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null
          mkdir -p proof
      - name: Resolve through same-origin browser session
        shell: bash
        run: |
          cat > kaa-browser.mjs <<'NODE'
          import { chromium } from 'playwright';
          import fs from 'node:fs';

          const BASE='https://kaa.lt';
          const UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/153.0.0.0 Safari/537.36';
          const browser=await chromium.launch({headless:true,args:['--autoplay-policy=no-user-gesture-required','--disable-blink-features=AutomationControlled']});
          const ctx=await browser.newContext({userAgent:UA,ignoreHTTPSErrors:true,viewport:{width:1280,height:850}});
          const page=await ctx.newPage();
          const out={base:BASE,media:[],api:[],attempts:[]};

          page.on('response',async r=>{
            try{
              const h=await r.allHeaders(),ct=h['content-type']||'',u=r.url();
              if(/\/api\//i.test(u))out.api.push({url:u,status:r.status(),contentType:ct});
              if(/\.(?:m3u8|mpd|mp4|m4s|ts)(?:$|\?)/i.test(u)||/mpegurl|dash\+xml|^video\//i.test(ct)){
                out.media.push({url:u,status:r.status(),contentType:ct,headers:await r.request().allHeaders()});
              }
            }catch{}
          });

          async function same(path,opts={}){
            return await page.evaluate(async ({path,opts})=>{
              const r=await fetch(path,{credentials:'include',...opts,headers:{Accept:'application/json',...(opts.headers||{})}});
              const text=await r.text();let body;try{body=JSON.parse(text)}catch{body=text}
              return {status:r.status,url:r.url,body,text};
            },{path,opts});
          }
          function normalize(u){return String(u||'').replace(/\\u002F/gi,'/').replace(/\\\//g,'/').replace(/^\/\//,'https://')}
          function parseServers(html){
            const m=String(html||'').match(/servers:\[(\{.+?\}(?:,\{.+?\})*)\]/s);
            if(!m)return [];
            const ns=[...m[1].matchAll(/name:"([^"]+)"/g)].map(x=>x[1]);
            const ss=[...m[1].matchAll(/src:"([^"]+)"/g)].map(x=>normalize(x[1]));
            return ss.map((src,i)=>({name:ns[i]||('Server '+(i+1)),src})).filter(x=>/^https?:/.test(x.src));
          }

          async function prove(m){
            const h={...m.headers,'User-Agent':UA};
            for(const k of Object.keys(h))if(k.startsWith(':')||['host','content-length','accept-encoding','connection'].includes(k.toLowerCase()))delete h[k];
            try{
              const r=await ctx.request.get(m.url,{headers:h,timeout:25000,failOnStatusCode:false});
              const b=await r.body(),ct=r.headers()['content-type']||'';
              if(/\.m3u8(?:$|\?)/i.test(m.url)||/mpegurl/i.test(ct)){
                const s=b.toString('utf8');
                if(!s.trimStart().startsWith('#EXTM3U'))return {kind:'hls',status:r.status(),pass:false};
                let ls=s.split(/\r?\n/).map(x=>x.trim()).filter(x=>x&&!x.startsWith('#'));
                if(!ls.length)return {kind:'hls',status:r.status(),pass:false};
                let child=new URL(ls[0],m.url).href;
                let cr=await ctx.request.get(child,{headers:h,timeout:25000,failOnStatusCode:false});
                let cb=await cr.body(),txt=cb.toString('utf8');
                if(txt.trimStart().startsWith('#EXTM3U')){
                  ls=txt.split(/\r?\n/).map(x=>x.trim()).filter(x=>x&&!x.startsWith('#'));
                  if(ls.length){
                    child=new URL(ls[0],child).href;
                    cr=await ctx.request.get(child,{headers:{...h,Range:'bytes=0-131071'},timeout:25000,failOnStatusCode:false});
                    cb=await cr.body();
                  }
                }
                return {kind:'hls',masterStatus:r.status(),childStatus:cr.status(),childBytes:cb.length,pass:[200,206].includes(cr.status())&&cb.length>2048};
              }
              return {kind:'direct',status:r.status(),bytes:b.length,contentType:ct,pass:[200,206].includes(r.status())&&b.length>2048};
            }catch(e){return {pass:false,error:String(e)}}
          }

          try{
            const nav=await page.goto(BASE+'/',{waitUntil:'domcontentloaded',timeout:55000});
            await page.waitForTimeout(5000);
            out.homeStatus=nav?.status()??null;out.homeTitle=await page.title();
            out.cookies=(await ctx.cookies()).map(x=>({name:x.name,domain:x.domain}));

            const s=await same('/api/fsearch',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query:'One Piece',page:1})});
            out.searchStatus=s.status;
            const rows=Array.isArray(s.body?.result)?s.body.result:Array.isArray(s.body)?s.body:[];
            out.searchCount=rows.length;
            const item=rows.find(x=>/one piece/i.test(x.title_en||x.title||x.name||''))||rows[0];
            out.item=item||null;
            if(!item?.slug)throw new Error('No slug after browser fsearch');

            const e=await same('/api/show/'+encodeURIComponent(item.slug)+'/episodes?page=1&lang=ja-JP');
            out.episodesStatus=e.status;
            const erows=Array.isArray(e.body?.result)?e.body.result:[];
            out.episodeCount=erows.length;
            const ep=erows.find(x=>Number(x.episode_number)===1)||erows[0];
            if(!ep?.slug)throw new Error('No episode row');
            const epString=String(ep.episode_string||ep.episode_number||'1');
            const epPath='/'+item.slug+'/ep-'+epString+'-'+ep.slug;
            out.episodePath=epPath;

            const epNav=await page.goto(BASE+epPath,{waitUntil:'domcontentloaded',timeout:50000});
            await page.waitForTimeout(5000);
            out.episodeStatus=epNav?.status()??null;
            const html=await page.content();
            out.servers=parseServers(html);

            for(const sv of out.servers){
              if(/[?&]type=dash\b|\/dash\b/i.test(sv.src))continue;
              const p=await ctx.newPage();
              const seen=[];
              p.on('response',async r=>{
                try{
                  const h=await r.allHeaders(),ct=h['content-type']||'',u=r.url();
                  if(/\.(?:m3u8|mpd|mp4|m4s|ts)(?:$|\?)/i.test(u)||/mpegurl|dash\+xml|^video\//i.test(ct)){
                    seen.push({url:u,status:r.status(),contentType:ct,headers:await r.request().allHeaders()});
                  }
                }catch{}
              });
              const player=sv.src+(sv.src.includes('?')?'&':'?')+'ln=ja-JP';
              const row={server:sv.name,player};
              try{
                row.status=(await p.goto(player,{waitUntil:'domcontentloaded',timeout:45000}))?.status()??null;
                await p.waitForTimeout(5000);
                for(let round=0;round<5;round++){
                  for(const f of p.frames()){
                    try{
                      const v=f.locator('video').first();
                      if(await v.count())await v.evaluate(el=>{el.muted=true;el.play().catch(()=>{});});
                      const b=f.locator('button[aria-label*="play" i],button[title*="play" i],.jw-icon-playback,.vjs-big-play-button,[class*="play" i]').first();
                      if(await b.count())try{await b.click({timeout:700})}catch{}
                    }catch{}
                  }
                  await p.waitForTimeout(1800);
                }
                row.media=[...new Map(seen.map(x=>[x.url,x])).values()];
                for(const m of row.media.filter(x=>[200,206].includes(x.status)).slice(0,15)){
                  const pr=await prove(m);row.proof=pr;if(pr.pass)break;
                }
              }catch(e){row.error=String(e)}
              await p.close();
              out.attempts.push(row);
              if(row.proof?.pass)break;
            }
            out.pass=out.attempts.some(x=>x.proof?.pass);
            out.verdict=out.pass?'STRICT_PASS':out.searchStatus===403?'SESSION_API_BLOCKED':out.servers.length?'SERVERS_NOT_PROVEN':'NO_SERVERS';
          }catch(e){out.error=String(e);out.pass=false;out.verdict='ERROR'}

          fs.writeFileSync('proof/result.json',JSON.stringify(out,null,2));
          console.log(JSON.stringify({
            homeStatus:out.homeStatus,cookies:out.cookies,searchStatus:out.searchStatus,searchCount:out.searchCount,
            item:out.item?.slug,episodesStatus:out.episodesStatus,episodeCount:out.episodeCount,episodePath:out.episodePath,
            episodeStatus:out.episodeStatus,serverCount:out.servers?.length||0,
            attempts:out.attempts.map(x=>({server:x.server,status:x.status,mediaCount:x.media?.length||0,proof:x.proof||null,error:x.error||null})),
            pass:out.pass,verdict:out.verdict,error:out.error||null
          },null,2));
          await browser.close();
          NODE
          node kaa-browser.mjs
      - name: Upload proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kickass-browser-session-e2e
          path: proof/result.json
          if-no-files-found: error
