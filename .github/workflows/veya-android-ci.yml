name: Veya Android CI

on:
  push:
    branches: [veya-android-ci]
    paths:
      - 'veya-android/**'
      - '.github/workflows/veya-android-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'veya-android/**'
      - '.github/workflows/veya-android-ci.yml'
  workflow_dispatch:

concurrency:
  group: veya-android-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  VEYA_YOUTUBE_ENGINE_REF: d80a916a6261e15481622f9b332e8e98c1cb76b8

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Checkout Shared YouTube Engine
        uses: actions/checkout@v4
        with:
          repository: Tomex777/Build
          ref: ${{ env.VEYA_YOUTUBE_ENGINE_REF }}
          path: youtube-engine-src
          sparse-checkout: youtube-engine
          sparse-checkout-cone-mode: true

      - name: Record shared engine revision
        run: |
          set -euo pipefail
          ACTUAL="$(git -C youtube-engine-src rev-parse HEAD)"
          test "$ACTUAL" = "$VEYA_YOUTUBE_ENGINE_REF"
          mkdir -p veya-android/build/ci-report
          printf 'youtubeEngineRef=%s\n' "$ACTUAL" > veya-android/build/ci-report/engine-revision.txt

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'

      - name: Lint and build
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace -p veya-android \
            :app:lintDebug \
            :app:assembleDebug \
            :app:assembleRelease

          OUT="veya-android/build/release-artifacts"
          mkdir -p "$OUT"
          cp veya-android/app/build/outputs/apk/debug/app-debug.apk \
            "$OUT/Veya-0.1.0-universal-debug.apk"
          cp veya-android/app/build/outputs/apk/release/app-release-unsigned.apk \
            "$OUT/Veya-0.1.0-universal-release-unsigned.apk"

          gradle --no-daemon --stacktrace --rerun-tasks -p veya-android \
            :app:assembleRelease -PveyaCiInstallableRelease=true
          cp veya-android/app/build/outputs/apk/release/app-release.apk \
            "$OUT/Veya-0.1.0-universal-release-QA-debugsigned.apk"
          cp "$OUT/Veya-0.1.0-universal-release-QA-debugsigned.apk" \
            "$OUT/Veya-runtime.apk"

      - name: Verify package and signature
        run: |
          set -euo pipefail
          OUT="veya-android/build/release-artifacts"
          BUILD_TOOLS="$ANDROID_SDK_ROOT/build-tools/36.0.0"
          QA="$OUT/Veya-0.1.0-universal-release-QA-debugsigned.apk"
          UNSIGNED="$OUT/Veya-0.1.0-universal-release-unsigned.apk"

          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$QA" \
            | tee "$OUT/QA-SIGNATURE.txt"
          "$BUILD_TOOLS/aapt" dump badging "$UNSIGNED" \
            | tee "$OUT/release-badging.txt"

          grep -q "package: name='com.veya.app'" "$OUT/release-badging.txt"
          grep -q "versionCode='1'" "$OUT/release-badging.txt"
          grep -q "versionName='0.1.0'" "$OUT/release-badging.txt"
          grep -q "sdkVersion:'26'" "$OUT/release-badging.txt"
          grep -q "targetSdkVersion:'36'" "$OUT/release-badging.txt"

          sha256sum \
            "$OUT/Veya-0.1.0-universal-debug.apk" \
            "$OUT/Veya-0.1.0-universal-release-unsigned.apk" \
            "$OUT/Veya-0.1.0-universal-release-QA-debugsigned.apk" \
            > "$OUT/SHA256SUMS.txt"

          {
            echo "app=Veya"
            echo "versionName=0.1.0"
            echo "versionCode=1"
            echo "minSdk=26"
            echo "targetSdk=36"
            echo "youtubeEngineRef=$VEYA_YOUTUBE_ENGINE_REF"
            echo "runtimeApk=QA debug-signed release"
          } > "$OUT/RELEASE_STATUS.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: veya-runtime-apk
          path: veya-android/build/release-artifacts/Veya-runtime.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: Veya-0.1.0-debug
          path: veya-android/build/release-artifacts/Veya-0.1.0-universal-debug.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: Veya-0.1.0-release-candidate
          path: |
            veya-android/build/release-artifacts/Veya-0.1.0-universal-release-QA-debugsigned.apk
            veya-android/build/release-artifacts/Veya-0.1.0-universal-release-unsigned.apk
            veya-android/build/release-artifacts/QA-SIGNATURE.txt
            veya-android/build/release-artifacts/release-badging.txt
            veya-android/build/release-artifacts/SHA256SUMS.txt
            veya-android/build/release-artifacts/RELEASE_STATUS.txt
            veya-android/build/ci-report/engine-revision.txt
          if-no-files-found: error

  runtime-api26:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - uses: actions/download-artifact@v4
        with:
          name: veya-runtime-apk
          path: /tmp/veya-runtime
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: API 26 runtime proof
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 26
          target: google_apis
          arch: x86_64
          profile: pixel_2
          script: VEYA_APK=/tmp/veya-runtime/Veya-runtime.apk bash veya-android/ci/run-emulator-tests.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: veya-api26-screenshots
          path: veya-android/build/emulator-screenshots/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: veya-api26-runtime-report
          path: veya-android/build/ci-report/
          if-no-files-found: warn

  runtime-api36:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - uses: actions/download-artifact@v4
        with:
          name: veya-runtime-apk
          path: /tmp/veya-runtime
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: API 36 runtime proof
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          script: VEYA_APK=/tmp/veya-runtime/Veya-runtime.apk bash veya-android/ci/run-emulator-tests.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: veya-api36-screenshots
          path: veya-android/build/emulator-screenshots/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: veya-api36-runtime-report
          path: veya-android/build/ci-report/
          if-no-files-found: warn
