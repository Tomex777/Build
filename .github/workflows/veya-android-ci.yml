name: Veya Android CI

on:
  push:
    branches: [veya-android-ci]
    paths:
      - 'veya-android/**'
      - '.github/workflows/veya-android-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'veya-android/**'
      - '.github/workflows/veya-android-ci.yml'
  workflow_dispatch:

concurrency:
  group: veya-android-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  VEYA_YOUTUBE_ENGINE_REF: 034313d0c0e9219bfee7c5eefc101508fb74eec5
  VEYA_RELEASE_KEYSTORE_BASE64: ${{ secrets.VEYA_RELEASE_KEYSTORE_BASE64 }}
  VEYA_RELEASE_STORE_PASSWORD: ${{ secrets.VEYA_RELEASE_STORE_PASSWORD }}
  VEYA_RELEASE_KEY_ALIAS: ${{ secrets.VEYA_RELEASE_KEY_ALIAS }}
  VEYA_RELEASE_KEY_PASSWORD: ${{ secrets.VEYA_RELEASE_KEY_PASSWORD }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Checkout Shared YouTube Engine
        uses: actions/checkout@v4
        with:
          repository: Tomex777/Build
          ref: ${{ env.VEYA_YOUTUBE_ENGINE_REF }}
          path: youtube-engine-src
          sparse-checkout: youtube-engine
          sparse-checkout-cone-mode: true

      - name: Record shared engine revision
        run: |
          set -euo pipefail
          ACTUAL="$(git -C youtube-engine-src rev-parse HEAD)"
          test "$ACTUAL" = "$VEYA_YOUTUBE_ENGINE_REF"
          mkdir -p veya-android/build/ci-report
          printf 'youtubeEngineRef=%s\n' "$ACTUAL" > veya-android/build/ci-report/engine-revision.txt

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'

      - name: Lint and build
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace -p veya-android \
            :app:testDebugUnitTest \
            :app:lintDebug \
            :app:assembleDebug \
            :app:assembleRelease \
            :app:bundleRelease

          OUT="veya-android/build/release-artifacts"
          mkdir -p "$OUT"
          cp veya-android/app/build/outputs/apk/debug/app-debug.apk \
            "$OUT/Veya-1.0.0-universal-debug.apk"
          cp veya-android/app/build/outputs/apk/release/app-release-unsigned.apk \
            "$OUT/Veya-1.0.0-universal-release-unsigned.apk"
          cp veya-android/app/build/outputs/bundle/release/app-release.aab \
            "$OUT/Veya-1.0.0-universal-release-unsigned.aab"

          # Produce a phone-ready ARM64 package from the same minified release.
          ARM64_RAW="$OUT/Veya-1.0.0-arm64-release-raw.apk"
          cp "$OUT/Veya-1.0.0-universal-release-unsigned.apk" "$ARM64_RAW"
          zip -qd "$ARM64_RAW" \
            'lib/armeabi-v7a/*' \
            'lib/x86/*' \
            'lib/x86_64/*' || true
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/zipalign" -P 16 -f 4 \
            "$ARM64_RAW" \
            "$OUT/Veya-1.0.0-arm64-release-unsigned.apk"
          rm -f "$ARM64_RAW"

          QA_KEYSTORE="$RUNNER_TEMP/veya-ci-qa.jks"
          keytool -genkeypair -noprompt \
            -keystore "$QA_KEYSTORE" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname "CN=Veya CI QA,O=Tomex,C=NG" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000

          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" sign \
            --ks "$QA_KEYSTORE" \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out "$OUT/Veya-1.0.0-universal-release-QA-debugsigned.apk" \
            "$OUT/Veya-1.0.0-universal-release-unsigned.apk"

          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" sign \
            --ks "$QA_KEYSTORE" \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out "$OUT/Veya-1.0.0-arm64-release-QA-debugsigned.apk" \
            "$OUT/Veya-1.0.0-arm64-release-unsigned.apk"
          rm -f "$QA_KEYSTORE"

          cp "$OUT/Veya-1.0.0-universal-release-QA-debugsigned.apk" \
            "$OUT/Veya-runtime.apk"

      - name: Verify package and signature
        run: |
          set -euo pipefail
          OUT="veya-android/build/release-artifacts"
          BUILD_TOOLS="$ANDROID_SDK_ROOT/build-tools/36.0.0"
          QA="$OUT/Veya-1.0.0-universal-release-QA-debugsigned.apk"
          UNSIGNED="$OUT/Veya-1.0.0-universal-release-unsigned.apk"
          ARM64_QA="$OUT/Veya-1.0.0-arm64-release-QA-debugsigned.apk"
          ARM64_UNSIGNED="$OUT/Veya-1.0.0-arm64-release-unsigned.apk"

          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$QA" \
            | tee "$OUT/QA-SIGNATURE.txt"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$ARM64_QA" \
            | tee "$OUT/ARM64-QA-SIGNATURE.txt"

          if unzip -Z1 "$ARM64_UNSIGNED" | grep -E '^lib/(armeabi-v7a|x86|x86_64)/' >/dev/null; then
            echo "ARM64 candidate contains a non-ARM64 native library" >&2
            exit 1
          fi
          unzip -Z1 "$ARM64_UNSIGNED" | grep -q '^lib/arm64-v8a/'

          "$BUILD_TOOLS/aapt" dump badging "$UNSIGNED" \
            | tee "$OUT/release-badging.txt"

          grep -q "package: name='com.veya.app'" "$OUT/release-badging.txt"
          grep -q "versionCode='1'" "$OUT/release-badging.txt"
          grep -q "versionName='1.0.0'" "$OUT/release-badging.txt"
          grep -q "sdkVersion:'26'" "$OUT/release-badging.txt"
          grep -q "targetSdkVersion:'36'" "$OUT/release-badging.txt"

          DEX_TMP="$(mktemp -d)"
          unzip -q "$QA" 'classes*.dex' -d "$DEX_TMP"
          for CLASS_DESC in \
            'Lorg/videolan/libvlc/interfaces/IMedia$Track;' \
            'Lorg/videolan/libvlc/interfaces/IMedia$AudioTrack;' \
            'Lorg/videolan/libvlc/interfaces/IMedia$VideoTrack;' \
            'Lorg/videolan/libvlc/interfaces/IMedia$SubtitleTrack;'
          do
            FOUND=0
            for DEX in "$DEX_TMP"/classes*.dex; do
              if strings "$DEX" | grep -F "$CLASS_DESC" >/dev/null; then
                FOUND=1
                break
              fi
            done
            if [ "$FOUND" -ne 1 ]; then
              echo "Missing libVLC JNI class in minified release: $CLASS_DESC" >&2
              exit 1
            fi
          done
          rm -rf "$DEX_TMP"

          PRODUCTION_SIGNING="NOT_CONFIGURED"
          configured=0
          for value in "${VEYA_RELEASE_KEYSTORE_BASE64:-}" "${VEYA_RELEASE_STORE_PASSWORD:-}" "${VEYA_RELEASE_KEY_ALIAS:-}" "${VEYA_RELEASE_KEY_PASSWORD:-}"; do
            if test -n "$value"; then configured=$((configured + 1)); fi
          done
          if (( configured != 0 && configured != 4 )); then
            echo "Partial Veya production signing configuration; refusing fallback" >&2
            exit 1
          fi
          if [[ -n "${VEYA_RELEASE_KEYSTORE_BASE64:-}" &&
                -n "${VEYA_RELEASE_STORE_PASSWORD:-}" &&
                -n "${VEYA_RELEASE_KEY_ALIAS:-}" &&
                -n "${VEYA_RELEASE_KEY_PASSWORD:-}" ]]; then
            KEYSTORE="$RUNNER_TEMP/veya-release.jks"
            umask 077
            trap 'rm -f "$KEYSTORE"' EXIT
            printf '%s' "$VEYA_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"

            "$BUILD_TOOLS/apksigner" sign \
              --ks "$KEYSTORE" \
              --ks-key-alias "$VEYA_RELEASE_KEY_ALIAS" \
              --ks-pass env:VEYA_RELEASE_STORE_PASSWORD \
              --key-pass env:VEYA_RELEASE_KEY_PASSWORD \
              --out "$OUT/Veya-1.0.0-universal-release-production-signed.apk" \
              "$OUT/Veya-1.0.0-universal-release-unsigned.apk"

            "$BUILD_TOOLS/apksigner" sign \
              --ks "$KEYSTORE" \
              --ks-key-alias "$VEYA_RELEASE_KEY_ALIAS" \
              --ks-pass env:VEYA_RELEASE_STORE_PASSWORD \
              --key-pass env:VEYA_RELEASE_KEY_PASSWORD \
              --out "$OUT/Veya-1.0.0-arm64-release-production-signed.apk" \
              "$OUT/Veya-1.0.0-arm64-release-unsigned.apk"

            "$BUILD_TOOLS/apksigner" verify \
              "$OUT/Veya-1.0.0-universal-release-production-signed.apk"
            "$BUILD_TOOLS/apksigner" verify \
              "$OUT/Veya-1.0.0-arm64-release-production-signed.apk"
            for apk in "$OUT/"*production-signed.apk; do
              "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$apk" > "$apk.signature.txt"
              grep -q 'certificate SHA-256 digest: 2e7bb19e87af53038c8b696e472d1008b7197c8ea3dac93cf3e046bc52f4ad84' "$apk.signature.txt"
            done
            cp "$OUT/Veya-1.0.0-universal-release-production-signed.apk" "$OUT/Veya-runtime.apk"

            jarsigner \
              -keystore "$KEYSTORE" \
              -storepass:env VEYA_RELEASE_STORE_PASSWORD \
              -keypass:env VEYA_RELEASE_KEY_PASSWORD \
              -signedjar "$OUT/Veya-1.0.0-universal-release-production-signed.aab" \
              "$OUT/Veya-1.0.0-universal-release-unsigned.aab" \
              "$VEYA_RELEASE_KEY_ALIAS"
            jarsigner -verify \
              "$OUT/Veya-1.0.0-universal-release-production-signed.aab"

            rm -f "$KEYSTORE"
            PRODUCTION_SIGNING="SIGNED"
          fi

          sha256sum \
            "$OUT/Veya-1.0.0-universal-debug.apk" \
            "$OUT/Veya-1.0.0-universal-release-unsigned.apk" \
            "$OUT/Veya-1.0.0-universal-release-QA-debugsigned.apk" \
            "$OUT/Veya-1.0.0-arm64-release-unsigned.apk" \
            "$OUT/Veya-1.0.0-arm64-release-QA-debugsigned.apk" \
            "$OUT/Veya-1.0.0-universal-release-unsigned.aab" \
            > "$OUT/SHA256SUMS.txt"
          if compgen -G "$OUT/*production-signed.*" >/dev/null; then
            sha256sum "$OUT/"*production-signed.* >> "$OUT/SHA256SUMS.txt"
          fi

          {
            echo "app=Veya"
            echo "versionName=1.0.0"
            echo "versionCode=1"
            echo "minSdk=26"
            echo "targetSdk=36"
            echo "youtubeEngineRef=$VEYA_YOUTUBE_ENGINE_REF"
            echo "runtimeSigning=$PRODUCTION_SIGNING"
            sha256sum "$OUT/Veya-runtime.apk"
            echo "arm64Candidate=Veya-1.0.0-arm64-release-QA-debugsigned.apk"
            echo "aabCandidate=Veya-1.0.0-universal-release-unsigned.aab"
            echo "productionSigning=$PRODUCTION_SIGNING"
          } > "$OUT/RELEASE_STATUS.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: veya-runtime-apk
          path: veya-android/build/release-artifacts/Veya-runtime.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: Veya-1.0.0-debug
          path: veya-android/build/release-artifacts/Veya-1.0.0-universal-debug.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: Veya-1.0.0-release-candidate
          path: |
            veya-android/build/release-artifacts/Veya-1.0.0-universal-release-QA-debugsigned.apk
            veya-android/build/release-artifacts/Veya-1.0.0-universal-release-unsigned.apk
            veya-android/build/release-artifacts/Veya-1.0.0-arm64-release-QA-debugsigned.apk
            veya-android/build/release-artifacts/Veya-1.0.0-arm64-release-unsigned.apk
            veya-android/build/release-artifacts/Veya-1.0.0-universal-release-unsigned.aab
            veya-android/build/release-artifacts/*production-signed.apk
            veya-android/build/release-artifacts/*production-signed.aab
            veya-android/build/release-artifacts/QA-SIGNATURE.txt
            veya-android/build/release-artifacts/ARM64-QA-SIGNATURE.txt
            veya-android/build/release-artifacts/release-badging.txt
            veya-android/build/release-artifacts/SHA256SUMS.txt
            veya-android/build/release-artifacts/RELEASE_STATUS.txt
            veya-android/build/ci-report/engine-revision.txt
          if-no-files-found: error

  runtime-api26:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - uses: actions/download-artifact@v4
        with:
          name: veya-runtime-apk
          path: /tmp/veya-runtime
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: API 26 runtime proof
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 26
          target: google_apis
          arch: x86_64
          profile: pixel_2
          script: VEYA_APK=/tmp/veya-runtime/Veya-runtime.apk VEYA_LIVE_PLAYBACK_PROOF=1 bash veya-android/ci/run-emulator-tests.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: veya-api26-screenshots
          path: veya-android/build/emulator-screenshots/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: veya-api26-runtime-report
          path: veya-android/build/ci-report/
          if-no-files-found: warn

  runtime-api36:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - uses: actions/download-artifact@v4
        with:
          name: veya-runtime-apk
          path: /tmp/veya-runtime
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: API 36 runtime proof
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          script: VEYA_APK=/tmp/veya-runtime/Veya-runtime.apk VEYA_LIVE_PLAYBACK_PROOF=1 bash veya-android/ci/run-emulator-tests.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: veya-api36-screenshots
          path: veya-android/build/emulator-screenshots/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: veya-api36-runtime-report
          path: veya-android/build/ci-report/
          if-no-files-found: warn
