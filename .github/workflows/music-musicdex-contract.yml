name: MusicDex Contract Probe

on:
  push:
    branches:
      - music-source-probes-20260930
    paths:
      - ".github/workflows/music-musicdex-contract.yml"
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Probe MusicDex catalog contract
        shell: bash
        run: |
          python3 - <<'PY'
          import json, urllib.parse, urllib.request, urllib.error
          BASE="https://musicdex.org/secure"
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36"

          def get(path):
              u=BASE+path
              try:
                  with urllib.request.urlopen(urllib.request.Request(u,headers={"User-Agent":UA,"Accept":"application/json"}),timeout=25) as r:
                      b=r.read(2000000)
                      return {"ok":True,"status":r.status,"ct":r.headers.get("Content-Type"),"url":r.geturl(),"body":b}
              except urllib.error.HTTPError as e:
                  return {"ok":False,"status":e.code,"ct":e.headers.get("Content-Type"),"url":u,"body":e.read(12000)}
              except Exception as e:
                  return {"ok":False,"status":None,"url":u,"body":repr(e).encode()}

          paths=[
            "/tracks/567",
            "/albums/7",
            "/artists/44",
            "/artists?searchQuery="+urllib.parse.quote("Sagisu Shirou")+"&perPage=5",
            "/tracks?searchQuery="+urllib.parse.quote("BLEACH")+"&perPage=5",
            "/albums?searchQuery="+urllib.parse.quote("BLEACH")+"&perPage=5",
            "/tracks?albumId=62&perPage=10",
            "/tracks?album_id=62&perPage=10",
            "/tracks?artistId=44&perPage=10",
            "/tracks?artist_id=44&perPage=10",
            "/albums?artistId=44&perPage=10",
            "/albums?artist_id=44&perPage=10",
            "/albums/62/tracks",
            "/album/62/tracks",
            "/tracks?album=62&perPage=50",
            "/tracks?albumIds%5B%5D=62&perPage=50",
            "/artists/44/tracks",
            "/artist/44/tracks",
            "/tracks?artist=44&perPage=50",
            "/tracks?artistIds%5B%5D=44&perPage=50",
            "/artists/44/albums",
            "/artist/44/albums",
          ]
          report={}
          for p in paths:
              r=get(p)
              text=r["body"].decode("utf-8","replace")
              try:j=json.loads(text)
              except:j=None
              report[p]={"status":r.get("status"),"ct":r.get("ct"),"json":j,"preview":text[:1200] if j is None else None}
              print("##",p)
              print("status",r.get("status"),"ct",r.get("ct"))
              print(json.dumps(j,ensure_ascii=False)[:12000] if j is not None else text[:2000])
          open("musicdex-contract.json","w").write(json.dumps(report,indent=2,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: musicdex-contract
          path: musicdex-contract.json
