name: Sora Source Snapshot

on:
  push:
    branches: [sora-android-ci]
    paths:
      - 'sora-ci/snapshot-trigger.txt'

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct current Sora source
        run: |
          rm -rf /tmp/sora-src /tmp/sora.zip
          cat sora-ci/chunks/part-*.txt | base64 -d > /tmp/sora.zip
          unzip -q /tmp/sora.zip -d /tmp/sora-src
          ROOT=/tmp/sora-src/Sora_Android_v0_1
          test -f "$ROOT/settings.gradle.kts"
          cp -R sora-overlay/. "$ROOT/"
          cd /tmp/sora-src
          zip -qr /tmp/sora-source-snapshot.zip Sora_Android_v0_1
      - uses: actions/upload-artifact@v4
        with:
          name: sora-source-snapshot
          path: /tmp/sora-source-snapshot.zip
          if-no-files-found: error
