name: Homira Signing Health

on:
  push:
    branches: [homira-call-ci]
    paths:
      - '.github/workflows/homira-signing-health.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HOMIRA_KEYSTORE_BASE64: ${{ secrets.HOMIRA_KEYSTORE_BASE64 }}
      HOMIRA_KEYSTORE_PASSWORD: ${{ secrets.HOMIRA_KEYSTORE_PASSWORD }}
      HOMIRA_KEY_ALIAS: ${{ secrets.HOMIRA_KEY_ALIAS }}
      HOMIRA_KEY_PASSWORD: ${{ secrets.HOMIRA_KEY_PASSWORD }}

    steps:
      - name: Verify canonical signing secrets exist
        shell: bash
        run: |
          set -euo pipefail
          test -n "${HOMIRA_KEYSTORE_BASE64:-}" || {
            echo "::error::HOMIRA_KEYSTORE_BASE64 is missing"
            exit 1
          }
          test -n "${HOMIRA_KEYSTORE_PASSWORD:-}" || {
            echo "::error::HOMIRA_KEYSTORE_PASSWORD is missing"
            exit 1
          }
          test -n "${HOMIRA_KEY_ALIAS:-}" || {
            echo "::error::HOMIRA_KEY_ALIAS is missing"
            exit 1
          }
          test -n "${HOMIRA_KEY_PASSWORD:-}" || {
            echo "::error::HOMIRA_KEY_PASSWORD is missing"
            exit 1
          }

      - name: Verify canonical certificate
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$HOMIRA_KEYSTORE_BASE64" | base64 -d > /tmp/homira-production.jks
          keytool -list -v             -keystore /tmp/homira-production.jks             -storepass "$HOMIRA_KEYSTORE_PASSWORD"             -alias "$HOMIRA_KEY_ALIAS"             > /tmp/key-info.txt

          grep -F "SHA256: 03:BE:26:A0:D5:30:B3:90:E1:12:15:00:C0:4E:A2:17:53:79:D3:55:BE:47:5C:5D:3C:A6:75:F7:D4:FF:6B:1B" /tmp/key-info.txt >/dev/null || {
            echo "::error::Configured keystore does not match the canonical Homira production certificate"
            exit 1
          }

          echo "Canonical Homira production signing key is configured."
          rm -f /tmp/homira-production.jks /tmp/key-info.txt
