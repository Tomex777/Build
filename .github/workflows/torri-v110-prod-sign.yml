name: Torri 1.1.0 secure production release (original signing key)

# Build receives only READ access to Torri's public source repository.
# The Torri permanent Android signing key never leaves Build's Actions secrets.
on:
  push:
    branches:
      - torri/v1-1-prod-sign
    paths:
      - .github/workflows/torri-v110-prod-sign.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  secure_signed_upgrade:
    if: github.repository == 'Tomex777/Build'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Checkout production signing workflow scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Checkout approved public Torri 1.1.0 source into Build
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Tomex777/Torri
          ref: b989daca2ab4dc04035cd96bbcd2ba14ce78c6f8
          path: torri-src
          persist-credentials: false

      - name: Copy reviewed Torri source into the public Build branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git -C torri-src rev-parse HEAD)" = "b989daca2ab4dc04035cd96bbcd2ba14ce78c6f8"
          test "$(gh api repos/Tomex777/Torri --jq .private)" = "false"
          test -s torri-src/app/build.gradle.kts
          test -s torri-src/gradlew
          if git -C torri-src ls-files | grep -E '\.(jks|keystore|pem|p12)$|keystore\.properties|local\.properties|(^|/)\.env'; then
            echo '::error::Potentially sensitive file found in public source'
            exit 1
          fi
          rm -rf torri-src/.github torri-src/.idea torri-src/.git
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f torri-src
          if ! git diff --cached --quiet; then
            git commit -m 'source(torri): approved public source mirror for v1.1.0'
            git push origin HEAD:refs/heads/torri/v1-1-prod-sign
          fi
          echo 'PASS: public Torri source mirror committed into Build/torri-src'

      - name: Check original permanent Torri signing certificate before building
        shell: bash
        env:
          TORRI_RELEASE_KEYSTORE_B64: ${{ secrets.TORRI_RELEASE_KEYSTORE_B64 }}
          TORRI_RELEASE_KEY_ALIAS: ${{ secrets.TORRI_RELEASE_KEY_ALIAS }}
          TORRI_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.TORRI_RELEASE_KEYSTORE_PASSWORD }}
          TORRI_RELEASE_KEY_PASSWORD: ${{ secrets.TORRI_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for key in TORRI_RELEASE_KEYSTORE_B64 TORRI_RELEASE_KEY_ALIAS TORRI_RELEASE_KEYSTORE_PASSWORD TORRI_RELEASE_KEY_PASSWORD; do
            test -n "${!key}" || { echo "::error::Required original Torri signing secret is missing"; exit 1; }
          done
          umask 077
          keyfile="$RUNNER_TEMP/torri-key-validation.jks"
          trap 'rm -f "$keyfile"' EXIT
          printf '%s' "$TORRI_RELEASE_KEYSTORE_B64" | base64 --decode > "$keyfile"
          actual="$(keytool -list -v -keystore "$keyfile" -storepass "$TORRI_RELEASE_KEYSTORE_PASSWORD" -alias "$TORRI_RELEASE_KEY_ALIAS" 2>/dev/null | sed -n 's/^[[:space:]]*SHA256: //p' | head -1 | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
          test "$actual" = "6b1ab58169e3a8dd4370860d5d03060b035476b43cceaf2bd8da7ca1fe37ab44" || {
            echo "::error::Original Torri v1.0.0 signature mismatch"
            exit 1
          }
          echo "PASS: secure, original Torri 1.0.0 signing identity is present."

      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '21'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Compile untrusted-key-free Torri release after unit and DB migration tests
        working-directory: torri-src
        env:
          TORRI_UNSIGNED_HANDOFF: 'true'
        run: ./gradlew spotlessCheck testDebugUnitTest verifySqlDelightMigration assembleRelease -Penable-updater

      - name: Stage unsigned ARM64 and universal APKs, verify identities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          echo "$TOOLS" > "$RUNNER_TEMP/android-build-tools.txt"
          SRC=torri-src/app/build/outputs/apk/release
          for variant in arm64-v8a universal; do
            APK="$(find "$SRC" -maxdepth 1 -type f -name "*$variant*release*.apk" -print -quit)"
            test -s "$APK" || { echo "::error::Missing $variant APK"; exit 1; }
            "$TOOLS/aapt" dump badging "$APK" | grep -E "^package: name='app.torri' versionCode='10001' versionName='1.1.0'"
            if "$TOOLS/apksigner" verify "$APK" >/dev/null 2>&1; then
              echo "::error::Unsigned staging input contains an unexpected signing identity."
              exit 1
            fi
            cp "$APK" "$RUNNER_TEMP/torri-$variant-unsigned.apk"
          done
          echo "PASS: Torri 1.1.0 release-mode unsigned APKs built from pinned PRIVATE source."

      - name: Sign both APKs with the ORIGINAL Torri v1.0.0 keystore
        shell: bash
        env:
          TORRI_RELEASE_KEYSTORE_B64: ${{ secrets.TORRI_RELEASE_KEYSTORE_B64 }}
          TORRI_RELEASE_KEY_ALIAS: ${{ secrets.TORRI_RELEASE_KEY_ALIAS }}
          TORRI_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.TORRI_RELEASE_KEYSTORE_PASSWORD }}
          TORRI_RELEASE_KEY_PASSWORD: ${{ secrets.TORRI_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for var in TORRI_RELEASE_KEYSTORE_B64 TORRI_RELEASE_KEY_ALIAS TORRI_RELEASE_KEYSTORE_PASSWORD TORRI_RELEASE_KEY_PASSWORD; do
            test -n "${!var}" || { echo "::error::Missing original Torri permanent signing secret"; exit 1; }
          done
          umask 077
          KEYSTORE="$RUNNER_TEMP/torri-permanent.jks"
          trap 'rm -f "$KEYSTORE"' EXIT
          printf '%s' "$TORRI_RELEASE_KEYSTORE_B64" | base64 --decode > "$KEYSTORE"
          TOOLS="$(cat "$RUNNER_TEMP/android-build-tools.txt")"
          expected="6b1ab58169e3a8dd4370860d5d03060b035476b43cceaf2bd8da7ca1fe37ab44"
          for variant in arm64-v8a universal; do
            "$TOOLS/zipalign" -P 16 -f 4 "$RUNNER_TEMP/torri-$variant-unsigned.apk" "$RUNNER_TEMP/torri-$variant-aligned.apk"
            "$TOOLS/apksigner" sign \
              --ks "$KEYSTORE" --ks-key-alias "$TORRI_RELEASE_KEY_ALIAS" \
              --ks-pass env:TORRI_RELEASE_KEYSTORE_PASSWORD \
              --key-pass env:TORRI_RELEASE_KEY_PASSWORD \
              --out "dist/Torri-1.1.0-$variant-release.apk" \
              "$RUNNER_TEMP/torri-$variant-aligned.apk"
            "$TOOLS/apksigner" verify --verbose --print-certs "dist/Torri-1.1.0-$variant-release.apk" | tee "$RUNNER_TEMP/signing-$variant.txt"
            actual="$(sed -n 's/^.*certificate SHA-256 digest: //p' "$RUNNER_TEMP/signing-$variant.txt" | head -1 | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
            test "$actual" = "$expected" || { echo "::error::Torri production certificate mismatch"; exit 1; }
            sha256sum "dist/Torri-1.1.0-$variant-release.apk" >> dist/SHA256SUMS.txt
          done
          echo "PASS: Torri ARM64 and universal production APKs signed with original permanent key."

      - name: Retrieve verified production Torri 1.0.0 to test signature continuity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/old"
          gh run download 37137601978 -R Tomex777/Build \
            --name Torri-1.0.0-universal-portfolio-apk --dir "$RUNNER_TEMP/old"
          OLD="$(find "$RUNNER_TEMP/old" -type f -name '*.apk' -print -quit)"
          test -s "$OLD"
          TOOLS="$(cat "$RUNNER_TEMP/android-build-tools.txt")"
          "$TOOLS/aapt" dump badging "$OLD" | grep -E "^package: name='app.torri' versionCode='10000' versionName='1.0.0'"
          actual="$("$TOOLS/apksigner" verify --print-certs "$OLD" | sed -n 's/^.*certificate SHA-256 digest: //p' | head -1)"
          test "$actual" = "6b1ab58169e3a8dd4370860d5d03060b035476b43cceaf2bd8da7ca1fe37ab44"
          cp "$OLD" "$RUNNER_TEMP/torri-previous-v1.0.0.apk"

      - name: Free disk and enable Android emulator hardware
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/share/powershell /opt/hostedtoolcache/CodeQL
          sudo rm -rf "$ANDROID_HOME/ndk"
          df -h /
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Test existing permanent-signed Torri 1.0.0 in-place upgrade to 1.1.0
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disk-size: 2048M
          ram-size: 2048M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash .github/scripts/torri-v110-production-upgrade.sh

      - name: Stage signed Torri upgrade in GitHub DRAFT after passing all checks
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="torri-v1.1.0"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Existing Torri release; refusing to replace permanent-signed binaries."
            exit 1
          fi
          cat > dist/RELEASE-NOTES.txt <<'EOF'
          Torri by NIGHT 1.1.0 (Mihon 0.21.2 engine)
          Android package: app.torri
          versionCode: 10001 (previous Torri 1.0.0 versionCode 10000)
          Permanent production signing SHA-256:
          6b1ab58169e3a8dd4370860d5d03060b035476b43cceaf2bd8da7ca1fe37ab44

          Both APKs are signed with Torri's ORIGINAL protected production
          keystore. Android 15 CI installs the existing permanently signed
          Torri 1.0.0 APK and updates to 1.1.0 without uninstalling.
          Includes upstream Mihon 0.21.2 performance, reader, download,
          library, database, extension and Cloudflare improvements.
          Also includes Torri Theme Gallery, custom Theme Studio, color picker,
          six new palettes and compact Continue Reading shortcut.

          IMPORTANT: Back up your existing library before installing:
          the 0.21.x database migration can irreversibly merge duplicate
          records. A populated real-world library has not been tested;
          hence this release initially uses prerelease status.
          EOF
          gh release create "$TAG" \
            --target "$GITHUB_SHA" --draft --prerelease \
            --title "Torri by NIGHT 1.1.0 — original-key Android upgrade (DRAFT)" \
            --notes-file dist/RELEASE-NOTES.txt \
            dist/Torri-1.1.0-arm64-v8a-release.apk \
            dist/Torri-1.1.0-universal-release.apk \
            dist/SHA256SUMS.txt \
            "$RUNNER_TEMP/torri-v110-upgrade-android15.png"
          gh release view "$TAG" --json url,assets,isPrerelease,isDraft
