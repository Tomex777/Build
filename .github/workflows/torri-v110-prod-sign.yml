name: Torri 1.1.0 original-key Android production release
on:
  push:
    branches:
      - torri/v1-1-prod-sign
    paths:
      - signing-handoff/torri-v1.1.0/UNSIGNED-SHA256.txt
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sign_upgrade_test_release:
    if: github.repository == 'Tomex777/Build'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout unsigned Torri production APKs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Reassemble both unsigned APKs and validate hashes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          echo "$TOOLS" > "$RUNNER_TEMP/android-build-tools.txt"
          for variant in arm64 universal; do
            if [[ "$variant" == arm64 ]]; then
              SRC="signing-handoff/torri-v1.1.0"
            else
              SRC="signing-handoff/torri-v1.1.0-universal"
            fi
            test -s "$SRC/part-000"
            test -s "$SRC/UNSIGNED-SHA256.txt"
            DEST="$RUNNER_TEMP/torri-$variant-unsigned.apk"
            cat "$SRC"/part-* | base64 --decode > "$DEST"
            actual="$(sha256sum "$DEST" | cut -d' ' -f1)"
            expected="$(cat "$SRC/UNSIGNED-SHA256.txt")"
            test "$actual" = "$expected" || { echo "::error::$variant source APK checksum mismatch"; exit 1; }
            "$TOOLS/aapt" dump badging "$DEST" | grep -E "^package: name='app.torri' versionCode='10001' versionName='1.1.0'"
            if "$TOOLS/apksigner" verify "$DEST" >/dev/null 2>&1; then
              echo "::error::Refusing APK input previously signed with another key."
              exit 1
            fi
          done
          echo "PASS: both original unsigned Torri APKs reassembled and hash-verified."

      - name: Sign BOTH APKs using original Torri 1.0.0 permanent key
        shell: bash
        env:
          TORRI_RELEASE_KEYSTORE_B64: ${{ secrets.TORRI_RELEASE_KEYSTORE_B64 }}
          TORRI_RELEASE_KEY_ALIAS: ${{ secrets.TORRI_RELEASE_KEY_ALIAS }}
          TORRI_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.TORRI_RELEASE_KEYSTORE_PASSWORD }}
          TORRI_RELEASE_KEY_PASSWORD: ${{ secrets.TORRI_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for var in TORRI_RELEASE_KEYSTORE_B64 TORRI_RELEASE_KEY_ALIAS TORRI_RELEASE_KEYSTORE_PASSWORD TORRI_RELEASE_KEY_PASSWORD; do
            test -n "${!var}" || { echo "::error::Original Torri production signing credential missing"; exit 1; }
          done
          umask 077
          KEYSTORE="$RUNNER_TEMP/torri-existing-production.jks"
          trap 'rm -f "$KEYSTORE"' EXIT
          printf '%s' "$TORRI_RELEASE_KEYSTORE_B64" | base64 --decode > "$KEYSTORE"
          TOOLS="$(cat "$RUNNER_TEMP/android-build-tools.txt")"
          EXPECTED="6b1ab58169e3a8dd4370860d5d03060b035476b43cceaf2bd8da7ca1fe37ab44"
          for variant in arm64 universal; do
            case "$variant" in
              arm64) outfile="Torri-1.1.0-arm64-v8a-release.apk";;
              universal) outfile="Torri-1.1.0-universal-release.apk";;
            esac
            "$TOOLS/zipalign" -P 16 -f 4 "$RUNNER_TEMP/torri-$variant-unsigned.apk" "$RUNNER_TEMP/torri-$variant-aligned.apk"
            "$TOOLS/apksigner" sign \
              --ks "$KEYSTORE" \
              --ks-key-alias "$TORRI_RELEASE_KEY_ALIAS" \
              --ks-pass env:TORRI_RELEASE_KEYSTORE_PASSWORD \
              --key-pass env:TORRI_RELEASE_KEY_PASSWORD \
              --out "dist/$outfile" \
              "$RUNNER_TEMP/torri-$variant-aligned.apk"
            "$TOOLS/apksigner" verify --verbose --print-certs "dist/$outfile" | tee "$RUNNER_TEMP/signature-$variant.txt"
            actual="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/signature-$variant.txt" | head -1 | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
            if [[ "$actual" != "$EXPECTED" ]]; then
              echo "::error::Torri original certificate mismatch; refusing release."
              exit 1
            fi
            "$TOOLS/aapt" dump badging "dist/$outfile" | grep -E "^package: name='app.torri' versionCode='10001' versionName='1.1.0'"
            sha256sum "dist/$outfile" >> dist/SHA256SUMS.txt
          done
          echo "PASS: BOTH release APKs signed with the IDENTICAL original Torri 1.0.0 certificate."

      - name: Download real, previously signed Torri 1.0.0 universal APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/previous-torri"
          gh run download 37137601978 -R Tomex777/Build \
            --name Torri-1.0.0-universal-portfolio-apk \
            --dir "$RUNNER_TEMP/previous-torri"
          OLD="$(find "$RUNNER_TEMP/previous-torri" -type f -name '*.apk' -print -quit)"
          test -s "$OLD"
          TOOLS="$(cat "$RUNNER_TEMP/android-build-tools.txt")"
          "$TOOLS/aapt" dump badging "$OLD" | grep -E "^package: name='app.torri' versionCode='10000' versionName='1.0.0'"
          actual="$("$TOOLS/apksigner" verify --print-certs "$OLD" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1)"
          test "$actual" = "6b1ab58169e3a8dd4370860d5d03060b035476b43cceaf2bd8da7ca1fe37ab44"
          cp "$OLD" "$RUNNER_TEMP/torri-previous-v1.0.0.apk"
          echo "PASS: fetched and verified the ACTUAL previously signed Torri 1.0.0 build."

      - name: Prepare Android emulator hardware
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/share/powershell /opt/hostedtoolcache/CodeQL
          sudo rm -rf "$ANDROID_HOME/ndk"
          df -h /
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Prove IN-PLACE 1.0.0 to 1.1.0 upgrade on Android 15
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disk-size: 2048M
          ram-size: 2048M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash .github/scripts/torri-v110-production-upgrade.sh

      - name: Publish authentic production-signed Torri 1.1.0 APKs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="torri-v1.1.0"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release tag already exists; never overwrite permanent-signed APKs silently"
            exit 1
          fi
          cat > dist/RELEASE-NOTES.txt <<'EOF'
          Torri by NIGHT v1.1.0 — powered by Mihon 0.21.2

          App package: app.torri
          versionCode: 10001 (previous Torri v1.0.0: 10000)
          Permanent signing certificate SHA-256:
          6b1ab58169e3a8dd4370860d5d03060b035476b43cceaf2bd8da7ca1fe37ab44

          Both ARM64 and universal APKs were signed using the original
          Torri 1.0.0 Android production keystore stored securely in the
          Tomex777/Build GitHub Actions secrets. NOT a debug or Preview key.

          Automated Android 15 test first installed the original, previously
          signed Torri 1.0.0 APK, then used adb install -r for the 1.1.0
          production-signed APK and verified package, version, launch, resume,
          and no recorded app crash after migration of a clean test library.

          WARNING: The Mihon 0.21.2 database upgrade can irreversibly merge
          duplicate manga/chapter records. MAKE A VERIFIED TORRI BACKUP FIRST.
          Never uninstall the old app to bypass an update check.
          An upgrade of a populated real-world library has not been fully
          verified; this signed release is initially marked a prerelease.
          EOF
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Torri by NIGHT 1.1.0 — production-signed Android upgrade" \
            --notes-file dist/RELEASE-NOTES.txt \
            dist/Torri-1.1.0-arm64-v8a-release.apk \
            dist/Torri-1.1.0-universal-release.apk \
            dist/SHA256SUMS.txt \
            "$RUNNER_TEMP/torri-v110-upgrade-android15.png"
          gh release view "$TAG" --json url,name,isDraft,isPrerelease,assets
