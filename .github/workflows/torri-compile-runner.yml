name: Torri Compile Runner

on:
  push:
    branches:
      - torri-compile-runner-20260922
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: torri-compile-runner
  cancel-in-progress: true

jobs:
  build:
    name: Compile Torri SDK 36
    runs-on: ubuntu-24.04
    timeout-minutes: 50

    steps:
      - name: Checkout Torri privately
        uses: actions/checkout@v4
        with:
          repository: Tomex777/Torri
          ref: 06d45527cddeb858b8691f7f19b184e7895b5ed6
          path: torri-src
          fetch-depth: 0
          token: ${{ secrets.TORRI_TOKEN || secrets.GH_PAT || secrets.PAT || secrets.GITHUB_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.REPO_TOKEN }}

      - name: Verify requested Android SDK configuration
        run: |
          grep 'android-sdk-' torri-src/gradle/mihon.versions.toml
          grep -q 'android-sdk-min = "26"' torri-src/gradle/mihon.versions.toml
          grep -q 'android-sdk-compile = "36"' torri-src/gradle/mihon.versions.toml
          grep -q 'android-sdk-target = "36"' torri-src/gradle/mihon.versions.toml

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          java-version-file: torri-src/.github/.java-version
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36 and NDK
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865"

      - name: Build Torri release APKs
        working-directory: torri-src
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Stage APKs
        run: |
          mkdir -p torri-output
          cp torri-src/app/build/outputs/apk/release/app-arm64-v8a-release.apk torri-output/Torri-arm64-v8a.apk
          cp torri-src/app/build/outputs/apk/release/app-universal-release.apk torri-output/Torri-universal.apk
          sha256sum torri-output/*.apk | tee torri-output/SHA256SUMS.txt

      - name: Upload ARM64 APK
        uses: actions/upload-artifact@v4
        with:
          name: Torri-arm64-v8a-sdk36-min26
          path: torri-output/Torri-arm64-v8a.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload universal APK
        uses: actions/upload-artifact@v4
        with:
          name: Torri-universal-sdk36-min26
          path: torri-output/Torri-universal.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload checksums
        uses: actions/upload-artifact@v4
        with:
          name: Torri-checksums
          path: torri-output/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
