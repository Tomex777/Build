name: Torri Compile Runner
# Retrigger using the SDK 36 compatible base

on:
  push:
    branches:
      - torri-compile-runner-20260922
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: torri-compile-runner
  cancel-in-progress: true

jobs:
  build:
    name: Compile Torri SDK 36
    runs-on: ubuntu-24.04
    timeout-minutes: 50

    steps:
      - name: Checkout build overlay
        uses: actions/checkout@v4

      - name: Checkout Mihon v0.19.9 SDK 36 base
        uses: actions/checkout@v4
        with:
          repository: mihonapp/mihon
          ref: 7a917968e3bf71c4a665e6655a550877d81ead1d
          path: torri-src
          fetch-depth: 0

      - name: Apply Torri overlay
        run: |
          cp torri-overlay/gradle/libs.versions.toml torri-src/gradle/libs.versions.toml
          cp torri-overlay/gradle/mihon.versions.toml torri-src/gradle/mihon.versions.toml
          cp torri-overlay/app/build.gradle.kts torri-src/app/build.gradle.kts
          sed -i 's/rootProject.name = "Mihon"/rootProject.name = "Torri"/' torri-src/settings.gradle.kts

          # Apply only Torri files that are intentionally maintained against the pinned
          # Mihon v0.19.9 base. Do not copy the entire dormant Kotlin overlay: some older
          # experimental files were authored against a newer Mihon API surface.
          copy_overlay_file() {
            local path="$1"
            mkdir -p "torri-src/$(dirname "$path")"
            cp "torri-overlay/$path" "torri-src/$path"
          }
          copy_overlay_file app/src/main/java/eu/kanade/domain/base/BasePreferences.kt
          copy_overlay_file app/src/main/java/eu/kanade/domain/ui/model/AppTheme.kt
          copy_overlay_file app/src/main/java/eu/kanade/domain/ui/UiPreferences.kt
          copy_overlay_file app/src/main/java/eu/kanade/presentation/more/LogoHeader.kt
          copy_overlay_file app/src/main/java/eu/kanade/presentation/more/MoreScreen.kt
          copy_overlay_file app/src/main/java/eu/kanade/presentation/more/settings/screen/about/AboutScreen.kt
          copy_overlay_file app/src/main/java/eu/kanade/presentation/theme/TachiyomiTheme.kt
          copy_overlay_file app/src/main/java/eu/kanade/presentation/theme/colorscheme/NightColorScheme.kt
          copy_overlay_file app/src/main/java/eu/kanade/presentation/manga/CoverAdaptiveMangaDetailsTheme.kt
          copy_overlay_file app/src/main/java/eu/kanade/presentation/manga/MangaScreen.kt
          copy_overlay_file app/src/main/java/eu/kanade/tachiyomi/ui/more/MoreTab.kt
          copy_overlay_file app/src/main/java/eu/kanade/tachiyomi/data/updater/AppUpdateChecker.kt
          copy_overlay_file app/src/main/java/eu/kanade/tachiyomi/data/coil/MangaCoverFetcher.kt

          # Brand simple pinned-base surfaces in place so Torri does not inherit newer
          # Mihon implementation details just to change an icon or filename.
          sed -i 's/R.drawable.ic_mihon/R.drawable.ic_torri/g'             torri-src/app/src/main/java/eu/kanade/tachiyomi/data/backup/BackupNotifier.kt             torri-src/app/src/main/java/eu/kanade/tachiyomi/data/library/LibraryUpdateNotifier.kt             torri-src/app/src/main/java/eu/kanade/tachiyomi/extension/util/ExtensionInstallService.kt
          sed -i 's/mihon_restore_error.txt/torri_restore_error.txt/g' torri-src/app/src/main/java/eu/kanade/tachiyomi/data/backup/restore/BackupRestorer.kt
          sed -i 's/mihon_crash_logs.txt/torri_crash_logs.txt/g' torri-src/app/src/main/java/eu/kanade/tachiyomi/util/CrashLogUtil.kt
          sed -i 's/mihon_library.csv/torri_library.csv/g' torri-src/app/src/main/java/eu/kanade/presentation/more/settings/screen/SettingsDataScreen.kt
          sed -i 's|https://mihon.app/docs/guides/getting-started|https://github.com/Tomex777/Build/blob/torri-compile-runner-20260922/torri-overlay/docs/getting-started.md|' torri-src/app/src/main/java/eu/kanade/presentation/more/onboarding/GuidesStep.kt
          sed -i 's|https://mihon.app/docs/guides/troubleshooting/|https://github.com/Tomex777/Build/issues|' torri-src/core/common/src/main/kotlin/tachiyomi/core/common/Constants.kt
          sed -i 's|                ShowDonationCampaign()|                // Torri: upstream donation campaign disabled; attribution remains in About.|' torri-src/app/src/main/java/eu/kanade/tachiyomi/ui/main/MainActivity.kt

          # Keep upstream i18n intact except for Torri's app identity and the one
          # additional Torri theme label used by UiPreferences/AppTheme.
          python3 - <<'PY'
          from pathlib import Path
          p = Path("torri-src/i18n/src/commonMain/moko-resources/base/strings.xml")
          text = p.read_text()
          old_name = '<string name="app_name" translatable="false">Mihon</string>'
          new_name = '<string name="app_name" translatable="false">Torri</string>'
          if old_name not in text and new_name not in text:
              raise SystemExit("Could not locate upstream app_name string")
          text = text.replace(old_name, new_name)
          if 'name="theme_night"' not in text:
              marker = '<string name="theme_monochrome">Monochrome</string>'
              if marker not in text:
                  raise SystemExit("Could not locate theme insertion point")
              text = text.replace(marker, marker + '\n    <string name="theme_night">Night</string>')
          p.write_text(text)
          PY

          cp -a torri-overlay/app/src/main/res/drawable/. torri-src/app/src/main/res/drawable/
          cp torri-overlay/app/src/main/res/values/colors.xml torri-src/app/src/main/res/values/colors.xml
          sed -i 's|@drawable/ic_mihon_splash|@drawable/ic_torri_splash|' torri-src/app/src/main/res/values/themes.xml
          grep -q '<item name="windowSplashScreenAnimatedIcon">@drawable/ic_torri_splash</item>' torri-src/app/src/main/res/values/themes.xml
          echo "Verified Torri splash icon reference:"
          grep 'windowSplashScreenAnimatedIcon' torri-src/app/src/main/res/values/themes.xml
          cp torri-overlay/app/src/main/res/values/torri_strings.xml torri-src/app/src/main/res/values/torri_strings.xml
          cp -a torri-overlay/app/src/debug/res/drawable/. torri-src/app/src/debug/res/drawable/
          mkdir -p torri-src/app/src/debug/res/values
          cp torri-overlay/app/src/debug/res/values/colors.xml torri-src/app/src/debug/res/values/colors.xml

          # Debug-only runtime fixtures are compiled only into app.torri.dev.
          cp torri-overlay/app/src/debug/AndroidManifest.xml torri-src/app/src/debug/AndroidManifest.xml
          mkdir -p torri-src/app/src/debug/java
          cp -a torri-overlay/app/src/debug/java/. torri-src/app/src/debug/java/

          echo "Verify Torri identity overlay reached the Mihon checkout:"
          grep -q 'rootProject.name = "Torri"' torri-src/settings.gradle.kts
          grep -q '<string name="app_name" translatable="false">Torri</string>' torri-src/i18n/src/commonMain/moko-resources/base/strings.xml
          grep -q 'AppTheme.NIGHT' torri-src/app/src/main/java/eu/kanade/domain/ui/UiPreferences.kt
          grep -q 'R.drawable.ic_torri' torri-src/app/src/main/java/eu/kanade/presentation/more/LogoHeader.kt
          grep -q 'fun TorriBrandMark' torri-src/app/src/main/java/eu/kanade/presentation/more/LogoHeader.kt
          grep -q 'markSize = 112.dp' torri-src/app/src/main/java/eu/kanade/presentation/more/MoreScreen.kt
          grep -q '@drawable/ic_torri' torri-src/app/src/main/res/drawable/cover_error.xml
          grep -q 'title = "Torri"' torri-src/app/src/main/java/eu/kanade/presentation/more/settings/screen/about/AboutScreen.kt
          grep -q 'CoverAdaptiveMangaDetailsTheme' torri-src/app/src/main/java/eu/kanade/presentation/manga/MangaScreen.kt
          grep -q 'setSmallIcon(R.drawable.ic_torri)' torri-src/app/src/main/java/eu/kanade/tachiyomi/extension/util/ExtensionInstallService.kt
          # The pinned Mihon base has only four direct ic_mihon drawable uses:
          # More plus backup/library/extension notifications. Torri replaces all
          # of them, so a surviving reference is a branding regression.
          ! grep -R -q 'R.drawable.ic_mihon' torri-src/app/src/main/java
          test -s torri-src/app/src/main/res/drawable/ic_launcher_foreground.xml
          test -s torri-src/app/src/main/res/drawable/ic_launcher_monochrome.xml
          grep -q 'torri_crash_logs.txt' torri-src/app/src/main/java/eu/kanade/tachiyomi/util/CrashLogUtil.kt
          grep -q 'torri_restore_error.txt' torri-src/app/src/main/java/eu/kanade/tachiyomi/data/backup/restore/BackupRestorer.kt
          grep -q 'torri_library.csv' torri-src/app/src/main/java/eu/kanade/presentation/more/settings/screen/SettingsDataScreen.kt
          grep -q 'Tomex777/Build' torri-src/app/src/main/java/eu/kanade/tachiyomi/data/updater/AppUpdateChecker.kt
          grep -q 'url.toUri().path' torri-src/app/src/main/java/eu/kanade/tachiyomi/data/coil/MangaCoverFetcher.kt
          ! grep -q 'SupportUsScreen' torri-src/app/src/main/java/eu/kanade/tachiyomi/ui/more/MoreTab.kt
          ! grep -q '^                ShowDonationCampaign()' torri-src/app/src/main/java/eu/kanade/tachiyomi/ui/main/MainActivity.kt
          grep -q 'TorriCiBootstrapActivity' torri-src/app/src/debug/AndroidManifest.xml
          grep -q 'versionCode = 10000' torri-src/app/build.gradle.kts
          grep -q 'versionName = "1.0.0"' torri-src/app/build.gradle.kts
          grep -q 'Your gate into manga"' torri-src/app/src/main/java/eu/kanade/presentation/more/settings/screen/about/AboutScreen.kt
          ! grep -q 'Built on Mihon' torri-src/app/src/main/java/eu/kanade/presentation/more/settings/screen/about/AboutScreen.kt
          ! grep -q 'Constants.URL_HELP' torri-src/app/src/main/java/eu/kanade/presentation/more/MoreScreen.kt
          grep -q 'Tomex777/Build/blob/torri-compile-runner-20260922/torri-overlay/docs/getting-started.md' torri-src/app/src/main/java/eu/kanade/presentation/more/onboarding/GuidesStep.kt

          mkdir -p torri-output
          {
            echo "Torri upstream-brand audit"
            echo "Intentional attribution is allowed in About/licenses; internal package/theme names are not product branding."
            echo
            grep -RInE 'Mihon|mihon\.app|Tachiyomi|tachiyomi' \
              torri-src/app/src/main \
              torri-src/i18n/src/commonMain/moko-resources/base/strings.xml \
              | head -n 500 || true
          } > torri-output/upstream-brand-audit.txt

          echo "Requested SDK configuration:"
          grep 'android-sdk-' torri-src/gradle/mihon.versions.toml
          grep -q 'android-sdk-min = "26"' torri-src/gradle/mihon.versions.toml
          grep -q 'android-sdk-compile = "36"' torri-src/gradle/mihon.versions.toml
          grep -q 'android-sdk-target = "36"' torri-src/gradle/mihon.versions.toml

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK 36 and NDK
        run: |
          SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/16.0/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865"

      - name: Build Torri release and emulator APKs
        working-directory: torri-src
        run: |
          chmod +x gradlew
          python3 - <<'PYGRADLE'
          from pathlib import Path
          p = Path("gradle.properties")
          lines = p.read_text().splitlines() if p.exists() else []
          setting = "org.gradle.jvmargs=-Xmx5g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"
          lines = [line for line in lines if not line.startswith("org.gradle.jvmargs=")]
          lines.append(setting)
          p.write_text("\n".join(lines) + "\n")
          PYGRADLE
          # Build the real release APK matrix and store bundle first.
          ./gradlew assembleRelease bundleRelease --stacktrace --no-daemon --max-workers=2

          # Deep runtime QA remains on app.torri.dev.
          TORRI_CI_DEBUG_X86_ONLY=1 ./gradlew assembleDebug --stacktrace --no-daemon --max-workers=2
          mkdir -p ../torri-output
          cp app/build/outputs/apk/debug/app-x86_64-debug.apk ../torri-output/Torri-x86_64-debug.apk

          # Build a test-only seed APK with the production package id. It is used
          # only to create deterministic local manga before the actual release APK
          # replaces it in-place. The seed is never a shipping artifact.
          TORRI_CI_DEBUG_X86_ONLY=1 TORRI_RELEASE_SEED=1 ./gradlew assembleDebug --rerun-tasks --stacktrace --no-daemon --max-workers=2
          cp app/build/outputs/apk/debug/app-x86_64-debug.apk ../torri-output/Torri-x86_64-release-seed.apk

      - name: Stage release artifacts
        run: |
          mkdir -p torri-output
          cp torri-src/app/build/outputs/apk/release/app-arm64-v8a-release.apk torri-output/Torri-arm64-v8a.apk
          cp torri-src/app/build/outputs/apk/release/app-x86_64-release.apk torri-output/Torri-x86_64-release.apk
          cp torri-src/app/build/outputs/apk/release/app-universal-release.apk torri-output/Torri-universal.apk
          AAB="$(find torri-src/app/build/outputs/bundle -type f -name '*.aab' -print -quit)"
          test -n "$AAB"
          cp "$AAB" torri-output/Torri-1.0.0.aab
          cat > torri-output/RELEASE_INFO.txt <<EOF
          applicationId=app.torri
          versionCode=10000
          versionName=1.0.0
          commit=$GITHUB_SHA
          compileSdk=36
          targetSdk=36
          minSdk=26
          signing=release variant currently uses the repository's debug signing configuration; production store credentials were not invented
          EOF
          sha256sum torri-output/*.apk torri-output/*.aab | tee torri-output/SHA256SUMS.txt

      - name: Upload ARM64 APK
        uses: actions/upload-artifact@v4
        with:
          name: Torri-arm64-v8a-sdk36-min26
          path: torri-output/Torri-arm64-v8a.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload universal APK
        uses: actions/upload-artifact@v4
        with:
          name: Torri-universal-sdk36-min26
          path: torri-output/Torri-universal.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload store bundle
        uses: actions/upload-artifact@v4
        with:
          name: Torri-1.0.0-AAB
          path: torri-output/Torri-1.0.0.aab
          if-no-files-found: error
          retention-days: 14

      - name: Upload release runtime APKs
        uses: actions/upload-artifact@v4
        with:
          name: Torri-release-runtime-apks
          path: |
            torri-output/Torri-x86_64-release.apk
            torri-output/Torri-x86_64-release-seed.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload API 36 emulator debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Torri-x86_64-debug-sdk36-min26
          path: torri-output/Torri-x86_64-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload release metadata and checksums
        uses: actions/upload-artifact@v4
        with:
          name: Torri-release-metadata
          path: |
            torri-output/SHA256SUMS.txt
            torri-output/RELEASE_INFO.txt
            torri-output/upstream-brand-audit.txt
          if-no-files-found: error

  runtime-api26:
    name: Runtime smoke on Android 8.0 / API 26
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout API 26 runtime scripts
        uses: actions/checkout@v4

      - name: Download API 26-compatible emulator debug APK
        uses: actions/download-artifact@v4
        with:
          name: Torri-x86_64-debug-sdk36-min26
          path: torri-output

      - name: Download release runtime APKs
        uses: actions/download-artifact@v4
        with:
          name: Torri-release-runtime-apks
          path: torri-output

      - name: Runtime smoke on API 26 emulator
        env:
          API26_EVIDENCE_DIR: torri-output/runtime-api26
        run: bash "$GITHUB_WORKSPACE/torri-ci/start-emulator-api26.sh" "$GITHUB_WORKSPACE/torri-ci/runtime-smoke-api26.sh"

      - name: Upload API 26 runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Torri-API26-runtime-evidence
          path: torri-output/runtime-api26/
          if-no-files-found: warn
          retention-days: 14

  runtime:
    name: Runtime smoke on Android 16
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout runtime smoke script
        uses: actions/checkout@v4

      - name: Download API 36 emulator debug APK
        uses: actions/download-artifact@v4
        with:
          name: Torri-x86_64-debug-sdk36-min26
          path: torri-output

      - name: Download release runtime APKs
        uses: actions/download-artifact@v4
        with:
          name: Torri-release-runtime-apks
          path: torri-output

      - name: Runtime smoke on API 36 emulator
        env:
          API36_EVIDENCE_DIR: torri-output/runtime
        run: bash "$GITHUB_WORKSPACE/torri-ci/start-emulator-api36.sh" "$GITHUB_WORKSPACE/torri-ci/runtime-smoke-api36.sh"

      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Torri-API36-runtime-evidence
          path: torri-output/runtime/
          if-no-files-found: warn
          retention-days: 14
