name: NIGHT Browser Agent 2 — Installed Home UX

on:
  push:
    branches: ['agent/browser-v2-02-home']
    paths:
      - 'night-browser/app/**'
      - 'night-browser/ci/agent-02-home-smoke.sh'
      - '.github/workflows/night-browser-agent02-home-emulator.yml'
  pull_request:
    branches: ['feature/night-browser-multi-agent-20261020']
    paths:
      - 'night-browser/app/**'
      - 'night-browser/ci/agent-02-home-smoke.sh'
      - '.github/workflows/night-browser-agent02-home-emulator.yml'
  workflow_dispatch:

jobs:
  home-ux:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        api-level: [26, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-37.1 build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'
      - name: Compile native x86_64 app
        run: gradle --no-daemon --stacktrace -p night-browser :app:testDebugUnitTest :app:assembleDebug
      - name: Enable Android emulator KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and interact with real Compose UI and Gecko
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -partition-size 4096
          script: bash night-browser/ci/agent-02-home-smoke.sh
      - name: Upload real screenshots and redacted diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: night-browser-agent02-home-api-${{ matrix.api-level }}
          path: night-browser/screenshots/agent02-home/**
          if-no-files-found: warn
