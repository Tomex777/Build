name: MirrorChess v1.1 visual tour

on:
  push:
    branches:
      - verify/mirrorchess-v11-20260908
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  build-and-tour:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out private verification branch
        uses: actions/checkout@v4

      - name: Download exact v1.1 build from verified build run
        uses: actions/download-artifact@v4
        with:
          name: mirrorchess-v11-build
          path: v11-build
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 34284401684

      - name: Download checksum-verified Maia model from verified build run
        uses: actions/download-artifact@v4
        with:
          name: maia3-5m-fp16-verified
          path: model
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 34284401684

      - name: Recheck exact model bytes
        run: |
          model_file="$(find model -name maia3-5m.fp16.onnx -print -quit)"
          test -n "$model_file"
          echo 'ca22fc3031975932e693f9758149302efc177749165443ed52de828add8864fa  '"$model_file" | sha256sum -c -

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 emulator
        run: |
          sdkmanager \
            "platform-tools" \
            "build-tools;36.0.0" \
            "emulator" \
            "system-images;android-36;google_apis;x86_64"

      - name: Boot Android 36 emulator
        run: |
          export ANDROID_AVD_HOME="$GITHUB_WORKSPACE/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | avdmanager create avd \
            --force \
            --name mirrorchess-v11 \
            --package "system-images;android-36;google_apis;x86_64" \
            --device pixel_2
          printf '\ndisk.dataPartition.size=3G\nhw.ramSize=3072\n' >> "$ANDROID_AVD_HOME/mirrorchess-v11.avd/config.ini"
          sudo chmod 666 /dev/kvm || true
          nohup "$ANDROID_HOME/emulator/emulator" @mirrorchess-v11 \
            -no-window \
            -noaudio \
            -no-boot-anim \
            -no-snapshot \
            -wipe-data \
            -partition-size 3072 \
            -gpu swiftshader_indirect \
            > "$GITHUB_WORKSPACE/emulator.log" 2>&1 &
          emulator_pid=$!
          booted=0
          for attempt in {1..120}; do
            if ! kill -0 "$emulator_pid" 2>/dev/null; then
              echo "Android emulator exited before boot completed" >&2
              cat "$GITHUB_WORKSPACE/emulator.log"
              exit 1
            fi
            if [[ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" == "1" ]]; then
              booted=1
              break
            fi
            sleep 5
          done
          test "$booted" = 1
          package_ready=0
          for attempt in {1..120}; do
            if adb shell service check package 2>/dev/null | grep -q 'found' \
              && adb shell pm path android >/dev/null 2>&1; then
              package_ready=1
              break
            fi
            sleep 5
          done
          test "$package_ready" = 1
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb shell settings put global hide_error_dialogs 1
          adb shell settings put global anr_show_background 0
          adb shell settings put global verifier_verify_adb_installs 0
          adb shell settings put global package_verifier_enable 0
          adb shell input keyevent KEYCODE_WAKEUP
          adb shell wm dismiss-keyguard || true
          adb shell input keyevent 82 || true
          adb shell input keyevent KEYCODE_HOME
          sleep 20

      - name: Install exact v1.1 build and verified model
        run: |
          full_apk="$(find v11-build -name app-debug.apk -print -quit)"
          model_file="$(find model -name maia3-5m.fp16.onnx -print -quit)"
          test -n "$full_apk"
          test -n "$model_file"
          cp "$full_apk" "$RUNNER_TEMP/mirrorchess-v11-x86_64-unsigned.apk"
          zip -d "$RUNNER_TEMP/mirrorchess-v11-x86_64-unsigned.apk" \
            'lib/arm64-v8a/*' 'lib/armeabi-v7a/*' 'lib/x86/*'
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -f 4 \
            "$RUNNER_TEMP/mirrorchess-v11-x86_64-unsigned.apk" \
            "$RUNNER_TEMP/mirrorchess-v11-x86_64-aligned.apk"
          keytool -genkeypair -noprompt \
            -keystore "$RUNNER_TEMP/runtime-debug.keystore" \
            -storepass android -keypass android -alias androiddebugkey \
            -dname 'CN=Android Debug,O=Android,C=US' \
            -keyalg RSA -keysize 2048 -validity 10000
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
            --ks "$RUNNER_TEMP/runtime-debug.keystore" \
            --ks-pass pass:android --key-pass pass:android \
            --out "$RUNNER_TEMP/mirrorchess-v11-x86_64.apk" \
            "$RUNNER_TEMP/mirrorchess-v11-x86_64-aligned.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify \
            "$RUNNER_TEMP/mirrorchess-v11-x86_64.apk"
          install_ok=0
          for attempt in 1 2 3; do
            if timeout 240 adb install -r -g "$RUNNER_TEMP/mirrorchess-v11-x86_64.apk"; then
              install_ok=1
              break
            fi
            adb kill-server || true
            adb start-server
            adb wait-for-device
            sleep 20
          done
          test "$install_ok" = 1
          adb shell run-as com.night.mirrorchess mkdir -p files/models
          adb push "$model_file" /data/local/tmp/maia3-5m.fp16.onnx
          adb shell chmod 644 /data/local/tmp/maia3-5m.fp16.onnx
          adb shell run-as com.night.mirrorchess cp \
            /data/local/tmp/maia3-5m.fp16.onnx \
            files/models/maia3-5m.fp16.onnx
          adb shell run-as com.night.mirrorchess ls -l files/models/maia3-5m.fp16.onnx

      - name: Capture v1.1 screen tour
        timeout-minutes: 12
        run: |
          set -euo pipefail
          mkdir -p visual-tour/screens visual-tour/ui

          dump_ui() {
            for attempt in {1..4}; do
              adb shell input keyevent KEYCODE_WAKEUP || true
              adb shell wm dismiss-keyguard || true
              adb shell rm -f /sdcard/window.xml || true
              if timeout 10 adb shell uiautomator dump /sdcard/window.xml >/dev/null 2>&1 \
                && timeout 10 adb pull /sdcard/window.xml visual-tour/current.xml >/dev/null 2>&1 \
                && grep -q '<hierarchy' visual-tour/current.xml; then
                return 0
              fi
              sleep 2
            done
            return 1
          }

          shot() {
            local name="$1"
            sleep 2
            timeout 15 adb exec-out screencap -p > "visual-tour/screens/${name}.png"
            if dump_ui; then
              cp visual-tour/current.xml "visual-tour/ui/${name}.xml"
            else
              echo 'UI hierarchy unavailable; screenshot still captured.' > "visual-tour/ui/${name}-dump-failed.txt"
            fi
          }

          tap_text_pick() {
            local needle="$1"
            local pick="${2:-first}"
            dump_ui
            local coords
            coords="$(python3 - "$needle" "$pick" visual-tour/current.xml <<'PY'
          import re
          import sys
          import xml.etree.ElementTree as ET

          needle, pick, path = sys.argv[1:]
          nodes = []
          for node in ET.parse(path).getroot().iter("node"):
              if node.attrib.get("text") == needle or node.attrib.get("content-desc") == needle:
                  match = re.fullmatch(r"\[(\d+),(\d+)\]\[(\d+),(\d+)\]", node.attrib.get("bounds", ""))
                  if match:
                      x1, y1, x2, y2 = map(int, match.groups())
                      nodes.append(((x1 + x2) // 2, (y1 + y2) // 2))
          if not nodes:
              raise SystemExit(f"Could not find UI text: {needle}")
          x, y = nodes[-1] if pick == "last" else nodes[0]
          print(x, y)
          PY
            )"
            read -r x y <<< "$coords"
            adb shell input tap "$x" "$y"
            sleep 2
          }

          adb logcat -c
          adb shell input keyevent KEYCODE_WAKEUP
          adb shell wm dismiss-keyguard || true
          adb shell am force-stop com.night.mirrorchess
          adb shell am start -W -n com.night.mirrorchess/.MainActivity | tee visual-tour/launch.txt
          grep -q 'Status: ok' visual-tour/launch.txt
          sleep 15
          shot 01-play-home

          tap_text_pick 'Mirror · 0%'
          shot 02-play-mirror-option
          tap_text_pick '1800' first

          adb shell input tap 975 105
          shot 03-settings-main

          tap_text_pick 'AI Model'
          shot 04-settings-ai-model-installed
          tap_text_pick 'Back'

          tap_text_pick 'Mirror Me'
          shot 05-settings-mirror-me
          tap_text_pick 'Back'

          tap_text_pick 'Board & Pieces'
          shot 06-settings-board-pieces-top
          adb shell input swipe 540 1450 540 900 450
          shot 07-settings-board-pieces-bottom
          tap_text_pick 'Back'

          tap_text_pick 'Gameplay'
          shot 08-settings-gameplay
          tap_text_pick 'Back'

          tap_text_pick 'Coach'
          shot 09-settings-coach
          tap_text_pick 'Back'

          tap_text_pick 'Game Data'
          shot 10-settings-game-data
          tap_text_pick 'Back'

          tap_text_pick 'About & Privacy'
          shot 11-settings-about-night
          tap_text_pick 'Back'
          tap_text_pick 'Back'

          tap_text_pick 'Play'
          sleep 4
          shot 12-game-initial

          adb shell input tap 608 1170
          adb shell input tap 608 900
          sleep 18
          shot 13-game-after-move-with-coach

          adb shell input tap 1005 90
          shot 14-game-menu
          tap_text_pick 'Resign'
          shot 15-resign-confirmation
          tap_text_pick 'Keep playing'

          adb shell input tap 1005 90
          tap_text_pick 'Resign'
          tap_text_pick 'Resign'
          shot 16-game-over-dialog
          tap_text_pick 'Done'
          sleep 3
          adb shell input swipe 540 1550 540 650 500
          shot 17-play-recent-game

          tap_text_pick 'Maia 1800' last
          shot 18-game-review-final-position
          tap_text_pick 'Previous'
          shot 19-game-review-previous-position

          adb shell dumpsys activity activities > visual-tour/activity.txt
          adb logcat -d > visual-tour/logcat.txt
          if grep -A 30 'FATAL EXCEPTION' visual-tour/logcat.txt | grep -q 'com.night.mirrorchess'; then
            echo 'MirrorChess crashed during visual tour' >&2
            exit 1
          fi

          cat > visual-tour/README.txt <<'EOF'
          MirrorChess v1.1 PlayFirst — Night
          Actual Android 36 emulator captures from the exact project-chat ZIP.
          The UI source was not redesigned or tweaked for these screenshots.
          The pinned Maia-3 5M ONNX model was installed before launch and checksum-verified.

          Screens:
          01 Play home
          02 Mirror option in horizontally scrolled opponent selector
          03 Settings index
          04 AI Model (installed)
          05 Mirror Me learning
          06-07 Board & Pieces, top and bottom
          08 Gameplay
          09 Coach
          10 Game Data
          11 About & Privacy / Night branding
          12 Initial game board
          13 Game after a move with coach output
          14 Game overflow menu
          15 Resign confirmation
          16 Game-over dialog
          17 Play home with recent game
          18 Saved game review, final position
          19 Saved game review, previous position
          EOF

      - name: Upload v1.1 visual tour
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mirrorchess-v11-visual-tour
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0
          path: |
            visual-tour/
            emulator.log
