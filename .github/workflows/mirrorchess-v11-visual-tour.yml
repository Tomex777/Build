name: MirrorChess v1.1 visual tour

on:
  push:
    branches:
      - verify/mirrorchess-v11-20260908
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  build-and-tour:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out private verification branch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Prepare exact project-chat v1.1 source
        run: |
          mkdir -p v11-work
          unzip -q mirrorchess-v11/input/MirrorChess-v1.1-PlayFirst-Night-2026-09-08.zip -d v11-work
          cp mirrorchess/source/gradle/wrapper/gradle-wrapper.jar v11-work/MirrorChess/gradle/wrapper/gradle-wrapper.jar
          sed -i '/import androidx.compose.foundation.layout.weight/d' \
            v11-work/MirrorChess/app/src/main/java/com/night/mirrorchess/ui/GameScreen.kt \
            v11-work/MirrorChess/app/src/main/java/com/night/mirrorchess/ui/ChessBoard.kt
          sed -i '/import androidx.compose.ui.input.pointer.consume/d' \
            v11-work/MirrorChess/app/src/main/java/com/night/mirrorchess/ui/ChessBoard.kt
          chmod +x v11-work/MirrorChess/gradlew
          grep -q 'versionName = "1.1.0"' v11-work/MirrorChess/app/build.gradle.kts
          grep -q 'A \*\*Night\*\* app' v11-work/MirrorChess/README.md
          grep -q 'private enum class RootRoute { PLAY, SETTINGS, GAME }' \
            v11-work/MirrorChess/app/src/main/java/com/night/mirrorchess/ui/AppShell.kt

      - name: Build exact v1.1 UI source
        working-directory: v11-work/MirrorChess
        run: ./gradlew --no-daemon :app:assembleDebug :app:lintDebug

      - name: Download and verify pinned Maia ONNX model
        run: |
          mkdir -p model
          model_url='https://huggingface.co/bqrio/maia3-onnx/resolve/f2582c005a63a034e493d93736ecdd6291dd82e7/maia3-5m.fp16.onnx?download=true'
          curl -L --fail --retry 4 --retry-all-errors \
            --output model/maia3-5m.fp16.onnx "$model_url"
          cd model
          echo 'ca22fc3031975932e693f9758149302efc177749165443ed52de828add8864fa  maia3-5m.fp16.onnx' > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
          stat -c 'maia3-5m.fp16.onnx %s bytes' maia3-5m.fp16.onnx > MODEL_INFO.txt
          printf '%s\n' \
            'Model: bqrio/maia3-onnx / maia3-5m.fp16.onnx' \
            'Pinned revision: f2582c005a63a034e493d93736ecdd6291dd82e7' \
            'Used by: MirrorChess v1.1.0 (Night)' >> MODEL_INFO.txt

      - name: Upload verified Maia model
        uses: actions/upload-artifact@v4
        with:
          name: maia3-5m-fp16-verified
          retention-days: 14
          compression-level: 0
          path: model/

      - name: Upload v1.1 debug build
        uses: actions/upload-artifact@v4
        with:
          name: mirrorchess-v11-build
          retention-days: 14
          compression-level: 0
          path: |
            v11-work/MirrorChess/app/build/outputs/apk/debug/app-debug.apk
            v11-work/MirrorChess/app/build/reports/lint-results-debug.html

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 emulator
        run: |
          sdkmanager \
            "platform-tools" \
            "emulator" \
            "system-images;android-36;google_apis;x86_64"

      - name: Boot Android 36 emulator
        run: |
          export ANDROID_AVD_HOME="$GITHUB_WORKSPACE/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | avdmanager create avd \
            --force \
            --name mirrorchess-v11 \
            --package "system-images;android-36;google_apis;x86_64" \
            --device pixel_2
          sudo chmod 666 /dev/kvm || true
          nohup "$ANDROID_HOME/emulator/emulator" @mirrorchess-v11 \
            -no-window \
            -noaudio \
            -no-boot-anim \
            -no-snapshot \
            -wipe-data \
            -gpu swiftshader_indirect \
            > "$GITHUB_WORKSPACE/emulator.log" 2>&1 &
          emulator_pid=$!
          booted=0
          for attempt in {1..120}; do
            if ! kill -0 "$emulator_pid" 2>/dev/null; then
              echo "Android emulator exited before boot completed" >&2
              cat "$GITHUB_WORKSPACE/emulator.log"
              exit 1
            fi
            if [[ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" == "1" ]]; then
              booted=1
              break
            fi
            sleep 5
          done
          test "$booted" = 1
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb shell settings put global hide_error_dialogs 1
          adb shell settings put global anr_show_background 0
          adb shell input keyevent KEYCODE_HOME
          sleep 20

      - name: Install exact v1.1 build and verified model
        run: |
          apk='v11-work/MirrorChess/app/build/outputs/apk/debug/app-debug.apk'
          adb install -r -g "$apk"
          adb shell run-as com.night.mirrorchess mkdir -p files/models
          adb push model/maia3-5m.fp16.onnx /data/local/tmp/maia3-5m.fp16.onnx
          adb shell chmod 644 /data/local/tmp/maia3-5m.fp16.onnx
          adb shell run-as com.night.mirrorchess cp \
            /data/local/tmp/maia3-5m.fp16.onnx \
            files/models/maia3-5m.fp16.onnx
          adb shell run-as com.night.mirrorchess ls -l files/models/maia3-5m.fp16.onnx

      - name: Capture v1.1 screen tour
        run: |
          set -euo pipefail
          mkdir -p visual-tour/screens visual-tour/ui

          dump_ui() {
            adb shell uiautomator dump /sdcard/window.xml >/dev/null
            adb pull /sdcard/window.xml visual-tour/current.xml >/dev/null
          }

          shot() {
            local name="$1"
            sleep 2
            dump_ui
            cp visual-tour/current.xml "visual-tour/ui/${name}.xml"
            adb exec-out screencap -p > "visual-tour/screens/${name}.png"
          }

          tap_text_pick() {
            local needle="$1"
            local pick="${2:-first}"
            dump_ui
            local coords
            coords="$(python3 - "$needle" "$pick" visual-tour/current.xml <<'PY'
          import re
          import sys
          import xml.etree.ElementTree as ET

          needle, pick, path = sys.argv[1:]
          nodes = []
          for node in ET.parse(path).getroot().iter("node"):
              if node.attrib.get("text") == needle or node.attrib.get("content-desc") == needle:
                  match = re.fullmatch(r"\[(\d+),(\d+)\]\[(\d+),(\d+)\]", node.attrib.get("bounds", ""))
                  if match:
                      x1, y1, x2, y2 = map(int, match.groups())
                      nodes.append(((x1 + x2) // 2, (y1 + y2) // 2))
          if not nodes:
              raise SystemExit(f"Could not find UI text: {needle}")
          x, y = nodes[-1] if pick == "last" else nodes[0]
          print(x, y)
          PY
            )"
            read -r x y <<< "$coords"
            adb shell input tap "$x" "$y"
            sleep 2
          }

          adb logcat -c
          adb shell am force-stop com.night.mirrorchess
          adb shell am start -W -n com.night.mirrorchess/.MainActivity | tee visual-tour/launch.txt
          grep -q 'Status: ok' visual-tour/launch.txt
          sleep 8
          shot 01-play-home

          adb shell input swipe 960 350 160 350 450
          shot 02-play-mirror-option
          adb shell input swipe 160 350 960 350 450

          adb shell input tap 975 105
          shot 03-settings-main

          tap_text_pick 'AI Model'
          shot 04-settings-ai-model-installed
          tap_text_pick 'Back'

          tap_text_pick 'Mirror Me'
          shot 05-settings-mirror-me
          tap_text_pick 'Back'

          tap_text_pick 'Board & Pieces'
          shot 06-settings-board-pieces-top
          adb shell input swipe 540 1550 540 450 550
          shot 07-settings-board-pieces-bottom
          tap_text_pick 'Back'

          tap_text_pick 'Gameplay'
          shot 08-settings-gameplay
          tap_text_pick 'Back'

          tap_text_pick 'Coach'
          shot 09-settings-coach
          tap_text_pick 'Back'

          tap_text_pick 'Game Data'
          shot 10-settings-game-data
          tap_text_pick 'Back'

          tap_text_pick 'About & Privacy'
          shot 11-settings-about-night
          tap_text_pick 'Back'
          tap_text_pick 'Back'

          tap_text_pick 'Play'
          sleep 4
          shot 12-game-initial

          adb shell input tap 608 1170
          adb shell input tap 608 900
          sleep 18
          shot 13-game-after-move-with-coach

          adb shell input tap 1005 90
          shot 14-game-menu
          tap_text_pick 'Resign'
          shot 15-resign-confirmation
          tap_text_pick 'Keep playing'

          adb shell input tap 1005 90
          tap_text_pick 'Resign'
          tap_text_pick 'Resign'
          shot 16-game-over-dialog
          tap_text_pick 'Done'
          sleep 3
          adb shell input swipe 540 1550 540 650 500
          shot 17-play-recent-game

          tap_text_pick 'Maia 1800' last
          shot 18-game-review-start
          tap_text_pick 'Next'
          shot 19-game-review-next-position

          adb shell dumpsys activity activities > visual-tour/activity.txt
          adb logcat -d > visual-tour/logcat.txt
          if grep -A 30 'FATAL EXCEPTION' visual-tour/logcat.txt | grep -q 'com.night.mirrorchess'; then
            echo 'MirrorChess crashed during visual tour' >&2
            exit 1
          fi

          cat > visual-tour/README.txt <<'EOF'
          MirrorChess v1.1 PlayFirst — Night
          Actual Android 36 emulator captures from the exact project-chat ZIP.
          The UI source was not redesigned or tweaked for these screenshots.
          The pinned Maia-3 5M ONNX model was installed before launch and checksum-verified.

          Screens:
          01 Play home
          02 Mirror option in horizontally scrolled opponent selector
          03 Settings index
          04 AI Model (installed)
          05 Mirror Me learning
          06-07 Board & Pieces, top and bottom
          08 Gameplay
          09 Coach
          10 Game Data
          11 About & Privacy / Night branding
          12 Initial game board
          13 Game after a move with coach output
          14 Game overflow menu
          15 Resign confirmation
          16 Game-over dialog
          17 Play home with recent game
          18-19 Saved game review
          EOF

      - name: Upload v1.1 visual tour
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mirrorchess-v11-visual-tour
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0
          path: |
            visual-tour/
            emulator.log
