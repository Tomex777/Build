name: Room V4 Visual Audit

on:
  workflow_dispatch:
  push:
    branches: ["room-visual-audit"]
    paths:
      - "room-visual-audit/v3-src/**"
      - ".github/workflows/room-v4-visual-audit.yml"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: room-visual-audit

      - name: Prepare visually refined room
        run: |
          rm -rf /tmp/room-v4
          mkdir -p /tmp/room-v4/site/src /tmp/room-v4/output
          cp room-visual-audit/v3-src/index.html /tmp/room-v4/site/index.html
          cp room-visual-audit/v3-src/room.css /tmp/room-v4/site/room.css
          cat room-visual-audit/v3-src/src/main.part1.js room-visual-audit/v3-src/src/main.part2.js > /tmp/room-v4/site/src/main.js
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/room-v4/site/src/main.js')
          s=p.read_text()

          def repl(old,new,label):
              global s
              n=s.count(old)
              if n != 1:
                  raise SystemExit(f'{label}: expected 1 match, got {n}')
              s=s.replace(old,new)

          repl("  renderer.toneMappingExposure = 0.96;", "  renderer.toneMappingExposure = 0.92;", 'exposure')
          repl("  scene.background = new THREE.Color(0xaab8bb);\n  scene.fog = new THREE.Fog(0xaab8bb, 16, 36);", "  scene.background = new THREE.Color(0x98a7aa);\n  scene.fog = new THREE.Fog(0x98a7aa, 16, 36);", 'background')
          repl("  const camera = new THREE.PerspectiveCamera(48, innerWidth/innerHeight, 0.05, 80);\n  camera.position.set(6.15, 3.55, 6.75);", "  const portraitLayout = () => innerWidth < 620 || innerHeight > innerWidth * 1.45;\n  const camera = new THREE.PerspectiveCamera(portraitLayout() ? 54 : 47, innerWidth/innerHeight, 0.05, 80);\n  camera.position.set(...(portraitLayout() ? [6.45,4.95,7.35] : [5.85,3.65,6.30]));", 'camera')
          repl("  controls.maxDistance = 10.5;", "  controls.maxDistance = portraitLayout() ? 13.5 : 10.0;", 'max distance')
          repl("  const floorLamp=new THREE.Group();floorLamp.position.set(2.12,0,1.50);room.add(floorLamp);", "  const floorLamp=new THREE.Group();floorLamp.position.set(-2.05,0,1.34);room.add(floorLamp);", 'floor lamp position')
          repl("  const floorShade=mesh(new THREE.CylinderGeometry(.20,.34,.42,32,1,true),mat.lampShadeOn,{p:[0,1.66,0],parent:floorLamp});", "  const floorShade=mesh(new THREE.CylinderGeometry(.18,.30,.38,32,1,true),mat.lampShadeOn,{p:[0,1.63,0],parent:floorLamp});", 'floor shade')
          repl("  const floorLight=new THREE.PointLight(0xffd6a0,6.5,3.2,2);floorLight.position.set(0,1.55,0);floorLamp.add(floorLight);", "  const floorLight=new THREE.PointLight(0xffd6a0,2.2,3.0,2);floorLight.position.set(0,1.52,0);floorLamp.add(floorLight);", 'floor light')
          repl("  const pendantLight=new THREE.PointLight(0xffd6a5,4.2,4.8,2);pendantLight.position.set(0,-.52,0);pendant.add(pendantLight);", "  const pendantLight=new THREE.PointLight(0xffd6a5,1.45,4.6,2);pendantLight.position.set(0,-.52,0);pendant.add(pendantLight);", 'pendant light')
          repl("function setLamp(on){lampOn=on;deskSpot.intensity=on?38:0;shade.material=on?mat.lampShadeOn:mat.lampShade;}", "function setLamp(on){lampOn=on;deskSpot.intensity=on?52:0;shade.material=on?mat.lampShadeOn:mat.lampShade;}", 'desk lamp intensity')
          repl("  const hemi=new THREE.HemisphereLight(0xe8f1f4,0x665b49,.46);scene.add(hemi);", "  const hemi=new THREE.HemisphereLight(0xe8f1f4,0x665b49,.30);scene.add(hemi);", 'hemi')
          repl("  const sun=new THREE.DirectionalLight(0xffedcf,1.82);", "  const sun=new THREE.DirectionalLight(0xffedcf,2.12);", 'sun')
          repl("  const windowFill=new THREE.RectAreaLight(0xcfeaff,3.7,1.6,1.2);", "  const windowFill=new THREE.RectAreaLight(0xcfeaff,2.35,1.6,1.2);", 'window fill')
          repl("  const bounce=new THREE.PointLight(0xffd7b0,1.15,6,2);", "  const bounce=new THREE.PointLight(0xffd7b0,.70,6,2);", 'bounce')

          old_reset="""  function resetView(){
    const mobile = innerWidth < 620 || innerHeight > innerWidth * 1.45;
    camera.position.set(mobile ? 5.35 : 6.15, mobile ? 3.05 : 3.55, mobile ? 6.35 : 6.75);
    controls.target.set(.05,1.15,-.15);
    controls.update();
  }"""
          new_reset="""  function resetView(){
    const mobile = portraitLayout();
    camera.fov = mobile ? 54 : 47;
    controls.maxDistance = mobile ? 13.5 : 10.0;
    camera.position.set(...(mobile ? [6.45,4.95,7.35] : [5.85,3.65,6.30]));
    controls.target.set(.05,1.10,-.18);
    camera.updateProjectionMatrix();
    controls.update();
  }"""
          repl(old_reset,new_reset,'reset view')

          old_resize="""  function resize(){
    const w=innerWidth,h=innerHeight;
    renderer.setSize(w,h,false);
    camera.aspect=w/h;
    camera.updateProjectionMatrix();
  }"""
          new_resize="""  function resize(){
    const w=innerWidth,h=innerHeight;
    renderer.setSize(w,h,false);
    camera.aspect=w/h;
    camera.fov=portraitLayout()?54:47;
    controls.maxDistance=portraitLayout()?13.5:10.0;
    camera.updateProjectionMatrix();
  }"""
          repl(old_resize,new_resize,'resize')
          p.write_text(s)
          PY
          (cd /tmp/room-v4/site && zip -qr /tmp/room-v4/output/chatgpt_room_final.zip .)

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install browser audit dependencies
        run: |
          cd /tmp/room-v4
          npm init -y >/dev/null 2>&1
          npm install playwright@latest pngjs@latest
          npx playwright install --with-deps chromium

      - name: Serve room
        run: |
          cd /tmp/room-v4/site
          python3 -m http.server 4176 --bind 127.0.0.1 >/tmp/room-v4-http.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4176/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/room-v4-http.log
          exit 1

      - name: Render and interact in Chromium
        run: |
          cat >/tmp/room-v4/capture.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          import path from 'node:path';
          import { PNG } from 'pngjs';

          const out='/tmp/room-v4/output';
          const cases=[]; let fatal=false;
          function analyzePng(file){
            const png=PNG.sync.read(fs.readFileSync(file));
            let sum=0,sum2=0,min=255,max=0,n=0;
            const step=Math.max(1,Math.floor((png.width*png.height)/50000));
            for(let p=0;p<png.width*png.height;p+=step){
              const i=p*4,y=.2126*png.data[i]+.7152*png.data[i+1]+.0722*png.data[i+2];
              sum+=y;sum2+=y*y;min=Math.min(min,y);max=Math.max(max,y);n++;
            }
            const mean=sum/n,variance=Math.max(0,sum2/n-mean*mean);
            return {width:png.width,height:png.height,meanLuma:+mean.toFixed(2),stdLuma:+Math.sqrt(variance).toFixed(2),minLuma:+min.toFixed(2),maxLuma:+max.toFixed(2)};
          }
          const browser=await chromium.launch({headless:true,args:['--use-angle=swiftshader','--enable-webgl','--ignore-gpu-blocklist','--disable-dev-shm-usage','--disable-gpu-vsync']});
          async function snap(page,file){const f=path.join(out,file);await page.screenshot({path:f,fullPage:false,timeout:90000});return analyzePng(f);}
          async function inspect(name,viewport,mobile=false){
            const context=await browser.newContext({viewport,deviceScaleFactor:1,isMobile:mobile,hasTouch:mobile});
            const page=await context.newPage();page.setDefaultTimeout(90000);const events=[];
            page.on('console',m=>events.push({type:`console:${m.type()}`,text:m.text()}));
            page.on('pageerror',e=>{events.push({type:'pageerror',text:e.message});fatal=true;});
            page.on('requestfailed',r=>events.push({type:'requestfailed',text:`${r.url()} :: ${r.failure()?.errorText||''}`}));
            await page.goto('http://127.0.0.1:4176/',{waitUntil:'networkidle',timeout:90000});await page.waitForTimeout(2400);
            const runtime=await page.evaluate(()=>{const c=document.querySelector('#scene'),e=document.querySelector('#error'),r=document.querySelector('#resetView');let gl=null;try{gl=c?.getContext('webgl2')||c?.getContext('webgl')}catch(_){}return {canvasWidth:c?.width||0,canvasHeight:c?.height||0,errorVisible:e?!e.hidden:null,errorText:e?.textContent||'',resetVisible:!!r&&getComputedStyle(r).display!=='none',webgl:!!gl};});
            if(runtime.errorVisible||!runtime.webgl||runtime.canvasWidth<2||runtime.canvasHeight<2)fatal=true;
            const shots={};shots.initial=await snap(page,`${name}-initial.png`);
            if(!mobile){
              const x=Math.round(viewport.width*.56),y=Math.round(viewport.height*.50);await page.mouse.move(x,y);await page.mouse.down();await page.mouse.move(x-135,y+28,{steps:12});await page.mouse.up();await page.waitForTimeout(500);shots.orbited=await snap(page,`${name}-orbited.png`);
              await page.keyboard.press('KeyL');await page.waitForTimeout(450);shots.lamp=await snap(page,`${name}-lamp-on.png`);await page.keyboard.press('KeyR');await page.waitForTimeout(450);shots.reset=await snap(page,`${name}-reset.png`);
            } else {await page.locator('#resetView').tap();await page.waitForTimeout(350);shots.reset=await snap(page,`${name}-reset.png`);}
            const meaningful=Object.values(shots).every(s=>s.stdLuma>8&&(s.maxLuma-s.minLuma)>50);if(!meaningful)fatal=true;
            cases.push({name,viewport,mobile,runtime,shots,meaningful,events});await context.close();
          }
          await inspect('desktop-1280x800',{width:1280,height:800},false);
          await inspect('mobile-393x873',{width:393,height:873},true);
          await inspect('mobile-landscape-873x393',{width:873,height:393},true);
          await browser.close();
          fs.writeFileSync(path.join(out,'report.json'),JSON.stringify({fatal,cases},null,2));
          fs.writeFileSync(path.join(out,'browser.log'),cases.flatMap(x=>x.events.map(e=>`[${x.name}] ${e.type}: ${e.text}`)).join('\n'));
          if(fatal)process.exitCode=2;
          EOF
          cd /tmp/room-v4 && node capture.mjs

      - name: Save V4 evidence
        if: always()
        run: |
          rm -rf room-visual-audit/v4-output
          mkdir -p room-visual-audit/v4-output
          cp -f /tmp/room-v4/output/* room-visual-audit/v4-output/ 2>/dev/null || true
          cp -f /tmp/room-v4-http.log room-visual-audit/v4-output/http.log 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add room-visual-audit/v4-output
          if ! git diff --cached --quiet; then
            git commit -m "chore: update final room visual audit [skip ci]"
            git push origin HEAD:room-visual-audit
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: room-v4-visual-audit-final
          path: room-visual-audit/v4-output
          if-no-files-found: warn
