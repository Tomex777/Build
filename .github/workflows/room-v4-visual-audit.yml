name: Room V4 Visual Audit

on:
  workflow_dispatch:
  push:
    branches:
      - room-visual-audit
    paths:
      - room-visual-audit/refine-v4.py
      - room-visual-audit/capture-v4.mjs
      - room-visual-audit/v3-src/**
      - .github/workflows/room-v4-visual-audit.yml

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: room-visual-audit

      - name: Prepare source
        run: |
          rm -rf /tmp/room-v4
          mkdir -p /tmp/room-v4/site/src /tmp/room-v4/output
          cp room-visual-audit/v3-src/index.html /tmp/room-v4/site/index.html
          cp room-visual-audit/v3-src/room.css /tmp/room-v4/site/room.css
          cat room-visual-audit/v3-src/src/main.part1.js room-visual-audit/v3-src/src/main.part2.js > /tmp/room-v4/site/src/main.js
          python3 room-visual-audit/refine-v4.py
          cd /tmp/room-v4/site
          zip -qr /tmp/room-v4/output/chatgpt_room_final.zip .

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install browser
        run: |
          cd /tmp/room-v4
          npm init -y >/dev/null 2>&1
          npm install playwright@latest pngjs@latest
          npx playwright install --with-deps chromium

      - name: Serve
        run: |
          cd /tmp/room-v4/site
          python3 -m http.server 4176 --bind 127.0.0.1 >/tmp/room-v4-http.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4176/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/room-v4-http.log
          exit 1

      - name: Render and inspect
        run: |
          cp room-visual-audit/capture-v4.mjs /tmp/room-v4/capture.mjs
          cd /tmp/room-v4
          node capture.mjs

      - name: Save evidence
        if: always()
        run: |
          rm -rf room-visual-audit/v4-output
          mkdir -p room-visual-audit/v4-output
          cp -f /tmp/room-v4/output/* room-visual-audit/v4-output/ 2>/dev/null || true
          cp -f /tmp/room-v4-http.log room-visual-audit/v4-output/http.log 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add room-visual-audit/v4-output
          if ! git diff --cached --quiet; then
            git commit -m 'chore: update final room visual audit [skip ci]'
            git push origin HEAD:room-visual-audit
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: room-v4-visual-audit-final
          path: room-visual-audit/v4-output
          if-no-files-found: warn
