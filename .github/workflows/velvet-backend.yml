name: Velvet · Backend pairing checks
on:
  push:
    branches: ["velvet-android-foundation"]
    paths: ["velvet/backend/**", ".github/workflows/velvet-backend.yml"]
  workflow_dispatch:

# Avoid wasting build minutes on superseded commits to this alpha branch.
concurrency:
  group: velvet-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pairing-security:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client
      - name: Apply schema and test auth fixture
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f velvet/backend/tests/bootstrap.sql
          for migration in velvet/backend/supabase/migrations/*.sql; do
            echo "Applying $migration"
            psql -v ON_ERROR_STOP=1 -f "$migration"
          done
      - name: Test pairing, rate limits and RLS
        run: psql -v ON_ERROR_STOP=1 -f velvet/backend/tests/pairing.sql
      - name: Test paired text messaging and isolation
        run: psql -v ON_ERROR_STOP=1 -f velvet/backend/tests/messages.sql
      - name: Test chat history cursor and isolation
        run: psql -v ON_ERROR_STOP=1 -f velvet/backend/tests/history.sql
      - name: Test owner-only profiles and partner display
        run: psql -v ON_ERROR_STOP=1 -f velvet/backend/tests/profiles.sql
      - name: Test shared relationship anniversary
        run: psql -v ON_ERROR_STOP=1 -f velvet/backend/tests/anniversary.sql
      - name: Test text edits, delete semantics and mutation feed
        run: psql -v ON_ERROR_STOP=1 -f velvet/backend/tests/message_actions.sql
      - name: Test private image storage and chat messages
        run: psql -v ON_ERROR_STOP=1 -f velvet/backend/tests/images.sql
      - name: Test mixed-chat pagination after large offline backlog
        run: psql -v ON_ERROR_STOP=1 -f velvet/backend/tests/chat_cursor_flood.sql
      - name: Test connected Chat Info gallery and search
        run: psql -v ON_ERROR_STOP=1 -f velvet/backend/tests/chat_info.sql
      - name: Test private and monotonic read acknowledgments
        run: psql -v ON_ERROR_STOP=1 -f velvet/backend/tests/read_receipts.sql
      - name: Test private AAC voice notes and two-person authorization
        run: psql -v ON_ERROR_STOP=1 -f velvet/backend/tests/voice_notes.sql
      - name: Test private Chat Info audio gallery pagination
        run: psql -v ON_ERROR_STOP=1 -f velvet/backend/tests/chat_audio_gallery.sql
      - name: Test private coupled MP4 video messages
        run: psql -v ON_ERROR_STOP=1 -f velvet/backend/tests/video_chat.sql
      - name: Test pair-private video gallery history
        run: psql -v ON_ERROR_STOP=1 -f velvet/backend/tests/video_gallery.sql
      - name: Test online game validation and explicit Story isolation
        run: psql -v ON_ERROR_STOP=1 -f velvet/backend/tests/connected_games_story.sql
