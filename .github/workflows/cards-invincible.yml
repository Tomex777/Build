name: NIGHT Invincible Card Candidates

on:
  push:
    branches: [feature/cards-invincible-20261021]
    paths:
      - 'cards/catalog/invincible*'
      - 'cards/bin/seed-invincible.mjs'
      - 'cards/bin/invincible-gallery.mjs'
      - 'cards/tests/invincible-sources.test.mjs'
      - '.github/workflows/cards-invincible.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: night-invincible-${{ github.ref }}
  cancel-in-progress: false

jobs:
  create-candidates:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    defaults:
      run:
        working-directory: cards
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: cards/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Acquire actual official character art, verify alpha and pin source hashes
        run: node bin/seed-invincible.mjs --write-lock
      - name: Run all unit and source/form tests
        run: npm test
      - name: Install Chromium OS libraries
        run: npx playwright install-deps chromium
      - name: Install exact NIGHT renderer Chrome 131
        run: |
          curl --fail --location --retry 3 https://storage.googleapis.com/chrome-for-testing-public/131.0.6778.204/linux64/chrome-headless-shell-linux64.zip -o "$RUNNER_TEMP/night-chrome.zip"
          unzip -q "$RUNNER_TEMP/night-chrome.zip" -d "$RUNNER_TEMP/night-browser"
          chmod +x "$RUNNER_TEMP/night-browser/chrome-headless-shell-linux64/chrome-headless-shell"
          echo "NIGHT_BROWSER_PATH=$RUNNER_TEMP/night-browser/chrome-headless-shell-linux64/chrome-headless-shell" >> "$GITHUB_ENV"
      - name: Render all 3000 x 4800 original NIGHT masters with frame-break QA
        run: |
          npm run build -- --series invincible --width 3000 --out dist/invincible || {
            node -e "const fs=require('fs');const f='dist/invincible/build.json';if(fs.existsSync(f))console.error(JSON.stringify(JSON.parse(fs.readFileSync(f)).failures,null,2))"
            exit 1
          }
      - name: Export offline gallery from real card master previews
        run: npm run gallery -- --series invincible --out dist/invincible --file dist/NIGHT-Invincible-Collection.html
      - name: Apply Invincible gallery labels (no new templates)
        run: |
          node bin/invincible-gallery.mjs dist/invincible/index.html
          node bin/invincible-gallery.mjs dist/NIGHT-Invincible-Collection.html
      - name: Commit immutable source metadata only (art remains in the review artifact)
        if: success() && github.event_name == 'push'
        working-directory: .
        run: |
          git config user.name 'NIGHT Cards Provenance'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cards/catalog/invincible-source-lock.json cards/catalog/invincible.json cards/catalog/power/invincible.json
          if ! git diff --cached --quiet; then
            git commit -m "cards(invincible): pin official source fingerprints and proposed grades"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
      - name: Archive masters, SVG, actual phone proofs, gallery and audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NIGHT-Invincible-Actual-Candidate-Cards
          path: |
            cards/dist/invincible/
            cards/dist/NIGHT-Invincible-Collection.html
            cards/catalog/invincible-sources.json
            cards/catalog/invincible-source-lock.json
            cards/catalog/invincible.json
            cards/catalog/power/invincible.json
          if-no-files-found: warn
          retention-days: 21
          compression-level: 0
