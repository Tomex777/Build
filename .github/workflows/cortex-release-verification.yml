name: Cortex Release Verification

on:
  pull_request:
    branches: [cortex-production-finalization]
    paths:
      - 'cortex-android/**'
      - 'cortex-agent/**'
      - '.github/workflows/cortex-release-verification.yml'
      - '.github/workflows/cortex-release-finalization.yml'
  push:
    branches: [cortex-production-finalization]
    paths:
      - 'cortex-android/**'
      - 'cortex-agent/**'
      - '.github/workflows/cortex-release-verification.yml'
      - '.github/workflows/cortex-release-finalization.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Validate Cortex Agent integration
        run: |
          node --check cortex-agent/index.js
          node cortex-agent/account-controls-selftest.js
      - name: Install Android SDK 36
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - name: Verify release minification, JVM tests and instrumentation compilation
        run: gradle -p cortex-android :app:testDebugUnitTest :app:assembleRelease :app:assembleDebugAndroidTest --stacktrace
      - name: Ensure release APK was actually produced
        run: |
          test -s cortex-android/app/build/outputs/apk/release/app-release-unsigned.apk
          sha256sum cortex-android/app/build/outputs/apk/release/app-release-unsigned.apk
          echo "Unsigned release assembled and verified; production signing is separately gated."
