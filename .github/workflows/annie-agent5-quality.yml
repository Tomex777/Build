name: Annie Agent 5 chat and voice quality

on:
  push:
    branches: [annie-agent5-chat-voice-abr-20261022]
    paths:
      - 'annie-android/**'
      - '.github/workflows/annie-agent5-quality.yml'
  pull_request:
    branches: [annie-five-agent-recovery-20261022]
    paths:
      - 'annie-android/**'
      - '.github/workflows/annie-agent5-quality.yml'
  workflow_dispatch:

concurrency:
  group: annie-agent5-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chat-voice:
    name: Chat and voice Android API ${{ matrix.api }}
    runs-on: ubuntu-latest
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        api: [26, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g typescript@5.9.3
      - name: Enforce ABR and compile runtime and instrumented tests
        shell: bash
        run: |
          set -euo pipefail
          python3 annie-android/scripts/test-repair-contract.py
          python3 annie-android/ci/check-abr.py
          python3 annie-android/scripts/repair-m0b-merge.py
          sh annie-android/scripts/check-annie-types.sh
          gradle --no-daemon --stacktrace -p annie-android :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Install emulator and API image
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install emulator
          bash annie-android/ci/install-emulator-system-image.sh ${{ matrix.api }}
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Instrumented voice, dictation UI and chat keyboard acceptance
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -partition-size 4096
          script: |
            mkdir -p annie-android/build/agent5-evidence
            set +e
            timeout --signal=TERM --kill-after=20s 760s gradle --no-daemon --stacktrace -p annie-android :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.tomex777.annie.ChatInsetTest,com.tomex777.annie.AnnieVoiceTouchTargetsTest,com.tomex777.annie.AnnieVoiceGestureTest,com.tomex777.annie.AnnieVoiceRecordingTest,com.tomex777.annie.AnnieVoiceChatLifecycleTest
            status=$?
            adb pull /sdcard/Pictures/AnnieCI annie-android/build/agent5-evidence/screenshots-default || true
            adb shell wm size > annie-android/build/agent5-evidence/display-default.txt
            adb shell wm density >> annie-android/build/agent5-evidence/display-default.txt
            # Pixel 2 physical 1080px / 3px per dp = 360dp narrow-phone layout.
            # Exercise chat insets, per-chat drafts and voice playback a second time.
            adb shell wm density 480
            adb shell wm size > annie-android/build/agent5-evidence/display-360dp.txt
            adb shell wm density >> annie-android/build/agent5-evidence/display-360dp.txt
            timeout --signal=TERM --kill-after=20s 420s gradle --no-daemon --stacktrace -p annie-android :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.tomex777.annie.ChatInsetTest,com.tomex777.annie.AnnieVoiceTouchTargetsTest
            narrow_status=$?
            adb pull /sdcard/Pictures/AnnieCI annie-android/build/agent5-evidence/screenshots-360dp || true
            adb shell wm density reset
            adb logcat -d > annie-android/build/agent5-evidence/logcat.txt
            if [ "$status" -ne 0 ] || [ "$narrow_status" -ne 0 ]; then exit 1; fi
      - name: Upload tests and real screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: annie-agent5-api${{ matrix.api }}
          path: |
            annie-android/build/agent5-evidence/
            annie-android/app/build/test-results/
            annie-android/app/build/outputs/androidTest-results/
            annie-android/app/build/reports/androidTests/
          if-no-files-found: warn
          retention-days: 10
