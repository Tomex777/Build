name: Cubic Android CI

on:
  push:
    branches: [cubic-android-ci]
    paths:
      - 'cubic-android/**'
      - '.github/workflows/cubic-android-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'cubic-android/**'
      - '.github/workflows/cubic-android-ci.yml'
  workflow_dispatch:

concurrency:
  group: cubic-android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-api36:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'
      - name: Unit test and build universal APKs
        run: |
          gradle --no-daemon --stacktrace -p cubic-android :app:testDebugUnitTest :app:lintRelease :app:assembleDebug :app:assembleRelease -PcubicCiInstallableRelease=true
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: API 36 runtime proof
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          script: CUBIC_APK=cubic-android/app/build/outputs/apk/release/app-release.apk bash cubic-android/ci/run-emulator-tests.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cubic-api36-screenshots
          path: cubic-android/build/emulator-screenshots/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cubic-universal-debug-apk
          path: cubic-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cubic-ci-installable-release-apk
          path: cubic-android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  api26:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'
      - name: Build API 26 release candidate
        run: gradle --no-daemon --stacktrace -p cubic-android :app:assembleRelease -PcubicCiInstallableRelease=true
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: API 26 runtime proof
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 26
          target: google_apis
          arch: x86_64
          profile: pixel_2
          script: CUBIC_APK=cubic-android/app/build/outputs/apk/release/app-release.apk bash cubic-android/ci/run-emulator-tests.sh
