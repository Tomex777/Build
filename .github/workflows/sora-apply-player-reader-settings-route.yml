name: Apply Sora Player Reader Settings Route

on:
  push:
    branches: [sora-android-ci]
    paths:
      - 'sora-ci/player-reader-settings-route-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sora-android-ci
      - name: Wire Player and reader settings
        run: python3 sora-ci/apply-player-reader-settings-route.py
      - name: Verify route
        run: |
          grep -q 'onPlayerReader: () -> Unit' sora-overlay/app/src/main/java/com/night/sora/ui/screens/MoreScreen.kt
          grep -q 'AppScreen.PlayerReaderSettings' sora-overlay/app/src/main/java/com/night/sora/ui/SoraApp.kt
          grep -q 'PlayerReaderSettingsScreen' sora-overlay/app/src/main/java/com/night/sora/ui/SoraApp.kt
      - name: Commit route
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add sora-overlay/app/src/main/java/com/night/sora/ui/screens/MoreScreen.kt \
                  sora-overlay/app/src/main/java/com/night/sora/ui/SoraApp.kt
          git diff --cached --quiet && exit 0
          git commit -m 'wire default source settings into More'
          git push origin HEAD:sora-android-ci
