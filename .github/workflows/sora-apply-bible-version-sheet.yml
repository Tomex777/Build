name: Apply Sora Bible Version Sheet

on:
  push:
    branches: [sora-memes-bible-ci]
    paths:
      - 'sora-ci/bible-version-sheet-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sora-memes-bible-ci
      - name: Apply Bible version sheet
        run: python3 sora-ci/apply-bible-version-sheet.py
      - name: Verify Bible version sheet
        run: |
          grep -q 'Text("Select version"' sora-overlay/app/src/main/java/com/night/sora/ui/screens/BibleScreen.kt
          grep -q 'Text("Search versions"' sora-overlay/app/src/main/java/com/night/sora/ui/screens/BibleScreen.kt
          grep -q 'ModalBottomSheet' sora-overlay/app/src/main/java/com/night/sora/ui/screens/BibleScreen.kt
          ! grep -q 'DropdownMenu(' sora-overlay/app/src/main/java/com/night/sora/ui/screens/BibleScreen.kt
      - name: Commit Bible version sheet
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add sora-overlay/app/src/main/java/com/night/sora/ui/screens/BibleScreen.kt
          git diff --cached --quiet && exit 0
          git commit -m 'replace Bible version dropdown with searchable sheet'
          git push origin HEAD:sora-memes-bible-ci
