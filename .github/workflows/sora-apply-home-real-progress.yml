name: Apply Sora Home Real Progress

on:
  push:
    branches: [sora-android-ci]
    paths:
      - 'sora-ci/home-real-progress-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sora-android-ci
      - name: Apply truthful Home progress
        run: python3 sora-ci/apply-home-real-progress.py
      - name: Verify Home progress wiring
        run: |
          grep -q 'progressEntries: List<MediaProgressEntry>' sora-overlay/app/src/main/java/com/night/sora/ui/screens/HomeScreen.kt
          grep -q 'LinearProgressIndicator(progress = { entry.progress }' sora-overlay/app/src/main/java/com/night/sora/ui/screens/HomeScreen.kt
          grep -q 'onResumeProgress(entry)' sora-overlay/app/src/main/java/com/night/sora/ui/screens/HomeScreen.kt
          ! grep -q 'progress = { .62f }' sora-overlay/app/src/main/java/com/night/sora/ui/screens/HomeScreen.kt
          grep -q 'progressEntries = repository.mediaProgress' sora-overlay/app/src/main/java/com/night/sora/ui/SoraApp.kt
      - name: Commit Home progress
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add sora-overlay/app/src/main/java/com/night/sora/ui/screens/HomeScreen.kt \
                  sora-overlay/app/src/main/java/com/night/sora/ui/SoraApp.kt
          git diff --cached --quiet && exit 0
          git commit -m 'show real media progress on Sora Home'
          git push origin HEAD:sora-android-ci
