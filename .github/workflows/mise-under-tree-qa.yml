name: Mise Under Tree - Real Scene QA

on:
  push:
    branches: [mise-two-students-under-tree-20261018, integrate/mise-studio-completion-20261020]
    paths:
      - "artist-scene-studio/app/**"
      - "artist-scene-studio/scripts/**"
      - ".github/workflows/mise-under-tree-qa.yml"
  pull_request:
    branches: [integrate/mise-studio-completion-20261020]
    paths:
      - "artist-scene-studio/app/**"
      - "artist-scene-studio/scripts/**"
      - ".github/workflows/mise-under-tree-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # New environment QA epoch; do not wait behind an obsolete cancelled run.
  group: mise-terrain-v2-split-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actual-mise-render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api: [26, 36]
    steps:
      - uses: actions/checkout@v4
      - name: Restore checksum-verified real 3D GLB assets
        run: artist-scene-studio/scripts/fetch-test-assets.sh
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Validate scene serialization and separate rigs
        working-directory: artist-scene-studio
        run: gradle :app:testDebugUnitTest --stacktrace
      - name: Compile real Mise app and Android test
        working-directory: artist-scene-studio
        run: gradle :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
      - name: Enable Android emulator graphics acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Pose and capture the two classmates using Mise on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          working-directory: artist-scene-studio
          emulator-options: -no-window -gpu lavapipe -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash scripts/mise-under-tree-smoke.sh
      - name: Upload unaltered Mise screenshots and installable debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mise-under-tree-api${{ matrix.api }}-real-scene
          path: |
            artist-scene-studio/under-tree-proof/
            artist-scene-studio/mise-under-tree-test.log
            artist-scene-studio/app/build/outputs/apk/debug/*.apk
            artist-scene-studio/app/build/reports/tests/testDebugUnitTest/
            artist-scene-studio/app/build/outputs/androidTest-results/connected/
          if-no-files-found: warn
