name: NIGHT Channels Agent E independent QA

on:
  pull_request:
    paths:
      - 'night-play/channels/**'
      - '.github/workflows/night-channels-agent-e-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  independent-channels-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test harness
        run: npm install --no-save playwright@1.56.1
      - name: Test owner isolation and five real Chrome viewport renders
        run: node night-play/channels/qa/independent-browser.cjs
      - name: Upload evidence (including on failures)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: channels-agent-e-five-viewport-qa
          path: night-play/visual-output/channels-agent-e/
          if-no-files-found: warn
          retention-days: 14

  exact-verified-channel-name:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact WhatsApp name and emoji grapheme release gate
        run: node night-play/channels/qa/exact-channel-name.mjs

  cross-agent-a-config-review:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          ref: agentA/channels-controls-review-20261022
          path: agentA
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test harness
        run: npm install --no-save playwright@1.56.1
      - name: Independently exercise Agent A config in real Chrome
        run: node night-play/channels/qa/config-browser.cjs
        env:
          NIGHT_SOURCE_ROOT: agentA/night-play
      - name: Preserve five-size and review-flow screenshots, even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: channels-agent-e-config-branch-visuals
          path: night-play/visual-output/channels-agent-e/config/
          if-no-files-found: warn
          retention-days: 14

  cross-agent-b-curation-review:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          ref: agentB/channel-curation-news-20261022
          path: agentB
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Agent B curation against independent license/news regressions
        run: node night-play/channels/qa/curation-contract.cjs
        env:
          NIGHT_CURATION_ROOT: agentB/night-play/channels/curation
