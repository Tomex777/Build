name: Apply Sora Truthful AI Chat Foundation

on:
  push:
    branches: [sora-android-ci]
    paths:
      - 'sora-ci/ai-chat-truthful-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sora-android-ci
      - name: Apply truthful AI chat foundation
        run: python3 sora-ci/apply-ai-chat-truthful.py
      - name: Verify AI chat foundation
        run: |
          grep -q 'data class AiAttachment' sora-overlay/app/src/main/java/com/night/sora/model/Models.kt
          grep -q 'activeAiDraft' sora-overlay/app/src/main/java/com/night/sora/data/CoreRepository.kt
          grep -q 'KEY_AI_DRAFTS' sora-overlay/app/src/main/java/com/night/sora/data/CoreRepository.kt
          grep -q 'ActivityResultContracts.OpenDocument' sora-overlay/app/src/main/java/com/night/sora/ui/screens/AiScreen.kt
          grep -q 'AiFilesSurface' sora-overlay/app/src/main/java/com/night/sora/ui/screens/AiScreen.kt
          grep -q 'AI provider not connected' sora-overlay/app/src/main/java/com/night/sora/ui/screens/AiScreen.kt
          ! grep -q 'sendVoicePlaceholder' sora-overlay/app/src/main/java/com/night/sora/data/CoreRepository.kt
          ! grep -q 'VoiceComposer' sora-overlay/app/src/main/java/com/night/sora/ui/screens/AiScreen.kt
          ! grep -q 'DeepSeek · automatic tools' sora-overlay/app/src/main/java/com/night/sora/ui/screens/AiScreen.kt
      - name: Commit AI chat foundation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add sora-overlay/app/src/main/java/com/night/sora/model/Models.kt \
                  sora-overlay/app/src/main/java/com/night/sora/data/CoreRepository.kt \
                  sora-overlay/app/src/main/java/com/night/sora/ui/screens/AiScreen.kt \
                  sora-overlay/app/src/main/java/com/night/sora/ui/SoraApp.kt
          git diff --cached --quiet && exit 0
          git commit -m 'add persistent drafts and real AI chat attachments'
          git push origin HEAD:sora-android-ci
