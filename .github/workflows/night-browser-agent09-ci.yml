name: NIGHT Browser Agent 9 CI

on:
  push:
    branches: [agent/browser-09-peek-site-studio]
    paths:
      - 'night-browser/**'
      - '.github/workflows/night-browser-agent09-ci.yml'
  pull_request:
    branches: [feature/night-browser-multi-agent-20261020]
    paths:
      - 'night-browser/**'
      - '.github/workflows/night-browser-agent09-ci.yml'

concurrency:
  group: night-browser-agent09-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-37.1 build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'
      - name: Test packaged Site Studio content script and manifest
        run: node --test night-browser/ci/site-studio-extension-test.cjs
      - name: Unit test and assemble APK (not device verification)
        run: gradle --no-daemon --stacktrace -p night-browser :app:testDebugUnitTest :app:assembleDebug
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: night-browser-agent09-arm64-debug
          path: night-browser/app/build/outputs/apk/debug/app-arm64-v8a-debug.apk
          if-no-files-found: error
