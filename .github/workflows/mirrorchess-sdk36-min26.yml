name: MirrorChess SDK 36 min 26

on:
  push:
    branches:
      - mirrorchess-sdk36-min26-20260922
  pull_request:
    branches:
      - verify/mirrorchess-v12-20260909
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mirrorchess-v12/source

    steps:
      - uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android 36 platform
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Verify SDK baseline
        run: |
          grep -q 'compileSdk = 36' app/build.gradle.kts
          grep -q 'minSdk = 26' app/build.gradle.kts
          grep -q 'targetSdk = 36' app/build.gradle.kts

      - name: Test, lint, and assemble
        run: |
          chmod +x gradlew scripts/run-core-smoke.sh
          ./scripts/run-core-smoke.sh
          ./gradlew --no-daemon             :app:testDebugUnitTest             :app:lintDebug             :app:assembleDebug             --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mirrorchess-sdk36-min26-apk
          retention-days: 14
          path: mirrorchess-v12/source/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mirrorchess-sdk36-min26-reports
          retention-days: 14
          if-no-files-found: ignore
          path: |
            mirrorchess-v12/source/app/build/reports/
            mirrorchess-v12/source/app/build/test-results/

  runtime-smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api-level: [26, 36]

    steps:
      - uses: actions/checkout@v5

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: mirrorchess-sdk36-min26-apk
          path: apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"'             | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: API ${{ matrix.api-level }} launch smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: |
            adb install -r apk/app-debug.apk
            adb logcat -c
            adb shell am force-stop com.night.mirrorchess
            adb shell am start -W -n com.night.mirrorchess/.MainActivity | tee launch.txt
            grep -q 'Status: ok' launch.txt
            sleep 8
            adb shell pidof com.night.mirrorchess | tee pid.txt
            test -s pid.txt
            adb logcat -d > logcat.txt
            if grep -A 50 'FATAL EXCEPTION' logcat.txt | grep -q 'com.night.mirrorchess'; then
              echo "MirrorChess crashed on API ${{ matrix.api-level }}" >&2
              exit 1
            fi
            adb exec-out screencap -p > mirrorchess-api-${{ matrix.api-level }}.png

      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mirrorchess-runtime-api-${{ matrix.api-level }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            launch.txt
            pid.txt
            logcat.txt
            mirrorchess-api-${{ matrix.api-level }}.png
