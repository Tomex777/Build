name: MirrorChess SDK 36 min 26

on:
  push:
    branches:
      - mirrorchess-sdk36-min26-20260922
  pull_request:
    branches:
      - verify/mirrorchess-v12-20260909
  workflow_dispatch:

concurrency:
  group: mirrorchess-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mirrorchess-v12/source

    steps:
      - uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android 36 platform
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Verify SDK baseline
        run: |
          grep -q 'compileSdk = 36' app/build.gradle.kts
          grep -q 'minSdk = 26' app/build.gradle.kts
          grep -q 'targetSdk = 36' app/build.gradle.kts

      - name: Test, lint, and assemble debug
        run: |
          chmod +x gradlew scripts/run-core-smoke.sh
          ./scripts/run-core-smoke.sh
          ./gradlew --no-daemon \
            :app:testDebugUnitTest \
            :app:lintDebug \
            :app:assembleDebug \
            --stacktrace

      - name: Build release artifacts
        run: |
          mkdir -p release-artifacts
          ./gradlew --no-daemon \
            :app:lintRelease \
            :app:bundleRelease \
            --stacktrace
          cp app/build/outputs/bundle/release/app-release.aab \
            release-artifacts/MirrorChess-1.2.0-release-unsigned.aab

          ./gradlew --no-daemon \
            :app:assembleRelease \
            -PmirrorChessAbi=arm64-v8a \
            -PmirrorChessCiInstallableRelease=true \
            --stacktrace
          cp app/build/outputs/apk/release/app-release.apk \
            release-artifacts/MirrorChess-1.2.0-arm64-v8a-release-debugsigned.apk

          ./gradlew --no-daemon \
            :app:assembleRelease \
            -PmirrorChessAbi=x86_64 \
            -PmirrorChessCiInstallableRelease=true \
            --stacktrace
          cp app/build/outputs/apk/release/app-release.apk \
            release-artifacts/MirrorChess-1.2.0-x86_64-release-debugsigned.apk

          cat > release-artifacts/SIGNING-NOTE.txt <<'EOF'
          MirrorChess production signing credentials are not stored in this repository.
          The APKs in this CI artifact are release-mode builds signed with the standard
          Android debug signing configuration solely so CI/device installation can be
          tested. Re-sign the ARM64 APK, or sign the AAB, with the production key before
          public distribution.
          EOF
          (
            cd release-artifacts
            sha256sum MirrorChess-1.2.0-* > SHA256SUMS.txt
            cat SHA256SUMS.txt
          )

      - name: Verify release package contents
        run: |
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/apkanalyzer" manifest application-id             release-artifacts/MirrorChess-1.2.0-arm64-v8a-release-debugsigned.apk | grep -qx 'com.night.mirrorchess'
          unzip -l release-artifacts/MirrorChess-1.2.0-arm64-v8a-release-debugsigned.apk             | grep -q 'lib/arm64-v8a/'
          if unzip -l release-artifacts/MirrorChess-1.2.0-arm64-v8a-release-debugsigned.apk             | grep -q 'lib/x86_64/'; then
            echo "ARM64 artifact unexpectedly contains x86_64 native libraries" >&2
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mirrorchess-sdk36-min26-apk
          retention-days: 14
          path: mirrorchess-v12/source/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mirrorchess-1.2.0-release-artifacts
          retention-days: 30
          path: mirrorchess-v12/source/release-artifacts/

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mirrorchess-sdk36-min26-reports
          retention-days: 14
          if-no-files-found: ignore
          path: |
            mirrorchess-v12/source/app/build/reports/
            mirrorchess-v12/source/app/build/test-results/

  runtime-smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api-level: [26, 36]

    steps:
      - uses: actions/checkout@v5

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: mirrorchess-sdk36-min26-apk
          path: apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"'             | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install feature-test image tools
        if: matrix.api-level == 36
        run: python3 -m pip install --user pillow

      - name: API ${{ matrix.api-level }} launch smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -memory 4096
          script: |
            adb install -r apk/app-debug.apk
            # API 36 emulator images can surface a Launcher3/Quickstep ANR over
            # the foreground app. Suppress system error modals on both fixtures;
            # MirrorChess crashes/ANRs are verified explicitly from logcat below.
            adb shell settings put global hide_error_dialogs 1 || true
            adb logcat -c || true
            adb shell am force-stop com.night.mirrorchess
            adb shell am start -W -n com.night.mirrorchess/.MainActivity | tee launch.txt
            grep -q 'Status: ok' launch.txt
            sleep 8
            adb shell pidof com.night.mirrorchess | tee pid.txt
            test -s pid.txt
            adb logcat -d > logcat.txt
            if grep -A 50 'FATAL EXCEPTION' logcat.txt | grep -q 'com.night.mirrorchess'; then echo "MirrorChess crashed on API ${{ matrix.api-level }}" >&2; exit 1; fi
            if grep -Eq 'ANR in com\.night\.mirrorchess|Application Not Responding: com\.night\.mirrorchess|am_anr.*com\.night\.mirrorchess' logcat.txt; then echo "MirrorChess ANR on API ${{ matrix.api-level }}" >&2; exit 1; fi
            adb exec-out screencap -p > mirrorchess-api-${{ matrix.api-level }}.png
            bash .github/scripts/piece-system-acceptance.sh
            adb exec-out screencap -p > mirrorchess-piece-acceptance-final.png

      - name: Curate portfolio screenshots
        if: matrix.api-level == 36
        run: |
          mkdir -p portfolio
          cp mirrorchess-api-36.png portfolio/mirrorchess-home.png
          cp mirrorchess-piece-acceptance-piece-creator-zoom.png portfolio/mirrorchess-custom-pieces.png
          cp mirrorchess-piece-acceptance-custom-set-on-board.png portfolio/mirrorchess-game.png
          cp mirrorchess-piece-acceptance-custom-set-capture.png portfolio/mirrorchess-capture.png
          cp mirrorchess-piece-acceptance-result-win.png portfolio/mirrorchess-victory.png
          cp mirrorchess-piece-acceptance-result-loss.png portfolio/mirrorchess-defeat.png
          cp mirrorchess-piece-acceptance-result-draw.png portfolio/mirrorchess-draw.png

      - name: Upload portfolio screenshots
        if: matrix.api-level == 36
        uses: actions/upload-artifact@v4
        with:
          name: mirrorchess-portfolio-screenshots
          retention-days: 30
          path: portfolio/

      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mirrorchess-runtime-api-${{ matrix.api-level }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            launch.txt
            pid.txt
            logcat.txt
            mirrorchess-api-${{ matrix.api-level }}.png
            mirrorchess-piece-acceptance-*.png
            piece-acceptance-*.xml
            piece-acceptance-log.txt
            piece-acceptance-logcat.txt


  release-smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api-level: [26, 36]

    steps:
      - uses: actions/checkout@v5

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: mirrorchess-1.2.0-release-artifacts
          path: release-artifacts

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: API ${{ matrix.api-level }} release install and lifecycle smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -memory 4096
          script: bash .github/scripts/release-smoke.sh "${{ matrix.api-level }}" "release-artifacts/MirrorChess-1.2.0-x86_64-release-debugsigned.apk"

      - name: Upload release smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mirrorchess-release-smoke-api-${{ matrix.api-level }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            release-launch.txt
            release-relaunch.txt
            release-pid.txt
            release-window.xml
            release-logcat.txt
            mirrorchess-release-home-api-${{ matrix.api-level }}.png
            mirrorchess-release-game-api-${{ matrix.api-level }}.png
