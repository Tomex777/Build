name: Night Portfolio Browser QA

on:
  push:
    branches: [night-portfolio-site]
    paths:
      - 'portfolio/**'
      - '.github/workflows/night-portfolio-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: night-portfolio-browser-qa
  cancel-in-progress: true

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: night-portfolio-site

      - name: Static source gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path("portfolio/index.html").read_text()
          assert html.startswith("<!doctype html>")
          expected = ["nami","mira","cortex","mirrorchess","endless","aod"]
          found = re.findall(r'"slug":"([^"]+)"', html)[:6]
          assert found == expected, (found, expected)
          for stale in ("homira","nomi","anira","liminal"):
              assert f'"slug":"{stale}"' not in html
          for src in re.findall(r'"(?:src|preview)":"(assets/[^"]+)"', html):
              assert Path("portfolio", src).is_file(), src
          assert Path("portfolio/vercel.json").is_file()
          PY
          node - <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('portfolio/index.html','utf8');
          const m=html.match(/<script>([\s\S]*?)<\/script>/);
          if(!m) throw new Error('script tag missing');
          new Function(m[1]);
          console.log('Portfolio script syntax OK');
          NODE

      - name: Install Playwright
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Start SPA test server
        shell: bash
        run: |
          cat > /tmp/night_spa_server.py <<'PY'
          import os
          from http.server import ThreadingHTTPServer, SimpleHTTPRequestHandler
          from urllib.parse import urlsplit

          ROOT=os.path.abspath("portfolio")
          class H(SimpleHTTPRequestHandler):
              def translate_path(self, path):
                  clean=urlsplit(path).path
                  rel=clean.lstrip("/")
                  full=os.path.join(ROOT, rel)
                  if os.path.isfile(full):
                      return full
                  if os.path.isdir(full) and os.path.isfile(os.path.join(full,"index.html")):
                      return os.path.join(full,"index.html")
                  return os.path.join(ROOT,"index.html")
              def log_message(self, fmt, *args):
                  pass
          ThreadingHTTPServer(("127.0.0.1",4173),H).serve_forever()
          PY
          python /tmp/night_spa_server.py >/tmp/night-server.log 2>&1 &
          echo $! >/tmp/night-server.pid
          for i in {1..20}; do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep .25
          done
          exit 1

      - name: Browser acceptance
        shell: bash
        run: |
          cat > /tmp/night-qa.cjs <<'NODE'
          const { chromium } = require('playwright');

          const projects = ['nami','mira','cortex','mirrorchess','endless','aod'];
          const expectedTitles = {
            nami:'Nami — Night', mira:'Mira — Night', cortex:'Cortex — Night',
            mirrorchess:'MirrorChess — Night', endless:'Endless — Night', aod:'AOD — Night'
          };

          (async()=>{
            const browser=await chromium.launch({headless:true});
            const contexts=[
              {name:'desktop',viewport:{width:1440,height:900}},
              {name:'mobile',viewport:{width:412,height:915}}
            ];

            for(const spec of contexts){
              const ctx=await browser.newContext({viewport:spec.viewport});
              const page=await ctx.newPage();
              const pageErrors=[];
              page.on('pageerror',e=>pageErrors.push(String(e)));
              page.on('console',m=>{if(m.type()==='error') pageErrors.push('console: '+m.text())});

              await page.goto('http://127.0.0.1:4173/',{waitUntil:'networkidle'});
              await page.locator('#intro').evaluate(el=>el.remove()).catch(()=>{});
              await page.evaluate(()=>document.body.classList.remove('boot'));
              const names=await page.locator('.card h3').allTextContents();
              if(JSON.stringify(names)!==JSON.stringify(['Nami','Mira','Cortex','MirrorChess','Endless','AOD']))
                throw new Error(spec.name+' project order '+JSON.stringify(names));

              for(const slug of projects){
                await page.goto('http://127.0.0.1:4173/projects/'+slug+'/',{waitUntil:'networkidle'});
                await page.locator('#intro').evaluate(el=>el.remove()).catch(()=>{});
                await page.evaluate(()=>document.body.classList.remove('boot'));
                if((await page.title())!==expectedTitles[slug]) throw new Error(spec.name+' bad title '+slug);
                if(await page.locator('.download-panel').count()!==1) throw new Error(spec.name+' download panel '+slug);
                if(await page.locator('.shots .shot').count()!==4) throw new Error(spec.name+' screenshot count '+slug);
                const universal=await page.locator('.download-actions a').first().getAttribute('href');
                if(!universal || !universal.includes('github.com/Tomex777/Build/releases/download/'))
                  throw new Error(spec.name+' bad download '+slug+' '+universal);
                const badImgs=await page.locator('.shots img').evaluateAll(imgs=>imgs.filter(i=>!i.complete||i.naturalWidth<1).map(i=>i.getAttribute('src')));
                if(badImgs.length) throw new Error(spec.name+' broken images '+slug+' '+badImgs.join(','));
              }
              if(pageErrors.length) throw new Error(spec.name+' browser errors: '+pageErrors.join(' | '));
              await ctx.close();
            }
            await browser.close();
            console.log('Night portfolio browser QA passed on desktop and mobile');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node /tmp/night-qa.cjs
