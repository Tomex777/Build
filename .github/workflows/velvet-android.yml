name: Velvet · Android Debug APK
on:
  push:
    branches: ["velvet-android-foundation"]
    paths: ["velvet/android/**", ".github/workflows/velvet-android.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify Android SDK
        run: echo "Using Android SDK at $ANDROID_HOME"
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: velvet/android
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload Velvet APK
        uses: actions/upload-artifact@v4
        with:
          name: velvet-native-debug
          path: velvet/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
