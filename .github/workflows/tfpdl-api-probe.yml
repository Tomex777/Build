name: TFPDL route-shape probe

on:
  push:
    paths:
      - ".github/workflows/tfpdl-api-probe.yml"
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Compare route shapes across content
        shell: bash
        run: |
          python3 - <<'PY'
          import json, html, urllib.request
          from html.parser import HTMLParser
          from urllib.parse import urlparse, parse_qs, quote

          UA={"User-Agent":"Mozilla/5.0"}

          def getj(url):
              req=urllib.request.Request(url, headers=UA)
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.load(r)

          class P(HTMLParser):
              def __init__(self):
                  super().__init__(); self.links=[]
              def handle_starttag(self, tag, attrs):
                  if tag.lower()=="a":
                      href=dict(attrs).get("href")
                      if href: self.links.append(href)

          for q in ["Naruto","Lanterns","One Piece"]:
              print("\n===", q, "===")
              sr=getj("https://tfpdl.com/wp-json/wp/v2/search?search="+quote(q)+"&per_page=1")
              if not sr:
                  print("NO_RESULT"); continue
              rid=sr[0]["id"]
              post=getj(f"https://tfpdl.com/wp-json/wp/v2/posts/{rid}")
              p=P(); p.feed(post.get("content",{}).get("rendered",""))
              wrappers=[]
              external=[]
              for h in p.links:
                  u=urlparse(html.unescape(h))
                  if u.path.rstrip("/").endswith("/tfpdl"):
                      wrappers.append(h)
                  elif u.scheme in ("http","https") and u.netloc not in ("tfp.re","tfpdl.com","www.tfpdl.com"):
                      external.append(h)
              print("id=",rid)
              print("title=",html.unescape(post.get("title",{}).get("rendered","")))
              print("wrapper_count=",len(wrappers))
              for h in wrappers[:5]:
                  u=urlparse(h); keys=list(parse_qs(u.query).keys())
                  print("wrapper host=",u.netloc,"path=",u.path,"query_keys=",keys)
              print("external_anchor_hosts=",sorted(set(urlparse(x).netloc for x in external)))
          PY
