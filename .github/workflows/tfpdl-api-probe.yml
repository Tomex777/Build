name: TFPDL API probe

on:
  push:
    paths:
      - ".github/workflows/tfpdl-api-probe.yml"
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe TFPDL API endpoints
        shell: bash
        run: |
          set +e
          for url in             "https://tfpdl.com/wp-json/"             "https://tfpdl.com/wp-json/wp/v2/posts?per_page=2"             "https://tfpdl.com/wp-json/wp/v2/search?search=naruto&per_page=2"             "https://tfpdl.com/?rest_route=/wp/v2/posts&per_page=2"
          do
            echo "============================================================"
            echo "URL: $url"
            curl -L --max-time 30 --connect-timeout 10 -A "Mozilla/5.0" -sS -D /tmp/h -o /tmp/b -w "HTTP_STATUS=%{http_code}\n" "$url"
            echo "--- headers ---"
            grep -Ei '^(content-type|server|location|cf-ray|x-|via):' /tmp/h || true
            echo "--- body first 1000 bytes ---"
            head -c 1000 /tmp/b || true
            echo
          done
