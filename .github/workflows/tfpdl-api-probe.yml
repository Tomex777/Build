name: TFPDL wrapper trace

on:
  push:
    paths:
      - ".github/workflows/tfpdl-api-probe.yml"
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Trace one wrapper without downloading media
        shell: bash
        run: |
          set +e
          URL='https://tfp.re/tfpdl?d048c7b91a=YlF6aUt4SGEyU2dJK0xBdC9oMVRQSUQ3bWN2NStiMlZxTnJlRmFSRnBQYUdsK09yRHkzT3djUW5kZ21sdENsYXU5bVZmQmRXYUhWN3ltQ0phNGlmUVE9PQ=='
          REF='https://tfp.re/lanterns-s01-2160p-web-dl-ddp5-1-dv-hdr-x265-tfpdl/'
          curl --http1.1 -sS --max-time 30 --connect-timeout 10             -A 'Mozilla/5.0 (Linux; Android 16) AppleWebKit/537.36 Chrome/140 Mobile Safari/537.36'             -e "$REF"             -D /tmp/h -o /tmp/b -w 'HTTP_STATUS=%{http_code}\nFINAL_URL=%{url_effective}\n' "$URL"
          echo '--- HEADERS ---'
          cat /tmp/h
          echo '--- BODY SIZE ---'
          wc -c /tmp/b
          echo '--- BODY SAMPLE ---'
          head -c 1600 /tmp/b
          echo
