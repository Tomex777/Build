name: TFPDL download-route probe

on:
  push:
    paths:
      - ".github/workflows/tfpdl-api-probe.yml"
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Inspect post links
        shell: bash
        run: |
          python3 - <<'PY'
          import json, html, urllib.request
          from html.parser import HTMLParser
          from urllib.parse import urljoin

          api = "https://tfpdl.com/wp-json/wp/v2/posts/373753"
          req = urllib.request.Request(api, headers={"User-Agent":"Mozilla/5.0"})
          with urllib.request.urlopen(req, timeout=30) as r:
              post = json.load(r)

          print("POST_ID", post.get("id"))
          print("POST_LINK", post.get("link"))
          print("TITLE", html.unescape(post.get("title",{}).get("rendered","")))

          class P(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.links = []
                  self.cur = None
                  self.txt = []
              def handle_starttag(self, tag, attrs):
                  if tag.lower() == "a":
                      self.cur = dict(attrs).get("href")
                      self.txt = []
              def handle_data(self, data):
                  if self.cur is not None:
                      self.txt.append(data)
              def handle_endtag(self, tag):
                  if tag.lower() == "a" and self.cur is not None:
                      self.links.append((self.cur, " ".join("".join(self.txt).split())))
                      self.cur = None
                      self.txt = []

          p = P()
          p.feed(post.get("content",{}).get("rendered",""))
          print("\n=== ALL ANCHORS ===")
          seen = set()
          for i, (href, text) in enumerate(p.links, 1):
              full = urljoin(post.get("link","https://tfpdl.com/"), html.unescape(href))
              if (full, text) in seen:
                  continue
              seen.add((full, text))
              print(f"{i:02d}. [{text}] {full}")
          PY
