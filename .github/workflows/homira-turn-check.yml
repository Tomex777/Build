name: Homira TURN Relay Check

on:
  workflow_dispatch:
  push:
    branches: [homira-call-ci]
    paths:
      - '.github/workflows/homira-turn-check.yml'

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install browser probe
        run: python -m pip install --quiet selenium

      - name: Verify Cloudflare relay ICE candidate
        env:
          TURN_KEY_ID: ${{ secrets.HOMIRA_CLOUDFLARE_TURN_KEY_ID }}
          TURN_API_TOKEN: ${{ secrets.HOMIRA_CLOUDFLARE_TURN_API_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options

          key_id = os.environ.get("TURN_KEY_ID", "").strip()
          api_token = os.environ.get("TURN_API_TOKEN", "").strip()

          if not key_id or not api_token:
              print("Cloudflare TURN CI secrets are not configured; relay probe skipped.")
              raise SystemExit(0)

          request = urllib.request.Request(
              f"https://rtc.live.cloudflare.com/v1/turn/keys/{key_id}/credentials/generate-ice-servers",
              data=json.dumps({"ttl": 3600}).encode(),
              headers={
                  "Authorization": f"Bearer {api_token}",
                  "Content-Type": "application/json",
              },
              method="POST",
          )

          with urllib.request.urlopen(request, timeout=20) as response:
              payload = json.load(response)

          ice_servers = payload.get("iceServers", [])
          for server in ice_servers:
              urls = server.get("urls", [])
              if isinstance(urls, str):
                  urls = [urls]
              server["urls"] = [url for url in urls if ":53" not in url]

          options = Options()
          options.add_argument("--headless=new")
          options.add_argument("--no-sandbox")
          options.add_argument("--disable-dev-shm-usage")
          options.add_argument("--disable-gpu")

          driver = webdriver.Chrome(options=options)
          driver.set_script_timeout(35)
          try:
              driver.get("data:text/html,<html><body>Homira TURN probe</body></html>")
              result = driver.execute_async_script(
                  """
                  const iceServers = arguments[0];
                  const done = arguments[arguments.length - 1];
                  const pc = new RTCPeerConnection({
                    iceServers,
                    iceTransportPolicy: "relay"
                  });
                  const candidates = [];
                  let finished = false;

                  function finish(ok, error) {
                    if (finished) return;
                    finished = true;
                    try { pc.close(); } catch (_) {}
                    done({ ok, candidates, error: error || null });
                  }

                  pc.onicecandidate = (event) => {
                    if (event.candidate) {
                      candidates.push(event.candidate.candidate);
                      if (event.candidate.candidate.includes(" typ relay ")) {
                        finish(true, null);
                      }
                    } else if (pc.iceGatheringState === "complete") {
                      finish(candidates.some((c) => c.includes(" typ relay ")), null);
                    }
                  };

                  pc.onicecandidateerror = (event) => {
                    candidates.push(
                      "ICE_ERROR " +
                      (event.url || "") + " " +
                      (event.errorCode || "") + " " +
                      (event.errorText || "")
                    );
                  };

                  pc.createDataChannel("homira-turn-probe");
                  pc.createOffer()
                    .then((offer) => pc.setLocalDescription(offer))
                    .catch((error) => finish(false, String(error)));

                  setTimeout(() => {
                    finish(
                      candidates.some((c) => c.includes(" typ relay ")),
                      "timeout"
                    );
                  }, 25000);
                  """,
                  ice_servers,
              )

              print(json.dumps(result, indent=2))
              if not result.get("ok"):
                  raise SystemExit("No TURN relay candidate gathered")
          finally:
              driver.quit()
          PY
