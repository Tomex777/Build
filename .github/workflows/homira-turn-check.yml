name: Homira TURN Relay Check

on:
  workflow_dispatch:
  push:
    branches: [homira-call-ci]
    paths:
      - 'homira-turn/**'
      - '.github/workflows/homira-turn-check.yml'

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install browser probe
        run: python -m pip install --quiet selenium

      - name: Verify relay ICE candidates in Chromium
        run: |
          python - <<'PY'
          import base64
          import hashlib
          import hmac
          import json
          import time

          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options

          def relay_probe(name, ice_server):
              options = Options()
              options.add_argument("--headless=new")
              options.add_argument("--no-sandbox")
              options.add_argument("--disable-dev-shm-usage")
              options.add_argument("--disable-gpu")
              driver = webdriver.Chrome(options=options)
              driver.set_script_timeout(35)
              try:
                  driver.get("data:text/html,<html><body>Homira TURN probe</body></html>")
                  result = driver.execute_async_script(
                      """
                      const config = arguments[0];
                      const done = arguments[arguments.length - 1];
                      const pc = new RTCPeerConnection({
                        iceServers: [config],
                        iceTransportPolicy: "relay"
                      });
                      const candidates = [];
                      let finished = false;

                      function finish(ok, error) {
                        if (finished) return;
                        finished = true;
                        try { pc.close(); } catch (_) {}
                        done({ ok, candidates, error: error || null });
                      }

                      pc.onicecandidate = (event) => {
                        if (event.candidate) {
                          candidates.push(event.candidate.candidate);
                          if (event.candidate.candidate.includes(" typ relay ")) {
                            finish(true, null);
                          }
                        } else if (pc.iceGatheringState === "complete") {
                          finish(candidates.some((c) => c.includes(" typ relay ")), null);
                        }
                      };

                      pc.onicecandidateerror = (event) => {
                        candidates.push(
                          "ICE_ERROR " +
                          (event.url || "") + " " +
                          (event.errorCode || "") + " " +
                          (event.errorText || "")
                        );
                      };

                      pc.createDataChannel("homira-turn-probe");
                      pc.createOffer()
                        .then((offer) => pc.setLocalDescription(offer))
                        .catch((error) => finish(false, String(error)));

                      setTimeout(() => {
                        finish(
                          candidates.some((c) => c.includes(" typ relay ")),
                          "timeout"
                        );
                      }, 25000);
                      """,
                      ice_server,
                  )
                  print(name, json.dumps(result, indent=2))
                  if not result.get("ok"):
                      raise SystemExit(f"{name}: no relay candidate gathered")
              finally:
                  driver.quit()

          expires = int(time.time()) + 3600
          username = f"{expires}:homira-ci"
          credential = base64.b64encode(
              hmac.new(
                  b"openrelayprojectsecret",
                  username.encode(),
                  hashlib.sha1,
              ).digest()
          ).decode()

          relay_probe(
              "turn-rest",
              {
                  "urls": [
                      "turn:staticauth.openrelay.metered.ca:80",
                      "turn:staticauth.openrelay.metered.ca:80?transport=tcp",
                      "turns:staticauth.openrelay.metered.ca:443?transport=tcp",
                  ],
                  "username": username,
                  "credential": credential,
              },
          )
          PY
