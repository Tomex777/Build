name: Homira Mascot Inspect

on:
  push:
    branches: [homira-call-ci]
    paths:
      - '.github/workflows/homira-mascot-inspect.yml'
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Inspect mascot files
        run: |
          echo "=== companion PNG ==="
          file homira-android/app/src/main/res/drawable-nodpi/homira_call_companion.png
          ls -lh homira-android/app/src/main/res/drawable-nodpi/homira_call_companion.png
          echo "=== original WebP ==="
          file homira-android/app/src/main/res/drawable-nodpi/homira_call_mascot.webp
          ls -lh homira-android/app/src/main/res/drawable-nodpi/homira_call_mascot.webp
