name: Homira Auth Email Templates

on:
  push:
    branches: [homira-call-ci]
    paths:
      - 'homira-supabase/email-templates/**'
      - '.github/workflows/homira-auth-email-templates.yml'
  workflow_dispatch:

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: uhyeopkbamwtgjgeqlyj

    steps:
      - uses: actions/checkout@v5

      - name: Verify Supabase management token
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error::Missing repository secret SUPABASE_ACCESS_TOKEN"
            exit 1
          fi

      - name: Apply branded OTP templates
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY' > /tmp/auth-template-patch.json
          import json
          from pathlib import Path

          signup = Path("homira-supabase/email-templates/confirm-signup.html").read_text()
          returning = Path("homira-supabase/email-templates/magic-link-otp.html").read_text()

          print(json.dumps({
              "mailer_subjects_confirmation": "Your Homira verification code ✨",
              "mailer_templates_confirmation_content": signup,
              "mailer_subjects_magic_link": "Welcome back — your Homira code",
              "mailer_templates_magic_link_content": returning
          }))
          PY

          curl --fail-with-body --silent --show-error             -X PATCH "https://api.supabase.com/v1/projects/$PROJECT_REF/config/auth"             -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN"             -H "Content-Type: application/json"             --data-binary @/tmp/auth-template-patch.json             > /tmp/auth-template-response.json

          python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path("/tmp/auth-template-response.json").read_text())
          expected=["mailer_templates_confirmation_content","mailer_templates_magic_link_content"]
          missing=[k for k in expected if "{{ .Token }}" not in str(data.get(k,""))]
          if missing:
              raise SystemExit(f"Template verification failed: {missing}")
          print("Homira signup + returning OTP templates are live.")
          PY
