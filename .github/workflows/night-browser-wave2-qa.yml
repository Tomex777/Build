name: NIGHT Browser Wave 2 independent API26/API36 matrix

on:
  workflow_dispatch:
  push:
    branches:
      - agent/browser-v2-10-qa
    paths:
      - 'night-browser/qa/wave2_*'
      - '.github/workflows/night-browser-wave2-qa.yml'
  pull_request:
    branches:
      - feature/night-browser-multi-agent-20261020
    paths:
      - 'night-browser/**'
      - '.github/workflows/night-browser-wave2-qa.yml'

permissions:
  contents: read

jobs:
  independent-wave2:
    name: API ${{ matrix.api }} real Gecko QA (report-only)
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        api: [26, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'
      - name: Validate Python harness and fixture independently
        run: |
          python3 -m py_compile night-browser/qa/wave2_blackbox.py night-browser/qa/wave2_fixture.py
          python3 -m unittest discover -s night-browser/qa -p 'test_wave2*.py' -v
      - name: Unit tests and compile a real Android APK
        run: gradle --no-daemon -p night-browser :app:testDebugUnitTest :app:assembleDebug
      - name: Enable /dev/kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install APK, load real Gecko sites and run Wave 2 cases
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -partition-size 4096
          script: |
            python3 night-browser/qa/wave2_fixture.py >/dev/null 2>&1 &
            sleep 2
            adb install -r night-browser/app/build/outputs/apk/debug/app-x86_64-debug.apk
            python3 night-browser/qa/wave2_blackbox.py --out "night-browser/qa/results/wave2-api-${{ matrix.api }}" --apk night-browser/app/build/outputs/apk/debug/app-x86_64-debug.apk
      - name: Upload APK and independent QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: night-browser-wave2-api-${{ matrix.api }}
          path: |
            night-browser/app/build/outputs/apk/debug/*.apk
            night-browser/qa/results/wave2-api-${{ matrix.api }}/
          if-no-files-found: warn
          retention-days: 14
