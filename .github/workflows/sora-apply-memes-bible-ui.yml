name: Apply Sora Memes + Bible UI

on:
  push:
    branches: [sora-memes-bible-ci]
    paths:
      - 'sora-ci/memes-bible-ui-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sora-memes-bible-ci
      - name: Apply Memes + Bible UI wiring
        run: python3 sora-ci/apply-memes-bible-ui.py
      - name: Verify focused UI wiring
        run: |
          grep -q 'data class MemeDetails' sora-overlay/app/src/main/java/com/night/sora/ui/SoraApp.kt
          grep -q 'MemeDetailScreen' sora-overlay/app/src/main/java/com/night/sora/ui/SoraApp.kt
          grep -q 'onOpenBible: () -> Unit' sora-overlay/app/src/main/java/com/night/sora/ui/screens/MediaScreen.kt
          grep -q 'BibleHubContent(Modifier.fillMaxSize(), onOpen = onOpenBible)' sora-overlay/app/src/main/java/com/night/sora/ui/screens/MediaScreen.kt
          grep -q 'lastBibleReading = bibleRepository.lastReading()' sora-overlay/app/src/main/java/com/night/sora/ui/screens/HomeScreen.kt
          ! grep -q 'The light shines in the darkness' sora-overlay/app/src/main/java/com/night/sora/ui/screens/HomeScreen.kt
          ! grep -q 'Less like this' sora-overlay/app/src/main/java/com/night/sora/ui/screens/MediaScreen.kt
      - name: Commit UI wiring
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add sora-overlay/app/src/main/java/com/night/sora/ui/SoraApp.kt \
                  sora-overlay/app/src/main/java/com/night/sora/ui/screens/MediaScreen.kt \
                  sora-overlay/app/src/main/java/com/night/sora/ui/screens/BibleScreen.kt \
                  sora-overlay/app/src/main/java/com/night/sora/ui/screens/HomeScreen.kt
          git diff --cached --quiet && exit 0
          git commit -m 'wire Memes and Bible user flows'
          git push origin HEAD:sora-memes-bible-ci
