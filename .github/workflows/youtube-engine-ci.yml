name: YouTube Engine Foundation
on:
  push:
    branches: [youtube-engine-foundation]
    paths: ['youtube-engine/**', '.github/workflows/youtube-engine-ci.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'
      - run: gradle --no-daemon -p youtube-engine :youtube-engine-testapp:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: youtube-engine-testapp-arm64
          path: youtube-engine/youtube-engine-testapp/build/outputs/apk/debug/*arm64-v8a*.apk
          if-no-files-found: error
