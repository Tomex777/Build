name: YouTube Engine Foundation
on:
  push:
    branches: [youtube-engine-foundation]
    paths: ['youtube-engine/**', '.github/workflows/youtube-engine-ci.yml']
  workflow_dispatch:
concurrency:
  group: youtube-engine-foundation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'
      - name: Compile app and instrumentation tests
        run: gradle --no-daemon -p youtube-engine :youtube-engine-testapp:assembleDebug :youtube-engine-testapp:assembleDebugAndroidTest
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Prove search to adaptive CDN bytes on Android 16
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          script: bash youtube-engine/ci/transport-test.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: youtube-engine-transport-report
          path: |
            youtube-engine/youtube-engine-testapp/build/outputs/androidTest-results/
            youtube-engine/youtube-engine-testapp/build/reports/androidTests/
            youtube-engine/transport-proof.txt
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: youtube-engine-testapp-arm64
          path: youtube-engine/youtube-engine-testapp/build/outputs/apk/debug/*arm64-v8a*.apk
          if-no-files-found: error
