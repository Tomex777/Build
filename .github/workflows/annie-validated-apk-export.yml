name: Export validated Annie ARM64 APK

on:
  push:
    branches: [annie-validated-apk-export-20261012]
    paths: ['.github/workflows/annie-validated-apk-export.yml']
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  issues: write

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Require successful pinned production validation
        uses: actions/github-script@v7
        with:
          script: |
            const expected = '770983847b39d26e0eb0affd3f434363c03788a9';
            for (let attempt = 0; attempt < 20; attempt++) {
              const {data: run} = await github.rest.actions.getWorkflowRun({
                owner: context.repo.owner, repo: context.repo.repo, run_id: 38381728899
              });
              if (run.head_sha !== expected) throw new Error('Unexpected release source commit');
              if (run.status === 'completed') {
                if (run.conclusion !== 'success') throw new Error('Full production validation did not pass');
                return;
              }
              await new Promise(resolve => setTimeout(resolve, 30000));
            }
            throw new Error('Production validation did not finish within the export window');
      - uses: actions/download-artifact@v4
        with:
          name: Annie-1.0.0-validated-production-release
          path: validated
          run-id: 38381728899
          github-token: ${{ github.token }}
      - name: Verify exact APK and preserve acceptance evidence
        shell: bash
        run: |
          set -euo pipefail
          cd validated
          sha256sum --check SHA256SUMS.txt
          grep -Fxq 'commit=770983847b39d26e0eb0affd3f434363c03788a9' ACCEPTANCE.txt
          grep -Fxq 'api26=PASSED' ACCEPTANCE.txt
          grep -Fxq 'api36=PASSED' ACCEPTANCE.txt
          grep -Fxq '4e7ab744bdbbcf6ddb577186e8163be4b0f4127d2123ed21108ca6e7dce70288' ANNIE-CERTIFICATE.txt
          mkdir -p ../arm64
          cp Annie-1.0.0-arm64-v8a-production-signed.apk ../arm64/Annie-2026-10-13-Validated-arm64-release.apk
          cp ACCEPTANCE.txt ANNIE-CERTIFICATE.txt ../arm64/
          cd ../arm64
          sha256sum Annie-2026-10-13-Validated-arm64-release.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Annie-2026-10-13-validated-arm64-release
          path: arm64/
          if-no-files-found: error
          retention-days: 30

      - name: Record verified export and release run
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              ...context.repo, issue_number: 181,
              body: 'Annie signed APK export verified and publishing started. Run: https://github.com/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId
            })
      - name: Publish verified owner-signed ARM64 APK to GitHub pre-release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="annie-v1.0.0-20261013"
          apk="arm64/Annie-2026-10-13-Validated-arm64-release.apk"
          test -s "$apk"
          sha256sum --check arm64/SHA256SUMS.txt --ignore-missing || (cd arm64 && sha256sum --check SHA256SUMS.txt)
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$apk" arm64/SHA256SUMS.txt arm64/ACCEPTANCE.txt arm64/ANNIE-CERTIFICATE.txt --clobber
          else
            gh release create "$tag" "$apk" arm64/SHA256SUMS.txt arm64/ACCEPTANCE.txt arm64/ANNIE-CERTIFICATE.txt \
              --target bad857100e3769396ab2b5195f7d9c5cf28d57bc \
              --prerelease \
              --title "Annie 1.0.0 — validated Android release candidate" \
              --notes "Validated owner-signed ARM64 Android APK, compiled from commit 770983847b39d26e0eb0affd3f434363c03788a9 and consolidated on branch annie-release-1.0.0-20261013 (application source unchanged). CI run 38381728899 passed Android API 26 and 36 suites plus permanent-key production installation. Signing certificate SHA-256: 4e7ab744bdbbcf6ddb577186e8163be4b0f4127d2123ed21108ca6e7dce70288. Physical-device and live-paid-provider testing are still outstanding."
          fi

      - name: Record downloadable signed release
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              ...context.repo, issue_number: 181,
              body: 'Annie production-signed ARM64 release published successfully from passing CI 38381728899. Download APK: https://github.com/' + context.repo.owner + '/' + context.repo.repo + '/releases/download/annie-v1.0.0-20261013/Annie-2026-10-13-Validated-arm64-release.apk . Export workflow run: https://github.com/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId
            })
