name: VixSrc and VaPlayer strict e2e

on:
  push:
    branches:
      - movies-source-probes-20261001
    paths:
      - 'tools/vixsrc_vaplayer_e2e.py'
      - '.github/workflows/vixsrc-vaplayer-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - name: Ensure FFmpeg
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
      - name: Prove VixSrc and VaPlayer movie/TV media
        run: python3 tools/vixsrc_vaplayer_e2e.py
      - name: Upload proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vixsrc-vaplayer-e2e
          path: vixsrc-vaplayer-e2e.json
          if-no-files-found: warn
