name: Vidbox E2E Probe

on:
  push:
    branches: [vidbox-e2e-probe-20260929]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install media tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg aria2 file xxd
          mkdir -p /tmp/vidbox-proof/out

      - name: Download and verify browser-captured Sherlock Jr. file
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/vidbox-proof

          # This URL was captured twice from Chromium by clicking VidVault's
          # exact "720p (300.13 MB)" button for Sherlock Jr. (1924), TMDB 992.
          URL='https://mk2.wt1zl0r2ox.workers.dev/d/d7b300f05fe7d7c50f421e4a7cfcbccda50aff41f5cf6c4ae99faa6214e31580'
          REFERER='https://vidvault.to/movie/992'
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/153.0.0.0 Safari/537.36'

          echo 'SOURCE_EVIDENCE=Run 11 Chromium download event, attempts 2 and 3'
          echo 'EXPECTED_FILENAME=Sherlock Jr. (1924).mkv'
          echo 'EXPECTED_LISTING=720p (300.13 MB)'

          aria2c             --console-log-level=notice --summary-interval=20             --file-allocation=none --max-tries=12 --retry-wait=3             --timeout=60 --connect-timeout=30             --allow-overwrite=true --auto-file-renaming=false             --user-agent="$UA" --referer="$REFERER"             -x 16 -s 16 -k 1M             -d /tmp/vidbox-proof -o verified-media.mkv             "$URL"

          FILE=/tmp/vidbox-proof/verified-media.mkv
          test -f "$FILE"
          SIZE="$(stat -c %s "$FILE")"
          echo "DOWNLOADED_BYTES=$SIZE" | tee out/size.txt

          # A challenge page / partial response cannot pass.
          test "$SIZE" -gt 250000000
          test "$SIZE" -lt 380000000

          file "$FILE" | tee out/file-type.txt
          MAGIC="$(head -c 4 "$FILE" | xxd -p)"
          echo "FIRST4=$MAGIC" | tee out/magic.txt
          test "$MAGIC" = '1a45dfa3'

          sha256sum "$FILE" | tee out/sha256.txt

          ffprobe -v error             -show_entries format=format_name,duration,size,bit_rate:stream=index,codec_name,codec_type,width,height,duration             -of json "$FILE" | tee out/ffprobe.json

          DURATION="$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$FILE")"
          echo "DURATION_SECONDS=$DURATION" | tee out/duration.txt

          python3 - "$DURATION" <<'PY'
          import sys
          d=float(sys.argv[1])
          if not 2400 <= d <= 3300:
              raise SystemExit(f'unexpected Sherlock Jr. runtime: {d}')
          PY

          # Reopen and decode independent regions.
          ffmpeg -v error -i "$FILE" -t 12 -map 0:v:0? -map 0:a:0? -f null - 2>out/decode-start.stderr
          test ! -s out/decode-start.stderr

          MID="$(python3 - "$DURATION" <<'PY'
          import sys
          print(float(sys.argv[1])/2)
          PY
          )"
          ffmpeg -v error -ss "$MID" -i "$FILE" -t 12 -map 0:v:0? -map 0:a:0? -f null - 2>out/decode-mid.stderr
          test ! -s out/decode-mid.stderr

          END="$(python3 - "$DURATION" <<'PY'
          import sys
          print(max(0,float(sys.argv[1])-20))
          PY
          )"
          ffmpeg -v error -ss "$END" -i "$FILE" -t 12 -map 0:v:0? -map 0:a:0? -f null - 2>out/decode-end.stderr
          test ! -s out/decode-end.stderr

          # Full sequential decode.
          ffmpeg -v error -i "$FILE" -map 0:v:0? -map 0:a:0? -f null - 2>out/full-decode.stderr
          test ! -s out/full-decode.stderr

          python3 - <<'PY'
          import json,os,hashlib
          out='/tmp/vidbox-proof/out'
          f='/tmp/vidbox-proof/verified-media.mkv'
          probe=json.load(open(out+'/ffprobe.json'))
          h=hashlib.sha256()
          with open(f,'rb') as s:
              for chunk in iter(lambda:s.read(4*1024*1024),b''):
                  h.update(chunk)
          result={
            'verified': True,
            'sourceChain': [
              'vidbox.vc movie download handoff',
              'moviesdl.cc download catalog/gateway',
              'VidVault provider',
              'browser-captured direct file'
            ],
            'title': 'Sherlock Jr.',
            'year': 1924,
            'tmdbId': 992,
            'listedQuality': '720p',
            'listedSize': '300.13 MB',
            'browserObservedFilename': 'Sherlock Jr. (1924).mkv',
            'downloadHost': 'mk2.wt1zl0r2ox.workers.dev',
            'bytes': os.path.getsize(f),
            'sha256': h.hexdigest(),
            'containerMagic': '1a45dfa3',
            'ffprobe': probe,
            'decodeStart': 'PASS',
            'decodeMiddleAfterReopen': 'PASS',
            'decodeNearEndAfterReopen': 'PASS',
            'fullSequentialDecode': 'PASS'
          }
          json.dump(result,open(out+'/VERIFIED.json','w'),indent=2)
          print('VIDBOX_DOWNLOAD_VERIFIED')
          print(json.dumps(result,indent=2))
          with open(f,'rb') as s:
              open(out+'/verified-first-1MiB.bin','wb').write(s.read(1024*1024))
          os.remove(f)
          PY

      - name: Upload proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vidbox-final-strict-download-proof
          path: /tmp/vidbox-proof/out
          if-no-files-found: warn
