name: Vidbox E2E Probe

on:
  push:
    branches: [vidbox-e2e-probe-20260929]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install browser and media tools
        run: |
          mkdir -p /tmp/vidbox-probe && cd /tmp/vidbox-probe
          npm init -y
          npm install playwright
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg xvfb curl

      - name: Click VidVault real file and trace to final download
        shell: bash
        run: |
          cd /tmp/vidbox-probe
          cat > probe.mjs <<'NODE'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          import path from 'node:path';
          import crypto from 'node:crypto';
          import { spawnSync } from 'node:child_process';

          const OUT='/tmp/vidbox-probe/out';fs.mkdirSync(OUT,{recursive:true});
          const UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/153.0.0.0 Safari/537.36';
          const report={startedAt:new Date().toISOString(),title:'Night of the Living Dead',tmdbId:10331,entry:'https://vidvault.to/movie/10331',steps:[],responses:[],requests:[],downloads:[],errors:[]};
          const browser=await chromium.launch({headless:false,channel:'chrome',args:['--no-sandbox','--disable-dev-shm-usage','--disable-blink-features=AutomationControlled','--window-size=1440,1100']});
          const context=await browser.newContext({acceptDownloads:true,viewport:{width:1440,height:1100},screen:{width:1440,height:1100},locale:'en-US',timezoneId:'Africa/Lagos',userAgent:UA});
          await context.addInitScript(()=>{try{Object.defineProperty(navigator,'webdriver',{get:()=>undefined})}catch{};window.chrome=window.chrome||{runtime:{}}});

          function attach(page,label){
            page.on('request',req=>{const u=req.url();if(/vidvault|download|api|file|drive|cdn|cloud|mkv|mp4/i.test(u))report.requests.push({label,url:u,method:req.method(),resourceType:req.resourceType(),postData:req.postData()?.slice(0,3000)||null})});
            page.on('response',async resp=>{try{const u=resp.url(),h=await resp.allHeaders();if(/vidvault|download|api|file|drive|cdn|cloud|mkv|mp4/i.test(u)||resp.status()>=300)report.responses.push({label,url:u,status:resp.status(),contentType:h['content-type']||null,contentLength:h['content-length']||null,contentDisposition:h['content-disposition']||null,location:h['location']||null})}catch{}});
            page.on('requestfailed',r=>report.errors.push(label+' requestfailed '+r.url()+' '+(r.failure()?.errorText||'')));
          }
          async function capture(page,label){
            let body='',html='',buttons=[],links=[];
            try{body=(await page.locator('body').innerText({timeout:10000})).slice(0,50000)}catch{}
            try{html=(await page.content()).slice(0,1000000)}catch{}
            try{buttons=await page.locator('button').evaluateAll(bs=>bs.map((b,i)=>({i,text:(b.innerText||b.textContent||'').trim().replace(/\s+/g,' '),disabled:b.disabled,aria:b.getAttribute('aria-label'),title:b.getAttribute('title'),visible:!!(b.offsetWidth||b.offsetHeight||b.getClientRects().length)})).filter(x=>x.visible))}catch{}
            try{links=await page.locator('a[href]').evaluateAll(as=>as.map((a,i)=>({i,text:(a.innerText||a.textContent||'').trim().replace(/\s+/g,' '),url:a.href,visible:!!(a.offsetWidth||a.offsetHeight||a.getClientRects().length)})).filter(x=>x.visible))}catch{}
            try{await page.screenshot({path:path.join(OUT,label+'.png'),fullPage:true})}catch{}
            fs.writeFileSync(path.join(OUT,label+'.html'),html);fs.writeFileSync(path.join(OUT,label+'.txt'),body);
            const x={label,url:page.url(),title:await page.title().catch(()=>''),body:body.slice(0,10000),buttons,links};report.steps.push(x);return x;
          }
          async function saveDownload(dl,label){
            try{
              const name=dl.suggestedFilename()||'media.bin';const dest=path.join(OUT,'download-complete-'+name.replace(/[^a-zA-Z0-9._-]+/g,'_').slice(0,180));
              await dl.saveAs(dest);const st=fs.statSync(dest),dataHead=Buffer.alloc(Math.min(st.size,128)),fd=fs.openSync(dest,'r');fs.readSync(fd,dataHead,0,dataHead.length,0);fs.closeSync(fd);
              const sha=crypto.createHash('sha256');const stream=fs.createReadStream(dest);for await(const chunk of stream)sha.update(chunk);
              const fp=spawnSync('ffprobe',['-v','error','-show_entries','format=format_name,duration,size:stream=codec_name,codec_type,width,height','-of','json',dest],{encoding:'utf8',timeout:180000});
              const dec=spawnSync('ffmpeg',['-v','error','-ss','5','-i',dest,'-t','5','-map','0:v:0?','-map','0:a:0?','-f','null','-'],{encoding:'utf8',timeout:180000});
              const rec={label,name,size:st.size,sha256:sha.digest('hex'),firstBytesHex:dataHead.toString('hex'),failure:await dl.failure(),ffprobeExit:fp.status,ffprobe:fp.stdout?JSON.parse(fp.stdout):null,ffprobeError:(fp.stderr||'').slice(-3000),decodeExit:dec.status,decodeError:(dec.stderr||'').slice(-3000)};
              report.downloads.push(rec);fs.writeFileSync(path.join(OUT,'verified-download.json'),JSON.stringify(rec,null,2));
              // Keep metadata and first 1 MiB evidence, not the 800 MB+ artifact.
              const sample=Buffer.alloc(Math.min(st.size,1048576)),fd2=fs.openSync(dest,'r');fs.readSync(fd2,sample,0,sample.length,0);fs.closeSync(fd2);fs.writeFileSync(path.join(OUT,'verified-first-1MiB.bin'),sample);fs.unlinkSync(dest);
              return true;
            }catch(e){report.errors.push('saveDownload '+String(e));return false}
          }
          async function interact(page,locator,label){
            const dlP=page.waitForEvent('download',{timeout:20000}).catch(()=>null);
            const popP=page.waitForEvent('popup',{timeout:20000}).catch(()=>null);
            const before=page.url();
            await locator.click({timeout:10000}).catch(async()=>locator.evaluate(e=>e.click()));
            const [dl,pop]=await Promise.all([dlP,popP]);
            if(dl)await saveDownload(dl,label);
            let active=pop||page;if(pop){attach(pop,label+'-popup');await pop.waitForLoadState('domcontentloaded',{timeout:40000}).catch(()=>{})}
            if(!pop&&active.url()!==before)await active.waitForLoadState('domcontentloaded',{timeout:40000}).catch(()=>{});
            await active.waitForTimeout(4000).catch(()=>{});
            return {page:active,download:!!dl,popup:!!pop};
          }

          let page=await context.newPage();attach(page,'vidvault');
          await page.goto(report.entry,{waitUntil:'domcontentloaded',timeout:60000});await page.waitForTimeout(6000);
          let s=await capture(page,'01-vidvault');

          // Click exact correct-title 802.78 MB button. Retry if first click is consumed by an ad/popunder.
          for(let attempt=1;attempt<=4 && report.downloads.length===0;attempt++){
            let btn=page.locator('button').filter({hasText:/802\.78 MB/}).first();
            if(!(await btn.count())||!(await btn.isVisible().catch(()=>false))){
              btn=page.getByRole('button',{name:/720p.*802\.78 MB/i}).first();
            }
            if(!(await btn.count()))break;
            const r=await interact(page,btn,'vidvault-file-attempt-'+attempt);
            if(r.popup){
              const ps=await capture(r.page,'02-popup-'+attempt);
              // Treat obvious ad popups as disposable; retain same VidVault page and click again.
              if(!/night of the living dead|download|file|drive|cloud/i.test((ps.title+' '+ps.body).toLowerCase())){
                await r.page.close().catch(()=>{});
              }else{
                page=r.page;
              }
            }
            await capture(page,'03-after-click-'+attempt);
            if(report.downloads.length)break;
          }

          // If a legitimate file/download page is now active, follow up to 8 obvious controls.
          const seen=new Set();
          for(let round=1;round<=8 && report.downloads.length===0;round++){
            const all=page.locator('a[href],button,input[type="submit"]');const n=await all.count().catch(()=>0);let pick=null;
            for(let i=0;i<n;i++){
              const el=all.nth(i);if(!(await el.isVisible().catch(()=>false)))continue;
              const text=((await el.innerText().catch(()=>''))||(await el.getAttribute('value').catch(()=>''))||(await el.getAttribute('aria-label').catch(()=>''))||'').trim();
              const href=await el.getAttribute('href').catch(()=>null);const key=page.url()+'|'+i+'|'+text+'|'+href;if(seen.has(key))continue;
              const h=(text+' '+(href||'')).toLowerCase();
              if(!/(download|direct|instant|generate|get\s*link|continue|server|mirror|720p|802\.78)/i.test(h))continue;
              if(/(advert|sponsor|login|sign in|telegram|discord)/i.test(h))continue;
              seen.add(key);pick=el;break;
            }
            if(!pick)break;
            const r=await interact(page,pick,'follow-'+round);page=r.page;await capture(page,'04-follow-'+round);
          }

          report.finishedAt=new Date().toISOString();fs.writeFileSync(path.join(OUT,'report.json'),JSON.stringify(report,null,2));
          console.log('VIDVAULT_NIGHT_FULL_RESULT');console.log(JSON.stringify({steps:report.steps.map(x=>({label:x.label,url:x.url,title:x.title,body:x.body.slice(0,2000),buttons:x.buttons,links:x.links.slice(0,30)})),downloads:report.downloads,responses:report.responses.slice(-150),requests:report.requests.slice(-150),errors:report.errors.slice(-100)},null,2));
          await browser.close();
          NODE
          xvfb-run -a node probe.mjs

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vidvault-night-download-proof
          path: /tmp/vidbox-probe/out
          if-no-files-found: warn
