name: Vidbox E2E Probe

on:
  push:
    branches: [vidbox-e2e-probe-20260929]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install browser and media tools
        run: |
          mkdir -p /tmp/vidbox-probe && cd /tmp/vidbox-probe
          npm init -y
          npm install playwright
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg xvfb aria2 jq file xxd

      - name: Capture Sherlock Jr. real download URL
        shell: bash
        run: |
          cd /tmp/vidbox-probe
          cat > capture.mjs <<'NODE'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          import path from 'node:path';

          const OUT='/tmp/vidbox-probe/out';fs.mkdirSync(OUT,{recursive:true});
          const UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/153.0.0.0 Safari/537.36';
          const entry='https://vidvault.to/movie/992';
          const expectedTitle='Sherlock Jr.';
          const expectedSize='300.13 MB';
          const report={entry,expectedTitle,expectedSize,tmdbId:992,attempts:[]};

          const browser=await chromium.launch({headless:false,channel:'chrome',args:['--no-sandbox','--disable-dev-shm-usage','--disable-blink-features=AutomationControlled','--window-size=1440,1100']});
          const context=await browser.newContext({acceptDownloads:true,viewport:{width:1440,height:1100},screen:{width:1440,height:1100},locale:'en-US',timezoneId:'Africa/Lagos',userAgent:UA});
          await context.addInitScript(()=>{try{Object.defineProperty(navigator,'webdriver',{get:()=>undefined})}catch{};window.chrome=window.chrome||{runtime:{}}});
          const page=await context.newPage();
          await page.goto(entry,{waitUntil:'domcontentloaded',timeout:60000});
          await page.waitForTimeout(5000);
          const body=(await page.locator('body').innerText()).slice(0,30000);
          fs.writeFileSync(path.join(OUT,'vidvault-body.txt'),body);
          await page.screenshot({path:path.join(OUT,'vidvault-sherlock.png'),fullPage:true});
          if(!/Sherlock Jr\./i.test(body)) throw new Error('Wrong title page');
          if(!/300\.13 MB/i.test(body)) throw new Error('Expected 300.13 MB file is missing');

          let direct=null;
          for(let attempt=1;attempt<=5 && !direct;attempt++){
            const btn=page.locator('button').filter({hasText:/300\.13 MB/}).first();
            if(!(await btn.count()) || !(await btn.isVisible().catch(()=>false))) throw new Error('300.13 MB button not visible');
            const dlP=page.waitForEvent('download',{timeout:18000}).catch(()=>null);
            const popP=page.waitForEvent('popup',{timeout:18000}).catch(()=>null);
            await btn.click({timeout:10000}).catch(async()=>btn.evaluate(e=>e.click()));
            const [dl,pop]=await Promise.all([dlP,popP]);
            const rec={attempt,popup:null,download:false};
            if(pop){
              await pop.waitForLoadState('domcontentloaded',{timeout:15000}).catch(()=>{});
              await pop.waitForTimeout(1500).catch(()=>{});
              rec.popup={url:pop.url(),title:await pop.title().catch(()=>''),body:(await pop.locator('body').innerText().catch(()=>'' )).slice(0,2000)};
              await pop.close().catch(()=>{});
            }
            if(dl){
              rec.download=true;
              const url=dl.url();
              const suggestedFilename=dl.suggestedFilename();
              const cookies=await context.cookies(url).catch(()=>[]);
              direct={url,suggestedFilename,referer:entry,userAgent:UA,cookieHeader:cookies.map(c=>c.name+'='+c.value).join('; ')};
              await dl.cancel().catch(()=>{});
            }
            report.attempts.push(rec);
            await page.waitForTimeout(1500);
          }
          if(!direct) throw new Error('No browser download event after five attempts');
          if(!/^https?:\/\//i.test(direct.url)) throw new Error('Non-HTTP download URL');
          fs.writeFileSync(path.join(OUT,'direct-download.json'),JSON.stringify(direct,null,2));
          fs.writeFileSync(path.join(OUT,'capture-report.json'),JSON.stringify(report,null,2));
          console.log('SHERLOCK_DIRECT_URL_CAPTURED');
          console.log(JSON.stringify({downloadHost:new URL(direct.url).host,suggestedFilename:direct.suggestedFilename,attempts:report.attempts},null,2));
          await browser.close();
          NODE
          xvfb-run -a node capture.mjs

      - name: Complete download and perform full media verification
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/vidbox-probe
          URL="$(jq -r '.url' out/direct-download.json)"
          REFERER="$(jq -r '.referer' out/direct-download.json)"
          UA="$(jq -r '.userAgent' out/direct-download.json)"
          COOKIE="$(jq -r '.cookieHeader' out/direct-download.json)"

          python3 - <<'PY'
          import json,urllib.parse
          d=json.load(open('/tmp/vidbox-probe/out/direct-download.json'))
          print('DOWNLOAD_HOST='+urllib.parse.urlsplit(d['url']).netloc)
          print('SUGGESTED_FILENAME='+d['suggestedFilename'])
          PY

          ARGS=(--console-log-level=notice --summary-interval=20 --file-allocation=none --max-tries=8 --retry-wait=3 --timeout=60 --connect-timeout=30 --allow-overwrite=true --auto-file-renaming=false --user-agent="$UA" --referer="$REFERER" -x 16 -s 16 -k 1M -d /tmp/vidbox-probe -o verified-media.bin)
          if [ -n "$COOKIE" ]; then ARGS+=(--header="Cookie: $COOKIE"); fi
          aria2c "${ARGS[@]}" "$URL"

          FILE=/tmp/vidbox-probe/verified-media.bin
          test -f "$FILE"
          SIZE="$(stat -c %s "$FILE")"
          echo "DOWNLOADED_BYTES=$SIZE"
          # 300.13 MB listing: allow encoding/decimal differences but reject HTML/challenge files.
          test "$SIZE" -gt 250000000
          test "$SIZE" -lt 380000000

          file "$FILE" | tee out/file-type.txt
          head -c 128 "$FILE" | xxd -p | tr -d '\n' > out/first-128.hex
          sha256sum "$FILE" | tee out/sha256.txt

          ffprobe -v error -show_entries format=format_name,duration,size,bit_rate:stream=index,codec_name,codec_type,width,height,duration -of json "$FILE" | tee out/ffprobe.json
          DURATION="$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$FILE")"
          echo "DURATION_SECONDS=$DURATION"
          python3 - "$DURATION" <<'PY'
          import sys
          d=float(sys.argv[1])
          if not (2400 <= d <= 3300):
              raise SystemExit(f'unexpected Sherlock Jr. duration: {d}')
          PY

          # Full file decode. Any corruption/decoder error fails the job.
          ffmpeg -v error -i "$FILE" -map 0:v:0? -map 0:a:0? -f null - 2>out/full-decode.stderr
          test ! -s out/full-decode.stderr

          # Close/reopen behavior: seek into the independently reopened completed file.
          MID="$(python3 - "$DURATION" <<'PY'
          import sys
          print(float(sys.argv[1])/2)
          PY
          )"
          ffmpeg -v error -ss "$MID" -i "$FILE" -t 10 -map 0:v:0? -map 0:a:0? -f null - 2>out/reopen-mid-seek.stderr
          test ! -s out/reopen-mid-seek.stderr

          python3 - <<'PY'
          import json,os,hashlib,urllib.parse
          out='/tmp/vidbox-probe/out'; f='/tmp/vidbox-probe/verified-media.bin'
          direct=json.load(open(out+'/direct-download.json')); probe=json.load(open(out+'/ffprobe.json'))
          h=hashlib.sha256()
          with open(f,'rb') as s:
              for chunk in iter(lambda:s.read(4*1024*1024),b''): h.update(chunk)
          result={
            'verified':True,
            'title':'Sherlock Jr.',
            'year':1924,
            'tmdbId':992,
            'listedQuality':'720p',
            'listedSize':'300.13 MB',
            'downloadHost':urllib.parse.urlsplit(direct['url']).netloc,
            'suggestedFilename':direct['suggestedFilename'],
            'bytes':os.path.getsize(f),
            'sha256':h.hexdigest(),
            'ffprobe':probe,
            'fullDecode':'PASS',
            'reopenMidFileSeekDecode':'PASS'
          }
          json.dump(result,open(out+'/VERIFIED.json','w'),indent=2)
          print('VIDBOX_DOWNLOAD_VERIFIED')
          print(json.dumps(result,indent=2))
          with open(f,'rb') as s: open(out+'/verified-first-1MiB.bin','wb').write(s.read(1024*1024))
          os.remove(f)
          PY

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vidbox-sherlock-complete-download-proof
          path: /tmp/vidbox-probe/out
          if-no-files-found: warn
