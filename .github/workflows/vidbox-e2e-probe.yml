name: Vidbox E2E Probe

on:
  push:
    branches: [vidbox-e2e-probe-20260929]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install browser
        run: |
          mkdir -p /tmp/vidbox-probe && cd /tmp/vidbox-probe
          npm init -y
          npm install playwright
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb

      - name: Find the smallest correct public-domain VidVault file
        shell: bash
        run: |
          cd /tmp/vidbox-probe
          cat > find.mjs <<'NODE'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const OUT='/tmp/vidbox-probe/out';fs.mkdirSync(OUT,{recursive:true});
          const targets=[
            {id:5698,title:'The Great Train Robbery',year:1903},
            {id:775,title:'A Trip to the Moon',year:1902},
            {id:234,title:'The Cabinet of Dr. Caligari',year:1920},
            {id:10098,title:'The Kid',year:1921},
            {id:653,title:'Nosferatu',year:1922},
            {id:22596,title:'Safety Last!',year:1923},
            {id:992,title:'Sherlock Jr.',year:1924},
            {id:643,title:'Battleship Potemkin',year:1925},
            {id:962,title:'The Gold Rush',year:1925},
            {id:964,title:'The Phantom of the Opera',year:1925},
            {id:961,title:'The General',year:1926},
            {id:10331,title:'Night of the Living Dead',year:1968}
          ];
          const browser=await chromium.launch({headless:false,channel:'chrome',args:['--no-sandbox','--disable-dev-shm-usage','--disable-blink-features=AutomationControlled']});
          const context=await browser.newContext({viewport:{width:1280,height:900},locale:'en-US',userAgent:'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/153.0.0.0 Safari/537.36'});
          await context.addInitScript(()=>{try{Object.defineProperty(navigator,'webdriver',{get:()=>undefined})}catch{}});
          const results=[];
          for(const t of targets){
            const page=await context.newPage();
            const rec={...t,url:'https://vidvault.to/movie/'+t.id,buttons:[],sizesMiB:[],correctTitle:false,error:null};
            try{
              await page.goto(rec.url,{waitUntil:'domcontentloaded',timeout:40000});
              await page.waitForTimeout(3500);
              const body=(await page.locator('body').innerText()).slice(0,30000);
              rec.body=body.slice(0,5000);
              rec.correctTitle=body.toLowerCase().includes(t.title.toLowerCase().replace(/[.!]/g,''));
              rec.buttons=await page.locator('button').evaluateAll(bs=>bs.filter(b=>!!(b.offsetWidth||b.offsetHeight||b.getClientRects().length)).map(b=>(b.innerText||b.textContent||'').trim().replace(/\s+/g,' ')));
              for(const text of rec.buttons){
                for(const m of text.matchAll(/([0-9]+(?:\.[0-9]+)?)\s*(MB|GB)/ig)){
                  const n=Number(m[1])*(m[2].toUpperCase()==='GB'?1024:1);
                  if(Number.isFinite(n)) rec.sizesMiB.push({text,miB:n});
                }
              }
            }catch(e){rec.error=String(e)}
            results.push(rec);
            await page.close();
          }
          const candidates=results.flatMap(r=>r.sizesMiB.map(s=>({id:r.id,title:r.title,year:r.year,correctTitle:r.correctTitle,...s}))).filter(x=>x.correctTitle).sort((a,b)=>a.miB-b.miB);
          fs.writeFileSync(OUT+'/finder.json',JSON.stringify({results,candidates},null,2));
          console.log('PUBLIC_DOMAIN_VIDVAULT_CANDIDATES');
          console.log(JSON.stringify(candidates,null,2));
          if(!candidates.length) throw new Error('No correct-title VidVault download candidates found');
          await browser.close();
          NODE
          xvfb-run -a node find.mjs

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vidbox-small-public-domain-candidate-finder
          path: /tmp/vidbox-probe/out
          if-no-files-found: warn
