name: Vidbox E2E Probe

on:
  push:
    branches: [vidbox-e2e-probe-20260929]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install browser
        run: |
          mkdir -p /tmp/vidbox-probe && cd /tmp/vidbox-probe
          npm init -y
          npm install playwright
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb
      - name: Inspect Sherlock download button and redirect chain
        shell: bash
        run: |
          cd /tmp/vidbox-probe
          cat > inspect.mjs <<'NODE'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const OUT='/tmp/vidbox-probe/out';fs.mkdirSync(OUT,{recursive:true});
          const entry='https://vidvault.to/movie/992';
          const browser=await chromium.launch({headless:false,channel:'chrome',args:['--no-sandbox','--disable-dev-shm-usage','--disable-blink-features=AutomationControlled']});
          const context=await browser.newContext({acceptDownloads:true,viewport:{width:1440,height:1100},userAgent:'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/153.0.0.0 Safari/537.36'});
          await context.addInitScript(()=>{try{Object.defineProperty(navigator,'webdriver',{get:()=>undefined})}catch{}});
          const report={entry,requests:[],responses:[],pages:[],clicks:[]};
          function attach(p,label){
            p.on('request',r=>{const u=r.url();if(/vidvault|download|file|drive|cloud|cdn|hub|mkv|mp4|ad|redirect/i.test(u))report.requests.push({label,url:u,method:r.method(),type:r.resourceType(),postData:r.postData()?.slice(0,2000)||null})});
            p.on('response',async r=>{const u=r.url();if(/vidvault|download|file|drive|cloud|cdn|hub|mkv|mp4|ad|redirect/i.test(u)||r.status()>=300){let h={};try{h=await r.allHeaders()}catch{};report.responses.push({label,url:u,status:r.status(),contentType:h['content-type']||null,contentDisposition:h['content-disposition']||null,location:h['location']||null})}});
          }
          const page=await context.newPage();attach(page,'main');
          await page.goto(entry,{waitUntil:'domcontentloaded',timeout:60000});await page.waitForTimeout(5000);
          const btn=page.locator('button').filter({hasText:/300\.13 MB/}).first();
          if(!(await btn.count())) throw new Error('300.13 button missing');
          report.button=await btn.evaluate(el=>({
            outerHTML:el.outerHTML,
            attributes:Object.fromEntries([...el.attributes].map(a=>[a.name,a.value])),
            dataset:{...el.dataset},
            onclickAttr:el.getAttribute('onclick'),
            onclickFn:el.onclick?String(el.onclick):null,
            parent:el.parentElement?.outerHTML?.slice(0,12000)||null,
            grandparent:el.parentElement?.parentElement?.outerHTML?.slice(0,20000)||null
          }));
          report.scripts=await page.locator('script').evaluateAll(ss=>ss.map(s=>({src:s.src||null,text:(s.textContent||'').slice(0,20000)})).filter(x=>x.src||/download|redirect|window\.open|location/i.test(x.text)));
          fs.writeFileSync(OUT+'/before.html',await page.content());
          await page.screenshot({path:OUT+'/before.png',fullPage:true});

          for(let attempt=1;attempt<=3;attempt++){
            const beforePages=context.pages().length;
            const beforeUrl=page.url();
            const popupP=page.waitForEvent('popup',{timeout:6000}).catch(()=>null);
            const dlP=page.waitForEvent('download',{timeout:6000}).catch(()=>null);
            await btn.click({timeout:10000}).catch(async()=>btn.evaluate(e=>e.click()));
            const [pop,dl]=await Promise.all([popupP,dlP]);
            await page.waitForTimeout(3000);
            const rec={attempt,beforeUrl,afterUrl:page.url(),pageCountBefore:beforePages,pageCountAfter:context.pages().length,download:null,popup:null};
            if(dl){rec.download={url:dl.url(),filename:dl.suggestedFilename()};await dl.cancel().catch(()=>{})}
            if(pop){
              attach(pop,'popup-'+attempt);
              await pop.waitForLoadState('domcontentloaded',{timeout:15000}).catch(()=>{});
              await pop.waitForTimeout(2000).catch(()=>{});
              rec.popup={url:pop.url(),title:await pop.title().catch(()=>''),body:(await pop.locator('body').innerText().catch(()=>'' )).slice(0,7000),html:(await pop.content().catch(()=>'' )).slice(0,50000)};
              await pop.screenshot({path:OUT+'/popup-'+attempt+'.png',fullPage:true}).catch(()=>{});
              await pop.close().catch(()=>{});
            }
            rec.mainBody=(await page.locator('body').innerText().catch(()=>'' )).slice(0,5000);
            report.clicks.push(rec);
          }
          report.performance=await page.evaluate(()=>performance.getEntriesByType('resource').map(e=>e.name).filter(u=>/download|file|drive|cloud|cdn|hub|mkv|mp4|ad|redirect/i.test(u))).catch(()=>[]);
          fs.writeFileSync(OUT+'/inspect.json',JSON.stringify(report,null,2));
          console.log('SHERLOCK_BUTTON_INSPECT');
          console.log(JSON.stringify(report,null,2));
          await browser.close();
          NODE
          xvfb-run -a node inspect.mjs
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vidbox-sherlock-button-inspect
          path: /tmp/vidbox-probe/out
          if-no-files-found: warn
