name: Apply Sora Music Smoke System Dialog Hardening

on:
  push:
    branches: [sora-android-ci]
    paths:
      - 'sora-ci/music-smoke-system-dialog-hardening-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sora-android-ci
      - name: Harden Music smoke against emulator system ANRs
        run: python3 sora-ci/apply-music-smoke-system-dialog-hardening.py
      - name: Verify harness hardening
        run: |
          grep -q 'dismiss_system_dialogs' sora-ci/music-deterministic-smoke.sh
          grep -q 'android.settings.SETTINGS' sora-ci/music-deterministic-smoke.sh
          ! grep -q 'input keyevent KEYCODE_HOME' sora-ci/music-deterministic-smoke.sh
      - name: Commit harness fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add sora-ci/music-deterministic-smoke.sh
          git diff --cached --quiet && exit 0
          git commit -m 'isolate Music smoke from Pixel Launcher ANRs'
          git push origin HEAD:sora-android-ci
