            ${{ runner.temp }}/veya-final/ARM64-SIGNING.txt
            ${{ runner.temp }}/veya-final/SIGNING_RECORD.txt
            ${{ runner.temp }}/veya-final/BADGING.txt
            ${{ runner.temp }}/veya-final/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: veya-encrypted-owner-signing-backup
          path: ${{ runner.temp }}/veya-final/Veya-signing-backup-encrypted.cms

  api26:
    needs: build-sign
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - uses: actions/download-artifact@v4
        with:
          name: veya-permanent-release
          path: /tmp/veya-final
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 26
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: VEYA_APK=/tmp/veya-final/Veya-1.0.0-universal-release.apk bash veya-android/ci/run-emulator-tests.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: veya-permanent-api26-evidence
          path: veya-android/build/

  api36:
    needs: build-sign
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - uses: actions/download-artifact@v4
        with:
          name: veya-permanent-release
          path: /tmp/veya-final
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: VEYA_APK=/tmp/veya-final/Veya-1.0.0-universal-release.apk VEYA_LIVE_PLAYBACK_PROOF=1 bash veya-android/ci/run-emulator-tests.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: veya-permanent-api36-evidence
          path: veya-android/build/
