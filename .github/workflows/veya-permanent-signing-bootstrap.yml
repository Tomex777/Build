          CERT
          openssl cms -encrypt -aes-256-cbc -binary -outform DER -in "$OUT/Veya-signing-backup.tar.gz" -out "$OUT/Veya-signing-backup-encrypted.cms" "$OUT/recipient-cert.pem"
          rm -rf "$VAULT" "$OUT/Veya-signing-backup.tar.gz" "$OUT/recipient-cert.pem" "$OUT/Veya-universal-aligned.apk" "$OUT/Veya-arm64-raw.apk" "$OUT/Veya-arm64-aligned.apk"
          sha256sum "$OUT/Veya-1.0.0-universal-release.apk" "$OUT/Veya-1.0.0-arm64-v8a-release.apk" "$OUT/Veya-1.0.0-release.aab" > "$OUT/SHA256SUMS.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: veya-permanent-release
          path: |
            ${{ runner.temp }}/veya-final/Veya-1.0.0-universal-release.apk
            ${{ runner.temp }}/veya-final/Veya-1.0.0-arm64-v8a-release.apk
            ${{ runner.temp }}/veya-final/Veya-1.0.0-release.aab
