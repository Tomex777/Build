name: Annie Canvas legacy software renderer

on:
  push:
    branches: [annie-canvas-api26-software-renderer-20261011]
    paths:
      - 'annie-android/**'
      - '.github/workflows/annie-canvas-software-compat.yml'
  workflow_dispatch:

concurrency:
  group: annie-canvas-software-${{ github.ref }}
  cancel-in-progress: true

jobs:
  canvas-compat:
    name: Canvas on Android ${{ matrix.api }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api: [26, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'
      - name: Validate overlay and run JVM plus instrumentation build
        run: |
          set -euo pipefail
          python3 annie-android/scripts/test-repair-contract.py
          python3 annie-android/scripts/repair-m0b-merge.py
          sh annie-android/scripts/check-annie-types.sh
          gradle --no-daemon --stacktrace -p annie-android :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Install emulator and system image
        run: |
          set -euo pipefail
          sdkmanager --install emulator
          bash annie-android/ci/install-emulator-system-image.sh ${{ matrix.api }}
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run the three real Canvas gesture and fullscreen tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -partition-size 4096
          script: timeout --signal=TERM --kill-after=20s 900s gradle --no-daemon --stacktrace -p annie-android :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.tomex777.annie.AnnieCanvasMessageTest
      - name: Upload Canvas compatibility diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: annie-canvas-api${{ matrix.api }}-report
          path: |
            annie-android/app/build/outputs/androidTest-results/
            annie-android/app/build/reports/androidTests/
          if-no-files-found: warn
          retention-days: 7
