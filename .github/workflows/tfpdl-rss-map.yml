name: TFPDL RSS content probe

on:
  push:
    paths:
      - ".github/workflows/tfpdl-rss-map.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Inspect RSS and sitemap exposure
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request, re, html
          UA={"User-Agent":"Mozilla/5.0 (Linux; Android 16; Mobile)"}

          def get(u):
              req=urllib.request.Request(u,headers=UA)
              with urllib.request.urlopen(req,timeout=25) as r:
                  return r.status,r.geturl(),r.read(700000).decode("utf-8","ignore")

          urls=[
            "https://tfpdl.com/?s=Lanterns&feed=rss2",
            "https://www.tfpdl.com/?s=Lanterns&feed=rss2",
            "https://tfpdl.com/feed/",
            "https://tfpdl.com/post-sitemap.xml",
            "https://tfpdl.com/?p=373753",
          ]

          for u in urls:
              print("\n===",u,"===")
              try:
                  st,final,t=get(u)
                  print("status",st,"final",final,"bytes",len(t))
                  print("contains_download_wrapper", "/tfpdl?" in t)
                  print("wrapper_marker_count", t.count("/tfpdl?"))
                  print("contains_content_encoded", "<content:encoded" in t)
                  if "sitemap" in u:
                      print("sitemap_loc_count", len(re.findall(r"<loc>",t,re.I)))
              except Exception as e:
                  print("ERROR",type(e).__name__,str(e)[:180])
          PY
