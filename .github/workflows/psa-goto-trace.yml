name: PSA goto trace

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/psa-goto-trace.yml'

permissions:
  contents: write

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Inspect PSA goto wrapper
        shell: bash
        env:
          WRAPPER: 'https://psa.wf/goto/bbea2c6ad888f65e/YpkKnUG0Yzz36gHT2Do8XPlYGjkfg0rEOmn%2BvhJR9OAMLoWFcZCSjv0GbWqivPOJuMRW4z3A0km96rDQRzHTqOlyMbSgZxBQ2xtAem2spUE%3D%3AMTc4NjM4ODIwNQ%3AO2f7J9Zkcjx%2BOVt8uYUxQA%3D%3D'
        run: |
          mkdir -p diagnostics
          python3 - <<'PY'
          import os,urllib.request,urllib.error,json,re,html
          from urllib.parse import urljoin
          url=os.environ['WRAPPER']
          UA='Mozilla/5.0 (Linux; Android 16; SM-A165F) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Mobile Safari/537.36'
          out={'wrapper':url}
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs):
                  return None
          opener=urllib.request.build_opener(NoRedirect)
          req=urllib.request.Request(url,headers={'User-Agent':UA,'Referer':'https://psa.wf/movie/the-invite-2026/','Accept':'text/html,application/xhtml+xml'})
          try:
              r=opener.open(req,timeout=30)
              body=r.read(1000000).decode('utf-8','ignore')
              out.update(status=r.status,headers=dict(r.headers),bodyPreview=re.sub(r'\s+',' ',body)[:12000])
          except urllib.error.HTTPError as e:
              body=e.read(1000000).decode('utf-8','ignore')
              out.update(status=e.code,headers=dict(e.headers),bodyPreview=re.sub(r'\s+',' ',body)[:12000],error='HTTPError')
          except Exception as e:
              out['error']=repr(e)
          json.dump(out,open('diagnostics/psa-goto-trace.json','w'),indent=2)
          print(json.dumps(out,indent=2)[:30000])
          PY
      - name: Commit result
        if: always()
        run: |
          test -f diagnostics/psa-goto-trace.json || echo '{"error":"no result"}' > diagnostics/psa-goto-trace.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add diagnostics/psa-goto-trace.json
          git commit -m "record PSA goto trace" || true
          git push || true
