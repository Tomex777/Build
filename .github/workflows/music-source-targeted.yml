name: Music Source Targeted Probes

on:
  push:
    branches:
      - music-source-probes-20260930
    paths:
      - '.github/workflows/music-source-targeted.yml'
      - 'music-source-probes/targeted/**'
  workflow_dispatch:

jobs:
  targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Install parser dependency
        run: python3 -m pip install --quiet json5

      - name: Run targeted source probes
        shell: bash
        run: |
          python3 - <<'PY'
          import html, json, re, time, urllib.parse, urllib.request, urllib.error
          import json5
          from datetime import datetime, timezone

          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36"
          out={"generated_at":datetime.now(timezone.utc).isoformat(),"sources":{}}

          def req(url,method="GET",body=None,max_bytes=2_000_000,headers=None,timeout=30):
              h={"User-Agent":UA,"Accept":"*/*"}
              if headers:h.update(headers)
              data=None
              if body is not None:
                  data=json.dumps(body).encode()
                  h.setdefault("Content-Type","application/json")
                  h.setdefault("Accept","application/json")
              q=urllib.request.Request(url,data=data,headers=h,method=method)
              try:
                  with urllib.request.urlopen(q,timeout=timeout) as r:
                      b=r.read(max_bytes)
                      return {"ok":True,"status":getattr(r,"status",200),"url":r.geturl(),
                              "content_type":r.headers.get("Content-Type"),"content_length":r.headers.get("Content-Length"),
                              "content_range":r.headers.get("Content-Range"),"bytes_read":len(b),"body":b}
              except urllib.error.HTTPError as e:
                  b=e.read(min(max_bytes,65536))
                  return {"ok":False,"status":e.code,"url":url,
                          "content_type":e.headers.get("Content-Type") if e.headers else None,
                          "bytes_read":len(b),"body":b,"error":str(e)}
              except Exception as e:
                  return {"ok":False,"status":None,"url":url,"bytes_read":0,"body":b"","error":repr(e)}

          def jreq(*a,**kw):
              r=req(*a,**kw)
              z={k:v for k,v in r.items() if k!="body"}
              try:z["json"]=json.loads(r["body"].decode("utf-8","replace"))
              except Exception as e:
                  z["json_error"]=repr(e)
                  z["body_preview"]=r["body"][:800].decode("utf-8","replace")
              return z

          def media(url,headers=None):
              h={"Range":"bytes=0-65535"}
              if headers:h.update(headers)
              r=req(url,max_bytes=65536,headers=h)
              z={k:v for k,v in r.items() if k!="body"}
              b=r.get("body",b"")
              z["magic"]=b[:16].hex()
              z["flac"]=b.startswith(b"fLaC")
              z["id3"]=b.startswith(b"ID3")
              z["ogg"]=b.startswith(b"OggS")
              z["ebml"]=b.startswith(b"\x1aE\xdf\xa3")
              return z

          def extract_js_value(s,pos):
              while pos<len(s) and s[pos].isspace():pos+=1
              if pos>=len(s) or s[pos] not in "{[":return None
              op=s[pos];cl="}" if op=="{" else "]"
              depth=0;quote=None;esc=False
              for i in range(pos,len(s)):
                  ch=s[i]
                  if quote:
                      if esc:esc=False
                      elif ch=="\\":esc=True
                      elif ch==quote:quote=None
                      continue
                  if ch in "'\"":quote=ch;continue
                  if ch==op:depth+=1
                  elif ch==cl:
                      depth-=1
                      if depth==0:return s[pos:i+1]
              return None

          # ---- Lucida current flow: resolve page -> handoff -> status -> media bytes
          luc={"classification":"remote downloader; normal public flow only","steps":{}}
          source="https://soundcloud.com/l2share77/loona-butterfly"
          page_url="https://lucida.to/?"+urllib.parse.urlencode({"url":source,"country":"auto"})
          p=req(page_url,max_bytes=3_000_000,headers={"Accept":"text/html"})
          luc["steps"]["page"]={k:v for k,v in p.items() if k!="body"}
          txt=p.get("body",b"").decode("utf-8","replace")
          needle='{"type":"data","data":'
          parsed=[]
          start=0
          while True:
              i=txt.find(needle,start)
              if i<0:break
              raw=extract_js_value(txt,i+len(needle))
              if raw:
                  try:parsed.append(json5.loads(raw))
                  except Exception as e:luc.setdefault("parse_errors",[]).append(repr(e))
              start=i+len(needle)

          pdata=next((x for x in parsed if isinstance(x,dict) and "info" in x and "tokenExpiry" in x),None)
          if isinstance(pdata,dict):
              info=pdata.get("info") or {}
              tracks=[info] if info.get("type")=="track" else (info.get("tracks") or [])
              luc["resolved"]={"service":pdata.get("originalService"),"type":info.get("type"),"track_count":len(tracks)}
              if tracks:
                  tr=tracks[0]
                  body={
                      "account":{"id":"auto","type":"country"},
                      "compat":False,"downscale":"original","handoff":True,
                      "metadata":True,"private":True,
                      "token":{"expiry":pdata.get("tokenExpiry"),"primary":tr.get("csrf") or pdata.get("token"),"secondary":tr.get("csrfFallback")},
                      "upload":{"enabled":False},
                      "url":tr.get("url")
                  }
                  hand=jreq("https://lucida.to/api/load?url=%2Fapi%2Ffetch%2Fstream%2Fv2",method="POST",body=body,
                            headers={"Origin":"https://lucida.to","Referer":page_url})
                  luc["steps"]["handoff"]={k:v for k,v in hand.items() if k!="json"}
                  hj=hand.get("json") if isinstance(hand.get("json"),dict) else {}
                  server=hj.get("server");hid=hj.get("handoff")
                  luc["handoff"]={"server":server,"has_id":bool(hid)}
                  if server and hid:
                      base=f"https://{server}.lucida.to/api/fetch/request/{urllib.parse.quote(str(hid))}"
                      final=None
                      statuses=[]
                      for _ in range(30):
                          st=jreq(base,headers={"Referer":"https://lucida.to/"})
                          final=st
                          sj=st.get("json") if isinstance(st.get("json"),dict) else {}
                          statuses.append(sj.get("status"))
                          if sj.get("status") in ("completed","failed","error"):break
                          time.sleep(1)
                      luc["status_sequence"]=statuses
                      if final:
                          luc["steps"]["status"]={k:v for k,v in final.items() if k!="json"}
                          fj=final.get("json") if isinstance(final.get("json"),dict) else {}
                          luc["final_status"]=fj.get("status")
                      if luc.get("final_status")=="completed":
                          bp=media(base+"/download",{"Referer":"https://lucida.to/"})
                          luc["steps"]["download"]=bp
          luc["stream_verified"]=bool(luc.get("steps",{}).get("download",{}).get("ok") and luc["steps"]["download"].get("bytes_read",0)>4096)
          luc["download_verified"]=luc["stream_verified"]
          out["sources"]["lucida"]=luc

          # ---- Monochrome exact lossless proof
          mono={"classification":"direct public catalog/media service","steps":{}}
          s=jreq("https://tracks.monochrome.st/search/tracks?"+urllib.parse.urlencode({"q":"Rick Astley Never Gonna Give You Up","limit":"5"}))
          mono["steps"]["search"]={k:v for k,v in s.items() if k!="json"}
          sj=s.get("json")
          rows=(sj.get("tracks") or []) if isinstance(sj,dict) else (sj if isinstance(sj,list) else [])
          for t in rows or []:
              tid=t.get("trackId") or t.get("id") if isinstance(t,dict) else None
              if not tid:continue
              bp=media("https://tracks.monochrome.st/track/"+urllib.parse.quote(str(tid)))
              if bp.get("ok") and bp.get("bytes_read",0)>4096:
                  mono["track"]={"id":str(tid),"title":t.get("title"),"artistNames":t.get("artistNames"),"isrc":t.get("isrc")}
                  mono["steps"]["media"]=bp
                  break
          mono["stream_verified"]=bool(mono.get("steps",{}).get("media",{}).get("ok"))
          mono["download_verified"]=mono["stream_verified"]
          mono["lossless_flac_verified"]=bool(mono.get("steps",{}).get("media",{}).get("flac"))
          out["sources"]["monochrome"]=mono

          # ---- ArtistGrid tracker API: only catalog metadata/counts, redact track links
          ag={"classification":"tracker/catalog aggregator; backend-dependent","steps":{}}
          tracker="1safK4FsrrdxRL5PEF_s-GibgVvyOlTpzx73Mbv-gFFw"
          for base in ["https://trackerapi-2.artistgrid.cx","http://trackerapi-2.artistgrid.cx","https://sheets.artistgrid.cx"]:
              u=base.rstrip("/")+"/get/"+tracker
              r=jreq(u)
              ag["steps"][urllib.parse.urlparse(base).netloc+"_"+urllib.parse.urlparse(base).scheme]={k:v for k,v in r.items() if k!="json"}
              j=r.get("json")
              if isinstance(j,dict) and (j.get("eras") or j.get("tabs")):
                  ag["api_base"]=base
                  ag["name"]=j.get("name")
                  ag["tabs_count"]=len(j.get("tabs") or [])
                  eras=j.get("eras") or {}
                  ag["eras_count"]=len(eras) if isinstance(eras,dict) else 0
                  # count tracks and hostnames without retaining file URLs
                  hosts={};total=0;with_url=0
                  def walk(v):
                      nonlocal_vars=None
                      if isinstance(v,dict):
                          for k,x in v.items():
                              if k.lower() in ("url","link") and isinstance(x,str) and x.startswith("http"):
                                  pass
                              else: walk(x)
                      elif isinstance(v,list):
                          for x in v:walk(x)
                  # Source schema varies; recursively count URL strings.
                  def scan(v):
                      nonlocal total,with_url
                      if isinstance(v,dict):
                          looks_track=any(k in v for k in ("name","title")) and any(k.lower() in ("url","link","download","source") for k in v)
                          if looks_track: total+=1
                          for k,x in v.items():
                              if isinstance(x,str) and x.startswith("http") and k.lower() in ("url","link","download","source"):
                                  with_url+=1
                                  host=urllib.parse.urlparse(x).netloc.lower()
                                  hosts[host]=hosts.get(host,0)+1
                              else:scan(x)
                      elif isinstance(v,list):
                          for x in v:scan(x)
                  scan(eras)
                  ag["track_like_objects"]=total
                  ag["url_fields"]=with_url
                  ag["hosts"]=sorted(hosts.items(),key=lambda kv:(-kv[1],kv[0]))[:30]
                  break
          ag["stream_verified"]=False;ag["download_verified"]=False
          out["sources"]["artistgrid"]=ag

          # ---- OFA frontend/API-surface discovery. No anti-bot bypass.
          ofa={"classification":"web downloader; surface discovery only","steps":{}}
          p=req("https://oneforalldownloader.com/",max_bytes=2_000_000,headers={"Accept":"text/html"})
          ofa["steps"]["page"]={k:v for k,v in p.items() if k!="body"}
          txt=p.get("body",b"").decode("utf-8","replace")
          scripts=[]
          for src in re.findall(r'<script[^>]+src=["\x27]([^"\x27]+)',txt,re.I):
              full=urllib.parse.urljoin(p.get("url") or "https://oneforalldownloader.com/",html.unescape(src))
              if full not in scripts:scripts.append(full)
          routes=set();hosts=set()
          for su in scripts[:20]:
              sr=req(su,max_bytes=3_000_000,headers={"Referer":"https://oneforalldownloader.com/"})
              js=sr.get("body",b"").decode("utf-8","replace")
              for ep in re.findall(r'["\x27](\/api\/[A-Za-z0-9_./?=&%{}:-]{2,180})["\x27]',js):routes.add(ep)
              for host in re.findall(r'https?://([A-Za-z0-9.-]+)',js):
                  if "oneforalldownloader" not in host:hosts.add(host)
          ofa["script_count"]=len(scripts);ofa["api_paths"]=sorted(routes)[:80];ofa["external_hosts"]=sorted(hosts)[:50]
          ofa["stream_verified"]=False;ofa["download_verified"]=False
          out["sources"]["ofa"]=ofa

          open("targeted-report.json","w",encoding="utf-8").write(json.dumps(out,indent=2,ensure_ascii=False))
          lines=["# Music Source Targeted Probe","",f"Generated: {out['generated_at']}",""]
          for name,src in out["sources"].items():
              lines += [f"## {name}",f"- stream_verified: {src.get('stream_verified',False)}",f"- download_verified: {src.get('download_verified',False)}"]
              for key in ["classification","resolved","handoff","status_sequence","final_status","lossless_flac_verified","track","api_base","name","tabs_count","eras_count","track_like_objects","url_fields","hosts","script_count","api_paths","external_hosts"]:
                  if key in src:
                      v=src[key]
                      lines.append(f"- {key}: `"+json.dumps(v,ensure_ascii=False)+"`" if isinstance(v,(dict,list)) else f"- {key}: {v}")
              for step,d in src.get("steps",{}).items():
                  lines.append(f"- {step}: status={d.get('status')} ok={d.get('ok')} bytes={d.get('bytes_read')} content_type={d.get('content_type')} content_range={d.get('content_range')} magic={d.get('magic')} flac={d.get('flac')} final_url={d.get('url')}")
              lines.append("")
          open("targeted-report.md","w",encoding="utf-8").write("\n".join(lines))
          print(open("targeted-report.md",encoding="utf-8").read())
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: music-source-targeted-report
          path: |
            targeted-report.json
            targeted-report.md
          if-no-files-found: error
