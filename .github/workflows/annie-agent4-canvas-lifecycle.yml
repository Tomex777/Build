name: Annie Agent 4 Canvas lifecycle (API26 + API36)
on:
  push:
    branches: [annie-agent4-canvas-lifecycle-20261022]
    paths:
      - 'annie-android/**'
      - '.github/workflows/annie-agent4-canvas-lifecycle.yml'
  workflow_dispatch:

concurrency:
  group: annie-agent4-canvas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lifecycle-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        api: [26, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g typescript@5.9.3
      - name: Validate Android integration and Canvas build
        run: |
          node annie-android/scripts/test-canvas-runtime.mjs
          python3 annie-android/scripts/test-repair-contract.py
          python3 annie-android/ci/check-abr.py
          python3 annie-android/scripts/repair-m0b-merge.py
          sh annie-android/scripts/check-annie-types.sh
          gradle --no-daemon --stacktrace -p annie-android :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Install emulator and API image
        run: |
          sdkmanager --install emulator
          bash annie-android/ci/install-emulator-system-image.sh ${{ matrix.api }}
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run isolated Canvas pause and existing Snake acceptance
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -partition-size 4096
          script: |
            mkdir -p annie-android/build/agent4-evidence
            adb logcat -c
            set -o pipefail
            timeout --signal=TERM --kill-after=20s 600s gradle --no-daemon --stacktrace -p annie-android :app:connectedDebugAndroidTest '-Pandroid.testInstrumentationRunnerArguments.class=com.tomex777.annie.AnnieCanvasLifecycleTest' 2>&1 | tee annie-android/build/agent4-evidence/lifecycle.log
            timeout --signal=TERM --kill-after=20s 900s gradle --no-daemon --stacktrace -p annie-android :app:connectedDebugAndroidTest '-Pandroid.testInstrumentationRunnerArguments.class=com.tomex777.annie.AnnieCanvasMessageTest' 2>&1 | tee annie-android/build/agent4-evidence/snake-regression.log
            adb logcat -d > annie-android/build/agent4-evidence/logcat.txt
            adb pull /sdcard/Pictures/AnnieCI annie-android/build/agent4-evidence/screenshots || true
      - name: Preserve test artifacts and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: annie-agent4-canvas-api${{ matrix.api }}
          path: |
            annie-android/build/agent4-evidence/
            annie-android/app/build/outputs/androidTest-results/
            annie-android/app/build/reports/androidTests/
            annie-android/app/build/test-results/
          if-no-files-found: warn
          retention-days: 7
