name: Sora YouTube Music Extension Probe

on:
  push:
    branches: [sora-android-ci]
    paths:
      - 'sora-ci/youtube-music-probe-trigger.txt'
  workflow_dispatch:

jobs:
  build-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Import pinned Spotui Innertube into runner workspace
        run: bash sora-ci/import_spotui_innertube.sh
      - name: Reconstruct Sora source with staged YouTube modules
        run: |
          rm -rf /tmp/sora-yt /tmp/sora.zip
          cat sora-ci/chunks/part-*.txt | base64 -d > /tmp/sora.zip
          unzip -q /tmp/sora.zip -d /tmp/sora-yt
          ROOT=/tmp/sora-yt/Sora_Android_v0_1
          cp -R sora-overlay/. "$ROOT/"
          python3 - "$ROOT/settings.gradle.kts" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1])
          s=p.read_text()
          marker='dependencyResolutionManagement {'
          start=s.find(marker)
          if start < 0:
              raise SystemExit('dependencyResolutionManagement block not found')
          tail=s[start:]
          if 'maven("https://jitpack.io")' not in tail:
              needle='        mavenCentral()\n'
              pos=tail.find(needle)
              if pos < 0:
                  raise SystemExit('dependency-resolution mavenCentral() not found')
              insert_at=start + pos + len(needle)
              s=s[:insert_at] + '        maven("https://jitpack.io")\n' + s[insert_at:]
          if 'include(":youtube-innertube")' not in s:
              s += '\ninclude(":youtube-innertube")\ninclude(":youtube-music-extension")\n'
          p.write_text(s)
          PY
          grep -A12 'dependencyResolutionManagement' "$ROOT/settings.gradle.kts"
          echo "SORA_YT_ROOT=$ROOT" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Build isolated YouTube Music extension
        working-directory: ${{ env.SORA_YT_ROOT }}
        run: gradle --stacktrace :youtube-music-extension:assembleDebug
      - name: Prepare probe artifact
        run: cp "$SORA_YT_ROOT/youtube-music-extension/build/outputs/apk/debug/youtube-music-extension-debug.apk" /tmp/Sora-YouTube-Music-probe.apk
      - uses: actions/upload-artifact@v4
        with:
          name: sora-youtube-music-probe-apk
          path: /tmp/Sora-YouTube-Music-probe.apk
          if-no-files-found: error
          retention-days: 2
