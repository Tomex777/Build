name: Sora Jikan Endpoint Probe

on:
  push:
    branches: [sora-media-ci]
    paths:
      - 'sora-ci/jikan-probe-trigger.txt'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe Jikan Anime Manga endpoints
        shell: bash
        run: |
          set +e
          probe() {
            local label="$1" url="$2"
            local body="/tmp/jikan-${label}.json"
            local code
            code="$(curl -sS -o "$body" -w '%{http_code}' --retry 1 --retry-delay 2 --max-time 12 "$url")"
            local has_data=0
            grep -q '"data"' "$body" 2>/dev/null && has_data=1
            printf '%-24s code=%s data=%s\n' "$label" "$code" "$has_data"
            sleep 1
          }

          probe anime_airing 'https://api.jikan.moe/v4/top/anime?filter=airing&limit=1&sfw=true'
          probe anime_season 'https://api.jikan.moe/v4/seasons/now?limit=1&sfw=true'
          probe anime_popular 'https://api.jikan.moe/v4/top/anime?filter=bypopularity&limit=1&sfw=true'
          probe anime_top 'https://api.jikan.moe/v4/top/anime?limit=1&sfw=true'
          probe anime_upcoming 'https://api.jikan.moe/v4/top/anime?filter=upcoming&limit=1&sfw=true'
          probe anime_search 'https://api.jikan.moe/v4/anime?q=naruto&limit=1&sfw=true'
          probe anime_naruto 'https://api.jikan.moe/v4/anime/20/full'
          probe anime_relations 'https://api.jikan.moe/v4/anime/20/relations'
          probe manga_publishing 'https://api.jikan.moe/v4/top/manga?filter=publishing&limit=1'
          probe manga_search 'https://api.jikan.moe/v4/manga?q=naruto&limit=1'
