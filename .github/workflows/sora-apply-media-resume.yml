name: Apply Sora Direct Media Resume

on:
  push:
    branches: [sora-android-ci]
    paths:
      - 'sora-ci/media-resume-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sora-android-ci

      - name: Apply direct resume plumbing
        run: |
          python3 sora-ci/apply-media-resume-v2.py
          cp sora-ci/MediaProgressResume.kt \
            sora-overlay/app/src/main/java/com/night/sora/ui/screens/MediaProgressResume.kt

      - name: Verify direct resume wiring
        run: |
          grep -q 'resumeSourceId' sora-overlay/app/src/main/java/com/night/sora/model/Models.kt
          grep -q 'consumptionSourceId' sora-overlay/app/src/main/java/com/night/sora/model/Models.kt
          grep -q 'resumeExtensionPackage' sora-overlay/app/src/main/java/com/night/sora/data/CoreRepository.kt
          grep -q 'itemId = target.id' sora-overlay/app/src/main/java/com/night/sora/ui/screens/MediaDetailScreen.kt
          grep -q 'onResumeProgress' sora-overlay/app/src/main/java/com/night/sora/ui/screens/MediaScreen.kt
          grep -q 'resumeMediaProgress' sora-overlay/app/src/main/java/com/night/sora/ui/SoraApp.kt
          grep -q 'initialPositionMs = resumeAt' sora-overlay/app/src/main/java/com/night/sora/ui/screens/MediaProgressResume.kt
          grep -q 'initialPage = pageIndex' sora-overlay/app/src/main/java/com/night/sora/ui/screens/MediaProgressResume.kt

      - name: Commit direct resume
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add sora-overlay/app/src/main/java/com/night/sora/model/Models.kt \
                  sora-overlay/app/src/main/java/com/night/sora/data/CoreRepository.kt \
                  sora-overlay/app/src/main/java/com/night/sora/ui/SoraApp.kt \
                  sora-overlay/app/src/main/java/com/night/sora/ui/screens/MediaDetailScreen.kt \
                  sora-overlay/app/src/main/java/com/night/sora/ui/screens/MediaScreen.kt \
                  sora-overlay/app/src/main/java/com/night/sora/ui/screens/MediaProgressResume.kt
          git diff --cached --quiet && exit 0
          git commit -m 'resume exact Sora watch and read sessions'
          git push origin HEAD:sora-android-ci
