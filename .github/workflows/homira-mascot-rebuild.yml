name: Homira Rebuild Mascot Asset

permissions:
  contents: write

on:
  push:
    branches: [homira-call-ci]
    paths:
      - '.github/workflows/homira-mascot-rebuild.yml'
  workflow_dispatch:

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: homira-call-ci

      - name: Rebuild mascot PNG
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageFilter

          path = Path("homira-android/app/src/main/res/drawable-nodpi/homira_call_companion.png")
          src = Image.open(path).convert("RGBA")

          # The recovered source has a one-pixel baseline artifact on its final
          # visible row. Remove only that row; keep the actual mascot silhouette.
          alpha = src.getchannel("A")
          bbox = alpha.getbbox()
          if bbox:
              left, top, right, bottom = bbox
              if bottom > 1:
                  row_now = sum(1 for x in range(src.width) if alpha.getpixel((x, bottom - 1)) >= 16)
                  row_prev = sum(1 for x in range(src.width) if alpha.getpixel((x, bottom - 2)) >= 16)
                  if row_prev and row_now > row_prev * 1.45:
                      bottom -= 1
              src = src.crop((0, 0, src.width, bottom))

          # Remove isolated artifact pixels while retaining anti-aliased pixels
          # surrounding the mascot's main connected silhouette.
          alpha = src.getchannel("A")
          w, h = src.size
          pix = alpha.load()
          seen = set()
          components = []

          for y in range(h):
              for x in range(w):
                  if pix[x, y] < 16 or (x, y) in seen:
                      continue
                  stack = [(x, y)]
                  seen.add((x, y))
                  points = []
                  while stack:
                      x0, y0 = stack.pop()
                      points.append((x0, y0))
                      for nx, ny in ((x0 - 1, y0), (x0 + 1, y0), (x0, y0 - 1), (x0, y0 + 1)):
                          if (
                              0 <= nx < w and 0 <= ny < h
                              and (nx, ny) not in seen
                              and pix[nx, ny] >= 16
                          ):
                              seen.add((nx, ny))
                              stack.append((nx, ny))
                  components.append(points)

          if components:
              main = max(components, key=len)
              mask = Image.new("L", (w, h), 0)
              mask_pixels = mask.load()
              for x, y in main:
                  mask_pixels[x, y] = 255
              mask = mask.filter(ImageFilter.MaxFilter(5))

              cleaned_alpha = Image.new("L", (w, h), 0)
              cleaned_pixels = cleaned_alpha.load()
              mask_pixels = mask.load()
              original_pixels = alpha.load()
              for y in range(h):
                  for x in range(w):
                      if mask_pixels[x, y]:
                          cleaned_pixels[x, y] = original_pixels[x, y]
              src.putalpha(cleaned_alpha)

          # Render from a larger source so Android never has to magnify the
          # mascot on xhdpi/xxhdpi screens.
          rgb = src.convert("RGB").filter(ImageFilter.GaussianBlur(0.4))
          alpha = src.getchannel("A")
          target = (src.width * 4, src.height * 4)
          rgb = rgb.resize(target, Image.Resampling.LANCZOS)
          alpha = alpha.resize(target, Image.Resampling.LANCZOS)
          rgb = rgb.filter(ImageFilter.UnsharpMask(radius=1.2, percent=75, threshold=2))
          result = Image.merge("RGBA", (*rgb.split(), alpha))
          result.save(path, optimize=True, compress_level=9)
          print("Mascot rebuilt:", result.size, path.stat().st_size, "bytes")
          PY

      - name: Commit cleaned mascot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add homira-android/app/src/main/res/drawable-nodpi/homira_call_companion.png
          if git diff --cached --quiet; then
            echo "Mascot already normalized."
            exit 0
          fi
          git commit -m "Homira: clean and upscale call companion"
          git push origin HEAD:homira-call-ci
