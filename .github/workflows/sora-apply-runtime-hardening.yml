name: Apply Sora Runtime Hardening

on:
  push:
    branches: [sora-android-ci]
    paths:
      - 'sora-ci/apply-runtime-hardening.txt'

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply runtime hardening
        run: python sora-ci/patch_runtime_hardening.py
      - name: Verify patch
        run: |
          grep -q 'Modifier.fillMaxWidth().height(260.dp)' sora-overlay/app/src/main/java/com/night/sora/ui/screens/MediaScreen.kt
          grep -q 'jikan_host_reachable' sora-ci/ui-smoke.sh
          grep -q 'keeping the UI smoke focused on Sora rendering and navigation' sora-ci/ui-smoke.sh
      - name: Trigger fresh Android and UI validation
        run: |
          printf '%s runtime-hardening\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > sora-ci/v04-build-trigger.txt
          printf '%s runtime-hardening\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > sora-ci/v04-ui-smoke-trigger.txt
      - name: Commit hardened source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sora-overlay/app/src/main/java/com/night/sora/ui/screens/MediaScreen.kt \
                  sora-ci/ui-smoke.sh \
                  sora-ci/v04-build-trigger.txt \
                  sora-ci/v04-ui-smoke-trigger.txt
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'harden Sora offline media presentation and smoke test'
            git push
          fi
