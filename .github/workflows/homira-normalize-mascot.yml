name: Homira Normalize Mascot PNG

permissions:
  contents: write

on:
  push:
    branches: [homira-call-ci]
    paths:
      - '.github/workflows/homira-normalize-mascot.yml'
  workflow_dispatch:

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: homira-call-ci

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Re-encode mascot as true-color PNG
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageFile

          ImageFile.LOAD_TRUNCATED_IMAGES = True

          path = Path("homira-android/app/src/main/res/drawable-nodpi/homira_call_companion.png")
          temp = path.with_suffix(".tmp.png")

          image = Image.open(path).convert("RGBA")
          image.save(temp, format="PNG", optimize=False, compress_level=6)
          temp.replace(path)

          reopened = Image.open(path)
          print("normalized", reopened.size, reopened.mode, reopened.format)
          PY

      - name: Commit normalized mascot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add homira-android/app/src/main/res/drawable-nodpi/homira_call_companion.png
          if git diff --cached --quiet; then
            echo "Mascot already normalized."
            exit 0
          fi
          git commit -m "Homira: normalize mascot PNG for older Android"
          git push origin HEAD:homira-call-ci
