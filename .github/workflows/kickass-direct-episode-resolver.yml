name: KickAss direct episode resolver

on:
  push:
    branches: [anime-e2e-continuation-20260930]
    paths:
      - '.github/workflows/kickass-direct-episode-resolver.yml'

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null
          mkdir -p proof
      - name: Parse episode server config and follow media
        shell: bash
        run: |
          cat > kaa-direct.mjs <<'NODE'
          import { chromium } from 'playwright';
          import fs from 'node:fs';

          const EP='https://kaa.lt/one-piece-0948/ep-1-b46c51';
          const UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/153.0.0.0 Safari/537.36';
          const browser=await chromium.launch({headless:true,args:['--autoplay-policy=no-user-gesture-required','--disable-blink-features=AutomationControlled']});
          const ctx=await browser.newContext({userAgent:UA,ignoreHTTPSErrors:true,viewport:{width:1280,height:850}});
          const page=await ctx.newPage();
          const out={episode:EP,servers:[],attempts:[],proofs:[]};

          function normalize(u){return String(u||'').replace(/\\u002F/gi,'/').replace(/\\\//g,'/').replace(/^\/\//,'https://')}
          function parseServers(html){
            const m=String(html||'').match(/servers:\[(\{.+?\}(?:,\{.+?\})*)\]/s);
            if(!m)return [];
            const ns=[...m[1].matchAll(/name:"([^"]+)"/g)].map(x=>x[1]);
            const ss=[...m[1].matchAll(/src:"([^"]+)"/g)].map(x=>normalize(x[1]));
            return ss.map((src,i)=>({name:ns[i]||('Server '+(i+1)),src,dash:/[?&]type=dash\b|\/dash\b/i.test(src)})).filter(x=>/^https?:/.test(x.src));
          }
          function clean(h={}){
            const o={};
            for(const [k,v] of Object.entries(h)){
              if(k.startsWith(':')||['host','content-length','accept-encoding','connection'].includes(k.toLowerCase()))continue;
              o[k]=v;
            }
            o['User-Agent']=UA;
            return o;
          }
          async function prove(m){
            const h=clean(m.headers);
            try{
              const r=await ctx.request.get(m.url,{headers:h,timeout:25000,failOnStatusCode:false});
              const b=await r.body(),ct=r.headers()['content-type']||'';
              if(/\.m3u8(?:$|\?)/i.test(m.url)||/mpegurl/i.test(ct)){
                const text=b.toString('utf8');
                if(!text.trimStart().startsWith('#EXTM3U'))return {kind:'hls',status:r.status(),pass:false};
                let urls=[];for(const line of text.split(/\r?\n/)){const t=line.trim();if(t&&!t.startsWith('#'))urls.push(t);for(const mm of t.matchAll(/URI="([^"]+)"/g))urls.push(mm[1]);}
                for(const u0 of [...new Set(urls)].slice(0,12)){
                  const u=new URL(u0,m.url).href;
                  const r1=await ctx.request.get(u,{headers:h,timeout:25000,failOnStatusCode:false});
                  let bb=await r1.body(),tt=bb.toString('utf8');
                  if(tt.trimStart().startsWith('#EXTM3U')){
                    let parts=[];for(const line of tt.split(/\r?\n/)){const z=line.trim();if(z&&!z.startsWith('#'))parts.push(z);for(const mm of z.matchAll(/URI="([^"]+)"/g))parts.push(mm[1]);}
                    for(const s0 of [...new Set(parts)].slice(0,8)){
                      const su=new URL(s0,u).href;
                      const sr=await ctx.request.get(su,{headers:{...h,Range:'bytes=0-131071'},timeout:25000,failOnStatusCode:false});
                      const sb=await sr.body();
                      if([200,206].includes(sr.status())&&sb.length>2048)return {kind:'hls',masterStatus:r.status(),playlistStatus:r1.status(),segmentStatus:sr.status(),segmentBytes:sb.length,pass:true};
                    }
                  }else if([200,206].includes(r1.status())&&bb.length>2048)return {kind:'child',status:r1.status(),bytes:bb.length,pass:true};
                }
                return {kind:'hls',status:r.status(),pass:false};
              }
              return {kind:'direct',status:r.status(),bytes:b.length,contentType:ct,pass:[200,206].includes(r.status())&&b.length>2048};
            }catch(e){return {pass:false,error:String(e)}}
          }

          try{
            const nav=await page.goto(EP,{waitUntil:'domcontentloaded',timeout:55000});
            await page.waitForTimeout(5000);
            out.status=nav?.status()??null;out.title=await page.title();
            const html=await page.content();
            out.htmlBytes=Buffer.byteLength(html);
            out.servers=parseServers(html);
            if(!out.servers.length){
              const scripts=await page.locator('script').evaluateAll(xs=>xs.map(x=>x.textContent||'').filter(Boolean));
              for(const s of scripts){const got=parseServers(s);if(got.length){out.servers=got;break}}
            }
            for(const sv of out.servers){
              if(sv.dash)continue;
              const p=await ctx.newPage();const media=[];
              p.on('response',async r=>{
                try{
                  const h=await r.allHeaders(),ct=h['content-type']||'',u=r.url();
                  if(/\.(?:m3u8|mpd|mp4|m4s|ts)(?:$|\?)/i.test(u)||/mpegurl|dash\+xml|^video\//i.test(ct)){
                    media.push({url:u,status:r.status(),contentType:ct,headers:await r.request().allHeaders()});
                  }
                }catch{}
              });
              const player=sv.src+(sv.src.includes('?')?'&':'?')+'ln=ja-JP';
              const row={server:sv.name,src:sv.src,player,media:[]};
              try{
                row.status=(await p.goto(player,{waitUntil:'domcontentloaded',timeout:45000}))?.status()??null;
                await p.waitForTimeout(7000);
                for(let round=0;round<5;round++){
                  for(const f of p.frames()){
                    try{
                      const v=f.locator('video').first();
                      if(await v.count())await v.evaluate(el=>{el.muted=true;el.play().catch(()=>{});});
                      const b=f.locator('button[aria-label*="play" i],button[title*="play" i],.jw-icon-playback,.vjs-big-play-button,[class*="play" i]').first();
                      if(await b.count())try{await b.click({timeout:800})}catch{}
                    }catch{}
                  }
                  await p.waitForTimeout(1800);
                }
                row.media=[...new Map(media.map(x=>[x.url,x])).values()];
                for(const m of row.media.filter(x=>[200,206].includes(x.status)).slice(0,15)){
                  const pr=await prove(m);row.proof=pr;if(pr.pass)break;
                }
              }catch(e){row.error=String(e)}
              await p.close();
              out.attempts.push(row);
              if(row.proof?.pass)break;
            }
            out.pass=out.attempts.some(x=>x.proof?.pass);
            out.verdict=out.pass?'STRICT_PASS':out.servers.length?'SERVER_CONFIG_FOUND_NO_MEDIA':'NO_SERVER_CONFIG';
          }catch(e){out.error=String(e);out.pass=false;out.verdict='ERROR'}

          fs.writeFileSync('proof/result.json',JSON.stringify(out,null,2));
          console.log(JSON.stringify({
            status:out.status,title:out.title,htmlBytes:out.htmlBytes,
            serverCount:out.servers.length,servers:out.servers,
            attempts:out.attempts.map(x=>({server:x.server,status:x.status,mediaCount:x.media?.length||0,proof:x.proof||null,error:x.error||null})),
            pass:out.pass,verdict:out.verdict,error:out.error||null
          },null,2));
          await browser.close();
          NODE
          node kaa-direct.mjs
      - name: Upload proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kickass-direct-episode-resolver
          path: proof/result.json
          if-no-files-found: error
