name: Nami Production Release

on:
  push:
    tags:
      - "nami-v*"
  workflow_dispatch:
    inputs:
      release_label:
        description: "Release label used in the artifact name"
        required: false
        default: "production"
        type: string
      publish_release:
        description: "Publish the signed files to a GitHub Release"
        required: false
        default: false
        type: boolean
      release_tag:
        description: "Git tag to publish, for example nami-v1.0.0"
        required: false
        default: ""
        type: string

permissions:
  contents: write
  actions: read

jobs:
  production-release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NAMI_RELEASE_KEYSTORE_BASE64: ${{ secrets.NAMI_RELEASE_KEYSTORE_BASE64 }}
      NAMI_RELEASE_STORE_PASSWORD: ${{ secrets.NAMI_RELEASE_STORE_PASSWORD }}
      NAMI_RELEASE_KEY_ALIAS: ${{ secrets.NAMI_RELEASE_KEY_ALIAS }}
      NAMI_RELEASE_KEY_PASSWORD: ${{ secrets.NAMI_RELEASE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Require green Nami acceptance for this commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          accepted_run=$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow "Nami Android" \
            --commit "$GITHUB_SHA" \
            --limit 20 \
            --json databaseId,status,conclusion \
            --jq '.[0] | if .status == "completed" and .conclusion == "success" then .databaseId else empty end')
          if [ -z "$accepted_run" ]; then
            echo "::error::No successful Nami Android acceptance run found for $GITHUB_SHA"
            exit 1
          fi
          echo "NAMI_ACCEPTANCE_RUN=$accepted_run" >> "$GITHUB_ENV"

      - name: Require persistent Nami signing credentials
        shell: bash
        run: |
          set -euo pipefail
          for name in             NAMI_RELEASE_KEYSTORE_BASE64             NAMI_RELEASE_STORE_PASSWORD             NAMI_RELEASE_KEY_ALIAS             NAMI_RELEASE_KEY_PASSWORD
          do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing repository secret: $name"
              exit 1
            fi
          done

      - name: Download the exact permanently signed acceptance artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download "$NAMI_ACCEPTANCE_RUN" --repo "$GITHUB_REPOSITORY" --name nami-release-candidate --dir accepted-nami
          test "$(cat accepted-nami/SIGNING-STATE.txt)" = PERMANENT_PRODUCTION_SIGNING
          (cd accepted-nami && sha256sum -c PRODUCTION-SHA256SUMS.txt)
          mkdir -p dist/nami-production
          cp accepted-nami/nami-arm64-v8a-production.apk dist/nami-production/nami-arm64-v8a-release.apk
          cp accepted-nami/nami-universal-production.apk dist/nami-production/nami-universal-release.apk
          cp accepted-nami/nami-production.aab dist/nami-production/nami-release.aab
          cp accepted-nami/nami-16kb-page-size.txt dist/nami-production/nami-16kb-page-size.txt
          cp accepted-nami/*.signature.txt accepted-nami/AAB-certificate.txt dist/nami-production/
          for record in accepted-nami/*ci-signed.apk.signature.txt; do
            grep -q 'certificate SHA-256 digest: a3aa7cafd99921b750d2535053ef3d493e3749a5cc92ee5d29b059ba4ee7995a' "$record"
          done
          jarsigner -verify dist/nami-production/nami-release.aab > dist/nami-production/AAB-verification.txt
          grep -q 'jar verified' dist/nami-production/AAB-verification.txt
          (cd dist/nami-production && sha256sum nami-arm64-v8a-release.apk nami-universal-release.apk nami-release.aab > nami-release-SHA256SUMS.txt)

      - name: Upload production ARM64 APK
        uses: actions/upload-artifact@v4
        with:
          name: nami-arm64-${{ inputs.release_label || github.ref_name }}-${{ github.sha }}
          path: |
            dist/nami-production/nami-arm64-v8a-release.apk
            dist/nami-production/nami-release-SHA256SUMS.txt
            dist/nami-production/nami-16kb-page-size.txt
          if-no-files-found: error

      - name: Upload production universal APK
        uses: actions/upload-artifact@v4
        with:
          name: nami-universal-${{ inputs.release_label || github.ref_name }}-${{ github.sha }}
          path: |
            dist/nami-production/nami-universal-release.apk
            dist/nami-production/nami-release-SHA256SUMS.txt
          if-no-files-found: error

      - name: Upload production AAB
        uses: actions/upload-artifact@v4
        with:
          name: nami-aab-${{ inputs.release_label || github.ref_name }}-${{ github.sha }}
          path: |
            dist/nami-production/nami-release.aab
            dist/nami-production/nami-release-SHA256SUMS.txt
          if-no-files-found: error

      - name: Require a release tag when publishing
        if: ${{ github.ref_type == 'tag' || inputs.publish_release }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.ref_type }}" != "tag" ] && [ -z "${{ inputs.release_tag }}" ]; then
            echo "::error::release_tag is required when publish_release is enabled"
            exit 1
          fi

      - name: Publish verified files to GitHub Release
        if: ${{ github.ref_type == 'tag' || inputs.publish_release }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG"               dist/nami-production/nami-arm64-v8a-release.apk               dist/nami-production/nami-universal-release.apk               dist/nami-production/nami-release.aab               dist/nami-production/nami-release-SHA256SUMS.txt               --clobber
          else
            gh release create "$RELEASE_TAG"               dist/nami-production/nami-arm64-v8a-release.apk               dist/nami-production/nami-universal-release.apk               dist/nami-production/nami-release.aab               dist/nami-production/nami-release-SHA256SUMS.txt               --target "$GITHUB_SHA"               --title "Nami ${RELEASE_TAG#nami-}"               --generate-notes
          fi
