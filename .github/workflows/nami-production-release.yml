name: Nami Production Release

on:
  workflow_dispatch:
    inputs:
      release_label:
        description: "Release label used in the artifact name"
        required: false
        default: "production"
        type: string
      publish_release:
        description: "Publish the signed files to a GitHub Release"
        required: false
        default: false
        type: boolean
      release_tag:
        description: "Git tag to publish, for example nami-v1.0.0"
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  production-release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NAMI_RELEASE_KEYSTORE_BASE64: ${{ secrets.NAMI_RELEASE_KEYSTORE_BASE64 }}
      NAMI_RELEASE_STORE_PASSWORD: ${{ secrets.NAMI_RELEASE_STORE_PASSWORD }}
      NAMI_RELEASE_KEY_ALIAS: ${{ secrets.NAMI_RELEASE_KEY_ALIAS }}
      NAMI_RELEASE_KEY_PASSWORD: ${{ secrets.NAMI_RELEASE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Require persistent Nami signing credentials
        shell: bash
        run: |
          set -euo pipefail
          for name in             NAMI_RELEASE_KEYSTORE_BASE64             NAMI_RELEASE_STORE_PASSWORD             NAMI_RELEASE_KEY_ALIAS             NAMI_RELEASE_KEY_PASSWORD
          do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing repository secret: $name"
              exit 1
            fi
          done

      - name: Install Android SDK platform
        shell: bash
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Build minified release outputs
        working-directory: apps/nami
        run: |
          gradle --no-daemon --console=plain             :app:assembleRelease             :app:bundleRelease

      - name: Sign and verify production outputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/nami-production
          printf '%s' "$NAMI_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/nami-release.jks"

          arm64_apk=$(find apps/nami/app/build/outputs/apk/release -type f -name '*arm64-v8a*release*unsigned.apk' -print -quit)
          universal_apk=$(find apps/nami/app/build/outputs/apk/release -type f -name '*universal*release*unsigned.apk' -print -quit)
          aab=$(find apps/nami/app/build/outputs/bundle/release -type f -name '*.aab' -print -quit)

          test -n "$arm64_apk"
          test -n "$universal_apk"
          test -n "$aab"

          "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" sign             --ks "$RUNNER_TEMP/nami-release.jks"             --ks-key-alias "$NAMI_RELEASE_KEY_ALIAS"             --ks-pass "env:NAMI_RELEASE_STORE_PASSWORD"             --key-pass "env:NAMI_RELEASE_KEY_PASSWORD"             --out dist/nami-production/nami-arm64-v8a-release.apk             "$arm64_apk"

          "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" sign             --ks "$RUNNER_TEMP/nami-release.jks"             --ks-key-alias "$NAMI_RELEASE_KEY_ALIAS"             --ks-pass "env:NAMI_RELEASE_STORE_PASSWORD"             --key-pass "env:NAMI_RELEASE_KEY_PASSWORD"             --out dist/nami-production/nami-universal-release.apk             "$universal_apk"

          cp "$aab" dist/nami-production/nami-release-unsigned.aab
          jarsigner             -keystore "$RUNNER_TEMP/nami-release.jks"             -storepass "$NAMI_RELEASE_STORE_PASSWORD"             -keypass "$NAMI_RELEASE_KEY_PASSWORD"             -signedjar dist/nami-production/nami-release.aab             dist/nami-production/nami-release-unsigned.aab             "$NAMI_RELEASE_KEY_ALIAS"

          "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose             dist/nami-production/nami-arm64-v8a-release.apk
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose             dist/nami-production/nami-universal-release.apk
          jarsigner -verify -verbose -certs dist/nami-production/nami-release.aab

          (
            cd dist/nami-production
            sha256sum               nami-arm64-v8a-release.apk               nami-universal-release.apk               nami-release.aab               > nami-release-SHA256SUMS.txt
          )

      - name: Upload production release
        uses: actions/upload-artifact@v4
        with:
          name: nami-${{ inputs.release_label }}-${{ github.sha }}
          path: |
            dist/nami-production/nami-arm64-v8a-release.apk
            dist/nami-production/nami-universal-release.apk
            dist/nami-production/nami-release.aab
            dist/nami-production/nami-release-SHA256SUMS.txt
          if-no-files-found: error

      - name: Require a release tag when publishing
        if: ${{ inputs.publish_release }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${{ inputs.release_tag }}" ]; then
            echo "::error::release_tag is required when publish_release is enabled"
            exit 1
          fi

      - name: Publish verified files to GitHub Release
        if: ${{ inputs.publish_release }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG"               dist/nami-production/nami-arm64-v8a-release.apk               dist/nami-production/nami-universal-release.apk               dist/nami-production/nami-release.aab               dist/nami-production/nami-release-SHA256SUMS.txt               --clobber
          else
            gh release create "$RELEASE_TAG"               dist/nami-production/nami-arm64-v8a-release.apk               dist/nami-production/nami-universal-release.apk               dist/nami-production/nami-release.aab               dist/nami-production/nami-release-SHA256SUMS.txt               --target "$GITHUB_SHA"               --title "Nami ${RELEASE_TAG#nami-}"               --generate-notes
          fi
