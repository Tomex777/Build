name: Flixer API-driven anime E2E

on:
  push:
    branches: [anime-e2e-continuation-20260930]
    paths:
      - '.github/workflows/flixer-api-driven-anime-e2e.yml'

permissions:
  contents: read

jobs:
  strict:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null
          mkdir -p proof
      - name: Search API to direct watch and media
        shell: bash
        run: |
          cat > flixer-api.mjs <<'NODE'
          import { chromium } from 'playwright';
          import fs from 'node:fs';

          const UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/153.0.0.0 Safari/537.36';
          const browser=await chromium.launch({headless:true,args:['--autoplay-policy=no-user-gesture-required','--disable-blink-features=AutomationControlled']});
          const ctx=await browser.newContext({userAgent:UA,ignoreHTTPSErrors:true,viewport:{width:1365,height:900}});
          const page=await ctx.newPage();
          const out={site:'https://flixer.su',api:[],media:[],proofs:[]};

          page.on('response',async r=>{
            try{
              const h=await r.allHeaders(),ct=h['content-type']||'',u=r.url();
              if(/plsdontscrapemelove|\/api\//i.test(u))out.api.push({url:u,status:r.status(),contentType:ct,headers:await r.request().allHeaders()});
              if(/\.(?:m3u8|mpd|mp4|m4s|ts)(?:$|\?)/i.test(u)||/mpegurl|dash\+xml|^video\//i.test(ct)){
                out.media.push({url:u,status:r.status(),contentType:ct,headers:await r.request().allHeaders()});
              }
            }catch{}
          });

          async function prove(m){
            const h={...m.headers,'User-Agent':UA};
            for(const k of Object.keys(h))if(k.startsWith(':')||['host','content-length','accept-encoding','connection'].includes(k.toLowerCase()))delete h[k];
            try{
              const r=await ctx.request.get(m.url,{headers:h,timeout:25000,failOnStatusCode:false});
              const b=await r.body(),ct=r.headers()['content-type']||'';
              if(/\.m3u8(?:$|\?)/i.test(m.url)||/mpegurl/i.test(ct)){
                const text=b.toString('utf8');
                if(!text.trimStart().startsWith('#EXTM3U'))return {kind:'hls',status:r.status(),pass:false};
                let urls=[];
                for(const line of text.split(/\r?\n/)){const t=line.trim();if(t&&!t.startsWith('#'))urls.push(t);for(const mm of t.matchAll(/URI="([^"]+)"/g))urls.push(mm[1]);}
                urls=[...new Set(urls)].map(x=>new URL(x,m.url).href);
                for(const u of urls.slice(0,10)){
                  const r1=await ctx.request.get(u,{headers:h,timeout:25000,failOnStatusCode:false});
                  let bb=await r1.body(),tt=bb.toString('utf8');
                  if(tt.trimStart().startsWith('#EXTM3U')){
                    let us=[];for(const line of tt.split(/\r?\n/)){const t=line.trim();if(t&&!t.startsWith('#'))us.push(t);for(const mm of t.matchAll(/URI="([^"]+)"/g))us.push(mm[1]);}
                    for(const su0 of [...new Set(us)].slice(0,8)){
                      const su=new URL(su0,u).href;
                      const sr=await ctx.request.get(su,{headers:{...h,Range:'bytes=0-131071'},timeout:25000,failOnStatusCode:false});
                      const sb=await sr.body();
                      if([200,206].includes(sr.status())&&sb.length>2048)return {kind:'hls',masterStatus:r.status(),playlistStatus:r1.status(),segmentStatus:sr.status(),segmentBytes:sb.length,pass:true};
                    }
                  }else if([200,206].includes(r1.status())&&bb.length>2048)return {kind:'hls-child',status:r1.status(),bytes:bb.length,pass:true};
                }
                return {kind:'hls',status:r.status(),pass:false};
              }
              return {kind:'direct',status:r.status(),bytes:b.length,contentType:ct,pass:[200,206].includes(r.status())&&b.length>2048};
            }catch(e){return {pass:false,error:String(e)}}
          }

          try{
            const nav=await page.goto('https://flixer.su/',{waitUntil:'domcontentloaded',timeout:55000});
            await page.waitForTimeout(5000);
            out.homeStatus=nav?.status()??null;

            const search=await page.evaluate(async ()=>{
              const r=await fetch('https://plsdontscrapemelove.flixer.su/api/tmdb/search/tv?language=en-US&query=One%20Piece&page=1',{headers:{Accept:'application/json'}});
              const text=await r.text();let body;try{body=JSON.parse(text)}catch{body=text}
              return {status:r.status,body,text};
            });
            out.searchStatus=search.status;
            out.searchBody=search.body;
            const results=search.body?.results||search.body?.data?.results||search.body?.data||[];
            const rows=Array.isArray(results)?results:[];
            out.searchCount=rows.length;
            const item=rows.find(x=>/^one piece$/i.test(x.name||x.title||''))||rows.find(x=>/one piece/i.test(x.name||x.title||''))||rows[0];
            out.item=item||null;
            const id=item?.id||item?.tmdb_id||item?.tmdbId;
            if(!id)throw new Error('No TMDB id in search JSON');
            out.watchUrl='https://flixer.su/watch/tv/'+id+'/1/1';

            const wr=await page.goto(out.watchUrl,{waitUntil:'domcontentloaded',timeout:55000});
            await page.waitForTimeout(14000);
            out.watchStatus=wr?.status()??null;
            out.finalUrl=page.url();

            for(let round=0;round<8;round++){
              for(const f of page.frames()){
                try{
                  const v=f.locator('video').first();
                  if(await v.count())await v.evaluate(el=>{el.muted=true;el.volume=0;el.play().catch(()=>{});});
                  const b=f.locator('button[aria-label*="play" i],button[title*="play" i],.vjs-big-play-button,.jw-icon-playback,[class*="play" i]').first();
                  if(await b.count())try{await b.click({timeout:800})}catch{}
                }catch{}
              }
              await page.waitForTimeout(1800);
            }
            let max=0,dur=0,ready=false;
            for(const f of page.frames()){
              try{
                const vs=await f.locator('video').evaluateAll(xs=>xs.map(v=>({t:v.currentTime,d:Number.isFinite(v.duration)?v.duration:0,r:v.readyState,w:v.videoWidth,h:v.videoHeight})));
                for(const v of vs){max=Math.max(max,v.t||0);dur=Math.max(dur,v.d||0);if(v.r>=2&&v.w>0&&v.h>0)ready=true}
              }catch{}
            }
            out.player={maxCurrentTime:max,maxDuration:dur,ready,advanced:max>=1,frameCount:page.frames().length};
            out.api=[...new Map(out.api.map(x=>[x.url,x])).values()];
            out.media=[...new Map(out.media.map(x=>[x.url,x])).values()];
            for(const m of out.media.filter(x=>[200,206].includes(x.status)).slice(0,25)){
              const p=await prove(m);out.proofs.push({url:m.url,proof:p});if(p.pass)break;
            }
            out.pass=Boolean(out.player.advanced||out.proofs.some(x=>x.proof?.pass));
            out.verdict=out.pass?'STRICT_PASS':out.media.length?'MEDIA_NOT_PROVEN':out.api.length?'SIGNED_API_ACTIVE_NO_MEDIA':'NO_CHAIN';
          }catch(e){out.error=String(e);out.pass=false;out.verdict='ERROR'}

          fs.writeFileSync('proof/result.json',JSON.stringify(out,null,2));
          console.log(JSON.stringify({
            homeStatus:out.homeStatus,searchStatus:out.searchStatus,searchCount:out.searchCount,
            item:out.item,watchUrl:out.watchUrl,watchStatus:out.watchStatus,
            apiCount:out.api.length,mediaCount:out.media.length,player:out.player,
            winningProof:out.proofs.find(x=>x.proof?.pass)||null,
            pass:out.pass,verdict:out.verdict,error:out.error||null
          },null,2));
          await browser.close();
          NODE
          node flixer-api.mjs
      - name: Upload proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flixer-api-driven-anime-e2e
          path: proof/result.json
          if-no-files-found: error
