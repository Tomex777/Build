name: Later editor QA

on:
  push:
    branches:
      - later-editor-qa

concurrency:
  group: later-editor-qa
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  editor-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout QA branch
        uses: actions/checkout@v4

      - name: Restore verified Later source
        shell: bash
        run: |
          set -euo pipefail
          cat .later-qa/source/part-* > later-build.tar.xz.b64
          base64 -d later-build.tar.xz.b64 > later-build.tar.xz
          echo 'b98f343406579d4fe8476d04f2f510127fe774e83240af1a73fe142360fb16b2  later-build.tar.xz' | sha256sum -c -
          mkdir -p later
          tar -xJf later-build.tar.xz -C later
          chmod +x later/gradlew || true
          sed -i 's/compileSdk = 36/compileSdk = 37/' later/app/build.gradle.kts
          grep -q 'compileSdk = 37' later/app/build.gradle.kts

          patch -d later -p1 < .later-qa/patches/compact-editor-toolbar.patch
          patch -d later -p1 < .later-qa/patches/body-editor-empty.patch
          patch -d later -p1 < .later-qa/patches/body-placeholder-title.patch
          patch -d later -p1 < .later-qa/patches/editor-polish.patch
          patch -d later -p1 < .later-qa/patches/editor-layout-polish.patch
          patch -d later -p1 < .later-qa/patches/editor-title-compact-width.patch
          patch -d later -p1 < .later-qa/patches/seal-small-screen-scroll.patch
          patch -d later -p1 < .later-qa/patches/editor-postfinal-polish.patch

          # QA-only instrumentation proving real rich-text selection/HTML mutation.
          patch -d later -p1 < .later-qa/patches/format-diagnostics.patch

          grep -q 'for attempt in 1 2 3 4 5' .github/scripts/later-editor-qa.sh
          grep -q 'editor-before-scroll' .github/scripts/later-editor-qa.sh
          grep -q 'EditorBodyQA' .github/scripts/later-editor-qa.sh
          grep -q 'seal-after-first-back' .github/scripts/later-editor-qa.sh
          grep -q 'LATER_EDITOR_QA_PASS' .github/scripts/later-editor-qa.sh
          grep -q 'LATER_FORMAT_SCROLL_QA_PASS' .github/scripts/later-format-scroll-qa.sh

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android build SDKs
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'platforms;android-37.0' 'build-tools;36.0.0' 'platform-tools'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          validate-wrappers: false

      - name: Unit tests and debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle -p later testDebugUnitTest assembleDebug --stacktrace --console=plain

      - name: Enable KVM for emulator
        shell: bash
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
            ls -l /dev/kvm
          fi

      - name: API 36 editor emulator validation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/later-editor-qa.sh && bash .github/scripts/later-format-scroll-qa.sh

      - name: Build clean production package
        shell: bash
        run: |
          set -euo pipefail
          final_name='Later_V2_2_4_EDITOR_FINAL_2026-09-15'
          rm -rf later-clean "$final_name" "${final_name}.zip" "${final_name}.apk"
          mkdir -p later-clean
          tar -xJf later-build.tar.xz -C later-clean
          chmod +x later-clean/gradlew || true
          sed -i 's/compileSdk = 36/compileSdk = 37/' later-clean/app/build.gradle.kts
          grep -q 'compileSdk = 37' later-clean/app/build.gradle.kts

          patch -d later-clean -p1 < .later-qa/patches/compact-editor-toolbar.patch
          patch -d later-clean -p1 < .later-qa/patches/body-editor-empty.patch
          patch -d later-clean -p1 < .later-qa/patches/body-placeholder-title.patch
          patch -d later-clean -p1 < .later-qa/patches/editor-polish.patch
          patch -d later-clean -p1 < .later-qa/patches/editor-layout-polish.patch
          patch -d later-clean -p1 < .later-qa/patches/editor-title-compact-width.patch
          patch -d later-clean -p1 < .later-qa/patches/seal-small-screen-scroll.patch
          patch -d later-clean -p1 < .later-qa/patches/editor-postfinal-polish.patch

          # Patch backup/reject files are build mechanics, not product source.
          find later-clean -type f \( -name '*.orig' -o -name '*.rej' -o -name '*~' \) -delete
          if find later-clean -type f \( -name '*.orig' -o -name '*.rej' -o -name '*~' \) | grep -q .; then
            echo 'Patch backup files leaked into clean production source' >&2
            exit 1
          fi

          if grep -R -n 'LaterFormatQA' later-clean/app/src/main later-clean/app/src/test; then
            echo 'QA diagnostics leaked into clean production source' >&2
            exit 1
          fi

          gradle -p later-clean testDebugUnitTest assembleDebug --stacktrace --console=plain
          cp later-clean/app/build/outputs/apk/debug/app-debug.apk "${final_name}.apk"

          rm -rf later-clean/.gradle later-clean/build later-clean/app/build
          mv later-clean "$final_name"
          zip -qr "${final_name}.zip" "$final_name"
          sha256sum "${final_name}.apk" "${final_name}.zip" > "${final_name}.sha256"
          cat "${final_name}.sha256"

      - name: Upload clean Later package
        uses: actions/upload-artifact@v4
        with:
          name: later-editor-final-clean
          if-no-files-found: error
          path: |
            Later_V2_2_4_EDITOR_FINAL_2026-09-15.apk
            Later_V2_2_4_EDITOR_FINAL_2026-09-15.zip
            Later_V2_2_4_EDITOR_FINAL_2026-09-15.sha256

      - name: Upload editor QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: later-editor-qa-evidence
          if-no-files-found: warn
          path: |
            later/app/build/outputs/apk/debug/app-debug.apk
            later/app/build/reports/tests/
            later/qa-evidence/
