name: Later editor QA

on:
  push:
    branches:
      - later-editor-qa

concurrency:
  group: later-editor-qa
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  editor-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout QA branch
        uses: actions/checkout@v4

      - name: Restore verified Later source
        shell: bash
        run: |
          set -euo pipefail
          cat .later-qa/source/part-* > later-build.tar.xz.b64
          base64 -d later-build.tar.xz.b64 > later-build.tar.xz
          echo 'b98f343406579d4fe8476d04f2f510127fe774e83240af1a73fe142360fb16b2  later-build.tar.xz' | sha256sum -c -
          mkdir -p later
          tar -xJf later-build.tar.xz -C later
          chmod +x later/gradlew || true
          sed -i 's/compileSdk = 36/compileSdk = 37/' later/app/build.gradle.kts
          grep -q 'compileSdk = 37' later/app/build.gradle.kts
          patch -d later -p1 < .later-qa/patches/compact-editor-toolbar.patch
          patch -d later -p1 < .later-qa/patches/body-editor-empty.patch
          patch -d later -p1 < .later-qa/patches/body-placeholder-title.patch
          patch -d later -p1 < .later-qa/patches/editor-polish.patch
          patch -d later -p1 < .later-qa/patches/editor-layout-polish.patch
          patch -d later -p1 < .later-qa/patches/editor-title-compact-width.patch
          patch -d later -p1 < .later-qa/patches/format-diagnostics.patch

          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/later-editor-qa.sh')
          text = path.read_text()

          def replace_once(old: str, new: str, name: str) -> None:
              global text
              if text.count(old) != 1:
                  raise SystemExit(f'{name}: expected exactly one match, found {text.count(old)}')
              text = text.replace(old, new, 1)

          replace_once(
              """assert_editor() {
            local f=\"$1\"
            for l in Seal Media Voice Attachment Sticker Format; do assert_label \"$f\" \"$l\"; done
            assert_desc \"$f\" 'Go back'
            assert_desc \"$f\" 'Change mood'
          }

          adb wait-for-device
          """,
              """assert_editor() {
            local f=\"$1\"
            for l in Seal Media Voice Attachment Sticker Format; do assert_label \"$f\" \"$l\"; done
            assert_desc \"$f\" 'Go back'
            assert_desc \"$f\" 'Change mood'
          }

          collect_evidence() {
            adb logcat -d > qa-evidence/logcat.txt 2>/dev/null || true
            adb logcat -b crash -d > qa-evidence/crash.txt 2>/dev/null || true
            adb logcat -d -s LaterFormatQA:I > qa-evidence/format-log.txt 2>/dev/null || true
          }
          trap collect_evidence EXIT

          adb wait-for-device
          """,
              'always-capture evidence',
          )

          replace_once(
              """dump editor-body-keyboard; shot editor-body-keyboard
          assert_label qa-evidence/editor-body-keyboard.xml 'EditorBodyQA'
          adb shell input keyevent 4; sleep 1
          dump editor-body; shot editor-body
          assert_editor qa-evidence/editor-body.xml

          # Format Home: exercise the actual inline-format toggles and their selected state.
          click_label qa-evidence/editor-body.xml 'Format'
          """,
              """dump editor-body-keyboard; shot editor-body-keyboard
          assert_label qa-evidence/editor-body-keyboard.xml 'EditorBodyQA'
          assert_editor qa-evidence/editor-body-keyboard.xml

          # Keep the real editor focus and selected body range alive while Format opens.
          adb shell input keycombination KEYCODE_CTRL_LEFT KEYCODE_A
          sleep 0.6
          dump editor-body-selected; shot editor-body-selected

          # Format Home: state/HTML diagnostics are authoritative for rich-text changes.
          click_label qa-evidence/editor-body-selected.xml 'Format'
          """,
              'preserve body selection into format sheet',
          )

          replace_once(
              """  dump \"format-${style,,}-selected\"
            assert_selected_desc \"qa-evidence/format-${style,,}-selected.xml\" \"$style\"
            cp \"qa-evidence/format-${style,,}-selected.xml\" qa-evidence/format-home.xml
          done
          shot format-inline-selected
          """,
              """  dump \"format-${style,,}-selected\"
            cp \"qa-evidence/format-${style,,}-selected.xml\" qa-evidence/format-home.xml
            adb logcat -d -s LaterFormatQA:I > qa-evidence/format-log.txt 2>/dev/null || true
          done
          shot format-inline-selected
          """,
              'use HTML diagnostics for inline formatting',
          )

          replace_once(
              """  dump \"paragraph-${style,,}-selected\"
            assert_selected_ancestor_of_text \"qa-evidence/paragraph-${style,,}-selected.xml\" \"$style\"
            click_label \"qa-evidence/paragraph-${style,,}-selected.xml\" \"$style\"
          """,
              """  dump \"paragraph-${style,,}-selected\"
            adb logcat -d -s LaterFormatQA:I > qa-evidence/format-log.txt 2>/dev/null || true
            click_label \"qa-evidence/paragraph-${style,,}-selected.xml\" \"$style\"
          """,
              'use HTML diagnostics for paragraph formatting',
          )

          replace_once(
              """assert_selected_desc qa-evidence/mood-reopen.xml 'Peaceful'
          adb shell input keyevent 4; sleep 1
          """,
              """grep -q 'content-desc=\"Peaceful\".*checked=\"true\"' qa-evidence/mood-reopen.xml || { cat qa-evidence/mood-reopen.xml; exit 1; }
          adb shell input keyevent 4; sleep 1
          """,
              'use Android checked semantics for persisted mood',
          )

          replace_once(
              """assert_label qa-evidence/home-relaunch.xml 'EditorBodyQA'
          click_text qa-evidence/home-relaunch.xml 'EditorBodyQA'
          """,
              """assert_label qa-evidence/home-relaunch.xml 'LaterEditorQA'
          click_text qa-evidence/home-relaunch.xml 'LaterEditorQA'
          """,
              'draft card title-first assertion',
          )

          path.write_text(text)
          PY

          grep -q "editor-body-selected" .github/scripts/later-editor-qa.sh
          grep -q "checked=\\\"true\\\"" .github/scripts/later-editor-qa.sh
          grep -q "LaterEditorQA'" .github/scripts/later-editor-qa.sh

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android build SDKs
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'platforms;android-37.0' 'build-tools;36.0.0' 'platform-tools'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          validate-wrappers: false

      - name: Unit tests and debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle -p later testDebugUnitTest assembleDebug --stacktrace --console=plain

      - name: Enable KVM for emulator
        shell: bash
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
            ls -l /dev/kvm
          fi

      - name: API 36 editor emulator validation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/later-editor-qa.sh

      - name: Upload editor QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: later-editor-qa-evidence
          if-no-files-found: warn
          path: |
            later/app/build/outputs/apk/debug/app-debug.apk
            later/app/build/reports/tests/
            later/qa-evidence/
