name: Later editor QA

on:
  push:
    branches:
      - later-editor-qa

concurrency:
  group: later-editor-qa
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  editor-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout QA branch
        uses: actions/checkout@v4

      - name: Restore verified Later source
        shell: bash
        run: |
          set -euo pipefail
          cat .later-qa/source/part-* > later-build.tar.xz.b64
          base64 -d later-build.tar.xz.b64 > later-build.tar.xz
          echo 'b98f343406579d4fe8476d04f2f510127fe774e83240af1a73fe142360fb16b2  later-build.tar.xz' | sha256sum -c -
          mkdir -p later
          tar -xJf later-build.tar.xz -C later
          chmod +x later/gradlew || true
          sed -i 's/compileSdk = 36/compileSdk = 37/' later/app/build.gradle.kts
          grep -q 'compileSdk = 37' later/app/build.gradle.kts
          patch -d later -p1 < .later-qa/patches/compact-editor-toolbar.patch
          patch -d later -p1 < .later-qa/patches/body-editor-empty.patch
          patch -d later -p1 < .later-qa/patches/body-placeholder-title.patch
          patch -d later -p1 < .later-qa/patches/editor-polish.patch
          patch -d later -p1 < .later-qa/patches/editor-layout-polish.patch
          patch -d later -p1 < .later-qa/patches/editor-title-compact-width.patch
          patch -d later -p1 < .later-qa/patches/seal-small-screen-scroll.patch
          patch -d later -p1 < .later-qa/patches/format-diagnostics.patch

          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/later-editor-qa.sh')
          text = path.read_text()

          def replace_once(old: str, new: str, name: str) -> None:
              global text
              if text.count(old) != 1:
                  raise SystemExit(f'{name}: expected exactly one match, found {text.count(old)}')
              text = text.replace(old, new, 1)

          replace_once(
              """dump() {
            local name=\"$1\"
            adb shell uiautomator dump /sdcard/later-window.xml >/dev/null
            adb pull /sdcard/later-window.xml \"qa-evidence/${name}.xml\" >/dev/null
          }
          """,
              """dump() {
            local name=\"$1\"
            local ok=0
            for attempt in 1 2 3 4 5; do
              adb shell rm -f /sdcard/later-window.xml >/dev/null 2>&1 || true
              if adb shell uiautomator dump /sdcard/later-window.xml >/dev/null 2>&1 && \
                 adb shell test -s /sdcard/later-window.xml; then
                ok=1
                break
              fi
              sleep 1
            done
            if [ \"$ok\" -ne 1 ]; then
              echo \"uiautomator dump failed for $name\" >&2
              exit 1
            fi
            adb pull /sdcard/later-window.xml \"qa-evidence/${name}.xml\" >/dev/null
          }
          """,
              'retry transient uiautomator dumps',
          )

          replace_once(
              """assert_editor() {
            local f=\"$1\"
            for l in Seal Media Voice Attachment Sticker Format; do assert_label \"$f\" \"$l\"; done
            assert_desc \"$f\" 'Go back'
            assert_desc \"$f\" 'Change mood'
          }

          adb wait-for-device
          """,
              """assert_editor() {
            local f=\"$1\"
            for l in Seal Media Voice Attachment Sticker Format; do assert_label \"$f\" \"$l\"; done
            assert_desc \"$f\" 'Go back'
            assert_desc \"$f\" 'Change mood'
          }

          collect_evidence() {
            adb logcat -d > qa-evidence/logcat.txt 2>/dev/null || true
            adb logcat -b crash -d > qa-evidence/crash.txt 2>/dev/null || true
            adb logcat -d -s LaterFormatQA:I > qa-evidence/format-log.txt 2>/dev/null || true
          }
          trap collect_evidence EXIT

          adb wait-for-device
          """,
              'always-capture evidence',
          )

          replace_once(
              """dump editor-body-keyboard
          if ! grep -q 'text=\"EditorBodyQA\"' qa-evidence/editor-body-keyboard.xml; then
            echo 'retrying body text after IME/focus settle'
            adb shell input keycombination KEYCODE_CTRL_LEFT KEYCODE_A
            sleep 0.3
            adb shell input text 'EditorBodyQA'
            sleep 1
            dump editor-body-keyboard
          fi
          shot editor-body-keyboard
          assert_label qa-evidence/editor-body-keyboard.xml 'EditorBodyQA'
          adb shell input keyevent 4; sleep 1
          dump editor-body; shot editor-body
          assert_editor qa-evidence/editor-body.xml

          # Format Home: exercise the actual inline-format toggles and their selected state.
          click_label qa-evidence/editor-body.xml 'Format'
          """,
              """dump editor-body-keyboard
          if ! grep -q 'text=\"EditorBodyQA\"' qa-evidence/editor-body-keyboard.xml; then
            echo 'retrying body text after IME/focus settle'
            adb shell input keycombination KEYCODE_CTRL_LEFT KEYCODE_A
            sleep 0.3
            adb shell input text 'EditorBodyQA'
            sleep 1
            dump editor-body-keyboard
          fi
          shot editor-body-keyboard
          assert_label qa-evidence/editor-body-keyboard.xml 'EditorBodyQA'
          assert_editor qa-evidence/editor-body-keyboard.xml

          # Keep the real editor focus and selected body range alive while Format opens.
          adb shell input keycombination KEYCODE_CTRL_LEFT KEYCODE_A
          sleep 0.6
          dump editor-body-selected; shot editor-body-selected

          # Format Home: state/HTML diagnostics are authoritative for rich-text changes.
          click_label qa-evidence/editor-body-selected.xml 'Format'
          """,
              'preserve robust body entry and selection into format sheet',
          )

          replace_once(
              """  dump \"format-${style,,}-selected\"
            assert_selected_desc \"qa-evidence/format-${style,,}-selected.xml\" \"$style\"
            cp \"qa-evidence/format-${style,,}-selected.xml\" qa-evidence/format-home.xml
          done
          shot format-inline-selected
          """,
              """  dump \"format-${style,,}-selected\"
            cp \"qa-evidence/format-${style,,}-selected.xml\" qa-evidence/format-home.xml
            adb logcat -d -s LaterFormatQA:I > qa-evidence/format-log.txt 2>/dev/null || true
          done
          shot format-inline-selected
          """,
              'use HTML diagnostics for inline formatting',
          )

          replace_once(
              """  dump \"paragraph-${style,,}-selected\"
            assert_selected_ancestor_of_text \"qa-evidence/paragraph-${style,,}-selected.xml\" \"$style\"
            click_label \"qa-evidence/paragraph-${style,,}-selected.xml\" \"$style\"
          """,
              """  dump \"paragraph-${style,,}-selected\"
            adb logcat -d -s LaterFormatQA:I > qa-evidence/format-log.txt 2>/dev/null || true
            click_label \"qa-evidence/paragraph-${style,,}-selected.xml\" \"$style\"
          """,
              'use HTML diagnostics for paragraph formatting',
          )

          replace_once(
              """assert_selected_desc qa-evidence/mood-reopen.xml 'Peaceful'
          adb shell input keyevent 4; sleep 1
          """,
              """grep -q 'content-desc=\"Peaceful\".*checked=\"true\"' qa-evidence/mood-reopen.xml || { cat qa-evidence/mood-reopen.xml; exit 1; }
          adb shell input keyevent 4; sleep 0.7
          dump mood-after-first-back
          if grep -q 'How does this moment feel?' qa-evidence/mood-after-first-back.xml; then
            adb shell input keyevent 4; sleep 1
          fi
          dump editor-after-mood-close
          assert_editor qa-evidence/editor-after-mood-close.xml
          """,
              'verify persisted mood and dismiss sheet via back states',
          )

          replace_once(
              """# Seal sheet should open but QA never seals the synthetic entry.
          dump editor-before-seal
          click_label qa-evidence/editor-before-seal.xml 'Seal'; sleep 1
          dump seal; shot seal
          assert_label qa-evidence/seal.xml 'Date'; assert_label qa-evidence/seal.xml 'Time'
          assert_label qa-evidence/seal.xml 'Choose a time in the future.'; assert_label qa-evidence/seal.xml 'Seal capsule'
          adb shell input keyevent 4; sleep 1
          """,
              """# Seal sheet should expose presets first, then every lower control by scrolling.
          dump editor-before-seal
          click_label qa-evidence/editor-before-seal.xml 'Seal'; sleep 1
          dump seal; shot seal
          assert_label qa-evidence/seal.xml 'When should this return?'
          assert_label qa-evidence/seal.xml 'Choose when your future self gets access.'
          for l in Tomorrow '1 week' '1 month' '1 year'; do assert_label qa-evidence/seal.xml \"$l\"; done
          cat qa-evidence/seal.xml > qa-evidence/seal-scroll-history.txt
          cp qa-evidence/seal.xml qa-evidence/seal-scrolled.xml
          for i in 1 2 3 4; do
            if grep -q 'text=\"Seal capsule\"' qa-evidence/seal-scrolled.xml; then break; fi
            adb shell input swipe 160 600 160 360 500
            sleep 0.6
            dump seal-scrolled
            cat qa-evidence/seal-scrolled.xml >> qa-evidence/seal-scroll-history.txt
          done
          shot seal-scrolled
          grep -q 'text=\"Date\"' qa-evidence/seal-scroll-history.txt
          grep -q 'text=\"Time\"' qa-evidence/seal-scroll-history.txt
          grep -q \"You won't be able to open or edit this capsule until then.\" qa-evidence/seal-scroll-history.txt
          grep -q 'text=\"Seal capsule\"' qa-evidence/seal-scroll-history.txt
          adb shell input keyevent 4; sleep 1
          dump editor-after-seal
          assert_editor qa-evidence/editor-after-seal.xml
          """,
              'follow current seal sheet and compact scrolling',
          )

          replace_once(
              """assert_label qa-evidence/home-relaunch.xml 'EditorBodyQA'
          click_text qa-evidence/home-relaunch.xml 'EditorBodyQA'
          """,
              """assert_label qa-evidence/home-relaunch.xml 'LaterEditorQA'
          click_text qa-evidence/home-relaunch.xml 'LaterEditorQA'
          """,
              'draft card title-first assertion',
          )

          path.write_text(text)
          PY

          grep -q "for attempt in 1 2 3 4 5" .github/scripts/later-editor-qa.sh
          grep -q "retrying title text" .github/scripts/later-editor-qa.sh
          grep -q "editor-body-selected" .github/scripts/later-editor-qa.sh
          grep -q "mood-after-first-back" .github/scripts/later-editor-qa.sh
          grep -q "seal-scroll-history" .github/scripts/later-editor-qa.sh
          grep -q "LaterEditorQA'" .github/scripts/later-editor-qa.sh

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android build SDKs
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'platforms;android-37.0' 'build-tools;36.0.0' 'platform-tools'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          validate-wrappers: false

      - name: Unit tests and debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle -p later testDebugUnitTest assembleDebug --stacktrace --console=plain

      - name: Enable KVM for emulator
        shell: bash
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
            ls -l /dev/kvm
          fi

      - name: API 36 editor emulator validation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/later-editor-qa.sh

      - name: Upload editor QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: later-editor-qa-evidence
          if-no-files-found: warn
          path: |
            later/app/build/outputs/apk/debug/app-debug.apk
            later/app/build/reports/tests/
            later/qa-evidence/
