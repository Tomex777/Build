name: Later editor QA

on:
  push:
    branches:
      - later-editor-qa

concurrency:
  group: later-editor-qa
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  editor-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout QA branch
        uses: actions/checkout@v4

      - name: Restore verified Later source
        shell: bash
        run: |
          set -euo pipefail
          cat .later-qa/source/part-* > later-build.tar.xz.b64
          base64 -d later-build.tar.xz.b64 > later-build.tar.xz
          echo 'b98f343406579d4fe8476d04f2f510127fe774e83240af1a73fe142360fb16b2  later-build.tar.xz' | sha256sum -c -
          mkdir -p later
          tar -xJf later-build.tar.xz -C later
          chmod +x later/gradlew || true
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("later/app/build.gradle.kts")
          s = p.read_text()
          s = re.sub(r'compileSdk\s*=\s*\d+', 'compileSdk = 36', s)
          s = re.sub(r'minSdk\s*=\s*\d+', 'minSdk = 26', s)
          s = re.sub(r'targetSdk\s*=\s*\d+', 'targetSdk = 36', s)
          s = re.sub(r'versionCode\s*=\s*\d+', 'versionCode = 20260928', s)
          s = re.sub(r'versionName\s*=\s*"[^"]*"', 'versionName = "2.2.4"', s)
          p.write_text(s)
          vp = Path("later/gradle/libs.versions.toml")
          v = vp.read_text()
          pins = {
              "coreKtx": "1.17.0",
              "lifecycleRuntimeKtx": "2.10.0",
              "activityCompose": "1.11.0",
              "composeBom": "2026.06.01",
              "navigation": "2.9.8",
              "composeRichEditor": "1.1.0",
          }
          for key, value in pins.items():
              v, count = re.subn(rf'(?m)^({re.escape(key)}\s*=\s*)"[^"]+"', rf'\1"{value}"', v)
              if count != 1:
                  raise SystemExit(f"expected exactly one {key} version entry, found {count}")
          vp.write_text(v)
          PY
          grep -q 'compileSdk = 36' later/app/build.gradle.kts
          grep -q 'minSdk = 26' later/app/build.gradle.kts
          grep -q 'targetSdk = 36' later/app/build.gradle.kts
          grep -q 'versionCode = 20260928' later/app/build.gradle.kts
          grep -q 'versionName = "2.2.4"' later/app/build.gradle.kts
          grep -q 'coreKtx = "1.17.0"' later/gradle/libs.versions.toml
          grep -q 'lifecycleRuntimeKtx = "2.10.0"' later/gradle/libs.versions.toml
          grep -q 'activityCompose = "1.11.0"' later/gradle/libs.versions.toml
          grep -q 'composeBom = "2026.06.01"' later/gradle/libs.versions.toml
          grep -q 'navigation = "2.9.8"' later/gradle/libs.versions.toml
          grep -q 'composeRichEditor = "1.1.0"' later/gradle/libs.versions.toml

          patch -d later -p1 < .later-qa/patches/compact-editor-toolbar.patch
          patch -d later -p1 < .later-qa/patches/body-editor-empty.patch
          patch -d later -p1 < .later-qa/patches/body-placeholder-title.patch
          patch -d later -p1 < .later-qa/patches/editor-polish.patch
          patch -d later -p1 < .later-qa/patches/editor-layout-polish.patch
          patch -d later -p1 < .later-qa/patches/editor-title-compact-width.patch
          patch -d later -p1 < .later-qa/patches/seal-small-screen-scroll.patch
          patch -d later -p1 < .later-qa/patches/editor-postfinal-polish.patch
          patch -d later -p1 < .later-qa/patches/richtext-link-safety.patch
          patch -d later -p1 < .later-qa/patches/image-surfaces-v1.patch
          patch -d later -p1 < .later-qa/patches/video-editor-v1.patch
          patch --no-backup-if-mismatch -d later -p1 < .later-qa/patches/video-export-fileprovider.patch
          patch -d later -p1 < .later-qa/patches/release-branding.patch
          patch --no-backup-if-mismatch -d later -p1 < .later-qa/patches/api26-biometric-compat.patch
          python3 .github/scripts/apply-api26-biometric-compat.py later
          python3 .github/scripts/apply-portable-backup.py later
          python3 .github/scripts/apply-production-ui-cleanup.py later
          python3 .github/scripts/apply-media-viewer-state-restoration.py later
          grep -q 'var showVideoViewer by androidx.compose.runtime.saveable.rememberSaveable' later/app/src/main/java/com/night/later/ui/editor/CapsuleEditorScreen.kt
          grep -q 'class PortableBackupManager' later/app/src/main/java/com/night/later/data/backup/PortableBackupManager.kt
          grep -q 'Create backup' later/app/src/main/java/com/night/later/ui/settings/SettingsScreen.kt
          grep -q 'Restore backup' later/app/src/main/java/com/night/later/ui/settings/SettingsScreen.kt
          if grep -Fq 'Settings stays on Home.' later/app/src/main/java/com/night/later/ui/home/HomeScreen.kt ||
             grep -Fq 'Appearance, privacy, and storage.' later/app/src/main/java/com/night/later/ui/home/HomeScreen.kt; then
            echo 'Redundant Home settings helper copy remains' >&2
            exit 1
          fi
          if grep -Fq 'Make Later feel like yours.' later/app/src/main/java/com/night/later/ui/settings/SettingsScreen.kt; then
            echo 'Generic Settings filler copy remains' >&2
            exit 1
          fi
          grep -q 'implementation(libs.androidx.biometric)' later/app/build.gradle.kts
          grep -q 'androidx.biometric.BiometricManager' later/app/src/main/java/com/night/later/MainActivity.kt
          grep -q 'registerForAuthenticationResult' later/app/src/main/java/com/night/later/MainActivity.kt
          grep -q 'biometric = "1.4.0-alpha07"' later/gradle/libs.versions.toml

          # QA-only instrumentation proving real rich-text selection/HTML mutation.
          patch -d later -p1 < .later-qa/patches/format-diagnostics.patch

          grep -q 'for attempt in 1 2 3 4 5' .github/scripts/later-editor-qa.sh
          grep -q 'editor-before-scroll' .github/scripts/later-editor-qa.sh
          grep -q 'EditorBodyQA' .github/scripts/later-editor-qa.sh
          grep -q 'seal-after-first-back' .github/scripts/later-editor-qa.sh
          grep -q 'LATER_EDITOR_QA_PASS' .github/scripts/later-editor-qa.sh
          grep -q 'LATER_FORMAT_SCROLL_QA_PASS' .github/scripts/later-format-scroll-qa.sh
          grep -q '<cache-path name="video_edits" path="video_edits/"' later/app/src/main/res/xml/file_paths.xml

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android build SDKs
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          validate-wrappers: false

      - name: Install deterministic video fixture tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Unit tests and debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle -p later testDebugUnitTest assembleDebug --stacktrace --console=plain

      - name: Enable KVM for emulator
        shell: bash
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
            ls -l /dev/kvm
          fi

      - name: API 36 editor emulator validation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/later-editor-qa.sh && bash .github/scripts/later-media-qa.sh && bash .github/scripts/later-format-scroll-qa.sh && bash .github/scripts/later-production-ui-qa.sh

      - name: Build release candidate
        shell: bash
        run: |
          set -euo pipefail
          release_base='Later_V2_2_4_RELEASE_2026-09-28'
          rm -rf later-clean "${release_base}" "${release_base}"*.apk "${release_base}"*.aab "${release_base}"*.zip "${release_base}.sha256"
          mkdir -p later-clean
          tar -xJf later-build.tar.xz -C later-clean
          chmod +x later-clean/gradlew || true

          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("later-clean/app/build.gradle.kts")
          s = p.read_text()
          s = re.sub(r'compileSdk\s*=\s*\d+', 'compileSdk = 36', s)
          s = re.sub(r'minSdk\s*=\s*\d+', 'minSdk = 26', s)
          s = re.sub(r'targetSdk\s*=\s*\d+', 'targetSdk = 36', s)
          s = re.sub(r'versionCode\s*=\s*\d+', 'versionCode = 20260928', s)
          s = re.sub(r'versionName\s*=\s*"[^"]*"', 'versionName = "2.2.4"', s)
          p.write_text(s)
          vp = Path("later-clean/gradle/libs.versions.toml")
          v = vp.read_text()
          pins = {
              "coreKtx": "1.17.0",
              "lifecycleRuntimeKtx": "2.10.0",
              "activityCompose": "1.11.0",
              "composeBom": "2026.06.01",
              "navigation": "2.9.8",
              "composeRichEditor": "1.1.0",
          }
          for key, value in pins.items():
              v, count = re.subn(rf'(?m)^({re.escape(key)}\s*=\s*)"[^"]+"', rf'\1"{value}"', v)
              if count != 1:
                  raise SystemExit(f"expected exactly one {key} version entry, found {count}")
          vp.write_text(v)
          PY

          grep -q 'compileSdk = 36' later-clean/app/build.gradle.kts
          grep -q 'minSdk = 26' later-clean/app/build.gradle.kts
          grep -q 'targetSdk = 36' later-clean/app/build.gradle.kts
          grep -q 'versionCode = 20260928' later-clean/app/build.gradle.kts
          grep -q 'versionName = "2.2.4"' later-clean/app/build.gradle.kts
          grep -q 'coreKtx = "1.17.0"' later-clean/gradle/libs.versions.toml
          grep -q 'lifecycleRuntimeKtx = "2.10.0"' later-clean/gradle/libs.versions.toml
          grep -q 'activityCompose = "1.11.0"' later-clean/gradle/libs.versions.toml
          grep -q 'composeBom = "2026.06.01"' later-clean/gradle/libs.versions.toml
          grep -q 'navigation = "2.9.8"' later-clean/gradle/libs.versions.toml
          grep -q 'composeRichEditor = "1.1.0"' later-clean/gradle/libs.versions.toml

          patch -d later-clean -p1 < .later-qa/patches/compact-editor-toolbar.patch
          patch -d later-clean -p1 < .later-qa/patches/body-editor-empty.patch
          patch -d later-clean -p1 < .later-qa/patches/body-placeholder-title.patch
          patch -d later-clean -p1 < .later-qa/patches/editor-polish.patch
          patch -d later-clean -p1 < .later-qa/patches/editor-layout-polish.patch
          patch -d later-clean -p1 < .later-qa/patches/editor-title-compact-width.patch
          patch -d later-clean -p1 < .later-qa/patches/seal-small-screen-scroll.patch
          patch -d later-clean -p1 < .later-qa/patches/editor-postfinal-polish.patch
          patch -d later-clean -p1 < .later-qa/patches/richtext-link-safety.patch
          patch -d later-clean -p1 < .later-qa/patches/image-surfaces-v1.patch
          patch -d later-clean -p1 < .later-qa/patches/video-editor-v1.patch
          patch --no-backup-if-mismatch -d later-clean -p1 < .later-qa/patches/video-export-fileprovider.patch
          patch -d later-clean -p1 < .later-qa/patches/release-branding.patch
          patch --no-backup-if-mismatch -d later-clean -p1 < .later-qa/patches/api26-biometric-compat.patch
          python3 .github/scripts/apply-api26-biometric-compat.py later-clean
          python3 .github/scripts/apply-portable-backup.py later-clean
          python3 .github/scripts/apply-production-ui-cleanup.py later-clean
          python3 .github/scripts/apply-media-viewer-state-restoration.py later-clean
          grep -q 'var showVideoViewer by androidx.compose.runtime.saveable.rememberSaveable' later-clean/app/src/main/java/com/night/later/ui/editor/CapsuleEditorScreen.kt
          grep -q 'class PortableBackupManager' later-clean/app/src/main/java/com/night/later/data/backup/PortableBackupManager.kt
          grep -q 'Create backup' later-clean/app/src/main/java/com/night/later/ui/settings/SettingsScreen.kt
          grep -q 'Restore backup' later-clean/app/src/main/java/com/night/later/ui/settings/SettingsScreen.kt
          if grep -Fq 'Settings stays on Home.' later-clean/app/src/main/java/com/night/later/ui/home/HomeScreen.kt ||
             grep -Fq 'Appearance, privacy, and storage.' later-clean/app/src/main/java/com/night/later/ui/home/HomeScreen.kt; then
            echo 'Redundant Home settings helper copy remains in release source' >&2
            exit 1
          fi
          if grep -Fq 'Make Later feel like yours.' later-clean/app/src/main/java/com/night/later/ui/settings/SettingsScreen.kt; then
            echo 'Generic Settings filler copy remains in release source' >&2
            exit 1
          fi
          grep -q 'implementation(libs.androidx.biometric)' later-clean/app/build.gradle.kts
          grep -q 'androidx.biometric.BiometricManager' later-clean/app/src/main/java/com/night/later/MainActivity.kt
          grep -q 'registerForAuthenticationResult' later-clean/app/src/main/java/com/night/later/MainActivity.kt
          grep -q 'biometric = "1.4.0-alpha07"' later-clean/gradle/libs.versions.toml

          # Some patch hunks legitimately create .orig backups while composing the
          # verified release source. Remove those transient files before source guards:
          # they are not production inputs and may still contain superseded branding.
          find later-clean -type f \( -name '*.orig' -o -name '*.rej' -o -name '*~' \) -delete
          if find later-clean -type f \( -name '*.orig' -o -name '*.rej' -o -name '*~' \) | grep -q .; then
            echo 'Patch backup files leaked into clean production source' >&2
            exit 1
          fi

          if grep -R -n -E '"by Night"|"Night blue"' later-clean/app/src/main; then
            echo 'Superseded Night branding leaked into Later release UI' >&2
            exit 1
          fi
          if grep -R -n 'LaterFormatQA' later-clean/app/src/main later-clean/app/src/test; then
            echo 'QA diagnostics leaked into clean production source' >&2
            exit 1
          fi

          # Build the app bundle without ABI APK splits. AGP's resource shrinker
          # rejects bundleRelease when multiple split-specific shrunk resource files
          # exist in the same release intermediates directory.
          gradle -p later-clean testDebugUnitTest bundleRelease --stacktrace --console=plain
          aab="$(find later-clean/app/build/outputs/bundle/release -type f -name '*.aab' | head -n1)"
          test -s "$aab"

          # APKs are a separate release output. Enable ABI splits only after the
          # AAB is complete, then build the installable architecture-specific APKs.
          python3 - <<'PY'
          from pathlib import Path
          p = Path("later-clean/app/build.gradle.kts")
          s = p.read_text()
          if "splits {" not in s:
              marker = "    buildTypes {"
              split = """    splits {
                  abi {
                      isEnable = true
                      reset()
                      include("armeabi-v7a", "arm64-v8a", "x86", "x86_64")
                      isUniversalApk = false
                  }
              }

          """
              if marker not in s:
                  raise SystemExit("android buildTypes block not found")
              s = s.replace(marker, split + marker, 1)
          p.write_text(s)
          PY
          grep -q 'include("armeabi-v7a", "arm64-v8a", "x86", "x86_64")' later-clean/app/build.gradle.kts
          gradle -p later-clean assembleRelease --stacktrace --console=plain

          # Select ABI outputs without grep/head pipelines. With set -o pipefail,
          # a perfectly valid multi-line find can be reported as failure when a
          # downstream selector exits early. Match the concrete AGP split names
          # deterministically instead and keep discovery failure explicit.
          arm64_apk=''
          x86_64_apk=''
          while IFS= read -r apk; do
            echo "$apk"
            case "$(basename "$apk")" in
              *arm64-v8a*) arm64_apk="$apk" ;;
              *x86_64*) x86_64_apk="$apk" ;;
            esac
          done < <(find later-clean/app/build/outputs/apk -type f -name '*.apk' -print | sort)
          test -n "$arm64_apk" && test -s "$arm64_apk"
          test -n "$x86_64_apk" && test -s "$x86_64_apk"
          test "$arm64_apk" != "$x86_64_apk"
          test -s "$aab"

          cp "$arm64_apk" "${release_base}_ARM64_UNSIGNED.apk"
          cp "$arm64_apk" "${release_base}_ARM64_QA_SIGNED.apk"
          cp "$aab" "${release_base}_UNSIGNED.aab"
          cp "$x86_64_apk" "${release_base}_X86_64_QA_SIGNED.apk"

          apksigner_bin="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n1)"
          test -x "$apksigner_bin"

          # The install-validation APKs are QA artifacts, not production-signed
          # deliverables. Generate a dedicated ephemeral CI key explicitly instead
          # of assuming Gradle happened to create ~/.android/debug.keystore.
          qa_keystore="$RUNNER_TEMP/later-release-qa.jks"
          rm -f "$qa_keystore"
          keytool -genkeypair -noprompt \
            -keystore "$qa_keystore" \
            -storepass android \
            -keypass android \
            -alias laterqa \
            -keyalg RSA \
            -keysize 2048 \
            -validity 3650 \
            -dname "CN=Later Release QA, OU=CI, O=Later, C=US"
          test -s "$qa_keystore"
          echo "QA signing ARM64: $arm64_apk"
          echo "QA signing x86_64: $x86_64_apk"
          "$apksigner_bin" sign             --ks "$qa_keystore"             --ks-key-alias laterqa             --ks-pass pass:android             --key-pass pass:android             "${release_base}_X86_64_QA_SIGNED.apk"
          "$apksigner_bin" sign             --ks "$qa_keystore"             --ks-key-alias laterqa             --ks-pass pass:android             --key-pass pass:android             "${release_base}_ARM64_QA_SIGNED.apk"
          "$apksigner_bin" verify --verbose --print-certs "${release_base}_X86_64_QA_SIGNED.apk"
          "$apksigner_bin" verify --verbose --print-certs "${release_base}_ARM64_QA_SIGNED.apk"

          aapt_bin="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n1)"
          test -x "$aapt_bin"
          "$aapt_bin" dump badging "${release_base}_ARM64_QA_SIGNED.apk" > later-arm64-release-badging.txt
          grep -q "package: name='com.night.later' versionCode='20260928' versionName='2.2.4'" later-arm64-release-badging.txt
          grep -q "sdkVersion:'26'" later-arm64-release-badging.txt
          grep -q "targetSdkVersion:'36'" later-arm64-release-badging.txt

          # Production branding is part of the release contract, not just debug UI.
          "$aapt_bin" dump resources "${release_base}_ARM64_QA_SIGNED.apk" > later-arm64-release-resources.txt
          grep -q 'later_launcher_foreground' later-arm64-release-resources.txt
          grep -q 'later_launcher_monochrome' later-arm64-release-resources.txt
          grep -q 'later_launch_background' later-arm64-release-resources.txt
          unzip -l "${release_base}_ARM64_QA_SIGNED.apk" > later-arm64-release-files.txt
          grep -q 'res/mipmap-anydpi-v26/ic_launcher.xml' later-arm64-release-files.txt
          grep -q 'res/mipmap-anydpi-v26/ic_launcher_round.xml' later-arm64-release-files.txt

          # ABI splitting is only a packaging mechanism for the standalone APKs.
          # Remove it again before archiving source so a normal bundleRelease
          # from the release source cannot reproduce AGP's multi-split AAB error.
          python3 - <<'PY'
          from pathlib import Path
          p = Path("later-clean/app/build.gradle.kts")
          s = p.read_text()
          split = """    splits {
                  abi {
                      isEnable = true
                      reset()
                      include("armeabi-v7a", "arm64-v8a", "x86", "x86_64")
                      isUniversalApk = false
                  }
              }

          """
          if split not in s:
              raise SystemExit("temporary ABI split block missing before source cleanup")
          p.write_text(s.replace(split, "", 1))
          PY
          if grep -q 'splits {' later-clean/app/build.gradle.kts; then
            echo 'Temporary ABI split configuration leaked into archived release source' >&2
            exit 1
          fi

          cat > later-clean/RELEASE_CANDIDATE.txt <<EOF
          Later 2.2.4 release candidate
          Commit: ${GITHUB_SHA}
          compileSdk: 36
          targetSdk: 36
          minSdk: 26
          versionCode: 20260928
          versionName: 2.2.4
          Production signing credentials were not present in CI.
          The ARM64_QA_SIGNED and X86_64_QA_SIGNED APKs use a dedicated ephemeral CI QA key strictly for install validation.
          The ARM64_UNSIGNED APK and UNSIGNED AAB are the unsigned production release outputs.
          EOF

          rm -rf later-clean/.gradle later-clean/build later-clean/app/build
          mv later-clean "${release_base}"
          zip -qr "${release_base}_SOURCE.zip" "${release_base}"
          sha256sum             "${release_base}_ARM64_UNSIGNED.apk"             "${release_base}_ARM64_QA_SIGNED.apk"             "${release_base}_UNSIGNED.aab"             "${release_base}_X86_64_QA_SIGNED.apk"             "${release_base}_SOURCE.zip" > "${release_base}.sha256"
          cat "${release_base}.sha256"

      - name: API 36 release APK acceptance
        uses: reactivecircus/android-emulator-runner@v2
        env:
          LATER_QA_APK: ${{ github.workspace }}/Later_V2_2_4_RELEASE_2026-09-28_X86_64_QA_SIGNED.apk
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/later-editor-qa.sh && bash .github/scripts/later-media-qa.sh && bash .github/scripts/later-format-scroll-qa.sh && bash .github/scripts/later-production-ui-qa.sh

      - name: API 26 release sanity
        uses: reactivecircus/android-emulator-runner@v2
        env:
          LATER_QA_APK: ${{ github.workspace }}/Later_V2_2_4_RELEASE_2026-09-28_X86_64_QA_SIGNED.apk
        with:
          api-level: 26
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/later-api26-release-smoke.sh && bash .github/scripts/later-media-qa.sh

      - name: Upload clean Later package
        uses: actions/upload-artifact@v4
        with:
          name: later-editor-final-clean
          if-no-files-found: error
          path: |
            Later_V2_2_4_RELEASE_2026-09-28_ARM64_UNSIGNED.apk
            Later_V2_2_4_RELEASE_2026-09-28_ARM64_QA_SIGNED.apk
            Later_V2_2_4_RELEASE_2026-09-28_UNSIGNED.aab
            Later_V2_2_4_RELEASE_2026-09-28_X86_64_QA_SIGNED.apk
            Later_V2_2_4_RELEASE_2026-09-28_SOURCE.zip
            Later_V2_2_4_RELEASE_2026-09-28.sha256
            later-arm64-release-badging.txt
            later-arm64-release-resources.txt
            later-arm64-release-files.txt

      - name: Upload editor QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: later-editor-qa-evidence
          if-no-files-found: warn
          path: |
            later/app/build/outputs/apk/debug/app-debug.apk
            later/app/build/reports/tests/
            later/qa-evidence/
