name: Sora Music Runtime Smoke

on:
  push:
    branches: [sora-android-ci]
    paths:
      - 'sora-ci/music-runtime-smoke-trigger.txt'
  workflow_dispatch:

jobs:
  music-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct Sora source
        run: |
          rm -rf /tmp/sora-src /tmp/sora.zip /tmp/sora-music-runtime
          cat sora-ci/chunks/part-*.txt | base64 -d > /tmp/sora.zip
          unzip -q /tmp/sora.zip -d /tmp/sora-src
          ROOT=/tmp/sora-src/Sora_Android_v0_1
          test -f "$ROOT/settings.gradle.kts"
          cp -R sora-overlay/. "$ROOT/"
          echo "SORA_ROOT=$ROOT" >> "$GITHUB_ENV"

      - name: Promote demo source only inside CI fixture
        run: |
          FILE=/tmp/sora-src/Sora_Android_v0_1/test-extension/src/main/java/com/night/sora/testextension/DemoExtensionService.kt
          python3 - "$FILE" <<'PY'
          from pathlib import Path
          import sys
          path = Path(sys.argv[1])
          text = path.read_text()
          old = 'capabilities = setOf("diagnostic", "browse", "search", "details", "episodes", "chapters", "pages", "streams", "lyrics", "relatedArtists", "feed"),'
          new = 'capabilities = setOf("catalog", "browse", "search", "details", "episodes", "chapters", "pages", "streams", "lyrics", "relatedArtists", "feed"),'
          if text.count(old) != 1:
              raise SystemExit('CI demo capability marker not found exactly once')
          path.write_text(text.replace(old, new, 1))
          PY
          grep -q 'capabilities = setOf("catalog"' "$FILE"
          ! grep -q 'capabilities = setOf("diagnostic"' "$FILE"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Build Core and diagnostic Music source
        working-directory: /tmp/sora-src/Sora_Android_v0_1
        run: gradle --stacktrace :app:assembleDebug :test-extension:assembleDebug

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Prove Music runtime
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash "$GITHUB_WORKSPACE/sora-ci/music-runtime-smoke.sh"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sora-music-runtime-smoke
          path: /tmp/sora-music-runtime
          if-no-files-found: warn
