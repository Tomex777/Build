name: Apply Sora Music Session

on:
  push:
    branches: [sora-android-ci]
    paths:
      - 'sora-ci/apply-music-session.txt'

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply Media3 background playback integration
        run: python sora-ci/patch_music_session.py
      - name: Verify session integration
        run: |
          grep -q 'media3-session' sora-overlay/app/build.gradle.kts
          grep -q 'FOREGROUND_SERVICE_MEDIA_PLAYBACK' sora-overlay/app/src/main/AndroidManifest.xml
          grep -q 'MusicPlaybackService' sora-overlay/app/src/main/AndroidManifest.xml
          grep -q 'MusicPlaybackRuntime.get' sora-overlay/app/src/main/java/com/night/sora/ui/SoraApp.kt
          grep -q 'fun sessionPlayer(): Player' sora-overlay/app/src/main/java/com/night/sora/playback/MusicPlaybackController.kt
          grep -q 'MusicPlaybackService.ensureStarted' sora-overlay/app/src/main/java/com/night/sora/playback/MusicPlaybackController.kt
      - name: Commit session integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sora-overlay/app/build.gradle.kts \
                  sora-overlay/app/src/main/AndroidManifest.xml \
                  sora-overlay/app/src/main/java/com/night/sora/ui/SoraApp.kt \
                  sora-overlay/app/src/main/java/com/night/sora/playback/MusicPlaybackController.kt
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'add Sora Media3 background music session'
            git push
          fi
