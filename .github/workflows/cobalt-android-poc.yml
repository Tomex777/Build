name: Cobalt Android POC

on:
  push:
    branches:
      - cobalt-android-poc
    paths:
      - "cobalt-android-poc/**"
      - ".github/workflows/cobalt-android-poc.yml"
  workflow_dispatch:

jobs:
  package-upstream-cobalt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout POC
        uses: actions/checkout@v4

      - name: Checkout pinned Cobalt
        uses: actions/checkout@v4
        with:
          repository: Auties00/Cobalt
          ref: cb9fbf172507626948fbc3611d0a6fb00bb3a0f1
          path: cobalt-upstream

      - name: Set up JDK 25 for Cobalt
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Apply Android compatibility shim
        shell: bash
        run: |
          python3 cobalt-android-poc/patch-cobalt-android.py
          git -C cobalt-upstream diff --stat
          git -C cobalt-upstream diff -- modules/telemetry-core/src/main/java/com/github/auties00/cobalt/telemetry/log/Log.java | head -n 160

      - name: Build pinned Cobalt into local Maven
        shell: bash
        run: |
          set -o pipefail
          chmod +x cobalt-upstream/mvnw
          (
            cd cobalt-upstream
            ./mvnw -DskipTests -pl modules/lib -am install
          ) 2>&1 | tee cobalt-android-poc/cobalt-build.log

      - name: Scan patched Cobalt for JVM logger leftovers
        shell: bash
        run: |
          set -o pipefail
          echo "=== Source references ==="
          if grep -R -n --include='*.java' -E 'java\.lang\.System\.Logger|System\.Logger' cobalt-upstream/modules; then
            echo "Unexpected System.Logger source references remain after patch" >&2
            exit 1
          fi
          echo "No System.Logger source references remain."

          echo "=== Compiled bytecode references ==="
          : > cobalt-android-poc/logger-bytecode-report.txt
          while IFS= read -r -d '' classfile; do
            if grep -a -q -F 'java/lang/System$Logger' "$classfile"; then
              echo "$classfile" | tee -a cobalt-android-poc/logger-bytecode-report.txt
            fi
          done < <(find cobalt-upstream/modules -type f -path '*/target/classes/*.class' -print0)
          if [[ -s cobalt-android-poc/logger-bytecode-report.txt ]]; then
            echo "System.Logger bytecode references remain:" >&2
            cat cobalt-android-poc/logger-bytecode-report.txt >&2
            exit 1
          fi
          echo "No System.Logger bytecode references remain."

      - name: Set up JDK 17 for Android
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Preserve the debug certificate between GitHub-hosted runners so
      # successive APKs can update the same installed Cobalt package.
      - name: Restore Cobalt debug signing key
        id: cobalt-debug-key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: cobalt-android-debug-signing-v1

      - name: Create Cobalt debug signing key on cache miss
        if: steps.cobalt-debug-key.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p ~/.android
          keytool -genkeypair -v \
            -keystore ~/.android/debug.keystore \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Package Cobalt into Android 16 APK
        shell: bash
        run: |
          set -o pipefail
          gradle -p cobalt-android-poc :app:assembleDebug --refresh-dependencies --stacktrace 2>&1 | tee cobalt-android-poc/android-build.log

      - name: Verify APK exists
        shell: bash
        run: |
          APK="$(find cobalt-android-poc/app/build/outputs/apk -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          echo "Built: $APK"
          ls -lh "$APK"

      - name: Upload build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobalt-android-baseline
          if-no-files-found: ignore
          path: |
            cobalt-android-poc/cobalt-build.log
            cobalt-android-poc/android-build.log
            cobalt-android-poc/app/build/outputs/apk/**/*.apk

  compatibility-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout POC
        uses: actions/checkout@v4

      - name: Checkout pinned Cobalt
        uses: actions/checkout@v4
        with:
          repository: Auties00/Cobalt
          ref: cb9fbf172507626948fbc3611d0a6fb00bb3a0f1
          path: cobalt-upstream

      - name: Scan Android blockers
        shell: bash
        run: |
          chmod +x cobalt-android-poc/compat-scan.sh
          cobalt-android-poc/compat-scan.sh cobalt-upstream cobalt-android-poc/compat-report.txt
          {
            echo "## Current Cobalt Android compatibility scan"
            echo
            echo '```text'
            cat cobalt-android-poc/compat-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload compatibility report
        uses: actions/upload-artifact@v4
        with:
          name: cobalt-android-compat-report
          path: cobalt-android-poc/compat-report.txt


  android-runtime-probe:
    needs: package-upstream-cobalt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout POC
        uses: actions/checkout@v4

      - name: Download packaged APK
        uses: actions/download-artifact@v4
        with:
          name: cobalt-android-baseline
          path: cobalt-runtime

      - name: Locate packaged APK
        shell: bash
        run: |
          APK="$(find cobalt-runtime -type f -name '*debug*.apk' | head -n 1)"
          if [[ -z "$APK" ]]; then
            echo "Packaged APK not found in artifact" >&2
            find cobalt-runtime -maxdepth 8 -type f -print
            exit 1
          fi
          echo "COBALT_APK=$APK" >> "$GITHUB_ENV"
          echo "Using APK: $APK"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Run Cobalt on Android 16 emulator
        id: emulator
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r "$COBALT_APK"
            adb logcat -c
            adb shell am start -W -n com.tomex.cobaltandroid/.MainActivity
            sleep 8

            # Capture the app's visible probe result first. Some API 36 emulator
            # runs occasionally make `adb logcat -d` exit 255 even though the
            # device and app are healthy, so logcat must not be able to hide the
            # actual runtime result.
            adb shell uiautomator dump /sdcard/cobalt-window.xml || true
            adb pull /sdcard/cobalt-window.xml cobalt-android-poc/window.xml || true

            # Exercise the real pairing CTA without submitting a phone number.
            # The expected validation proves the tap reached the app safely.
            BOUNDS="$(python3 - <<'PY'
            import re
            import xml.etree.ElementTree as ET

            root = ET.parse("cobalt-android-poc/window.xml").getroot()
            button = next((node for node in root.iter()
                           if node.attrib.get("text") == "Continue to WhatsApp"), None)
            if button is None:
                raise SystemExit("Pairing CTA was not present in emulator UI")
            match = re.fullmatch(r"\\[(\\d+),(\\d+)\\]\\[(\\d+),(\\d+)\\]", button.attrib["bounds"])
            if match is None:
                raise SystemExit("Could not read pairing CTA bounds")
            x1, y1, x2, y2 = map(int, match.groups())
            print((x1 + x2) // 2, (y1 + y2) // 2)
            PY
            )"
            adb shell input tap $BOUNDS
            sleep 1
            adb shell uiautomator dump /sdcard/cobalt-window.xml
            adb pull /sdcard/cobalt-window.xml cobalt-android-poc/window.xml
            grep -F 'Enter the full international phone number' cobalt-android-poc/window.xml

            adb logcat -d -v threadtime > cobalt-android-poc/full-logcat.txt || true
            grep -E 'CobaltPOC|AndroidRuntime|System\\$Logger|ClassNotFoundException|NoClassDefFoundError|NoSuchMethodError|UnsatisfiedLinkError' cobalt-android-poc/full-logcat.txt > cobalt-android-poc/runtime-log.txt || true

            echo "=== Visible probe ==="
            cat cobalt-android-poc/window.xml || true
            echo "=== Filtered log ==="
            cat cobalt-android-poc/runtime-log.txt || true

      - name: Summarize runtime probe
        if: always()
        shell: bash
        run: |
          {
            echo "## Cobalt Android runtime probe"
            echo
            echo "Emulator step: **${{ steps.emulator.outcome }}**"
            echo
            if [[ -f cobalt-android-poc/runtime-log.txt ]]; then
              echo
              echo '~~~text'
              cat cobalt-android-poc/runtime-log.txt
              echo '~~~'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobalt-android-runtime-probe
          if-no-files-found: ignore
          path: |
            cobalt-android-poc/runtime-log.txt
            cobalt-android-poc/window.xml
            cobalt-android-poc/full-logcat.txt
            cobalt-android-poc/logger-bytecode-report.txt
            cobalt-runtime/**/*.apk
