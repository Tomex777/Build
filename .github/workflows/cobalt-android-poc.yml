name: Cobalt Android POC

on:
  push:
    branches:
      - cobalt-android-poc
    paths:
      - "cobalt-android-poc/**"
      - ".github/workflows/cobalt-android-poc.yml"
  workflow_dispatch:

jobs:
  package-upstream-cobalt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout POC
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Try packaging untouched Cobalt
        id: cobalt_build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          gradle -p cobalt-android-poc :app:assembleDebug --stacktrace 2>&1 | tee cobalt-android-poc/android-build.log

      - name: Record result
        shell: bash
        run: |
          {
            echo "## Cobalt Android packaging baseline"
            echo
            echo "Build outcome: **${{ steps.cobalt_build.outcome }}**"
            echo
            if [[ "${{ steps.cobalt_build.outcome }}" == "success" ]]; then
              echo "The unmodified Maven Cobalt artifact passed D8 packaging. Next test: runtime linked-client loading/pairing."
            else
              echo "The untouched artifact did not package. The uploaded log gives the exact first Android incompatibility to patch."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobalt-android-baseline
          if-no-files-found: ignore
          path: |
            cobalt-android-poc/android-build.log
            cobalt-android-poc/app/build/outputs/apk/debug/*.apk

  compatibility-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout POC
        uses: actions/checkout@v4

      - name: Checkout pinned Cobalt
        uses: actions/checkout@v4
        with:
          repository: Auties00/Cobalt
          ref: cb9fbf172507626948fbc3611d0a6fb00bb3a0f1
          path: cobalt-upstream

      - name: Scan Android blockers
        shell: bash
        run: |
          chmod +x cobalt-android-poc/compat-scan.sh
          cobalt-android-poc/compat-scan.sh cobalt-upstream cobalt-android-poc/compat-report.txt
          {
            echo "## Current Cobalt Android compatibility scan"
            echo
            echo '```text'
            cat cobalt-android-poc/compat-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload compatibility report
        uses: actions/upload-artifact@v4
        with:
          name: cobalt-android-compat-report
          path: cobalt-android-poc/compat-report.txt


  android-runtime-probe:
    needs: package-upstream-cobalt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout POC
        uses: actions/checkout@v4

      - name: Download packaged APK
        uses: actions/download-artifact@v4
        with:
          name: cobalt-android-baseline
          path: cobalt-runtime

      - name: Locate packaged APK
        shell: bash
        run: |
          APK="$(find cobalt-runtime -type f -name '*debug*.apk' | head -n 1)"
          if [[ -z "$APK" ]]; then
            echo "Packaged APK not found in artifact" >&2
            find cobalt-runtime -maxdepth 8 -type f -print
            exit 1
          fi
          echo "COBALT_APK=$APK" >> "$GITHUB_ENV"
          echo "Using APK: $APK"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Run Cobalt on Android 16 emulator
        id: emulator
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r "$COBALT_APK"
            adb logcat -c
            adb shell am start -W -n com.tomex.cobaltandroid/.MainActivity
            sleep 8
            adb logcat -d -s CobaltPOC:I AndroidRuntime:E > cobalt-android-poc/runtime-log.txt
            adb shell uiautomator dump /sdcard/cobalt-window.xml || true
            adb pull /sdcard/cobalt-window.xml cobalt-android-poc/window.xml || true
            cat cobalt-android-poc/runtime-log.txt
            cat cobalt-android-poc/window.xml || true

      - name: Summarize runtime probe
        if: always()
        shell: bash
        run: |
          {
            echo "## Cobalt Android runtime probe"
            echo
            echo "Emulator step: **${{ steps.emulator.outcome }}**"
            echo
            if [[ -f cobalt-android-poc/runtime-log.txt ]]; then
              echo
              echo '~~~text'
              cat cobalt-android-poc/runtime-log.txt
              echo '~~~'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobalt-android-runtime-probe
          if-no-files-found: ignore
          path: |
            cobalt-android-poc/runtime-log.txt
            cobalt-android-poc/window.xml
            cobalt-runtime/**/*.apk
