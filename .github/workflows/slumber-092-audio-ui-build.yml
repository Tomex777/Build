name: Slumber 0.8.12 Audio UI Build

on:
  push:
    branches: ["pianohub-ci"]
    paths:
      - ".github/workflows/slumber-092-audio-ui-build.yml"
      - ".ci/slumber_092_audio_ui/**"

permissions:
  actions: read
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct verified 0.8.11 source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/slumber-base /tmp/slumber /tmp/slumber-out
          mkdir -p /tmp/slumber-base /tmp/slumber /tmp/slumber-out
          gh run download 34955720071 --repo Tomex777/Build --name slumber-0.8.11-audio-engine --dir /tmp/slumber-base
          SRC=$(find /tmp/slumber-base -name 'slumber-0.8.11-audio-engine-source.tgz' -type f -print -quit)
          test -n "$SRC"
          echo 'b96194bdbed86a144caef3dbeb29ed8a68a094b54a9c887415956f76bf78760a  '"$SRC" | sha256sum -c -
          tar -xzf "$SRC" -C /tmp/slumber

      - name: Apply 0.8.12 audio UI
        shell: bash
        run: |
          set -euo pipefail
          D="$GITHUB_WORKSPACE/.ci/slumber_092_audio_ui"
          echo '55ab5500c0e95603e7e12d046cc52a13198e1bced2af83a6dd703bf2bec38225  '"$D/audio_ui.patch.gz.b64" | sha256sum -c -
          base64 -d "$D/audio_ui.patch.gz.b64" > /tmp/audio-ui.patch.gz
          echo '0d7f3ca578d93e5731c00dbae44da2773ae2c0e5dfc0c9fa43b1769e4173d6ee  /tmp/audio-ui.patch.gz' | sha256sum -c -
          gzip -dc /tmp/audio-ui.patch.gz > /tmp/audio-ui.patch
          echo 'bfa4a247b06570cfbc6938d7397778ac74674cdfda0193b3626c5be3f68de108  /tmp/audio-ui.patch' | sha256sum -c -
          cd /tmp/slumber
          patch --dry-run -p1 < /tmp/audio-ui.patch
          patch -p1 < /tmp/audio-ui.patch

      - name: Production surface gates
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/slumber
          grep -q 'versionCode = 24' app/build.gradle.kts
          grep -q 'versionName = "0.8.12"' app/build.gradle.kts
          grep -R -q 'Convert audio to lesson' app/src/main/java/com/night/pianohub/ui/screens/SongsScreen.kt
          grep -R -q 'AudioLessonJobs.retry' app/src/main/java/com/night/pianohub/ui/screens/SongsScreen.kt
          grep -R -q 'getWorkInfosByTag' app/src/main/java/com/night/pianohub/ui/screens/SongsScreen.kt
          grep -R -q 'Busy full mixes can produce less reliable notes' app/src/main/java/com/night/pianohub/ui/screens/SongsScreen.kt
          if grep -R -nEi 'coming soon|prepare lesson|engine boundary|model adapter|fake progress|placeholder conversion|streakDays|effectiveMethods|MIDI [0-9]+' app/src/main/java/com/night/pianohub; then
            echo 'Prototype/fake production copy reintroduced' >&2
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --channel=3 "platform-tools" "platforms;android-37.0" "build-tools;37.0.0"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

      - name: Unit tests
        working-directory: /tmp/slumber
        run: gradle --stacktrace testDebugUnitTest

      - name: Build debug APK
        working-directory: /tmp/slumber
        run: gradle --stacktrace assembleDebug

      - name: Verify APK metadata
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          AAPT="$SDK_ROOT/build-tools/37.0.0/aapt"
          APK=/tmp/slumber/app/build/outputs/apk/debug/app-debug.apk
          "$AAPT" dump badging "$APK" | tee /tmp/slumber-out/apk-badging.txt
          grep -q "package: name='com.night.pianohub'" /tmp/slumber-out/apk-badging.txt
          grep -q "versionCode='24'" /tmp/slumber-out/apk-badging.txt
          grep -q "versionName='0.8.12'" /tmp/slumber-out/apk-badging.txt
          grep -q "sdkVersion:'26'" /tmp/slumber-out/apk-badging.txt

      - name: Package source and APK
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/slumber/app/build/outputs/apk/debug/app-debug.apk /tmp/slumber-out/Slumber-0.8.12-debug.apk
          sha256sum /tmp/slumber-out/Slumber-0.8.12-debug.apk | tee /tmp/slumber-out/apk-sha256.txt
          cd /tmp/slumber
          tar --exclude='./.gradle' --exclude='./build' --exclude='./app/build' -czf /tmp/slumber-out/slumber-0.8.12-source.tgz .
          sha256sum /tmp/slumber-out/slumber-0.8.12-source.tgz | tee /tmp/slumber-out/source-sha256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: slumber-0.8.12-integration
          path: /tmp/slumber-out/*
          if-no-files-found: error
