name: Apply Sora Truthful Media UI

on:
  push:
    branches: [sora-android-ci]
    paths:
      - 'sora-ci/apply-media-truthful-ui.txt'

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Remove fake media affordances
        run: python sora-ci/patch_media_truthful_ui.py
      - name: Verify truthful media UI
        run: |
          ! grep -q 'progress = { .58f }' sora-overlay/app/src/main/java/com/night/sora/ui/screens/MediaScreen.kt
          ! grep -q 'Text("SEP"' sora-overlay/app/src/main/java/com/night/sora/ui/screens/MediaScreen.kt
          ! grep -q 'Browse by mood' sora-overlay/app/src/main/java/com/night/sora/ui/screens/MediaScreen.kt
          grep -q 'Text("SOON"' sora-overlay/app/src/main/java/com/night/sora/ui/screens/MediaScreen.kt
      - name: Commit truthful media UI
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sora-overlay/app/src/main/java/com/night/sora/ui/screens/MediaScreen.kt
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'remove fake Sora media UI signals'
            git push
          fi
