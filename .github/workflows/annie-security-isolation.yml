name: Annie media cookie isolation acceptance

on:
  push:
    branches: [annie-player-cookie-isolation-20261011]
    paths:
      - '.github/workflows/annie-security-isolation.yml'
      - 'annie-android/app/src/androidTest/java/com/tomex777/annie/PlayerBrowserCookieIsolationTest.kt'
      - 'annie-android/app/src/main/java/com/tomex777/annie/AnnieMediaDownloader.kt'
      - 'annie-android/app/src/test/java/com/tomex777/annie/AnnieMediaDownloaderTest.kt'
  workflow_dispatch:

concurrency:
  group: annie-cookie-isolation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cookies-and-downloads:
    name: Android ${{ matrix.api }} browser profile security
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api: [26, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'
      - name: Check overlay and unit/header-policy regressions
        run: |
          set -euo pipefail
          python3 annie-android/scripts/test-repair-contract.py
          python3 annie-android/scripts/repair-m0b-merge.py
          sh annie-android/scripts/check-annie-types.sh
          gradle --no-daemon --stacktrace -p annie-android :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Install Android system image
        run: |
          set -euo pipefail
          sdkmanager --install emulator
          bash annie-android/ci/install-emulator-system-image.sh ${{ matrix.api }}
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify per-session player cookie isolation on real Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -partition-size 4096
          script: timeout --signal=TERM --kill-after=20s 600s gradle --no-daemon --stacktrace -p annie-android :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.tomex777.annie.PlayerBrowserCookieIsolationTest
      - name: Save instrumented security results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: annie-cookie-security-api${{ matrix.api }}-test-report
          path: |
            annie-android/app/build/outputs/androidTest-results/
            annie-android/app/build/reports/androidTests/
          if-no-files-found: warn
          retention-days: 7
