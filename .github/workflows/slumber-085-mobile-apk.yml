name: Slumber 0.8.5 Mobile APK

on:
  push:
    branches: ["pianohub-ci"]
    paths:
      - ".github/workflows/slumber-085-mobile-apk.yml"

permissions:
  actions: read
  contents: read

jobs:
  build-mobile:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Restore exact Slumber 0.8.5 source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/slumber-base /tmp/slumber /tmp/slumber-out
          mkdir -p /tmp/slumber-base /tmp/slumber /tmp/slumber-out
          gh run download 34645245543 --repo Tomex777/Build --name slumber-0.8.5-exit-recreation --dir /tmp/slumber-base
          SRC=$(find /tmp/slumber-base -name 'slumber-production-0.8.5-source.tgz' -type f -print -quit)
          test -n "$SRC"
          tar -xzf "$SRC" -C /tmp/slumber
          grep -q 'versionName = "0.8.5"' /tmp/slumber/app/build.gradle.kts
          grep -q 'pianoVelocityLayers = listOf(2, 6, 10, 16)' /tmp/slumber/app/build.gradle.kts

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: "15859902"

      - name: Install Android SDK
        run: sdkmanager --channel=3 "platforms;android-37.0" "build-tools;37.0.0"

      - name: Unit tests
        working-directory: /tmp/slumber
        run: gradle --stacktrace testDebugUnitTest

      - name: Fetch the exact 120 Yamaha C5 samples
        working-directory: /tmp/slumber
        run: gradle --stacktrace fetchPianoSamples

      - name: Optimize bundled samples for mobile download
        shell: bash
        run: |
          set -euo pipefail
          command -v ffmpeg
          PIANO=/tmp/slumber/app/build/generated/pianoSamples/assets/piano
          test "$(find "$PIANO" -type f -name '*.mp3' | wc -l)" -eq 120
          BEFORE=$(du -sb "$PIANO" | cut -f1)
          mkdir -p /tmp/mobile-audio
          while IFS= read -r f; do
            out="/tmp/mobile-audio/$(basename "$f")"
            ffmpeg -nostdin -hide_banner -loglevel error -y -i "$f" -ac 1 -ar 44100 -b:a 80k "$out"
            mv "$out" "$f"
          done < <(find "$PIANO" -type f -name '*.mp3' | sort)
          AFTER=$(du -sb "$PIANO" | cut -f1)
          echo "Original piano sample bytes: $BEFORE" | tee /tmp/slumber-out/mobile-size.txt
          echo "Mobile piano sample bytes:   $AFTER" | tee -a /tmp/slumber-out/mobile-size.txt
          test "$AFTER" -lt "$BEFORE"
          test "$(find "$PIANO" -type f -name '*.mp3' | wc -l)" -eq 120
          while IFS= read -r f; do ffprobe -v error -show_entries stream=codec_name,sample_rate,channels -of default=nw=1 "$f" >/dev/null; done < <(find "$PIANO" -type f -name '*.mp3' | sort)

      - name: Build mobile APK
        working-directory: /tmp/slumber
        run: gradle --stacktrace assembleDebug

      - name: Verify mobile APK
        shell: bash
        run: |
          set -euo pipefail
          APK=/tmp/slumber/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          COUNT=$(unzip -l "$APK" | grep -E 'assets/piano/.*\.mp3$' | wc -l)
          echo "Bundled Yamaha C5 recordings: $COUNT" | tee -a /tmp/slumber-out/mobile-size.txt
          test "$COUNT" -eq 120
          BYTES=$(stat -c%s "$APK")
          echo "Mobile APK bytes: $BYTES" | tee -a /tmp/slumber-out/mobile-size.txt
          test "$BYTES" -lt 60000000
          cp "$APK" /tmp/slumber-out/Slumber-0.8.5-mobile.apk
          sha256sum /tmp/slumber-out/Slumber-0.8.5-mobile.apk | tee /tmp/slumber-out/mobile-apk-sha256.txt

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Android 36 smoke test
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ANDROID_EMULATOR_WAIT_TIME_BEFORE_KILL: 1
        with:
          api-level: 36
          arch: x86_64
          target: default
          profile: pixel_6
          cores: 4
          ram-size: 4096M
          emulator-boot-timeout: 300
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot-save -no-metrics
          script: |
            set -euo pipefail
            APK=/tmp/slumber-out/Slumber-0.8.5-mobile.apk
            adb install -r "$APK"
            adb shell am force-stop com.night.pianohub
            adb shell am start -W -n com.night.pianohub/.MainActivity
            sleep 5
            adb shell pidof com.night.pianohub
            adb shell uiautomator dump /sdcard/ui.xml >/dev/null
            adb pull /sdcard/ui.xml /tmp/slumber-out/mobile-ui.xml >/dev/null
            grep -q 'Ready to practice?' /tmp/slumber-out/mobile-ui.xml
            adb logcat -d -t 1000 > /tmp/slumber-out/mobile-logcat.txt
            ! grep -E 'FATAL EXCEPTION.*com\.night\.pianohub|Process: com\.night\.pianohub.*FATAL EXCEPTION' /tmp/slumber-out/mobile-logcat.txt

      - name: Upload mobile build
        uses: actions/upload-artifact@v4
        with:
          name: slumber-0.8.5-mobile
          path: /tmp/slumber-out/*
          if-no-files-found: error
          retention-days: 1
