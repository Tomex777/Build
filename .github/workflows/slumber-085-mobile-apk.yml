# frozen-scope build revision 10
name: Slumber 0.8.5 Mobile APK

on:
  push:
    branches: ["pianohub-ci"]
    paths:
      - ".github/workflows/slumber-085-mobile-apk.yml"

permissions:
  actions: read
  contents: read

jobs:
  build-mobile:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - name: Restore exact Slumber 0.8.5 source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/slumber-base /tmp/slumber /tmp/slumber-out
          mkdir -p /tmp/slumber-base /tmp/slumber /tmp/slumber-out
          gh run download 34645245543 --repo Tomex777/Build --name slumber-0.8.5-exit-recreation --dir /tmp/slumber-base
          SRC=$(find /tmp/slumber-base -name 'slumber-production-0.8.5-source.tgz' -type f -print -quit)
          test -n "$SRC"
          tar -xzf "$SRC" -C /tmp/slumber
          grep -q 'versionName = "0.8.5"' /tmp/slumber/app/build.gradle.kts
          grep -q 'pianoVelocityLayers = listOf(2, 6, 10, 16)' /tmp/slumber/app/build.gradle.kts

      - name: Apply frozen Slumber feature scope
        shell: bash
        run: |
          set -euo pipefail
          cat "$GITHUB_WORKSPACE"/.ci/slumber_085_final_scope/final.patch.gz.b64.part* > /tmp/slumber-final.patch.gz.b64
          echo '8133f27d9d76d002967f1c53d0a0b27cf89eec9f31cb24ff2188e70951ec504b  /tmp/slumber-final.patch.gz.b64' | sha256sum -c -
          base64 -d /tmp/slumber-final.patch.gz.b64 | gzip -dc > /tmp/slumber-final.patch
          echo '42b4f12ec7496c52712154594c31ca39bfe8f43addc7edaab84acefa37c23fa1  /tmp/slumber-final.patch' | sha256sum -c -
          cd /tmp/slumber
          patch -p1 < /tmp/slumber-final.patch
          grep -q 'Slumber Originals' app/src/main/java/com/night/pianohub/music/PianoLessonCatalog.kt
          grep -q 'Jingle Bells' app/src/main/java/com/night/pianohub/music/PianoLessonCatalog.kt
          grep -q 'application/vnd.recordare.musicxml' app/src/main/AndroidManifest.xml
          grep -q 'Add to My XMLs' app/src/main/java/com/night/pianohub/ui/screens/ChartPreviewScreen.kt

      - name: Enable shrinker for the installable beta
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('/tmp/slumber/app/build.gradle.kts')
          s=p.read_text()
          needle='    buildFeatures { compose = true }\n'
          assert needle in s
          block='''    buildFeatures { compose = true }\n\n    buildTypes {\n        getByName("release") {\n            isMinifyEnabled = true\n            isShrinkResources = true\n            signingConfig = signingConfigs.getByName("debug")\n            proguardFiles(\n                getDefaultProguardFile("proguard-android-optimize.txt"),\n                "proguard-rules.pro",\n            )\n        }\n    }\n'''
          p.write_text(s.replace(needle, block, 1))
          PY
          grep -q 'isMinifyEnabled = true' /tmp/slumber/app/build.gradle.kts
          grep -q 'isShrinkResources = true' /tmp/slumber/app/build.gradle.kts
          grep -q 'signingConfig = signingConfigs.getByName("debug")' /tmp/slumber/app/build.gradle.kts

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: "15859902"

      - name: Install Android SDK
        run: sdkmanager --channel=3 "platforms;android-37.0" "build-tools;37.0.0"

      - name: Run unit tests
        working-directory: /tmp/slumber
        run: gradle --stacktrace testDebugUnitTest

      - name: Build zero-loss shrunk APK
        working-directory: /tmp/slumber
        run: gradle --stacktrace assembleRelease

      - name: Verify mobile APK
        shell: bash
        run: |
          set -euo pipefail
          APK=/tmp/slumber/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          COUNT=$(unzip -l "$APK" | grep -E 'assets/piano/.*\.mp3$' | wc -l)
          echo "Bundled original Yamaha C5 recordings: $COUNT" | tee /tmp/slumber-out/mobile-size.txt
          test "$COUNT" -eq 120
          SAMPLE_BYTES=$(unzip -l "$APK" | awk '/assets\/piano\/.*\.mp3$/ {s += $1} END {print s+0}')
          echo "Bundled original sample bytes: $SAMPLE_BYTES" | tee -a /tmp/slumber-out/mobile-size.txt
          test "$SAMPLE_BYTES" -eq 21923785
          BYTES=$(stat -c%s "$APK")
          echo "Shrunk APK bytes: $BYTES" | tee -a /tmp/slumber-out/mobile-size.txt
          test "$BYTES" -lt 60000000
          cp "$APK" /tmp/slumber-out/Slumber-0.8.5-final.apk
          sha256sum /tmp/slumber-out/Slumber-0.8.5-final.apk | tee /tmp/slumber-out/mobile-apk-sha256.txt

      - name: Prepare XML open-with fixture
        shell: bash
        run: |
          cat > /tmp/slumber-out/open-with-test.xml <<'XML'
          <song title="Open With Test" artist="Slumber QA" bpm="120" difficulty="Easy">
            <note pitch="C4" time="0.000" duration="0.350" />
            <note pitch="E4" time="0.500" duration="0.350" />
            <note pitch="G4" time="1.000" duration="0.500" />
          </song>
          XML

      - name: Build external XML open-with sender
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/slumber-open-with-qa
          mkdir -p /tmp/slumber-open-with-qa/app/src/main/java/com/night/slumberqa
          cat > /tmp/slumber-open-with-qa/settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "SlumberOpenWithQa"
          include(":app")
          EOF
          cat > /tmp/slumber-open-with-qa/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "9.1.1" apply false
          }
          EOF
          cat > /tmp/slumber-open-with-qa/app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
          }

          android {
              namespace = "com.night.slumberqa"
              compileSdk = 37

              defaultConfig {
                  applicationId = "com.night.slumberqa"
                  minSdk = 36
                  targetSdk = 36
                  versionCode = 1
                  versionName = "1.0"
              }
          }
          EOF
          cat > /tmp/slumber-open-with-qa/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <provider
                      android:name=".ChartProvider"
                      android:authorities="com.night.slumberqa.charts"
                      android:exported="true"
                      android:grantUriPermissions="true" />
                  <activity
                      android:name=".SenderActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          cat > /tmp/slumber-open-with-qa/app/src/main/java/com/night/slumberqa/ChartProvider.java <<'EOF'
          package com.night.slumberqa;

          import android.content.ContentProvider;
          import android.content.ContentValues;
          import android.database.Cursor;
          import android.database.MatrixCursor;
          import android.net.Uri;
          import android.os.ParcelFileDescriptor;
          import android.provider.OpenableColumns;

          import java.io.File;
          import java.io.FileNotFoundException;
          import java.io.FileOutputStream;
          import java.io.IOException;
          import java.nio.charset.StandardCharsets;

          public final class ChartProvider extends ContentProvider {
              private static final byte[] CHART = ("<song title=\"Open With Test\" artist=\"Slumber QA\" bpm=\"120\" difficulty=\"Easy\">\n"
                      + "  <note pitch=\"C4\" time=\"0.000\" duration=\"0.350\" />\n"
                      + "  <note pitch=\"E4\" time=\"0.500\" duration=\"0.350\" />\n"
                      + "  <note pitch=\"G4\" time=\"1.000\" duration=\"0.500\" />\n"
                      + "</song>\n").getBytes(StandardCharsets.UTF_8);

              @Override public boolean onCreate() { return true; }

              @Override public String getType(Uri uri) { return "application/xml"; }

              @Override public ParcelFileDescriptor openFile(Uri uri, String mode) throws FileNotFoundException {
                  File file = new File(getContext().getFilesDir(), "open-with-test.xml");
                  try (FileOutputStream out = new FileOutputStream(file, false)) {
                      out.write(CHART);
                  } catch (IOException error) {
                      FileNotFoundException wrapped = new FileNotFoundException(error.getMessage());
                      wrapped.initCause(error);
                      throw wrapped;
                  }
                  return ParcelFileDescriptor.open(file, ParcelFileDescriptor.MODE_READ_ONLY);
              }

              @Override public Cursor query(Uri uri, String[] projection, String selection, String[] selectionArgs, String sortOrder) {
                  String[] columns = projection != null ? projection : new String[]{OpenableColumns.DISPLAY_NAME, OpenableColumns.SIZE};
                  MatrixCursor cursor = new MatrixCursor(columns);
                  Object[] row = new Object[columns.length];
                  for (int i = 0; i < columns.length; i++) {
                      if (OpenableColumns.DISPLAY_NAME.equals(columns[i])) row[i] = "open-with-test.xml";
                      else if (OpenableColumns.SIZE.equals(columns[i])) row[i] = CHART.length;
                  }
                  cursor.addRow(row);
                  return cursor;
              }

              @Override public Uri insert(Uri uri, ContentValues values) { throw new UnsupportedOperationException(); }
              @Override public int delete(Uri uri, String selection, String[] selectionArgs) { return 0; }
              @Override public int update(Uri uri, ContentValues values, String selection, String[] selectionArgs) { return 0; }
          }
          EOF
          cat > /tmp/slumber-open-with-qa/app/src/main/java/com/night/slumberqa/SenderActivity.java <<'EOF'
          package com.night.slumberqa;

          import android.app.Activity;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;

          public final class SenderActivity extends Activity {
              @Override protected void onCreate(Bundle state) {
                  super.onCreate(state);
                  Uri chart = Uri.parse("content://com.night.slumberqa.charts/open-with-test.xml");
                  Intent view = new Intent(Intent.ACTION_VIEW);
                  view.setDataAndType(chart, "application/xml");
                  view.setPackage("com.night.pianohub");
                  view.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);
                  startActivity(view);
                  finish();
              }
          }
          EOF
          gradle -p /tmp/slumber-open-with-qa --stacktrace :app:assembleDebug
          cp /tmp/slumber-open-with-qa/app/build/outputs/apk/debug/app-debug.apk /tmp/slumber-out/slumber-open-with-qa.apk
          test -s /tmp/slumber-out/slumber-open-with-qa.apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Android 36 product smoke test
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ANDROID_EMULATOR_WAIT_TIME_BEFORE_KILL: 1
        with:
          api-level: 36
          arch: x86_64
          target: default
          profile: pixel_6
          cores: 4
          ram-size: 4096M
          emulator-boot-timeout: 300
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot-save -no-metrics
          script: |
            adb install -r /tmp/slumber-out/Slumber-0.8.5-final.apk
            adb install -r /tmp/slumber-out/slumber-open-with-qa.apk
            adb shell wm dismiss-keyguard || true
            adb shell input keyevent 82 || true
            adb shell settings put secure immersive_mode_confirmations confirmed || true
            sleep 10
            adb logcat -c || true
            adb shell am force-stop com.night.pianohub
            adb shell am start -W -n com.night.pianohub/.MainActivity
            adb shell pidof com.night.pianohub
            for I in $(seq 1 20); do adb shell uiautomator dump /sdcard/ui.xml >/dev/null 2>&1 || true; adb pull /sdcard/ui.xml /tmp/slumber-out/home-ui.xml >/dev/null 2>&1 || true; if grep -q "isn't responding" /tmp/slumber-out/home-ui.xml 2>/dev/null; then python -c 'import re,subprocess,sys,xml.etree.ElementTree as E;r=E.parse(sys.argv[1]).getroot();n=next(x for x in r.iter("node") if x.attrib.get("text")=="Wait");a=list(map(int,re.findall(r"\d+",n.attrib["bounds"])));subprocess.run(["adb","shell","input","tap",str((a[0]+a[2])//2),str((a[1]+a[3])//2)],check=True)' /tmp/slumber-out/home-ui.xml; sleep 2; continue; fi; grep -q 'Ready to practice?' /tmp/slumber-out/home-ui.xml 2>/dev/null && exit 0; sleep 2; done; adb shell dumpsys window | grep -E 'mCurrentFocus|mFocusedApp' || true; cat /tmp/slumber-out/home-ui.xml || true; adb exec-out screencap -p > /tmp/slumber-out/failure-home.png || true; adb logcat -d -t 2500 > /tmp/slumber-out/mobile-logcat.txt || true; exit 1
            python -c 'import re,subprocess,xml.etree.ElementTree as E;r=E.parse("/tmp/slumber-out/home-ui.xml").getroot();n=next(x for x in r.iter("node") if x.attrib.get("text") in ("Start practice","Continue practice"));a=list(map(int,re.findall(r"\d+",n.attrib["bounds"])));subprocess.run(["adb","shell","input","tap",str((a[0]+a[2])//2),str((a[1]+a[3])//2)],check=True)'
            for I in $(seq 1 20); do adb shell uiautomator dump /sdcard/ui.xml >/dev/null 2>&1 || true; adb pull /sdcard/ui.xml /tmp/slumber-out/piano-ui.xml >/dev/null 2>&1 || true; if grep -q "isn't responding" /tmp/slumber-out/piano-ui.xml 2>/dev/null; then python -c 'import re,subprocess,sys,xml.etree.ElementTree as E;r=E.parse(sys.argv[1]).getroot();n=next(x for x in r.iter("node") if x.attrib.get("text")=="Wait");a=list(map(int,re.findall(r"\d+",n.attrib["bounds"])));subprocess.run(["adb","shell","input","tap",str((a[0]+a[2])//2),str((a[1]+a[3])//2)],check=True)' /tmp/slumber-out/piano-ui.xml; sleep 2; continue; fi; grep -q 'AI Teacher' /tmp/slumber-out/piano-ui.xml 2>/dev/null && exit 0; sleep 2; done; cat /tmp/slumber-out/piano-ui.xml || true; adb exec-out screencap -p > /tmp/slumber-out/failure-piano.png || true; adb logcat -d -t 2500 > /tmp/slumber-out/mobile-logcat.txt || true; exit 1
            python -c 'import xml.etree.ElementTree as E;r=E.parse("/tmp/slumber-out/piano-ui.xml").getroot();assert r.attrib.get("rotation") in ("1","3"),r.attrib.get("rotation")'
            adb shell input keyevent 4
            for I in $(seq 1 20); do adb shell uiautomator dump /sdcard/ui.xml >/dev/null 2>&1 || true; adb pull /sdcard/ui.xml /tmp/slumber-out/after-piano-ui.xml >/dev/null 2>&1 || true; if grep -q "isn't responding" /tmp/slumber-out/after-piano-ui.xml 2>/dev/null; then python -c 'import re,subprocess,sys,xml.etree.ElementTree as E;r=E.parse(sys.argv[1]).getroot();n=next(x for x in r.iter("node") if x.attrib.get("text")=="Wait");a=list(map(int,re.findall(r"\d+",n.attrib["bounds"])));subprocess.run(["adb","shell","input","tap",str((a[0]+a[2])//2),str((a[1]+a[3])//2)],check=True)' /tmp/slumber-out/after-piano-ui.xml; sleep 2; continue; fi; grep -q 'Ready to practice?' /tmp/slumber-out/after-piano-ui.xml 2>/dev/null && exit 0; sleep 2; done; cat /tmp/slumber-out/after-piano-ui.xml || true; adb exec-out screencap -p > /tmp/slumber-out/failure-after-piano.png || true; exit 1
            python -c 'import xml.etree.ElementTree as E;r=E.parse("/tmp/slumber-out/after-piano-ui.xml").getroot();assert r.attrib.get("rotation")=="0",r.attrib.get("rotation")'
            python -c 'import re,subprocess,xml.etree.ElementTree as E;r=E.parse("/tmp/slumber-out/after-piano-ui.xml").getroot();n=next(x for x in r.iter("node") if x.attrib.get("text")=="Songs");a=list(map(int,re.findall(r"\d+",n.attrib["bounds"])));subprocess.run(["adb","shell","input","tap",str((a[0]+a[2])//2),str((a[1]+a[3])//2)],check=True)'
            for I in $(seq 1 20); do adb shell uiautomator dump /sdcard/ui.xml >/dev/null 2>&1 || true; adb pull /sdcard/ui.xml /tmp/slumber-out/songs-ui.xml >/dev/null 2>&1 || true; if grep -q "isn't responding" /tmp/slumber-out/songs-ui.xml 2>/dev/null; then python -c 'import re,subprocess,sys,xml.etree.ElementTree as E;r=E.parse(sys.argv[1]).getroot();n=next(x for x in r.iter("node") if x.attrib.get("text")=="Wait");a=list(map(int,re.findall(r"\d+",n.attrib["bounds"])));subprocess.run(["adb","shell","input","tap",str((a[0]+a[2])//2),str((a[1]+a[3])//2)],check=True)' /tmp/slumber-out/songs-ui.xml; sleep 2; continue; fi; grep -q 'Official Songs' /tmp/slumber-out/songs-ui.xml 2>/dev/null && exit 0; sleep 2; done; cat /tmp/slumber-out/songs-ui.xml || true; adb exec-out screencap -p > /tmp/slumber-out/failure-songs.png || true; exit 1
            grep -q 'Slumber Originals' /tmp/slumber-out/songs-ui.xml
            grep -q 'My XMLs' /tmp/slumber-out/songs-ui.xml
            python -c 'import re,subprocess,xml.etree.ElementTree as E;r=E.parse("/tmp/slumber-out/songs-ui.xml").getroot();n=next(x for x in r.iter("node") if x.attrib.get("text")=="Slumber Originals");a=list(map(int,re.findall(r"\d+",n.attrib["bounds"])));subprocess.run(["adb","shell","input","tap",str((a[0]+a[2])//2),str((a[1]+a[3])//2)],check=True)'
            for I in $(seq 1 20); do adb shell uiautomator dump /sdcard/ui.xml >/dev/null 2>&1 || true; adb pull /sdcard/ui.xml /tmp/slumber-out/originals-ui.xml >/dev/null 2>&1 || true; if grep -q "isn't responding" /tmp/slumber-out/originals-ui.xml 2>/dev/null; then python -c 'import re,subprocess,sys,xml.etree.ElementTree as E;r=E.parse(sys.argv[1]).getroot();n=next(x for x in r.iter("node") if x.attrib.get("text")=="Wait");a=list(map(int,re.findall(r"\d+",n.attrib["bounds"])));subprocess.run(["adb","shell","input","tap",str((a[0]+a[2])//2),str((a[1]+a[3])//2)],check=True)' /tmp/slumber-out/originals-ui.xml; sleep 2; continue; fi; grep -q 'After Midnight' /tmp/slumber-out/originals-ui.xml 2>/dev/null && exit 0; sleep 2; done; cat /tmp/slumber-out/originals-ui.xml || true; adb exec-out screencap -p > /tmp/slumber-out/failure-originals.png || true; exit 1
            grep -q 'Glass Rain' /tmp/slumber-out/originals-ui.xml
            python -c 'import re,subprocess,xml.etree.ElementTree as E;r=E.parse("/tmp/slumber-out/originals-ui.xml").getroot();n=next(x for x in r.iter("node") if x.attrib.get("text")=="My XMLs");a=list(map(int,re.findall(r"\d+",n.attrib["bounds"])));subprocess.run(["adb","shell","input","tap",str((a[0]+a[2])//2),str((a[1]+a[3])//2)],check=True)'
            for I in $(seq 1 20); do adb shell uiautomator dump /sdcard/ui.xml >/dev/null 2>&1 || true; adb pull /sdcard/ui.xml /tmp/slumber-out/my-xmls-ui.xml >/dev/null 2>&1 || true; if grep -q "isn't responding" /tmp/slumber-out/my-xmls-ui.xml 2>/dev/null; then python -c 'import re,subprocess,sys,xml.etree.ElementTree as E;r=E.parse(sys.argv[1]).getroot();n=next(x for x in r.iter("node") if x.attrib.get("text")=="Wait");a=list(map(int,re.findall(r"\d+",n.attrib["bounds"])));subprocess.run(["adb","shell","input","tap",str((a[0]+a[2])//2),str((a[1]+a[3])//2)],check=True)' /tmp/slumber-out/my-xmls-ui.xml; sleep 2; continue; fi; grep -q 'Import XML' /tmp/slumber-out/my-xmls-ui.xml 2>/dev/null && exit 0; sleep 2; done; cat /tmp/slumber-out/my-xmls-ui.xml || true; adb exec-out screencap -p > /tmp/slumber-out/failure-my-xmls.png || true; exit 1
            adb shell am start -W -n com.night.slumberqa/.SenderActivity
            for I in $(seq 1 20); do adb shell uiautomator dump /sdcard/ui.xml >/dev/null 2>&1 || true; adb pull /sdcard/ui.xml /tmp/slumber-out/open-with-ui.xml >/dev/null 2>&1 || true; if grep -q "isn't responding" /tmp/slumber-out/open-with-ui.xml 2>/dev/null; then python -c 'import re,subprocess,sys,xml.etree.ElementTree as E;r=E.parse(sys.argv[1]).getroot();n=next(x for x in r.iter("node") if x.attrib.get("text")=="Wait");a=list(map(int,re.findall(r"\d+",n.attrib["bounds"])));subprocess.run(["adb","shell","input","tap",str((a[0]+a[2])//2),str((a[1]+a[3])//2)],check=True)' /tmp/slumber-out/open-with-ui.xml; sleep 2; continue; fi; grep -q 'Open With Test' /tmp/slumber-out/open-with-ui.xml 2>/dev/null && exit 0; sleep 2; done; cat /tmp/slumber-out/open-with-ui.xml || true; adb exec-out screencap -p > /tmp/slumber-out/failure-open-with.png || true; adb logcat -d -t 2500 > /tmp/slumber-out/mobile-logcat.txt || true; exit 1
            grep -q 'Duration' /tmp/slumber-out/open-with-ui.xml
            grep -q 'Difficulty' /tmp/slumber-out/open-with-ui.xml
            grep -q 'Notes' /tmp/slumber-out/open-with-ui.xml
            grep -q 'Add to My XMLs' /tmp/slumber-out/open-with-ui.xml
            grep -q 'Play' /tmp/slumber-out/open-with-ui.xml
            adb shell pidof com.night.pianohub
            adb logcat -d -t 2500 > /tmp/slumber-out/mobile-logcat.txt
            ! grep -E 'FATAL EXCEPTION.*com\.night\.pianohub|Process: com\.night\.pianohub.*FATAL EXCEPTION|ANR in com\.night\.pianohub' /tmp/slumber-out/mobile-logcat.txt

      - name: Upload mobile build and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slumber-0.8.5-final
          path: /tmp/slumber-out/*
          if-no-files-found: error
          retention-days: 1
