name: Apply Sora Catalog Presentation Fix

on:
  push:
    branches: [sora-android-ci]
    paths:
      - 'sora-ci/apply-catalog-presentation.txt'

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python sora-ci/patch_catalog_presentation.py
      - name: Verify no diagnostic provider leaks into normal catalog code
        run: |
          grep -q 'isCatalogProvider' sora-overlay/app/src/main/java/com/night/sora/ui/screens/MediaScreen.kt
          grep -q 'isCatalogProvider' sora-overlay/app/src/main/java/com/night/sora/ui/screens/HomeScreen.kt
          grep -q 'isCatalogProvider' sora-overlay/app/src/main/java/com/night/sora/ui/screens/MediaDetailScreen.kt
          grep -q 'diagnostic' sora-overlay/test-extension/src/main/java/com/night/sora/testextension/DemoExtensionService.kt
      - name: Commit patched source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sora-overlay/app/src/main/java/com/night/sora/ui/screens/MediaScreen.kt \
                  sora-overlay/app/src/main/java/com/night/sora/ui/screens/HomeScreen.kt \
                  sora-overlay/app/src/main/java/com/night/sora/ui/screens/MediaDetailScreen.kt
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'stabilize Sora cold catalog presentation'
            git push
          fi
