name: Anime megathread playback sweep 2

on:
  push:
    branches: [vidbox-e2e-probe-20260929]
    paths:
      - '.github/workflows/anime-megathread-playback-sweep2.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        include:
          - { id: cineby, site: "https://www.cineby.app/", query: "One Piece" }
          - { id: anidap, site: "https://anidap.se/", query: "One Piece" }
          - { id: anigo, site: "https://anigo.to/", query: "One Piece" }
          - { id: anikuro, site: "https://anikuro.to/", query: "One Piece" }
          - { id: animehub, site: "https://animehub.ac/", query: "One Piece" }
          - { id: animenana, site: "https://animenana.com/", query: "One Piece" }
          - { id: animeparadise, site: "https://www.animeparadise.moe/", query: "One Piece" }
          - { id: xprime, site: "https://xprime.tv/", query: "One Piece" }
          - { id: flixer, site: "https://flixer.su/", query: "One Piece" }
          - { id: wcofun, site: "https://wcofun.org/", query: "One Piece" }
          - { id: 123anime, site: "https://123anime.info/", query: "One Piece" }
          - { id: allwish, site: "https://all-wish.me/", query: "One Piece" }
          - { id: animerealms, site: "https://www.animerealms.org/", query: "One Piece" }
          - { id: yenime, site: "https://yenime.net/", query: "One Piece" }
          - { id: myanime, site: "https://myanime.live/", query: "Battle Through the Heavens" }

    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null
          mkdir -p proof

      - name: Exercise catalog to player
        env:
          SOURCE_ID: ${{ matrix.id }}
          SITE: ${{ matrix.site }}
          QUERY: ${{ matrix.query }}
        shell: bash
        run: |
          cat > probe.mjs <<'NODE'
          import { chromium } from 'playwright';
          import fs from 'node:fs';

          const id=process.env.SOURCE_ID, site=process.env.SITE, query=process.env.QUERY;
          const browser=await chromium.launch({
            headless:true,
            args:['--autoplay-policy=no-user-gesture-required','--disable-blink-features=AutomationControlled']
          });
          const context=await browser.newContext({
            viewport:{width:1280,height:800},
            ignoreHTTPSErrors:true,
            userAgent:'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/153.0.0.0 Safari/537.36'
          });
          const page=await context.newPage();

          async function snap() {
            return await page.evaluate(() => {
              const t=s=>(s||'').replace(/\s+/g,' ').trim();
              return {
                url:location.href,
                title:document.title,
                text:t(document.body?.innerText).slice(0,10000),
                links:[...document.querySelectorAll('a[href]')].slice(0,320).map(a=>({text:t(a.innerText).slice(0,140),href:a.href})),
                iframes:[...document.querySelectorAll('iframe')].map(x=>x.src).filter(Boolean).length,
                videos:[...document.querySelectorAll('video')].map(v=>({
                  currentTime:v.currentTime,
                  duration:Number.isFinite(v.duration)?v.duration:null,
                  paused:v.paused,
                  readyState:v.readyState,
                  width:v.videoWidth,
                  height:v.videoHeight,
                  error:v.error?.code||null
                }))
              };
            });
          }

          async function search(q){
            const sels=[
              'input[type="search"]',
              'input[placeholder*="search" i]',
              'input[aria-label*="search" i]',
              'input[name*="search" i]',
              'input[name="q"]',
              'input[name="s"]'
            ];
            for(const sel of sels){
              const el=page.locator(sel).first();
              if(await el.count()) {
                try {
                  await el.fill(q,{timeout:2500});
                  await el.press('Enter');
                  await page.waitForTimeout(4500);
                  return {ok:true,method:sel};
                } catch {}
              }
            }
            const origin=new URL(page.url()).origin;
            for(const p of [
              '/search?keyword='+encodeURIComponent(q),
              '/search?q='+encodeURIComponent(q),
              '/search/'+encodeURIComponent(q),
              '/?s='+encodeURIComponent(q)
            ]){
              try {
                const r=await page.goto(origin+p,{waitUntil:'domcontentloaded',timeout:25000});
                await page.waitForTimeout(2500);
                const s=await snap();
                if(r && r.status()<500 && new RegExp(q.split(' ')[0],'i').test(s.text)) return {ok:true,method:p};
              } catch {}
            }
            return {ok:false,method:null};
          }

          async function kick(){
            const pats=[/^play$/i,/watch now/i,/watch/i,/episode\s*1\b/i,/^1$/,/server\s*1/i];
            for(const pat of pats){
              const el=page.getByText(pat).first();
              if(await el.count()){
                try { await el.click({timeout:1600}); await page.waitForTimeout(1800); } catch {}
              }
            }
            for(const frame of page.frames()){
              try{
                const v=frame.locator('video').first();
                if(await v.count()) await v.evaluate(el=>{el.muted=true;el.play().catch(()=>{});});
                const b=frame.locator('button[aria-label*="play" i],button[title*="play" i],.jw-icon-playback').first();
                if(await b.count()) try{await b.click({timeout:1000})}catch{}
              }catch{}
            }
          }

          const out={id,site,query};
          try{
            const home=await page.goto(site,{waitUntil:'domcontentloaded',timeout:50000});
            await page.waitForTimeout(3500);
            out.homeStatus=home?.status()??null;
            out.home=await snap();
            out.search=await search(query);
            await page.waitForTimeout(2500);
            out.searchSnapshot=await snap();

            let links=(out.searchSnapshot.links||[]).filter(x=>new RegExp(query.split(' ')[0],'i').test(x.text+' '+x.href));
            links=links.filter(x=>!/(javascript:|mailto:|login|register|privacy|terms)/i.test(x.href));
            out.resultCount=links.length;
            if(links[0]?.href){
              const detail=await page.goto(links[0].href,{waitUntil:'domcontentloaded',timeout:50000});
              await page.waitForTimeout(3500);
              out.detailStatus=detail?.status()??null;
              out.detail=await snap();

              const eps=(out.detail.links||[]).filter(x=>/(episode\s*1\b|ep\.?\s*1\b|\/episode[-_/]?1\b|\/watch\/)/i.test(x.text+' '+x.href));
              out.episodeLinkCount=eps.length;
              if(eps[0]?.href){
                const ep=await page.goto(eps[0].href,{waitUntil:'domcontentloaded',timeout:50000});
                await page.waitForTimeout(4000);
                out.episodeStatus=ep?.status()??null;
                out.episode=await snap();
              }
            }

            await kick();
            out.samples=[];
            for(let i=0;i<5;i++){
              await page.waitForTimeout(2500);
              const frames=[];
              for(const f of page.frames()){
                try{
                  frames.push(await f.evaluate(()=>({
                    url:location.href,
                    iframes:document.querySelectorAll('iframe').length,
                    videos:[...document.querySelectorAll('video')].map(v=>({
                      currentTime:v.currentTime,
                      duration:Number.isFinite(v.duration)?v.duration:null,
                      paused:v.paused,
                      readyState:v.readyState,
                      width:v.videoWidth,
                      height:v.videoHeight,
                      error:v.error?.code||null
                    }))
                  })));
                }catch{}
              }
              out.samples.push({wall:(i+1)*2.5,frames});
            }

            let maxTime=0,maxDuration=0,readyVideo=false;
            for(const s of out.samples) for(const f of s.frames) for(const v of f.videos){
              if(Number.isFinite(v.currentTime)) maxTime=Math.max(maxTime,v.currentTime);
              if(Number.isFinite(v.duration)) maxDuration=Math.max(maxDuration,v.duration);
              if(v.readyState>=2 && v.width>0 && v.height>0) readyVideo=true;
            }
            out.player={
              maxCurrentTime:maxTime,
              maxDuration,
              readyVideo,
              advanced:maxTime>=1,
              frameCount:page.frames().length
            };
            out.verdict = out.player.advanced ? 'PLAYBACK_ADVANCED'
              : readyVideo ? 'PLAYER_READY'
              : page.frames().length>1 ? 'PLAYER_EMBED_LOADED'
              : (out.episodeStatus||out.detailStatus) ? 'CATALOG_ONLY'
              : 'NO_END_TO_END_PATH';
          }catch(e){
            out.error=String(e);
            out.verdict='ERROR';
          }

          fs.writeFileSync('proof/result.json',JSON.stringify(out,null,2));
          console.log(JSON.stringify({
            id:out.id,
            homeStatus:out.homeStatus,
            search:out.search?.ok,
            resultCount:out.resultCount,
            detailStatus:out.detailStatus,
            episodeStatus:out.episodeStatus,
            player:out.player,
            verdict:out.verdict,
            error:out.error||null
          },null,2));
          await browser.close();
          NODE
          node probe.mjs

      - name: Upload source proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anime-sweep2-${{ matrix.id }}
          path: proof/result.json
          if-no-files-found: error
