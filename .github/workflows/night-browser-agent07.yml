name: NIGHT Browser Agent 7 — Time Machine

on:
  push:
    branches: [agent/browser-07-time-machine]
    paths:
      - 'night-browser/**'
      - '.github/workflows/night-browser-agent07.yml'
  pull_request:
    branches: [feature/night-browser-multi-agent-20261020]
    paths:
      - 'night-browser/**'
      - '.github/workflows/night-browser-agent07.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-37.1 build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'
      - name: Unit tests and compile arm64/x86_64 APKs
        run: gradle --no-daemon --stacktrace -p night-browser :app:testDebugUnitTest :app:assembleDebug
      - name: Upload installable debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: night-browser-agent07-debug-apks
          path: night-browser/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Enable emulator KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and interact with the real browser
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -partition-size 4096
          script: bash night-browser/ci/time-machine-agent07.sh
      - name: Upload Time Machine UI screenshots and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: night-browser-agent07-emulator-evidence
          path: night-browser/screenshots/agent07/
          if-no-files-found: warn
