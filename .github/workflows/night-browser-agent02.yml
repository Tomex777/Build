name: NIGHT Browser Agent 2 — Home Compile Gate

on:
  push:
    branches: ['agent/browser-02-home']
    paths:
      - 'night-browser/**'
      - '.github/workflows/night-browser-agent02.yml'
  pull_request:
    branches: ['feature/night-browser-multi-agent-20261020']
    paths:
      - 'night-browser/**'
      - '.github/workflows/night-browser-agent02.yml'
  workflow_dispatch:

jobs:
  home-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-37.1 build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'
      - name: Unit tests and Android compile
        run: gradle --no-daemon --stacktrace -p night-browser :app:testDebugUnitTest :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: night-browser-agent02-arm64
          path: night-browser/app/build/outputs/apk/debug/app-arm64-v8a-debug.apk
          if-no-files-found: error
