name: TFPDL discovery fallbacks

on:
  push:
    paths:
      - ".github/workflows/tfpdl-rest-map.yml"
  workflow_dispatch:

jobs:
  map:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Compare discovery routes
        shell: bash
        run: |
          set +e
          UA='Mozilla/5.0 (Linux; Android 16; SM-A165F) AppleWebKit/537.36 Chrome/140 Mobile Safari/537.36'
          testurl () {
            u="$1"
            curl --http1.1 -sS --max-time 20 -A "$UA" -D /tmp/h -o /tmp/b               -w 'status=%{http_code} type=%{content_type} bytes=%{size_download}\n' "$u"
            printf '%s | ' "$u"
            tail -n1 /dev/null
            grep -Ei '^cf-mitigated:' /tmp/h | tr '\n' ' '
            echo
            head -c 120 /tmp/b | tr '\n' ' '
            echo
          }

          for H in https://tfpdl.com https://www.tfpdl.com https://tfp.re; do
            echo "=== $H ==="
            testurl "$H/wp-json/wp/v2/search?search=Lanterns&per_page=3"
            testurl "$H/wp-json/wp/v2/posts?search=Lanterns&per_page=3&_fields=id,link,title"
            testurl "$H/?rest_route=/wp/v2/search&search=Lanterns&per_page=3"
            testurl "$H/?s=Lanterns"
            testurl "$H/?s=Lanterns&feed=rss2"
            testurl "$H/sitemap_index.xml"
            testurl "$H/post-sitemap.xml"
          done
