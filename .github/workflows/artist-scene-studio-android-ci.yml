name: Artist Scene Studio Android CI

on:
  push:
    branches: [artist-scene-studio-foundation]
    paths:
      - "artist-scene-studio/**"
      - ".github/workflows/artist-scene-studio-android-ci.yml"
  pull_request:
    branches: [artist-scene-studio-foundation]
    paths:
      - "artist-scene-studio/**"
      - ".github/workflows/artist-scene-studio-android-ci.yml"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: artist-scene-studio-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned starter assets and GLB fixtures
        run: artist-scene-studio/scripts/fetch-test-assets.sh
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Unit tests
        working-directory: artist-scene-studio
        run: gradle :app:testDebugUnitTest || { cat app/build/test-results/testDebugUnitTest/*.xml; exit 1; }
      - name: Build debug APK
        working-directory: artist-scene-studio
        run: gradle :app:assembleDebug
      - name: Build ARM64 debug APK
        working-directory: artist-scene-studio
        run: gradle :app:assembleDebug -Pandroid.injected.build.abi=arm64-v8a
      - name: Build ARM64 release APK
        working-directory: artist-scene-studio
        run: gradle :app:assembleRelease -Pandroid.injected.build.abi=arm64-v8a
      - uses: actions/upload-artifact@v4
        with:
          name: artist-scene-studio-debug-apks
          path: artist-scene-studio/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: artist-scene-studio-release-unsigned-arm64
          path: artist-scene-studio/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  api-36-renderer-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Publish renderer smoke pending status
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          payload="$(jq -nc \
            --arg state "pending" \
            --arg target_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --arg description "API 36 renderer smoke running" \
            --arg context "mise/api36-renderer-smoke" \
            '{state:$state,target_url:$target_url,description:$description,context:$context}')"
          curl --fail-with-body -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -d "$payload"
      - uses: actions/checkout@v4
      - name: Fetch pinned starter assets and GLB fixtures
        run: artist-scene-studio/scripts/fetch-test-assets.sh
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Reset renderer smoke start marker
        run: rm -f artist-scene-studio/.runtime-smoke-started
      - name: Launch renderer fixture on API 36
        id: api36_smoke_primary
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          working-directory: artist-scene-studio
          emulator-options: -no-window -gpu lavapipe -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash scripts/api36-renderer-smoke.sh
      - name: Classify API 36 emulator startup failure
        id: api36_smoke_classify
        if: steps.api36_smoke_primary.outcome == 'failure'
        run: |
          if [ -f artist-scene-studio/.runtime-smoke-started ]; then
            echo "retry=false" >> "$GITHUB_OUTPUT"
          else
            echo "retry=true" >> "$GITHUB_OUTPUT"
            echo "Emulator runner failed before the Mise smoke script started; retrying once."
          fi
      - name: Retry API 36 emulator startup once
        if: steps.api36_smoke_primary.outcome == 'failure' && steps.api36_smoke_classify.outputs.retry == 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          working-directory: artist-scene-studio
          emulator-options: -no-window -gpu lavapipe -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash scripts/api36-renderer-smoke.sh
      - name: Preserve real API 36 runtime failure
        if: steps.api36_smoke_primary.outcome == 'failure' && steps.api36_smoke_classify.outputs.retry != 'true'
        run: |
          echo "The smoke script started, so this was not an emulator-startup failure."
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: artist-scene-studio-api36-test-results
          path: |
            artist-scene-studio/app/build/reports/androidTests/connected/
            artist-scene-studio/app/build/outputs/androidTest-results/connected/
            artist-scene-studio/app/build/outputs/androidTest-results/connected/**/*.xml
            artist-scene-studio/artist-scene-studio-api*.png
            artist-scene-studio/artist-scene-studio-window.xml
            artist-scene-studio/artist-scene-studio-saved-scene.json
            artist-scene-studio/artist-scene-studio-api*-logcat.txt
            artist-scene-studio/artist-scene-studio-connected-test.log
          if-no-files-found: warn
      - name: Publish renderer smoke status
        if: always()
        continue-on-error: true
        run: |
          payload="$(jq -nc \
            --arg state "$STATE" \
            --arg target_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --arg description "API 36 renderer smoke: $STATE" \
            --arg context "mise/api36-renderer-smoke" \
            '{state:$state,target_url:$target_url,description:$description,context:$context}')"
          curl --fail-with-body -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -d "$payload"
        env:
          GITHUB_TOKEN: ${{ github.token }}
          STATE: ${{ job.status == 'success' && 'success' || 'failure' }}

  api-26-renderer-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned starter assets and GLB fixtures
        run: artist-scene-studio/scripts/fetch-test-assets.sh
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Reset renderer smoke start marker
        run: rm -f artist-scene-studio/.runtime-smoke-started
      - name: Launch renderer fixture on Android API 26
        id: api26_smoke_primary
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 26
          arch: x86_64
          target: google_apis
          working-directory: artist-scene-studio
          # The API 26 system image's bundled SwiftShader 4.0 GLSL compiler aborts on
          # Filament's feature-level-1 blit shader. Lavapipe keeps the Android 8.0
          # framework/runtime under test while providing a standards-compliant headless GPU.
          emulator-options: -no-window -gpu lavapipe -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: API_LEVEL=26 bash scripts/api36-renderer-smoke.sh
      - name: Classify API 26 emulator startup failure
        id: api26_smoke_classify
        if: steps.api26_smoke_primary.outcome == 'failure'
        run: |
          if [ -f artist-scene-studio/.runtime-smoke-started ]; then
            echo "retry=false" >> "$GITHUB_OUTPUT"
          else
            echo "retry=true" >> "$GITHUB_OUTPUT"
            echo "Emulator runner failed before the Mise smoke script started; retrying once."
          fi
      - name: Retry API 26 emulator startup once
        if: steps.api26_smoke_primary.outcome == 'failure' && steps.api26_smoke_classify.outputs.retry == 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 26
          arch: x86_64
          target: google_apis
          working-directory: artist-scene-studio
          emulator-options: -no-window -gpu lavapipe -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: API_LEVEL=26 bash scripts/api36-renderer-smoke.sh
      - name: Preserve real API 26 runtime failure
        if: steps.api26_smoke_primary.outcome == 'failure' && steps.api26_smoke_classify.outputs.retry != 'true'
        run: |
          echo "The smoke script started, so this was not an emulator-startup failure."
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: artist-scene-studio-api26-test-results
          path: |
            artist-scene-studio/app/build/reports/androidTests/connected/
            artist-scene-studio/app/build/outputs/androidTest-results/connected/
            artist-scene-studio/app/build/outputs/androidTest-results/connected/**/*.xml
            artist-scene-studio/artist-scene-studio-api26*.png
            artist-scene-studio/artist-scene-studio-window.xml
            artist-scene-studio/artist-scene-studio-saved-scene.json
            artist-scene-studio/artist-scene-studio-api26-logcat.txt
            artist-scene-studio/artist-scene-studio-connected-test.log
          if-no-files-found: warn
