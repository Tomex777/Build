name: Artist Scene Studio Android CI

on:
  push:
    branches: [artist-scene-studio-foundation]
    paths:
      - "artist-scene-studio/**"
      - ".github/workflows/artist-scene-studio-android-ci.yml"
  pull_request:
    branches: [artist-scene-studio-foundation]
    paths:
      - "artist-scene-studio/**"
      - ".github/workflows/artist-scene-studio-android-ci.yml"
  workflow_dispatch:

jobs:
  unit-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Unit tests
        working-directory: artist-scene-studio
        run: gradle :app:testDebugUnitTest
      - name: Build debug APK
        working-directory: artist-scene-studio
        run: gradle :app:assembleDebug
      - name: Build ARM64 APK
        working-directory: artist-scene-studio
        run: gradle :app:assembleDebug -Pandroid.injected.build.abi=arm64-v8a
      - uses: actions/upload-artifact@v4
        with:
          name: artist-scene-studio-debug-apks
          path: artist-scene-studio/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  api-36-renderer-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Launch renderer fixture on API 36
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          working-directory: artist-scene-studio
          script: gradle :app:connectedDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: artist-scene-studio-api36-test-results
          path: artist-scene-studio/app/build/reports/androidTests/connected/
          if-no-files-found: warn
