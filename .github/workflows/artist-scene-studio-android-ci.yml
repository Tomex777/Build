name: Artist Scene Studio Android CI

on:
  push:
    branches: [artist-scene-studio-foundation]
    paths:
      - "artist-scene-studio/**"
      - ".github/workflows/artist-scene-studio-android-ci.yml"
  pull_request:
    branches: [artist-scene-studio-foundation]
    paths:
      - "artist-scene-studio/**"
      - ".github/workflows/artist-scene-studio-android-ci.yml"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  unit-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned CC0 GLB test fixture
        run: artist-scene-studio/scripts/fetch-test-assets.sh
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Unit tests
        working-directory: artist-scene-studio
        run: gradle :app:testDebugUnitTest || { cat app/build/test-results/testDebugUnitTest/*.xml; exit 1; }
      - name: Build debug APK
        working-directory: artist-scene-studio
        run: gradle :app:assembleDebug
      - name: Build ARM64 APK
        working-directory: artist-scene-studio
        run: gradle :app:assembleDebug -Pandroid.injected.build.abi=arm64-v8a
      - uses: actions/upload-artifact@v4
        with:
          name: artist-scene-studio-debug-apks
          path: artist-scene-studio/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  api-36-renderer-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Publish renderer smoke pending status
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          payload="$(jq -nc \
            --arg state "pending" \
            --arg target_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --arg description "API 36 renderer smoke running" \
            --arg context "mise/api36-renderer-smoke" \
            '{state:$state,target_url:$target_url,description:$description,context:$context}')"
          curl --fail-with-body -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -d "$payload"
      - uses: actions/checkout@v4
      - name: Fetch pinned CC0 GLB test fixture
        run: artist-scene-studio/scripts/fetch-test-assets.sh
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch renderer fixture on API 36
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          working-directory: artist-scene-studio
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            set -eu
            LOGCAT=artist-scene-studio-api36-logcat.txt
            XML=artist-scene-studio-window.xml
            PNG=artist-scene-studio-api36.png
            TEST_LOG=artist-scene-studio-connected-test.log

            adb logcat -c || true
            trap 'adb logcat -d -v threadtime > "$LOGCAT" || true' EXIT

            echo "Renderer backend diagnostics:"
            adb shell getprop ro.hardware.egl || true
            adb shell dumpsys SurfaceFlinger | grep -m1 -E "GLES|OpenGL" || true

            set +e
            timeout 10m gradle :app:connectedDebugAndroidTest --stacktrace > "$TEST_LOG" 2>&1
            test_status=$?
            set -e
            cat "$TEST_LOG"
            if [ "$test_status" -ne 0 ]; then
              echo "API 36 connected renderer test failed with exit code $test_status"
              adb shell getprop ro.build.fingerprint || true
              adb shell getprop ro.hardware.egl || true
              adb shell dumpsys SurfaceFlinger | grep -m2 -E "GLES|OpenGL|Display" || true
              adb shell dumpsys activity activities | grep -E "mResumedActivity|topResumedActivity" | tail -n 5 || true
              adb shell uiautomator dump /sdcard/artist-scene-studio-failure.xml >/tmp/mise-uiautomator-failure.txt 2>&1 || true
              adb pull /sdcard/artist-scene-studio-failure.xml "$XML" >/dev/null 2>&1 || true
              cat /tmp/mise-uiautomator-failure.txt || true
              cat "$XML" || true
              find app/build/outputs app/build/reports/androidTests/connected -maxdepth 7 -type f \( -name '*.xml' -o -name '*.txt' \) -print -exec tail -n 120 {} \; 2>/dev/null || true
              adb logcat -d -v threadtime | grep -Ei 'filament|gltfio|egl|surface|sceneview|fatal exception|artist-scene|AndroidRuntime' | tail -n 240 || true
              exit "$test_status"
            fi

            adb shell am force-stop studio.artistscene.app
            adb shell monkey -p studio.artistscene.app 1 >/tmp/mise-monkey.txt 2>&1
            cat /tmp/mise-monkey.txt

            ready=0
            for attempt in $(seq 1 30); do
              adb shell uiautomator dump /sdcard/artist-scene-studio-window.xml >/tmp/mise-uiautomator.txt 2>&1 || true
              adb pull /sdcard/artist-scene-studio-window.xml "$XML" >/dev/null 2>&1 || true

              if [ -s "$XML" ] &&
                 rg -q "Restored saved scene" "$XML" &&
                 rg -q "X 0.25" "$XML" &&
                 rg -q "Loaded GLB" "$XML" &&
                 rg -q "Renderer loop active" "$XML"; then
                ready=1
                break
              fi

              if ! adb shell pidof studio.artistscene.app >/dev/null 2>&1; then
                echo "Artist Scene Studio process exited during renderer restore proof"
                cat /tmp/mise-uiautomator.txt || true
                exit 1
              fi
              sleep 2
            done

            if [ "$ready" != 1 ]; then
              echo "Renderer restore proof never reached its expected UI state"
              cat "$XML" || true
              adb logcat -d -v threadtime | tail -n 400 || true
              exit 1
            fi

            adb shell screencap -p /sdcard/artist-scene-studio-api36.png
            adb pull /sdcard/artist-scene-studio-api36.png "$PNG"
            test -s "$PNG"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: artist-scene-studio-api36-test-results
          path: |
            artist-scene-studio/app/build/reports/androidTests/connected/
            artist-scene-studio/artist-scene-studio-api36.png
            artist-scene-studio/artist-scene-studio-window.xml
            artist-scene-studio/artist-scene-studio-api36-logcat.txt
            artist-scene-studio/artist-scene-studio-connected-test.log
          if-no-files-found: warn
      - name: Publish renderer smoke status
        if: always()
        continue-on-error: true
        run: |
          payload="$(jq -nc \
            --arg state "$STATE" \
            --arg target_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --arg description "API 36 renderer smoke: $STATE" \
            --arg context "mise/api36-renderer-smoke" \
            '{state:$state,target_url:$target_url,description:$description,context:$context}')"
          curl --fail-with-body -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -d "$payload"
        env:
          GITHUB_TOKEN: ${{ github.token }}
          STATE: ${{ job.status == 'success' && 'success' || 'failure' }}
