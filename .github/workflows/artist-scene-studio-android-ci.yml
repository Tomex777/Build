name: Artist Scene Studio Android CI

on:
  push:
    branches: [artist-scene-studio-foundation]
    paths:
      - "artist-scene-studio/**"
      - ".github/workflows/artist-scene-studio-android-ci.yml"
  pull_request:
    branches: [artist-scene-studio-foundation]
    paths:
      - "artist-scene-studio/**"
      - ".github/workflows/artist-scene-studio-android-ci.yml"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: artist-scene-studio-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MISE_RELEASE_KEYSTORE_BASE64: ${{ secrets.MISE_RELEASE_KEYSTORE_BASE64 }}
  MISE_RELEASE_STORE_PASSWORD: ${{ secrets.MISE_RELEASE_STORE_PASSWORD }}
  MISE_RELEASE_KEY_ALIAS: ${{ secrets.MISE_RELEASE_KEY_ALIAS }}
  MISE_RELEASE_KEY_PASSWORD: ${{ secrets.MISE_RELEASE_KEY_PASSWORD }}

jobs:
  unit-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned starter assets and GLB fixtures
        run: artist-scene-studio/scripts/fetch-test-assets.sh
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Unit tests
        working-directory: artist-scene-studio
        run: gradle :app:testDebugUnitTest || { cat app/build/test-results/testDebugUnitTest/*.xml; exit 1; }
      - name: Build debug APK
        working-directory: artist-scene-studio
        run: gradle :app:assembleDebug
      - name: Build ARM64 debug APK
        working-directory: artist-scene-studio
        run: gradle --no-daemon :app:assembleDebug -Pandroid.injected.build.abi=arm64-v8a
      - name: Build universal release APK
        working-directory: artist-scene-studio
        run: |
          gradle --stop || true
          gradle --no-daemon :app:assembleRelease
      - name: Build release app bundle
        working-directory: artist-scene-studio
        run: gradle :app:bundleRelease
      - name: Stage and verify Mise release candidate
        working-directory: artist-scene-studio
        shell: bash
        run: |
          set -euo pipefail
          OUT="app/build/release-artifacts"
          BUILD_TOOLS="$ANDROID_SDK_ROOT/build-tools/36.0.0"
          mkdir -p "$OUT"

          release_apk="$(find app/build -type f -name '*.apk' -path '*release*' ! -path '*/release-artifacts/*' | head -n 1)"
          release_aab="$(find app/build -type f -name '*.aab' -path '*release*' ! -path '*/release-artifacts/*' | head -n 1)"
          test -n "$release_apk" && test -s "$release_apk"
          test -n "$release_aab" && test -s "$release_aab"

          ARM64_UNSIGNED="$OUT/Mise-1.0.0-arm64-release-unsigned.apk"
          UNIVERSAL_UNSIGNED="$OUT/Mise-1.0.0-universal-release-unsigned.apk"
          AAB_UNSIGNED="$OUT/Mise-1.0.0-release-unsigned.aab"

          # Capture the normal universal release before any ABI-filtered build.
          # Android's injected ABI property can affect the current Gradle invocation,
          # so the phone-only artifact is generated second in an isolated daemon.
          cp "$release_apk" "$UNIVERSAL_UNSIGNED"
          cp "$release_aab" "$AAB_UNSIGNED"

          gradle --stop || true
          gradle --no-daemon :app:assembleRelease -Pandroid.injected.build.abi=arm64-v8a --rerun-tasks
          arm64_apk="$(find app/build -type f -name '*.apk' -path '*release*' ! -path '*/release-artifacts/*' | head -n 1)"
          test -n "$arm64_apk" && test -s "$arm64_apk"
          cp "$arm64_apk" "$ARM64_UNSIGNED"

          unzip -Z1 "$UNIVERSAL_UNSIGNED" | grep -q '^lib/arm64-v8a/'
          unzip -Z1 "$UNIVERSAL_UNSIGNED" | grep -q '^lib/x86_64/'
          unzip -Z1 "$ARM64_UNSIGNED" | grep -q '^lib/arm64-v8a/'
          if unzip -Z1 "$ARM64_UNSIGNED" | grep -Eq '^lib/(armeabi-v7a|x86|x86_64)/'; then
            echo "ARM64 release unexpectedly contains a non-ARM64 native library" >&2
            exit 1
          fi
          if cmp -s "$ARM64_UNSIGNED" "$UNIVERSAL_UNSIGNED"; then
            echo "Universal and ARM64 release APKs are unexpectedly identical" >&2
            exit 1
          fi

          QA_KEYSTORE="$RUNNER_TEMP/mise-ci-qa.jks"
          keytool -genkeypair -noprompt             -keystore "$QA_KEYSTORE"             -storepass android             -alias androiddebugkey             -keypass android             -dname "CN=Mise CI QA,O=Tomex,C=NG"             -keyalg RSA             -keysize 2048             -validity 10000

          ARM64_QA="$OUT/Mise-1.0.0-arm64-release-QA-debugsigned.apk"
          UNIVERSAL_QA="$OUT/Mise-1.0.0-universal-release-QA-debugsigned.apk"
          "$BUILD_TOOLS/apksigner" sign             --ks "$QA_KEYSTORE"             --ks-key-alias androiddebugkey             --ks-pass pass:android             --key-pass pass:android             --out "$ARM64_QA"             "$ARM64_UNSIGNED"
          "$BUILD_TOOLS/apksigner" sign             --ks "$QA_KEYSTORE"             --ks-key-alias androiddebugkey             --ks-pass pass:android             --key-pass pass:android             --out "$UNIVERSAL_QA"             "$UNIVERSAL_UNSIGNED"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$ARM64_QA"             | tee "$OUT/ARM64-QA-SIGNATURE.txt"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$UNIVERSAL_QA"             | tee "$OUT/UNIVERSAL-QA-SIGNATURE.txt"
          rm -f "$QA_KEYSTORE"

          "$BUILD_TOOLS/aapt" dump badging "$UNIVERSAL_UNSIGNED"             | tee "$OUT/release-badging.txt"
          if grep -q "testOnly='-1'" "$OUT/release-badging.txt"; then
            echo "Release APK is incorrectly marked testOnly" >&2
            exit 1
          fi
          grep -q "package: name='studio.artistscene.app'" "$OUT/release-badging.txt"
          grep -q "versionCode='100'" "$OUT/release-badging.txt"
          grep -q "versionName='1.0.0'" "$OUT/release-badging.txt"
          grep -q "sdkVersion:'26'" "$OUT/release-badging.txt"
          grep -q "targetSdkVersion:'36'" "$OUT/release-badging.txt"
          grep -q "application-label:'Mise'" "$OUT/release-badging.txt"

          PRODUCTION_SIGNING="NOT_CONFIGURED"
          if [[ -n "${MISE_RELEASE_KEYSTORE_BASE64:-}" &&
                -n "${MISE_RELEASE_STORE_PASSWORD:-}" &&
                -n "${MISE_RELEASE_KEY_ALIAS:-}" &&
                -n "${MISE_RELEASE_KEY_PASSWORD:-}" ]]; then
            KEYSTORE="$RUNNER_TEMP/mise-release.jks"
            printf '%s' "$MISE_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"

            "$BUILD_TOOLS/apksigner" sign               --ks "$KEYSTORE"               --ks-key-alias "$MISE_RELEASE_KEY_ALIAS"               --ks-pass env:MISE_RELEASE_STORE_PASSWORD               --key-pass env:MISE_RELEASE_KEY_PASSWORD               --out "$OUT/Mise-1.0.0-arm64-release-production-signed.apk"               "$ARM64_UNSIGNED"
            "$BUILD_TOOLS/apksigner" sign               --ks "$KEYSTORE"               --ks-key-alias "$MISE_RELEASE_KEY_ALIAS"               --ks-pass env:MISE_RELEASE_STORE_PASSWORD               --key-pass env:MISE_RELEASE_KEY_PASSWORD               --out "$OUT/Mise-1.0.0-universal-release-production-signed.apk"               "$UNIVERSAL_UNSIGNED"
            "$BUILD_TOOLS/apksigner" verify               "$OUT/Mise-1.0.0-arm64-release-production-signed.apk"
            "$BUILD_TOOLS/apksigner" verify               "$OUT/Mise-1.0.0-universal-release-production-signed.apk"

            jarsigner               -keystore "$KEYSTORE"               -storepass "$MISE_RELEASE_STORE_PASSWORD"               -keypass "$MISE_RELEASE_KEY_PASSWORD"               -signedjar "$OUT/Mise-1.0.0-release-production-signed.aab"               "$AAB_UNSIGNED"               "$MISE_RELEASE_KEY_ALIAS"
            jarsigner -verify "$OUT/Mise-1.0.0-release-production-signed.aab"
            rm -f "$KEYSTORE"
            PRODUCTION_SIGNING="SIGNED"
          fi

          if [ "$PRODUCTION_SIGNING" = "SIGNED" ]; then
            cp "$OUT/Mise-1.0.0-universal-release-production-signed.apk" "$OUT/Mise-runtime-release.apk"
          else
            cp "$UNIVERSAL_QA" "$OUT/Mise-runtime-release.apk"
          fi
          sha256sum "$ARM64_UNSIGNED" "$ARM64_QA" "$UNIVERSAL_UNSIGNED" "$UNIVERSAL_QA" "$AAB_UNSIGNED"             > "$OUT/SHA256SUMS.txt"
          if compgen -G "$OUT/*production-signed.*" >/dev/null; then
            sha256sum "$OUT/"*production-signed.* >> "$OUT/SHA256SUMS.txt"
          fi
          {
            echo "app=Mise"
            echo "versionName=1.0.0"
            echo "versionCode=100"
            echo "minSdk=26"
            echo "targetSdk=36"
            echo "arm64Release=Mise-1.0.0-arm64-release-QA-debugsigned.apk"
            echo "universalRelease=Mise-1.0.0-universal-release-QA-debugsigned.apk"
            echo "aabRelease=Mise-1.0.0-release-unsigned.aab"
            echo "productionSigning=$PRODUCTION_SIGNING"
          } > "$OUT/RELEASE_STATUS.txt"
          ls -lh "$OUT"
      - uses: actions/upload-artifact@v4
        with:
          name: artist-scene-studio-debug-apks
          path: artist-scene-studio/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: mise-runtime-release-apk
          path: artist-scene-studio/app/build/release-artifacts/Mise-runtime-release.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Mise-1.0.0-release-candidate
          path: |
            artist-scene-studio/app/build/release-artifacts/Mise-1.0.0-arm64-release-unsigned.apk
            artist-scene-studio/app/build/release-artifacts/Mise-1.0.0-arm64-release-QA-debugsigned.apk
            artist-scene-studio/app/build/release-artifacts/Mise-1.0.0-universal-release-unsigned.apk
            artist-scene-studio/app/build/release-artifacts/Mise-1.0.0-universal-release-QA-debugsigned.apk
            artist-scene-studio/app/build/release-artifacts/Mise-1.0.0-release-unsigned.aab
            artist-scene-studio/app/build/release-artifacts/*production-signed.apk
            artist-scene-studio/app/build/release-artifacts/*production-signed.aab
            artist-scene-studio/app/build/release-artifacts/ARM64-QA-SIGNATURE.txt
            artist-scene-studio/app/build/release-artifacts/UNIVERSAL-QA-SIGNATURE.txt
            artist-scene-studio/app/build/release-artifacts/release-badging.txt
            artist-scene-studio/app/build/release-artifacts/SHA256SUMS.txt
            artist-scene-studio/app/build/release-artifacts/RELEASE_STATUS.txt
          if-no-files-found: error

  release-install-smoke:
    strategy:
      fail-fast: false
      matrix:
        api-level: [26, 36]
    needs: unit-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"
      - uses: actions/download-artifact@v4
        with:
          name: mise-runtime-release-apk
          path: /tmp/mise-release
      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Render universal release candidate on API ${{ matrix.api-level }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu lavapipe -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: API_LEVEL=${{ matrix.api-level }} bash artist-scene-studio/scripts/api36-release-install-smoke.sh /tmp/mise-release/Mise-runtime-release.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mise-api${{ matrix.api-level }}-release-install-proof
          path: |
            artist-scene-studio/mise-api${{ matrix.api-level }}-release.png
            artist-scene-studio/mise-api${{ matrix.api-level }}-release-window.xml
            artist-scene-studio/mise-api${{ matrix.api-level }}-release-logcat.txt
          if-no-files-found: warn

  api-36-renderer-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Publish renderer smoke pending status
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          payload="$(jq -nc \
            --arg state "pending" \
            --arg target_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --arg description "API 36 renderer smoke running" \
            --arg context "mise/api36-renderer-smoke" \
            '{state:$state,target_url:$target_url,description:$description,context:$context}')"
          curl --fail-with-body -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -d "$payload"
      - uses: actions/checkout@v4
      - name: Fetch pinned starter assets and GLB fixtures
        run: artist-scene-studio/scripts/fetch-test-assets.sh
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Reset renderer smoke start marker
        run: rm -f artist-scene-studio/.runtime-smoke-started
      - name: Launch renderer fixture on API 36
        id: api36_smoke_primary
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          working-directory: artist-scene-studio
          emulator-options: -no-window -gpu lavapipe -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash scripts/api36-renderer-smoke.sh
      - name: Classify API 36 emulator startup failure
        id: api36_smoke_classify
        if: steps.api36_smoke_primary.outcome == 'failure'
        run: |
          if [ -f artist-scene-studio/.runtime-smoke-started ]; then
            echo "retry=false" >> "$GITHUB_OUTPUT"
          else
            echo "retry=true" >> "$GITHUB_OUTPUT"
            echo "Emulator runner failed before the Mise smoke script started; retrying once."
          fi
      - name: Retry API 36 emulator startup once
        if: steps.api36_smoke_primary.outcome == 'failure' && steps.api36_smoke_classify.outputs.retry == 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          working-directory: artist-scene-studio
          emulator-options: -no-window -gpu lavapipe -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash scripts/api36-renderer-smoke.sh
      - name: Preserve real API 36 runtime failure
        if: steps.api36_smoke_primary.outcome == 'failure' && steps.api36_smoke_classify.outputs.retry != 'true'
        run: |
          echo "The smoke script started, so this was not an emulator-startup failure."
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: artist-scene-studio-api36-test-results
          path: |
            artist-scene-studio/app/build/reports/androidTests/connected/
            artist-scene-studio/app/build/outputs/androidTest-results/connected/
            artist-scene-studio/app/build/outputs/androidTest-results/connected/**/*.xml
            artist-scene-studio/artist-scene-studio-api*.png
            artist-scene-studio/artist-scene-studio-window.xml
            artist-scene-studio/artist-scene-studio-saved-scene.json
            artist-scene-studio/artist-scene-studio-saf-*.json
            artist-scene-studio/artist-scene-studio-api*-logcat.txt
            artist-scene-studio/artist-scene-studio-connected-test.log
          if-no-files-found: warn
      - name: Publish renderer smoke status
        if: always()
        continue-on-error: true
        run: |
          payload="$(jq -nc \
            --arg state "$STATE" \
            --arg target_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --arg description "API 36 renderer smoke: $STATE" \
            --arg context "mise/api36-renderer-smoke" \
            '{state:$state,target_url:$target_url,description:$description,context:$context}')"
          curl --fail-with-body -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -d "$payload"
        env:
          GITHUB_TOKEN: ${{ github.token }}
          STATE: ${{ job.status == 'success' && 'success' || 'failure' }}

  api-26-renderer-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned starter assets and GLB fixtures
        run: artist-scene-studio/scripts/fetch-test-assets.sh
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Reset renderer smoke start marker
        run: rm -f artist-scene-studio/.runtime-smoke-started
      - name: Launch renderer fixture on Android API 26
        id: api26_smoke_primary
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 26
          arch: x86_64
          target: google_apis
          working-directory: artist-scene-studio
          # The API 26 system image's bundled SwiftShader 4.0 GLSL compiler aborts on
          # Filament's feature-level-1 blit shader. Lavapipe keeps the Android 8.0
          # framework/runtime under test while providing a standards-compliant headless GPU.
          emulator-options: -no-window -gpu lavapipe -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: API_LEVEL=26 bash scripts/api36-renderer-smoke.sh
      - name: Classify API 26 emulator startup failure
        id: api26_smoke_classify
        if: steps.api26_smoke_primary.outcome == 'failure'
        run: |
          if [ -f artist-scene-studio/.runtime-smoke-started ]; then
            echo "retry=false" >> "$GITHUB_OUTPUT"
          else
            echo "retry=true" >> "$GITHUB_OUTPUT"
            echo "Emulator runner failed before the Mise smoke script started; retrying once."
          fi
      - name: Retry API 26 emulator startup once
        if: steps.api26_smoke_primary.outcome == 'failure' && steps.api26_smoke_classify.outputs.retry == 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 26
          arch: x86_64
          target: google_apis
          working-directory: artist-scene-studio
          emulator-options: -no-window -gpu lavapipe -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: API_LEVEL=26 bash scripts/api36-renderer-smoke.sh
      - name: Preserve real API 26 runtime failure
        if: steps.api26_smoke_primary.outcome == 'failure' && steps.api26_smoke_classify.outputs.retry != 'true'
        run: |
          echo "The smoke script started, so this was not an emulator-startup failure."
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: artist-scene-studio-api26-test-results
          path: |
            artist-scene-studio/app/build/reports/androidTests/connected/
            artist-scene-studio/app/build/outputs/androidTest-results/connected/
            artist-scene-studio/app/build/outputs/androidTest-results/connected/**/*.xml
            artist-scene-studio/artist-scene-studio-api26*.png
            artist-scene-studio/artist-scene-studio-window.xml
            artist-scene-studio/artist-scene-studio-saved-scene.json
            artist-scene-studio/artist-scene-studio-saf-*.json
            artist-scene-studio/artist-scene-studio-api26-logcat.txt
            artist-scene-studio/artist-scene-studio-connected-test.log
          if-no-files-found: warn
