name: Apply Sora Media Progress

on:
  push:
    branches: [sora-android-ci]
    paths:
      - 'sora-ci/media-progress-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sora-android-ci

      - name: Apply media progress plumbing
        run: python3 sora-ci/apply-media-progress.py

      - name: Verify progress wiring
        run: |
          grep -q 'data class MediaProgressEntry' sora-overlay/app/src/main/java/com/night/sora/model/Models.kt
          grep -q 'val mediaProgress = mutableStateListOf<MediaProgressEntry>()' sora-overlay/app/src/main/java/com/night/sora/data/CoreRepository.kt
          grep -q 'recordMediaProgress' sora-overlay/app/src/main/java/com/night/sora/data/CoreRepository.kt
          grep -q 'progressEntries = repository.mediaProgress' sora-overlay/app/src/main/java/com/night/sora/ui/SoraApp.kt
          grep -q 'ProgressLandscapeRail' sora-overlay/app/src/main/java/com/night/sora/ui/screens/MediaScreen.kt
          grep -q 'onProgress(session, currentPage + 1, pages.size)' sora-overlay/app/src/main/java/com/night/sora/ui/screens/ReaderScreen.kt
          grep -q 'onProgress(session, current, total)' sora-overlay/app/src/main/java/com/night/sora/ui/screens/VideoPlayerScreen.kt

      - name: Commit media progress
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add sora-overlay/app/src/main/java/com/night/sora/model/Models.kt \
                  sora-overlay/app/src/main/java/com/night/sora/data/CoreRepository.kt \
                  sora-overlay/app/src/main/java/com/night/sora/ui/SoraApp.kt \
                  sora-overlay/app/src/main/java/com/night/sora/ui/screens/MediaDetailScreen.kt \
                  sora-overlay/app/src/main/java/com/night/sora/ui/screens/MediaScreen.kt \
                  sora-overlay/app/src/main/java/com/night/sora/ui/screens/ReaderScreen.kt \
                  sora-overlay/app/src/main/java/com/night/sora/ui/screens/VideoPlayerScreen.kt
          git diff --cached --quiet && exit 0
          git commit -m 'persist real Sora watch and read progress'
          git push origin HEAD:sora-android-ci
