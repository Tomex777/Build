name: Homira iOS

on:
  push:
    branches: [homira-call-ci]
    paths:
      - 'homira-ios/**'
      - '.github/workflows/homira-ios.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: homira-ios
        run: xcodegen generate

      - name: Pick simulator SDK
        id: sdk
        run: |
          echo "sdk=$(xcrun --sdk iphonesimulator --show-sdk-path)" >> "$GITHUB_OUTPUT"

      - name: Build iOS simulator app
        working-directory: homira-ios
        run: |
          xcodebuild \
            -project Homira.xcodeproj \
            -scheme Homira \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build
