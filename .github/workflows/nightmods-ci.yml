name: Night Mods Android CI

on:
  push:
    branches:
      - nightmods-ci
  workflow_dispatch:

jobs:
  build:
    name: Build Night Mods manager
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android API 36
        shell: bash
        run: |
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          "$SDKMANAGER" --list_installed | grep -E 'platforms;android-36|build-tools;36.0.0|platform-tools'

      - name: Clone LSPosed ET
        shell: bash
        run: |
          git clone --depth 1 https://github.com/EzequielDevTeam/LSPosed-ET.git lsposed-et
          cd lsposed-et
          git config --global --add safe.directory '*'
          git submodule update --init --depth 1
          git -C external/lsplant rm -q --cached -r test || true
          rm -rf external/lsplant/test
          git -C external/lsplant submodule update --init --recursive --depth 1

      - name: Apply Night Mods overlay
        shell: bash
        run: |
          python3 nightmods/manager-overlay/apply_nightmods.py lsposed-et
          grep -n 'startDestination="@id/modules_nav"' lsposed-et/app/src/main/res/navigation/main_nav.xml
          grep -n 'Night Mods' lsposed-et/app/src/main/res/values/strings_untranslatable.xml
          test -f lsposed-et/app/src/main/java/org/lsposed/manager/nightmods/NightModsBackend.java

      - name: Build Night Mods manager APK
        working-directory: lsposed-et
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Verify manager APK identity
        shell: bash
        run: |
          APK="$(find lsposed-et/app/build/outputs -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          AAPT="${ANDROID_SDK_ROOT}/build-tools/36.0.0/aapt"
          "$AAPT" dump badging "$APK" | tee /tmp/nightmods-badging.txt
          grep -q "package: name='org.lsposed.manager'" /tmp/nightmods-badging.txt
          grep -q "application-label:'Night Mods'" /tmp/nightmods-badging.txt
          sha256sum "$APK"

      - name: Upload manager APK
        uses: actions/upload-artifact@v4
        with:
          name: Night-Mods-debug-apk
          path: lsposed-et/app/build/outputs/**/*.apk
          if-no-files-found: error

      - name: Upload manager reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Night-Mods-build-reports
          path: |
            lsposed-et/app/build/reports/**
            lsposed-et/app/build/outputs/logs/**
          if-no-files-found: ignore

  nightcore-build:
    name: Build Night Core module
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Install Android API 36
        shell: bash
        run: |
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

      - name: Restore corrected Night Core source
        shell: bash
        run: |
          base64 --decode nightmods/nightcore-payload/nightcore.tar.xz.b64 > /tmp/nightcore.tar.xz
          echo "4b35341bd845263bbd8cf616ce2e80c058fe318016b04b2d11724d52c115ef28  /tmp/nightcore.tar.xz" | sha256sum -c -
          mkdir -p nightcore
          tar -xJf /tmp/nightcore.tar.xz -C nightcore
          test -f nightcore/settings.gradle.kts
          test -f nightcore/app/build.gradle.kts
          test -f nightcore/app/src/main/assets/xposed_init

      - name: Build and lint Night Core
        working-directory: nightcore
        run: gradle --no-daemon --stacktrace clean lintDebug assembleDebug

      - name: Verify Night Core APK
        shell: bash
        run: |
          APK="$(find nightcore/app/build/outputs -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          AAPT="${ANDROID_SDK_ROOT}/build-tools/36.0.0/aapt"
          "$AAPT" dump badging "$APK" | tee /tmp/nightcore-badging.txt
          grep -q "package: name='dev.nightmods.core'" /tmp/nightcore-badging.txt
          grep -q "application-label:'Night Core'" /tmp/nightcore-badging.txt
          unzip -p "$APK" assets/xposed_init | tee /tmp/xposed_init.txt
          grep -qx 'dev.nightmods.core.hook.NightCoreHook' /tmp/xposed_init.txt
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml > /tmp/nightcore-manifest.txt
          grep -q 'xposedmodule' /tmp/nightcore-manifest.txt
          grep -q 'xposedsharedprefs' /tmp/nightcore-manifest.txt
          grep -q 'xposedscope' /tmp/nightcore-manifest.txt
          sha256sum "$APK"

      - name: Upload Night Core APK
        uses: actions/upload-artifact@v4
        with:
          name: Night-Core-debug-apk
          path: nightcore/app/build/outputs/**/*.apk
          if-no-files-found: error

      - name: Upload Night Core reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Night-Core-build-reports
          path: nightcore/app/build/reports/**
          if-no-files-found: ignore

  android16-smoke:
    name: Android 16 smoke test
    needs:
      - build
      - nightcore-build
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Night Mods APK
        uses: actions/download-artifact@v4
        with:
          name: Night-Mods-debug-apk
          path: nightmods-apk

      - name: Download Night Core APK
        uses: actions/download-artifact@v4
        with:
          name: Night-Core-debug-apk
          path: nightcore-apk

      - name: Prepare smoke output
        shell: bash
        run: |
          mkdir -p smoke
          find nightmods-apk nightcore-apk -type f -name '*.apk' -print
          test -n "$(find nightmods-apk -type f -name '*.apk' -print -quit)"
          test -n "$(find nightcore-apk -type f -name '*.apk' -print -quit)"

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          sudo chmod 666 /dev/kvm || true

      - name: Boot Android 16 and launch both apps
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb wait-for-device
            adb shell getprop ro.build.version.sdk | tr -d '\r' | tee smoke/sdk.txt
            test "$(cat smoke/sdk.txt)" = "36"
            adb install -r "$(find nightmods-apk -type f -name '*.apk' -print -quit)"
            adb install -r "$(find nightcore-apk -type f -name '*.apk' -print -quit)"
            adb logcat -c

            adb shell am force-stop org.lsposed.manager || true
            adb shell am start -W -n org.lsposed.manager/.ui.activity.MainActivity | tee smoke/manager-start.txt
            sleep 7
            adb shell pidof org.lsposed.manager | tr -d '\r' | tee smoke/manager-process.txt
            test -s smoke/manager-process.txt
            adb shell dumpsys activity activities > smoke/manager-activities.txt
            grep -E 'mResumedActivity|topResumedActivity' smoke/manager-activities.txt | grep -q 'org.lsposed.manager'
            adb shell uiautomator dump /sdcard/nightmods-window.xml || true
            adb pull /sdcard/nightmods-window.xml smoke/nightmods-window.xml || true
            adb exec-out screencap -p > smoke/nightmods-android16.png

            adb shell am force-stop dev.nightmods.core || true
            adb shell am start -W -n dev.nightmods.core/.MainActivity | tee smoke/nightcore-start.txt
            sleep 5
            adb shell pidof dev.nightmods.core | tr -d '\r' | tee smoke/nightcore-process.txt
            test -s smoke/nightcore-process.txt
            adb shell dumpsys activity activities > smoke/nightcore-activities.txt
            grep -E 'mResumedActivity|topResumedActivity' smoke/nightcore-activities.txt | grep -q 'dev.nightmods.core'
            adb shell uiautomator dump /sdcard/nightcore-window.xml || true
            adb pull /sdcard/nightcore-window.xml smoke/nightcore-window.xml || true
            adb exec-out screencap -p > smoke/nightcore-android16.png

            adb logcat -d > smoke/logcat.txt
            adb logcat -b crash -d > smoke/crash.txt || true
            test -z "$(grep -E 'org\.lsposed\.manager|dev\.nightmods\.core' smoke/crash.txt || true)"
            echo 'Android 16 manager + module smoke test passed.'

      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Night-Mods-Android16-smoke
          path: smoke/**
          if-no-files-found: warn
