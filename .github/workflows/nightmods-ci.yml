name: Night Mods Android CI

on:
  push:
    branches:
      - nightmods-ci
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android API 36
        shell: bash
        run: |
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          "$SDKMANAGER" --list_installed | grep -E 'platforms;android-36|build-tools;36.0.0|platform-tools'

      - name: Clone LSPosed ET
        shell: bash
        run: |
          git clone --depth 1 https://github.com/EzequielDevTeam/LSPosed-ET.git lsposed-et
          cd lsposed-et
          git config --global --add safe.directory '*'
          git submodule update --init --depth 1
          git -C external/lsplant rm -q --cached -r test || true
          rm -rf external/lsplant/test
          git -C external/lsplant submodule update --init --recursive --depth 1

      - name: Apply Night Mods overlay
        shell: bash
        run: |
          python3 nightmods/manager-overlay/apply_nightmods.py lsposed-et
          grep -n 'startDestination="@id/modules_nav"' lsposed-et/app/src/main/res/navigation/main_nav.xml
          grep -n 'Night Mods' lsposed-et/app/src/main/res/values/strings.xml
          test -f lsposed-et/app/src/main/java/org/lsposed/manager/nightmods/NightModsBackend.java

      - name: Restore libxposed service dependency
        shell: bash
        run: |
          git clone --depth 1 --branch 100 https://github.com/libxposed/service.git lsposed-et/libxposed/service
          mkdir -p ~/.m2/repository/io/github/libxposed/api/100
          cp lsposed-et/ci/libxposed-api-100/api-100.aar lsposed-et/ci/libxposed-api-100/api-100.pom ~/.m2/repository/io/github/libxposed/api/100/

      - name: Build libxposed service
        working-directory: lsposed-et/libxposed/service
        run: ./gradlew --no-daemon --stacktrace publishToMavenLocal

      - name: Build Night Mods manager APK
        working-directory: lsposed-et
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: List APK outputs
        if: always()
        shell: bash
        run: find lsposed-et/app/build/outputs -type f -name '*.apk' -print 2>/dev/null || true

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Night-Mods-debug-apk
          path: lsposed-et/app/build/outputs/**/*.apk
          if-no-files-found: warn

      - name: Upload Gradle reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Night-Mods-build-reports
          path: |
            lsposed-et/app/build/reports/**
            lsposed-et/app/build/outputs/logs/**
          if-no-files-found: ignore
