name: Night Mods Android CI

on:
  push:
    branches:
      - nightmods-ci
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android API 36
        shell: bash
        run: |
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          "$SDKMANAGER" --list_installed | grep -E 'platforms;android-36|build-tools;36.0.0|platform-tools'

      - name: Clone LSPosed ET
        shell: bash
        run: |
          git clone --depth 1 https://github.com/EzequielDevTeam/LSPosed-ET.git lsposed-et
          cd lsposed-et
          git config --global --add safe.directory '*'
          git submodule update --init --depth 1
          git -C external/lsplant rm -q --cached -r test || true
          rm -rf external/lsplant/test
          git -C external/lsplant submodule update --init --recursive --depth 1

      - name: Apply Night Mods overlay
        shell: bash
        run: |
          python3 nightmods/manager-overlay/apply_nightmods.py lsposed-et
          grep -n 'startDestination="@id/modules_nav"' lsposed-et/app/src/main/res/navigation/main_nav.xml
          grep -n 'Night Mods' lsposed-et/app/src/main/res/values/strings.xml
          test -f lsposed-et/app/src/main/java/org/lsposed/manager/nightmods/NightModsBackend.java

      - name: Build Night Mods manager APK
        working-directory: lsposed-et
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK identity
        shell: bash
        run: |
          APK="$(find lsposed-et/app/build/outputs -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          AAPT="${ANDROID_SDK_ROOT}/build-tools/36.0.0/aapt"
          "$AAPT" dump badging "$APK" | tee /tmp/nightmods-badging.txt
          grep -q "package: name='org.lsposed.manager'" /tmp/nightmods-badging.txt
          grep -q "application-label:'Night Mods'" /tmp/nightmods-badging.txt
          sha256sum "$APK"

      - name: List APK outputs
        if: always()
        shell: bash
        run: find lsposed-et/app/build/outputs -type f -name '*.apk' -print 2>/dev/null || true

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Night-Mods-debug-apk
          path: lsposed-et/app/build/outputs/**/*.apk
          if-no-files-found: error

      - name: Upload Gradle reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Night-Mods-build-reports
          path: |
            lsposed-et/app/build/reports/**
            lsposed-et/app/build/outputs/logs/**
          if-no-files-found: ignore

  android16-smoke:
    name: Android 16 smoke test
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Night Mods APK
        uses: actions/download-artifact@v4
        with:
          name: Night-Mods-debug-apk
          path: nightmods-apk

      - name: Prepare smoke output
        shell: bash
        run: |
          mkdir -p smoke
          find nightmods-apk -type f -name '*.apk' -print
          test -n "$(find nightmods-apk -type f -name '*.apk' -print -quit)"

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          sudo chmod 666 /dev/kvm || true

      - name: Boot Android 16 and launch Night Mods
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set -euo pipefail
            APK="$(find nightmods-apk -type f -name '*.apk' -print -quit)"
            adb wait-for-device
            adb shell getprop ro.build.version.release
            adb shell getprop ro.build.version.sdk | tee smoke/sdk.txt
            test "$(tr -d '\r' < smoke/sdk.txt)" = "36"
            adb install -r "$APK"
            adb logcat -c
            adb shell am force-stop org.lsposed.manager || true
            adb shell am start -W -n org.lsposed.manager/.ui.activity.MainActivity | tee smoke/activity-start.txt
            sleep 8
            PID="$(adb shell pidof org.lsposed.manager | tr -d '\r')"
            echo "PID=$PID" | tee smoke/process.txt
            test -n "$PID"
            adb shell dumpsys activity activities > smoke/activities.txt
            grep -E 'mResumedActivity|topResumedActivity' smoke/activities.txt | grep -q 'org.lsposed.manager'
            adb shell uiautomator dump /sdcard/nightmods-window.xml || true
            adb pull /sdcard/nightmods-window.xml smoke/nightmods-window.xml || true
            adb exec-out screencap -p > smoke/nightmods-android16.png
            adb logcat -d > smoke/logcat.txt
            adb logcat -b crash -d > smoke/crash.txt || true
            if grep -q 'org.lsposed.manager' smoke/crash.txt; then
              echo 'Night Mods produced an Android crash entry.' >&2
              cat smoke/crash.txt >&2
              exit 1
            fi
            echo 'Android 16 Night Mods smoke test passed.'

      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Night-Mods-Android16-smoke
          path: smoke/**
          if-no-files-found: warn
