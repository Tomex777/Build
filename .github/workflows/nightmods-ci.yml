name: Night Mods Android CI

on:
  push:
    branches:
      - nightmods-ci
      - nightmods-core-integration
  workflow_dispatch:

jobs:
  build:
    name: Build Night Mods manager
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Install Android API 36
        shell: bash
        run: |
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
      - name: Clone LSPosed ET
        shell: bash
        run: |
          git clone --depth 1 https://github.com/EzequielDevTeam/LSPosed-ET.git lsposed-et
          cd lsposed-et
          git config --global --add safe.directory '*'
          git submodule update --init --depth 1
          git -C external/lsplant rm -q --cached -r test || true
          rm -rf external/lsplant/test
          git -C external/lsplant submodule update --init --recursive --depth 1
      - name: Apply Night Mods overlay
        shell: bash
        run: |
          python3 nightmods/manager-overlay/apply_nightmods.py lsposed-et
          grep -n 'startDestination="@id/modules_nav"' lsposed-et/app/src/main/res/navigation/main_nav.xml
          grep -n 'Night Mods' lsposed-et/app/src/main/res/values/strings_untranslatable.xml
          grep -n 'night_core_fragment' lsposed-et/app/src/main/res/navigation/modules_nav.xml
      - name: Build Night Mods manager APK
        working-directory: lsposed-et
        run: ./gradlew --no-daemon --stacktrace -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g" -Dorg.gradle.workers.max=2 :app:assembleDebug
      - name: Verify manager APK identity
        shell: bash
        run: |
          APK="$(find lsposed-et/app/build/outputs -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          AAPT="${ANDROID_SDK_ROOT}/build-tools/36.0.0/aapt"
          "$AAPT" dump badging "$APK" | tee /tmp/nightmods-badging.txt
          grep -q "package: name='org.lsposed.manager'" /tmp/nightmods-badging.txt
          grep -q "application-label:'Night Mods'" /tmp/nightmods-badging.txt
          sha256sum "$APK"
      - name: Upload manager APK
        uses: actions/upload-artifact@v4
        with:
          name: Night-Mods-debug-apk
          path: lsposed-et/app/build/outputs/**/*.apk
          if-no-files-found: error
          retention-days: 3
      - name: Upload manager reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Night-Mods-build-reports
          path: |
            lsposed-et/app/build/reports/**
            lsposed-et/app/build/outputs/logs/**
          if-no-files-found: ignore
          retention-days: 1

  nightcore-build:
    name: Build modern Night Core module
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Install Android SDKs
        shell: bash
        run: |
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-33" "build-tools;33.0.1" "build-tools;33.0.2" "platforms;android-36" "build-tools;36.0.0"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
      - name: Publish exact libxposed API/service 100 locally
        shell: bash
        run: bash nightmods/ci/prepare-libxposed-100.sh
      - name: Verify modern Night Core source contract
        shell: bash
        run: |
          ROOT=nightmods/nightcore/app/src/main
          HOOK="$ROOT/java/dev/nightmods/core/hook/NightCoreHook.java"
          STORE="$ROOT/java/dev/nightmods/core/config/NightCoreServiceStore.java"
          PROVIDER="$ROOT/java/dev/nightmods/core/config/NightCoreSettingsProvider.java"
          test -f "$ROOT/resources/META-INF/xposed/java_init.list"
          test -f "$ROOT/resources/META-INF/xposed/scope.list"
          test -f "$ROOT/resources/META-INF/xposed/module.prop"
          test ! -f "$ROOT/assets/xposed_init"
          grep -q 'extends XposedModule' "$HOOK"
          grep -q 'getSharedPreferences(' "$HOOK"
          grep -q 'XposedServiceHelper.registerListener' "$STORE"
          grep -q 'getRemotePreferences' "$STORE"
          ! grep -q 'NightCoreSettingsReceiver' "$ROOT/AndroidManifest.xml"
          ! grep -q 'xposedmodule' "$ROOT/AndroidManifest.xml"
          ! grep -q 'callerHasPackage(WHATSAPP_PACKAGE)' "$PROVIDER"
          ! grep -q 'callerHasPackage(INSTAGRAM_PACKAGE)' "$PROVIDER"
      - name: Build and lint Night Core
        working-directory: nightmods/nightcore
        run: gradle --no-daemon --stacktrace clean lintDebug assembleDebug
      - name: Verify Night Core APK
        shell: bash
        run: |
          APK="$(find nightmods/nightcore/app/build/outputs -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          AAPT="${ANDROID_SDK_ROOT}/build-tools/36.0.0/aapt"
          "$AAPT" dump badging "$APK" | tee /tmp/nightcore-badging.txt
          grep -q "package: name='dev.nightmods.core'" /tmp/nightcore-badging.txt
          grep -q "versionName='0.3.0'" /tmp/nightcore-badging.txt
          grep -q "application-label:'Night Core'" /tmp/nightcore-badging.txt
          unzip -p "$APK" META-INF/xposed/java_init.list | grep -qx 'dev.nightmods.core.hook.NightCoreHook'
          unzip -p "$APK" META-INF/xposed/module.prop | grep -qx 'minApiVersion=100'
          unzip -p "$APK" META-INF/xposed/module.prop | grep -qx 'targetApiVersion=100'
          unzip -p "$APK" META-INF/xposed/scope.list | grep -qx 'com.whatsapp'
          unzip -p "$APK" META-INF/xposed/scope.list | grep -qx 'com.instagram.android'
          ! unzip -l "$APK" | grep -q 'assets/xposed_init'
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml > /tmp/nightcore-manifest.txt
          grep -q 'dev.nightmods.core.settings' /tmp/nightcore-manifest.txt
          grep -q 'io.github.libxposed.service.XposedProvider' /tmp/nightcore-manifest.txt
          grep -q 'dev.nightmods.core.XposedService' /tmp/nightcore-manifest.txt
          ! grep -q 'NightCoreSettingsReceiver' /tmp/nightcore-manifest.txt
          sha256sum "$APK"
      - name: Verify target probe APK
        shell: bash
        run: |
          PROBE="$(find nightmods/nightcore/target-probe/build/outputs -type f -name '*.apk' -print -quit)"
          test -n "$PROBE"
          AAPT="${ANDROID_SDK_ROOT}/build-tools/36.0.0/aapt"
          "$AAPT" dump badging "$PROBE" | grep -q "package: name='com.whatsapp'"
      - name: Upload Night Core APK
        uses: actions/upload-artifact@v4
        with:
          name: Night-Core-debug-apk
          path: nightmods/nightcore/app/build/outputs/**/*.apk
          if-no-files-found: error
          retention-days: 3
      - name: Upload target probe APK
        uses: actions/upload-artifact@v4
        with:
          name: Night-Core-target-probe-apk
          path: nightmods/nightcore/target-probe/build/outputs/**/*.apk
          if-no-files-found: error
          retention-days: 3
      - name: Upload Night Core reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Night-Core-build-reports
          path: nightmods/nightcore/app/build/reports/**
          if-no-files-found: ignore
          retention-days: 1

  android16-smoke:
    name: Android 16 manager bridge smoke test
    needs:
      - build
      - nightcore-build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download Night Mods APK
        uses: actions/download-artifact@v4
        with:
          name: Night-Mods-debug-apk
          path: nightmods-apk
      - name: Download Night Core APK
        uses: actions/download-artifact@v4
        with:
          name: Night-Core-debug-apk
          path: nightcore-apk
      - name: Download target probe APK
        uses: actions/download-artifact@v4
        with:
          name: Night-Core-target-probe-apk
          path: target-probe-apk
      - name: Prepare smoke output
        run: mkdir -p smoke
      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          sudo chmod 666 /dev/kvm || true
      - name: Boot Android 16 and verify Night Mods manager bridge
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb wait-for-device
            test "$(adb shell getprop ro.build.version.sdk | tr -d '\r')" = "36"
            adb install -r "$(find nightmods-apk -type f -name '*.apk' -print -quit)"
            adb install -r "$(find nightcore-apk -type f -name '*.apk' -print -quit)"
            adb install -r "$(find target-probe-apk -type f -name '*.apk' -print -quit)"
            adb logcat -c

            adb shell am start -W -n org.lsposed.manager/.ui.activity.MainActivity | tee smoke/manager-start.txt
            sleep 4
            adb shell uiautomator dump /sdcard/nightmods.xml || true
            adb pull /sdcard/nightmods.xml smoke/nightmods.xml || true
            grep -q 'Night Core' smoke/nightmods.xml

            adb shell am force-stop org.lsposed.manager || true
            adb shell am start -W -a android.intent.action.VIEW -d 'lsposed://night-core/bubble-styler' -n org.lsposed.manager/.ui.activity.MainActivity | tee smoke/bubble-start.txt
            sleep 4
            adb shell uiautomator dump /sdcard/nightmods-bubble.xml || true
            adb pull /sdcard/nightmods-bubble.xml smoke/nightmods-bubble.xml || true
            grep -q 'Bubble Styler' smoke/nightmods-bubble.xml
            grep -q 'Night Core connected' smoke/nightmods-bubble.xml

            python3 -c "import re,xml.etree.ElementTree as ET; root=ET.parse('smoke/nightmods-bubble.xml').getroot(); node=next(n for n in root.iter('node') if n.attrib.get('resource-id','').endswith(':id/night_bubble_enabled')); x1,y1,x2,y2=map(int,re.findall(r'\\d+',node.attrib['bounds'])); print((x1+x2)//2,(y1+y2)//2)" > /tmp/night-bubble-tap.txt
            adb shell input tap $(cat /tmp/night-bubble-tap.txt)
            sleep 2
            adb shell run-as dev.nightmods.core cat shared_prefs/night_core.xml | tee smoke/night-core-local-mirror.xml
            grep -q 'name="bubble_enabled" value="false"' smoke/night-core-local-mirror.xml

            adb shell am force-stop com.whatsapp || true
            adb shell am start -W -n com.whatsapp/.MainActivity | tee smoke/target-start.txt
            sleep 1
            adb shell run-as com.whatsapp cat shared_prefs/night_core_probe.xml | tee smoke/target-result.xml
            grep -q 'name="access_denied" value="true"' smoke/target-result.xml
            grep -q 'name="settings_disclosed" value="false"' smoke/target-result.xml
            ! grep -q 'bubble_enabled' smoke/target-result.xml

            adb shell am force-stop dev.nightmods.core || true
            adb shell am start -W -n dev.nightmods.core/.MainActivity | tee smoke/nightcore-start.txt
            sleep 2
            adb shell pidof dev.nightmods.core | tee smoke/nightcore-process.txt
            test -s smoke/nightcore-process.txt
            adb exec-out screencap -p > smoke/nightcore-android16.png
            adb logcat -b crash -d > smoke/crash.txt || true
            test -z "$(grep -E 'org\.lsposed\.manager|dev\.nightmods\.core|com\.whatsapp' smoke/crash.txt || true)"
            echo 'Android 16 manager/local-mirror bridge passed; target provider access denied as designed.'
      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Night-Mods-Android16-smoke
          path: smoke/**
          if-no-files-found: warn
          retention-days: 1
