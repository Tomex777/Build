name: Mise Humanoid QA

on:
  push:
    branches: [artist-scene-studio-foundation]
    paths:
      - "artist-scene-studio/**"
      - ".github/workflows/mise-humanoid-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mise-humanoid-${{ github.ref }}
  cancel-in-progress: true

jobs:
  appearance-and-pose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        api: [26, 36]
    steps:
      - uses: actions/checkout@v4
      - name: Fetch verified assets
        run: artist-scene-studio/scripts/fetch-test-assets.sh
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Build application and instrumented test
        working-directory: artist-scene-studio
        run: gradle :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify appearance, posing, and reopening
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          working-directory: artist-scene-studio
          emulator-options: -no-window -gpu lavapipe -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: >-
            bash -c 'set +e;
            gradle :app:connectedDebugAndroidTest -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true -Pandroid.testInstrumentationRunnerArguments.class=studio.artistscene.app.HumanoidAppearanceTest --stacktrace > humanoid-test.log 2>&1;
            result=$?;
            mkdir -p humanoid-proof;
            adb shell screencap -p /sdcard/humanoid-final.png;
            adb pull /sdcard/humanoid-final.png humanoid-proof/final.png;
            for stage in before appearance posed; do adb pull "/sdcard/Android/data/studio.artistscene.app/files/humanoid-${stage}.png" "humanoid-proof/${stage}.png" || result=1; done;
            adb logcat -d -v threadtime > humanoid-proof/logcat.txt;
            adb shell uiautomator dump /sdcard/humanoid-window.xml;
            adb pull /sdcard/humanoid-window.xml humanoid-proof/window.xml;
            cat humanoid-test.log;
            exit "$result"'
      - name: Export seeded scene screenshot proof
        if: always()
        working-directory: artist-scene-studio
        run: |
          python3 - <<'PY'
          import base64
          from pathlib import Path
          for stage in ("before", "appearance", "posed"):
              path = Path("humanoid-proof") / (stage + ".png")
              if not path.is_file():
                  continue
              encoded = base64.b64encode(path.read_bytes()).decode("ascii")
              chunks = [encoded[i:i + 6000] for i in range(0, len(encoded), 6000)]
              for index, chunk in enumerate(chunks):
                  print(f"MISE_PNG|{stage}|{index}|{len(chunks)}|{chunk}")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mise-humanoid-api${{ matrix.api }}-proof
          path: |
            artist-scene-studio/humanoid-proof/
            artist-scene-studio/humanoid-test.log
            artist-scene-studio/app/build/reports/androidTests/connected/
            artist-scene-studio/app/build/outputs/androidTest-results/connected/
