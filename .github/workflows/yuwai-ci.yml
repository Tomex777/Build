name: YUWAI mobile-first audit

on:
  push:
    branches: [yuwai-ci-audit]
    paths:
      - 'yuwai/**'
      - '.github/workflows/yuwai-ci.yml'
  pull_request:
    paths:
      - 'yuwai/**'
      - '.github/workflows/yuwai-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium-mobile-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: yuwai
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Restore exact audited YUWAI source
        run: npm run restore

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Static/package verification
        run: npm run verify

      - name: Mobile Chromium end-to-end tests
        run: npm run test:e2e

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yuwai-browser-evidence
          path: |
            yuwai/playwright-report
            yuwai/test-results
          if-no-files-found: warn
          retention-days: 7
