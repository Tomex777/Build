name: Night Portfolio Asset Import

on:
  workflow_dispatch:
  push:
    branches:
      - night-portfolio-site
    paths:
      - .github/workflows/night-portfolio-assets.yml

permissions:
  contents: write
  actions: read

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout portfolio branch
        uses: actions/checkout@v4
        with:
          ref: night-portfolio-site
          fetch-depth: 0

      - name: Download verified screenshot artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/night-portfolio-assets
          mkdir -p /tmp/night-portfolio-assets/{mirrorchess,torri,slumber}
          gh api /repos/${GITHUB_REPOSITORY}/actions/artifacts/11050309804/zip > /tmp/mirrorchess.zip
          gh api /repos/${GITHUB_REPOSITORY}/actions/artifacts/11050784014/zip > /tmp/torri.zip
          gh api /repos/${GITHUB_REPOSITORY}/actions/artifacts/11054337157/zip > /tmp/slumber.zip
          unzip -q /tmp/mirrorchess.zip -d /tmp/night-portfolio-assets/mirrorchess
          unzip -q /tmp/torri.zip -d /tmp/night-portfolio-assets/torri
          unzip -q /tmp/slumber.zip -d /tmp/night-portfolio-assets/slumber

      - name: Curate portfolio assets
        run: |
          set -euo pipefail
          mkdir -p portfolio/assets

          cp /tmp/night-portfolio-assets/mirrorchess/mirrorchess-home.png portfolio/assets/mirrorchess-home.png
          cp /tmp/night-portfolio-assets/mirrorchess/mirrorchess-game.png portfolio/assets/mirrorchess-game.png
          cp /tmp/night-portfolio-assets/mirrorchess/mirrorchess-custom-pieces.png portfolio/assets/mirrorchess-custom-pieces.png
          cp /tmp/night-portfolio-assets/mirrorchess/mirrorchess-victory.png portfolio/assets/mirrorchess-victory.png

          cp /tmp/night-portfolio-assets/torri/release/release-01-library.png portfolio/assets/torri-library.png
          cp /tmp/night-portfolio-assets/torri/release/release-06-details.png portfolio/assets/torri-details.png
          cp /tmp/night-portfolio-assets/torri/release/release-07-reader.png portfolio/assets/torri-reader.png
          cp /tmp/night-portfolio-assets/torri/release/release-03-settings.png portfolio/assets/torri-settings.png

          cp /tmp/night-portfolio-assets/slumber/practice.png portfolio/assets/slumber-practice.png
          cp /tmp/night-portfolio-assets/slumber/piano.png portfolio/assets/slumber-piano.png
          cp /tmp/night-portfolio-assets/slumber/songs.png portfolio/assets/slumber-songs.png
          cp /tmp/night-portfolio-assets/slumber/settings-dark.png portfolio/assets/slumber-settings.png

          {
            echo "MirrorChess screenshots: workflow artifact 11050309804"
            echo "source run: 36603527516"
            echo "source branch: mirrorchess-sdk36-min26-20260922"
            echo "source SHA: ab28bb0361de95be2b389bdc820b0562d56316d7"
            echo
            echo "Torri screenshots: workflow artifact 11050784014"
            echo "source run: 36603507254"
            echo "source branch: torri-compile-runner-20260922"
            echo "source SHA: 9f5b25aa34b4a4907da450da46fd4b51486cc940"
            echo
            echo "Slumber screenshots: workflow artifact 11054337157"
            echo "source run: 36612087935"
            echo "source branch: slumber-087-build"
            echo "source SHA: 3a52537c5a0c8e1ba941081c3be5536c41818d83"
          } > portfolio/assets/PROVENANCE.txt

      - name: Commit curated assets
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add portfolio/assets
          if git diff --cached --quiet; then
            echo "Portfolio assets already current."
            exit 0
          fi
          git commit -m "assets(portfolio): import verified app screenshots"
          git push origin HEAD:night-portfolio-site
