name: AOD Android CI
on:
  push:
    branches: [aod-android-foundation]
    paths: ['aod-android/**', '.github/workflows/aod-android.yml', '.github/scripts/aod-*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: aod-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - name: Install SDK 36
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '9.6.0'}
      - name: Configure production signing if established
        env:
          KEY: ${{ secrets.AOD_RELEASE_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.AOD_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.AOD_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.AOD_RELEASE_KEY_PASSWORD }}
        run: |
          if [ -n "$KEY" ]; then
            printf '%s' "$KEY" | base64 -d > "$RUNNER_TEMP/aod-release.jks"
            echo "AOD_RELEASE_KEYSTORE=$RUNNER_TEMP/aod-release.jks" >> "$GITHUB_ENV"
            echo "AOD_RELEASE_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "AOD_RELEASE_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "AOD_RELEASE_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          fi
      - name: Configure explicit ephemeral QA identity
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/aod-qa.jks" -storepass android -alias androiddebugkey -keypass android -dname "CN=AOD CI QA,O=QA,C=NG" -keyalg RSA -keysize 2048 -validity 365
          echo "AOD_QA_KEYSTORE=$RUNNER_TEMP/aod-qa.jks" >> "$GITHUB_ENV"
      - name: Unit tests, lint and builds
        run: gradle -p aod-android :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest :app:assembleRelease :app:bundleRelease --stacktrace
      - name: Package minified QA release for install acceptance
        run: |
          mkdir -p aod-android/app/build/outputs/qa
          release=$(find aod-android/app/build/outputs/apk/release -name '*.apk' -print -quit)
          cp "$release" aod-android/app/build/outputs/qa/AOD-minified-QA.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign --ks "$AOD_QA_KEYSTORE" --ks-key-alias androiddebugkey --ks-pass pass:android --key-pass pass:android aod-android/app/build/outputs/qa/AOD-minified-QA.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs aod-android/app/build/outputs/qa/AOD-minified-QA.apk > aod-android/app/build/outputs/qa/QA-signing.txt
          echo "QA test key only. This is not a production-signed release." >> aod-android/app/build/outputs/qa/QA-signing.txt
          if [ -n "${AOD_RELEASE_KEYSTORE:-}" ]; then
            mkdir -p aod-android/app/build/outputs/production
            cp "$release" aod-android/app/build/outputs/production/AOD-production-universal.apk
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$release" > aod-android/app/build/outputs/production/certificate.txt
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aod-build-and-reports
          path: |
            aod-android/app/build/outputs/
            aod-android/app/build/reports/
            aod-android/app/build/test-results/
  acceptance:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - {api: 26, target: google_apis}
          - {api: 36, target: google_apis}
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with: {name: aod-build-and-reports, path: build-artifacts}
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install screenshot assertion dependency
        run: python3 -m pip install Pillow
      - uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          profile: pixel_2
          ram-size: 3072M
          cores: 2
          emulator-boot-timeout: 900
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          disable-animations: false
          disable-spellchecker: false
          script: bash .github/scripts/aod-acceptance.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aod-api${{ matrix.api }}-evidence
          path: aod-evidence/
