name: NIGHT One Piece Card Candidates

on:
  push:
    branches: [feature/cards-one-piece-20261020]
    paths:
      - 'cards/catalog/one-piece-sources.json'
      - 'cards/bin/seed-one-piece.mjs'
      - 'cards/bin/vercel-one-piece-preview.sh'
      - 'cards/src/**'
      - 'cards/renderer/**'
      - 'cards/tests/one-piece-sources.test.mjs'
      - '.github/workflows/cards-one-piece.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: night-cards-onepiece-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-and-render:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    defaults:
      run:
        working-directory: cards
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: cards/package-lock.json
      - run: npm ci
      - name: Pin real official One Piece source artwork (NO generated images)
        run: node bin/seed-one-piece.mjs --write-lock
      - name: Validate source, tier mapping, power, gallery and existing Bleach library
        run: npm test
      - name: Prepare exact reference browser dependencies
        run: npx playwright install-deps chromium
      - name: Install pinned card export browser
        run: |
          curl --fail --location --retry 3             https://storage.googleapis.com/chrome-for-testing-public/131.0.6778.204/linux64/chrome-headless-shell-linux64.zip             -o "$RUNNER_TEMP/night-chrome.zip"
          unzip -q "$RUNNER_TEMP/night-chrome.zip" -d "$RUNNER_TEMP/night-browser"
          chmod +x "$RUNNER_TEMP/night-browser/chrome-headless-shell-linux64/chrome-headless-shell"
          echo "NIGHT_BROWSER_PATH=$RUNNER_TEMP/night-browser/chrome-headless-shell-linux64/chrome-headless-shell" >> "$GITHUB_ENV"
      - name: Render One Piece actual shared NIGHT master card SVGs and PNGs
        run: npm run build -- --series one-piece --width 3000 --out dist/one-piece
      - name: Export standalone offline gallery using genuine NIGHT rendered art
        run: npm run gallery -- --series one-piece --out dist/one-piece --file dist/NIGHT-One-Piece-Collection.html
      - name: Commit locked provenance and real-rendered website preview
        if: success() && github.event_name == 'push'
        working-directory: .
        run: |
          git config user.name 'NIGHT Cards Provenance'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mkdir -p cards/previews/one-piece
          cp cards/dist/one-piece/index.html cards/previews/one-piece/index.html
          find cards/dist/one-piece -maxdepth 1 -type f \
            \( -name '*--view.jpg' -o -name '*--phone.png' \) \
            -exec cp {} cards/previews/one-piece/ \;
          git add cards/catalog/one-piece-source-lock.json cards/catalog/one-piece.json cards/catalog/power/one-piece.json
          git add cards/previews/one-piece
          if ! git diff --cached --quiet; then
            git commit -m "cards(one-piece): pin verified sources and real NIGHT-rendered gallery previews"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
      - name: Upload masters, mobile proofs, contact sheets and offline preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NIGHT-One-Piece-Candidate-Masters
          path: |
            cards/dist/one-piece/
            cards/dist/NIGHT-One-Piece-Collection.html
            cards/catalog/one-piece.json
            cards/catalog/power/one-piece.json
            cards/catalog/one-piece-source-lock.json
          if-no-files-found: warn
          compression-level: 0
          retention-days: 30
