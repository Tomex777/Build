name: Night Screenshot Pack

on:
  push:
    branches:
      - night-groq-key-pool-ci
    paths:
      - ".github/workflows/night-screenshot-pack.yml"
      - ".github/scripts/night-screenshot-pack.sh"
  workflow_dispatch:

concurrency:
  group: night-screenshot-pack-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reuse exact Night regression APK
        uses: actions/download-artifact@v4
        with:
          name: night-integrated-apk
          path: night-screenshot-apk
          run-id: 35686206684
          github-token: ${{ secrets.GITHUB_TOKEN }}


      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Capture Night screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: default
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          emulator-boot-timeout: 420
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-boot-anim -accel on -wipe-data
          script: bash .github/scripts/night-screenshot-pack.sh

      - name: Upload Night screenshot pack
        uses: actions/upload-artifact@v4
        with:
          name: night-every-screen-screenshots
          path: night-screenshots/
          if-no-files-found: error
