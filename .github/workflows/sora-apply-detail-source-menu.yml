name: Apply Sora Detail Source Menu Cleanup

on:
  push:
    branches: [sora-android-ci]
    paths:
      - 'sora-ci/apply-detail-source-menu.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sora-android-ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Move source switching into title menu
        run: python sora-ci/patch_detail_source_menu.py
      - name: Verify source controls are not duplicated
        run: |
          FILE=sora-overlay/app/src/main/java/com/night/sora/ui/screens/MediaDetailScreen.kt
          grep -q 'Text("Change source")' "$FILE"
          test "$(grep -c 'contentDescription = "Change source"\|"Change source")' "$FILE" || true)" -ge 1
          ! grep -q 'title = if (hasConsumptionSource) "Source"' "$FILE"
          ! grep -q 'IconButton(onClick = onSource)' "$FILE"
      - name: Commit cleanup
        run: |
          if git diff --quiet; then
            echo 'No source-menu cleanup needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sora-overlay/app/src/main/java/com/night/sora/ui/screens/MediaDetailScreen.kt
          git commit -m 'move Sora detail source switching into menu'
          git push origin HEAD:sora-android-ci
