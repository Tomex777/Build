name: Night Portfolio Preview

on:
  push:
    branches: [night-portfolio-site]
    paths:
      - 'portfolio/**'
      - '.github/workflows/night-portfolio-preview.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: night-portfolio-preview
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging source
        uses: actions/checkout@v4
        with:
          ref: night-portfolio-site

      - name: Add SPA fallback
        run: cp portfolio/index.html portfolio/404.html

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload portfolio preview
        uses: actions/upload-pages-artifact@v3
        with:
          path: portfolio

      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@v4
