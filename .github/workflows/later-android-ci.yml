name: Later Android CI

on:
  push:
    branches:
      - later-ci
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 37
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-37"

      - name: Restore Later source
        shell: bash
        run: |
          cat later-payload/part*.b64 | base64 --decode > /tmp/later.tar.xz
          echo "b4e73b8c08579a6deefce4444233610160977f783c95fe6050ed3e34dc3911ec  /tmp/later.tar.xz" | sha256sum -c -
          mkdir -p later
          tar -xJf /tmp/later.tar.xz -C later
          test -f later/settings.gradle.kts
          test -f later/app/build.gradle.kts

      - name: Verify Gradle
        working-directory: later
        run: gradle --version

      - name: Build Later
        working-directory: later
        run: gradle --no-daemon --stacktrace clean testDebugUnitTest lintDebug assembleDebug

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Later-debug-apk
          path: later/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Later-build-reports
          path: |
            later/app/build/reports/**
            later/app/build/outputs/logs/**
          if-no-files-found: ignore
