name: Mira Android

on:
  push:
    branches: ["mira/**"]
    paths:
      - "apps/mira/**"
      - ".github/workflows/mira-android.yml"
  pull_request:
    paths:
      - "apps/mira/**"
      - ".github/workflows/mira-android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mira-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Build Mira and instrumentation
        working-directory: apps/mira
        run: gradle --no-daemon --console=plain :core:source-runtime:test :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Prepare ARM64 APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/mira
          cp apps/mira/app/build/outputs/apk/debug/app-arm64-v8a-debug.apk dist/mira/mira-arm64-v8a-debug.apk
          test -s dist/mira/mira-arm64-v8a-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: mira-arm64-v8a-debug
          path: dist/mira/mira-arm64-v8a-debug.apk
          if-no-files-found: error

  api-26-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install API 26 image
        run: sdkmanager "emulator" "platforms;android-26" "platforms;android-36" "build-tools;35.0.0" "system-images;android-26;default;x86_64"
      - name: Build API 26 APKs
        working-directory: apps/mira
        run: gradle --no-daemon --console=plain :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Run minSdk 26 smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 26
          target: default
          arch: x86_64
          emulator-boot-timeout: 900
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 2560 -cores 2
          disable-animations: true
          script: >-
            bash -euo pipefail -c 'adb install -r apps/mira/app/build/outputs/apk/debug/app-x86_64-debug.apk; adb install -r apps/mira/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk; timeout 30s adb shell am start -W -n app.mira.android/.MainActivity; sleep 5; test -n "$(adb shell pidof app.mira.android || true)"; output=$(timeout 300s adb shell am instrument -w -r -e class app.mira.android.MinSdk26SmokeTest app.mira.android.test/androidx.test.runner.AndroidJUnitRunner 2>&1); printf "%s\n" "$output"; echo "$output" | grep -Eq "OK .+ tests?"'

  api-36-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install API 36 image
        run: sdkmanager "emulator" "platforms;android-36" "build-tools;35.0.0" "system-images;android-36;aosp_atd;x86_64"
      - name: Build API 36 APKs
        working-directory: apps/mira
        run: gradle --no-daemon --console=plain :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Run Android 16 smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: aosp_atd
          arch: x86_64
          emulator-boot-timeout: 900
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 2560 -cores 2
          disable-animations: true
          script: >-
            bash -euo pipefail -c 'adb install -r apps/mira/app/build/outputs/apk/debug/app-x86_64-debug.apk; adb install -r apps/mira/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk; timeout 30s adb shell am start -W -n app.mira.android/.MainActivity; sleep 5; test -n "$(adb shell pidof app.mira.android || true)"; output=$(timeout 300s adb shell am instrument -w -r -e class app.mira.android.Api36SmokeTest app.mira.android.test/androidx.test.runner.AndroidJUnitRunner 2>&1); printf "%s\n" "$output"; echo "$output" | grep -Eq "OK .+ tests?"'

  real-source-and-download-smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install API 30 image
        run: sdkmanager "emulator" "platforms;android-30" "platforms;android-36" "build-tools;35.0.0" "system-images;android-30;default;x86_64"
      - name: Build source smoke APKs
        working-directory: apps/mira
        run: gradle --no-daemon --console=plain :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Run real source and downloader smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          emulator-boot-timeout: 900
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 3072 -cores 2
          disable-animations: true
          script: >-
            bash -euo pipefail -c 'adb install -r apps/mira/app/build/outputs/apk/debug/app-x86_64-debug.apk; adb install -r apps/mira/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk; timeout 30s adb shell am start -W -n app.mira.android/.MainActivity; sleep 5; test -n "$(adb shell pidof app.mira.android || true)"; source_output=$(timeout 600s adb shell am instrument -w -r -e class app.mira.android.RealSourceSmokeTest app.mira.android.test/androidx.test.runner.AndroidJUnitRunner 2>&1); printf "%s\n" "$source_output" | tee "$GITHUB_WORKSPACE/mira-real-source.txt"; echo "$source_output" | grep -Eq "OK .+ tests?"; download_output=$(timeout 300s adb shell am instrument -w -r -e class app.mira.android.DownloadEngineSmokeTest app.mira.android.test/androidx.test.runner.AndroidJUnitRunner 2>&1); printf "%s\n" "$download_output" | tee "$GITHUB_WORKSPACE/mira-download-engine.txt"; echo "$download_output" | grep -Eq "OK .+ tests?"'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mira-real-source-download-evidence
          path: |
            mira-real-source.txt
            mira-download-engine.txt
          if-no-files-found: ignore
