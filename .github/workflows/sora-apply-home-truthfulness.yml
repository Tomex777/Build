name: Apply Sora Home Truthfulness

on:
  push:
    branches: [sora-android-ci]
    paths:
      - 'sora-ci/home-truthfulness-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sora-android-ci
      - name: Apply Home truthfulness cleanup
        run: python3 sora-ci/apply-home-truthfulness.py
      - name: Verify truthful Home
        run: |
          grep -q 'listeningSignals: List<ListeningSignal>' sora-overlay/app/src/main/java/com/night/sora/ui/screens/HomeScreen.kt
          grep -q 'From your actual listening history' sora-overlay/app/src/main/java/com/night/sora/ui/screens/HomeScreen.kt
          grep -q 'HomeSectionHeader("Explore"' sora-overlay/app/src/main/java/com/night/sora/ui/screens/HomeScreen.kt
          grep -q 'Open Bible to read in context' sora-overlay/app/src/main/java/com/night/sora/ui/screens/HomeScreen.kt
          ! grep -q 'Last read · John' sora-overlay/app/src/main/java/com/night/sora/ui/screens/HomeScreen.kt
          ! grep -q '♡ Save' sora-overlay/app/src/main/java/com/night/sora/ui/screens/HomeScreen.kt
          ! grep -q 'Less like this' sora-overlay/app/src/main/java/com/night/sora/ui/screens/HomeScreen.kt
      - name: Commit Home cleanup
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add sora-overlay/app/src/main/java/com/night/sora/ui/screens/HomeScreen.kt \
                  sora-overlay/app/src/main/java/com/night/sora/ui/SoraApp.kt
          git diff --cached --quiet && exit 0
          git commit -m 'remove fake Home history and dead actions'
          git push origin HEAD:sora-android-ci
