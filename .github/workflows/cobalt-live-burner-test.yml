name: Cobalt Live Burner Test

on:
  push:
    branches:
      - cobalt-android-poc
    paths:
      - "live-test/start-trigger.txt"

permissions:
  contents: write
  actions: read

jobs:
  live-burner-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      TEST_BRANCH: cobalt-android-poc

    steps:
      - name: Checkout test branch
        uses: actions/checkout@v4
        with:
          ref: cobalt-android-poc
          fetch-depth: 0

      - name: Prepare encrypted session relay
        shell: bash
        run: |
          set -euo pipefail
          SESSION_ID="$(tr -cd 'A-Za-z0-9_-' < live-test/start-trigger.txt | head -c 64)"
          test -n "$SESSION_ID"
          echo "SESSION_ID=$SESSION_ID" >> "$GITHUB_ENV"

          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out /tmp/runner_private.pem >/dev/null 2>&1
          openssl rsa -pubout -in /tmp/runner_private.pem -out "live-test/${SESSION_ID}.runner-public.pem" >/dev/null 2>&1

          git config user.name "cobalt-live-test"
          git config user.email "cobalt-live-test@users.noreply.github.com"
          git add "live-test/${SESSION_ID}.runner-public.pem"
          git commit -m "Publish live test runner key ${SESSION_ID}"
          git push origin HEAD:"$TEST_BRANCH"

      - name: Download live-harness APK
        shell: bash
        run: |
          set -euo pipefail
          RUN_ID="$(gh run list --workflow "Cobalt Android POC" --branch "$TEST_BRANCH" --status success --limit 20 --json databaseId,headSha --jq '.[] | select(.headSha=="93d69b0ccc371451e9b84d9930fae5c4fd1bf9bc") | .databaseId' | head -n 1)"
          test -n "$RUN_ID"
          mkdir -p downloaded-apk
          gh run download "$RUN_ID" --name cobalt-android-baseline --dir downloaded-apk
          APK="$(find downloaded-apk -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          echo "COBALT_APK=$APK" >> "$GITHUB_ENV"

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Run real encrypted receive/reply test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set -euo pipefail

            publish_one() {
              local path="$1"
              local msg="$2"
              for attempt in 1 2 3 4 5; do
                git pull --rebase origin "$TEST_BRANCH" || { git rebase --abort || true; sleep 2; continue; }
                git add "$path"
                git commit -m "$msg" || true
                if git push origin HEAD:"$TEST_BRANCH"; then
                  return 0
                fi
                sleep 2
              done
              return 1
            }

            PHONE_PATH="live-test/${SESSION_ID}.phone.enc.b64"
            for _ in $(seq 1 300); do
              git fetch origin "$TEST_BRANCH" >/dev/null 2>&1 || true
              if git show "origin/$TEST_BRANCH:$PHONE_PATH" > /tmp/phone.b64 2>/dev/null; then
                break
              fi
              sleep 2
            done
            test -s /tmp/phone.b64

            base64 -d /tmp/phone.b64 > /tmp/phone.enc
            openssl pkeyutl -decrypt -inkey /tmp/runner_private.pem -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -in /tmp/phone.enc -out /tmp/phone.txt
            PHONE="$(tr -cd '0-9' < /tmp/phone.txt)"
            [[ "$PHONE" =~ ^[0-9]{8,15}$ ]]
            rm -f /tmp/phone.b64 /tmp/phone.enc /tmp/phone.txt

            adb install -r "$COBALT_APK" >/dev/null
            adb logcat -c || true
            adb shell am start -W -n com.tomex.cobaltandroid/.MainActivity --es live_phone "$PHONE" --es live_reply "Got your message - Cobalt Android receive/reply test passed." >/dev/null
            unset PHONE

            CODE=""
            for _ in $(seq 1 120); do
              adb shell uiautomator dump /sdcard/cobalt-live.xml >/dev/null 2>&1 || true
              adb pull /sdcard/cobalt-live.xml /tmp/cobalt-live.xml >/dev/null 2>&1 || true
              if [[ -s /tmp/cobalt-live.xml ]]; then
                CODE="$(python3 -c 'import re,xml.etree.ElementTree as E; r=E.parse("/tmp/cobalt-live.xml").getroot(); vals=[(n.attrib.get("text") or "").strip().replace(" ","").replace("-","") for n in r.iter("node")]; print(next((v for v in vals if re.fullmatch(r"[A-Za-z0-9]{8}",v) and v!="LINKED"),""))' 2>/dev/null || true)"
              fi
              [[ -n "$CODE" ]] && break
              sleep 2
            done
            test -n "$CODE"

            printf '%s' "$CODE" | openssl pkeyutl -encrypt -pubin -inkey live-test/assistant_public.pem -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -out /tmp/code.enc
            base64 -w0 /tmp/code.enc > "live-test/${SESSION_ID}.code.enc.b64"
            unset CODE
            rm -f /tmp/code.enc /tmp/cobalt-live.xml
            publish_one "live-test/${SESSION_ID}.code.enc.b64" "Publish encrypted pairing code ${SESSION_ID}"

            DONE=0
            for _ in $(seq 1 450); do
              LOG="$(adb logcat -d -s CobaltPOC:I CobaltPOC:E 2>/dev/null || true)"
              if grep -q 'LIVE_TEST_DONE' <<<"$LOG"; then
                DONE=1
                break
              fi
              if grep -q 'LIVE_TEST_REPLY_FAILED' <<<"$LOG"; then
                break
              fi
              sleep 2
            done

            if [[ "$DONE" = "1" ]]; then
              printf 'passed\n' > "live-test/${SESSION_ID}.status.txt"
              publish_one "live-test/${SESSION_ID}.status.txt" "Record successful live test ${SESSION_ID}"
              exit 0
            fi

            printf 'failed\n' > "live-test/${SESSION_ID}.status.txt"
            publish_one "live-test/${SESSION_ID}.status.txt" "Record failed live test ${SESSION_ID}"
            exit 1
