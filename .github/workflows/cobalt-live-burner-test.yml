name: Cobalt Live Burner Test

on:
  push:
    branches:
      - cobalt-android-poc
    paths:
      - "live-test/start-trigger.txt"

permissions:
  contents: write
  actions: read

jobs:
  live-burner-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      TEST_BRANCH: cobalt-android-poc

    steps:
      - name: Checkout test branch
        uses: actions/checkout@v4
        with:
          ref: cobalt-android-poc
          fetch-depth: 0

      - name: Prepare encrypted session relay
        shell: bash
        run: |
          set -euo pipefail
          SESSION_ID="$(tr -cd 'A-Za-z0-9_-' < live-test/start-trigger.txt | head -c 64)"
          test -n "$SESSION_ID"
          echo "SESSION_ID=$SESSION_ID" >> "$GITHUB_ENV"

          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out /tmp/runner_private.pem >/dev/null 2>&1
          openssl rsa -pubout -in /tmp/runner_private.pem -out "live-test/${SESSION_ID}.runner-public.pem" >/dev/null 2>&1

          git config user.name "cobalt-live-test"
          git config user.email "cobalt-live-test@users.noreply.github.com"
          git add "live-test/${SESSION_ID}.runner-public.pem"
          git commit -m "Publish live test runner key ${SESSION_ID}"
          git push origin HEAD:"$TEST_BRANCH"

      - name: Download live-harness APK
        shell: bash
        run: |
          set -euo pipefail
          RUN_ID="$(gh run list --workflow "Cobalt Android POC" --branch "$TEST_BRANCH" --status success --limit 20 --json databaseId,headSha --jq '.[] | select(.headSha=="93d69b0ccc371451e9b84d9930fae5c4fd1bf9bc") | .databaseId' | head -n 1)"
          test -n "$RUN_ID"
          mkdir -p downloaded-apk
          gh run download "$RUN_ID" --name cobalt-android-baseline --dir downloaded-apk
          APK="$(find downloaded-apk -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          echo "COBALT_APK=$APK" >> "$GITHUB_ENV"

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Run real encrypted receive/reply test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash live-test/run-live.sh
