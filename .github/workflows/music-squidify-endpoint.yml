name: Squidify Endpoint Extractor

on:
  push:
    branches:
      - music-source-probes-20260930
    paths:
      - ".github/workflows/music-squidify-endpoint.yml"
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Extract and probe Squidify server endpoint
        shell: bash
        run: |
          python3 - <<'PY'
          import collections, html, json, re, urllib.parse, urllib.request, urllib.error
          ORIGIN="https://www.squidify.org"
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36"

          def get(url,max_bytes=5000000,headers=None,method="GET",data=None):
              h={"User-Agent":UA,"Accept":"*/*"}
              if headers:h.update(headers)
              try:
                  with urllib.request.urlopen(urllib.request.Request(url,headers=h,method=method,data=data),timeout=25) as r:
                      b=r.read(max_bytes)
                      return {"ok":True,"status":getattr(r,"status",200),"url":r.geturl(),"ct":r.headers.get("Content-Type"),
                              "cl":r.headers.get("Content-Length"),"cr":r.headers.get("Content-Range"),"body":b}
              except urllib.error.HTTPError as e:
                  return {"ok":False,"status":e.code,"url":url,"ct":e.headers.get("Content-Type") if e.headers else None,
                          "body":e.read(12000),"error":str(e)}
              except Exception as e:
                  return {"ok":False,"status":None,"url":url,"body":b"","error":repr(e)}

          def js_assets(txt,base):
              out=[]
              for pat in [
                  r'<(?:script|link)[^>]+(?:src|href)=["\x27]([^"\x27]+\.js[^"\x27]*)',
                  r'import\(["\x27]([^"\x27]+\.js[^"\x27]*)["\x27]\)',
                  r'from\s*["\x27]([^"\x27]+\.js[^"\x27]*)["\x27]',
              ]:
                  for x in re.findall(pat,txt,re.I):
                      u=urllib.parse.urljoin(base,html.unescape(x))
                      if urllib.parse.urlparse(u).netloc==urllib.parse.urlparse(ORIGIN).netloc and u not in out:
                          out.append(u)
              return out

          root=get(ORIGIN+"/")
          q=collections.deque(js_assets(root["body"].decode("utf-8","replace"),root["url"]))
          seen=set(); chunks=[]
          while q and len(seen)<160:
              u=q.popleft()
              if u in seen:continue
              seen.add(u)
              r=get(u)
              if not r.get("ok"):continue
              t=r["body"].decode("utf-8","replace")
              chunks.append((u,t))
              for d in js_assets(t,r["url"]):
                  if d not in seen:q.append(d)

          target=None
          for u,t in chunks:
              if "/rest/stream?" in t and "subsonic-response" in t:
                  target=(u,t);break

          report={"chunk_count":len(chunks),"target_chunk":target[0] if target else None}
          if not target:
              open("squidify-endpoint-report.json","w").write(json.dumps(report,indent=2))
              print(json.dumps(report,indent=2))
              raise SystemExit(0)

          u,t=target
          marker=t.find("/rest/stream?")
          structural=t[max(0,marker-5000):marker+3500]
          structural=re.sub(r'(?i)(password|passwd|token|secret)(["\x27:=,\s]+)[^,;}]{1,180}',r'\1\2<redacted>',structural)
          structural=re.sub(r'(?i)(username)(["\x27:=,\s]+)[^,;}]{1,180}',r'\1\2<redacted>',structural)
          report["structural_snippet"]=re.sub(r'\s+',' ',structural)[:8000]

          bases=[]
          for x in re.findall(r'https?://[A-Za-z0-9._:-]+',t):
              if x not in bases and all(k not in x for k in ("svelte.dev","lrclib.net","w3.org","give.calibour.com")):
                  bases.append(x)
          candidates=[ORIGIN]+bases
          report["candidate_bases"]=candidates

          def safe(r):
              z={k:v for k,v in r.items() if k!="body"}
              z["preview"]=r.get("body",b"")[:300].decode("utf-8","replace")
              return z

          report["anonymous_probes"]={}
          for base in candidates[:12]:
              probes={}
              for path in ["/auth/login","/rest/ping.view?f=json&v=1.16.1&c=lyra","/rest/search3.view?query=zelda&f=json&v=1.16.1&c=lyra"]:
                  method="POST" if path=="/auth/login" else "GET"
                  data=b'{"username":"","password":""}' if method=="POST" else None
                  headers={"Content-Type":"application/json"} if method=="POST" else None
                  probes[path]=safe(get(base.rstrip("/")+path,max_bytes=20000,headers=headers,method=method,data=data))
              report["anonymous_probes"][base]=probes

          report["embedded_auth_indicators"]=[]
          for label,pat in [
              ("username",r'username\s*[:=]\s*["\x27]([^"\x27]{1,120})'),
              ("password",r'password\s*[:=]\s*["\x27]([^"\x27]{1,120})'),
          ]:
              for val in re.findall(pat,t,re.I):
                  report["embedded_auth_indicators"].append({"kind":label,"length":len(val)})

          open("squidify-endpoint-report.json","w").write(json.dumps(report,indent=2))
          print("# Squidify endpoint extractor")
          print("- target_chunk:",report["target_chunk"])
          print("- candidate_bases:",json.dumps(report["candidate_bases"]))
          print("- embedded_auth_indicators:",json.dumps(report["embedded_auth_indicators"]))
          for base,p in report["anonymous_probes"].items():
              print("- base:",base)
              for path,x in p.items():
                  print("  ",path,"status=",x.get("status"),"ct=",x.get("ct"),"preview=",x.get("preview","")[:180].replace("\n"," "))
          print("- structural:",report["structural_snippet"][:7000])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: squidify-endpoint-report
          path: squidify-endpoint-report.json
