name: Cubic Signing Bootstrap

on:
  push:
    branches: [cubic-android-ci]
    paths:
      - '.github/workflows/cubic-signing-bootstrap.yml'

concurrency:
  group: cubic-signing-bootstrap
  cancel-in-progress: false

jobs:
  generate-and-sign:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'

      - name: Test, lint and build unsigned production APK
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace -p cubic-android             :app:testDebugUnitTest             :app:lintRelease             :app:assembleRelease

      - name: Generate first permanent Cubic signing identity
        id: signing
        run: |
          set -euo pipefail
          umask 077

          OUT="cubic-android/build/signing-bootstrap"
          mkdir -p "$OUT"

          KEYSTORE="$RUNNER_TEMP/cubic-production-release.jks"
          ALIAS="cubic-release"
          STORE_PASSWORD="$(openssl rand -hex 32)"
          KEY_PASSWORD="$(openssl rand -hex 32)"

          keytool -genkeypair             -noprompt             -storetype JKS             -keystore "$KEYSTORE"             -storepass "$STORE_PASSWORD"             -keypass "$KEY_PASSWORD"             -alias "$ALIAS"             -keyalg RSA             -keysize 4096             -validity 10000             -dname "CN=Cubic Android Release, OU=Android, O=Cubic"

          cp "$KEYSTORE" "$OUT/Cubic-production-release.jks"

          keytool -list -v             -keystore "$KEYSTORE"             -storepass "$STORE_PASSWORD"             -alias "$ALIAS"             > "$OUT/CERTIFICATE_DETAILS.txt"

          KEYSTORE_B64="$(base64 -w 0 "$KEYSTORE")"

          {
            echo "CUBIC_RELEASE_KEY_ALIAS=$ALIAS"
            echo "CUBIC_RELEASE_KEYSTORE_PASSWORD=$STORE_PASSWORD"
            echo "CUBIC_RELEASE_KEY_PASSWORD=$KEY_PASSWORD"
            echo "CUBIC_RELEASE_KEYSTORE_B64=$KEYSTORE_B64"
          } > "$OUT/GITHUB_ACTIONS_SECRETS.txt"

          cat > "$OUT/KEEP_SAFE_README.txt" <<'EOF'
          CUBIC PRODUCTION SIGNING BACKUP — KEEP SAFE

          This keystore is the permanent signing identity for Cubic 1.x direct APK releases.
          Do not commit it to any repository and do not publish this backup artifact.

          Keep both:
          - Cubic-production-release.jks
          - GITHUB_ACTIONS_SECRETS.txt

          Configure the four values from GITHUB_ACTIONS_SECRETS.txt as private
          repository Actions secrets in Tomex777/Build for future Cubic updates.

          Losing this signing identity prevents future APK updates from installing
          over the public Cubic release signed with this key.
          EOF

          chmod 600             "$OUT/Cubic-production-release.jks"             "$OUT/GITHUB_ACTIONS_SECRETS.txt"             "$OUT/CERTIFICATE_DETAILS.txt"             "$OUT/KEEP_SAFE_README.txt"

          sha256sum "$OUT/Cubic-production-release.jks"             > "$OUT/SIGNING_BACKUP_SHA256.txt"

          echo "keystore=$KEYSTORE" >> "$GITHUB_OUTPUT"
          echo "alias=$ALIAS" >> "$GITHUB_OUTPUT"

          echo "::add-mask::$STORE_PASSWORD"
          echo "::add-mask::$KEY_PASSWORD"
          echo "store_password=$STORE_PASSWORD" >> "$GITHUB_OUTPUT"
          echo "key_password=$KEY_PASSWORD" >> "$GITHUB_OUTPUT"

      - name: Sign and verify Cubic 1.0.0
        env:
          KEYSTORE: ${{ steps.signing.outputs.keystore }}
          KEY_ALIAS: ${{ steps.signing.outputs.alias }}
          STORE_PASSWORD: ${{ steps.signing.outputs.store_password }}
          KEY_PASSWORD: ${{ steps.signing.outputs.key_password }}
        run: |
          set -euo pipefail

          OUT="cubic-android/build/signing-bootstrap"
          BUILD_TOOLS="$ANDROID_SDK_ROOT/build-tools/36.0.0"
          UNSIGNED="cubic-android/app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED="$RUNNER_TEMP/Cubic-1.0.0-aligned.apk"
          FINAL="$OUT/Cubic-universal-release.apk"

          "$BUILD_TOOLS/zipalign" -f 4 "$UNSIGNED" "$ALIGNED"

          "$BUILD_TOOLS/apksigner" sign             --ks "$KEYSTORE"             --ks-key-alias "$KEY_ALIAS"             --ks-pass env:STORE_PASSWORD             --key-pass env:KEY_PASSWORD             --out "$FINAL"             "$ALIGNED"

          "$BUILD_TOOLS/apksigner" verify             --verbose             --print-certs             "$FINAL" > "$OUT/PRODUCTION_SIGNATURE.txt"

          "$BUILD_TOOLS/zipalign" -c -v 4 "$FINAL"             > "$OUT/ZIPALIGN_VERIFY.txt"

          "$BUILD_TOOLS/aapt" dump badging "$FINAL"             > "$OUT/release-badging.txt"

          grep -q "package: name='com.tomex777.cubic'" "$OUT/release-badging.txt"
          grep -q "versionCode='1'" "$OUT/release-badging.txt"
          grep -q "versionName='1.0.0'" "$OUT/release-badging.txt"
          grep -q "sdkVersion:'26'" "$OUT/release-badging.txt"
          grep -q "targetSdkVersion:'36'" "$OUT/release-badging.txt"

          unzip -l "$FINAL" > "$OUT/release-contents.txt"
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            grep -q "lib/$abi/" "$OUT/release-contents.txt" || {
              echo "Missing ABI: $abi" >&2
              exit 1
            }
          done

          sha256sum "$FINAL" > "$OUT/PRODUCTION_APK_SHA256.txt"

          {
            echo "app=Cubic"
            echo "versionName=1.0.0"
            echo "versionCode=1"
            echo "minSdk=26"
            echo "targetSdk=36"
            echo "abis=arm64-v8a,armeabi-v7a,x86,x86_64"
            echo "productionSigned=true"
            echo "artifact=Cubic-universal-release.apk"
            echo "signingIdentity=bootstrap permanent Cubic release key"
          } > "$OUT/RELEASE_STATUS.txt"

      - name: Upload private signing backup
        uses: actions/upload-artifact@v4
        with:
          name: Cubic-production-signing-backup-KEEP-SAFE
          path: |
            cubic-android/build/signing-bootstrap/Cubic-production-release.jks
            cubic-android/build/signing-bootstrap/GITHUB_ACTIONS_SECRETS.txt
            cubic-android/build/signing-bootstrap/CERTIFICATE_DETAILS.txt
            cubic-android/build/signing-bootstrap/KEEP_SAFE_README.txt
            cubic-android/build/signing-bootstrap/SIGNING_BACKUP_SHA256.txt
          if-no-files-found: error
          retention-days: 90

      - name: Upload signed runtime APK
        uses: actions/upload-artifact@v4
        with:
          name: cubic-bootstrap-production-runtime
          path: cubic-android/build/signing-bootstrap/Cubic-universal-release.apk
          if-no-files-found: error
          retention-days: 90

      - name: Upload signing evidence
        uses: actions/upload-artifact@v4
        with:
          name: cubic-bootstrap-signing-evidence
          path: |
            cubic-android/build/signing-bootstrap/PRODUCTION_SIGNATURE.txt
            cubic-android/build/signing-bootstrap/ZIPALIGN_VERIFY.txt
            cubic-android/build/signing-bootstrap/release-badging.txt
            cubic-android/build/signing-bootstrap/release-contents.txt
            cubic-android/build/signing-bootstrap/PRODUCTION_APK_SHA256.txt
            cubic-android/build/signing-bootstrap/RELEASE_STATUS.txt
          if-no-files-found: error
          retention-days: 90

  runtime-api26:
    needs: generate-and-sign
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - uses: actions/download-artifact@v4
        with:
          name: cubic-bootstrap-production-runtime
          path: /tmp/cubic-production

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: API 26 production-signed runtime proof
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 26
          target: google_apis
          arch: x86_64
          profile: pixel_2
          script: CUBIC_APK=/tmp/cubic-production/Cubic-universal-release.apk CUBIC_EXTENDED=0 bash cubic-android/ci/run-emulator-tests.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cubic-bootstrap-api26-screenshots
          path: cubic-android/build/emulator-screenshots/
          if-no-files-found: error
          retention-days: 90

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cubic-bootstrap-api26-runtime-report
          path: cubic-android/build/ci-report/
          if-no-files-found: error
          retention-days: 90

  runtime-api36:
    needs: generate-and-sign
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - uses: actions/download-artifact@v4
        with:
          name: cubic-bootstrap-production-runtime
          path: /tmp/cubic-production

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: API 36 full production-signed runtime proof
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          script: CUBIC_APK=/tmp/cubic-production/Cubic-universal-release.apk CUBIC_EXTENDED=1 bash cubic-android/ci/run-emulator-tests.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cubic-bootstrap-api36-screenshots
          path: cubic-android/build/emulator-screenshots/
          if-no-files-found: error
          retention-days: 90

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cubic-bootstrap-api36-runtime-report
          path: cubic-android/build/ci-report/
          if-no-files-found: error
          retention-days: 90

  finalize:
    needs:
      - generate-and-sign
      - runtime-api26
      - runtime-api36
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cubic-bootstrap-production-runtime
          path: /tmp/cubic-final

      - uses: actions/download-artifact@v4
        with:
          name: cubic-bootstrap-signing-evidence
          path: /tmp/cubic-final

      - name: Publish validated production-signed Cubic APK
        uses: actions/upload-artifact@v4
        with:
          name: Cubic-universal-release-PRODUCTION-SIGNED-VALIDATED
          path: /tmp/cubic-final/
          if-no-files-found: error
          retention-days: 90
