name: MSCC TheNkiri live proof

on:
  pull_request:
    branches: [mscc-azure]
    paths:
      - 'mscc/providers/thenkiri.js'
      - 'mscc/sources/movies/thenkiri.js'
      - 'mscc/sources/tv/thenkiri.js'
      - 'mscc/thenkiri-live-probe.js'
      - '.github/workflows/mscc-thenkiri-live.yml'
  push:
    branches: [mscc-azure]
    paths:
      - 'mscc/providers/thenkiri.js'
      - 'mscc/sources/movies/thenkiri.js'
      - 'mscc/sources/tv/thenkiri.js'
      - 'mscc/thenkiri-live-probe.js'
      - '.github/workflows/mscc-thenkiri-live.yml'
  workflow_dispatch:

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Install FFmpeg for live playable-stream verification
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg
          command -v ffprobe
      - name: Install MSCC dependencies
        working-directory: mscc
        run: npm install --no-audit --no-fund
      - name: Probe live TheNkiri catalog and playable media
        working-directory: mscc
        run: node thenkiri-live-probe.js
