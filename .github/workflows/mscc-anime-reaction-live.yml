name: NIGHT Anime Reaction Live Probe
on:
  pull_request:
    branches: [mscc-azure]
    paths:
      - 'mscc/anime-reaction-live-probe.js'
      - 'mscc/anime-reaction-stickers.js'
      - 'mscc/anime-reaction-selftest.js'
      - 'mscc/anime-reaction-failover-selftest.js'
      - 'mscc/anime-reaction-provider-live-probe.js'
      - 'mscc/utils/anime-reaction-providers.js'
      - 'mscc/commands/anime/**'
      - '.github/workflows/mscc-anime-reaction-live.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Install dependencies
        working-directory: mscc
        run: npm install --no-audit --no-fund
      - name: Install FFmpeg for animated WebP conversions
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -n 1
      - name: Verify real source failover for representative reaction categories and animated WebP
        working-directory: mscc
        run: node anime-reaction-provider-live-probe.js
