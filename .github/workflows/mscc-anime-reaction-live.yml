name: NIGHT Anime Reaction Live Probe
on:
  pull_request:
    branches: [mscc-azure]
    paths:
      - 'mscc/anime-reaction-live-probe.js'
      - 'mscc/anime-reactions*'
      - 'mscc/commands/anime/**'
      - '.github/workflows/mscc-anime-reaction-live.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Install dependencies
        working-directory: mscc
        run: npm install --no-audit --no-fund
      - name: Check FFmpeg availability
        run: ffmpeg -version | head -n 1
      - name: Live-check all anime categories, download GIF bytes and test stickers
        working-directory: mscc
        run: node anime-reaction-live-probe.js
