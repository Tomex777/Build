name: Homira Production Release

on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      HOMIRA_KEYSTORE_BASE64: ${{ secrets.HOMIRA_KEYSTORE_BASE64 }}
      HOMIRA_KEYSTORE_PASSWORD: ${{ secrets.HOMIRA_KEYSTORE_PASSWORD }}
      HOMIRA_KEY_ALIAS: ${{ secrets.HOMIRA_KEY_ALIAS }}
      HOMIRA_KEY_PASSWORD: ${{ secrets.HOMIRA_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Verify production signing configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HOMIRA_KEYSTORE_BASE64"
          test -n "$HOMIRA_KEYSTORE_PASSWORD"
          test -n "$HOMIRA_KEY_ALIAS"
          test -n "$HOMIRA_KEY_PASSWORD"
          printf '%s' "$HOMIRA_KEYSTORE_BASE64" | base64 -d > /tmp/homira-production.jks

      - name: Build unsigned production release
        working-directory: homira-android
        run: gradle :app:assembleRelease :app:bundleRelease :app:lintRelease --stacktrace

      - name: Confirm release is non-debuggable
        run: |
          APK=homira-android/app/build/outputs/apk/release/app-release-unsigned.apk
          test -f "$APK"
          aapt dump badging "$APK" | tee /tmp/homira-badging.txt
          if grep -q "application-debuggable" /tmp/homira-badging.txt; then
            echo "Release APK is debuggable"
            exit 1
          fi

      - name: Sign and verify production APK
        shell: bash
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/36.0.0"
          UNSIGNED="homira-android/app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED="/tmp/Homira-1.0.0-aligned.apk"
          SIGNED="homira-android/app/build/outputs/apk/release/Homira-1.0.0-Production.apk"

          "$BT/zipalign" -p -f 4 "$UNSIGNED" "$ALIGNED"
          "$BT/apksigner" sign \
            --ks /tmp/homira-production.jks \
            --ks-key-alias "$HOMIRA_KEY_ALIAS" \
            --ks-pass "pass:$HOMIRA_KEYSTORE_PASSWORD" \
            --key-pass "pass:$HOMIRA_KEY_PASSWORD" \
            --out "$SIGNED" \
            "$ALIGNED"

          "$BT/apksigner" verify --verbose --print-certs "$SIGNED"
          rm -f "$ALIGNED"

      - name: Sign and verify production AAB
        shell: bash
        run: |
          set -euo pipefail
          OUT="homira-android/app/build/outputs/bundle/release/Homira-1.0.0-Production.aab"
          cp homira-android/app/build/outputs/bundle/release/app-release.aab "$OUT"

          jarsigner \
            -keystore /tmp/homira-production.jks \
            -storepass "$HOMIRA_KEYSTORE_PASSWORD" \
            -keypass "$HOMIRA_KEY_PASSWORD" \
            -sigalg SHA256withRSA \
            -digestalg SHA-256 \
            "$OUT" \
            "$HOMIRA_KEY_ALIAS"

          jarsigner -verify -certs "$OUT"

      - name: Hash production outputs
        run: |
          sha256sum homira-android/app/build/outputs/apk/release/Homira-1.0.0-Production.apk \
            > homira-android/app/build/outputs/apk/release/Homira-1.0.0-Production.apk.sha256
          sha256sum homira-android/app/build/outputs/bundle/release/Homira-1.0.0-Production.aab \
            > homira-android/app/build/outputs/bundle/release/Homira-1.0.0-Production.aab.sha256

      - name: Upload production release
        uses: actions/upload-artifact@v4
        with:
          name: homira-production-v1.0.0
          path: |
            homira-android/app/build/outputs/apk/release/Homira-1.0.0-Production.apk
            homira-android/app/build/outputs/apk/release/Homira-1.0.0-Production.apk.sha256
            homira-android/app/build/outputs/bundle/release/Homira-1.0.0-Production.aab
            homira-android/app/build/outputs/bundle/release/Homira-1.0.0-Production.aab.sha256
          if-no-files-found: error
