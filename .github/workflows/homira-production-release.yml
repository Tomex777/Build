name: Homira Production Release

on:
  workflow_dispatch:
  push:
    branches: [homira-call-ci]
    paths:
      - 'homira-android/**'
      - '.github/workflows/homira-production-release.yml'

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build installable non-debuggable release APK
        working-directory: homira-android
        run: |
          gradle :app:assembleRelease -PHOMIRA_SIGN_RELEASE_WITH_CI_KEY=true --stacktrace

      - name: Confirm release is non-debuggable
        run: |
          APK=homira-android/app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          aapt dump badging "$APK" | tee /tmp/homira-badging.txt
          if grep -q "application-debuggable" /tmp/homira-badging.txt; then
            echo "Release APK is debuggable"
            exit 1
          fi

      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose             homira-android/app/build/outputs/apk/release/app-release.apk

      - name: Prepare release artifact
        run: |
          cp homira-android/app/build/outputs/apk/release/app-release.apk             homira-android/app/build/outputs/apk/release/Homira-Production-v1.0.0.apk
          sha256sum homira-android/app/build/outputs/apk/release/Homira-Production-v1.0.0.apk             > homira-android/app/build/outputs/apk/release/Homira-Production-v1.0.0.apk.sha256

      - name: Upload production release
        uses: actions/upload-artifact@v4
        with:
          name: homira-production-v1.0.0
          path: |
            homira-android/app/build/outputs/apk/release/Homira-Production-v1.0.0.apk
            homira-android/app/build/outputs/apk/release/Homira-Production-v1.0.0.apk.sha256
          if-no-files-found: error
