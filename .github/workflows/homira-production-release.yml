name: Homira Production Release

on:
  workflow_dispatch:
  push:
    branches: [homira-call-ci]
    paths:
      - 'homira-android/**'
      - '.github/workflows/homira-production-release.yml'

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build unsigned production release
        working-directory: homira-android
        run: |
          gradle :app:assembleRelease :app:bundleRelease --stacktrace

      - name: Confirm release is non-debuggable
        run: |
          APK=homira-android/app/build/outputs/apk/release/app-release-unsigned.apk
          test -f "$APK"
          aapt dump badging "$APK" | tee /tmp/homira-badging.txt
          if grep -q "application-debuggable" /tmp/homira-badging.txt; then
            echo "Release APK is debuggable"
            exit 1
          fi

      - name: Generate dedicated production signing key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p homira-release
          SIGN_PASS="$(openssl rand -hex 24)"
          echo "::add-mask::$SIGN_PASS"

          keytool -genkeypair -noprompt             -keystore homira-release/homira-production.jks             -storetype JKS             -storepass "$SIGN_PASS"             -keypass "$SIGN_PASS"             -alias homira             -keyalg RSA             -keysize 4096             -validity 10000             -dname "CN=Homira, O=Homira"

          printf 'alias=homira\nstore_password=%s\nkey_password=%s\n'             "$SIGN_PASS" "$SIGN_PASS"             > homira-release/signing-info.txt

          echo "HOMIRA_SIGN_PASS=$SIGN_PASS" >> "$GITHUB_ENV"

      - name: Sign and verify production APK
        shell: bash
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/36.0.0"
          UNSIGNED="homira-android/app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED="homira-release/Homira-1.0.0-aligned.apk"
          SIGNED="homira-release/Homira-1.0.0-Production.apk"

          "$BT/zipalign" -p -f 4 "$UNSIGNED" "$ALIGNED"
          "$BT/apksigner" sign             --ks homira-release/homira-production.jks             --ks-key-alias homira             --ks-pass "pass:$HOMIRA_SIGN_PASS"             --key-pass "pass:$HOMIRA_SIGN_PASS"             --out "$SIGNED"             "$ALIGNED"

          "$BT/apksigner" verify --verbose --print-certs "$SIGNED"
          rm -f "$ALIGNED"

      - name: Sign and verify production AAB
        shell: bash
        run: |
          set -euo pipefail
          cp homira-android/app/build/outputs/bundle/release/app-release.aab             homira-release/Homira-1.0.0-Production.aab

          jarsigner             -keystore homira-release/homira-production.jks             -storepass "$HOMIRA_SIGN_PASS"             -keypass "$HOMIRA_SIGN_PASS"             -sigalg SHA256withRSA             -digestalg SHA-256             homira-release/Homira-1.0.0-Production.aab             homira

          jarsigner -verify -certs             homira-release/Homira-1.0.0-Production.aab

      - name: Encrypt signing-key backup
        shell: bash
        run: |
          set -euo pipefail
          tar -C homira-release -czf /tmp/homira-signing-backup.tar.gz             homira-production.jks signing-info.txt

          BACKUP_PASS="$(openssl rand -hex 32)"
          echo "::add-mask::$BACKUP_PASS"

          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 250000             -in /tmp/homira-signing-backup.tar.gz             -out homira-release/Homira-Production-Signing-Key.enc             -pass "pass:$BACKUP_PASS"

          echo "" | base64 -d > /tmp/homira-backup-public.pem

          printf '%s' "$BACKUP_PASS" |             openssl pkeyutl -encrypt               -pubin               -inkey /tmp/homira-backup-public.pem               -pkeyopt rsa_padding_mode:oaep               -pkeyopt rsa_oaep_md:sha256               -out homira-release/Homira-Production-Signing-Key.pass.enc

          rm -f /tmp/homira-signing-backup.tar.gz             homira-release/homira-production.jks             homira-release/signing-info.txt

      - name: Hash production outputs
        run: |
          sha256sum homira-release/Homira-1.0.0-Production.apk             > homira-release/Homira-1.0.0-Production.apk.sha256
          sha256sum homira-release/Homira-1.0.0-Production.aab             > homira-release/Homira-1.0.0-Production.aab.sha256

      - name: Upload signed production app
        uses: actions/upload-artifact@v4
        with:
          name: homira-production-signed
          path: |
            homira-release/Homira-1.0.0-Production.apk
            homira-release/Homira-1.0.0-Production.apk.sha256
            homira-release/Homira-1.0.0-Production.aab
            homira-release/Homira-1.0.0-Production.aab.sha256
          if-no-files-found: error

      - name: Upload encrypted signing-key backup
        uses: actions/upload-artifact@v4
        with:
          name: homira-production-signing-backup
          path: |
            homira-release/Homira-Production-Signing-Key.enc
            homira-release/Homira-Production-Signing-Key.pass.enc
          if-no-files-found: error
