name: MSCC anime source live qualification

on:
  workflow_dispatch:
  push:
    branches: [mscc-azure]
    paths:
      - 'mscc/kayoanime-live-probe.js'
      - 'mscc/anime-source-live-probe.js'
      - 'mscc/sources/anime/_delivery.js'
      - 'mscc/sources/anime/kayoanime.js'
      - 'mscc/sources/anime/animepahe.js'
      - 'mscc/sources/anime/animesogo.js'
      - 'mscc/sources/anime/animeonsen.js'
      - '.github/workflows/mscc-anime-source-live.yml'

permissions:
  contents: read

jobs:
  kayoanime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mscc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install MSCC dependencies
        run: npm install --no-audit --no-fund
      - name: Install media and browser-verification tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg curl
          sudo docker pull ghcr.io/flaresolverr/flaresolverr:latest
          sudo docker run -d --name mscc-kayo-flare -p 127.0.0.1:8191:8191 --shm-size=256m \
            -e LOG_LEVEL=info -e LOG_HTML=false -e HEADLESS=true \
            ghcr.io/flaresolverr/flaresolverr:latest
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8191/health >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8191/health
          ffprobe -version | head -n 1
          ffmpeg -version | head -n 1
      - name: Live KayoAnime search, confirmed Drive media, range, seek and decode probe
        env:
          MSCC_FLARESOLVERR_URL: http://127.0.0.1:8191
        run: node kayoanime-live-probe.js

  source:
    name: ${{ matrix.source }}
    strategy:
      fail-fast: false
      matrix:
        source: [animepahe, animesogo, animeonsen]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: mscc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install MSCC dependencies
        run: npm install --no-audit --no-fund
      - name: Install media and browser-verification tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg curl
          sudo docker pull ghcr.io/flaresolverr/flaresolverr:latest
          sudo docker run -d --name mscc-anime-flare -p 127.0.0.1:8191:8191 --shm-size=256m \
            -e LOG_LEVEL=info -e LOG_HTML=false -e HEADLESS=true \
            ghcr.io/flaresolverr/flaresolverr:latest
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8191/health >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8191/health
          ffprobe -version | head -n 1
          ffmpeg -version | head -n 1
      - name: Live search, episode resolution and decode probe
        env:
          MSCC_FLARESOLVERR_URL: http://127.0.0.1:8191
        run: node anime-source-live-probe.js ${{ matrix.source }}
