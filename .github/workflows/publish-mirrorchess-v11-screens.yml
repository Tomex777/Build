name: Publish MirrorChess v1.1 screenshots

on:
  push:
    branches:
      - verify/mirrorchess-v11-20260908
    paths:
      - .github/workflows/publish-mirrorchess-v11-screens.yml

permissions:
  actions: read
  contents: write

jobs:
  publish-screens:
    runs-on: ubuntu-latest
    steps:
      - name: Check out verification branch
        uses: actions/checkout@v4

      - name: Download successful visual tour
        uses: actions/download-artifact@v4
        with:
          name: mirrorchess-v11-visual-tour
          path: downloaded-tour
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 34288700424

      - name: Stage individual emulator screenshots
        run: |
          mkdir -p mirrorchess-v11/screens
          find mirrorchess-v11/screens -maxdepth 1 -type f -name '*.png' -delete
          find downloaded-tour -type f -name '*.png' -exec cp {} mirrorchess-v11/screens/ \;
          test "$(find mirrorchess-v11/screens -type f -name '*.png' | wc -l)" -ge 19
          find mirrorchess-v11/screens -type f -name '*.png' -print | sort

      - name: Commit screen gallery to private verification branch
        run: |
          git config user.name 'MirrorChess Verifier'
          git config user.email 'actions@users.noreply.github.com'
          git add mirrorchess-v11/screens
          git commit -m 'Replace MirrorChess v1.1 gallery with clean recapture'
          git push
