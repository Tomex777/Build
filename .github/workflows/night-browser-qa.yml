name: NIGHT Browser — Agent 10 device acceptance

on:
  workflow_dispatch:
  push:
    branches: [agent/browser-10-qa]
    paths:
      - 'night-browser/qa/**'
      - '.github/workflows/night-browser-qa.yml'
      - 'night-browser/app/**'
  pull_request:
    branches: [feature/night-browser-multi-agent-20261020]
    paths:
      - 'night-browser/**'
      - '.github/workflows/night-browser-qa.yml'

permissions:
  contents: read

jobs:
  independent-qa:
    name: Android API ${{ matrix.api-level }} black-box smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api-level: [26, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-37.1 build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'
      - name: Compile app and run unit tests
        run: gradle --no-daemon -p night-browser :app:testDebugUnitTest :app:assembleDebug
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and interact with real emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -partition-size 4096
          script: |
            adb install -r night-browser/app/build/outputs/apk/debug/app-x86_64-debug.apk
            python3 night-browser/qa/acceptance.py --mode smoke --output "night-browser/qa/results/api-${{ matrix.api-level }}"
      - name: Upload screenshots, fail reasons and structured report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: night-browser-qa-api-${{ matrix.api-level }}
          path: night-browser/qa/results/api-${{ matrix.api-level }}/
          if-no-files-found: warn
          retention-days: 14
