name: NIGHT Browser Agent 3 — Session Build

on:
  pull_request:
    branches: [feature/night-browser-multi-agent-20261020]
    paths:
      - 'night-browser/app/**'
      - '.github/workflows/night-browser-agent03.yml'
  workflow_dispatch:

concurrency:
  group: browser-agent03-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-37.1 build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'
      - name: Compile tab persistence and browser
        run: gradle --no-daemon --stacktrace -p night-browser :app:testDebugUnitTest :app:assembleDebug
      - name: Publish ARM64 and emulator debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: browser-agent03-debug-apks
          path: night-browser/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  # Emulated interaction tests: real GeckoView loads, separate private profile,
  # process death and reopen. A human must still inspect all screenshots.
  emulator:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: actions/download-artifact@v4
        with:
          name: browser-agent03-debug-apks
          path: night-browser/app/build/outputs/apk/debug
      - name: Enable emulator KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Drive real browser tabs, private mode and restart
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -partition-size 4096
          script: python3 night-browser/ci/agent03-smoke.py
      - name: Upload live UI screenshots and crash logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-agent03-emulator-evidence
          path: night-browser/screenshots/agent03/
          if-no-files-found: warn
