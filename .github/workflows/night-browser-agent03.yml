name: NIGHT Browser Agent 3 — Session Build

on:
  push:
    branches: [agent/browser-03-tabs]
    paths:
      - 'night-browser/app/**'
      - '.github/workflows/night-browser-agent03.yml'
  pull_request:
    branches: [feature/night-browser-multi-agent-20261020]
    paths:
      - 'night-browser/app/**'
      - '.github/workflows/night-browser-agent03.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-37.1 build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'
      - name: Compile tab persistence and browser
        run: gradle --no-daemon --stacktrace -p night-browser :app:testDebugUnitTest :app:assembleDebug
      - name: Publish ARM64 and emulator debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: browser-agent03-debug-apks
          path: night-browser/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
