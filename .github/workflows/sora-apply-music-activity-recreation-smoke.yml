name: Apply Sora Music Activity Recreation Smoke

on:
  push:
    branches: [sora-android-ci]
    paths:
      - 'sora-ci/apply-music-activity-recreation-smoke.txt'

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply recreation smoke
        run: python sora-ci/patch_music_activity_recreation_smoke.py
      - name: Verify recreation proof
        run: |
          grep -q 'always_finish_activities 1' sora-ci/ui-smoke.sh
          grep -q '06ac-music-after-activity-recreation' sora-ci/ui-smoke.sh
          grep -q 'trap cleanup_smoke_settings EXIT' sora-ci/ui-smoke.sh
      - name: Commit recreation smoke
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sora-ci/ui-smoke.sh
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'test Sora music across activity recreation'
            git push
          fi
