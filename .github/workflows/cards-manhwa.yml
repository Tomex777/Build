name: NIGHT Manhwa Candidate Foundation

on:
  push:
    branches: [feature/cards-manhwa-foundation-20261021]
    paths:
      - 'cards/catalog/manhwa-*.json'
      - 'cards/src/manhwa.mjs'
      - 'cards/src/manhwa-duo.mjs'
      - 'cards/src/manhwa-gallery.mjs'
      - 'cards/catalog/manhwa-visual-preview.json'
      - 'cards/bin/manhwa-showcase.mjs'
      - 'cards/tests/manhwa-gallery.test.mjs'
      - 'cards/src/artwork.mjs'
      - 'cards/src/catalogue.mjs'
      - 'cards/src/manhwa-review.mjs'
      - 'cards/src/manhwa-gallery.mjs'
      - 'cards/catalog/manhwa-visual-preview.json'
      - 'cards/bin/manhwa-showcase.mjs'
      - 'cards/tests/manhwa-gallery.test.mjs'
      - 'cards/bin/manhwa.mjs'
      - 'cards/bin/manhwa-review.mjs'
      - 'cards/tests/manhwa.test.mjs'
      - 'cards/tests/manhwa-duo.test.mjs'
      - 'cards/docs/MANHWA.md'
      - '.github/workflows/cards-manhwa.yml'
  pull_request:
    paths:
      - 'cards/catalog/manhwa-*.json'
      - 'cards/src/manhwa.mjs'
      - 'cards/src/manhwa-duo.mjs'
      - 'cards/src/artwork.mjs'
      - 'cards/src/catalogue.mjs'
      - 'cards/src/manhwa-review.mjs'
      - 'cards/bin/manhwa.mjs'
      - 'cards/bin/manhwa-review.mjs'
      - 'cards/tests/manhwa.test.mjs'
      - 'cards/tests/manhwa-duo.test.mjs'
      - '.github/workflows/cards-manhwa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: cards
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: cards/package-lock.json
      - run: npm ci
      - name: Regression tests, including BLEACH, 82 manhwa candidates and two-source romance artwork
        run: npm test
      - name: Validate 82 research candidates and strict art acquisition gate
        run: node bin/manhwa.mjs audit
      - name: Ensure missing art never produces fake cards
        run: |
          node bin/manhwa.mjs prepare
          test ! -e catalog/sss-revival.json
          test ! -e catalog/infinite-mage.json
          test ! -e catalog/study-group.json
      - name: Export research-only spoiler-filtered roster
        run: |
          node bin/manhwa-review.mjs
          test -s dist/manhwa-research/index.html
          test -s dist/manhwa-research/summary.json
      - name: Upload NIGHT Manhwa research index (no licensed artwork)
        uses: actions/upload-artifact@v4
        with:
          name: NIGHT-Manhwa-82-Candidate-Roster
          path: cards/dist/manhwa-research/
          if-no-files-found: error
          retention-days: 14
