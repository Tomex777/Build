name: Secure Rendering System Emulator Probe

on:
  push:
    branches:
      - secure-rendering-lab
    paths:
      - "secure-rendering-lab/aosp-system-lab/fast-cuttlefish/ci-emulator-probe.sh"
      - ".github/workflows/secure-rendering-system-emulator.yml"
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android 36 build tools
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build unsigned system lab
        working-directory: secure-rendering-lab
        run: gradle :systemlab:assembleRelease --stacktrace

      - name: Sign with AOSP Android 16 platform test key
        shell: bash
        run: |
          set -euo pipefail

          KEY_URL="https://android.googlesource.com/platform/build/+/refs/heads/android16-release/target/product/security"
          mkdir -p /tmp/aosp-platform-key
          curl -fsSL "$KEY_URL/platform.pk8?format=TEXT" | base64 -d > /tmp/aosp-platform-key/platform.pk8
          curl -fsSL "$KEY_URL/platform.x509.pem?format=TEXT" | base64 -d > /tmp/aosp-platform-key/platform.x509.pem

          BUNDLE="$GITHUB_WORKSPACE/secure-rendering-system-lab-fast-cuttlefish"
          mkdir -p "$BUNDLE"

          APKSIGNER="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}/build-tools/35.0.0/apksigner"
          UNSIGNED="$GITHUB_WORKSPACE/secure-rendering-lab/systemlab/build/outputs/apk/release/systemlab-release-unsigned.apk"

          "$APKSIGNER" sign \
            --key /tmp/aosp-platform-key/platform.pk8 \
            --cert /tmp/aosp-platform-key/platform.x509.pem \
            --out "$BUNDLE/SecureRenderingSystemLab-platform.apk" \
            "$UNSIGNED"

          "$APKSIGNER" verify --verbose --print-certs "$BUNDLE/SecureRenderingSystemLab-platform.apk"

          cp secure-rendering-lab/aosp-system-lab/privapp-permissions-com.tomex.securerenderlab.system.xml "$BUNDLE/"

      - name: Boot API 36 AOSP emulator and probe
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: default
          arch: x86_64
          profile: pixel_7
          cores: 2
          ram-size: 3072M
          emulator-boot-timeout: 900
          emulator-options: -writable-system -no-snapshot-load -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: env SYSTEMLAB_APK="$GITHUB_WORKSPACE/secure-rendering-system-lab-fast-cuttlefish/SecureRenderingSystemLab-platform.apk" SYSTEMLAB_PERMS="$GITHUB_WORKSPACE/secure-rendering-system-lab-fast-cuttlefish/privapp-permissions-com.tomex.securerenderlab.system.xml" SYSTEMLAB_REPORT="$GITHUB_WORKSPACE/systemlab-emulator-report.txt" bash secure-rendering-lab/aosp-system-lab/fast-cuttlefish/ci-emulator-probe.sh

      - name: Upload emulator probe report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secure-rendering-system-lab-emulator-report
          path: systemlab-emulator-report.txt
          if-no-files-found: warn
