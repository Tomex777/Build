name: Slumber 0.8.5 Exit Recreation Verify

on:
  push:
    branches: ["pianohub-ci"]
    paths:
      - ".github/workflows/slumber-085-exit-recreation.yml"
      - ".ci/slumber_085_exit_recreation.patch"

permissions:
  actions: read
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct exact 0.8.4 source and apply 0.8.5 fix
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/slumber-base /tmp/slumber /tmp/slumber-out
          mkdir -p /tmp/slumber-base /tmp/slumber /tmp/slumber-out
          gh run download 34643086996 --repo Tomex777/Build --name slumber-0.8.4-scrollable-sheets --dir /tmp/slumber-base
          SRC=$(find /tmp/slumber-base -name 'slumber-production-0.8.4-source.tgz' -type f -print -quit)
          test -n "$SRC"
          tar -xzf "$SRC" -C /tmp/slumber
          cd /tmp/slumber
          patch -p1 < "$GITHUB_WORKSPACE/.ci/slumber_085_exit_recreation.patch"
          grep -q 'versionCode = 17' app/build.gradle.kts
          grep -q 'versionName = "0.8.5"' app/build.gradle.kts
          grep -q 'rememberSaveable' app/src/main/java/com/night/pianohub/ui/screens/PianoScreen.kt
          grep -q 'pendingExitTarget' app/src/main/java/com/night/pianohub/ui/screens/PianoScreen.kt
          ! grep -q 'var pendingExit by remember' app/src/main/java/com/night/pianohub/ui/screens/PianoScreen.kt
          grep -q '"songs" -> onSongs()' app/src/main/java/com/night/pianohub/ui/screens/PianoScreen.kt

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: "15859902"

      - name: Install Android SDK
        run: sdkmanager --channel=3 "platforms;android-37.0" "build-tools;37.0.0"

      - name: Unit tests
        working-directory: /tmp/slumber
        run: gradle --stacktrace testDebugUnitTest

      - name: Build APK
        working-directory: /tmp/slumber
        run: gradle --stacktrace assembleDebug

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/slumber/app/build/outputs/apk/debug/app-debug.apk /tmp/slumber-out/Slumber-0.8.5-debug.apk
          sha256sum /tmp/slumber-out/Slumber-0.8.5-debug.apk | tee /tmp/slumber-out/apk-sha256.txt
          cd /tmp/slumber
          tar --exclude='./.gradle' --exclude='./build' --exclude='./app/build' -czf /tmp/slumber-out/slumber-production-0.8.5-source.tgz .

      - uses: actions/upload-artifact@v4
        with:
          name: slumber-0.8.5-exit-recreation
          path: /tmp/slumber-out/*
          if-no-files-found: error
