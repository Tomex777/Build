name: Slumber by Night 0.7.0 Landscape Piano

on:
  push:
    branches: ["pianohub-ci"]
    paths:
      - ".github/workflows/slumber-070-ci.yml"
      - ".ci/slumber_070_overlay/**"

permissions:
  actions: read
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4

      - name: Reconstruct exact Slumber 0.7.0 source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/slumber /tmp/slumber-base /tmp/slumber-out
          mkdir -p /tmp/slumber /tmp/slumber-base /tmp/slumber-out
          gh run download 34443740455 --repo Tomex777/Build --name slumber-production-0.5.0-exact --dir /tmp/slumber-base
          BASE=$(find /tmp/slumber-base -name 'slumber-production-0.5.0-source.tgz' -type f -print -quit)
          test -n "$BASE"
          tar -xzf "$BASE" -C /tmp/slumber
          cat .ci/slumber_070_overlay/part00.txt \
              .ci/slumber_070_overlay/part01.txt \
              .ci/slumber_070_overlay/part02.txt \
              .ci/slumber_070_overlay/part03.txt \
              .ci/slumber_070_overlay/part04.txt \
              .ci/slumber_070_overlay/part05.txt \
              | tr -d '\n' | base64 --decode > /tmp/slumber-0.7.0-overlay.tgz
          echo '9ea02dfa49748f9d259fe3dbbff18a47cd25f4b32e8db0c87c84bf700fd5142c  /tmp/slumber-0.7.0-overlay.tgz' | sha256sum -c -
          tar -xzf /tmp/slumber-0.7.0-overlay.tgz -C /tmp/slumber
          grep -q 'versionName = "0.7.0"' /tmp/slumber/app/build.gradle.kts
          grep -q 'SCREEN_ORIENTATION_SENSOR_LANDSCAPE' /tmp/slumber/app/src/main/java/com/night/pianohub/ui/screens/PianoScreen.kt
          grep -q 'DEFAULT_C4_TO_C7_VIEWPORT' /tmp/slumber/app/src/main/java/com/night/pianohub/ui/components/PianoKeyboard.kt
          grep -q 'Text("88 keys"' /tmp/slumber/app/src/main/java/com/night/pianohub/ui/screens/PianoScreen.kt
          grep -q 'currentRoute != "piano"' /tmp/slumber/app/src/main/java/com/night/pianohub/ui/PianoHubApp.kt
          grep -q 'PracticeDisplayMode.TOUCH' /tmp/slumber/app/src/main/java/com/night/pianohub/ui/screens/PianoScreen.kt
          grep -q 'PracticeDisplayMode.ROLL' /tmp/slumber/app/src/main/java/com/night/pianohub/ui/screens/PianoScreen.kt
          grep -q 'PracticeDisplayMode.STAFF' /tmp/slumber/app/src/main/java/com/night/pianohub/ui/screens/PianoScreen.kt

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: "15859902"

      - name: Install Android compile SDK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --channel=3 "platforms;android-37.0" "build-tools;37.0.0"
          test -f "$ANDROID_SDK_ROOT/platforms/android-37.0/android.jar"

      - name: Run unit and regression suite
        working-directory: /tmp/slumber
        run: gradle --stacktrace testDebugUnitTest

      - name: Run Android lint
        working-directory: /tmp/slumber
        run: gradle --stacktrace lintDebug

      - name: Build Slumber 0.7.0 APK
        working-directory: /tmp/slumber
        run: gradle --stacktrace assembleDebug

      - name: Verify APK and piano assets
        shell: bash
        run: |
          set -euo pipefail
          APK=/tmp/slumber/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          COUNT=$(unzip -l "$APK" | grep -E 'assets/piano/.*\.mp3$' | wc -l)
          echo "Bundled Yamaha C5 recordings: $COUNT"
          test "$COUNT" -eq 120
          unzip -l "$APK" | grep -q 'classes.dex'
          cp "$APK" /tmp/slumber-out/Slumber-0.7.0-debug.apk
          sha256sum "$APK" | tee /tmp/slumber-out/apk-sha256.txt
          cd /tmp/slumber
          tar --exclude='./.gradle' --exclude='./build' --exclude='./app/build' -czf /tmp/slumber-out/slumber-production-0.7.0-source.tgz .

      - name: Upload exact build
        uses: actions/upload-artifact@v4
        with:
          name: slumber-production-0.7.0-landscape-ui
          path: /tmp/slumber-out/*
          if-no-files-found: error

  runtime-verify:
    needs: build-test
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Download exact built APK
        uses: actions/download-artifact@v4
        with:
          name: slumber-production-0.7.0-landscape-ui
          path: /tmp/slumber-build

      - name: Prepare stateful runtime verification
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/slumber-runtime
          mkdir -p /tmp/slumber-runtime
          APK=$(find /tmp/slumber-build -name 'Slumber-0.7.0-debug.apk' -type f -print -quit)
          test -n "$APK"
          cp "$APK" /tmp/slumber-runtime/app-debug.apk
          cat > /tmp/slumber-runtime/run-qa.sh <<'BASH'
          #!/usr/bin/env bash
          set -euo pipefail
          PKG=com.night.pianohub
          ACT=com.night.pianohub/.MainActivity
          OUT=/tmp/slumber-runtime

          dump_ui() {
            adb shell uiautomator dump /sdcard/slumber-ui.xml >/dev/null
            adb pull /sdcard/slumber-ui.xml "$OUT/ui.xml" >/dev/null
          }

          assert_text() {
            dump_ui
            grep -Fq "$1" "$OUT/ui.xml"
          }

          assert_absent() {
            dump_ui
            ! grep -Fq "$1" "$OUT/ui.xml"
          }

          tap_text() {
            dump_ui
            local target="$1"
            local xy
            xy=$(python3 - "$OUT/ui.xml" "$target" <<'PY'
          import re, sys, xml.etree.ElementTree as ET
          path, target = sys.argv[1], sys.argv[2]
          root = ET.parse(path).getroot()
          for node in root.iter('node'):
              if node.attrib.get('text') == target or node.attrib.get('content-desc') == target:
                  m = re.fullmatch(r'\[(\d+),(\d+)\]\[(\d+),(\d+)\]', node.attrib['bounds'])
                  if m:
                      x1,y1,x2,y2 = map(int,m.groups())
                      print((x1+x2)//2, (y1+y2)//2)
                      raise SystemExit(0)
          raise SystemExit(3)
          PY
          )
            adb shell input tap $xy
            sleep 2
          }

          screenshot() {
            adb exec-out screencap -p > "$OUT/$1.png"
            test -s "$OUT/$1.png"
          }

          assert_landscape_png() {
            python3 - "$1" <<'PY'
          import struct, sys
          p=sys.argv[1]
          with open(p,'rb') as f:
              sig=f.read(24)
          assert sig[:8] == b'\x89PNG\r\n\x1a\n'
          w,h=struct.unpack('>II',sig[16:24])
          print(f'{w}x{h}')
          assert w > h, (w,h)
          PY
          }

          no_app_crash() {
            adb logcat -d -t 4000 > "$OUT/logcat.txt"
            ! grep -E "ANR in ${PKG}|FATAL EXCEPTION.*${PKG}|Process: ${PKG}.*FATAL EXCEPTION" "$OUT/logcat.txt"
          }

          adb shell settings put global hide_error_dialogs 1
          adb install -r "$OUT/app-debug.apk"
          adb logcat -c
          adb shell am force-stop "$PKG"
          adb shell am start -W -n "$ACT" > "$OUT/start-home.txt"
          sleep 3
          test -n "$(adb shell pidof "$PKG")"
          assert_text "Slumber"
          screenshot 01-home

          # Enter the dedicated piano workspace.
          tap_text "Piano"
          sleep 4
          test -n "$(adb shell pidof "$PKG")"
          assert_text "PRACTICE · FULLY LOCAL"
          assert_text "First Melody"
          assert_text "Piano"
          assert_text "Record"
          assert_text "AI Teacher"
          assert_text "Touch"
          assert_text "Roll"
          assert_text "Staff"
          assert_text "88 keys"
          assert_text "C4–C7"
          # App-wide dashboard nav is deliberately absent while playing.
          assert_absent "Learn"
          assert_absent "Progress"
          screenshot 02-piano-touch
          assert_landscape_png "$OUT/02-piano-touch.png"

          # Three teaching modes must all be switchable in the same landscape workspace.
          tap_text "Roll"
          assert_text "Roll"
          screenshot 03-piano-roll
          assert_landscape_png "$OUT/03-piano-roll.png"
          tap_text "Staff"
          assert_text "Staff"
          screenshot 04-piano-staff
          assert_landscape_png "$OUT/04-piano-staff.png"
          tap_text "Touch"
          assert_text "Touch"

          # Instrument chooser must open and close without killing practice.
          tap_text "Piano"
          sleep 2
          dump_ui
          grep -Eq "Yamaha C5|Concert Grand|Built-in" "$OUT/ui.xml"
          adb shell input keyevent KEYCODE_BACK
          sleep 2
          assert_text "PRACTICE · FULLY LOCAL"

          # Exercise keyboard/touch path with simultaneous-ish rapid touches and navigator movement.
          for x in 250 390 530 670 810 950 1090 1230; do
            adb shell input tap "$x" 720
          done
          sleep 2
          test -n "$(adb shell pidof "$PKG")"
          tap_text "→"
          tap_text "←"
          tap_text "C4–C7"
          screenshot 05-piano-interaction
          assert_landscape_png "$OUT/05-piano-interaction.png"

          # Record control state changes and returns cleanly.
          tap_text "Record"
          sleep 1
          assert_text "Stop"
          adb shell input tap 840 720
          sleep 1
          tap_text "Stop"
          sleep 1
          test -n "$(adb shell pidof "$PKG")"

          # Leaving practice must restore the non-practice workspace/orientation policy.
          tap_text "Back"
          sleep 4
          assert_text "Slumber"
          assert_text "Learn"
          screenshot 06-home-after-piano

          adb shell dumpsys activity activities > "$OUT/activity-dump.txt"
          adb shell dumpsys meminfo "$PKG" > "$OUT/meminfo.txt"
          dump_ui
          no_app_crash
          test -n "$(adb shell pidof "$PKG")"
          BASH
          chmod +x /tmp/slumber-runtime/run-qa.sh

      - name: Enable KVM
        shell: bash
        run: |
          set -euo pipefail
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm

      - name: Android 36 landscape runtime verification
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ANDROID_EMULATOR_WAIT_TIME_BEFORE_KILL: 1
        with:
          api-level: 36
          arch: x86_64
          target: default
          profile: pixel_6
          cores: 2
          emulator-boot-timeout: 360
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot-save -no-metrics
          script: bash /tmp/slumber-runtime/run-qa.sh

      - name: Upload runtime proof
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: slumber-0.7.0-landscape-runtime-proof
          path: |
            /tmp/slumber-runtime/*.png
            /tmp/slumber-runtime/*.xml
            /tmp/slumber-runtime/*.txt
          if-no-files-found: warn
