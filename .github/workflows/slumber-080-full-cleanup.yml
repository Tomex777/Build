name: Slumber 0.8.0 Full Cleanup

on:
  push:
    branches: ["pianohub-ci"]
    paths:
      - ".ci/slumber_080_full.patch.gz.b64"
      - ".github/workflows/slumber-080-full-cleanup.yml"

permissions:
  actions: read
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4

      - name: Reconstruct Slumber 0.7.1 and apply 0.8.0 patch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/slumber-base /tmp/slumber /tmp/slumber-out
          mkdir -p /tmp/slumber-base /tmp/slumber /tmp/slumber-out
          gh run download 34570923649 --repo Tomex777/Build --name slumber-0.7.1-two-fixes --dir /tmp/slumber-base
          SRC=$(find /tmp/slumber-base -name 'slumber-production-0.7.1-source.tgz' -type f -print -quit)
          test -n "$SRC"
          tar -xzf "$SRC" -C /tmp/slumber
          base64 --decode .ci/slumber_080_full.patch.gz.b64 | gzip -dc > /tmp/slumber-080.patch
          cd /tmp/slumber
          patch -p1 < /tmp/slumber-080.patch
          grep -q 'versionName = "0.8.0"' app/build.gradle.kts
          grep -q 'Destination("settings", "Settings"' app/src/main/java/com/night/pianohub/ui/PianoHubApp.kt
          ! grep -q 'Destination("sounds", "Sounds"' app/src/main/java/com/night/pianohub/ui/PianoHubApp.kt
          grep -q 'EGYPTIAN' app/src/main/java/com/night/pianohub/music/MusicModels.kt
          grep -q 'Listen & Repeat' app/src/main/java/com/night/pianohub/ui/screens/PianoScreen.kt
          grep -q 'releaseMs' app/src/main/java/com/night/pianohub/audio/SampledPianoAudioEngine.kt
          test "$(grep -R --include='*.kt' -n 'by Night' app/src/main/java/com/night/pianohub/ui | wc -l)" -eq 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: "15859902"

      - name: Install Android compile SDK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --channel=3 "platforms;android-37.0" "build-tools;37.0.0"

      - name: Run unit tests
        working-directory: /tmp/slumber
        run: gradle --stacktrace testDebugUnitTest

      - name: Build APK
        working-directory: /tmp/slumber
        run: gradle --stacktrace assembleDebug

      - name: Package build
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/slumber/app/build/outputs/apk/debug/app-debug.apk /tmp/slumber-out/Slumber-0.8.0-debug.apk
          sha256sum /tmp/slumber-out/Slumber-0.8.0-debug.apk | tee /tmp/slumber-out/apk-sha256.txt
          cd /tmp/slumber
          tar --exclude='./.gradle' --exclude='./build' --exclude='./app/build' -czf /tmp/slumber-out/slumber-production-0.8.0-source.tgz .

      - name: Upload Slumber 0.8.0
        uses: actions/upload-artifact@v4
        with:
          name: slumber-0.8.0-full-cleanup
          path: /tmp/slumber-out/*
          if-no-files-found: error
