name: NIGHT Browser — Emulator Screenshots

on:
  workflow_dispatch:
  push:
    branches: [feature/night-browser-prototype-20261019]
    paths: ['.github/workflows/night-browser-visuals.yml']

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-37.1 build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'
      - name: Build x86_64 emulator APK
        run: gradle --no-daemon -p night-browser :app:assembleDebug
      - name: Enable emulator KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Boot Android, drive screens and capture actual UI
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -partition-size 4096
          script: bash night-browser/ci/capture-screenshots.sh
      - name: Upload screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: night-browser-real-emulator-screenshots
          path: |
            night-browser/screenshots/*.png
            night-browser/screenshots/*.txt
            night-browser/screenshots/*.xml
          if-no-files-found: warn
      - name: Publish real screenshots for viewing
        if: success()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add night-browser/screenshots
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "test(browser): real Android emulator UI screenshots"
          git push origin HEAD:feature/night-browser-prototype-20261019
