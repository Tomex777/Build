name: Apply Sora Music Listening Events

on:
  push:
    branches: [sora-android-ci]
    paths:
      - 'sora-ci/apply-music-listening-events.txt'

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Wire real playback listening events
        run: python sora-ci/patch_music_listening_events.py
      - name: Verify listening signal wiring
        run: |
          grep -q 'MusicListeningEventType { STARTED, COMPLETED, SKIPPED }' sora-overlay/app/src/main/java/com/night/sora/playback/MusicPlaybackController.kt
          grep -q 'emitSkipIfStarted' sora-overlay/app/src/main/java/com/night/sora/playback/MusicPlaybackController.kt
          grep -q 'countPlay: Boolean = true' sora-overlay/app/src/main/java/com/night/sora/data/CoreRepository.kt
          grep -q 'MusicListeningEventType.COMPLETED' sora-overlay/app/src/main/java/com/night/sora/ui/SoraApp.kt
          grep -q 'saved = index < 0' sora-overlay/app/src/main/java/com/night/sora/data/CoreRepository.kt
      - name: Commit listening events
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sora-overlay/app/src/main/java/com/night/sora/playback/MusicPlaybackController.kt \
                  sora-overlay/app/src/main/java/com/night/sora/data/CoreRepository.kt \
                  sora-overlay/app/src/main/java/com/night/sora/ui/SoraApp.kt
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'record real Sora music listening events'
            git push
          fi
