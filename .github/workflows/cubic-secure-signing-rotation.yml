name: Cubic Secure Signing Rotation

on:
  push:
    branches: [cubic-android-ci]
    paths:
      - '.github/workflows/cubic-secure-signing-rotation.yml'

concurrency:
  group: cubic-secure-signing-rotation
  cancel-in-progress: false

jobs:
  sign:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'

      - name: Test, lint and build unsigned release
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace -p cubic-android \
            :app:testDebugUnitTest \
            :app:lintRelease \
            :app:assembleRelease
          test -s cubic-android/app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Generate replacement key, sign and encrypt backup
        run: |
          set -euo pipefail
          umask 077

          BUILD_TOOLS="$ANDROID_SDK_ROOT/build-tools/36.0.0"
          OUT="$RUNNER_TEMP/cubic-rotation"
          VAULT="$RUNNER_TEMP/cubic-vault"
          mkdir -p "$OUT" "$VAULT"

          UNSIGNED="cubic-android/app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED="$OUT/Cubic-1.0.0-aligned.apk"
          KEYSTORE="$VAULT/Cubic-production-release.jks"
          FINAL="$OUT/Cubic-universal-release.apk"
          ALIAS="cubic-release"
          STORE_PASSWORD="$(openssl rand -hex 32)"
          KEY_PASSWORD="$(openssl rand -hex 32)"

          echo "::add-mask::$STORE_PASSWORD"
          echo "::add-mask::$KEY_PASSWORD"

          keytool -genkeypair             -noprompt             -storetype JKS             -keystore "$KEYSTORE"             -storepass "$STORE_PASSWORD"             -keypass "$KEY_PASSWORD"             -alias "$ALIAS"             -keyalg RSA             -keysize 4096             -validity 10000             -dname "CN=Cubic Android Release, OU=Android, O=Night"             >/dev/null 2>&1

          "$BUILD_TOOLS/zipalign" -f 4 "$UNSIGNED" "$ALIGNED"
          "$BUILD_TOOLS/apksigner" sign             --ks "$KEYSTORE"             --ks-key-alias "$ALIAS"             --ks-pass env:STORE_PASSWORD             --key-pass env:KEY_PASSWORD             --out "$FINAL"             "$ALIGNED"

          "$BUILD_TOOLS/apksigner" verify             --verbose             --print-certs             "$FINAL" | tee "$OUT/PRODUCTION_SIGNATURE.txt"

          "$BUILD_TOOLS/zipalign" -c -v 4 "$FINAL" > "$OUT/ZIPALIGN_VERIFY.txt"
          "$BUILD_TOOLS/aapt" dump badging "$FINAL" > "$OUT/release-badging.txt"
          unzip -l "$FINAL" > "$OUT/release-contents.txt"

          grep -q "package: name='com.tomex777.cubic'" "$OUT/release-badging.txt"
          grep -q "versionCode='1'" "$OUT/release-badging.txt"
          grep -q "versionName='1.0.0'" "$OUT/release-badging.txt"
          grep -q "sdkVersion:'26'" "$OUT/release-badging.txt"
          grep -q "targetSdkVersion:'36'" "$OUT/release-badging.txt"
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            grep -q "lib/$abi/" "$OUT/release-contents.txt"
          done

          APK_SHA256="$(sha256sum "$FINAL" | awk '{print $1}')"
          CERT_SHA256="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$OUT/PRODUCTION_SIGNATURE.txt" | head -n1 | tr -d ':')"
          test -n "$APK_SHA256"
          test -n "$CERT_SHA256"

          {
            echo "CUBIC_RELEASE_KEY_ALIAS=$ALIAS"
            echo "CUBIC_RELEASE_KEYSTORE_PASSWORD=$STORE_PASSWORD"
            echo "CUBIC_RELEASE_KEY_PASSWORD=$KEY_PASSWORD"
            printf 'CUBIC_RELEASE_KEYSTORE_B64='
            base64 -w 0 "$KEYSTORE"
            printf '\n'
          } > "$VAULT/GITHUB_ACTIONS_SECRETS.txt"

          cat > "$VAULT/KEEP_SAFE_README.txt" <<EOF
          CUBIC PERMANENT SIGNING BACKUP — SECURE ROTATION KEY

          This signing identity replaces the earlier bootstrap key.
          Use it for Cubic 1.0.0 and all future direct-APK updates.

          APK SHA-256: $APK_SHA256
          Certificate SHA-256: $CERT_SHA256

          Configure all four values in GITHUB_ACTIONS_SECRETS.txt as private
          Actions secrets before the next Cubic release.
          EOF

          sha256sum "$KEYSTORE" > "$VAULT/SIGNING_BACKUP_SHA256.txt"
          tar -C "$VAULT" -czf "$OUT/Cubic-signing-backup.tar.gz"             Cubic-production-release.jks             GITHUB_ACTIONS_SECRETS.txt             KEEP_SAFE_README.txt             SIGNING_BACKUP_SHA256.txt

          cat > "$OUT/recipient-cert.pem" <<'CERT'
-----BEGIN CERTIFICATE-----
MIIFUzCCAzugAwIBAgIUBeTfaRMwVN8bTMHDXkQno1TuMhwwDQYJKoZIhvcNAQEL
BQAwOTEnMCUGA1UEAwweQ3ViaWMgU2lnbmluZyBCYWNrdXAgUmVjaXBpZW50MQ4w
DAYDVQQKDAVOaWdodDAeFw0yNjA5MzAxMTMxMDRaFw0yNjEwMDcxMTMxMDRaMDkx
JzAlBgNVBAMMHkN1YmljIFNpZ25pbmcgQmFja3VwIFJlY2lwaWVudDEOMAwGA1UE
CgwFTmlnaHQwggIiMA0GCSqGSIb3DQEBAQUAA4ICDwAwggIKAoICAQD1EmIBjLwZ
