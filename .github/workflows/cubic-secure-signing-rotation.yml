cKy/YV5GEKyel1Ody2dV+lv4j0QbG0k=
-----END CERTIFICATE-----
CERT

          openssl cms -encrypt             -aes-256-cbc             -binary             -outform DER             -in "$OUT/Cubic-signing-backup.tar.gz"             -out "$OUT/Cubic-signing-backup-encrypted.cms"             "$OUT/recipient-cert.pem"

          rm -rf "$VAULT"
          rm -f "$OUT/Cubic-signing-backup.tar.gz" "$OUT/recipient-cert.pem"

          sha256sum "$FINAL" > "$OUT/PRODUCTION_APK_SHA256.txt"
          sha256sum "$OUT/Cubic-signing-backup-encrypted.cms" > "$OUT/ENCRYPTED_BACKUP_SHA256.txt"

          {
            echo "app=Cubic"
            echo "versionName=1.0.0"
            echo "versionCode=1"
            echo "minSdk=26"
            echo "targetSdk=36"
            echo "abis=arm64-v8a,armeabi-v7a,x86,x86_64"
            echo "productionSigned=true"
            echo "signingIdentity=secure rotated permanent key"
            echo "apkSha256=$APK_SHA256"
            echo "certificateSha256=$CERT_SHA256"
          } > "$OUT/RELEASE_STATUS.txt"

      - name: Upload encrypted private-key backup
        uses: actions/upload-artifact@v4
        with:
          name: Cubic-signing-backup-ENCRYPTED
          path: |
            ${{ runner.temp }}/cubic-rotation/Cubic-signing-backup-encrypted.cms
            ${{ runner.temp }}/cubic-rotation/ENCRYPTED_BACKUP_SHA256.txt
          if-no-files-found: error
          retention-days: 90

      - name: Upload rotated production runtime
        uses: actions/upload-artifact@v4
        with:
          name: cubic-rotated-production-runtime
          path: ${{ runner.temp }}/cubic-rotation/Cubic-universal-release.apk
          if-no-files-found: error
          retention-days: 90

      - name: Upload rotated signing evidence
        uses: actions/upload-artifact@v4
        with:
          name: cubic-rotated-signing-evidence
          path: |
            ${{ runner.temp }}/cubic-rotation/PRODUCTION_SIGNATURE.txt
            ${{ runner.temp }}/cubic-rotation/ZIPALIGN_VERIFY.txt
            ${{ runner.temp }}/cubic-rotation/release-badging.txt
            ${{ runner.temp }}/cubic-rotation/release-contents.txt
            ${{ runner.temp }}/cubic-rotation/PRODUCTION_APK_SHA256.txt
            ${{ runner.temp }}/cubic-rotation/RELEASE_STATUS.txt
          if-no-files-found: error
          retention-days: 90

  runtime-api26:
    needs: sign
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - uses: actions/download-artifact@v4
        with:
          name: cubic-rotated-production-runtime
          path: /tmp/cubic-production
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: API 26 rotated production runtime proof
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 26
          target: google_apis
          arch: x86_64
          profile: pixel_2
          script: CUBIC_APK=/tmp/cubic-production/Cubic-universal-release.apk CUBIC_EXTENDED=0 bash cubic-android/ci/run-emulator-tests.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cubic-rotated-api26-report
          path: cubic-android/build/ci-report/
          if-no-files-found: error

  runtime-api36:
    needs: sign
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - uses: actions/download-artifact@v4
        with:
          name: cubic-rotated-production-runtime
          path: /tmp/cubic-production
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: API 36 full rotated production runtime proof
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          script: CUBIC_APK=/tmp/cubic-production/Cubic-universal-release.apk CUBIC_EXTENDED=1 bash cubic-android/ci/run-emulator-tests.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cubic-rotated-api36-report
          path: cubic-android/build/ci-report/
          if-no-files-found: error

  finalize:
    needs:
      - sign
      - runtime-api26
      - runtime-api36
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cubic-rotated-production-runtime
          path: /tmp/cubic-final
      - uses: actions/download-artifact@v4
        with:
          name: cubic-rotated-signing-evidence
          path: /tmp/cubic-final
      - name: Confirm rotated production package
        run: |
          set -euo pipefail
          test -s /tmp/cubic-final/Cubic-universal-release.apk
          grep -q "productionSigned=true" /tmp/cubic-final/RELEASE_STATUS.txt
          grep -q "signingIdentity=secure rotated permanent key" /tmp/cubic-final/RELEASE_STATUS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Cubic-1.0.0-ROTATED-PRODUCTION-VALIDATED
          path: /tmp/cubic-final/
          if-no-files-found: error
          retention-days: 90
