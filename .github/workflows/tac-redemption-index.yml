name: TAC Redemption Official CSV Metadata

on:
  push:
    branches:
      - feature/tac-hymnbook-foundation
    paths:
      - 'tac-hymnbook/tools/fetch_redemption_csv.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install parser
        run: python3 -m pip install --disable-pip-version-check requests
      - name: Request Hymnary's official CSV export once
        run: python3 tac-hymnbook/tools/fetch_redemption_csv.py
      - name: Archive obtained index metadata
        uses: actions/upload-artifact@v4
        with:
          name: RH2006-official-CSV-metadata
          path: tac-hymnbook/data/redemption-hymnary-export.csv
          if-no-files-found: error
