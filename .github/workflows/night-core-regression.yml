name: Night Integrated Regression

on:
  push:
    branches:
      - night-groq-key-pool-ci
    paths:
      - "whatsapp-ai-android/**"
      - ".github/workflows/night-core-regression.yml"
      - ".github/scripts/night-image-editor-interaction.sh"
      - ".github/scripts/night-message-blocks-interaction.sh"
      - ".github/scripts/night-live-voice-interaction.sh"
      - ".github/scripts/night-extension-config-interaction.sh"
      - ".github/scripts/night-browser-interaction.sh"
      - ".github/scripts/night-memory-interaction.sh"
      - ".github/scripts/night-providers-interaction.sh"
      - ".github/scripts/night-mihon-reader-interaction.sh"
      - ".github/scripts/night-pdf-editor-interaction.sh"
      - ".github/scripts/night-video-interaction.sh"
      - ".github/scripts/night-mcp-servers-interaction.sh"
      - ".github/scripts/night-extensions-interaction.sh"
      - ".github/scripts/night-integrations-interaction.sh"
      - ".github/scripts/night-main-tabs-interaction.sh"
  workflow_dispatch:

concurrency:
  group: night-integrated-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android 36 SDK
        run: |
          SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/16.0/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Add test Firebase config
        run: |
          cat > whatsapp-ai-android/app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "123456789012",
              "project_id": "night-integrated-regression",
              "storage_bucket": "night-integrated-regression.appspot.com"
            },
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:123456789012:android:0123456789abcdef",
                "android_client_info": {"package_name": "com.example.whatsapp"}
              },
              "oauth_client": [],
              "api_key": [{"current_key": "AIzaSyDUMMY_PREVIEW_KEY_NOT_FOR_NETWORK_USE"}],
              "services": {"appinvite_service": {"other_platform_oauth_client": []}}
            }],
            "configuration_version": "1"
          }
          JSON

      - name: Guard Night invariants
        run: |
          grep -q 'minSdk = 26' whatsapp-ai-android/app/build.gradle.kts
          grep -q 'compileSdk = 36' whatsapp-ai-android/app/build.gradle.kts
          grep -q 'targetSdk = 36' whatsapp-ai-android/app/build.gradle.kts
          PDF="whatsapp-ai-android/app/src/main/java/com/example/whatsapp/presentation/chatscreen/NightPdfViewerScreen.kt"
          ! grep -q "ModalBottomSheet" "$PDF"
          grep -q 'contentDescription = "PDF full screen viewer"' "$PDF"
          python - <<'PY'
          from pathlib import Path

          shell = Path("whatsapp-ai-android/app/src/main/java/com/example/whatsapp/presentation/shell/ModernMainTabs.kt").read_text()
          bottom = shell.split("private fun ModernBottomBar", 1)[1].split("private fun RowScope.BottomItem", 1)[0]
          expected_tabs = ['MainTab.Chats', 'MainTab.Updates', 'MainTab.Scripts', 'MainTab.You']
          positions = [bottom.index(tab) for tab in expected_tabs]
          assert positions == sorted(positions), "Night bottom navigation must be Chat, Library, Scripts/Projects, U"
          assert 'MainTab.Calls' not in bottom and 'MainTab.Communities' not in bottom

          files = Path("whatsapp-ai-android/app/src/main/java/com/example/whatsapp/presentation/files/NightFilesTab.kt").read_text()
          you = Path("whatsapp-ai-android/app/src/main/java/com/example/whatsapp/presentation/profile/NightYouTab.kt").read_text()
          assert "Scripts & Projects" not in files, "Scripts/Projects must have a dedicated tab, not a Library shortcut"
          assert '"Settings"' not in you, "U must not duplicate a separate Settings row"
          assert 'YouRow("integrations"' in you, "Integrations must have its own You destination"
          assert "rememberSaveable { mutableStateOf(\"\") }" in files, "Library search must survive tab recomposition"

          main = Path("whatsapp-ai-android/app/src/main/java/com/example/whatsapp/MainActivity.kt").read_text()
          call_handler = main.split("onCallClick = {", 1)[1].split("onMenuAction =", 1)[0]
          assert "startLiveVoiceCall()" in call_handler, "Chat call button must launch Night Live Voice"

          assert "delay(2 * 60 * 1000L)" not in main, "Night must not use the removed 2-minute idle summary checkpoint"
          assert "NightSummaryPolicy.CHECKPOINT_INTERVAL_MS" in main, "Night chat must use the shared five-minute summary policy"
          assert 'screen = "integrations"' in main, "Night settings must route through the unified Integrations hub"

          providers = Path("whatsapp-ai-android/app/src/main/java/com/example/whatsapp/presentation/profile/NightProvidersScreen.kt").read_text()
          assert "private fun ProviderBottomSheet" in providers and providers.count("ProviderBottomSheet(") >= 5, "Provider, key and model editing must use compact bottom sheets"
          assert '"Integrations"' not in providers, "Integrations belongs in You, separate from AI & providers"
          assert '"MCP servers"' not in providers and '"Extensions"' not in providers, "Providers settings must not split MCP and Extensions into separate entries"

          agent_tools = Path("whatsapp-ai-android/app/src/main/java/com/example/whatsapp/data/night/NightAgentTools.kt").read_text()
          assert "NightIntegrationToolRegistry" in agent_tools, "Agent tools must use the shared integration facade"
          assert 'name.startsWith("ext__")' not in agent_tools, "Agent side-effect policy must not special-case extension name prefixes"

          emoji_recents = Path("whatsapp-ai-android/app/src/main/java/com/example/whatsapp/presentation/chatscreen/NightEmojiRecents.kt").read_text()
          assert "MAX_RECENTS = 30" in emoji_recents, "Night emoji Recent must stay capped at the last 30 used emoji"

          chat = Path("whatsapp-ai-android/app/src/main/java/com/example/whatsapp/presentation/chatscreen/CurrentWhatsAppChat.kt").read_text()
          assert "WhatsAppInlineMessageText" in chat and "appendInlineContent(metaId" in chat, "Text-message timestamps must stay inline with WhatsApp-style trailing metadata"
          assert "NightFluentEmojiGlyph" in chat and "NightFluentEmoji.tokenize" in chat, "Chat and picker must share the Fluent emoji renderer and arbitrary-Unicode tokenizer"

          fluent_emoji = Path("whatsapp-ai-android/app/src/main/java/com/example/whatsapp/presentation/chatscreen/NightFluentEmoji.kt").read_text()
          assert "fluentui-emoji-unicode" in fluent_emoji and "_color.svg" in fluent_emoji, "Night must resolve non-bundled emoji through the Fluent unicode asset path"
          assert "BreakIterator.getCharacterInstance()" in fluent_emoji, "Night Fluent emoji rendering must preserve grapheme clusters and ZWJ sequences"

          theme = Path("whatsapp-ai-android/app/src/main/java/com/example/whatsapp/ui/theme/Theme.kt").read_text()
          assert "accentColor: Color? = null" in theme, "Night Material theme must accept the saved accent"
          assert "primary = effectiveAccent" in theme, "Night Material primary color must come from the active appearance accent"
          assert 'accentColor = ComposeColor(current.accentColor.toInt())' in main, "Night root must apply the persisted accent"
          assert "MaterialTheme.colorScheme.primary" in Path("whatsapp-ai-android/app/src/main/java/com/example/whatsapp/presentation/chatscreen/RichResultBubbles.kt").read_text(), "Rich action controls must consume the current accent"

          assert '.padding(end = 18.dp, bottom = 116.dp)' in shell, "Night FAB must keep clearance above the bottom bar"
          assert 'contentDescription = "New chat FAB"' in shell, "Night FAB bounds must remain testable on Android 16"
          PY

      - name: Run unit tests and build integrated APK
        run: |
          cd whatsapp-ai-android
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :extensions:animepahe:testDebugUnitTest :app:assembleDebug :extensions:animepahe:assembleDebug --stacktrace
          UNIVERSAL_APK="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*universal*.apk' -print -quit)"
          test -n "$UNIVERSAL_APK"
          cp "$UNIVERSAL_APK" app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/

      - name: Upload integrated APK
        uses: actions/upload-artifact@v4
        with:
          name: night-integrated-apk
          path: whatsapp-ai-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload AnimePahe extension APK
        uses: actions/upload-artifact@v4
        with:
          name: night-animepahe-extension-apk
          path: whatsapp-ai-android/extensions/animepahe/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  android-16-provider:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android 36 emulator stack
        run: |
          SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/16.0/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" \
            "platform-tools" \
            "emulator" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "system-images;android-36;default;x86_64"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"
          echo "/usr/local/lib/android/sdk/emulator" >> "$GITHUB_PATH"

      - name: Add test Firebase config
        run: |
          cat > whatsapp-ai-android/app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "123456789012",
              "project_id": "night-provider-regression",
              "storage_bucket": "night-provider-regression.appspot.com"
            },
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:123456789012:android:0123456789abcdef",
                "android_client_info": {"package_name": "com.example.whatsapp"}
              },
              "oauth_client": [],
              "api_key": [{"current_key": "AIzaSyDUMMY_PREVIEW_KEY_NOT_FOR_NETWORK_USE"}],
              "services": {"appinvite_service": {"other_platform_oauth_client": []}}
            }],
            "configuration_version": "1"
          }
          JSON

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Exercise provider HTTP failover and Library bridge
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: default
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          emulator-boot-timeout: 420
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-boot-anim -accel on -wipe-data
          script: cd whatsapp-ai-android && chmod +x gradlew && ./gradlew :app:connectedDebugAndroidTest -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8" --max-workers=1 -Pandroid.testInstrumentationRunnerArguments.class=com.example.whatsapp.data.night.NightAiGatewayProviderInstrumentedTest,com.example.whatsapp.data.night.NightChatHistoryInstrumentedTest,com.example.whatsapp.data.night.NightSpeechServiceInstrumentedTest,com.example.whatsapp.data.night.NightAppearanceControllerInstrumentedTest,com.example.whatsapp.data.night.NightLibraryIntegrationInstrumentedTest,com.example.whatsapp.data.night.NightProviderAdminInstrumentedTest,com.example.whatsapp.extensions.tools.NightMcpHttpBridgeInstrumentedTest,com.example.whatsapp.extensions.tools.NightExtensionToolIntegrationInstrumentedTest --stacktrace

      - name: Upload provider test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: night-provider-http-evidence
          path: |
            whatsapp-ai-android/app/build/reports/androidTests/
            whatsapp-ai-android/app/build/outputs/androidTest-results/
          if-no-files-found: warn

  android-16-ui:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        suite:
          - message-blocks
          - live-voice
          - extension-config
          - browser
          - memory
          - providers
          - mcp-servers
          - extensions
          - integrations
          - main-tabs
          - image-editor
          - pdf-editor
          - mihon-reader
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android 36 emulator stack
        run: |
          SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/16.0/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" \
            "platform-tools" \
            "emulator" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "system-images;android-36;default;x86_64"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"
          echo "/usr/local/lib/android/sdk/emulator" >> "$GITHUB_PATH"

      - name: Prime ADB
        run: |
          ADB="/usr/local/lib/android/sdk/platform-tools/adb"
          "$ADB" kill-server >/dev/null 2>&1 || true
          "$ADB" start-server
          "$ADB" devices -l

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Download integrated APK
        uses: actions/download-artifact@v4
        with:
          name: night-integrated-apk
          path: night-integrated-apk

      - name: Stage APK for selected suite
        run: |
          mkdir -p whatsapp-ai-android/app/build/outputs/apk/debug
          cp night-integrated-apk/app-debug.apk whatsapp-ai-android/app/build/outputs/apk/debug/app-debug.apk
          case "${{ matrix.suite }}" in
            message-blocks)
              mkdir -p night-message-blocks-apk
              cp night-integrated-apk/app-debug.apk night-message-blocks-apk/app-debug.apk
              ;;
            live-voice)
              ;;
            extension-config)
              ;;
            browser)
              ;;
            memory)
              ;;
            providers)
              ;;
            mcp-servers)
              ;;
            extensions)
              ;;
            integrations)
              ;;
            main-tabs)
              ;;
            image-editor)
              mkdir -p night-image-editor-apk
              cp night-integrated-apk/app-debug.apk night-image-editor-apk/app-debug.apk
              ;;
            pdf-editor)
              mkdir -p night-pdf-editor-apk
              cp night-integrated-apk/app-debug.apk night-pdf-editor-apk/app-debug.apk
              ;;
            mihon-reader)
              ;;
            *)
              echo "Unknown UI suite: ${{ matrix.suite }}" >&2
              exit 2
              ;;
          esac

      - name: Exercise selected Night UI suite
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: default
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          emulator-boot-timeout: 420
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-boot-anim -accel on -wipe-data
          script: bash .github/scripts/night-${{ matrix.suite }}-interaction.sh

      - name: Upload selected UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: night-integrated-${{ matrix.suite }}-evidence
          path: |
            night-message-blocks-artifacts/
            night-live-voice-artifacts/
            night-extension-config-artifacts/
            night-browser-artifacts/
            night-memory-artifacts/
            night-providers-artifacts/
            night-mcp-servers-artifacts/
            night-extensions-artifacts/
            night-integrations-artifacts/
            night-main-tabs-artifacts/
            night-image-editor-artifacts/
            night-pdf-editor-artifacts/
            mihon-interaction-artifacts/
          if-no-files-found: warn

  android-16-video:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android 36 emulator stack
        run: |
          SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/16.0/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" \
            "platform-tools" \
            "emulator" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "system-images;android-36;default;x86_64"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"
          echo "/usr/local/lib/android/sdk/emulator" >> "$GITHUB_PATH"

      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Generate real MP4 fixture
        run: |
          mkdir -p night-video-interaction-artifacts
          cat >/tmp/night-video-subtitles.srt <<'SRT'
          1
          00:00:01,000 --> 00:00:05,000
          Night subtitle one

          2
          00:00:10,000 --> 00:00:15,000
          Night subtitle two

          3
          00:00:22,000 --> 00:00:29,000
          Night subtitle three
          SRT

          ffmpeg -hide_banner -loglevel error -y \
            -f lavfi -i "testsrc2=size=640x360:rate=30" \
            -f lavfi -i "sine=frequency=660:sample_rate=44100" \
            -i /tmp/night-video-subtitles.srt \
            -t 30 \
            -map 0:v:0 -map 1:a:0 -map 2:s:0 \
            -c:v libx264 -preset ultrafast -profile:v baseline -level 3.0 \
            -pix_fmt yuv420p -g 30 \
            -c:a aac -b:a 96k \
            -c:s mov_text \
            -metadata:s:a:0 title="Night test audio" \
            -metadata:s:a:0 handler_name="Night test audio" \
            -metadata:s:s:0 title="Night test subtitle" \
            -metadata:s:s:0 handler_name="Night test subtitle" \
            -movflags +faststart \
            /tmp/night-real-video.mp4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Download integrated APK
        uses: actions/download-artifact@v4
        with:
          name: night-integrated-apk
          path: whatsapp-ai-android/app/build/outputs/apk/debug

      - name: Exercise integrated Night video path
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: default
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          emulator-boot-timeout: 420
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-boot-anim -accel on -wipe-data
          script: bash .github/scripts/night-video-interaction.sh

      - name: Upload integrated video evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: night-integrated-video-evidence
          path: night-video-interaction-artifacts/
          if-no-files-found: warn
