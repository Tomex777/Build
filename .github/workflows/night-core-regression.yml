name: Night Integrated Regression

on:
  push:
    branches:
      - night-groq-key-pool-ci
    paths:
      - "whatsapp-ai-android/**"
      - ".github/workflows/night-core-regression.yml"
      - ".github/scripts/night-image-editor-interaction.sh"
      - ".github/scripts/night-message-blocks-interaction.sh"
      - ".github/scripts/night-mihon-reader-interaction.sh"
      - ".github/scripts/night-pdf-editor-interaction.sh"
      - ".github/scripts/night-video-interaction.sh"
  workflow_dispatch:

concurrency:
  group: night-integrated-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android 36 SDK
        run: |
          SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/16.0/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Add test Firebase config
        run: |
          cat > whatsapp-ai-android/app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "123456789012",
              "project_id": "night-integrated-regression",
              "storage_bucket": "night-integrated-regression.appspot.com"
            },
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:123456789012:android:0123456789abcdef",
                "android_client_info": {"package_name": "com.example.whatsapp"}
              },
              "oauth_client": [],
              "api_key": [{"current_key": "AIzaSyDUMMY_PREVIEW_KEY_NOT_FOR_NETWORK_USE"}],
              "services": {"appinvite_service": {"other_platform_oauth_client": []}}
            }],
            "configuration_version": "1"
          }
          JSON

      - name: Guard Night invariants
        run: |
          grep -q 'minSdk = 26' whatsapp-ai-android/app/build.gradle.kts
          PDF="whatsapp-ai-android/app/src/main/java/com/example/whatsapp/presentation/chatscreen/NightPdfViewerScreen.kt"
          ! grep -q "ModalBottomSheet" "$PDF"
          grep -q 'contentDescription = "PDF full screen viewer"' "$PDF"

      - name: Run unit tests and build integrated APK
        run: |
          cd whatsapp-ai-android
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Upload integrated APK
        uses: actions/upload-artifact@v4
        with:
          name: night-integrated-apk
          path: whatsapp-ai-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  android-16-core:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android 36 emulator stack
        run: |
          SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/16.0/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" \
            "platform-tools" \
            "emulator" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "system-images;android-36;default;x86_64"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"
          echo "/usr/local/lib/android/sdk/emulator" >> "$GITHUB_PATH"

      - name: Prime ADB
        run: |
          ADB="/usr/local/lib/android/sdk/platform-tools/adb"
          "$ADB" kill-server >/dev/null 2>&1 || true
          "$ADB" start-server
          "$ADB" devices -l

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Download APK for UI suites
        uses: actions/download-artifact@v4
        with:
          name: night-integrated-apk
          path: night-integrated-apk

      - name: Stage APK for existing Night harnesses
        run: |
          mkdir -p night-image-editor-apk night-message-blocks-apk night-pdf-editor-apk
          mkdir -p whatsapp-ai-android/app/build/outputs/apk/debug
          cp night-integrated-apk/app-debug.apk night-image-editor-apk/app-debug.apk
          cp night-integrated-apk/app-debug.apk night-message-blocks-apk/app-debug.apk
          cp night-integrated-apk/app-debug.apk night-pdf-editor-apk/app-debug.apk
          cp night-integrated-apk/app-debug.apk whatsapp-ai-android/app/build/outputs/apk/debug/app-debug.apk

      - name: Exercise integrated Night UI and readers
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: default
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          emulator-boot-timeout: 420
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-boot-anim -accel on -wipe-data
          script: |
            bash .github/scripts/night-message-blocks-interaction.sh
            bash .github/scripts/night-image-editor-interaction.sh
            bash .github/scripts/night-pdf-editor-interaction.sh
            bash .github/scripts/night-mihon-reader-interaction.sh

      - name: Upload integrated UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: night-integrated-ui-evidence
          path: |
            night-message-blocks-artifacts/
            night-image-editor-artifacts/
            night-pdf-editor-artifacts/
            mihon-interaction-artifacts/
          if-no-files-found: warn

  android-16-video:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android 36 emulator stack
        run: |
          SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/16.0/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" \
            "platform-tools" \
            "emulator" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "system-images;android-36;default;x86_64"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"
          echo "/usr/local/lib/android/sdk/emulator" >> "$GITHUB_PATH"

      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Generate real MP4 fixture
        run: |
          mkdir -p night-video-interaction-artifacts
          cat >/tmp/night-video-subtitles.srt <<'SRT'
          1
          00:00:01,000 --> 00:00:05,000
          Night subtitle one

          2
          00:00:10,000 --> 00:00:15,000
          Night subtitle two

          3
          00:00:22,000 --> 00:00:29,000
          Night subtitle three
          SRT

          ffmpeg -hide_banner -loglevel error -y \
            -f lavfi -i "testsrc2=size=640x360:rate=30" \
            -f lavfi -i "sine=frequency=660:sample_rate=44100" \
            -i /tmp/night-video-subtitles.srt \
            -t 30 \
            -map 0:v:0 -map 1:a:0 -map 2:s:0 \
            -c:v libx264 -preset ultrafast -profile:v baseline -level 3.0 \
            -pix_fmt yuv420p -g 30 \
            -c:a aac -b:a 96k \
            -c:s mov_text \
            -metadata:s:a:0 title="Night test audio" \
            -metadata:s:a:0 handler_name="Night test audio" \
            -metadata:s:s:0 title="Night test subtitle" \
            -metadata:s:s:0 handler_name="Night test subtitle" \
            -movflags +faststart \
            /tmp/night-real-video.mp4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Download integrated APK
        uses: actions/download-artifact@v4
        with:
          name: night-integrated-apk
          path: whatsapp-ai-android/app/build/outputs/apk/debug

      - name: Exercise integrated Night video path
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: default
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          emulator-boot-timeout: 420
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-boot-anim -accel on -wipe-data
          script: bash .github/scripts/night-video-interaction.sh

      - name: Upload integrated video evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: night-integrated-video-evidence
          path: night-video-interaction-artifacts/
          if-no-files-found: warn
