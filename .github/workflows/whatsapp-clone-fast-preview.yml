name: WhatsApp Clone Fast Screenshots

on:
  push:
    branches:
      - whatsapp-clone-fast-preview
    paths:
      - ".github/workflows/whatsapp-clone-fast-preview.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: whatsapp-clone-fast-preview
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4

      - name: Checkout original clone
        uses: actions/checkout@v4
        with:
          repository: Muhammad-bilal-503/WhatsApp-Clone
          ref: main
          path: donor

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          test -x "$ANDROID_HOME/platform-tools/adb"
          "$ANDROID_HOME/platform-tools/adb" version

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Prepare original clone preview
        shell: bash
        run: |
          mkdir -p whatsapp-clone-fast-preview

          cat > donor/app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "123456789012",
              "project_id": "whatsapp-clone-preview",
              "storage_bucket": "whatsapp-clone-preview.appspot.com"
            },
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:123456789012:android:0123456789abcdef",
                "android_client_info": {"package_name": "com.example.whatsapp"}
              },
              "oauth_client": [],
              "api_key": [{"current_key": "AIzaSyDUMMY_PREVIEW_KEY_NOT_FOR_NETWORK_USE"}],
              "services": {"appinvite_service": {"other_platform_oauth_client": []}}
            }],
            "configuration_version": "1"
          }
          JSON

          cat > donor/app/src/main/java/com/example/whatsapp/PreviewActivity.kt <<'KOTLIN'
          package com.example.whatsapp

          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.activity.enableEdgeToEdge
          import androidx.compose.foundation.background
          import androidx.compose.foundation.layout.Arrangement
          import androidx.compose.foundation.layout.Column
          import androidx.compose.foundation.layout.fillMaxSize
          import androidx.compose.foundation.layout.fillMaxWidth
          import androidx.compose.foundation.layout.padding
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.items
          import androidx.compose.runtime.getValue
          import androidx.compose.runtime.mutableStateOf
          import androidx.compose.runtime.remember
          import androidx.compose.runtime.setValue
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.unit.dp
          import com.example.whatsapp.models.Message
          import com.example.whatsapp.presentation.chatscreen.ChatInputBar
          import com.example.whatsapp.presentation.chatscreen.ChatTopBar
          import com.example.whatsapp.presentation.chatscreen.EmojiPicker
          import com.example.whatsapp.presentation.chatscreen.MessageBubble
          import com.example.whatsapp.presentation.chatscreen.SecurityBanner
          import com.example.whatsapp.ui.theme.WhatsappTheme

          class PreviewActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  enableEdgeToEdge()

                  val showEmoji = intent.getBooleanExtra("showEmoji", false)

                  setContent {
                      WhatsappTheme(darkTheme = false) {
                          var messageText by remember { mutableStateOf("") }
                          val now = System.currentTimeMillis()
                          val messages = listOf(
                              Message("friend", "Hey! Are you still coming later?", now - 240000),
                              Message("me", "Yeah, I’ll be there. Give me like 20 minutes.", now - 180000),
                              Message("friend", "Okay 😂 don’t take forever.", now - 120000),
                              Message("me", "I’m already leaving 😭", now - 60000),
                          )

                          Column(
                              modifier = Modifier
                                  .fillMaxSize()
                                  .background(Color(0xFFECE5DD))
                          ) {
                              ChatTopBar(
                                  contactName = "Muhammad Ahmad",
                                  phoneNumber = "+1234567890",
                                  onBackClick = {},
                                  onCallClick = {},
                              )

                              SecurityBanner()

                              LazyColumn(
                                  modifier = Modifier
                                      .weight(1f)
                                      .fillMaxWidth()
                                      .padding(horizontal = 8.dp),
                                  verticalArrangement = Arrangement.spacedBy(4.dp),
                              ) {
                                  items(messages) { message ->
                                      MessageBubble(
                                          message = message,
                                          isSentByMe = message.senderPhoneNumber == "me",
                                          onLongPress = {},
                                      )
                                  }
                              }

                              ChatInputBar(
                                  messageText = messageText,
                                  onMessageTextChange = { messageText = it },
                                  onSendClick = {},
                                  onAttachmentClick = {},
                                  onCameraClick = {},
                                  onMicClick = {},
                                  onEmojiClick = {},
                              )

                              if (showEmoji) {
                                  EmojiPicker(
                                      onEmojiSelected = {},
                                      onDismiss = {},
                                  )
                              }
                          }
                      }
                  }
              }
          }
          KOTLIN

          python3 - <<'PY'
          from pathlib import Path
          p = Path("donor/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          marker = '        <activity\n            android:name=".MainActivity"'
          insert = '''        <activity
              android:name=".PreviewActivity"
              android:exported="true"
              android:theme="@style/Theme.Whatsapp" />
          <activity
              android:name=".MainActivity"'''
          if marker not in s:
              raise SystemExit("manifest marker not found")
          p.write_text(s.replace(marker, insert, 1))
          PY

      - name: Build original clone
        shell: bash
        run: |
          cd donor
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace

      - name: Capture donor screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          emulator-boot-timeout: 420
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -accel on -wipe-data
          script: |
            adb wait-for-device
            adb install --no-streaming -r donor/app/build/outputs/apk/debug/app-debug.apk
            adb shell wm size 1080x2160
            adb shell wm density 420

            adb shell am force-stop com.example.whatsapp
            adb shell am start -W -n com.example.whatsapp/.PreviewActivity
            sleep 4
            adb exec-out screencap -p > whatsapp-clone-fast-preview/original-chat.png

            adb shell am force-stop com.example.whatsapp
            adb shell am start -W -n com.example.whatsapp/.PreviewActivity --ez showEmoji true
            sleep 3
            adb exec-out screencap -p > whatsapp-clone-fast-preview/original-chat-emoji.png

      - name: Commit screenshots
        if: always()
        shell: bash
        run: |
          git fetch origin whatsapp-clone-fast-preview
          git reset --hard origin/whatsapp-clone-fast-preview
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add whatsapp-clone-fast-preview || true
          git diff --cached --quiet && exit 0
          git commit -m "Add original WhatsApp clone screenshots"
          git push origin HEAD:whatsapp-clone-fast-preview

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: whatsapp-clone-fast-preview
          path: whatsapp-clone-fast-preview/*.png
          if-no-files-found: warn
