name: Annie CI

on:
  push:
    branches: [annie-media-ci]
  pull_request:
    branches: [annie-media-ci]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run check
