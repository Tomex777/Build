name: Night Core Android 16 Security CI

on:
  push:
    branches:
      - nightmods-ci
    paths:
      - 'nightmods/nightcore/**'
      - 'nightmods/ci/prepare-libxposed-100.sh'
      - '.github/workflows/nightmods-security-ci.yml'
  workflow_dispatch:

jobs:
  provider-security:
    name: Verify manager-only provider and cold restart
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Install Android SDKs
        shell: bash
        run: |
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-33" "build-tools;33.0.1" "build-tools;33.0.2" "platforms;android-36" "build-tools;36.0.0"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
      - name: Publish exact libxposed API/service 100 locally
        shell: bash
        run: bash nightmods/ci/prepare-libxposed-100.sh
      - name: Build Night Core and security probes
        working-directory: nightmods/nightcore
        run: |
          gradle --no-daemon --stacktrace \
            :app:assembleDebug \
            :manager-probe:assembleDebug \
            :target-probe:assembleDebug \
            :attacker-probe:assembleDebug
      - name: Verify APK identities
        shell: bash
        run: |
          AAPT="${ANDROID_SDK_ROOT}/build-tools/36.0.0/aapt"
          CORE="$(find nightmods/nightcore/app/build/outputs -type f -name '*.apk' -print -quit)"
          MANAGER="$(find nightmods/nightcore/manager-probe/build/outputs -type f -name '*.apk' -print -quit)"
          TARGET="$(find nightmods/nightcore/target-probe/build/outputs -type f -name '*.apk' -print -quit)"
          ATTACKER="$(find nightmods/nightcore/attacker-probe/build/outputs -type f -name '*.apk' -print -quit)"
          "$AAPT" dump badging "$CORE" | grep -q "package: name='dev.nightmods.core'"
          "$AAPT" dump badging "$MANAGER" | grep -q "package: name='org.lsposed.manager'"
          "$AAPT" dump badging "$TARGET" | grep -q "package: name='com.whatsapp'"
          "$AAPT" dump badging "$ATTACKER" | grep -q "package: name='dev.nightmods.attacker'"
          sha256sum "$CORE" "$MANAGER" "$TARGET" "$ATTACKER" | tee security-apk-sha256.txt
      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          sudo chmod 666 /dev/kvm || true
      - name: Verify provider authorization on Android 16
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            mkdir -p security-smoke
            adb wait-for-device
            test "$(adb shell getprop ro.build.version.sdk | tr -d '\r')" = "36"
            adb install -r "$(find nightmods/nightcore/app/build/outputs -type f -name '*.apk' -print -quit)"
            adb install -r "$(find nightmods/nightcore/manager-probe/build/outputs -type f -name '*.apk' -print -quit)"
            adb install -r "$(find nightmods/nightcore/target-probe/build/outputs -type f -name '*.apk' -print -quit)"
            adb install -r "$(find nightmods/nightcore/attacker-probe/build/outputs -type f -name '*.apk' -print -quit)"
            adb logcat -c

            adb shell am start -W -n org.lsposed.manager/org.lsposed.manager.MainActivity | tee security-smoke/manager-start.txt
            sleep 1
            adb shell run-as org.lsposed.manager cat shared_prefs/night_core_manager_probe.xml | tee security-smoke/manager-result.xml
            grep -q 'name="success" value="true"' security-smoke/manager-result.xml

            adb shell am start -W -n com.whatsapp/com.whatsapp.MainActivity | tee security-smoke/target-start.txt
            sleep 1
            adb shell run-as com.whatsapp cat shared_prefs/night_core_probe.xml | tee security-smoke/target-result.xml
            grep -q 'name="access_denied" value="true"' security-smoke/target-result.xml
            grep -q 'name="settings_disclosed" value="false"' security-smoke/target-result.xml
            grep -q 'SecurityException' security-smoke/target-result.xml
            ! grep -q 'bubble_enabled' security-smoke/target-result.xml

            adb shell am start -W -n dev.nightmods.attacker/com.whatsapp.MainActivity | tee security-smoke/attacker-start.txt
            sleep 1
            adb shell run-as dev.nightmods.attacker cat shared_prefs/night_core_probe.xml | tee security-smoke/attacker-result.xml
            grep -q 'name="access_denied" value="true"' security-smoke/attacker-result.xml
            grep -q 'name="settings_disclosed" value="false"' security-smoke/attacker-result.xml
            grep -q 'SecurityException' security-smoke/attacker-result.xml

            adb shell pidof dev.nightmods.core | tee security-smoke/core-pid-before-kill.txt
            adb shell am kill dev.nightmods.core || true
            sleep 1
            adb shell pidof dev.nightmods.core | tee security-smoke/core-pid-after-kill.txt || true
            test ! -s security-smoke/core-pid-after-kill.txt
            adb shell run-as org.lsposed.manager rm -f shared_prefs/night_core_manager_probe.xml || true
            adb shell am force-stop org.lsposed.manager || true
            adb shell am start -W -n org.lsposed.manager/org.lsposed.manager.MainActivity | tee security-smoke/manager-cold-start.txt
            sleep 1
            adb shell run-as org.lsposed.manager cat shared_prefs/night_core_manager_probe.xml | tee security-smoke/manager-cold-result.xml
            grep -q 'name="success" value="true"' security-smoke/manager-cold-result.xml
            adb shell pidof dev.nightmods.core | tee security-smoke/core-pid-after-manager.txt
            test -s security-smoke/core-pid-after-manager.txt

            adb logcat -d > security-smoke/logcat.txt
            adb logcat -b crash -d > security-smoke/crash.txt || true
            test -z "$(grep -E 'dev\.nightmods\.core|org\.lsposed\.manager|com\.whatsapp|dev\.nightmods\.attacker' security-smoke/crash.txt || true)"
            echo 'Android 16 passed: manager-only provider enforced and manager bridge survives Night Core process death.'
      - name: Upload security evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Night-Core-Android16-security
          path: |
            security-smoke/**
            security-apk-sha256.txt
          if-no-files-found: warn
