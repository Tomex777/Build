name: AnimeOnsen browser playback

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/animeonsen-browser-playback.yml'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install browser and media tools
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Test AnimeOnsen real playback path
        shell: bash
        run: |
          mkdir -p diagnostics
          cat > animeonsen-probe.mjs <<'NODE'
          import { chromium } from 'playwright';
          import { spawn } from 'node:child_process';
          import http from 'node:http';
          import fs from 'node:fs';

          const BASE = 'https://www.animeonsen.xyz';
          const API = 'https://api.animeonsen.xyz/v4';
          const out = {
            page: {},
            api: {},
            chosen: {},
            stream: {},
            chromiumPlayback: {},
            ffprobe: {},
            ffmpegDecode: {}
          };

          const browser = await chromium.launch({
            headless: true,
            args: ['--autoplay-policy=no-user-gesture-required']
          });
          const context = await browser.newContext({
            viewport: { width: 1280, height: 720 },
            userAgent: 'Mozilla/5.0 (Linux; Android 16; SM-A165F) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Mobile Safari/537.36'
          });
          const page = await context.newPage();

          let apiHeader = null;
          let indexResponse = null;

          page.on('response', async (res) => {
            const u = res.url();
            if (!u.includes('api.animeonsen.xyz/v4/content/index')) return;
            try {
              const reqHeaders = await res.request().allHeaders();
              const auth = reqHeaders['authorization'];
              if (auth && !apiHeader) apiHeader = auth;
              if (!indexResponse && res.ok()) indexResponse = await res.json();
            } catch {}
          });

          const pageErrors = [];
          const consoleErrors = [];
          page.on('pageerror', e => pageErrors.push(String(e)));
          page.on('console', msg => {
            if (msg.type() === 'error') consoleErrors.push(msg.text());
          });

          const nav = await page.goto(BASE + '/', { waitUntil: 'domcontentloaded', timeout: 60000 });
          await page.waitForTimeout(12000);

          out.page = {
            status: nav?.status() ?? null,
            title: await page.title(),
            url: page.url(),
            pageErrors: pageErrors.slice(-20),
            consoleErrors: consoleErrors.slice(-30),
            detailsLinks: await page.locator('a[href*="/details/"]').count()
          };

          if (!apiHeader || !indexResponse?.content?.length) {
            out.api.failure = 'Browser did not obtain AnimeOnsen content API session';
            fs.writeFileSync('diagnostics/animeonsen-browser-playback.json', JSON.stringify(out,null,2));
            await browser.close();
            process.exit(2);
          }

          out.api.indexCount = indexResponse.content.length;
          out.api.indexSample = indexResponse.content.slice(0,8).map(x => ({
            content_id: x.content_id,
            title: x.content_title_en || x.content_title || x.content_title_jp
          }));

          const apiGet = async (path) => {
            return await page.evaluate(async ({ url, token }) => {
              const r = await fetch(url, {
                headers: {
                  'Authorization': token,
                  'Accept': 'application/json, text/plain, */*'
                }
              });
              return {
                status: r.status,
                contentType: r.headers.get('content-type'),
                text: await r.text()
              };
            }, { url: API + path, token: apiHeader });
          };

          let selected = null;
          for (const item of indexResponse.content.slice(0,20)) {
            const er = await apiGet('/content/' + encodeURIComponent(item.content_id) + '/episodes');
            if (er.status !== 200) continue;
            let eps;
            try { eps = JSON.parse(er.text); } catch { continue; }
            if (!eps || typeof eps !== 'object') continue;
            const keys = Object.keys(eps).sort((a,b) => {
              const aa = Number(a), bb = Number(b);
              if (Number.isFinite(aa) && Number.isFinite(bb)) return aa-bb;
              return a.localeCompare(b);
            });
            for (const ep of keys.slice(0,5)) {
              const vr = await apiGet('/content/' + encodeURIComponent(item.content_id) + '/video/' + encodeURIComponent(ep));
              if (vr.status !== 200) continue;
              let video;
              try { video = JSON.parse(vr.text); } catch { continue; }
              const stream = video?.uri?.stream;
              if (stream) {
                selected = { item, ep, episodeMeta: eps[ep], video, stream };
                break;
              }
            }
            if (selected) break;
          }

          if (!selected) {
            out.api.failure = 'No playable stream returned by current API';
            fs.writeFileSync('diagnostics/animeonsen-browser-playback.json', JSON.stringify(out,null,2));
            await browser.close();
            process.exit(3);
          }

          const { item, ep, episodeMeta, video, stream } = selected;
          const su = new URL(stream);
          out.chosen = {
            contentId: item.content_id,
            title: item.content_title_en || item.content_title || item.content_title_jp,
            episode: ep,
            episodeMeta,
            subtitleLanguages: Object.values(video?.metadata?.subtitles || {})
          };
          out.stream = {
            host: su.host,
            pathname: su.pathname,
            queryKeys: [...su.searchParams.keys()].sort()
          };

          // Actual MPEG-DASH playback from the AnimeOnsen origin using dash.js.
          // Chromium does not natively understand .mpd when assigned directly to <video>.
          const cdnResponses = [];
          const cdnFailures = [];
          const onResponse = async (res) => {
            if (!res.url().includes('cdn.animeonsen.xyz/')) return;
            const u = new URL(res.url());
            cdnResponses.push({
              status: res.status(),
              resourceType: res.request().resourceType(),
              path: u.pathname,
              contentType: (await res.allHeaders())['content-type'] || null
            });
          };
          const onFailed = (req) => {
            if (!req.url().includes('cdn.animeonsen.xyz/')) return;
            const u = new URL(req.url());
            cdnFailures.push({
              resourceType: req.resourceType(),
              path: u.pathname,
              failure: req.failure()?.errorText || null
            });
          };
          page.on('response', onResponse);
          page.on('requestfailed', onFailed);

          await page.addScriptTag({ url: 'https://cdn.dashjs.org/latest/modern/umd/dash.all.min.js' });

          const playback = await page.evaluate(async (src) => {
            const metrics = {
              events: [],
              dashEvents: [],
              samples: [],
              error: null,
              started: false,
              ended: false
            };

            const v = document.createElement('video');
            v.muted = true;
            v.autoplay = true;
            v.playsInline = true;
            v.preload = 'auto';
            v.controls = false;
            v.style.cssText='position:fixed;width:640px;height:360px;left:0;top:0;z-index:999999;background:black';
            document.body.appendChild(v);

            const mark = (name) => metrics.events.push({
              name,
              at: performance.now(),
              currentTime: v.currentTime,
              readyState: v.readyState,
              networkState: v.networkState
            });
            for (const e of ['loadstart','loadedmetadata','loadeddata','canplay','playing','waiting','stalled','suspend','seeking','seeked','ended','error']) {
              v.addEventListener(e, () => mark(e));
            }

            const player = window.dashjs.MediaPlayer().create();
            const de = window.dashjs.MediaPlayer.events;
            for (const ev of [
              de.ERROR, de.PLAYBACK_STALLED, de.PLAYBACK_WAITING,
              de.BUFFER_EMPTY, de.BUFFER_LOADED, de.FRAGMENT_LOADING_ABANDONED,
              de.FRAGMENT_LOADING_COMPLETED, de.MANIFEST_LOADED,
              de.STREAM_INITIALIZED, de.QUALITY_CHANGE_RENDERED
            ].filter(Boolean)) {
              player.on(ev, e => {
                const clean = { event: ev, at: performance.now() };
                if (e?.error) clean.error = String(e.error);
                if (e?.event?.message) clean.message = String(e.event.message);
                if (e?.mediaType) clean.mediaType = e.mediaType;
                if (e?.newQuality != null) clean.newQuality = e.newQuality;
                metrics.dashEvents.push(clean);
              });
            }

            player.updateSettings({
              streaming: {
                buffer: {
                  stableBufferTime: 20,
                  bufferTimeAtTopQuality: 20
                }
              }
            });

            player.initialize(v, src, true);

            const start = performance.now();
            for (let i=0;i<30;i++) {
              await new Promise(r => setTimeout(r, 2000));
              let quality = null;
              try {
                const q=v.getVideoPlaybackQuality?.();
                if (q) quality={
                  totalVideoFrames:q.totalVideoFrames,
                  droppedVideoFrames:q.droppedVideoFrames,
                  corruptedVideoFrames:q.corruptedVideoFrames
                };
              } catch {}
              metrics.samples.push({
                wallSeconds:(performance.now()-start)/1000,
                currentTime:v.currentTime,
                paused:v.paused,
                readyState:v.readyState,
                networkState:v.networkState,
                buffered:Array.from({length:v.buffered.length},(_,i)=>[v.buffered.start(i),v.buffered.end(i)]),
                width:v.videoWidth,
                height:v.videoHeight,
                quality
              });
              if (v.error) {
                metrics.error = {code:v.error.code,message:v.error.message};
                break;
              }
              if (v.ended) { metrics.ended=true; break; }
              if (!metrics.started && !v.paused && v.currentTime > 0) metrics.started=true;
            }

            metrics.duration=Number.isFinite(v.duration) ? v.duration : null;
            metrics.finalCurrentTime=v.currentTime;
            metrics.waitingCount=metrics.events.filter(x=>x.name==='waiting').length;
            metrics.stalledCount=metrics.events.filter(x=>x.name==='stalled').length;
            metrics.seekCount=metrics.events.filter(x=>x.name==='seeking').length;
            try {
              metrics.dashQuality = {
                video: player.getQualityFor('video'),
                audio: player.getQualityFor('audio')
              };
            } catch {}
            player.destroy();
            return metrics;
          }, stream);

          page.off('response', onResponse);
          page.off('requestfailed', onFailed);

          const summarizeCdn = (rows) => {
            const map = new Map();
            for (const x of rows) {
              const key = [x.status ?? 'FAIL', x.resourceType, x.contentType ?? '', x.path.split('/').slice(-1)[0]].join('|');
              const old = map.get(key) || {...x, count:0};
              old.count++;
              map.set(key, old);
            }
            return [...map.values()].slice(0,100);
          };

          out.chromiumPlayback = playback;
          out.stream.cdnResponses = summarizeCdn(cdnResponses);
          out.stream.cdnFailures = cdnFailures.slice(0,100);

          // Fetch the MPD inside the real site origin to inspect offered representations.
          const manifestSummary = await page.evaluate(async (src) => {
            try {
              const r=await fetch(src);
              const text=await r.text();
              const doc=new DOMParser().parseFromString(text,'application/xml');
              const reps=[...doc.querySelectorAll('Representation')].map(x=>({
                id:x.getAttribute('id'),
                mimeType:x.getAttribute('mimeType') || x.parentElement?.getAttribute('mimeType'),
                codecs:x.getAttribute('codecs') || x.parentElement?.getAttribute('codecs'),
                bandwidth:x.getAttribute('bandwidth'),
                width:x.getAttribute('width'),
                height:x.getAttribute('height'),
                frameRate:x.getAttribute('frameRate') || x.parentElement?.getAttribute('frameRate'),
                audioSamplingRate:x.getAttribute('audioSamplingRate')
              }));
              return {status:r.status,contentType:r.headers.get('content-type'),representations:reps};
            } catch(e) {
              return {error:String(e)};
            }
          }, stream);
          out.stream.manifestSummary = manifestSummary;
          out.chromiumPlayback.codecSupport = await page.evaluate(() => ({
            h264: MediaSource.isTypeSupported('video/mp4; codecs="avc1.4d401f"'),
            aac: MediaSource.isTypeSupported('audio/mp4; codecs="mp4a.40.2"')
          }));

          // Proxy CDN requests through the live AnimeOnsen browser origin.
          // This preserves the site's accepted request context while letting ffprobe/ffmpeg
          // validate the actual DASH bytes and timestamp continuity.
          const proxyStats = [];
          const browserFetch = async (url, range) => {
            return await page.evaluate(async ({url, range}) => {
              const headers = {};
              if (range) headers['Range'] = range;
              const r = await fetch(url, { headers });
              const arr = new Uint8Array(await r.arrayBuffer());
              let binary = '';
              const chunk = 0x8000;
              for (let i=0;i<arr.length;i+=chunk) {
                binary += String.fromCharCode(...arr.subarray(i, i+chunk));
              }
              return {
                status:r.status,
                contentType:r.headers.get('content-type'),
                contentRange:r.headers.get('content-range'),
                acceptRanges:r.headers.get('accept-ranges'),
                cacheControl:r.headers.get('cache-control'),
                body:btoa(binary)
              };
            }, {url, range});
          };

          const proxy = http.createServer((req,res) => {
            (async () => {
              const target = 'https://cdn.animeonsen.xyz' + req.url;
              const rr = await browserFetch(target, req.headers['range'] || null);
              const body = Buffer.from(rr.body, 'base64');
              res.statusCode = rr.status;
              if (rr.contentType) res.setHeader('Content-Type', rr.contentType);
              if (rr.contentRange) res.setHeader('Content-Range', rr.contentRange);
              if (rr.acceptRanges) res.setHeader('Accept-Ranges', rr.acceptRanges);
              res.setHeader('Content-Length', body.length);
              res.end(body);
              proxyStats.push({
                status:rr.status,
                path:new URL(target).pathname,
                range:req.headers['range'] || null,
                bytes:body.length,
                contentType:rr.contentType
              });
            })().catch(err => {
              res.statusCode=502;
              res.end(String(err));
              proxyStats.push({status:502,path:req.url,error:String(err)});
            });
          });
          await new Promise(resolve => proxy.listen(0,'127.0.0.1',resolve));
          const port = proxy.address().port;
          const proxyUrl = 'http://127.0.0.1:' + port + su.pathname + su.search;

          const runCmd = (cmd,args,timeoutMs) => new Promise(resolve => {
            const child=spawn(cmd,args);
            let stdout='',stderr='',timedOut=false;
            child.stdout.on('data',d=>stdout+=d.toString());
            child.stderr.on('data',d=>stderr+=d.toString());
            const timer=setTimeout(()=>{timedOut=true;child.kill('SIGKILL');},timeoutMs);
            child.on('close',(code,signal)=>{
              clearTimeout(timer);
              resolve({exitCode:code,signal,stdout,stderr,timedOut});
            });
          });

          const probe = await runCmd('ffprobe',[
            '-v','error',
            '-show_streams','-show_format','-of','json',proxyUrl
          ],120000);

          out.ffprobe.exitCode = probe.exitCode;
          out.ffprobe.timedOut = probe.timedOut;
          out.ffprobe.stderr = (probe.stderr || '').slice(-6000);
          try {
            const p=JSON.parse(probe.stdout || '{}');
            out.ffprobe.format = Object.fromEntries(
              ['format_name','duration','size','bit_rate','start_time'].map(k=>[k,p.format?.[k] ?? null])
            );
            out.ffprobe.streams=(p.streams||[]).map(s=>({
              index:s.index,codec_name:s.codec_name,codec_type:s.codec_type,profile:s.profile,
              width:s.width,height:s.height,r_frame_rate:s.r_frame_rate,avg_frame_rate:s.avg_frame_rate,
              time_base:s.time_base,start_time:s.start_time,duration:s.duration,bit_rate:s.bit_rate
            }));
          } catch {}

          const dec = await runCmd('ffmpeg',[
            '-nostdin','-hide_banner','-loglevel','warning',
            '-i',proxyUrl,'-t','120',
            '-map','0:v:0?','-map','0:a:0?','-f','null','-'
          ],240000);
          out.ffmpegDecode = {
            firstWindowSeconds:120,
            exitCode:dec.exitCode,
            signal:dec.signal,
            timedOut:dec.timedOut,
            warnings:(dec.stderr || '').slice(-14000)
          };

          // Decode a later 60-second window too; this catches issues that only show after seeking.
          const late = await runCmd('ffmpeg',[
            '-nostdin','-hide_banner','-loglevel','warning',
            '-ss','600','-i',proxyUrl,'-t','60',
            '-map','0:v:0?','-map','0:a:0?','-f','null','-'
          ],240000);
          out.ffmpegDecode.lateWindow = {
            seekSeconds:600,
            seconds:60,
            exitCode:late.exitCode,
            signal:late.signal,
            timedOut:late.timedOut,
            warnings:(late.stderr || '').slice(-14000)
          };

          // Packet timing stats across the first two minutes.
          const packets = await runCmd('ffprobe',[
            '-v','error','-read_intervals','%+120',
            '-show_packets',
            '-show_entries','packet=stream_index,pts_time,dts_time,duration_time',
            '-of','json',proxyUrl
          ],180000);
          out.ffmpegDecode.packetProbeExit = packets.exitCode;
          if (packets.exitCode === 0) {
            try {
              const rows=JSON.parse(packets.stdout || '{}').packets || [];
              const by={};
              for (const row of rows) {
                const raw=row.dts_time ?? row.pts_time;
                const t=Number(raw);
                if (!Number.isFinite(t)) continue;
                const k=String(row.stream_index);
                (by[k] ||= []).push(t);
              }
              const stats={};
              for (const [k,ts] of Object.entries(by)) {
                const fwd=[];
                let backwards=0;
                for (let i=1;i<ts.length;i++) {
                  const d=ts[i]-ts[i-1];
                  if (d < -0.0001) backwards++;
                  else fwd.push(d);
                }
                stats[k]={
                  packets:ts.length,
                  backwardTimestampCount:backwards,
                  maxForwardGapSeconds:fwd.length?Math.max(...fwd):null
                };
              }
              out.ffmpegDecode.timestampStats=stats;
            } catch(e) {
              out.ffmpegDecode.packetParseError=String(e);
            }
          } else {
            out.ffmpegDecode.packetProbeStderr=(packets.stderr || '').slice(-6000);
          }

          const grouped={};
          for (const x of proxyStats) {
            const file=(x.path||'').split('/').pop();
            const key=[x.status,file,x.range?'range':'full',x.contentType||''].join('|');
            if (!grouped[key]) grouped[key]={status:x.status,file,mode:x.range?'range':'full',contentType:x.contentType,count:0,totalBytes:0};
            grouped[key].count++;
            grouped[key].totalBytes += x.bytes || 0;
          }
          out.stream.proxyStats=Object.values(grouped).slice(0,150);
          await new Promise(resolve => proxy.close(resolve));

          fs.writeFileSync('diagnostics/animeonsen-browser-playback.json', JSON.stringify(out,null,2));
          console.log(JSON.stringify(out,null,2).slice(0,90000));
          await browser.close();
          NODE

          node animeonsen-probe.mjs

      - name: Commit result
        if: always()
        run: |
          test -f diagnostics/animeonsen-browser-playback.json || echo '{"error":"probe did not produce result"}' > diagnostics/animeonsen-browser-playback.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add diagnostics/animeonsen-browser-playback.json
          git commit -m "record AnimeOnsen browser playback diagnostics" || true
          git push || true
