name: Apply Sora Extension-Independent UI

on:
  workflow_dispatch:
  push:
    branches: [sora-android-ci]
    paths:
      - 'sora-ci/apply-extension-independent-ui.txt'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sora-android-ci
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply migration
        run: python sora-ci/patch_extension_independent_ui.py
      - name: Show diff
        run: git diff --check && git diff --stat && git diff -- sora-overlay/app/src/main/java/com/night/sora/ui/screens/MediaScreen.kt | head -240
      - name: Commit patched source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sora-overlay/app/src/main/java/com/night/sora/ui/screens/MediaScreen.kt \
                  sora-overlay/app/src/main/java/com/night/sora/ui/screens/HomeScreen.kt \
                  sora-overlay/app/src/main/java/com/night/sora/ui/screens/MediaDetailScreen.kt \
                  sora-overlay/app/src/main/java/com/night/sora/ui/SoraApp.kt
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
          else
            git commit -m 'make Sora UI extension-independent and instant'
            git push origin HEAD:sora-android-ci
          fi
