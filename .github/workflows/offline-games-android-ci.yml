name: Offline Games Android CI

on:
  push:
    branches: [feature/offline-100-games-android-foundation, feature/offline-native-first-games-20261020]
    paths:
      - "offline-games/**"
      - ".github/workflows/offline-games-android-ci.yml"
  pull_request:
    branches: [main, feature/offline-100-games-android-foundation]
    paths:
      - "offline-games/**"
      - ".github/workflows/offline-games-android-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Test native gameplay
        working-directory: offline-games
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Syntax-check all original offline games
        run: |
          set -euo pipefail
          for file in offline-games/app/src/main/assets/classics/*.js; do node --check "$file"; done
      - name: Verify playable-game registry
        run: node offline-games/verify-catalog.cjs
      - name: Verify old-WebView parse compatibility
        run: node offline-games/verify-webview.cjs
      - name: Build installable debug APK
        working-directory: offline-games
        run: gradle --no-daemon :app:assembleDebug
      - name: Confirm package, minSdk and offline arcade assets
        run: |
          set -euo pipefail
          APK=offline-games/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | tee /tmp/offline-badging.txt
          grep -q "package: name='com.night.offlinegames'" /tmp/offline-badging.txt
          grep -q "sdkVersion:'26'" /tmp/offline-badging.txt
          unzip -Z1 "$APK" | grep -q "assets/compat.js"
          unzip -Z1 "$APK" | grep -q "assets/arcade/games.js"
          unzip -Z1 "$APK" | grep -q "assets/arcade/style.css"
          unzip -Z1 "$APK" | grep -q "assets/arcade/index.html"
          unzip -Z1 "$APK" | grep -q "assets/game-shell.css"
          unzip -Z1 "$APK" | grep -q "assets/puzzles/index.html"
          unzip -Z1 "$APK" | grep -q "assets/puzzles/games.js"
          unzip -Z1 "$APK" | grep -q "assets/puzzles/core.js"
          unzip -Z1 "$APK" | grep -q "assets/puzzles/style.css"
          unzip -Z1 "$APK" | grep -q "assets/classics/index.html"
          unzip -Z1 "$APK" | grep -q "assets/classics/core.js"
          unzip -Z1 "$APK" | grep -q "assets/classics/puzzles.js"
          unzip -Z1 "$APK" | grep -q "assets/classics/boards.js"
          unzip -Z1 "$APK" | grep -q "assets/classics/cards.js"
          unzip -Z1 "$APK" | grep -q "assets/classics/arcades.js"
          unzip -Z1 "$APK" | grep -q "assets/classics/arcades2.js"
          unzip -Z1 "$APK" | grep -q "assets/classics/solitaires.js"
          unzip -Z1 "$APK" | grep -q "assets/classics/strategy.js"
          unzip -Z1 "$APK" | grep -q "assets/classics/skills.js"
          unzip -Z1 "$APK" | grep -q "assets/classics/checkers.js"
          unzip -Z1 "$APK" | grep -q "assets/classics/extras-arcade.js"
          unzip -Z1 "$APK" | grep -q "assets/classics/extras-sports.js"
          unzip -Z1 "$APK" | grep -q "assets/classics/racing.js"
          unzip -Z1 "$APK" | grep -q "assets/classics/racingDrive.js"
          unzip -Z1 "$APK" | grep -q "assets/classics/racingSkill.js"
          unzip -Z1 "$APK" | grep -q "assets/classics/sports1.js"
          unzip -Z1 "$APK" | grep -q "assets/classics/sports2.js"
          unzip -Z1 "$APK" | grep -q "assets/classics/actions2.js"
          unzip -Z1 "$APK" | grep -q "assets/classics/endless1.js"
          unzip -Z1 "$APK" | grep -q "assets/classics/endless2.js"
          unzip -Z1 "$APK" | grep -q "assets/classics/chess-game.js"
          unzip -Z1 "$APK" | grep -q "assets/classics/vendor/chess.js"
          unzip -Z1 "$APK" | grep -q "assets/classics/CHESS-LICENSE.txt"
          unzip -Z1 "$APK" | grep -q "assets/classics/memory.js"
          unzip -Z1 "$APK" | grep -q "assets/classics/pinball-asteroids.js"
          unzip -Z1 "$APK" | grep -q "assets/classics/cards-extra.js"
          unzip -Z1 "$APK" | grep -q "assets/classics/pattern-brick.js"
          unzip -Z1 "$APK" | grep -q "assets/classics/galaga-centipede.js"
          unzip -Z1 "$APK" | grep -q "assets/memory/ARTWORK-LICENSE.txt"
          if "$ANDROID_HOME/build-tools/36.0.0/aapt" dump permissions "$APK" | grep -q "android.permission.INTERNET"; then
            echo "Offline-only release unexpectedly requests internet permission" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: offline-games-foundation-debug-apk
          path: offline-games/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  emulator-smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        android_api: [26, 29]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Enable Android hardware acceleration where available
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Run in airplane-mode-equivalent emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.android_api }}
          arch: x86_64
          target: default
          profile: pixel_3a
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: false
          emulator-boot-timeout: 1200
          script: bash offline-games/scripts/emulator-smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-games-emulator-${{ matrix.android_api }}-evidence
          path: |
            offline-games/smoke-screenshots
            offline-games/app/build/outputs/androidTest-results
          retention-days: 14
