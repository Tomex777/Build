name: Torri Compile

on:
  push:
    branches:
      - torri-compile-ci
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: torri-compile-ci
  cancel-in-progress: true

jobs:
  build:
    name: Compile Torri
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout build runner
        uses: actions/checkout@v4

      - name: Checkout Mihon v0.20.4 base
        uses: actions/checkout@v4
        with:
          repository: mihonapp/mihon
          ref: df6507256acce8e7f3660783a3db6dbd1a31b6b5
          path: torri-src
          fetch-depth: 0

      - name: Apply Torri overlay
        run: |
          cp -a torri-overlay/. torri-src/
          rm -f torri-src/app/google-services.json
          rm -f torri-src/app/src/main/res/drawable/ic_mihon.xml
          rm -f torri-src/app/src/main/res/drawable/ic_mihon_splash.xml
          echo "Torri SDK configuration:"
          sed -n '1,10p' torri-src/gradle/mihon.versions.toml
          grep -n 'applicationId\|versionCode\|versionName' torri-src/app/build.gradle.kts | head

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK 36 and NDK
        run: |
          SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/16.0/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865"

      - name: Compile Torri release APKs
        working-directory: torri-src
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Stage APKs
        run: |
          mkdir -p torri-output
          cp torri-src/app/build/outputs/apk/release/app-arm64-v8a-release.apk torri-output/Torri-arm64-v8a.apk
          cp torri-src/app/build/outputs/apk/release/app-universal-release.apk torri-output/Torri-universal.apk
          sha256sum torri-output/*.apk | tee torri-output/SHA256SUMS.txt

      - name: Upload ARM64 APK
        uses: actions/upload-artifact@v4
        with:
          name: Torri-arm64-v8a-sdk36-min26
          path: torri-output/Torri-arm64-v8a.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload universal APK
        uses: actions/upload-artifact@v4
        with:
          name: Torri-universal-sdk36-min26
          path: torri-output/Torri-universal.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload checksums
        uses: actions/upload-artifact@v4
        with:
          name: Torri-checksums
          path: torri-output/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
