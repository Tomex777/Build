name: Apply Sora Semantic Media Feeds

on:
  push:
    branches: [sora-android-ci]
    paths:
      - 'sora-ci/apply-media-semantic-feeds.txt'

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Wire truthful media feeds
        run: python sora-ci/patch_media_semantic_feeds.py
      - name: Verify semantic feed wiring
        run: |
          grep -q '"popular" -> "$BASE_URL/top/anime?filter=bypopularity' sora-overlay/app/src/main/java/com/night/sora/catalog/JikanCatalogClient.kt
          grep -q 'payload.optString("feed")' sora-overlay/app/src/main/java/com/night/sora/catalog/JikanCatalogService.kt
          grep -q 'loadJikanFeed("popular"' sora-overlay/app/src/main/java/com/night/sora/ui/screens/MediaScreen.kt
          grep -q 'Popular now' sora-overlay/app/src/main/java/com/night/sora/ui/screens/MediaScreen.kt
          grep -q 'Upcoming anime' sora-overlay/app/src/main/java/com/night/sora/ui/screens/MediaScreen.kt
          grep -q 'In your library' sora-overlay/app/src/main/java/com/night/sora/ui/screens/MediaScreen.kt
          ! grep -q 'Because you watched' sora-overlay/app/src/main/java/com/night/sora/ui/screens/MediaScreen.kt
          ! grep -q 'Popular today' sora-overlay/app/src/main/java/com/night/sora/ui/screens/MediaScreen.kt
      - name: Commit semantic media feeds
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sora-overlay/app/src/main/java/com/night/sora/catalog/JikanCatalogClient.kt \
                  sora-overlay/app/src/main/java/com/night/sora/catalog/JikanCatalogService.kt \
                  sora-overlay/app/src/main/java/com/night/sora/ui/screens/MediaScreen.kt
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'wire real Sora media catalog feeds'
            git push
          fi
