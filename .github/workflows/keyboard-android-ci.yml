name: Keyboard Android CI

on:
  push:
    branches: [ keyboard-ci ]
  pull_request:
    branches: [ main ]

concurrency:
  group: keyboard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Locate and prepare Android SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort | tail -1)"
          test -n "$SDKMANAGER" || { echo "sdkmanager not found under $SDK_ROOT"; exit 1; }
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Static project contract checks
        run: python3 scripts/verify_project.py
      - name: Unit tests, lint and APK
        run: gradle --no-daemon :core:model:testDebugUnitTest :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: keyboard-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: keyboard-lint
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

  emulator-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Enable KVM acceleration
        shell: bash
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
            ls -l /dev/kvm
          else
            echo "/dev/kvm is not present on this runner"
          fi
      - name: Locate and prepare Android SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort | tail -1)"
          test -n "$SDKMANAGER" || { echo "sdkmanager not found under $SDK_ROOT"; exit 1; }
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Run Android 16 emulator tests and IME smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          disable-animations: true
          disable-linux-hw-accel: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics
          script: |
            gradle --no-daemon :app:connectedDebugAndroidTest :app:assembleDebug
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell ime enable com.night.keyboard/.ime.KeyboardInputMethodService
            adb shell ime set com.night.keyboard/.ime.KeyboardInputMethodService
            sleep 1
            DEFAULT_IME="$(adb shell settings --user 0 get secure default_input_method | tr -d '\r')"
            echo "Secure default_input_method: $DEFAULT_IME"
            adb shell am start -W -n com.night.keyboard/.debug.ImeHarnessActivity
            sleep 4
            adb shell uiautomator dump /sdcard/ime-window.xml
            adb pull /sdcard/ime-window.xml ime-window.xml
            adb exec-out screencap -p > ime-qa.png
            adb shell dumpsys input_method > input-method.txt
            adb logcat -d > logcat.txt
            grep -q "com.night.keyboard/.ime.KeyboardInputMethodService" input-method.txt
            grep -q 'text="123"' ime-window.xml
            grep -q 'content-desc="Clipboard"' ime-window.xml
            if grep -E "FATAL EXCEPTION|AndroidRuntime" logcat.txt | grep -q "com.night.keyboard"; then
              echo "Keyboard process crash detected in logcat"
              grep -n -A20 -B5 "FATAL EXCEPTION" logcat.txt || true
              exit 1
            fi
      - name: Upload emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: keyboard-emulator-evidence
          path: |
            ime-qa.png
            ime-window.xml
            input-method.txt
            logcat.txt
          if-no-files-found: warn
