name: Keyboard Android CI

on:
  push:
    branches: [ keyboard-ci ]
  pull_request:
    branches: [ main ]

concurrency:
  group: keyboard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Locate and prepare Android SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort | tail -1)"
          test -n "$SDKMANAGER" || { echo "sdkmanager not found under $SDK_ROOT"; exit 1; }
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Static project contract checks
        run: python3 scripts/verify_project.py
      - name: Unit tests, lint and APK
        run: gradle --no-daemon :core:model:testDebugUnitTest :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: keyboard-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: keyboard-lint
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

  emulator-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Enable KVM acceleration
        shell: bash
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
            ls -l /dev/kvm
          else
            echo "/dev/kvm is not present on this runner"
          fi
      - name: Locate and prepare Android SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort | tail -1)"
          test -n "$SDKMANAGER" || { echo "sdkmanager not found under $SDK_ROOT"; exit 1; }
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Run Android 16 emulator tests and IME smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          disable-animations: true
          disable-linux-hw-accel: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics
          script: |
            gradle --no-daemon :app:connectedDebugAndroidTest :app:assembleDebug
            adb install -r app/build/outputs/apk/debug/app-debug.apk

            # Hosted Android emulators still advertise a hardware QWERTY device.
            # Turn on Android's ordinary "show on-screen keyboard" setting so CI
            # exercises the production IME without changing production behavior.
            adb shell settings --user 0 put secure show_ime_with_hard_keyboard 1
            echo "show_ime_with_hard_keyboard=$(adb shell settings --user 0 get secure show_ime_with_hard_keyboard | tr -d '\r')"

            adb shell ime enable com.night.keyboard/.ime.KeyboardInputMethodService
            adb shell ime set com.night.keyboard/.ime.KeyboardInputMethodService
            adb shell am start -W -n com.night.keyboard/.debug.ImeHarnessActivity
            sleep 4

            adb shell dumpsys input_method > input-method.txt
            adb logcat -d > logcat.txt
            adb exec-out screencap -p > ime-qa.png
            adb shell uiautomator dump /sdcard/ime-window.xml
            adb pull /sdcard/ime-window.xml ime-window.xml

            # Framework-level proof that the real InputMethodService window is live.
            grep -q "mCurImeId=com.night.keyboard/.ime.KeyboardInputMethodService" input-method.txt
            grep -q "mDecorViewVisible=true" input-method.txt
            grep -q "mInputStarted=true mInputViewStarted=true" input-method.txt
            grep -q "mIsInputViewShown=true" input-method.txt
            if grep -E "FATAL EXCEPTION|AndroidRuntime" logcat.txt | grep -q "com.night.keyboard"; then echo "Keyboard process crash detected in logcat"; grep -n -A24 -B6 "FATAL EXCEPTION" logcat.txt || true; exit 1; fi

            # Tap the real Q key and prove text reaches the focused host field.
            adb shell input tap 54 1935
            sleep 1
            adb shell uiautomator dump /sdcard/after-q.xml
            adb pull /sdcard/after-q.xml after-q.xml
            grep -q 'text="qCursor test: move the caret through this sentence"' after-q.xml
            grep -q 'text="Selection: 1-1"' after-q.xml

            # `input swipe` is one continuous pointer stream with a stable down-time.
            # Keeping it down for 1200 ms crosses the production long-press gate and
            # leaves enough post-gate motion to exercise real Spacebar trackpad moves.
            adb shell input swipe 545 2320 445 2320 1200
            sleep 1
            adb shell uiautomator dump /sdcard/after-trackpad.xml
            adb pull /sdcard/after-trackpad.xml after-trackpad.xml
            grep -q 'text="qCursor test: move the caret through this sentence"' after-trackpad.xml
            grep -q 'text="Selection: 0-0"' after-trackpad.xml

            # Commit W after the moved caret as a second end-to-end proof. No space
            # may have leaked from the trackpad gesture.
            adb shell input tap 161 1935
            sleep 1
            adb shell uiautomator dump /sdcard/after-cursor.xml
            adb pull /sdcard/after-cursor.xml after-cursor.xml
            grep -q 'text="wqCursor test: move the caret through this sentence"' after-cursor.xml

            # Tap the real backspace key once and prove deletion reaches the host field.
            adb shell input tap 1006 2192
            sleep 1
            adb shell uiautomator dump /sdcard/after-backspace.xml
            adb pull /sdcard/after-backspace.xml after-backspace.xml
            grep -q 'text="qCursor test: move the caret through this sentence"' after-backspace.xml
            adb exec-out screencap -p > ime-qa-after-input.png

            # The IME is a separate system window and is not included in UIAutomator's
            # host hierarchy on API 36. Exercise its visible toolbar directly on the
            # fixed Pixel 6 QA profile, capture visual evidence, then tap the first
            # custom-drawn smile entry and prove it commits its Unicode output.
            adb shell input tap 134 1607
            sleep 1
            adb exec-out screencap -p > emoji-panel.png
            adb shell input tap 75 1685
            sleep 1
            adb shell uiautomator dump /sdcard/after-emoji.xml
            adb pull /sdcard/after-emoji.xml after-emoji.xml
            grep -q 'text="🙂qCursor test: move the caret through this sentence"' after-emoji.xml

            # Close the expanded emoji panel. Its extra height shifts the toolbar
            # upward on the fixed profile, so use the captured panel-state toolbar Y.
            adb shell input tap 134 1555
            sleep 1

            # Insert a safe run of q characters, then hold the real Backspace in one
            # continuous stationary swipe. At least two characters must disappear.
            for i in 1 2 3 4 5 6 7 8; do adb shell input tap 54 1935; done
            sleep 1
            adb shell uiautomator dump /sdcard/before-repeat-backspace.xml
            adb pull /sdcard/before-repeat-backspace.xml before-repeat-backspace.xml
            adb shell input swipe 1006 2192 1006 2192 720
            sleep 1
            adb shell uiautomator dump /sdcard/after-repeat-backspace.xml
            adb pull /sdcard/after-repeat-backspace.xml after-repeat-backspace.xml
            python3 -c 'import xml.etree.ElementTree as ET; phrase="Cursor test: move the caret through this sentence"; before=next(n.attrib["text"] for n in ET.parse("before-repeat-backspace.xml").iter() if phrase in n.attrib.get("text","")); after=next(n.attrib["text"] for n in ET.parse("after-repeat-backspace.xml").iter() if phrase in n.attrib.get("text","")); assert len(before)-len(after)>=2, f"hold repeat removed only {len(before)-len(after)} character(s): {before!r} -> {after!r}"; assert phrase in after'
            adb exec-out screencap -p > after-repeat-backspace.png

            # Setup is now genuinely complete. Launch the normal app and verify the
            # onboarding/success status cards do not occupy Home after setup.
            adb shell am start -W -n com.night.keyboard/.MainActivity
            sleep 2
            adb shell uiautomator dump /sdcard/home-after-setup.xml
            adb pull /sdcard/home-after-setup.xml home-after-setup.xml
            if grep -q 'text="Finish setup"' home-after-setup.xml; then echo "Finish setup card remained after successful setup"; exit 1; fi
            if grep -q 'text="Setup complete"' home-after-setup.xml; then echo "Permanent setup success card remained on Home"; exit 1; fi
            if grep -q 'text="Keyboard is active"' home-after-setup.xml; then echo "Permanent keyboard-active card remained on Home"; exit 1; fi
            adb exec-out screencap -p > home-after-setup.png

            # Final crash scan after every exercised feature, not only startup.
            adb logcat -d > logcat-final.txt
            if grep -E "FATAL EXCEPTION|AndroidRuntime" logcat-final.txt | grep -q "com.night.keyboard"; then echo "Keyboard process crash detected after interaction suite"; grep -n -A24 -B6 "FATAL EXCEPTION" logcat-final.txt || true; exit 1; fi
      - name: Upload emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: keyboard-emulator-evidence
          path: |
            ime-qa.png
            ime-qa-after-input.png
            emoji-panel.png
            after-repeat-backspace.png
            home-after-setup.png
            ime-window.xml
            after-q.xml
            after-trackpad.xml
            after-cursor.xml
            after-backspace.xml
            after-emoji.xml
            before-repeat-backspace.xml
            after-repeat-backspace.xml
            home-after-setup.xml
            input-method.txt
            logcat.txt
            logcat-final.txt
          if-no-files-found: warn
