name: Keyboard Android CI

on:
  push:
    branches: [ keyboard-ci ]
  pull_request:
    branches: [ main ]

concurrency:
  group: keyboard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Locate and prepare Android SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort | tail -1)"
          test -n "$SDKMANAGER" || { echo "sdkmanager not found under $SDK_ROOT"; exit 1; }
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Static project contract checks
        run: python3 scripts/verify_project.py
      - name: Unit tests, lint and APK
        run: gradle --no-daemon :core:model:testDebugUnitTest :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: keyboard-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: keyboard-lint
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

  emulator-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Enable KVM acceleration
        shell: bash
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
            ls -l /dev/kvm
          else
            echo "/dev/kvm is not present on this runner"
          fi
      - name: Locate and prepare Android SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort | tail -1)"
          test -n "$SDKMANAGER" || { echo "sdkmanager not found under $SDK_ROOT"; exit 1; }
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true

          install_with_retry() {
            local attempt
            for attempt in 1 2 3; do
              echo "sdkmanager attempt $attempt: $*"
              if "$SDKMANAGER" "$@"; then
                return 0
              fi
              if [ "$attempt" -lt 3 ]; then
                sleep $((attempt * 5))
              fi
            done
            return 1
          }

          # Pre-provision everything android-emulator-runner will need. The action
          # still validates/installs these packages itself, but a completed local
          # install makes its setup idempotent and avoids losing the entire QA run
          # to a transient corrupt/partial emulator ZIP download.
          install_with_retry "platform-tools" "platforms;android-36"
          install_with_retry "emulator"
          install_with_retry "system-images;android-36;google_apis;x86_64"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Run Android 16 emulator tests and IME smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          disable-animations: true
          disable-linux-hw-accel: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics
          script: bash scripts/ime_emulator_qa.sh
      - name: Upload emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: keyboard-emulator-evidence
          path: |
            ime-qa.png
            ime-qa-after-input.png
            emoji-panel.png
            after-repeat-backspace.png
            home-after-setup.png
            ime-window.xml
            after-q.xml
            after-trackpad.xml
            after-cursor.xml
            after-backspace.xml
            after-emoji.xml
            before-repeat-backspace.xml
            after-repeat-backspace.xml
            home-after-setup.xml
            input-method.txt
            input-method-emoji.txt
            input-method-normal.txt
            logcat.txt
            logcat-final.txt
          if-no-files-found: warn
