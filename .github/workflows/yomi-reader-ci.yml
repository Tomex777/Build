name: Yomi Reader CI

on:
  push:
    branches:
      - yomi-reader-foundation
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yomi-reader-foundation
  cancel-in-progress: true

jobs:
  build:
    name: Core tests and Android build
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout Yomi
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Verify SDK contract
        run: |
          grep -q 'compileSdk = 36' yomi-reader/app/build.gradle.kts
          grep -q 'minSdk = 26' yomi-reader/app/build.gradle.kts
          grep -q 'targetSdk = 36' yomi-reader/app/build.gradle.kts
          grep -q 'applicationId = "app.yomi.reader"' yomi-reader/app/build.gradle.kts
          ! grep -R --line-number --include='*.kt' --include='*.kts' 'app\.torri\|Torri' yomi-reader/reader-core-contract yomi-reader/app

      - name: Test Yomi reader contracts
        working-directory: yomi-reader
        run: gradle --no-daemon --stacktrace :reader-core-contract:test

      - name: Build Yomi debug and release APKs
        working-directory: yomi-reader
        run: gradle --no-daemon --stacktrace :app:assembleDebug :app:assembleRelease

      - name: Stage APKs
        run: |
          mkdir -p yomi-output
          cp yomi-reader/app/build/outputs/apk/debug/app-debug.apk yomi-output/Yomi-debug.apk
          cp yomi-reader/app/build/outputs/apk/release/app-release.apk yomi-output/Yomi-release.apk
          sha256sum yomi-output/*.apk | tee yomi-output/SHA256SUMS.txt

      - name: Upload Yomi APKs
        uses: actions/upload-artifact@v4
        with:
          name: Yomi-apks-sdk36-min26
          path: yomi-output/
          if-no-files-found: error
          retention-days: 14

  api-36:
    name: API 36 launch and screenshot
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout Yomi
        uses: actions/checkout@v4

      - name: Download Yomi APKs
        uses: actions/download-artifact@v4
        with:
          name: Yomi-apks-sdk36-min26
          path: yomi-output

      - name: Launch on Android 16
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: default
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none -memory 2048 -cores 2
          emulator-boot-timeout: 1800
          script: |
            set -eu
            mkdir -p yomi-output/runtime
            : > yomi-output/runtime/logcat.txt

            wait_for_log() {
              pattern="$1"
              attempts="${2:-60}"
              i=0
              while [ "$i" -lt "$attempts" ]; do
                if adb logcat -d -v brief YomiStartup:I YomiReader:I '*:S' | grep -Fq "$pattern"; then
                  return 0
                fi
                i=$((i + 1))
                sleep 2
              done
              echo "Timed out waiting for log marker: $pattern" >&2
              adb logcat -d -v threadtime >> yomi-output/runtime/logcat.txt || true
              return 1
            }

            capture_screen() {
              name="$1"
              adb exec-out screencap -p > "yomi-output/runtime/$name"
              test -s "yomi-output/runtime/$name"
              test "$(wc -c < "yomi-output/runtime/$name")" -gt 4096
              file "yomi-output/runtime/$name" | grep -q 'PNG image data'
            }

            checkpoint_logs() {
              adb logcat -d -v threadtime >> yomi-output/runtime/logcat.txt
              printf '\n--- Yomi checkpoint ---\n' >> yomi-output/runtime/logcat.txt
            }

            adb install -r yomi-output/Yomi-debug.apk

            # Prove the real launcher reaches a meaningful Compose draw. This avoids spawning
            # UIAutomator's extra Java process on the memory-constrained API 36 emulator.
            adb logcat -c
            adb shell am force-stop app.yomi.reader.dev
            adb shell am start -n app.yomi.reader.dev/app.yomi.reader.MainActivity | tee yomi-output/runtime/launch.txt
            adb shell pidof app.yomi.reader.dev
            wait_for_log "activity-created"
            wait_for_log "compose-content-attached"
            wait_for_log "home-content-composed sections=Library,Recent,Folders"
            wait_for_log "home-first-draw"
            adb shell dumpsys activity activities > yomi-output/runtime/activity.txt
            grep -Fq 'app.yomi.reader.dev/app.yomi.reader.MainActivity' yomi-output/runtime/activity.txt
            adb shell dumpsys package app.yomi.reader.dev > yomi-output/runtime/package.txt
            adb shell dumpsys gfxinfo app.yomi.reader.dev > yomi-output/runtime/gfxinfo-home.txt
            capture_screen yomi-empty-library.png
            adb shell dumpsys meminfo app.yomi.reader.dev > yomi-output/runtime/meminfo.txt
            checkpoint_logs

            # Exercise a real generated CBZ through the production shared reader.
            adb logcat -c
            adb shell am force-stop app.yomi.reader.dev
            adb shell am start -n app.yomi.reader.dev/app.yomi.reader.YomiCiFixtureActivity --ez reset true --es mode LTR_PAGED
            adb shell pidof app.yomi.reader.dev
            wait_for_log "reader-first-draw title=Yomi CI Book mode=LTR_PAGED"
            wait_for_log "position title=Yomi CI Book mode=LTR_PAGED label=page 1/3"
            capture_screen yomi-reader-ltr-page1.png

            adb shell input keyevent KEYCODE_DPAD_RIGHT
            wait_for_log "position title=Yomi CI Book mode=LTR_PAGED label=page 2/3"
            capture_screen yomi-reader-ltr-page2.png
            checkpoint_logs

            # Kill the process and prove exact page restore in RTL paged.
            adb logcat -c
            adb shell am force-stop app.yomi.reader.dev
            adb shell am start -n app.yomi.reader.dev/app.yomi.reader.YomiCiFixtureActivity --es mode RTL_PAGED
            adb shell pidof app.yomi.reader.dev
            wait_for_log "reader-first-draw title=Yomi CI Book mode=RTL_PAGED"
            wait_for_log "position title=Yomi CI Book mode=RTL_PAGED label=page 2/3"
            capture_screen yomi-reader-RTL_PAGED.png
            checkpoint_logs

            # Kill the process and prove exact page restore in vertical paged.
            adb logcat -c
            adb shell am force-stop app.yomi.reader.dev
            adb shell am start -n app.yomi.reader.dev/app.yomi.reader.YomiCiFixtureActivity --es mode VERTICAL_PAGED
            adb shell pidof app.yomi.reader.dev
            wait_for_log "reader-first-draw title=Yomi CI Book mode=VERTICAL_PAGED"
            wait_for_log "position title=Yomi CI Book mode=VERTICAL_PAGED label=page 2/3"
            capture_screen yomi-reader-VERTICAL_PAGED.png
            checkpoint_logs

            # Kill the process and prove exact page restore in long-strip/webtoon.
            adb logcat -c
            adb shell am force-stop app.yomi.reader.dev
            adb shell am start -n app.yomi.reader.dev/app.yomi.reader.YomiCiFixtureActivity --es mode WEBTOON
            adb shell pidof app.yomi.reader.dev
            wait_for_log "reader-first-draw title=Yomi CI Book mode=WEBTOON"
            wait_for_log "position title=Yomi CI Book mode=WEBTOON label=page 2/3"
            capture_screen yomi-reader-WEBTOON.png
            checkpoint_logs

            # Exercise SAF image-folder chapters and continuous cross-chapter reading.
            adb logcat -c
            adb shell am force-stop app.yomi.reader.dev
            adb shell am start -n app.yomi.reader.dev/app.yomi.reader.YomiCiFixtureActivity --es kind folder --es mode LTR_PAGED
            adb shell pidof app.yomi.reader.dev
            wait_for_log "reader-first-draw title=Yomi CI Folder mode=LTR_PAGED"
            wait_for_log "position title=Yomi CI Folder mode=LTR_PAGED label=Chapter 1 · page 1/2"

            adb shell input keyevent KEYCODE_DPAD_RIGHT
            sleep 1
            adb shell input keyevent KEYCODE_DPAD_RIGHT
            sleep 1
            adb shell input keyevent KEYCODE_DPAD_RIGHT
            wait_for_log "position title=Yomi CI Folder mode=LTR_PAGED label=Chapter 2 · page 1/2"
            capture_screen yomi-folder-cross-chapter.png
            checkpoint_logs

            # Kill and restore the second chapter exactly in long-strip mode.
            adb logcat -c
            adb shell am force-stop app.yomi.reader.dev
            adb shell am start -n app.yomi.reader.dev/app.yomi.reader.YomiCiFixtureActivity --es kind folder --es mode WEBTOON
            adb shell pidof app.yomi.reader.dev
            wait_for_log "reader-first-draw title=Yomi CI Folder mode=WEBTOON"
            wait_for_log "position title=Yomi CI Folder mode=WEBTOON label=Chapter 2 · page 1/2"
            capture_screen yomi-folder-restored-webtoon.png
            adb shell dumpsys gfxinfo app.yomi.reader.dev > yomi-output/runtime/gfxinfo-reader.txt
            checkpoint_logs

            ! grep -E 'FATAL EXCEPTION|AndroidRuntime:.*Process: app\\.yomi\\.reader\\.dev' yomi-output/runtime/logcat.txt

      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Yomi-API36-runtime-evidence
          path: yomi-output/runtime/
          if-no-files-found: warn
          retention-days: 14
