name: Yomi Reader CI

on:
  push:
    branches:
      - yomi-reader-foundation
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yomi-reader-foundation
  cancel-in-progress: true

jobs:
  build:
    name: Core tests and Android build
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout Yomi
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Verify SDK contract
        run: |
          grep -q 'compileSdk = 36' yomi-reader/app/build.gradle.kts
          grep -q 'minSdk = 26' yomi-reader/app/build.gradle.kts
          grep -q 'targetSdk = 36' yomi-reader/app/build.gradle.kts
          grep -q 'applicationId = "app.yomi.reader"' yomi-reader/app/build.gradle.kts
          ! grep -R --line-number --include='*.kt' --include='*.kts' 'app\.torri\|Torri' yomi-reader/reader-core-contract yomi-reader/app

      - name: Test Yomi reader contracts
        working-directory: yomi-reader
        run: gradle --no-daemon --stacktrace :reader-core-contract:test

      - name: Build Yomi debug and release APKs
        working-directory: yomi-reader
        run: gradle --no-daemon --stacktrace :app:assembleDebug :app:assembleRelease

      - name: Stage APKs
        run: |
          mkdir -p yomi-output
          cp yomi-reader/app/build/outputs/apk/debug/app-debug.apk yomi-output/Yomi-debug.apk
          cp yomi-reader/app/build/outputs/apk/release/app-release.apk yomi-output/Yomi-release.apk
          sha256sum yomi-output/*.apk | tee yomi-output/SHA256SUMS.txt

      - name: Upload Yomi APKs
        uses: actions/upload-artifact@v4
        with:
          name: Yomi-apks-sdk36-min26
          path: yomi-output/
          if-no-files-found: error
          retention-days: 14

  api-36:
    name: API 36 launch and screenshot
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout Yomi
        uses: actions/checkout@v4

      - name: Download Yomi APKs
        uses: actions/download-artifact@v4
        with:
          name: Yomi-apks-sdk36-min26
          path: yomi-output

      - name: Launch on Android 16
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -memory 3072
          emulator-boot-timeout: 1800
          script: |
            mkdir -p yomi-output/runtime
            adb install -r yomi-output/Yomi-debug.apk
            adb logcat -c
            adb shell am force-stop app.yomi.reader.dev

            # Launch the real exported launcher. On the software API 36 emulator, -W can time out
            # after the activity is already resumed, so acceptance verifies the live process and
            # rendered Yomi UI instead of treating ActivityManager's draw timeout as an app crash.
            adb shell am start -n app.yomi.reader.dev/app.yomi.reader.MainActivity | tee yomi-output/runtime/launch.txt
            sleep 12
            adb shell pidof app.yomi.reader.dev
            adb logcat -d -v threadtime > yomi-output/runtime/launch-logcat.txt
            adb shell dumpsys activity activities > yomi-output/runtime/activity.txt
            adb shell dumpsys package app.yomi.reader.dev > yomi-output/runtime/package.txt
            adb shell uiautomator dump /sdcard/yomi-home.xml
            adb pull /sdcard/yomi-home.xml yomi-output/runtime/yomi-home.xml
            grep -q 'text="Yomi"' yomi-output/runtime/yomi-home.xml
            grep -q 'Your library is empty' yomi-output/runtime/yomi-home.xml
            adb exec-out screencap -p > yomi-output/runtime/yomi-empty-library.png
            adb shell dumpsys meminfo app.yomi.reader.dev > yomi-output/runtime/meminfo.txt
            ! grep -E 'FATAL EXCEPTION|AndroidRuntime:.*Process: app\\.yomi\\.reader\\.dev' yomi-output/runtime/launch-logcat.txt

            # Exercise a real generated CBZ through the production shared reader.
            adb shell am force-stop app.yomi.reader.dev
            adb shell am start -n app.yomi.reader.dev/app.yomi.reader.YomiCiFixtureActivity --ez reset true --es mode LTR_PAGED
            sleep 8
            adb shell pidof app.yomi.reader.dev
            adb shell uiautomator dump /sdcard/yomi-reader-ltr.xml
            adb pull /sdcard/yomi-reader-ltr.xml yomi-output/runtime/yomi-reader-ltr.xml
            grep -q 'Yomi CI Book' yomi-output/runtime/yomi-reader-ltr.xml
            grep -q 'page 1/3' yomi-output/runtime/yomi-reader-ltr.xml
            adb exec-out screencap -p > yomi-output/runtime/yomi-reader-ltr-page1.png

            adb shell input keyevent KEYCODE_DPAD_RIGHT
            sleep 3
            adb shell uiautomator dump /sdcard/yomi-reader-page2.xml
            adb pull /sdcard/yomi-reader-page2.xml yomi-output/runtime/yomi-reader-page2.xml
            grep -q 'page 2/3' yomi-output/runtime/yomi-reader-page2.xml
            adb exec-out screencap -p > yomi-output/runtime/yomi-reader-ltr-page2.png

            # Kill the process and prove exact page restore in RTL paged.
            adb shell am force-stop app.yomi.reader.dev
            adb shell am start -n app.yomi.reader.dev/app.yomi.reader.YomiCiFixtureActivity --es mode RTL_PAGED
            sleep 8
            adb shell pidof app.yomi.reader.dev
            adb shell uiautomator dump /sdcard/yomi-reader-RTL_PAGED.xml
            adb pull /sdcard/yomi-reader-RTL_PAGED.xml yomi-output/runtime/yomi-reader-RTL_PAGED.xml
            grep -q 'Yomi CI Book' yomi-output/runtime/yomi-reader-RTL_PAGED.xml
            grep -q 'page 2/3' yomi-output/runtime/yomi-reader-RTL_PAGED.xml
            adb exec-out screencap -p > yomi-output/runtime/yomi-reader-RTL_PAGED.png

            # Kill the process and prove exact page restore in vertical paged.
            adb shell am force-stop app.yomi.reader.dev
            adb shell am start -n app.yomi.reader.dev/app.yomi.reader.YomiCiFixtureActivity --es mode VERTICAL_PAGED
            sleep 8
            adb shell pidof app.yomi.reader.dev
            adb shell uiautomator dump /sdcard/yomi-reader-VERTICAL_PAGED.xml
            adb pull /sdcard/yomi-reader-VERTICAL_PAGED.xml yomi-output/runtime/yomi-reader-VERTICAL_PAGED.xml
            grep -q 'Yomi CI Book' yomi-output/runtime/yomi-reader-VERTICAL_PAGED.xml
            grep -q 'page 2/3' yomi-output/runtime/yomi-reader-VERTICAL_PAGED.xml
            adb exec-out screencap -p > yomi-output/runtime/yomi-reader-VERTICAL_PAGED.png

            # Kill the process and prove exact page restore in long-strip/webtoon.
            adb shell am force-stop app.yomi.reader.dev
            adb shell am start -n app.yomi.reader.dev/app.yomi.reader.YomiCiFixtureActivity --es mode WEBTOON
            sleep 8
            adb shell pidof app.yomi.reader.dev
            adb shell uiautomator dump /sdcard/yomi-reader-WEBTOON.xml
            adb pull /sdcard/yomi-reader-WEBTOON.xml yomi-output/runtime/yomi-reader-WEBTOON.xml
            grep -q 'Yomi CI Book' yomi-output/runtime/yomi-reader-WEBTOON.xml
            grep -q 'page 2/3' yomi-output/runtime/yomi-reader-WEBTOON.xml
            adb exec-out screencap -p > yomi-output/runtime/yomi-reader-WEBTOON.png

            # Exercise SAF image-folder chapters and continuous cross-chapter reading.
            adb shell am force-stop app.yomi.reader.dev
            adb shell am start -n app.yomi.reader.dev/app.yomi.reader.YomiCiFixtureActivity --es kind folder --es mode LTR_PAGED
            sleep 8
            adb shell pidof app.yomi.reader.dev
            adb shell uiautomator dump /sdcard/yomi-folder-ch1.xml
            adb pull /sdcard/yomi-folder-ch1.xml yomi-output/runtime/yomi-folder-ch1.xml
            grep -q 'Chapter 1' yomi-output/runtime/yomi-folder-ch1.xml
            grep -q 'page 1/2' yomi-output/runtime/yomi-folder-ch1.xml

            adb shell input keyevent KEYCODE_DPAD_RIGHT
            sleep 2
            adb shell input keyevent KEYCODE_DPAD_RIGHT
            sleep 2
            adb shell input keyevent KEYCODE_DPAD_RIGHT
            sleep 4
            adb shell uiautomator dump /sdcard/yomi-folder-ch2.xml
            adb pull /sdcard/yomi-folder-ch2.xml yomi-output/runtime/yomi-folder-ch2.xml
            grep -q 'Chapter 2' yomi-output/runtime/yomi-folder-ch2.xml
            grep -q 'page 1/2' yomi-output/runtime/yomi-folder-ch2.xml
            adb exec-out screencap -p > yomi-output/runtime/yomi-folder-cross-chapter.png

            # Kill and restore the second chapter exactly in long-strip mode.
            adb shell am force-stop app.yomi.reader.dev
            adb shell am start -n app.yomi.reader.dev/app.yomi.reader.YomiCiFixtureActivity --es kind folder --es mode WEBTOON
            sleep 8
            adb shell pidof app.yomi.reader.dev
            adb shell uiautomator dump /sdcard/yomi-folder-restored.xml
            adb pull /sdcard/yomi-folder-restored.xml yomi-output/runtime/yomi-folder-restored.xml
            grep -q 'Chapter 2' yomi-output/runtime/yomi-folder-restored.xml
            grep -q 'page 1/2' yomi-output/runtime/yomi-folder-restored.xml
            adb exec-out screencap -p > yomi-output/runtime/yomi-folder-restored-webtoon.png

            adb logcat -d -t 1600 > yomi-output/runtime/logcat.txt
            ! grep -E 'FATAL EXCEPTION|AndroidRuntime:.*Process: app\\.yomi\\.reader\\.dev' yomi-output/runtime/logcat.txt

      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Yomi-API36-runtime-evidence
          path: yomi-output/runtime/
          if-no-files-found: warn
          retention-days: 14
