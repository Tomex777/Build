name: Slumber 0.5.0 Clean Android Runtime Proof

on:
  push:
    branches: ["pianohub-ci"]
    paths:
      - ".github/workflows/slumber-runtime-050-clean.yml"

permissions:
  actions: read
  contents: read

jobs:
  clean-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Download exact verified 0.5.0 APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/slumber-artifact /tmp/slumber-apk /tmp/slumber-runtime
          mkdir -p /tmp/slumber-artifact /tmp/slumber-apk /tmp/slumber-runtime
          gh run download 34443740455 --repo Tomex777/Build --name slumber-production-0.5.0-exact --dir /tmp/slumber-artifact
          APK=$(find /tmp/slumber-artifact -name app-debug.apk -type f -print -quit)
          test -n "$APK"
          cp "$APK" /tmp/slumber-apk/app-debug.apk
          test -s /tmp/slumber-apk/app-debug.apk
          echo 'ea9ea9afa9d3d5db6793b24b3bf4fc3a836f87a5af9b814d0917540b5e4d05ae  /tmp/slumber-apk/app-debug.apk' | sha256sum -c -

      - name: Enable KVM
        shell: bash
        run: |
          set -euo pipefail
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm

      - name: Boot Android 36 and require clean Slumber foreground
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ANDROID_EMULATOR_WAIT_TIME_BEFORE_KILL: 1
        with:
          api-level: 36
          arch: x86_64
          target: default
          profile: pixel_6
          cores: 2
          emulator-boot-timeout: 360
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot-save -no-metrics
          script: |
            adb shell settings put global hide_error_dialogs 1
            adb install -r /tmp/slumber-apk/app-debug.apk
            adb logcat -c
            adb shell am force-stop com.night.pianohub
            adb shell am start -W -n com.night.pianohub/.MainActivity > /tmp/slumber-runtime/activity-start.txt
            sleep 10
            adb shell pidof com.night.pianohub > /tmp/slumber-runtime/pid.txt
            test -s /tmp/slumber-runtime/pid.txt
            adb shell dumpsys window windows > /tmp/slumber-runtime/window-dump.txt
            grep -q 'com.night.pianohub' /tmp/slumber-runtime/window-dump.txt
            adb shell uiautomator dump /sdcard/slumber-ui.xml
            adb pull /sdcard/slumber-ui.xml /tmp/slumber-runtime/ui.xml
            grep -q 'Slumber' /tmp/slumber-runtime/ui.xml
            grep -q 'Ready to practice' /tmp/slumber-runtime/ui.xml
            sh -c '! grep -E "Process system isn.t responding|isn.t responding|keeps stopping|Close app" /tmp/slumber-runtime/ui.xml'
            adb exec-out screencap -p > /tmp/slumber-runtime/01-learn-clean.png
            test -s /tmp/slumber-runtime/01-learn-clean.png
            adb logcat -d -t 1800 > /tmp/slumber-runtime/logcat-tail.txt
            sh -c '! grep -E "ANR in com\\.night\\.pianohub|FATAL EXCEPTION.*com\\.night\\.pianohub|Process: com\\.night\\.pianohub.*FATAL EXCEPTION" /tmp/slumber-runtime/logcat-tail.txt'

      - name: Upload clean runtime proof
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: slumber-0.5.0-clean-runtime-proof
          path: /tmp/slumber-runtime/*
          if-no-files-found: error
