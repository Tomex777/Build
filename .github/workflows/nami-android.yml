      - name: Run API 26 storage and migration smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 26
          target: default
          arch: x86_64
          emulator-boot-timeout: 900
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 2560 -cores 2
          disable-animations: true
          script: >-
            bash -euo pipefail -c 'install_apk() { apk="$1"; for attempt in 1 2 3; do timeout 90s adb wait-for-device || true; if timeout 300s adb install -r "$apk"; then return 0; fi; adb kill-server || true; sleep 3; adb start-server || true; timeout 90s adb wait-for-device || true; done; return 1; }; install_apk apps/nami/app/build/outputs/apk/debug/app-x86_64-debug.apk; install_apk apps/nami/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk; adb shell pm grant app.nami.android android.permission.WRITE_EXTERNAL_STORAGE || true; adb shell pm grant app.nami.android.test android.permission.WRITE_EXTERNAL_STORAGE || true; timeout 30s adb shell am start -W -n app.nami.android/.MainActivity; sleep 8; app_pid=$(timeout 60s adb shell pidof app.nami.android || true); test -n "$app_pid"; timeout 60s adb exec-out screencap -p > "$GITHUB_WORKSPACE/nami-api26-launch.png" || true; set +e; output=$(timeout 300s adb shell am instrument -w -r -e class app.nami.android.compat.MinSdk26SmokeTest app.nami.android.test/androidx.test.runner.AndroidJUnitRunner 2>&1); result=$?; set -e; printf "%s\n" "$output" | tee "$GITHUB_WORKSPACE/nami-api26-instrumentation.txt"; timeout 60s adb logcat -d -v time | tee "$GITHUB_WORKSPACE/nami-api26-logcat.txt" >/dev/null || true; if [ "$result" -ne 0 ]; then exit "$result"; fi; echo "$output" | grep -Eq "OK .+ tests?"'
      - name: Upload API 26 smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nami-api26-smoke-evidence
          path: |
            nami-api26-launch.png
            nami-api26-instrumentation.txt
            nami-api26-logcat.txt
          if-no-files-found: ignore

