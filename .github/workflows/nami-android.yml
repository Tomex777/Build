name: Nami Android

on:
  push:
    branches: ["nami/**"]
    paths:
      - "apps/nami/**"
      - ".github/workflows/nami-android.yml"
  pull_request:
    paths:
      - "apps/nami/**"
      - ".github/workflows/nami-android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nami-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Test search runtime and build debug APK
        working-directory: apps/nami
        run: gradle :core:source-runtime:test :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: nami-debug-apk
          path: apps/nami/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  extension-compat-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools emulator
      - name: Install Android emulator image and SDK platform
        shell: bash
        run: |
          set -euo pipefail
          packages=(
            "platforms;android-35"
            "platforms;android-36"
            "build-tools;35.0.0"
            "system-images;android-35;default;x86_64"
          )
          for attempt in 1 2 3; do
            if sdkmanager "${packages[@]}"; then
              exit 0
            fi
            echo "SDK install attempt ${attempt} failed; clearing the partial system image before retry."
            rm -rf "${ANDROID_SDK_ROOT}/system-images/android-35/default/x86_64" || true
            sleep 10
          done
          exit 1
      - name: Download real Aniyomi-compatible AnimeSogo extension
        run: curl --fail --location --retry 3 --output /tmp/animesogo.apk https://raw.githubusercontent.com/mojuru/anime-repo/ae5dcf8f2c6adc32735f818fc9a3eb051b06c5c6/apk/aniyomi-en.animesogo-v16.8.apk
      - name: Build extension smoke-test APKs before emulator startup
        working-directory: apps/nami
        run: gradle --no-daemon --console=plain :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Run real extension and native-source smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          emulator-boot-timeout: 900
          disable-animations: true
          script: >-
            bash -euo pipefail -c 'echo NAMI_STAGE=install_extension; timeout 90s adb install -r /tmp/animesogo.apk; echo NAMI_STAGE=install_nami; timeout 90s adb install -r apps/nami/app/build/outputs/apk/debug/app-debug.apk; echo NAMI_STAGE=install_instrumentation; timeout 90s adb install -r apps/nami/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk; echo NAMI_STAGE=launch_app; launch_result=0; timeout 30s adb shell am start -n app.nami.android/.MainActivity || launch_result=$?; sleep 5; timeout 15s adb logcat -d -s AndroidRuntime:E ActivityManager:E NamiAniyomiCompat:W; app_pid=$(timeout 15s adb shell pidof app.nami.android || true); echo NAMI_APP_PID=$app_pid; if [ -z "$app_pid" ] || [ "$launch_result" -ne 0 ]; then echo NAMI_LAUNCH_FAILURE=$launch_result; timeout 15s adb logcat -d -v time -t 500 *:E; exit 1; fi; echo NAMI_STAGE=run_instrumentation; set +e; output=$(timeout 360s adb shell am instrument -w -r -e class app.nami.android.compat.AniyomiCompatibilitySmokeTest app.nami.android.test/androidx.test.runner.AndroidJUnitRunner 2>&1); result=$?; set -e; echo "$output"; timeout 15s adb logcat -d -s NamiAniyomiCompat:W NamiSourceSmoke:I AndroidRuntime:E ActivityManager:E; if [ "$result" -ne 0 ]; then exit "$result"; fi; echo "$output" | grep -Fq "OK (1 test)" || { echo Instrumentation_did_not_report_a_passing_test; exit 1; }'
