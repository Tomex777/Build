              exit 0
            fi
            echo "API 26 SDK install attempt ${attempt} failed; clearing partial emulator packages before retry."
            rm -rf "${ANDROID_SDK_ROOT}/emulator" || true
            rm -rf "${ANDROID_SDK_ROOT}/system-images/android-26/default/x86_64" || true
            sleep 10
          done
          exit 1
      - name: Build minimum-SDK smoke APKs
        working-directory: apps/nami
