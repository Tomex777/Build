name: Nami Android

on:
  push:
    branches: ["nami/**"]
    paths:
      - "apps/nami/**"
      - ".github/workflows/nami-android.yml"
  pull_request:
    paths:
      - "apps/nami/**"
      - ".github/workflows/nami-android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Build debug APK
        working-directory: apps/nami
        run: gradle :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: nami-debug-apk
          path: apps/nami/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  extension-compat-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools emulator
      - name: Install Android emulator image and SDK platform
        run: sdkmanager "platforms;android-35" "platforms;android-36" "build-tools;35.0.0" "system-images;android-35;google_apis;x86_64"
      - name: Download real Aniyomi-compatible AnimeTake extension
        run: curl --fail --location --retry 3 --output /tmp/animetake.apk https://raw.githubusercontent.com/mojuru/anime-repo/repo/apk/aniyomi-en.animetake-v16.20.apk
      - name: Run real extension and native-source smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            gradle -p apps/nami :app:assembleDebug :app:assembleDebugAndroidTest
            adb install -r /tmp/animetake.apk
            adb install -r apps/nami/app/build/outputs/apk/debug/app-debug.apk
            adb install -r apps/nami/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w -r -e class app.nami.android.compat.AniyomiCompatibilitySmokeTest app.nami.android.test/androidx.test.runner.AndroidJUnitRunner
