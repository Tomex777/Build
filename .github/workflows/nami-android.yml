name: Nami Android

on:
  push:
    branches: ["nami/**"]
    paths:
      - "apps/nami/**"
      - ".github/workflows/nami-android.yml"
  pull_request:
    paths:
      - "apps/nami/**"
      - ".github/workflows/nami-android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nami-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Test source runtimes and build debug APK
        working-directory: apps/nami
        run: gradle :core:source-runtime:test :extensions:aniyomi-compat:testDebugUnitTest :extensions:aniyomi-compat:assembleDebug :app:testDebugUnitTest :app:assembleDebug
      - name: Prepare user APK artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/nami
          cp apps/nami/app/build/outputs/apk/debug/app-arm64-v8a-debug.apk dist/nami/nami-arm64-v8a-debug.apk
          cp apps/nami/app/build/outputs/apk/debug/app-universal-debug.apk dist/nami/nami-universal-debug.apk
          test -s dist/nami/nami-arm64-v8a-debug.apk
          test -s dist/nami/nami-universal-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: nami-arm64-v8a-debug
          path: dist/nami/nami-arm64-v8a-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: nami-universal-debug
          path: dist/nami/nami-universal-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: nami-aniyomi-compat-api
          path: apps/nami/extensions/aniyomi-compat/build/outputs/aar/aniyomi-compat-debug.aar
          if-no-files-found: error

  build-animesogo-v17:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Checkout maintained AnimeSogo source
        uses: actions/checkout@v4
        with:
          repository: yuzono/anime-extensions
          ref: 25a6a2963164a600c802e15b1b4d06d2f4e27f3a
          path: v17-source
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.7.1"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Download Nami extensions-lib v17 compatibility API
        uses: actions/download-artifact@v4
        with:
          name: nami-aniyomi-compat-api
          path: /tmp/nami-aniyomi-compat
      - name: Build maintained AnimeSogo source against Nami's v17 contract
        working-directory: v17-source
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/nami-aniyomi-compat/aniyomi-compat-debug.aar nami-aniyomi-compat.aar
          python3 - <<'PY'
          from pathlib import Path

          for file in [
              Path("core/build.gradle.kts"),
              Path("gradle/build-logic/src/main/kotlin/PluginExtensionLegacy.kt"),
              Path("gradle/build-logic/src/main/kotlin/PluginMultiSrc.kt"),
          ]:
              source = file.read_text()
              marker = "compileOnly(libs.bundles.common)"
              if marker not in source:
                  raise SystemExit(f"Could not patch compile classpath in {file}")
              indent = source[source.rfind("\n", 0, source.index(marker)) + 1:source.index(marker)]
              compat = 'add("compileOnly", files(rootProject.file("nami-aniyomi-compat.aar")))'
              source = source.replace(marker, compat + "\n" + indent + marker, 1)
              file.write_text(source)

          for file in [
              Path("core/src/main/kotlin/keiyoushi/utils/AnimeHttpLegacySource.kt"),
              Path("core/src/main/kotlin/keiyoushi/utils/ParsedAnimeHttpLegacySource.kt"),
          ]:
              source = file.read_text()
              for old, new in [
                  ("open suspend fun getVideoList(episode:", "override suspend fun getVideoList(episode:"),
                  ("open fun videoListRequest(episode:", "override fun videoListRequest(episode:"),
                  ("open fun videoListParse(response:", "override fun videoListParse(response:"),
              ]:
                  if old not in source:
                      raise SystemExit(f"Could not apply v17 source compatibility patch {old!r} in {file}")
                  source = source.replace(old, new, 1)
              file.write_text(source)

          anikoto = Path("lib-multisrc/anikototheme/src/eu/kanade/tachiyomi/multisrc/anikototheme/AnikotoTheme.kt")
          source = anikoto.read_text()
          old = "private fun videoListRequest(episode: SEpisode): Request {"
          new = "override fun videoListRequest(episode: SEpisode): Request {"
          if old not in source:
              raise SystemExit("Could not adapt AnikotoTheme episode request override to Nami's v17 contract")
          anikoto.write_text(source.replace(old, new, 1))

          PY
          cp -R src/en/animesogo src/en/animesogov17
          find src/en/animesogov17 -type f -print0 | xargs -0 sed -i \
            -e 's/libVersion = 16/libVersion = 17/' \
            -e "s/extName = 'AnimeSogo'/extName = 'AnimeSogo v17 compatibility probe'/" \
            -e 's/eu.kanade.tachiyomi.animeextension.en.animesogo/eu.kanade.tachiyomi.animeextension.en.animesogov17/g'
          test "$(grep -c 'libVersion = 17' src/en/animesogov17/build.gradle)" -eq 1
          source_file=src/en/animesogov17/src/eu/kanade/tachiyomi/animeextension/en/animesogo/AnimeSogo.kt
          test -f "$source_file"
          grep -q "package eu.kanade.tachiyomi.animeextension.en.animesogov17" "$source_file"
          gradle --no-daemon --console=plain :src:en:animesogov17:assembleDebug
          find src/en/animesogov17/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -print -quit | grep -q .
      - uses: actions/upload-artifact@v4
        with:
          name: nami-animesogo-v17-extension
          path: v17-source/src/en/animesogov17/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  extension-compat-smoke:
    needs: build-animesogo-v17
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android emulator image and SDK platform
        shell: bash
        run: |
          set -euo pipefail
          packages=(
            "emulator"
            "platforms;android-30"
            "platforms;android-36"
            "build-tools;35.0.0"
            "system-images;android-30;default;x86_64"
          )
          for attempt in 1 2 3; do
            if sdkmanager "${packages[@]}"; then
              exit 0
            fi
            echo "SDK install attempt ${attempt} failed; clearing the partial system image before retry."
            rm -rf "${ANDROID_SDK_ROOT}/system-images/android-30/default/x86_64" || true
            sleep 10
          done
          exit 1
      - name: Download real Aniyomi-compatible AnimeSogo extension
        run: curl --fail --location --retry 3 --output /tmp/animesogo.apk https://raw.githubusercontent.com/mojuru/anime-repo/ae5dcf8f2c6adc32735f818fc9a3eb051b06c5c6/apk/aniyomi-en.animesogo-v16.8.apk
      - name: Download source-built real v17 extension
        uses: actions/download-artifact@v4
        with:
          name: nami-animesogo-v17-extension
          path: /tmp/nami-animesogo-v17
      - name: Build extension smoke-test APKs before emulator startup
        working-directory: apps/nami
        run: gradle --no-daemon --console=plain :app:assembleDebug :app:assembleDebugAndroidTest :test-fixtures:v17-extension:assembleDebug :test-fixtures:v14-extension:assembleDebug
      - name: Run real extension and native-source smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          emulator-boot-timeout: 900
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 3072 -cores 2
          disable-animations: true
          script: >-
            bash -euo pipefail -c 'install_apk() { apk="$1"; label="$2"; for attempt in 1 2 3; do echo "NAMI_INSTALL=$label attempt=$attempt"; timeout 90s adb wait-for-device || true; if timeout 300s adb install -r "$apk"; then return 0; fi; echo "NAMI_INSTALL_RETRY=$label attempt=$attempt"; adb kill-server || true; sleep 3; adb start-server || true; timeout 90s adb wait-for-device || true; sleep 3; done; return 1; }; timeout 90s adb wait-for-device; v17_apk=$(find /tmp/nami-animesogo-v17 -type f -name "*.apk" -print -quit); test -n "$v17_apk"; echo NAMI_STAGE=install_extension_v14; install_apk apps/nami/test-fixtures/v14-extension/build/outputs/apk/debug/v14-extension-debug.apk extension_v14; echo NAMI_STAGE=install_extension_v16; install_apk /tmp/animesogo.apk extension_v16; echo NAMI_STAGE=install_extension_v17_real; install_apk "$v17_apk" extension_v17_real; echo NAMI_STAGE=install_extension_v17_fixture; install_apk apps/nami/test-fixtures/v17-extension/build/outputs/apk/debug/v17-extension-debug.apk extension_v17_fixture; echo NAMI_STAGE=install_nami; install_apk apps/nami/app/build/outputs/apk/debug/app-x86_64-debug.apk nami; echo NAMI_STAGE=install_instrumentation; install_apk apps/nami/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk instrumentation; echo NAMI_STAGE=launch_app; launch_result=0; timeout 30s adb shell am start -W -n app.nami.android/.MainActivity || launch_result=$?; sleep 8; app_pid=$(timeout 90s adb shell pidof app.nami.android || true); echo NAMI_APP_PID=$app_pid; if [ -z "$app_pid" ] || [ "$launch_result" -ne 0 ]; then echo NAMI_LAUNCH_FAILURE=$launch_result; timeout 60s adb logcat -d -v time -t 500 *:E; exit 1; fi; echo NAMI_STAGE=capture_launch; timeout 60s adb exec-out screencap -p > "$GITHUB_WORKSPACE/nami-emulator-launch.png" || true; echo NAMI_STAGE=run_instrumentation; set +e; output=$(timeout 600s adb shell am instrument -w -r -e class app.nami.android.compat.AniyomiCompatibilitySmokeTest app.nami.android.test/androidx.test.runner.AndroidJUnitRunner 2>&1); result=$?; set -e; printf "%s\n" "$output" | tee "$GITHUB_WORKSPACE/nami-instrumentation.txt"; timeout 60s adb logcat -d -v time | tee "$GITHUB_WORKSPACE/nami-smoke-logcat.txt" >/dev/null || true; timeout 60s adb logcat -d -s NamiAniyomiCompat:W NamiSourceSmoke:I AndroidRuntime:E ActivityManager:E; if [ "$result" -ne 0 ]; then exit "$result"; fi; echo "$output" | grep -Eq "OK .+ tests?" || { echo Instrumentation_did_not_report_a_passing_test; exit 1; }; echo NAMI_STAGE=run_ui_screenshot_smoke; adb shell rm -rf /sdcard/Android/data/app.nami.android/files/nami-screenshots || true; set +e; ui_output=$(timeout 650s adb shell am instrument -w -r -e class app.nami.android.ui.NamiUiScreenshotTest app.nami.android.test/androidx.test.runner.AndroidJUnitRunner 2>&1); ui_result=$?; set -e; printf "%s\n" "$ui_output" | tee "$GITHUB_WORKSPACE/nami-ui-instrumentation.txt"; if [ "$ui_result" -ne 0 ]; then exit "$ui_result"; fi; echo "$ui_output" | grep -Eq "OK .+ tests?" || { echo UI_screenshot_instrumentation_did_not_report_a_passing_test; exit 1; }; mkdir -p "$GITHUB_WORKSPACE/nami-screenshots"; timeout 120s adb pull /sdcard/Android/data/app.nami.android/files/nami-screenshots/. "$GITHUB_WORKSPACE/nami-screenshots/"; test -s "$GITHUB_WORKSPACE/nami-screenshots/01-home.png"; test -s "$GITHUB_WORKSPACE/nami-screenshots/03-search-results-bleach.png"; test -s "$GITHUB_WORKSPACE/nami-screenshots/04-anime-details.png"; test -s "$GITHUB_WORKSPACE/nami-screenshots/05-episodes.png"; test -s "$GITHUB_WORKSPACE/nami-screenshots/06-downloads.png"; test -s "$GITHUB_WORKSPACE/nami-screenshots/07-player-controls.png"; test -s "$GITHUB_WORKSPACE/nami-screenshots/08-player-video-visible.png"'

      - name: Upload emulator smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nami-emulator-smoke-evidence
          path: |
            nami-emulator-launch.png
            nami-instrumentation.txt
            nami-ui-instrumentation.txt
            nami-smoke-logcat.txt
            nami-screenshots/**
          if-no-files-found: ignore


  min-sdk-26-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install API 26 emulator image and SDK platform
        shell: bash
        run: |
          set -euo pipefail
          packages=(
            "emulator"
            "platforms;android-26"
            "platforms;android-36"
            "build-tools;35.0.0"
            "system-images;android-26;default;x86_64"
          )
          for attempt in 1 2 3; do
            if sdkmanager "${packages[@]}"; then
              exit 0
            fi
            echo "API 26 SDK install attempt ${attempt} failed; clearing partial emulator packages before retry."
            rm -rf "${ANDROID_SDK_ROOT}/emulator" || true
            rm -rf "${ANDROID_SDK_ROOT}/system-images/android-26/default/x86_64" || true
            sleep 10
          done
          exit 1
      - name: Build minimum-SDK smoke APKs
        working-directory: apps/nami
        run: gradle --no-daemon --console=plain :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Run API 26 storage and migration smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 26
          target: default
          arch: x86_64
          emulator-boot-timeout: 900
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 2560 -cores 2
          disable-animations: true
          script: >-
            bash -euo pipefail -c 'install_apk() { apk="$1"; for attempt in 1 2 3; do timeout 90s adb wait-for-device || true; if timeout 300s adb install -r "$apk"; then return 0; fi; adb kill-server || true; sleep 3; adb start-server || true; timeout 90s adb wait-for-device || true; done; return 1; }; install_apk apps/nami/app/build/outputs/apk/debug/app-x86_64-debug.apk; install_apk apps/nami/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk; adb shell pm grant app.nami.android android.permission.WRITE_EXTERNAL_STORAGE || true; adb shell pm grant app.nami.android.test android.permission.WRITE_EXTERNAL_STORAGE || true; timeout 30s adb shell am start -W -n app.nami.android/.MainActivity; sleep 8; app_pid=$(timeout 60s adb shell pidof app.nami.android || true); test -n "$app_pid"; timeout 60s adb exec-out screencap -p > "$GITHUB_WORKSPACE/nami-api26-launch.png" || true; set +e; output=$(timeout 300s adb shell am instrument -w -r -e class app.nami.android.compat.MinSdk26SmokeTest app.nami.android.test/androidx.test.runner.AndroidJUnitRunner 2>&1); result=$?; set -e; printf "%s\n" "$output" | tee "$GITHUB_WORKSPACE/nami-api26-instrumentation.txt"; timeout 60s adb logcat -d -v time | tee "$GITHUB_WORKSPACE/nami-api26-logcat.txt" >/dev/null || true; if [ "$result" -ne 0 ]; then exit "$result"; fi; echo "$output" | grep -Eq "OK .+ tests?"'
      - name: Upload API 26 smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nami-api26-smoke-evidence
          path: |
            nami-api26-launch.png
            nami-api26-instrumentation.txt
            nami-api26-logcat.txt
          if-no-files-found: ignore

  api-36-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install API 36 emulator image and SDK platform
        shell: bash
        run: |
          set -euo pipefail
          packages=(
            "emulator"
            "platforms;android-36"
            "build-tools;35.0.0"
            "system-images;android-36;google_apis;x86_64"
          )
          for attempt in 1 2 3; do
            if sdkmanager "${packages[@]}"; then
              exit 0
            fi
            echo "API 36 SDK install attempt ${attempt} failed; clearing partial emulator packages before retry."
            rm -rf "${ANDROID_SDK_ROOT}/emulator" || true
            rm -rf "${ANDROID_SDK_ROOT}/system-images/android-36/google_apis/x86_64" || true
            sleep 10
          done
          exit 1
      - name: Build API 36 smoke APKs
        working-directory: apps/nami
        run: gradle --no-daemon --console=plain :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Run Android 16 startup and persistence smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          emulator-boot-timeout: 900
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 3072 -cores 2
          disable-animations: true
          script: >-
            bash -euo pipefail -c 'install_apk() { apk="$1"; for attempt in 1 2 3; do timeout 90s adb wait-for-device || true; if timeout 300s adb install -r "$apk"; then return 0; fi; adb kill-server || true; sleep 3; adb start-server || true; timeout 90s adb wait-for-device || true; done; return 1; }; install_apk apps/nami/app/build/outputs/apk/debug/app-x86_64-debug.apk; install_apk apps/nami/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk; timeout 30s adb shell am start -W -n app.nami.android/.MainActivity; sleep 8; app_pid=$(timeout 60s adb shell pidof app.nami.android || true); test -n "$app_pid"; timeout 60s adb exec-out screencap -p > "$GITHUB_WORKSPACE/nami-api36-launch.png" || true; set +e; output=$(timeout 300s adb shell am instrument -w -r -e class app.nami.android.compat.Api36SmokeTest app.nami.android.test/androidx.test.runner.AndroidJUnitRunner 2>&1); result=$?; set -e; printf "%s\n" "$output" | tee "$GITHUB_WORKSPACE/nami-api36-instrumentation.txt"; timeout 60s adb logcat -d -v time | tee "$GITHUB_WORKSPACE/nami-api36-logcat.txt" >/dev/null || true; if [ "$result" -ne 0 ]; then exit "$result"; fi; echo "$output" | grep -Eq "OK .+ tests?"'
      - name: Upload API 36 smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nami-api36-smoke-evidence
          path: |
            nami-api36-launch.png
            nami-api36-instrumentation.txt
            nami-api36-logcat.txt
          if-no-files-found: ignore

