name: Slumber by Night 0.5.0 Fix This Build

on:
  push:
    branches: ["pianohub-ci"]
    paths:
      - ".github/workflows/slumber-050-ci.yml"
      - ".ci/slumber_patch_050.diff"

permissions:
  actions: read
  contents: read

jobs:
  build-verify-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4

      - name: Restore Slumber 0.5.0 source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/slumber
          mkdir -p /tmp/slumber
          cat \
            .ci/slumber_payload_041_final/part01.txt \
            .ci/slumber_payload_041_final/part02.txt \
            .ci/slumber_payload_041_final/part03.txt \
            .ci/slumber_payload_041_final/part04a.txt \
            .ci/slumber_payload_041_final/part04b00.txt \
            .ci/slumber_payload_041_final/part04b01.txt \
            .ci/slumber_payload_041_final/part04b02.txt \
            .ci/slumber_payload_041_final/part04b03a.txt \
            .ci/slumber_payload_041_final/part04b03b.txt \
            .ci/slumber_payload_041_final/part04b03c.txt \
            .ci/slumber_payload_041_final/part04b04.txt \
            .ci/slumber_payload_041_final/part05.txt \
            .ci/slumber_payload_041_final/part06.txt \
            .ci/slumber_payload_041_final/part07.txt \
            .ci/slumber_payload_041_final/part08.txt \
            | tr -d '\n' | base64 --decode > /tmp/slumber-source.tgz
          echo "0ed8c8e3cecaabc912d3555ad5942576501e35f983d9f7769cc10d131b2194db  /tmp/slumber-source.tgz" | sha256sum -c -
          tar -xzf /tmp/slumber-source.tgz -C /tmp/slumber
          echo "8c01b09e8fd76f95560f9149498c065950f7cbf7c90eb3e25750d3253ad7671d  .ci/slumber_patch_042.diff" | sha256sum -c -
          cd /tmp/slumber
          patch -p1 < "$GITHUB_WORKSPACE/.ci/slumber_patch_042.diff"
          patch -p1 < "$GITHUB_WORKSPACE/.ci/slumber_patch_050.diff"
          grep -q 'versionName = "0.5.0"' app/build.gradle.kts
          grep -q 'object AdaptivePracticePlanner' app/src/main/java/com/night/pianohub/learner/AdaptivePractice.kt
          grep -q 'Text("Fix This"' app/src/main/java/com/night/pianohub/ui/screens/PianoScreen.kt

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: "15859902"

      - name: Install compile SDK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --channel=3 "platforms;android-37.0" "build-tools;37.0.0"
          test -f "$ANDROID_SDK_ROOT/platforms/android-37.0/android.jar"

      - name: Run all regression tests
        working-directory: /tmp/slumber
        run: gradle --stacktrace testDebugUnitTest

      - name: Build Slumber 0.5.0 APK
        working-directory: /tmp/slumber
        run: gradle --stacktrace assembleDebug

      - name: Verify APK and bundled piano
        shell: bash
        run: |
          set -euo pipefail
          test -s /tmp/slumber/app/build/outputs/apk/debug/app-debug.apk
          COUNT=$(unzip -l /tmp/slumber/app/build/outputs/apk/debug/app-debug.apk | grep -E 'assets/piano/.*\.mp3$' | wc -l)
          echo "Bundled Yamaha C5 recordings: $COUNT"
          test "$COUNT" -eq 120
          unzip -l /tmp/slumber/app/build/outputs/apk/debug/app-debug.apk | grep -q 'classes.dex'
          sha256sum /tmp/slumber/app/build/outputs/apk/debug/app-debug.apk > /tmp/slumber-0.5.0-apk-sha256.txt

      - name: Package verified source
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/slumber
          tar --exclude='./.gradle' --exclude='./build' --exclude='./app/build' --exclude='./runtime' -czf /tmp/slumber-production-0.5.0-source.tgz .

      - name: Upload source and APK
        uses: actions/upload-artifact@v4
        with:
          name: slumber-production-0.5.0-source-and-apk
          path: |
            /tmp/slumber-production-0.5.0-source.tgz
            /tmp/slumber/app/build/outputs/apk/debug/app-debug.apk
            /tmp/slumber-0.5.0-apk-sha256.txt
          if-no-files-found: error

      - name: Enable KVM
        shell: bash
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -r /dev/kvm
          test -w /dev/kvm

      - name: Android 36 runtime gate
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ANDROID_EMULATOR_WAIT_TIME_BEFORE_KILL: 1
        with:
          api-level: 36
          arch: x86_64
          target: default
          profile: pixel_6
          cores: 2
          emulator-boot-timeout: 300
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot-save -no-metrics
          script: |
            mkdir -p /tmp/slumber/runtime
            adb install -r /tmp/slumber/app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am force-stop com.night.pianohub
            adb shell am start -W -n com.night.pianohub/.MainActivity > /tmp/slumber/runtime/activity-start.txt
            sleep 6
            adb shell pidof com.night.pianohub > /tmp/slumber/runtime/pid.txt
            test -s /tmp/slumber/runtime/pid.txt
            adb exec-out screencap -p > /tmp/slumber/runtime/01-learn.png
            test -s /tmp/slumber/runtime/01-learn.png
            adb logcat -d -t 1200 > /tmp/slumber/runtime/logcat-tail.txt
            sh -c '! grep -E "FATAL EXCEPTION.*com\\.night\\.pianohub|Process: com\\.night\\.pianohub.*FATAL EXCEPTION" /tmp/slumber/runtime/logcat-tail.txt'

      - name: Upload runtime proof
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: slumber-production-0.5.0-runtime-proof
          path: /tmp/slumber/runtime/*
          if-no-files-found: warn
