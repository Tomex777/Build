name: Slumber 0.8.11 Audio Engine Build

on:
  push:
    branches: ["pianohub-ci"]
    paths:
      - ".github/workflows/slumber-091-audio-engine-build.yml"
      - ".ci/slumber_091_audio_conversion/**"

permissions:
  actions: read
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct verified 0.8.10 source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/slumber-base /tmp/slumber /tmp/slumber-out
          mkdir -p /tmp/slumber-base /tmp/slumber /tmp/slumber-out
          gh run download 34945773781 --repo Tomex777/Build --name slumber-0.8.10-integration --dir /tmp/slumber-base
          SRC=$(find /tmp/slumber-base -name 'slumber-0.8.10-source.tgz' -type f -print -quit)
          test -n "$SRC"
          echo '836590304e949ab79c010fd3942f1387620db821c942ca79986e19e198226d71  '"$SRC" | sha256sum -c -
          tar -xzf "$SRC" -C /tmp/slumber

      - name: Apply 0.8.11 audio engine
        shell: bash
        run: |
          set -euo pipefail
          D="$GITHUB_WORKSPACE/.ci/slumber_091_audio_conversion"
          echo '43ab9805475bdd8731a47e7e458ab8dd8c33339da01742e0ebf19b676c85589b  '"$D/audio_engine.patch.gz.b64" | sha256sum -c -
          base64 -d "$D/audio_engine.patch.gz.b64" > /tmp/audio.patch.gz
          echo '6b56a1ff2629b2f5f679cf8d9c6641c19c79daa53b92170fbed44ee8e57913ed  /tmp/audio.patch.gz' | sha256sum -c -
          gzip -dc /tmp/audio.patch.gz > /tmp/audio.patch
          echo 'b4264b2108883583dba00cc294d02baa9d4b57c8c6fa23297af13b327fa05f8f  /tmp/audio.patch' | sha256sum -c -
          cd /tmp/slumber
          patch --dry-run -p1 < /tmp/audio.patch
          patch -p1 < /tmp/audio.patch

      - name: Source gates
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/slumber
          grep -q 'versionCode = 23' app/build.gradle.kts
          grep -q 'versionName = "0.8.11"' app/build.gradle.kts
          grep -q 'androidx.work:work-runtime-ktx:2.11.2' app/build.gradle.kts
          grep -q 'com.google.ai.edge.litert:litert:1.4.2' app/build.gradle.kts
          grep -R -q 'class AudioLessonWorker' app/src/main/java/com/night/pianohub/transcription
          grep -R -q 'EXPECTED_GIT_BLOB_SHA1 = "85a41befdd036e9b365a052b7c704c6810288b95"' app/src/main/java/com/night/pianohub/transcription
          if grep -R -nEi 'coming soon|prepare lesson|engine boundary|model adapter|fake progress|placeholder conversion' app/src/main/java/com/night/pianohub; then
            echo 'Prototype/fake production copy reintroduced' >&2
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --channel=3 "platform-tools" "platforms;android-37.0" "build-tools;37.0.0"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

      - name: Unit tests
        working-directory: /tmp/slumber
        run: gradle --stacktrace testDebugUnitTest

      - name: Build debug APK
        working-directory: /tmp/slumber
        run: gradle --stacktrace assembleDebug

      - name: Verify APK metadata
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          AAPT="$SDK_ROOT/build-tools/37.0.0/aapt"
          APK=/tmp/slumber/app/build/outputs/apk/debug/app-debug.apk
          "$AAPT" dump badging "$APK" | tee /tmp/slumber-out/apk-badging.txt
          grep -q "package: name='com.night.pianohub'" /tmp/slumber-out/apk-badging.txt
          grep -q "versionName='0.8.11'" /tmp/slumber-out/apk-badging.txt
          grep -q "sdkVersion:'26'" /tmp/slumber-out/apk-badging.txt

      - name: Package source and APK
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/slumber/app/build/outputs/apk/debug/app-debug.apk /tmp/slumber-out/Slumber-0.8.11-audio-engine-debug.apk
          sha256sum /tmp/slumber-out/Slumber-0.8.11-audio-engine-debug.apk | tee /tmp/slumber-out/apk-sha256.txt
          cd /tmp/slumber
          tar --exclude='./.gradle' --exclude='./build' --exclude='./app/build' -czf /tmp/slumber-out/slumber-0.8.11-audio-engine-source.tgz .
          sha256sum /tmp/slumber-out/slumber-0.8.11-audio-engine-source.tgz | tee /tmp/slumber-out/source-sha256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: slumber-0.8.11-audio-engine
          path: /tmp/slumber-out/*
          if-no-files-found: error
