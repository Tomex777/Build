name: Sora Arcade Android Acceptance

on:
  workflow_dispatch:
  push:
    branches: [sora-player-release-hardening-20261012]
    paths:
      - 'sora-overlay/**'
      - 'sora-ci/hub-tabs-smoke.sh'
      - 'sora-ci/arcade-saved-media-smoke.sh'
      - '.github/workflows/sora-arcade-android-acceptance.yml'

concurrency:
  group: sora-arcade-${{ github.ref }}
  cancel-in-progress: true

jobs:
  all-twelve-games:
    strategy:
      fail-fast: false
      matrix:
        api: [26, 36]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    name: 12 games on Android API ${{ matrix.api }}
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct current Sora sources
        run: |
          set -euo pipefail
          cat sora-ci/chunks/part-*.txt | base64 -d > /tmp/sora-arcade.zip
          unzip -q /tmp/sora-arcade.zip -d /tmp/sora-arcade-src
          ROOT=/tmp/sora-arcade-src/Sora_Android_v0_1
          test -f "$ROOT/settings.gradle.kts"
          cp -R sora-overlay/. "$ROOT/"
          echo "SORA_ROOT=$ROOT" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Build real app and media extensions
        working-directory: /tmp/sora-arcade-src/Sora_Android_v0_1
        run: gradle --stacktrace :app:assembleDebug :live-extension:assembleDebug :meme-extension:assembleDebug
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test all 12 playable games on a real emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          SORA_ONLY_GAMES: '1'
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            bash "$GITHUB_WORKSPACE/sora-ci/hub-tabs-smoke.sh"
            bash "$GITHUB_WORKSPACE/sora-ci/arcade-saved-media-smoke.sh"
      - name: Upload real Android game screenshots and failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sora-arcade-api${{ matrix.api }}-screenshots
          path: |
            /tmp/sora-hub-tabs
            /tmp/sora-arcade-saved-media
          if-no-files-found: warn
          retention-days: 14
