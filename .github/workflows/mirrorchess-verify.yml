name: MirrorChess runtime verification

on:
  push:
    branches:
      - verify/mirrorchess-20260908
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Download tested MirrorChess APK
        uses: actions/download-artifact@v4
        with:
          name: mirrorchess-verification
          path: prior-verification
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 34220957810

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 emulator
        run: |
          sdkmanager \
            "platform-tools" \
            "emulator" \
            "system-images;android-36;google_apis;x86_64"

      - name: Boot Android 36 emulator
        run: |
          export ANDROID_AVD_HOME="$GITHUB_WORKSPACE/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | avdmanager create avd \
            --force \
            --name mirrorchess-ci \
            --package "system-images;android-36;google_apis;x86_64" \
            --device pixel_2
          "$ANDROID_HOME/emulator/emulator" -list-avds
          test -f "$ANDROID_AVD_HOME/mirrorchess-ci.ini"
          sudo chmod 666 /dev/kvm || true
          nohup "$ANDROID_HOME/emulator/emulator" @mirrorchess-ci \
            -no-window \
            -noaudio \
            -no-boot-anim \
            -no-snapshot \
            -wipe-data \
            -gpu swiftshader_indirect \
            > "$GITHUB_WORKSPACE/emulator.log" 2>&1 &
          emulator_pid=$!
          booted=0
          for attempt in {1..120}; do
            if ! kill -0 "$emulator_pid" 2>/dev/null; then
              echo "Android emulator exited before boot completed" >&2
              cat "$GITHUB_WORKSPACE/emulator.log"
              exit 1
            fi
            if [[ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" == "1" ]]; then
              booted=1
              break
            fi
            sleep 5
          done
          if [[ "$booted" != "1" ]]; then
            echo "Android emulator did not finish booting" >&2
            cat "$GITHUB_WORKSPACE/emulator.log"
            exit 1
          fi
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb shell settings put global hide_error_dialogs 1
          adb shell settings put global anr_show_background 0
          adb shell input keyevent KEYCODE_HOME
          sleep 20

      - name: Install and launch MirrorChess
        run: |
          mkdir -p runtime
          apk_path="prior-verification/mirrorchess/source/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$apk_path"
          adb install -r -g "$apk_path"
          adb logcat -c
          adb shell am force-stop com.night.mirrorchess
          adb shell am start -W -n com.night.mirrorchess/.MainActivity \
            | tee runtime/launch.txt
          grep -q "Status: ok" runtime/launch.txt
          sleep 8
          adb shell pidof com.night.mirrorchess | tee runtime/pid.txt
          test -s runtime/pid.txt
          adb shell dumpsys window windows > runtime/window-launch.txt
          grep -q "mCurrentFocus.*com.night.mirrorchess" runtime/window-launch.txt
          adb exec-out screencap -p > runtime/play-home.png
          adb shell input tap 540 1480
          sleep 5
          adb shell uiautomator dump /sdcard/mirrorchess-game.xml
          adb pull /sdcard/mirrorchess-game.xml runtime/game-ui.xml
          grep -q 'text="Mirror Chess"' runtime/game-ui.xml
          grep -q 'text="MOVE HISTORY"' runtime/game-ui.xml
          adb shell pidof com.night.mirrorchess > runtime/game-pid.txt
          test -s runtime/game-pid.txt
          adb shell dumpsys window windows > runtime/window-game.txt
          grep -q "mCurrentFocus.*com.night.mirrorchess" runtime/window-game.txt
          adb exec-out screencap -p > runtime/game.png
          adb shell dumpsys activity activities > runtime/activity.txt
          adb logcat -d > runtime/logcat.txt
          if grep -A 25 "FATAL EXCEPTION" runtime/logcat.txt \
            | grep -q "com.night.mirrorchess"; then
            echo "MirrorChess crashed during launch" >&2
            exit 1
          fi

      - name: Upload launch evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mirrorchess-runtime
          if-no-files-found: warn
          retention-days: 14
          path: |
            runtime/
            emulator.log
