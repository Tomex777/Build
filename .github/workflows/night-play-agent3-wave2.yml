name: NIGHT Play Agent 3 Wave 2 Touch Physics

on:
  pull_request:
    branches:
      - feature/party-online-rooms-20261019
    paths:
      - 'night-play/action/**'
      - '.github/workflows/night-play-agent3-wave2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-touch-gameplay:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install exact Playwright package for local Chrome
        run: npm install --no-save playwright@1.56.1
      - name: Drive real Chromium touch, collision, progression and restart
        run: node night-play/action/agent3-wave2-touch.mjs
      - name: Keep visual/interaction evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: night-play-agent3-wave2-touch
          path: |
            night-play/visual-output/agent3-wave2-*.jpg
            night-play/visual-output/agent3-wave2-*.json
          retention-days: 14
