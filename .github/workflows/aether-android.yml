name: Aether Android

on:
  push:
    branches: [aether-android-ci]
    paths:
      - 'aether/**'
      - 'aether-server/**'
      - '.github/workflows/aether-android.yml'
      - 'README_AETHER.md'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build debug APK
        working-directory: aether
        run: gradle :app:assembleDebug --stacktrace
      - name: Check AI server syntax
        working-directory: aether-server
        run: node --check index.js
      - uses: actions/upload-artifact@v4
        with:
          name: aether-debug-apk
          path: aether/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  screenshot:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: aether-debug-apk
          path: artifacts
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r artifacts/app-debug.apk
            adb shell am force-stop com.tomex.aether
            adb shell am start -W -n com.tomex.aether/.MainActivity
            sleep 8
            FOCUS="$(adb shell dumpsys window | grep -E 'mCurrentFocus|mFocusedApp' | tail -n 4)"
            echo "$FOCUS"
            if ! echo "$FOCUS" | grep -q 'com.tomex.aether'; then
              # CI launchers occasionally surface their own ANR dialog during first boot.
              # Dismiss system UI noise, then launch Aether directly again.
              adb shell input keyevent KEYCODE_BACK || true
              adb shell am start -W -n com.tomex.aether/.MainActivity
              sleep 4
            fi
            adb shell dumpsys activity activities | grep -E 'mResumedActivity|topResumedActivity' | tail -n 4
            adb shell pidof com.tomex.aether
            adb shell dumpsys activity activities | grep -E 'mResumedActivity|topResumedActivity' | grep -q 'com.tomex.aether' || {
              echo "Aether is not the resumed activity"
              exit 1
            }
            adb exec-out screencap -p > aether-home.png
      - uses: actions/upload-artifact@v4
        with:
          name: aether-ui-screenshot
          path: aether-home.png
          if-no-files-found: error
