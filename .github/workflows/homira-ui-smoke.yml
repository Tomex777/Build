name: Homira UI Smoke

concurrency:
  group: homira-ui-smoke-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [homira-call-ci]
    paths:
      - 'homira-android/**'
      - '.github/workflows/homira-ui-smoke.yml'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - api-level: 26
            target: default
          - api-level: 36
            target: google_apis

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build debug APK
        working-directory: homira-android
        run: gradle :app:assembleDebug --stacktrace

      - name: Build release-mode startup APK
        if: matrix.api-level == 36
        working-directory: homira-android
        run: |
          set -euo pipefail
          gradle :app:assembleRelease --stacktrace
          keytool -genkeypair -noprompt             -keystore /tmp/homira-smoke.jks             -storepass homira-smoke             -keypass homira-smoke             -alias smoke             -keyalg RSA             -keysize 2048             -validity 1             -dname "CN=Homira Smoke"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -p -f 4             app/build/outputs/apk/release/app-release-unsigned.apk             /tmp/homira-release-aligned.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign             --ks /tmp/homira-smoke.jks             --ks-key-alias smoke             --ks-pass pass:homira-smoke             --key-pass pass:homira-smoke             --out app/build/outputs/apk/release/homira-release-smoke.apk             /tmp/homira-release-aligned.apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Exercise main UI in emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: bash .github/scripts/homira_ui_smoke.sh ${{ matrix.api-level }}
      - name: Run Android lint
        id: lint
        if: matrix.api-level == 36
        continue-on-error: true
        working-directory: homira-android
        run: gradle :app:lintDebug --stacktrace

      - name: Upload lint reports
        if: matrix.api-level == 36 && always()
        uses: actions/upload-artifact@v4
        with:
          name: homira-lint-debug
          path: |
            homira-android/app/build/reports/lint-results-debug.html
            homira-android/app/build/reports/lint-results-debug.sarif
            homira-android/app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt
          if-no-files-found: warn

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: homira-ui-smoke-api-${{ matrix.api-level }}
          path: homira-android/app/build/ui-smoke/
          if-no-files-found: warn

      - name: Require clean lint
        if: matrix.api-level == 36 && always()
        run: test "${{ steps.lint.outcome }}" = "success"
