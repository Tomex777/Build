name: Homira UI Smoke

on:
  push:
    branches: [homira-call-ci]
    paths:
      - 'homira-android/app/src/main/java/com/night/homira/ui/HomiraProductionApp.kt'
      - 'homira-android/app/src/main/java/com/night/homira/ui/HomiraAuthGate.kt'
      - 'homira-android/app/src/main/java/com/night/homira/call/**'
      - 'homira-android/app/src/debug/**'
      - '.github/workflows/homira-ui-smoke.yml'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - api-level: 26
            target: default
          - api-level: 36
            target: google_apis

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build debug APK
        working-directory: homira-android
        run: gradle :app:assembleDebug --stacktrace

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Exercise main UI in emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            set -eu
            adb wait-for-device
            adb install -r homira-android/app/build/outputs/apk/debug/app-debug.apk
            mkdir -p homira-android/app/build/ui-smoke
            adb logcat -c
            adb shell am force-stop com.night.homira
            adb shell am start -W -n com.night.homira/.HomiraSmokeActivity

            sleep 1
            adb shell pidof com.night.homira | grep -q .
            adb exec-out screencap -p > homira-android/app/build/ui-smoke/keypad.png

            adb shell input tap 405 1700
            sleep 0.35
            adb shell pidof com.night.homira | grep -q .
            adb exec-out screencap -p > homira-android/app/build/ui-smoke/recents.png

            adb shell input tap 675 1700
            sleep 0.35
            adb shell pidof com.night.homira | grep -q .
            adb exec-out screencap -p > homira-android/app/build/ui-smoke/contacts.png

            adb shell input tap 945 1700
            sleep 0.35
            adb shell pidof com.night.homira | grep -q .
            adb exec-out screencap -p > homira-android/app/build/ui-smoke/me.png

            adb shell input tap 135 1700
            sleep 0.35
            adb shell pidof com.night.homira | grep -q .
            adb exec-out screencap -p > homira-android/app/build/ui-smoke/keypad-return.png

            adb logcat --pid="$(adb shell pidof com.night.homira)" -d > homira-android/app/build/ui-smoke/logcat.txt
            ! grep -q "FATAL EXCEPTION" homira-android/app/build/ui-smoke/logcat.txt

            adb logcat -c
            adb shell am force-stop com.night.homira
            adb shell am start -W -n com.night.homira/.HomiraLiveSmokeActivity
            sleep 8
            adb logcat -d > homira-android/app/build/ui-smoke/live-logcat.txt
            ! grep -q "FATAL EXCEPTION" homira-android/app/build/ui-smoke/live-logcat.txt
            adb shell pidof com.night.homira | grep -q .
            adb exec-out screencap -p > homira-android/app/build/ui-smoke/live-main.png

      - name: Run Android lint
        if: matrix.api-level == 36
        working-directory: homira-android
        run: gradle :app:lintDebug --stacktrace

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: homira-ui-smoke-api-${{ matrix.api-level }}
          path: homira-android/app/build/ui-smoke/
          if-no-files-found: error
