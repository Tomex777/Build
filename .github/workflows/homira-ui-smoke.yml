name: Homira UI Smoke

concurrency:
  group: homira-ui-smoke-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [homira-call-ci]
    paths:
      - 'homira-android/**'
      - '.github/workflows/homira-ui-smoke.yml'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - api-level: 26
            target: default
          - api-level: 36
            target: google_apis

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build debug APK
        working-directory: homira-android
        run: gradle :app:assembleDebug --stacktrace

      - name: Build release-mode startup APK
        if: matrix.api-level == 36
        working-directory: homira-android
        run: |
          set -euo pipefail
          gradle :app:assembleRelease --stacktrace
          keytool -genkeypair -noprompt             -keystore /tmp/homira-smoke.jks             -storepass homira-smoke             -keypass homira-smoke             -alias smoke             -keyalg RSA             -keysize 2048             -validity 1             -dname "CN=Homira Smoke"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -p -f 4             app/build/outputs/apk/release/app-release-unsigned.apk             /tmp/homira-release-aligned.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign             --ks /tmp/homira-smoke.jks             --ks-key-alias smoke             --ks-pass pass:homira-smoke             --key-pass pass:homira-smoke             --out app/build/outputs/apk/release/homira-release-smoke.apk             /tmp/homira-release-aligned.apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Exercise main UI in emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            set -eu
            adb wait-for-device
            adb install -r homira-android/app/build/outputs/apk/debug/app-debug.apk
            mkdir -p homira-android/app/build/ui-smoke
            adb logcat -c || true
            adb shell am force-stop com.night.homira
            adb shell am start -W -n com.night.homira/.HomiraSmokeActivity

            sleep 1
            adb shell pidof com.night.homira | grep -q .

            cat > /tmp/homira-ui-node.py <<'PY'
            import re
            import sys
            import xml.etree.ElementTree as ET

            mode, target = sys.argv[1], sys.argv[2]
            root = ET.parse("/tmp/homira-window.xml").getroot()
            matches = []
            for node in root.iter("node"):
                text = node.attrib.get("text", "")
                desc = node.attrib.get("content-desc", "")
                if text == target or desc == target:
                    bounds = node.attrib.get("bounds", "")
                    found = re.fullmatch(
                        r"\[(\d+),(\d+)\]\[(\d+),(\d+)\]",
                        bounds,
                    )
                    if found:
                        left, top, right, bottom = map(
                            int,
                            found.groups(),
                        )
                        matches.append(
                            ((left + right) // 2, (top + bottom) // 2)
                        )

            if mode == "assert":
                if not matches:
                    raise SystemExit(
                        f"UI node not found: {target!r}"
                    )
                raise SystemExit(0)

            if not matches:
                raise SystemExit(
                    f"UI node not found: {target!r}"
                )

            print(*matches[0])
            PY

            dump_ui() {
              adb shell uiautomator dump /sdcard/homira-window.xml >/dev/null
              adb pull /sdcard/homira-window.xml /tmp/homira-window.xml >/dev/null
            }

            assert_ui() {
              dump_ui
              python3 /tmp/homira-ui-node.py assert "$1"
            }

            tap_ui() {
              dump_ui
              coords="$(python3 /tmp/homira-ui-node.py tap "$1")"
              set -- $coords
              adb shell input tap "$1" "$2"
              sleep 0.8
            }

            assert_clean_app_log() {
              file="$1"
              if grep -Eiq                 'FATAL EXCEPTION|Process: com\.night\.homira|coroutine scope left the composition|ANR in com\.night\.homira'                 "$file"; then
                echo "Homira runtime failure found in $file"
                grep -Ein                   'FATAL EXCEPTION|Process: com\.night\.homira|coroutine scope left the composition|ANR in com\.night\.homira'                   "$file" || true
                exit 1
              fi
            }

            assert_ui "Keypad"
            adb exec-out screencap -p > homira-android/app/build/ui-smoke/keypad.png

            tap_ui "Recents"
            assert_ui "Recents"
            adb exec-out screencap -p > homira-android/app/build/ui-smoke/recents.png

            tap_ui "Filter calls"
            assert_ui "Missed calls"
            assert_ui "Rejected calls"
            assert_ui "Outgoing calls"
            assert_ui "Incoming calls"
            assert_ui "Direct voicemail"
            adb exec-out screencap -p > homira-android/app/build/ui-smoke/recents-filter.png
            adb shell input keyevent 4
            sleep 0.5

            tap_ui "Contacts"
            assert_ui "Contacts"
            assert_ui "Ada"
            adb exec-out screencap -p > homira-android/app/build/ui-smoke/contacts.png

            tap_ui "Ada"
            assert_ui "Voice"
            assert_ui "Info"
            assert_ui "Video"
            adb exec-out screencap -p > homira-android/app/build/ui-smoke/contact-actions.png

            tap_ui "Info"
            assert_ui "Favorite"
            assert_ui "Share contact"
            assert_ui "Delete contact"
            adb exec-out screencap -p > homira-android/app/build/ui-smoke/contact-info.png
            adb shell input keyevent 4
            sleep 0.5

            tap_ui "Me"
            assert_ui "Me"
            assert_ui "Profile"
            assert_ui "Calls"
            assert_ui "Privacy"
            assert_ui "Notifications"
            assert_ui "Account"
            assert_ui "About"
            adb exec-out screencap -p > homira-android/app/build/ui-smoke/me.png

            tap_ui "Contacts"
            tap_ui "Ada"
            tap_ui "Voice"
            assert_ui "Mute"
            assert_ui "Speaker"
            assert_ui "Video"
            adb exec-out screencap -p > homira-android/app/build/ui-smoke/voice-call.png
            tap_ui "End call"
            sleep 0.8

            tap_ui "Keypad"
            assert_ui "Keypad"
            adb exec-out screencap -p > homira-android/app/build/ui-smoke/keypad-return.png

            adb logcat --pid="$(adb shell pidof com.night.homira)" -d > homira-android/app/build/ui-smoke/logcat.txt
            assert_clean_app_log homira-android/app/build/ui-smoke/logcat.txt

            adb logcat -c || true
            adb shell am force-stop com.night.homira
            adb shell am start -W -n com.night.homira/.HomiraLiveSmokeActivity
            sleep 8
            adb logcat -d > homira-android/app/build/ui-smoke/live-logcat.txt
            assert_clean_app_log homira-android/app/build/ui-smoke/live-logcat.txt
            adb shell pidof com.night.homira | grep -q .
            adb exec-out screencap -p > homira-android/app/build/ui-smoke/live-main.png

            adb logcat -c || true
            adb shell am force-stop com.night.homira
            adb shell am start -W -n com.night.homira/.HomiraCachedStartupSmokeActivity
            sleep 5
            adb logcat -d > homira-android/app/build/ui-smoke/cached-startup-logcat.txt
            assert_clean_app_log homira-android/app/build/ui-smoke/cached-startup-logcat.txt
            adb shell pidof com.night.homira | grep -q .
            adb exec-out screencap -p > homira-android/app/build/ui-smoke/cached-startup.png

            if [ "${{ matrix.api-level }}" = "36" ]; then
              adb uninstall com.night.homira
              adb install homira-android/app/build/outputs/apk/release/homira-release-smoke.apk
              adb logcat -c || true
              adb shell am start -W -n com.night.homira/.MainActivity
              sleep 5
              adb logcat -d > homira-android/app/build/ui-smoke/release-startup-logcat.txt
              assert_clean_app_log homira-android/app/build/ui-smoke/release-startup-logcat.txt
              adb shell pidof com.night.homira | grep -q .
              adb exec-out screencap -p > homira-android/app/build/ui-smoke/release-startup.png
            fi

      - name: Run Android lint
        id: lint
        if: matrix.api-level == 36
        continue-on-error: true
        working-directory: homira-android
        run: gradle :app:lintDebug --stacktrace

      - name: Upload lint reports
        if: matrix.api-level == 36 && always()
        uses: actions/upload-artifact@v4
        with:
          name: homira-lint-debug
          path: |
            homira-android/app/build/reports/lint-results-debug.html
            homira-android/app/build/reports/lint-results-debug.sarif
            homira-android/app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt
          if-no-files-found: warn

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: homira-ui-smoke-api-${{ matrix.api-level }}
          path: homira-android/app/build/ui-smoke/
          if-no-files-found: warn

      - name: Require clean lint
        if: matrix.api-level == 36 && always()
        run: test "${{ steps.lint.outcome }}" = "success"
