name: Homira UI Smoke

on:
  push:
    branches: [homira-call-ci]
    paths:
      - 'homira-android/app/src/main/java/com/night/homira/ui/HomiraProductionApp.kt'
      - 'homira-android/app/src/main/java/com/night/homira/ui/HomiraAuthGate.kt'
      - 'homira-android/app/src/main/java/com/night/homira/call/**'
      - 'homira-android/app/src/debug/**'
      - '.github/workflows/homira-ui-smoke.yml'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build debug APK
        working-directory: homira-android
        run: gradle :app:assembleDebug --stacktrace

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Exercise main UI in emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            set -euo pipefail
            adb wait-for-device
            adb install -r homira-android/app/build/outputs/apk/debug/app-debug.apk
            mkdir -p homira-android/app/build/ui-smoke
            adb logcat -c
            adb shell am force-stop com.night.homira
            adb shell am start -W -n com.night.homira/.HomiraSmokeActivity

            sleep 1
            adb shell pidof com.night.homira | grep -q .
            adb exec-out screencap -p > homira-android/app/build/ui-smoke/keypad.png

            tap_desc () {
              local desc="$1"
              adb shell uiautomator dump /sdcard/window.xml >/dev/null
              adb pull /sdcard/window.xml /tmp/window.xml >/dev/null
              coords=$(python3 - "$desc" <<'PY'
import re, sys, xml.etree.ElementTree as ET
desc = sys.argv[1]
root = ET.parse("/tmp/window.xml").getroot()
for node in root.iter("node"):
    if node.attrib.get("content-desc") == desc:
        b = node.attrib.get("bounds","")
        m = re.match(r"\[(\d+),(\d+)\]\[(\d+),(\d+)\]", b)
        if m:
            x1,y1,x2,y2 = map(int,m.groups())
            print((x1+x2)//2, (y1+y2)//2)
            sys.exit(0)
sys.exit(1)
PY
)
              adb shell input tap $coords
              sleep 0.25
              adb shell pidof com.night.homira | grep -q .
            }

            tap_desc Recents
            adb exec-out screencap -p > homira-android/app/build/ui-smoke/recents.png
            tap_desc Contacts
            adb exec-out screencap -p > homira-android/app/build/ui-smoke/contacts.png
            tap_desc Me
            adb exec-out screencap -p > homira-android/app/build/ui-smoke/me.png
            tap_desc Keypad
            adb exec-out screencap -p > homira-android/app/build/ui-smoke/keypad-return.png

            pid=$(adb shell pidof com.night.homira)
            adb logcat --pid="$pid" -d > homira-android/app/build/ui-smoke/logcat.txt
            if grep -q "FATAL EXCEPTION" homira-android/app/build/ui-smoke/logcat.txt; then
              cat homira-android/app/build/ui-smoke/logcat.txt
              exit 1
            fi

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: homira-ui-smoke
          path: homira-android/app/build/ui-smoke/
          if-no-files-found: error
