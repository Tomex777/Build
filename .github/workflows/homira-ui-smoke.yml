name: Homira UI Smoke

on:
  push:
    branches: [homira-call-ci]
    paths:
      - 'homira-android/app/src/main/java/com/night/homira/ui/HomiraProductionApp.kt'
      - 'homira-android/app/src/main/java/com/night/homira/ui/HomiraAuthGate.kt'
      - 'homira-android/app/src/main/java/com/night/homira/call/**'
      - 'homira-android/app/src/debug/**'
      - '.github/workflows/homira-ui-smoke.yml'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build debug APK
        working-directory: homira-android
        run: gradle :app:assembleDebug --stacktrace

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Exercise main UI in emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            set -eu
            adb wait-for-device
            adb install -r homira-android/app/build/outputs/apk/debug/app-debug.apk
            mkdir -p homira-android/app/build/ui-smoke
            adb logcat -c
            adb shell am force-stop com.night.homira
            adb shell am start -W -n com.night.homira/.HomiraSmokeActivity

            sleep 1
            adb shell pidof com.night.homira | grep -q .
            adb exec-out screencap -p > homira-android/app/build/ui-smoke/keypad.png

            size=$(adb shell wm size | tail -1 | awk '{print $3}')
            width=${size%x*}
            height=${size#*x}
            y=$((height - 110))
            x_keypad=$((width / 8))
            x_recents=$((width * 3 / 8))
            x_contacts=$((width * 5 / 8))
            x_me=$((width * 7 / 8))

            adb shell input tap "$x_recents" "$y"
            sleep 0.35
            adb shell pidof com.night.homira | grep -q .
            adb exec-out screencap -p > homira-android/app/build/ui-smoke/recents.png

            adb shell input tap "$x_contacts" "$y"
            sleep 0.35
            adb shell pidof com.night.homira | grep -q .
            adb exec-out screencap -p > homira-android/app/build/ui-smoke/contacts.png

            adb shell input tap "$x_me" "$y"
            sleep 0.35
            adb shell pidof com.night.homira | grep -q .
            adb exec-out screencap -p > homira-android/app/build/ui-smoke/me.png

            adb shell input tap "$x_keypad" "$y"
            sleep 0.35
            adb shell pidof com.night.homira | grep -q .
            adb exec-out screencap -p > homira-android/app/build/ui-smoke/keypad-return.png

            pid=$(adb shell pidof com.night.homira)
            adb logcat --pid="$pid" -d > homira-android/app/build/ui-smoke/logcat.txt
            if grep -q "FATAL EXCEPTION" homira-android/app/build/ui-smoke/logcat.txt; then
              cat homira-android/app/build/ui-smoke/logcat.txt
              exit 1
            fi

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: homira-ui-smoke
          path: homira-android/app/build/ui-smoke/
          if-no-files-found: error
