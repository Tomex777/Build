name: Apply Sora Music Previous Race Fix

on:
  push:
    branches: [sora-android-ci]
    paths:
      - 'sora-ci/music-previous-race-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sora-android-ci
      - name: Apply previous transport race fix
        run: python3 sora-ci/apply-music-previous-race.py
      - name: Verify fix
        run: |
          grep -q 'previousRestartRequestedAtMs' sora-overlay/app/src/main/java/com/night/sora/playback/MusicPlaybackController.kt
          grep -q 'restartSeekStillSettling' sora-overlay/app/src/main/java/com/night/sora/playback/MusicPlaybackController.kt
          grep -q 'SystemClock.elapsedRealtime' sora-overlay/app/src/main/java/com/night/sora/playback/MusicPlaybackController.kt
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add sora-overlay/app/src/main/java/com/night/sora/playback/MusicPlaybackController.kt
          git diff --cached --quiet && exit 0
          git commit -m 'fix rapid previous transport race'
          git push origin HEAD:sora-android-ci
