name: Apply Sora Music Event Hardening

on:
  push:
    branches: [sora-android-ci]
    paths:
      - 'sora-ci/apply-music-event-hardening.txt'

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Harden Music listening events
        run: python sora-ci/patch_music_event_hardening.py
      - name: Verify event hardening
        run: |
          grep -q 'current.lastPlayedEpochMs' sora-overlay/app/src/main/java/com/night/sora/data/CoreRepository.kt
          grep -q 'fun selectQueueIndex' sora-overlay/app/src/main/java/com/night/sora/playback/MusicPlaybackController.kt
          grep -q 'startedEventTrackKey = null' sora-overlay/app/src/main/java/com/night/sora/playback/MusicPlaybackController.kt
          grep -q 'player.selectQueueIndex(index)' sora-overlay/app/src/main/java/com/night/sora/ui/screens/NowPlayingScreen.kt
      - name: Commit event hardening
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sora-overlay/app/src/main/java/com/night/sora/data/CoreRepository.kt \
                  sora-overlay/app/src/main/java/com/night/sora/playback/MusicPlaybackController.kt \
                  sora-overlay/app/src/main/java/com/night/sora/ui/screens/NowPlayingScreen.kt
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'harden Sora music listening events'
            git push
          fi
