name: APK source wave 8 release hosts

on:
  push:
    branches: [apk-source-probes-20261001]
    paths:
      - '.github/workflows/apk-source-wave8-release-hosts.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null
      - name: Probe release hosts and 5Play
        shell: bash
        run: |
          mkdir -p diagnostics
          cat > apk-source-wave8-release-hosts.mjs <<'NODE'
          import { chromium } from 'playwright';
          import crypto from 'node:crypto';
          import fs from 'node:fs';
          import os from 'node:os';
          import path from 'node:path';
          import { spawnSync } from 'node:child_process';

          const out={runAt:new Date().toISOString(),sources:{}};
          const ua='Mozilla/5.0 (Linux; Android 16; SM-A165F) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Mobile Safari/537.36';
          const clean=raw=>{try{const u=new URL(raw);return{host:u.host,path:u.pathname,queryKeys:[...u.searchParams.keys()].sort()}}catch{return{value:String(raw).slice(0,350)}}};
          const short=(v,n=600)=>String(v??'').replace(/\s+/g,' ').trim().slice(0,n);
          function range(url,headers={}){
            const tmp=path.join(os.tmpdir(),'apk8-'+crypto.randomBytes(6).toString('hex'));
            const args=['-L','-sS','--connect-timeout','15','--max-time','50','--range','0-1023','--max-filesize','2097152','-o',tmp];
            for(const[k,v]of Object.entries(headers))args.push('-H',`${k}: ${v}`);
            args.push('-w','\n__FINAL__=%{url_effective}\n__HTTP__=%{http_code}\n__CT__=%{content_type}\n__SIZE__=%{size_download}\n',url);
            const p=spawnSync('curl',args,{encoding:'utf8',maxBuffer:4*1024*1024});
            let b=Buffer.alloc(0);try{b=fs.readFileSync(tmp)}catch{};try{fs.unlinkSync(tmp)}catch{}
            const get=n=>(p.stdout||'').match(new RegExp('^__'+n+'__=(.*)$','m'))?.[1]?.trim()||null;
            return{exitCode:p.status,http:Number(get('HTTP'))||null,contentType:get('CT'),bytesDownloaded:Number(get('SIZE'))||b.length,first16Hex:b.subarray(0,16).toString('hex'),zipMagic:b.length>=4&&b[0]===0x50&&b[1]===0x4b,final:get('FINAL')?clean(get('FINAL')):null,stderr:short(p.stderr,320)};
          }
          async function safe(name,fn){const row={startedAt:new Date().toISOString()};out.sources[name]=row;try{await fn(row);row.completed=true}catch(e){row.completed=false;row.error=short(e?.stack||e,1600)}row.finishedAt=new Date().toISOString();console.log('\n===== '+name+' =====\n'+JSON.stringify(row,null,2));}
          const browser=await chromium.launch({headless:true});
          const ctx=await browser.newContext({userAgent:ua,viewport:{width:1280,height:900},acceptDownloads:true});

          await safe('5Play',async row=>{
            const start='https://www.5play.app/vlc-for-android/';
            const p=await ctx.newPage();const net=[];let dl=null;
            p.on('request',q=>{if(/download|\.apk|file|cdn/i.test(q.url()))net.push(clean(q.url()));});
            p.on('download',d=>{dl=d.url();});
            const r=await p.goto(start,{waitUntil:'domcontentloaded',timeout:45000}).catch(()=>null);await p.waitForTimeout(1200);
            const controls=await p.locator('a,button,input').evaluateAll(xs=>xs.map(x=>({text:(x.textContent||x.value||'').replace(/\s+/g,' ').trim(),href:x.href||x.getAttribute('href'),id:x.id||'',cls:typeof x.className==='string'?x.className:'',onclick:x.getAttribute('onclick'),data:{...x.dataset}})).filter(x=>/download|apk/i.test((x.text||'')+' '+(x.href||'')+' '+(x.onclick||''))).slice(0,60));
            row.page={status:r?.status()??null,title:short(await p.title(),180),controls:controls.map(x=>({...x,href:x.href?clean(x.href):null})),network:net.slice(0,80)};
            let direct=controls.map(x=>x.href).find(h=>h&&/\.apk(?:\?|$)/i.test(h));
            if(!direct){
              const btn=p.locator('a,button,input').filter({hasText:/download apk|download/i}).first();
              if(await btn.count()){await btn.click({timeout:5000}).catch(()=>{});await p.waitForTimeout(4500);}
              row.after={url:clean(p.url()),download:dl?clean(dl):null,network:net.slice(-100)};
              direct=dl;
              if(!direct){
                const as=await p.locator('a').evaluateAll(xs=>xs.map(a=>a.href).filter(Boolean));
                direct=as.find(h=>/\.apk(?:\?|$)/i.test(h));
              }
            }
            if(!direct)throw new Error('5Play direct APK not resolved');
            row.selected=clean(direct);row.binary=range(direct,{'User-Agent':ua,'Referer':start});
            await p.close();
          });

          await safe('GitHubReleases',async row=>{
            const api='https://api.github.com/repos/ImranR98/Obtainium/releases/latest';
            const r=await fetch(api,{headers:{'User-Agent':'apk-source-probe','Accept':'application/vnd.github+json'}});
            const j=await r.json();
            const assets=Array.isArray(j.assets)?j.assets:[];
            const apk=assets.find(a=>/arm64.*\.apk$/i.test(a.name))||assets.find(a=>/\.apk$/i.test(a.name));
            row.release={status:r.status,tag:j.tag_name??null,name:j.name??null,publishedAt:j.published_at??null,assetCount:assets.length,apkAssets:assets.filter(a=>/\.apk$/i.test(a.name)).slice(0,12).map(a=>({name:a.name,size:a.size,url:clean(a.browser_download_url)}))};
            if(!apk?.browser_download_url)throw new Error('GitHub latest release APK missing');
            row.binary=range(apk.browser_download_url,{'User-Agent':'apk-source-probe','Accept':'application/octet-stream'});
          });

          await safe('GitLabReleases',async row=>{
            const project=encodeURIComponent('Hague/forkyz');
            const api='https://gitlab.com/api/v4/projects/'+project+'/releases/permalink/latest';
            const r=await fetch(api,{headers:{'User-Agent':'apk-source-probe'}});
            const j=await r.json();
            const links=j?.assets?.links||[];
            const apk=links.find(x=>/apk/i.test(String(x.name||''))||/apk/i.test(String(x.url||'')));
            row.release={status:r.status,tag:j.tag_name??null,name:j.name??null,releasedAt:j.released_at??null,assets:links.slice(0,20).map(x=>({name:x.name??null,type:x.link_type??null,url:x.url?clean(x.url):null,directAsset:x.direct_asset_url?clean(x.direct_asset_url):null}))};
            const url=apk?.direct_asset_url||apk?.url;
            if(!url)throw new Error('GitLab APK package asset missing');
            row.selected=clean(url);row.binary=range(url,{'User-Agent':'apk-source-probe'});
          });

          await safe('NeutronCode',async row=>{
            const detail='https://www.neutroncode.com/downloads/file/12-neutronmpapkx86';
            const r=await fetch(detail,{headers:{'User-Agent':ua}});const html=await r.text();
            row.detail={status:r.status,title:short(html.match(/<title[^>]*>([\s\S]*?)<\/title>/i)?.[1],180),version:short(html.match(/pd-version-txt[\s\S]{0,500}?>(\d+(?:\.\d+)+)</i)?.[1],80)||null,filename:/NeutronMP_X86\.apk/i.test(html)?'NeutronMP_X86.apk':null};
            const direct='https://www.neutroncode.com/download/NeutronMP_X86.apk';
            row.direct=clean(direct);row.binary=range(direct,{'User-Agent':ua,'Referer':detail});
          });

          await safe('CodebergHostedFDroid',async row=>{
            const index='https://freeyourgadget.codeberg.page/fdroid/repo/index-v1.json';
            const r=await fetch(index,{headers:{'User-Agent':'apk-source-probe'}});const j=await r.json();
            const pkg='nodomain.freeyourgadget.gadgetbridge.nightly';
            const versions=j?.packages?.[pkg]||[];
            row.index={status:r.status,package:pkg,versionCount:versions.length,latest:versions[0]?{versionName:versions[0].versionName??null,versionCode:versions[0].versionCode??null,apkName:versions[0].apkName??null}:null};
            const name=versions[0]?.apkName;
            if(!name)throw new Error('Codeberg-hosted F-Droid latest APK missing');
            const direct=new URL(name,'https://freeyourgadget.codeberg.page/fdroid/repo/').toString();
            row.direct=clean(direct);row.binary=range(direct,{'User-Agent':'apk-source-probe'});
          });

          await ctx.close();await browser.close();
          fs.writeFileSync('diagnostics/apk-source-wave8-release-hosts.json',JSON.stringify(out,null,2));
          console.log('\n===== FINAL WAVE 8 =====\n'+JSON.stringify(out,null,2));
          NODE
          node apk-source-wave8-release-hosts.mjs
      - name: Record diagnostics
        if: always()
        run: |
          test -f diagnostics/apk-source-wave8-release-hosts.json || echo '{"error":"probe did not produce diagnostics"}' > diagnostics/apk-source-wave8-release-hosts.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add diagnostics/apk-source-wave8-release-hosts.json
          git commit -m "record APK source wave 8 release-host diagnostics" || true
          git push origin HEAD:apk-source-probes-20261001 || true
