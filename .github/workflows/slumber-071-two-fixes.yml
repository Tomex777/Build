name: Slumber 0.7.1 Two Fixes Verify

on:
  push:
    branches: ["pianohub-ci"]
    paths:
      - ".ci/slumber_071_two_fixes.patch"
      - ".github/workflows/slumber-071-two-fixes.yml"

permissions:
  actions: read
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4

      - name: Reconstruct verified Slumber 0.7.0 source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/slumber-base /tmp/slumber /tmp/slumber-out
          mkdir -p /tmp/slumber-base /tmp/slumber /tmp/slumber-out
          gh run download 34483426519 --repo Tomex777/Build --name slumber-0.7.0-final-verify --dir /tmp/slumber-base
          SRC=$(find /tmp/slumber-base -name 'slumber-production-0.7.0-source.tgz' -type f -print -quit)
          test -n "$SRC"
          tar -xzf "$SRC" -C /tmp/slumber
          cd /tmp/slumber
          patch -p0 < "$GITHUB_WORKSPACE/.ci/slumber_071_two_fixes.patch"
          grep -q 'versionName = "0.7.1"' app/build.gradle.kts
          grep -q 'android:screenOrientation="portrait"' app/src/main/AndroidManifest.xml
          grep -q 'contentDescription = "Piano settings"' app/src/main/java/com/night/pianohub/ui/screens/PianoScreen.kt
          ! grep -q 'onSettings = { navController.navigate("settings") }' app/src/main/java/com/night/pianohub/ui/PianoHubApp.kt

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: "15859902"

      - name: Install Android compile SDK
        shell: bash
        run: sdkmanager --channel=3 "platforms;android-37.0" "build-tools;37.0.0"

      - name: Run unit tests
        working-directory: /tmp/slumber
        run: gradle --stacktrace testDebugUnitTest

      - name: Build APK
        working-directory: /tmp/slumber
        run: gradle --stacktrace assembleDebug

      - name: Package build
        shell: bash
        run: |
          set -euo pipefail
          APK=/tmp/slumber/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          cp "$APK" /tmp/slumber-out/Slumber-0.7.1-debug.apk
          sha256sum "$APK" | tee /tmp/slumber-out/apk-sha256.txt
          cd /tmp/slumber
          tar --exclude='./.gradle' --exclude='./build' --exclude='./app/build' -czf /tmp/slumber-out/slumber-production-0.7.1-source.tgz .

      - name: Upload Slumber 0.7.1
        uses: actions/upload-artifact@v4
        with:
          name: slumber-0.7.1-two-fixes
          path: /tmp/slumber-out/*
          if-no-files-found: error
