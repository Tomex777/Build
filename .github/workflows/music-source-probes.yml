      - name: Probe Reddit megathread direct sources round 1
        shell: bash
        run: |
          python3 - <<'PY'
          import json, re, time, urllib.parse, urllib.request, urllib.error
          from datetime import datetime, timezone

          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36"
          out={"generated_at":datetime.now(timezone.utc).isoformat(),"sources":{}}

          def request(url,method="GET",body=None,max_bytes=2_000_000,headers=None,timeout=30):
              h={"User-Agent":UA,"Accept":"*/*"}
              if headers:h.update(headers)
              data=None
              if body is not None:
                  data=json.dumps(body).encode()
                  h.setdefault("Content-Type","application/json")
                  h.setdefault("Accept","application/json")
              req=urllib.request.Request(url,data=data,headers=h,method=method)
              try:
                  with urllib.request.urlopen(req,timeout=timeout) as r:
                      b=r.read(max_bytes)
                      return {"ok":True,"status":getattr(r,"status",200),"url":r.geturl(),"content_type":r.headers.get("Content-Type"),"content_length":r.headers.get("Content-Length"),"accept_ranges":r.headers.get("Accept-Ranges"),"bytes_read":len(b),"body":b}
              except urllib.error.HTTPError as e:
                  b=e.read(min(max_bytes,65536))
                  return {"ok":False,"status":e.code,"url":url,"content_type":e.headers.get("Content-Type") if e.headers else None,"bytes_read":len(b),"body":b,"error":str(e)}
              except Exception as e:
                  return {"ok":False,"status":None,"url":url,"bytes_read":0,"body":b"","error":repr(e)}

          def jreq(*args,**kwargs):
              r=request(*args,**kwargs)
              z={k:v for k,v in r.items() if k!="body"}
              try:z["json"]=json.loads(r["body"].decode("utf-8","replace"))
              except Exception as e:z["json_error"]=repr(e); z["body_preview"]=r["body"][:700].decode("utf-8","replace")
              return z

          def bytes64(url,headers=None):
              h={"Range":"bytes=0-65535"}
              if headers:h.update(headers)
              r=request(url,max_bytes=65536,headers=h)
              z={k:v for k,v in r.items() if k!="body"}
              z["magic_hex"]=r.get("body",b"")[:16].hex()
              z["flac_magic"]=r.get("body",b"").startswith(b"fLaC")
              z["id3_magic"]=r.get("body",b"").startswith(b"ID3")
              return z

          # Monochrome direct public track service.
          mono={"steps":{},"classification":"direct public catalog + lossless stream endpoint; open-source client"}
          s=jreq("https://tracks.monochrome.st/search/tracks?q="+urllib.parse.quote("Rick Astley Never Gonna Give You Up")+"&limit=8")
          mono["steps"]["search"]={k:v for k,v in s.items() if k!="json"}
          sj=s.get("json")
          rows=[]
          if isinstance(sj,dict):
              rows=sj.get("tracks") or sj.get("items") or ((sj.get("data") or {}).get("tracks") if isinstance(sj.get("data"),dict) else []) or []
          elif isinstance(sj,list): rows=sj
          for t in rows or []:
              if not isinstance(t,dict):continue
              tid=t.get("trackId") or t.get("id") or t.get("recordingId")
              if not tid:continue
              bp=bytes64("https://tracks.monochrome.st/track/"+urllib.parse.quote(str(tid)))
              if bp.get("ok") and bp.get("bytes_read",0)>4096:
                  mono["track"]={"id":str(tid),"title":t.get("title"),"artistNames":t.get("artistNames"),"isrc":t.get("isrc"),"releaseTitle":t.get("releaseTitle")}
                  mono["steps"]["stream"]=bp
                  break
          mono["stream_verified"]=bool(mono.get("steps",{}).get("stream",{}).get("ok") and mono["steps"]["stream"].get("bytes_read",0)>4096)
          mono["download_verified"]=mono["stream_verified"]
          out["sources"]["monochrome_direct"]=mono

          # Lucida actual resolve -> handoff -> status -> download flow, based on
          # the open-source lucida-downloader client.
          luc={"steps":{},"classification":"third-party remote download service; Cloudflare/session stability must be monitored"}
          source_url="https://soundcloud.com/l2share77/loona-butterfly"
          page_url="https://lucida.to/?"+urllib.parse.urlencode({"url":source_url,"country":"auto"})
          page=request(page_url,max_bytes=3_000_000,headers={"Accept":"text/html"})
          luc["steps"]["resolve_page"]={k:v for k,v in page.items() if k!="body"}
          html=page.get("body",b"").decode("utf-8","replace")
          luc["challenge_detected"]=page.get("status") in (403,429,503) or "cf-chl-" in html.lower() or "turnstile" in html.lower()
          pdata=None
          start_marker=',{"type":"data","data":'
          end_marker=',"uses":{"url":1}}];'
          si=html.find(start_marker)
          if si>=0:
              si += len(start_marker)
              ei=html.find(end_marker,si)
              if ei>=0:
                  raw=html[si:ei]
                  try:pdata=json.loads(raw)
                  except Exception as e:luc["parse_error"]=repr(e)
          if isinstance(pdata,dict):
              info=pdata.get("info") or {}
              token=pdata.get("token")
              expiry=pdata.get("tokenExpiry") or pdata.get("token_expiry")
              tracks=[]
              if info.get("type")=="track": tracks=[info]
              else: tracks=info.get("tracks") or []
              luc["resolved"]={"originalService":pdata.get("originalService"),"token_expiry":expiry,"info_type":info.get("type"),"track_count":len(tracks)}
              if tracks and expiry:
                  tr=tracks[0]
                  body={
                      "account":{"id":"auto","type":"country"},
                      "compat":False,"downscale":"original","handoff":True,
                      "metadata":True,"private":True,
                      "token":{"expiry":expiry,"primary":tr.get("csrf") or token,"secondary":tr.get("csrfFallback")},
                      "upload":{"enabled":False},"url":tr.get("url"),
                  }
                  hand=jreq("https://lucida.to/api/load?url=%2Fapi%2Ffetch%2Fstream%2Fv2",method="POST",body=body,headers={"Origin":"https://lucida.to","Referer":page_url})
                  luc["steps"]["handoff"]={k:v for k,v in hand.items() if k!="json"}
                  hj=hand.get("json")
                  if isinstance(hj,dict) and hj.get("handoff") and hj.get("server"):
                      server=str(hj["server"]); hid=str(hj["handoff"])
                      luc["handoff"]={"server":server,"id_length":len(hid)}
                      status_url=f"https://{server}.lucida.to/api/fetch/request/{urllib.parse.quote(hid)}"
                      last=None
                      for _ in range(15):
                          st=jreq(status_url)
                          last=st
                          j=st.get("json")
                          if isinstance(j,dict) and j.get("status") in ("completed","failed","error"):
                              break
                          time.sleep(1)
                      if last:
                          luc["steps"]["status"]={k:v for k,v in last.items() if k!="json"}
                          if isinstance(last.get("json"),dict):luc["final_status"]=last["json"].get("status")
                      if luc.get("final_status")=="completed":
                          luc["steps"]["download"]=bytes64(status_url+"/download",{"Referer":"https://lucida.to/"})
          luc["stream_verified"]=bool(luc.get("steps",{}).get("download",{}).get("ok") and luc["steps"]["download"].get("bytes_read",0)>4096)
          luc["download_verified"]=luc["stream_verified"]
          out["sources"]["lucida"]=luc

          # Cobalt hosted service: status + processing request. Official docs
          # explicitly disallow embedding hosted instances without permission;
          # this probe only classifies current access requirements.
          cob={"steps":{},"classification":"open-source downloader; hosted api not approved for embedding, self-host if used"}
          info=jreq("https://api.cobalt.tools/")
          cob["steps"]["info"]={k:v for k,v in info.items() if k!="json"}
          if isinstance(info.get("json"),dict):
              co=info["json"].get("cobalt") or {}
              cob["instance"]={"version":co.get("version"),"services":co.get("services"),"turnstile":bool(co.get("turnstileSitekey"))}
          pr=jreq("https://api.cobalt.tools/",method="POST",body={"url":source_url,"downloadMode":"audio","audioFormat":"best"},headers={"Origin":"https://cobalt.tools","Referer":"https://cobalt.tools/"})
          cob["steps"]["process"]={k:v for k,v in pr.items() if k!="json"}
          if isinstance(pr.get("json"),dict):
              cob["process_status"]=pr["json"].get("status")
              cob["process_error"]=(pr["json"].get("error") or {}).get("code") if isinstance(pr["json"].get("error"),dict) else None
              u=pr["json"].get("url")
              if u and pr["json"].get("status") in ("tunnel","redirect"):
                  cob["steps"]["media"]=bytes64(u)
          cob["stream_verified"]=bool(cob.get("steps",{}).get("media",{}).get("ok") and cob["steps"]["media"].get("bytes_read",0)>4096)
          cob["download_verified"]=cob["stream_verified"]
          out["sources"]["cobalt_hosted"]=cob

          # Service liveness/status for volatile megathread sites.
          for name,url in [
              ("doubledouble","https://doubledouble.top/"),
              ("doubledouble_stats","https://doubledouble.top/stats/"),
              ("squid_wtf","https://squid.wtf/"),
              ("monochrome_web","https://monochrome.st/"),
