                   "trendingId":"93de406e-bdc1-40a6-befd-90637a362158"}
          s=jreq("https://www.udio.com/api/songs/search",method="POST",body=payload,
                 headers={"Accept":"application/json","Origin":"https://www.udio.com","Referer":"https://www.udio.com/"})
          ud["steps"]["search"]={k:v for k,v in s.items() if k!="json"}
          sj=s.get("json")
          ud["top_type"]=type(sj).__name__
          if isinstance(sj,dict):ud["top_keys"]=sorted(sj.keys())[:50]
          candidates=[]
          def walk(v,path=""):
              if isinstance(v,dict):
                  for k,x in v.items():walk(x,path+"."+str(k))
              elif isinstance(v,list):
                  for i,x in enumerate(v[:20]):walk(x,path+f"[{i}]")
              elif isinstance(v,str):
                  low=v.lower()
