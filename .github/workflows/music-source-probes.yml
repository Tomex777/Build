name: Music Source End-to-End Probes

on:
  push:
    branches:
      - music-source-probes-20260930
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Probe public music sources end to end
        shell: bash
        run: |
          python3 - <<'PY'
          import json, re, html, os, sys, urllib.parse, urllib.request, urllib.error
          from datetime import datetime, timezone

          UA = "Mozilla/5.0 (Linux; Android 16; LyraSourceProbe/1.0) AppleWebKit/537.36 Chrome/140 Safari/537.36"
          report = {
              "generated_at": datetime.now(timezone.utc).isoformat(),
              "query": "lofi",
              "sources": {}
          }

          def req(url, headers=None, max_bytes=None, timeout=30):
              h = {"User-Agent": UA, "Accept": "*/*"}
              if headers:
                  h.update(headers)
              request = urllib.request.Request(url, headers=h)
              try:
                  with urllib.request.urlopen(request, timeout=timeout) as r:
                      data = r.read() if max_bytes is None else r.read(max_bytes)
                      return {
                          "ok": True,
                          "status": getattr(r, "status", 200),
                          "url": r.geturl(),
                          "content_type": r.headers.get("Content-Type"),
                          "content_length": r.headers.get("Content-Length"),
                          "accept_ranges": r.headers.get("Accept-Ranges"),
                          "bytes_read": len(data),
                          "body": data,
                      }
              except urllib.error.HTTPError as e:
                  body = e.read(4096)
                  return {
                      "ok": False, "status": e.code, "url": url,
                      "content_type": e.headers.get("Content-Type") if e.headers else None,
                      "bytes_read": len(body), "body": body,
                      "error": str(e),
                  }
              except Exception as e:
                  return {"ok": False, "status": None, "url": url, "bytes_read": 0, "body": b"", "error": repr(e)}

          def json_req(url, headers=None):
              r = req(url, headers=headers, max_bytes=2_000_000)
              out = {k:v for k,v in r.items() if k != "body"}
              try:
                  out["json"] = json.loads(r["body"].decode("utf-8", "replace"))
              except Exception as e:
                  out["json_error"] = repr(e)
                  out["body_preview"] = r["body"][:600].decode("utf-8", "replace")
              return out

          def byte_probe(url, headers=None):
              h = {"Range":"bytes=0-65535"}
              if headers: h.update(headers)
              r = req(url, headers=h, max_bytes=65536)
              return {k:v for k,v in r.items() if k != "body"}

          # ------------------------------------------------------------
          # Audius: documented public REST -> search -> track -> stream/download
          # ------------------------------------------------------------
          audius = {"steps": {}}
          s = json_req("https://api.audius.co/v1/tracks/search?query=lofi&limit=5")
          audius["steps"]["search"] = {k:v for k,v in s.items() if k != "json"}
          data = (s.get("json") or {}).get("data") if isinstance(s.get("json"), dict) else None
          if isinstance(data, list) and data:
              track = data[0]
              tid = track.get("id")
              audius["track"] = {
                  "id": tid, "title": track.get("title"),
                  "artist": (track.get("user") or {}).get("name") if isinstance(track.get("user"), dict) else None,
                  "is_streamable": track.get("is_streamable"),
                  "is_downloadable": track.get("is_downloadable"),
                  "access": track.get("access"),
              }
              if tid:
                  m = json_req("https://api.audius.co/v1/tracks/" + urllib.parse.quote(str(tid)))
                  audius["steps"]["metadata"] = {k:v for k,v in m.items() if k != "json"}
                  st = byte_probe("https://api.audius.co/v1/tracks/" + urllib.parse.quote(str(tid)) + "/stream")
                  audius["steps"]["stream"] = st
                  dl = byte_probe("https://api.audius.co/v1/tracks/" + urllib.parse.quote(str(tid)) + "/download")
                  audius["steps"]["download"] = dl
          audius["stream_verified"] = audius.get("steps",{}).get("stream",{}).get("ok") and audius["steps"]["stream"].get("bytes_read",0) > 4096
          audius["download_verified"] = audius.get("steps",{}).get("download",{}).get("ok") and audius["steps"]["download"].get("bytes_read",0) > 4096
          report["sources"]["audius"] = audius

          # ------------------------------------------------------------
          # Internet Archive: advanced search -> item metadata -> audio file bytes
          # ------------------------------------------------------------
          ia = {"steps": {}}
          q = urllib.parse.quote('mediatype:audio AND format:"VBR MP3"')
          s = json_req("https://archive.org/advancedsearch.php?q=" + q + "&fl%5B%5D=identifier,title,creator&rows=5&page=1&output=json")
          ia["steps"]["search"] = {k:v for k,v in s.items() if k != "json"}
          docs = (((s.get("json") or {}).get("response") or {}).get("docs") or []) if isinstance(s.get("json"), dict) else []
          chosen = None
          for d in docs:
              ident = d.get("identifier")
              if not ident: continue
              m = json_req("https://archive.org/metadata/" + urllib.parse.quote(str(ident)))
              files = (m.get("json") or {}).get("files") if isinstance(m.get("json"), dict) else []
              audio = None
              for f in files or []:
                  name = str(f.get("name",""))
                  if name.lower().endswith((".mp3",".ogg",".m4a")) and str(f.get("size","0")).isdigit() and int(f.get("size","0")) > 65536:
                      audio = f; break
              if audio:
                  chosen=(d,m,audio); break
          if chosen:
              d,m,audio = chosen
              ident=d["identifier"]; name=audio["name"]
              ia["item"]={"identifier":ident,"title":d.get("title"),"creator":d.get("creator"),"file":name,"size":audio.get("size"),"format":audio.get("format")}
              ia["steps"]["metadata"]={k:v for k,v in m.items() if k != "json"}
              file_url="https://archive.org/download/"+urllib.parse.quote(str(ident))+"/"+urllib.parse.quote(str(name))
              ia["steps"]["stream_download"]=byte_probe(file_url)
          ia["stream_verified"]=ia.get("steps",{}).get("stream_download",{}).get("ok") and ia["steps"]["stream_download"].get("bytes_read",0)>4096
          ia["download_verified"]=ia["stream_verified"]
          report["sources"]["internet_archive"] = ia

          # ------------------------------------------------------------
          # Bandcamp: public search HTML -> track page -> data-tralbum -> mp3-128 bytes
          # ------------------------------------------------------------
          bc={"steps":{}}
          s=req("https://bandcamp.com/search?q=lofi&item_type=t", max_bytes=1_500_000)
          bc["steps"]["search"]={k:v for k,v in s.items() if k!="body"}
          body=s.get("body",b"").decode("utf-8","replace")
          links=re.findall(r'href="(https?://[^"]+/track/[^"?]+)', body)
          seen=[]
          for u in links:
              u=html.unescape(u)
              if u not in seen: seen.append(u)
          for track_url in seen[:8]:
              p=req(track_url, max_bytes=2_000_000)
              txt=p.get("body",b"").decode("utf-8","replace")
              bc["steps"]["track_page"]={k:v for k,v in p.items() if k!="body"}
              candidates=[]
              m=re.search(r'data-tralbum="([^"]+)"', txt)
              if m:
                  try:
                      obj=json.loads(html.unescape(m.group(1)))
                      candidates=(obj.get("trackinfo") or [])
                  except Exception as e:
                      bc.setdefault("parse_errors",[]).append("data-tralbum:"+repr(e))
              if not candidates:
                  # Modern pages can inline trackinfo inside a larger JSON blob.
                  for pat in [r'"trackinfo"\s*:\s*(\[.*?\])\s*,\s*"current"']:
                      mm=re.search(pat,txt,re.S)
                      if mm:
                          try: candidates=json.loads(mm.group(1))
                          except Exception as e: bc.setdefault("parse_errors",[]).append("trackinfo:"+repr(e))
              stream=None; title=None
              for t in candidates or []:
                  f=t.get("file") if isinstance(t,dict) else None
                  if isinstance(f,dict):
                      stream=f.get("mp3-128") or next(iter(f.values()),None)
                  if stream:
                      title=t.get("title"); break
              if stream:
                  bc["track"]={"page":track_url,"title":title,"stream_url_host":urllib.parse.urlparse(stream).netloc}
                  bc["steps"]["stream"]=byte_probe(stream)
                  break
          bc["stream_verified"]=bc.get("steps",{}).get("stream",{}).get("ok") and bc["steps"]["stream"].get("bytes_read",0)>4096
          bc["download_verified"]=False
          report["sources"]["bandcamp"] = bc

          # ------------------------------------------------------------
          # SoundCloud: verify current official anonymous surface only.
          # Full API search/streams require OAuth credentials in current API.
          # ------------------------------------------------------------
          sc={"steps":{}}
          oe=json_req("https://soundcloud.com/oembed?format=json&url=https%3A%2F%2Fsoundcloud.com%2Fforss%2Fflickermood")
          sc["steps"]["oembed"]={k:v for k,v in oe.items() if k!="json"}
          if isinstance(oe.get("json"),dict):
              sc["oembed_title"]=oe["json"].get("title")
          api=json_req("https://api.soundcloud.com/tracks?limit=1&q=lofi")
          sc["steps"]["anonymous_api_search"]={k:v for k,v in api.items() if k!="json"}
          sc["stream_verified"]=False
          sc["download_verified"]=False
          sc["requires_credentials_for_official_api"] = api.get("status") in (401,403)
          report["sources"]["soundcloud"] = sc

          # ------------------------------------------------------------
          # Deezer: public search -> preview bytes, explicitly classify as preview-only.
          # ------------------------------------------------------------
          dz={"steps":{}}
          s=json_req("https://api.deezer.com/search?q=lofi&limit=3")
          dz["steps"]["search"]={k:v for k,v in s.items() if k!="json"}
          rows=(s.get("json") or {}).get("data") if isinstance(s.get("json"),dict) else []
          if isinstance(rows,list) and rows:
              t=rows[0]
              dz["track"]={"id":t.get("id"),"title":t.get("title"),"artist":(t.get("artist") or {}).get("name"),"preview":bool(t.get("preview"))}
              if t.get("preview"):
                  dz["steps"]["preview"]=byte_probe(t["preview"])
          dz["stream_verified"]=False
          dz["preview_verified"]=dz.get("steps",{}).get("preview",{}).get("ok") and dz["steps"]["preview"].get("bytes_read",0)>4096
          dz["download_verified"]=False
          dz["classification"]="metadata_preview_only"
          report["sources"]["deezer"] = dz

          with open("music-source-report.json","w",encoding="utf-8") as f:
              json.dump(report,f,indent=2,ensure_ascii=False)

          lines=["# Music Source Probe Report","",f"Generated: {report['generated_at']}",""]
          for name,src in report["sources"].items():
              lines += [
                  f"## {name}",
                  f"- stream_verified: {src.get('stream_verified',False)}",
                  f"- download_verified: {src.get('download_verified',False)}",
              ]
              if "preview_verified" in src:
                  lines.append(f"- preview_verified: {src.get('preview_verified')}")
              if src.get("track"): lines.append("- track: `"+json.dumps(src["track"],ensure_ascii=False)+"`")
              for step,detail in src.get("steps",{}).items():
                  lines.append(f"- {step}: status={detail.get('status')} ok={detail.get('ok')} bytes={detail.get('bytes_read')} content_type={detail.get('content_type')} final_url={detail.get('url')}")
              lines.append("")
          open("music-source-report.md","w",encoding="utf-8").write("\n".join(lines))
          print(open("music-source-report.md",encoding="utf-8").read())
          PY

      - name: Probe Audius discovery, Bandcamp direct, Jamendo and Openverse
        shell: bash
        run: |
          python3 - <<'PY'
          import json, re, html, urllib.parse, urllib.request, urllib.error
          from datetime import datetime, timezone

          UA="Mozilla/5.0 (Linux; Android 16; LyraSourceProbe/2.0) AppleWebKit/537.36 Chrome/140 Safari/537.36"
          out={"generated_at":datetime.now(timezone.utc).isoformat(),"sources":{}}

          def get(url,max_bytes=2_000_000,headers=None):
              h={"User-Agent":UA,"Accept":"*/*"}
              if headers: h.update(headers)
              q=urllib.request.Request(url,headers=h)
              try:
                  with urllib.request.urlopen(q,timeout=30) as r:
                      b=r.read(max_bytes)
                      return {"ok":True,"status":getattr(r,"status",200),"url":r.geturl(),"content_type":r.headers.get("Content-Type"),"content_length":r.headers.get("Content-Length"),"bytes_read":len(b),"body":b}
              except urllib.error.HTTPError as e:
                  b=e.read(8192)
                  return {"ok":False,"status":e.code,"url":url,"content_type":e.headers.get("Content-Type") if e.headers else None,"bytes_read":len(b),"body":b,"error":str(e)}
              except Exception as e:
                  return {"ok":False,"status":None,"url":url,"bytes_read":0,"body":b"","error":repr(e)}

          def jget(url):
              r=get(url)
              z={k:v for k,v in r.items() if k!="body"}
              try:z["json"]=json.loads(r["body"].decode("utf-8","replace"))
              except Exception as e:z["json_error"]=repr(e); z["body_preview"]=r["body"][:1000].decode("utf-8","replace")
              return z

          def bytes64(url):
              r=get(url,max_bytes=65536,headers={"Range":"bytes=0-65535"})
              return {k:v for k,v in r.items() if k!="body"}

          # Audius: canonical discovery host first, app_name on every request.
          au={"steps":{},"attempts":[]}
          root=jget("https://api.audius.co")
          au["steps"]["discovery"]={k:v for k,v in root.items() if k!="json"}
          hosts=[]
          rj=root.get("json")
          if isinstance(rj,dict):
              d=rj.get("data")
              if isinstance(d,list):
                  for x in d:
                      if isinstance(x,str): hosts.append(x.rstrip("/"))
                      elif isinstance(x,dict) and x.get("host"): hosts.append(str(x["host"]).rstrip("/"))
          if not hosts:
              hosts=["https://discoveryprovider.audius.co"]
          for host in hosts[:5]:
              search=jget(host+"/v1/tracks/search?query=lofi&limit=15&app_name=Lyra")
              rows=(search.get("json") or {}).get("data") if isinstance(search.get("json"),dict) else []
              if not isinstance(rows,list): rows=[]
              for t in rows[:15]:
                  tid=t.get("id")
                  if not tid: continue
                  attempt={"host":host,"id":tid,"title":t.get("title"),"is_streamable":t.get("is_streamable"),"is_downloadable":t.get("is_downloadable"),"access":t.get("access")}
                  stream=bytes64(host+"/v1/tracks/"+urllib.parse.quote(str(tid))+"/stream?app_name=Lyra")
                  attempt["stream"]=stream
                  if stream.get("ok") and stream.get("bytes_read",0)>4096:
                      au["chosen"]=attempt
                      au["steps"]["search"]={k:v for k,v in search.items() if k!="json"}
                      au["steps"]["stream"]=stream
                      dl=bytes64(host+"/v1/tracks/"+urllib.parse.quote(str(tid))+"/download?app_name=Lyra")
                      au["steps"]["download"]=dl
                      break
                  au["attempts"].append(attempt)
              if au.get("chosen"): break
          au["stream_verified"]=bool(au.get("steps",{}).get("stream",{}).get("ok") and au["steps"]["stream"].get("bytes_read",0)>4096)
          au["download_verified"]=bool(au.get("steps",{}).get("download",{}).get("ok") and au["steps"]["download"].get("bytes_read",0)>4096)
          out["sources"]["audius_discovery"]=au

          # Bandcamp: direct known public track page, then extract stream URL.
          bc={"steps":{}}
          page="https://omauk.bandcamp.com/track/lofi-continuous-oma-mix"
          p=get(page)
          bc["steps"]["track_page"]={k:v for k,v in p.items() if k!="body"}
          txt=p.get("body",b"").decode("utf-8","replace")
          candidates=[]
          m=re.search(r'data-tralbum="([^"]+)"',txt)
          if m:
              try:candidates=(json.loads(html.unescape(m.group(1))).get("trackinfo") or [])
              except Exception as e:bc["data_tralbum_error"]=repr(e)
          if not candidates:
              # Bandcamp also exposes escaped JSON in JS; find the first mp3-128 URL directly.
              urls=re.findall(r'https:\\?/\\?/[^"\\]+?\.mp3[^"\\]*',txt)
              urls=[u.replace("\\/","/").replace("\\u0026","&") for u in urls]
              if urls: candidates=[{"title":"direct-regex","file":{"mp3-128":urls[0]}}]
          for t in candidates:
              f=t.get("file") if isinstance(t,dict) else None
              stream=f.get("mp3-128") if isinstance(f,dict) else None
              if stream:
                  bc["track"]={"title":t.get("title"),"page":page,"stream_host":urllib.parse.urlparse(stream).netloc}
                  bc["steps"]["stream"]=bytes64(stream)
                  break
          bc["stream_verified"]=bool(bc.get("steps",{}).get("stream",{}).get("ok") and bc["steps"]["stream"].get("bytes_read",0)>4096)
          bc["download_verified"]=False
          bc["classification"]="full_stream_when_artist_enables_streaming; purchase/download rights remain artist-controlled"
          out["sources"]["bandcamp_direct"]=bc

          # Jamendo: official docs publish client_id 709fa152 ONLY for testing read API.
          jm={"steps":{},"test_client_id":"709fa152"}
          s=jget("https://api.jamendo.com/v3.0/tracks/?client_id=709fa152&format=json&limit=10&fuzzytags=electronic&include=musicinfo")
          jm["steps"]["search"]={k:v for k,v in s.items() if k!="json"}
          rows=(s.get("json") or {}).get("results") if isinstance(s.get("json"),dict) else []
          for t in rows or []:
              audio=t.get("audio")
              if not audio: continue
              st=bytes64(audio)
              if not (st.get("ok") and st.get("bytes_read",0)>4096): continue
              jm["track"]={"id":t.get("id"),"title":t.get("name"),"artist":t.get("artist_name"),"license":t.get("license_ccurl"),"audiodownload_allowed":t.get("audiodownload_allowed")}
              jm["steps"]["stream"]=st
              dlurl=t.get("audiodownload") if t.get("audiodownload_allowed") else None
              if dlurl: jm["steps"]["download"]=bytes64(dlurl)
              break
          jm["stream_verified"]=bool(jm.get("steps",{}).get("stream",{}).get("ok") and jm["steps"]["stream"].get("bytes_read",0)>4096)
          jm["download_verified"]=bool(jm.get("steps",{}).get("download",{}).get("ok") and jm["steps"]["download"].get("bytes_read",0)>4096)
          jm["production_note"]="register Lyra's own Jamendo client_id; 709fa152 is documentation's testing-only ID"
          out["sources"]["jamendo"]=jm

          # Openverse: anonymous CC/open audio search -> direct media URL -> bytes.
          ov={"steps":{}}
          s=jget("https://api.openverse.org/v1/audio/?q=ambient%20music&page_size=10")
          ov["steps"]["search"]={k:v for k,v in s.items() if k!="json"}
          rows=(s.get("json") or {}).get("results") if isinstance(s.get("json"),dict) else []
          for t in rows or []:
              u=t.get("url")
              if not u: continue
              bp=bytes64(u)
              if bp.get("ok") and bp.get("bytes_read",0)>4096:
                  ov["track"]={"id":t.get("id"),"title":t.get("title"),"creator":t.get("creator"),"license":t.get("license"),"license_url":t.get("license_url"),"source":t.get("source"),"provider":t.get("provider"),"media_url_host":urllib.parse.urlparse(u).netloc}
                  ov["steps"]["media"]=bp
                  break
          ov["stream_verified"]=bool(ov.get("steps",{}).get("media",{}).get("ok") and ov["steps"]["media"].get("bytes_read",0)>4096)
          ov["download_verified"]=ov["stream_verified"]
          ov["classification"]="openly-licensed/public-domain aggregation; preserve attribution/license metadata"
          out["sources"]["openverse"]=ov

          with open("music-source-report-round2.json","w",encoding="utf-8") as f: json.dump(out,f,indent=2,ensure_ascii=False)
          lines=["# Music Source Probe Round 2","",f"Generated: {out['generated_at']}",""]
          for name,src in out["sources"].items():
              lines += [f"## {name}",f"- stream_verified: {src.get('stream_verified',False)}",f"- download_verified: {src.get('download_verified',False)}"]
              if src.get("track"): lines.append("- track: `"+json.dumps(src["track"],ensure_ascii=False)+"`")
              if src.get("chosen"): lines.append("- chosen: `"+json.dumps({k:v for k,v in src["chosen"].items() if k!="stream"},ensure_ascii=False)+"`")
              for step,d in src.get("steps",{}).items(): lines.append(f"- {step}: status={d.get('status')} ok={d.get('ok')} bytes={d.get('bytes_read')} content_type={d.get('content_type')} final_url={d.get('url')}")
              if src.get("classification"): lines.append("- classification: "+src["classification"])
              if src.get("production_note"): lines.append("- production_note: "+src["production_note"])
              lines.append("")
          open("music-source-report-round2.md","w",encoding="utf-8").write("\n".join(lines))
          print(open("music-source-report-round2.md",encoding="utf-8").read())
          PY

      - name: Probe Audiomack and diagnose remaining web sources
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, hashlib, hmac, html, json, re, secrets, time
          import urllib.parse, urllib.request, urllib.error
          from datetime import datetime, timezone

          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36"
          out={"generated_at":datetime.now(timezone.utc).isoformat(),"sources":{}}

          def get(url,max_bytes=2_000_000,headers=None):
              h={"User-Agent":UA,"Accept":"*/*"}
              if headers: h.update(headers)
              req=urllib.request.Request(url,headers=h)
              try:
                  with urllib.request.urlopen(req,timeout=30) as r:
                      b=r.read(max_bytes)
                      return {"ok":True,"status":getattr(r,"status",200),"url":r.geturl(),"content_type":r.headers.get("Content-Type"),"content_length":r.headers.get("Content-Length"),"bytes_read":len(b),"body":b}
              except urllib.error.HTTPError as e:
                  b=e.read(65536)
                  return {"ok":False,"status":e.code,"url":url,"content_type":e.headers.get("Content-Type") if e.headers else None,"bytes_read":len(b),"body":b,"error":str(e)}
              except Exception as e:
                  return {"ok":False,"status":None,"url":url,"bytes_read":0,"body":b"","error":repr(e)}

          def byte_probe(url,headers=None):
              h={"Range":"bytes=0-65535"}
              if headers:h.update(headers)
              r=get(url,65536,h)
              return {k:v for k,v in r.items() if k!="body"}

          def pct(v):
              return urllib.parse.quote(str(v), safe="~-._")

          def oauth_signature(method, base_url, params, secret):
              pairs=[]
              for k,v in params.items():
                  values=v if isinstance(v,list) else [v]
                  for item in sorted([str(x) for x in values]):
                      pairs.append((pct(k),pct(item)))
              pairs.sort()
              normalized="&".join(k+"="+v for k,v in pairs)
              base=pct(method.upper())+"&"+pct(base_url)+"&"+pct(normalized)
              digest=hmac.new((secret+"&").encode(),base.encode(),hashlib.sha1).digest()
              return base64.b64encode(digest).decode()

          # Audiomack public web client path as implemented by MusicFree's maintained plugin.
          # This is intentionally classified as unofficial/web-client-derived; do not promote
          # to production without terms/reliability review.
          am={"steps":{},"classification":"unofficial web-client-derived API; useful fallback candidate, not yet production-approved"}
          consumer="audiomack-js"
          secret="f3ac5b086f3eab260520d8e3049561e6"
          search_base="https://api.audiomack.com/v1/search"
          params={
              "limit":"20","oauth_consumer_key":consumer,
              "oauth_nonce":secrets.token_urlsafe(24)[:32],
              "oauth_signature_method":"HMAC-SHA1",
              "oauth_timestamp":str(round(time.time())),
              "oauth_version":"1.0","page":"1","q":"Burna Boy",
              "show":"songs","sort":"popular",
          }
          params["oauth_signature"]=oauth_signature("GET",search_base,{k:v for k,v in params.items() if k!="oauth_signature"},secret)
          sr=get(search_base+"?"+urllib.parse.urlencode(params))
          am["steps"]["search"]={k:v for k,v in sr.items() if k!="body"}
          try:
              sj=json.loads(sr["body"].decode("utf-8","replace"))
          except Exception as e:
              sj={}; am["search_parse_error"]=repr(e); am["search_preview"]=sr["body"][:1000].decode("utf-8","replace")
          rows=sj.get("results") if isinstance(sj,dict) else []
          if isinstance(rows,dict):
              rows=rows.get("songs") or rows.get("results") or []
          if not isinstance(rows,list): rows=[]
          for t in rows[:10]:
              tid=t.get("id")
              if not tid: continue
              play_base=f"https://api.audiomack.com/v1/music/play/{tid}"
              pp={
                  "environment":"desktop-web","hq":"true","oauth_consumer_key":consumer,
                  "oauth_nonce":secrets.token_urlsafe(24)[:32],
                  "oauth_signature_method":"HMAC-SHA1",
                  "oauth_timestamp":str(round(time.time())),
                  "oauth_version":"1.0","section":"/search",
              }
              pp["oauth_signature"]=oauth_signature("GET",play_base,{k:v for k,v in pp.items() if k!="oauth_signature"},secret)
              pr=get(play_base+"?"+urllib.parse.urlencode(pp),headers={"Origin":"https://audiomack.com","Referer":"https://audiomack.com/"})
              step={k:v for k,v in pr.items() if k!="body"}
              try: pj=json.loads(pr["body"].decode("utf-8","replace"))
              except Exception as e: pj={}; step["json_error"]=repr(e)
              signed=pj.get("signedUrl") if isinstance(pj,dict) else None
              if not signed and isinstance(pj,dict):
                  data=pj.get("results") or pj.get("data")
                  if isinstance(data,dict): signed=data.get("signedUrl") or data.get("url")
              if signed:
                  bp=byte_probe(signed,{"Referer":"https://audiomack.com/"})
                  am["track"]={"id":tid,"title":t.get("title"),"artist":t.get("artist"),"album":t.get("album"),"signed_url_host":urllib.parse.urlparse(signed).netloc}
                  am["steps"]["play_resolver"]=step
                  am["steps"]["stream"]=bp
                  if bp.get("ok") and bp.get("bytes_read",0)>4096: break
          am["stream_verified"]=bool(am.get("steps",{}).get("stream",{}).get("ok") and am["steps"]["stream"].get("bytes_read",0)>4096)
          am["download_verified"]=False
          out["sources"]["audiomack_web"]=am

          # Bandcamp diagnostics: locate modern embedded state keys without dumping media URLs.
          bc={"steps":{}}
          page="https://omauk.bandcamp.com/track/lofi-continuous-oma-mix"
          r=get(page)
          txt=r.get("body",b"").decode("utf-8","replace")
          bc["steps"]["page"]={k:v for k,v in r.items() if k!="body"}
          keys=["data-tralbum","trackinfo","mp3-128","TralbumData","bandcampEmbeddedPlayer","audio"]
          bc["marker_counts"]={k:txt.count(k) for k in keys}
          snippets={}
          for k in ["trackinfo","mp3-128","TralbumData"]:
              p=txt.find(k)
              if p>=0:
                  snippets[k]=re.sub(r'https?://[^"\\s<>]+','<URL>',txt[max(0,p-250):p+750])
          bc["snippets"]=snippets
          # Try HTML-entity and JSON-escaped variants of mp3-128 URL.
          patterns=[
              r'"mp3-128"\s*:\s*"(https?://[^"]+)"',
              r'&quot;mp3-128&quot;\s*:\s*&quot;(https?://[^&]+)',
              r'mp3-128.{0,1200}?(https?:\\?/\\?/[^"\\s]+)',
          ]
          found=[]
          for pat in patterns:
              for m in re.finditer(pat,txt,re.S):
                  u=html.unescape(m.group(1)).replace("\\/","/").replace("\\u0026","&")
                  if u not in found: found.append(u)
          if found:
              bc["steps"]["stream"]=byte_probe(found[0])
              bc["stream_host"]=urllib.parse.urlparse(found[0]).netloc
          bc["stream_verified"]=bool(bc.get("steps",{}).get("stream",{}).get("ok") and bc["steps"]["stream"].get("bytes_read",0)>4096)
          bc["download_verified"]=False
          out["sources"]["bandcamp_diagnostics"]=bc

          # Jamendo diagnostic with the documentation test client id.
          jm={"steps":{}}
          u="https://api.jamendo.com/v3.0/tracks/?client_id=709fa152&format=json&limit=3&order=popularity_total&include=musicinfo"
          r=get(u)
          jm["steps"]["tracks"]={k:v for k,v in r.items() if k!="body"}
          try:
              jj=json.loads(r["body"].decode("utf-8","replace"))
              jm["headers"]=jj.get("headers") if isinstance(jj,dict) else None
              jm["result_count"]=len(jj.get("results") or []) if isinstance(jj,dict) else 0
          except Exception as e:
              jm["parse_error"]=repr(e); jm["body_preview"]=r["body"][:1000].decode("utf-8","replace")
          jm["stream_verified"]=False
          jm["download_verified"]=False
          out["sources"]["jamendo_diagnostic"]=jm

          with open("music-source-report-round3.json","w",encoding="utf-8") as f:json.dump(out,f,indent=2,ensure_ascii=False)
          lines=["# Music Source Probe Round 3","",f"Generated: {out['generated_at']}",""]
          for name,src in out["sources"].items():
              lines += [f"## {name}",f"- stream_verified: {src.get('stream_verified',False)}",f"- download_verified: {src.get('download_verified',False)}"]
              if src.get("track"):lines.append("- track: `"+json.dumps(src["track"],ensure_ascii=False)+"`")
              if src.get("classification"):lines.append("- classification: "+src["classification"])
              if src.get("marker_counts"):lines.append("- marker_counts: `"+json.dumps(src["marker_counts"])+"`")
              if src.get("headers") is not None:lines.append("- response_headers: `"+json.dumps(src["headers"],ensure_ascii=False)+"`")
              if "result_count" in src:lines.append(f"- result_count: {src['result_count']}")
              for step,d in src.get("steps",{}).items():lines.append(f"- {step}: status={d.get('status')} ok={d.get('ok')} bytes={d.get('bytes_read')} content_type={d.get('content_type')} final_url={d.get('url')}")
              lines.append("")
          open("music-source-report-round3.md","w",encoding="utf-8").write("\n".join(lines))
          print(open("music-source-report-round3.md",encoding="utf-8").read())
          print("BANDCAMP_DIAGNOSTICS",json.dumps(out["sources"]["bandcamp_diagnostics"].get("snippets",{}),ensure_ascii=False)[:5000])
          PY

