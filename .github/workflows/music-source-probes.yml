              try:
                  obj=json.loads(html.unescape(raw))
                  if isinstance(obj,dict):
                      u=obj.get("mp3-128") or next(iter(obj.values()),None)
                      if isinstance(u,str):urls.append(u)
              except Exception:
                  pass
          bc["audio_attributes"]=len(urls)
          for u in urls:
              bp=media(u,{"Referer":page})
