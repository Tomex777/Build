name: Slumber 0.8.7 Integration Build

on:
  push:
    branches: ["pianohub-ci"]
    paths:
      - ".github/workflows/slumber-087-integration-build.yml"
      - ".ci/slumber_085_final_scope/**"
      - ".ci/slumber_086_production_merge/**"
      - ".ci/slumber_087_lesson_core/**"

permissions:
  actions: read
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct exact 0.8.5 source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/slumber-base /tmp/slumber /tmp/slumber-out
          mkdir -p /tmp/slumber-base /tmp/slumber /tmp/slumber-out
          gh run download 34645245543 --repo Tomex777/Build --name slumber-0.8.5-exit-recreation --dir /tmp/slumber-base
          SRC=$(find /tmp/slumber-base -name 'slumber-production-0.8.5-source.tgz' -type f -print -quit)
          test -n "$SRC"
          tar -xzf "$SRC" -C /tmp/slumber

      - name: Apply verified frozen-scope source
        shell: bash
        run: |
          set -euo pipefail
          D="$GITHUB_WORKSPACE/.ci/slumber_085_final_scope"
          cat "$D/final.patch.gz.b64.part00" "$D/final.patch.gz.b64.part01" "$D/final.patch.gz.b64.part02" "$D/final.patch.gz.b64.part03a" "$D/final.patch.gz.b64.part03b" "$D/final.patch.gz.b64.part04" "$D/final.patch.gz.b64.part05" "$D/final.patch.gz.b64.part06" > /tmp/final.b64
          echo '8133f27d9d76d002967f1c53d0a0b27cf89eec9f31cb24ff2188e70951ec504b  /tmp/final.b64' | sha256sum -c -
          base64 -d /tmp/final.b64 > /tmp/final.gz
          echo 'f400e43bb8385ddbc9abefefa801fe8b115456b351effa1e278ea1f3ed250421  /tmp/final.gz' | sha256sum -c -
          gzip -dc /tmp/final.gz > /tmp/final.patch
          echo '42b4f12ec7496c52712154594c31ca39bfe8f43addc7edaab84acefa37c23fa1  /tmp/final.patch' | sha256sum -c -
          cd /tmp/slumber
          patch --dry-run -p1 < /tmp/final.patch
          patch -p1 < /tmp/final.patch

      - name: Apply verified 0.8.6 production source
        shell: bash
        run: |
          set -euo pipefail
          D="$GITHUB_WORKSPACE/.ci/slumber_086_production_merge"
          cat "$D"/production_merge.patch.gz.b64.part* > /tmp/merge.b64
          base64 -d /tmp/merge.b64 > /tmp/merge.gz
          echo '4907d3d93f76b970dab78e40a56ae68ae139a9a60725a7c66fe7dc9b12ac28fe  /tmp/merge.gz' | sha256sum -c -
          gzip -dc /tmp/merge.gz > /tmp/merge.patch
          echo 'de599aad03175f399fa77e23054ab640d9fbb9d037df71f7aff89bb5fd988924  /tmp/merge.patch' | sha256sum -c -
          cd /tmp/slumber
          patch --dry-run -p1 < /tmp/merge.patch
          patch -p1 < /tmp/merge.patch

      - name: Apply verified 0.8.7 lesson core
        shell: bash
        run: |
          set -euo pipefail
          D="$GITHUB_WORKSPACE/.ci/slumber_087_lesson_core"
          echo 'c59b85e78558546014eb950fa3acb72ae962505d2e84f6451f7ca9200f601949  '$D'/production_087.patch.gz.b64.part00' | sha256sum -c -
          echo '51d25f2deac0dcd83d7c1b97ffafcfd69cea82e3a209e60dbdca7f18ee6cc41d  '$D'/production_087.patch.gz.b64.part01' | sha256sum -c -
          echo 'efc92e0de88bb6a517f0cc89c76ac102a0dc12e9be3311b62866ed25cfd2f5e1  '$D'/production_087.patch.gz.b64.part02' | sha256sum -c -
          echo '554ac4ce79ffa84982ede058c808351dc33527ecbe15fc720858607aa9c16e03  '$D'/production_087.patch.gz.b64.part03' | sha256sum -c -
          echo 'a4750d07917184c96b7bf71b7d2bd432cf950d22f2ff9dd03b9f564bab28d2d5  '$D'/production_087.patch.gz.b64.part04' | sha256sum -c -
          echo '837cf800fc78900b1de5bc0add39c2239dd822209497ea5f6bd09d8cd56af681  '$D'/production_087.patch.gz.b64.part05' | sha256sum -c -
          cat "$D"/production_087.patch.gz.b64.part* > /tmp/087.b64
          echo '502c0c389f5e2ac4aac62534f956c018a26d5f36415b460715b5f7d8416eee3c  /tmp/087.b64' | sha256sum -c -
          base64 -d /tmp/087.b64 > /tmp/087.gz
          echo 'f0d9988e09aeebae516fd88f6f312d5da47ad666eadc4af9c25718a67759158a  /tmp/087.gz' | sha256sum -c -
          gzip -dc /tmp/087.gz > /tmp/087.patch
          echo 'f6d34dee42171156afc634f4cc6727ee29e7480559007094d511a0ec2d34762c  /tmp/087.patch' | sha256sum -c -
          cd /tmp/slumber
          patch --dry-run -p1 < /tmp/087.patch
          patch -p1 < /tmp/087.patch

      - name: Production surface sanity checks
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/slumber
          if grep -R -nEi 'streakDays|effectiveMethods|songStudioMode|songPipelinePrepared|prepare lesson|not available yet|engine boundary|model adapter|coming soon|MIDI [0-9]+' app/src/main/java/com/night/pianohub; then
            echo 'Prototype or fake production state remains' >&2
            exit 1
          fi
          grep -R -q 'allowSkipRecovery' app/src/main/java/com/night/pianohub
          grep -R -q 'advanceTimelineToBeat' app/src/main/java/com/night/pianohub
          grep -R -q 'data class LessonMoment' app/src/main/java/com/night/pianohub
          grep -R -q 'PERFORM' app/src/main/java/com/night/pianohub
          grep -q 'minSdk = 26' app/build.gradle.kts
          grep -q 'versionName = "0.8.7"' app/build.gradle.kts

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --channel=3 "platform-tools" "platforms;android-37.0" "build-tools;37.0.0"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

      - name: Unit tests
        working-directory: /tmp/slumber
        run: gradle --stacktrace testDebugUnitTest

      - name: Build debug APK
        working-directory: /tmp/slumber
        run: gradle --stacktrace assembleDebug

      - name: Package source and APK
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/slumber/app/build/outputs/apk/debug/app-debug.apk /tmp/slumber-out/Slumber-0.8.7-debug.apk
          sha256sum /tmp/slumber-out/Slumber-0.8.7-debug.apk | tee /tmp/slumber-out/apk-sha256.txt
          cd /tmp/slumber
          tar --exclude='./.gradle' --exclude='./build' --exclude='./app/build' -czf /tmp/slumber-out/slumber-0.8.7-source.tgz .

      - uses: actions/upload-artifact@v4
        with:
          name: slumber-0.8.7-integration
          path: /tmp/slumber-out/*
          if-no-files-found: error
