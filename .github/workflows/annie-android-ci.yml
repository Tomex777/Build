name: Annie Android CI

on:
  push:
    branches: [annie-android-ci]
    paths:
      - 'annie-android/**'
      - '.github/workflows/annie-android-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'annie-android/**'
      - '.github/workflows/annie-android-ci.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Run unit tests and build debug APK
        run: |
          gradle --no-daemon --stacktrace -p annie-android :app:testDebugUnitTest :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: annie-android-debug-apk
          path: annie-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
