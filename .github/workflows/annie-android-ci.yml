name: Annie Android CI

on:
  push:
    branches: [annie-android-ci, annie-m0b-validation-20261009, annie-rich-message-types-20261009, annie-gecko-browser-voice-20261009]
    paths:
      - 'annie-android/**'
      - '.github/workflows/annie-android-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'annie-android/**'
      - '.github/workflows/annie-android-ci.yml'
  workflow_dispatch:

concurrency:
  group: annie-android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANNIE_RELEASE_KEYSTORE_B64: ${{ secrets.ANNIE_RELEASE_KEYSTORE_B64 }}
      ANNIE_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANNIE_RELEASE_KEYSTORE_PASSWORD }}
      ANNIE_RELEASE_KEY_ALIAS: ${{ secrets.ANNIE_RELEASE_KEY_ALIAS }}
      ANNIE_RELEASE_KEY_PASSWORD: ${{ secrets.ANNIE_RELEASE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'
      - name: Ensure CI signing keystore
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE="$HOME/.android/debug.keystore"
          mkdir -p "$(dirname "$KEYSTORE")"
          if [ ! -f "$KEYSTORE" ]; then
            keytool -genkeypair               -keystore "$KEYSTORE"               -storepass android               -alias androiddebugkey               -keypass android               -dname "CN=Android Debug,O=Android,C=US"               -keyalg RSA               -keysize 2048               -validity 10000               -noprompt
          fi
          test -s "$KEYSTORE"
      - name: Validate and integrate newer Annie M0b/M0.5 overlay
        shell: bash
        run: |
          set -euo pipefail
          python3 annie-android/scripts/test-repair-contract.py
          python3 annie-android/scripts/repair-m0b-merge.py
          sh annie-android/scripts/check-annie-types.sh
      - name: Run unit tests and build debug and release APKs
        run: |
          gradle --no-daemon --stacktrace -p annie-android :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease :app:bundleRelease
      - name: Sign installable ARM64 release candidate
        shell: bash
        run: |
          set -euo pipefail
          ARM64_RELEASE="annie-android/app/build/outputs/apk/release/app-arm64-v8a-release-unsigned.apk"
          SIGNED_RELEASE="annie-android/app/build/outputs/apk/release/app-arm64-v8a-release-ci-signed.apk"
          APKSIGNER="$(command -v apksigner || true)"
          if [ -z "$APKSIGNER" ]; then
            APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"
          fi
          test -f "$ARM64_RELEASE"
          test -f "$HOME/.android/debug.keystore"
          test -n "$APKSIGNER"
          cp "$ARM64_RELEASE" "$SIGNED_RELEASE"
          "$APKSIGNER" sign \
            --ks "$HOME/.android/debug.keystore" \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            "$SIGNED_RELEASE"
          "$APKSIGNER" verify --verbose "$SIGNED_RELEASE"
      - name: Create owner-signed Annie release when configured
        env:
          ANNIE_RELEASE_CERT_SHA256: ${{ vars.ANNIE_RELEASE_CERT_SHA256 }}
        run: bash annie-android/ci/sign-production-release.sh

      - name: Install and verify emulator with retry
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if sdkmanager --install emulator && test -x "$ANDROID_HOME/emulator/emulator" && test -x "$ANDROID_HOME/emulator/qemu/linux-x86_64/qemu-system-x86_64"; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo '::error::Android emulator installation failed validation.'
              exit 1
            fi
            echo '::warning::Retrying an incomplete Android emulator download.'
            rm -rf "$ANDROID_HOME/emulator"
            sleep $((attempt * 5))
          done
      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Android emulator UI and metadata API tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -partition-size 4096
          script: bash annie-android/ci/run-emulator-tests.sh
      - name: Summarize emulator test failures
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          import xml.etree.ElementTree as ET

          roots = [
              Path("annie-android/app/build/outputs/androidTest-results"),
              Path("annie-android/app/build/reports/androidTests"),
              Path("annie-android/build/ci-test-reports"),
          ]
          summaries = []
          for root in roots:
              if not root.exists():
                  continue
              for report in root.rglob("*.xml"):
                  try:
                      document = ET.parse(report).getroot()
                  except (ET.ParseError, OSError):
                      continue
                  suites = [document] if document.tag == "testsuite" else list(document.iter("testsuite"))
                  for suite in suites:
                      for case in suite.findall("testcase"):
                          for failure in list(case.findall("failure")) + list(case.findall("error")):
                              label = f"{case.get('classname', 'test')}.{case.get('name', 'unknown')}"
                              details = (failure.get("message") or failure.text or "No assertion details").strip()
                              summaries.append(f"{label}: {details}")
          if summaries:
              output = "\n".join(summaries)
              print(output)
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
                  summary.write("### Instrumentation test failures\n\n" + output + "\n")
          else:
              print("No failing instrumentation test XML found.")
          PY
      - name: Upload emulator visual proofs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: annie-emulator-screenshots
          path: annie-android/build/emulator-screenshots/
          if-no-files-found: warn
          retention-days: 7
      - name: Upload emulator test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: annie-emulator-test-report
          path: |
            annie-android/app/build/outputs/androidTest-results/
            annie-android/app/build/reports/androidTests/
            annie-android/build/ci-test-reports/
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        if: always()
        with:
          name: annie-android-arm64-debug-apk
          path: annie-android/app/build/outputs/apk/debug/app-arm64-v8a-debug.apk
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        if: always()
        with:
          name: annie-android-arm64-release-apk
          path: annie-android/app/build/outputs/apk/release/app-arm64-v8a-release-ci-signed.apk
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        if: always()
        with:
          name: annie-android-production-signing
          path: |
            annie-android/app/build/outputs/production/
            annie-android/app/build/outputs/ANNIE-SIGNING-STATUS.txt
          if-no-files-found: warn
          retention-days: 7

      - uses: actions/upload-artifact@v4
        continue-on-error: true
        if: always()
        with:
          name: annie-android-arm64-release-unsigned-apk
          path: annie-android/app/build/outputs/apk/release/app-arm64-v8a-release-unsigned.apk
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        if: always()
        with:
          name: annie-android-release-aab
          path: annie-android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: warn
          retention-days: 7

  api-26-edge:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'
      - name: Ensure CI signing keystore
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE="$HOME/.android/debug.keystore"
          mkdir -p "$(dirname "$KEYSTORE")"
          if [ ! -f "$KEYSTORE" ]; then
            keytool -genkeypair               -keystore "$KEYSTORE"               -storepass android               -alias androiddebugkey               -keypass android               -dname "CN=Android Debug,O=Android,C=US"               -keyalg RSA               -keysize 2048               -validity 10000               -noprompt
          fi
          test -s "$KEYSTORE"
      - name: Validate and integrate newer Annie M0b/M0.5 overlay
        shell: bash
        run: |
          set -euo pipefail
          python3 annie-android/scripts/test-repair-contract.py
          python3 annie-android/scripts/repair-m0b-merge.py
          sh annie-android/scripts/check-annie-types.sh
      - name: Warm API 26 test dependencies with retry
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if gradle --no-daemon --stacktrace -p annie-android :app:assembleDebug :app:assembleDebugAndroidTest :app:assembleRelease; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Android test dependency warm-up failed after 3 attempts."
              exit 1
            fi
            echo "::warning::Dependency warm-up attempt $attempt failed; retrying."
            sleep $((attempt * 10))
          done
      - name: Install and verify emulator with retry
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if sdkmanager --install emulator && test -x "$ANDROID_HOME/emulator/emulator" && test -x "$ANDROID_HOME/emulator/qemu/linux-x86_64/qemu-system-x86_64"; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo '::error::Android emulator installation failed validation.'
              exit 1
            fi
            echo '::warning::Retrying an incomplete Android emulator download.'
            rm -rf "$ANDROID_HOME/emulator"
            sleep $((attempt * 5))
          done
      - name: Enable KVM for Android 8 emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run package and full product acceptance on API 26
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 26
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -partition-size 4096
          script: bash annie-android/ci/run-emulator-tests.sh
      - name: Upload API 26 acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: annie-api26-acceptance
          path: |
            annie-android/build/emulator-screenshots/
            annie-android/app/build/outputs/androidTest-results/
            annie-android/app/build/reports/androidTests/
            annie-android/build/ci-test-reports/
          if-no-files-found: warn
          retention-days: 7


  production-install:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api: [26, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: annie-android-production-signing
          path: signed
      - name: Check permanent signing availability
        id: signing
        run: |
          if grep -Fxq 'productionSigning=SIGNED' signed/ANNIE-SIGNING-STATUS.txt; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: android-actions/setup-android@v3
        if: steps.signing.outputs.ready == 'true'
        with:
          packages: 'platform-tools'
      - name: Enable KVM
        if: steps.signing.outputs.ready == 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install screenshot assertion dependency
        if: steps.signing.outputs.ready == 'true'
        run: python3 -m pip install Pillow
      - uses: reactivecircus/android-emulator-runner@v2
        if: steps.signing.outputs.ready == 'true'
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          script: python3 annie-android/ci/production-install.py
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        if: always() && steps.signing.outputs.ready == 'true'
        with:
          name: annie-production-api${{ matrix.api }}-install
          path: production-evidence/
          if-no-files-found: error
          retention-days: 30

  validated-production-release:
    needs: [build, api-26-edge, production-install]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: annie-android-production-signing
          path: signed
      - name: Check production signing and accepted artifacts
        id: release
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -Fxq 'productionSigning=SIGNED' signed/ANNIE-SIGNING-STATUS.txt; then
            echo 'Permanent production signing is not configured. Runtime acceptance passed; Annie is not ready for public distribution.' >> "$GITHUB_STEP_SUMMARY"
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cd signed/production
          test -s Annie-1.0.0-arm64-v8a-production-signed.apk
          test -s Annie-1.0.0-universal-production-signed.apk
          test -s Annie-1.0.0-production-signed.aab
          sha256sum --check SHA256SUMS.txt
          printf 'commit=%s\napi26=PASSED\napi36=PASSED\n' "$GITHUB_SHA" > ACCEPTANCE.txt
          echo 'ready=true' >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        if: steps.release.outputs.ready == 'true'
        with:
          name: Annie-1.0.0-validated-production-release
          path: signed/production/
          if-no-files-found: error
          retention-days: 30
