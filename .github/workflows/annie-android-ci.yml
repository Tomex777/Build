name: Annie Android CI

on:
  push:
    branches: [annie-android-ci]
    paths:
      - 'annie-android/**'
      - '.github/workflows/annie-android-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'annie-android/**'
      - '.github/workflows/annie-android-ci.yml'
  workflow_dispatch:

concurrency:
  group: annie-android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'
      - name: Run unit tests and build debug and release APKs
        run: |
          gradle --no-daemon --stacktrace -p annie-android :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease :app:bundleRelease
      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Android emulator UI and metadata API tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          script: bash annie-android/ci/run-emulator-tests.sh
      - name: Summarize emulator test failures
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          import xml.etree.ElementTree as ET

          roots = [
              Path("annie-android/app/build/outputs/androidTest-results"),
              Path("annie-android/app/build/reports/androidTests"),
              Path("annie-android/build/ci-test-reports"),
          ]
          summaries = []
          for root in roots:
              if not root.exists():
                  continue
              for report in root.rglob("*.xml"):
                  try:
                      document = ET.parse(report).getroot()
                  except (ET.ParseError, OSError):
                      continue
                  suites = [document] if document.tag == "testsuite" else list(document.iter("testsuite"))
                  for suite in suites:
                      for case in suite.findall("testcase"):
                          for failure in list(case.findall("failure")) + list(case.findall("error")):
                              label = f"{case.get('classname', 'test')}.{case.get('name', 'unknown')}"
                              details = (failure.get("message") or failure.text or "No assertion details").strip()
                              summaries.append(f"{label}: {details}")
          if summaries:
              output = "\n".join(summaries)
              print(output)
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
                  summary.write("### Instrumentation test failures\n\n" + output + "\n")
          else:
              print("No failing instrumentation test XML found.")
          PY
      - name: Upload emulator visual proofs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: annie-emulator-screenshots
          path: annie-android/build/emulator-screenshots/
          if-no-files-found: warn
          retention-days: 7
      - name: Upload emulator test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: annie-emulator-test-report
          path: |
            annie-android/app/build/outputs/androidTest-results/
            annie-android/app/build/reports/androidTests/
            annie-android/build/ci-test-reports/
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: annie-android-arm64-debug-apk
          path: annie-android/app/build/outputs/apk/debug/app-arm64-v8a-debug.apk
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: annie-android-arm64-release-apk
          path: annie-android/app/build/outputs/apk/release/app-arm64-v8a-release-unsigned.apk
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: annie-android-release-aab
          path: annie-android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: warn
          retention-days: 7

  api-26-edge:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'
      - name: Warm API 26 test dependencies with retry
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if gradle --no-daemon --stacktrace -p annie-android :app:assembleDebug :app:assembleDebugAndroidTest :app:assembleRelease; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Android test dependency warm-up failed after 3 attempts."
              exit 1
            fi
            echo "::warning::Dependency warm-up attempt $attempt failed; retrying."
            sleep $((attempt * 10))
          done
      - name: Enable KVM for Android 8 emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run package and full product acceptance on API 26
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 26
          target: google_apis
          arch: x86_64
          profile: pixel_2
          script: bash annie-android/ci/run-emulator-tests.sh
      - name: Upload API 26 acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: annie-api26-acceptance
          path: |
            annie-android/build/emulator-screenshots/
            annie-android/app/build/outputs/androidTest-results/
            annie-android/app/build/reports/androidTests/
            annie-android/build/ci-test-reports/
          if-no-files-found: warn
          retention-days: 7
