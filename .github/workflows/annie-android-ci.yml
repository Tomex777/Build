name: Annie Android CI

on:
  push:
    branches: [annie-android-ci]
    paths:
      - 'annie-android/**'
      - '.github/workflows/annie-android-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'annie-android/**'
      - '.github/workflows/annie-android-ci.yml'
  workflow_dispatch:

concurrency:
  group: annie-android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'
      - name: Run unit tests and build debug APK
        run: |
          gradle --no-daemon --stacktrace -p annie-android :app:testDebugUnitTest :app:assembleDebug
      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Android emulator UI and metadata API tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          script: |
            set +e
            gradle --no-daemon --stacktrace -p annie-android :app:connectedDebugAndroidTest
            TEST_STATUS=$?
            echo "===== Android instrumented test XML ====="
            find annie-android/app/build/outputs/androidTest-results -type f -name '*.xml' -print -exec cat {} \; 2>/dev/null || true
            mkdir -p annie-android/build/emulator-screenshots
            echo "===== Screenshot app/package diagnostics ====="
            adb shell pm list packages | grep 'com.tomex777.annie' || true
            adb shell run-as com.tomex777.annie.test sh -c 'find files/ci-screenshots -type f -print' || true
            adb shell run-as com.tomex777.annie.test sh -c 'find files/ci-screenshots -type f -print' | tr -d '\r' | while read -r screenshot; do
              [ -n "$screenshot" ] || continue
              name="${screenshot##*/}"
              adb exec-out run-as com.tomex777.annie.test cat "$screenshot" > "annie-android/build/emulator-screenshots/$name"
              test -s "annie-android/build/emulator-screenshots/$name"
            done
            if [ "$TEST_STATUS" -eq 0 ] && [ -z "$(find annie-android/build/emulator-screenshots -type f -print -quit)" ]; then
              echo "::error::Emulator tests passed without producing their requested screenshots."
              TEST_STATUS=1
            fi
            exit $TEST_STATUS
      - name: Upload emulator visual proofs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: annie-emulator-screenshots
          path: annie-android/build/emulator-screenshots/
          if-no-files-found: warn
          retention-days: 7
      - name: Upload emulator test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: annie-emulator-test-report
          path: |
            annie-android/app/build/outputs/androidTest-results/
            annie-android/app/build/reports/androidTests/
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: annie-android-arm64-debug-apk
          path: annie-android/app/build/outputs/apk/debug/app-arm64-v8a-debug.apk
          if-no-files-found: error
          retention-days: 7
