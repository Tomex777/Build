# Night UI pass 2
# keyboard-fix-preview
name: WhatsApp AI Full UI Preview

on:
  push:
    branches:
      - whatsapp-ai-ui-ci
    paths:
      - "whatsapp-ai-android/**"
      - ".github/workflows/whatsapp-ai-chat-preview.yml"
  pull_request:
    branches:
      - whatsapp-ai-ui-ci
    paths:
      - "whatsapp-ai-android/**"
      - ".github/workflows/whatsapp-ai-chat-preview.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: whatsapp-ai-chat-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-capture:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android 36 SDK
        run: |
          SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/16.0/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Add preview Firebase config
        run: |
          cat > whatsapp-ai-android/app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "123456789012",
              "project_id": "whatsapp-ai-preview",
              "storage_bucket": "whatsapp-ai-preview.appspot.com"
            },
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:123456789012:android:0123456789abcdef",
                "android_client_info": {"package_name": "com.example.whatsapp"}
              },
              "oauth_client": [],
              "api_key": [{"current_key": "AIzaSyDUMMY_PREVIEW_KEY_NOT_FOR_NETWORK_USE"}],
              "services": {"appinvite_service": {"other_platform_oauth_client": []}}
            }],
            "configuration_version": "1"
          }
          JSON

      - name: Build debug APK
        run: |
          cd whatsapp-ai-android
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace

      - name: Upload Night APK
        uses: actions/upload-artifact@v4
        with:
          name: night-core-apk
          path: whatsapp-ai-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Run preview and capture screenshot
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          emulator-boot-timeout: 420
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -accel on -wipe-data
          script: |
            adb install --no-streaming -r whatsapp-ai-android/app/build/outputs/apk/debug/app-debug.apk
            adb shell wm size 709x1536
            adb shell wm density 240
            mkdir -p whatsapp-ai-preview

            adb shell am force-stop com.example.whatsapp
            adb shell am start -W -n com.example.whatsapp/.MainTabsPreviewActivity --es tab chats
            sleep 2
            adb exec-out screencap -p > whatsapp-ai-preview/night-chats.png

            adb shell am force-stop com.example.whatsapp
            adb shell am start -W -n com.example.whatsapp/.MainTabsPreviewActivity --es tab library
            sleep 2
            adb exec-out screencap -p > whatsapp-ai-preview/night-library.png

            adb shell am force-stop com.example.whatsapp
            adb shell am start -W -n com.example.whatsapp/.MainTabsPreviewActivity --es tab you
            sleep 2
            adb exec-out screencap -p > whatsapp-ai-preview/night-you.png

            adb shell am force-stop com.example.whatsapp
            adb shell am start -W -n com.example.whatsapp/.ChatPreviewActivity
            sleep 2
            adb exec-out screencap -p > whatsapp-ai-preview/night-chat.png

            adb shell am force-stop com.example.whatsapp
            adb shell am start -W -n com.example.whatsapp/.ChatPreviewActivity --es mode media
            sleep 2
            adb exec-out screencap -p > whatsapp-ai-preview/night-media.png

            adb shell am force-stop com.example.whatsapp
            adb shell am start -W -n com.example.whatsapp/.ChatPreviewActivity --es mode audio
            sleep 2
            adb exec-out screencap -p > whatsapp-ai-preview/night-audio.png

            adb shell am force-stop com.example.whatsapp
            adb shell am start -W -n com.example.whatsapp/.ChatPreviewActivity --es mode docs
            sleep 2
            adb exec-out screencap -p > whatsapp-ai-preview/night-docs.png

            adb shell am force-stop com.example.whatsapp
            adb shell am start -W -n com.example.whatsapp/.ChatPreviewActivity --es mode rich
            sleep 2
            adb exec-out screencap -p > whatsapp-ai-preview/night-rich.png

            adb shell am force-stop com.example.whatsapp
            adb shell am start -W -n com.example.whatsapp/.ChatPreviewActivity --ez attachments true
            sleep 2
            adb exec-out screencap -p > whatsapp-ai-preview/night-attachments.png

            adb shell am force-stop com.example.whatsapp
            adb shell am start -W -n com.example.whatsapp/.ChatPreviewActivity --ez emoji true
            sleep 2
            adb exec-out screencap -p > whatsapp-ai-preview/night-emoji.png

            adb shell am force-stop com.example.whatsapp
            adb shell am start -W -n com.example.whatsapp/.ChatPreviewActivity --ez menu true
            sleep 2
            adb exec-out screencap -p > whatsapp-ai-preview/night-menu.png

            adb shell am force-stop com.example.whatsapp
            adb shell am start -W -n com.example.whatsapp/.ChatPreviewActivity --es mode media
            sleep 2
            adb exec-out screencap -p > whatsapp-ai-preview/night-media-cards.png

            adb shell am force-stop com.example.whatsapp
            adb shell am start -W -n com.example.whatsapp/.ChatPreviewActivity --es mode rich1
            sleep 2
            adb exec-out screencap -p > whatsapp-ai-preview/night-rich-cards-1.png

            adb shell am force-stop com.example.whatsapp
            adb shell am start -W -n com.example.whatsapp/.ChatPreviewActivity --es mode rich2
            sleep 2
            adb exec-out screencap -p > whatsapp-ai-preview/night-rich-cards-2.png

            adb shell am force-stop com.example.whatsapp
            adb shell am start -W -n com.example.whatsapp/.ChatPreviewActivity --es mode approved-rich
            sleep 2
            adb exec-out screencap -p > whatsapp-ai-preview/night-approved-rich.png

            adb shell am force-stop com.example.whatsapp
            adb shell am start -W -n com.example.whatsapp/.ChatPreviewActivity --es mode utility
            sleep 2
            adb exec-out screencap -p > whatsapp-ai-preview/night-approved-files-links.png

            adb shell am force-stop com.example.whatsapp
            adb shell am start -W -n com.example.whatsapp/.ChatPreviewActivity
            sleep 2
            adb shell input tap 300 1440
            sleep 2
            adb shell input text "Night"
            sleep 1
            adb exec-out screencap -p > whatsapp-ai-preview/night-keyboard.png

      - name: Commit rendered screenshot
        if: always() && github.event_name == 'push'
        run: |
          mkdir -p whatsapp-ai-preview
          {
            echo "run_id=${{ github.run_id }}"
            echo "sha=${{ github.sha }}"
            echo "status=${{ job.status }}"
          } > whatsapp-ai-preview/night-ci-status.txt
          git fetch origin whatsapp-ai-ui-ci
          git rebase origin/whatsapp-ai-ui-ci || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add whatsapp-ai-preview || true
          git diff --cached --quiet && exit 0
          git commit -m "Update current WhatsApp chat preview"
          git push origin HEAD:whatsapp-ai-ui-ci

      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: night-ui-preview
          path: |
            whatsapp-ai-preview/*.png
          if-no-files-found: warn
