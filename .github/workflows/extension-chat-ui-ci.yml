name: Extension Chat Android UI

on:
  push:
    branches:
      - extension-chat-ui-ci
    paths:
      - "extension-chat-android/**"
      - ".github/workflows/extension-chat-ui-ci.yml"
  pull_request:
    branches:
      - main
    paths:
      - "extension-chat-android/**"
      - ".github/workflows/extension-chat-ui-ci.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: extension-chat-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-screenshot:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare diagnostics
        run: |
          mkdir -p extension-chat-preview
          echo "sha=$GITHUB_SHA stage=workflow-started" > extension-chat-preview/status.txt

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Mark JDK ready
        run: echo "sha=$GITHUB_SHA stage=jdk-ready" > extension-chat-preview/status.txt

      - name: Verify preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME" -type f -name sdkmanager | head -n 1)"
          echo "SDKMANAGER=$SDKMANAGER"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --version
          echo "sha=$GITHUB_SHA stage=android-sdk-ready" > extension-chat-preview/status.txt
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

      - name: Install compile SDK 37
        run: |
          set -o pipefail
          "$SDKMANAGER" --list 2>&1 | tee extension-chat-preview/sdk.log
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-37" "build-tools;36.0.0" 2>&1 | tee -a extension-chat-preview/sdk.log
          test -d "$ANDROID_HOME/platforms/android-37"
          echo "sha=$GITHUB_SHA stage=compile-sdk-ready" > extension-chat-preview/status.txt

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Mark Gradle ready
        run: echo "sha=$GITHUB_SHA stage=gradle-ready" > extension-chat-preview/status.txt

      - name: Build debug APK
        id: build
        run: |
          set -o pipefail
          gradle -p extension-chat-android :app:assembleDebug --stacktrace 2>&1 | tee extension-chat-preview/build.log
          echo "sha=$GITHUB_SHA stage=build-succeeded" > extension-chat-preview/status.txt

      - name: Boot emulator and capture UI
        if: steps.build.outcome == 'success'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r extension-chat-android/app/build/outputs/apk/debug/app-debug.apk
            adb shell am force-stop com.night.extensionchat
            adb shell am start -W -n com.night.extensionchat/.MainActivity
            sleep 4
            adb exec-out screencap -p > extension-chat-preview/chat-screen.png
            echo "sha=$GITHUB_SHA stage=screenshot-captured" > extension-chat-preview/status.txt

      - name: Commit preview diagnostics
        if: always() && github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add extension-chat-preview || true
          git diff --cached --quiet && exit 0
          git commit -m "Update rendered Extension Chat preview"
          git push origin HEAD:extension-chat-ui-ci

      - name: Upload APK and screenshot
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: extension-chat-ui-preview
          path: |
            extension-chat-android/app/build/outputs/apk/debug/app-debug.apk
            extension-chat-preview/chat-screen.png
          if-no-files-found: warn
