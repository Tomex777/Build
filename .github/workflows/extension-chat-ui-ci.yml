name: Extension Chat Android UI

on:
  push:
    branches:
      - extension-chat-ui-ci
    paths:
      - "extension-chat-android/**"
      - ".github/workflows/extension-chat-ui-ci.yml"
  pull_request:
    branches:
      - main
    paths:
      - "extension-chat-android/**"
      - ".github/workflows/extension-chat-ui-ci.yml"
  workflow_dispatch:

jobs:
  build-and-screenshot:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install compile SDK
        run: sdkmanager "platforms;android-37" "build-tools;36.0.0"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Build debug APK
        run: gradle -p extension-chat-android :app:assembleDebug --stacktrace

      - name: Boot emulator and capture UI
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r extension-chat-android/app/build/outputs/apk/debug/app-debug.apk
            adb shell am force-stop com.night.extensionchat
            adb shell am start -W -n com.night.extensionchat/.MainActivity
            sleep 4
            mkdir -p extension-chat-artifacts
            adb exec-out screencap -p > extension-chat-artifacts/chat-screen.png

      - name: Upload APK and screenshot
        uses: actions/upload-artifact@v4
        with:
          name: extension-chat-ui-preview
          path: |
            extension-chat-android/app/build/outputs/apk/debug/app-debug.apk
            extension-chat-artifacts/chat-screen.png
          if-no-files-found: error
