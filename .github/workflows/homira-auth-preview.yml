name: Homira Auth UI Preview

on:
  push:
    branches: [homira-call-ci]
    paths:
      - 'homira-android/app/src/main/java/com/night/homira/ui/HomiraAuthGate.kt'
      - 'homira-android/app/src/main/res/drawable-nodpi/homira_call_mascot.webp'
      - '.github/workflows/homira-auth-preview.yml'
  workflow_dispatch:

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build debug APK
        working-directory: homira-android
        run: gradle :app:assembleDebug --stacktrace

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Render auth screen
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb wait-for-device
            until [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1" ]; do
              sleep 2
            done
            adb install -r homira-android/app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am force-stop com.night.homira
            adb shell am start -W -n com.night.homira/.MainActivity

            for i in $(seq 1 30); do
              focus="$(adb shell dumpsys window windows | grep -m 1 'mCurrentFocus' || true)"
              echo "$focus"
              if echo "$focus" | grep -q 'com.night.homira'; then
                break
              fi
              sleep 1
            done

            sleep 15
            mkdir -p homira-android/app/build/ui-preview
            adb shell dumpsys activity activities > homira-android/app/build/ui-preview/activity.txt
            adb shell dumpsys window windows > homira-android/app/build/ui-preview/windows.txt
            adb logcat -d -t 800 > homira-android/app/build/ui-preview/logcat.txt
            adb exec-out screencap -p > homira-android/app/build/ui-preview/auth-screen.png

      - name: Upload auth preview
        uses: actions/upload-artifact@v4
        with:
          name: homira-auth-screen
          path: homira-android/app/build/ui-preview/
          if-no-files-found: error
