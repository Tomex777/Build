name: AnimeThemes Contract Probe

on:
  push:
    branches:
      - music-source-probes-20260930
    paths:
      - ".github/workflows/music-animethemes-contract.yml"
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Map current AnimeThemes catalog to audio
        shell: bash
        run: |
          python3 - <<'PY'
          import json, urllib.parse, urllib.request, urllib.error

          BASE="https://api.animethemes.moe"
          UA="LyraSourceProbe/1.0"

          def get(path,max_bytes=2500000,range_probe=False):
              url=BASE+path
              headers={"User-Agent":UA,"Accept":"application/json,*/*"}
              if range_probe:headers["Range"]="bytes=0-65535"
              try:
                  with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=30) as r:
                      b=r.read(65536 if range_probe else max_bytes)
                      return {"ok":True,"status":getattr(r,"status",200),"url":r.geturl(),
                              "ct":r.headers.get("Content-Type"),"cl":r.headers.get("Content-Length"),
                              "cr":r.headers.get("Content-Range"),"bytes":len(b),"body":b}
              except urllib.error.HTTPError as e:
                  return {"ok":False,"status":e.code,"url":url,"ct":e.headers.get("Content-Type") if e.headers else None,
                          "bytes":0,"body":e.read(12000),"error":str(e)}
              except Exception as e:
                  return {"ok":False,"status":None,"url":url,"bytes":0,"body":b"","error":repr(e)}

          def jget(path):
              r=get(path)
              z={k:v for k,v in r.items() if k!="body"}
              try:z["json"]=json.loads(r["body"].decode("utf-8","replace"))
              except Exception as e:
                  z["json_error"]=repr(e)
                  z["preview"]=r["body"][:1000].decode("utf-8","replace")
              return z

          def summarize(name,x):
              print("##",name)
              print("status",x.get("status"),"ct",x.get("ct"),"bytes",x.get("bytes"),"url",x.get("url"))
              if "json" in x:print(json.dumps(x["json"],ensure_ascii=False)[:16000])
              else:print(x.get("preview","")[:2000])

          q=urllib.parse.quote("Bleach")
          probes={
            "search":jget("/search?q="+q+"&page%5Blimit%5D=5"),
            "anime_simple":jget("/anime?q="+q+"&page%5Bsize%5D=2"),
            "anime_include_audio":jget(
              "/anime?q="+q+
              "&page%5Bsize%5D=2"+
              "&include=animethemes.song.artists,animethemes.animethemeentries.videos.audio"
            ),
            "song":jget("/song?q="+urllib.parse.quote("Asterisk")+"&page%5Bsize%5D=5&include=artists,animethemes.anime"),
            "theme_show":jget("/animetheme/1790?include=song.artists,anime,animethemeentries.videos.audio"),
            "anime_show":jget("/anime/318?include=animethemes.song.artists,animethemes.animethemeentries.videos.audio"),
          }
          for k,v in probes.items():summarize(k,v)

          # Find first audio link recursively from successful JSON responses and prove bytes.
          def dicts(v):
              if isinstance(v,dict):
                  yield v
                  for x in v.values():yield from dicts(x)
              elif isinstance(v,list):
                  for x in v:yield from dicts(x)

          media=None
          for source in ["anime_include_audio","search","song"]:
              j=probes[source].get("json")
              if j is None:continue
              for d in dicts(j):
                  link=d.get("link")
                  mime=str(d.get("mimetype",""))
                  if isinstance(link,str) and link.startswith("http") and ("audio" in mime.lower() or link.lower().endswith((".ogg",".mp3",".m4a",".flac"))):
                      media={"source":source,"link":link,"resource":{k:d.get(k) for k in ("id","basename","filename","size","mimetype","link")}}
                      break
              if media:break

          if not media:
              # Audio index itself is a documented unauthenticated resource.
              audio=jget("/audio?page%5Bsize%5D=3&sort=-updated_at")
              probes["audio_index"]=audio
              summarize("audio_index",audio)
              for d in dicts(audio.get("json")):
                  link=d.get("link")
                  if isinstance(link,str) and link.startswith("http"):
                      media={"source":"audio_index","link":link,"resource":{k:d.get(k) for k in ("id","basename","filename","size","mimetype","link")}}
                      break

          if media:
              url=media["link"]
              headers={"User-Agent":UA,"Accept":"*/*","Range":"bytes=0-65535"}
              try:
                  with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=30) as r:
                      b=r.read(65536)
                      media["proof"]={"status":getattr(r,"status",200),"url":r.geturl(),"ct":r.headers.get("Content-Type"),
                                      "cl":r.headers.get("Content-Length"),"cr":r.headers.get("Content-Range"),
                                      "bytes":len(b),"magic":b[:24].hex()}
              except Exception as e:
                  media["proof"]={"error":repr(e)}

          report={"probes":{k:{kk:vv for kk,vv in v.items() if kk!="json"} for k,v in probes.items()},"media":media}
          open("animethemes-contract.json","w").write(json.dumps(report,indent=2,ensure_ascii=False))
          print("## MEDIA")
          print(json.dumps(media,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: animethemes-contract
          path: animethemes-contract.json
