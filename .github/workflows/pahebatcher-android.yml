name: PaheBatcher Android

concurrency:
  group: pahebatcher-android-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [pahebatcher-android-ci]
    paths:
      - 'pahebatcher-android/**'
      - '.github/workflows/pahebatcher-android.yml'
  workflow_dispatch:

jobs:
  build-and-visual-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Start Tor test proxy
        id: tor
        run: |
          sudo apt-get update -y
          sudo apt-get install -y tor privoxy
          echo 'ControlPort 9051' | sudo tee -a /etc/tor/torrc
          echo 'CookieAuthentication 0' | sudo tee -a /etc/tor/torrc
          sudo sed -i 's/^listen-address[[:space:]]\+127\.0\.0\.1:8118/listen-address  0.0.0.0:8118/' /etc/privoxy/config
          echo 'forward-socks5t / 127.0.0.1:9050 .' | sudo tee -a /etc/privoxy/config
          sudo systemctl restart tor || sudo service tor restart
          sudo systemctl restart privoxy || sudo service privoxy restart

          tor_ready=false
          for i in $(seq 1 30); do
            if curl -fsS --max-time 15 -x http://127.0.0.1:8118 https://check.torproject.org/api/ip >/tmp/tor-ip.json; then
              tor_ready=true
              break
            fi
            sleep 2
          done
          if [ "$tor_ready" != "true" ]; then
            echo "Tor proxy did not become ready" >&2
            exit 1
          fi
          cat /tmp/tor-ip.json

          live_animepahe=false
          for attempt in $(seq 1 6); do
            body="$(curl -sS --max-time 20 -x http://127.0.0.1:8118 'https://animepahe.pw/api?m=search&q=bleach' || true)"
            if printf '%s' "$body" | grep -q '"data"'; then
              live_animepahe=true
              echo "AnimePahe JSON reachable through Tor on attempt $attempt"
              break
            fi

            python3 -c 'import socket; s=socket.create_connection(("127.0.0.1",9051),timeout=5); s.sendall(b"AUTHENTICATE\\r\\nSIGNAL NEWNYM\\r\\nQUIT\\r\\n"); s.recv(4096); s.close()'
            sleep 11
          done

          echo "live_animepahe=$live_animepahe" >> "$GITHUB_OUTPUT"
          if [ "$live_animepahe" != "true" ]; then
            echo "AnimePahe challenged all sampled Tor exits; live catalog test will be skipped."
          fi

      - name: Build debug APK
        working-directory: pahebatcher-android
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pahebatcher-android-debug
          path: pahebatcher-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Emulator visual smoke
        env:
          LIVE_ANIMEPAHE: ${{ steps.tor.outputs.live_animepahe }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-boot-timeout: 900
          profile: pixel_6
          cores: 2
          ram-size: 3072M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            set -eu
            mkdir -p visual
            adb wait-for-device
            adb shell 'while [ "$(getprop sys.boot_completed)" != "1" ]; do sleep 1; done'
            sleep 8
            adb install --no-streaming -r pahebatcher-android/app/build/outputs/apk/debug/app-debug.apk || (sleep 8; adb wait-for-device; adb install --no-streaming -r pahebatcher-android/app/build/outputs/apk/debug/app-debug.apk)
            adb shell wm size 1080x2400
            adb shell wm density 440
            adb shell settings put global http_proxy 10.0.2.2:8118
            adb shell am start -W -n com.night.pahebatcher/.MainActivity
            sleep 4
            python3 pahebatcher-android/ci/visual_smoke.py

      - name: Upload visual smoke
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pahebatcher-visual-smoke
          path: visual/*.png
          if-no-files-found: warn
