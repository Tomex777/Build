name: PaheBatcher Android

concurrency:
  group: pahebatcher-android-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [pahebatcher-android-ci]
    paths:
      - 'pahebatcher-android/**'
      - '.github/workflows/pahebatcher-android.yml'
  workflow_dispatch:

jobs:
  build-and-visual-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build debug APK
        working-directory: pahebatcher-android
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pahebatcher-android-debug
          path: pahebatcher-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Emulator visual smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          cores: 2
          ram-size: 3072M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            set -euo pipefail
            mkdir -p visual
            adb wait-for-device
            adb shell 'while [ "$(getprop sys.boot_completed)" != "1" ]; do sleep 1; done'
            sleep 8
            adb install --no-streaming -r pahebatcher-android/app/build/outputs/apk/debug/app-debug.apk || (sleep 8; adb wait-for-device; adb install --no-streaming -r pahebatcher-android/app/build/outputs/apk/debug/app-debug.apk)
            adb shell wm size 1080x2400
            adb shell wm density 440
            adb shell am start -W -n com.night.pahebatcher/.MainActivity
            sleep 4

            dump_ui() {
              adb shell uiautomator dump /sdcard/window.xml >/dev/null
              adb pull /sdcard/window.xml visual/window.xml >/dev/null
            }

            assert_text() {
              dump_ui
              python3 - "$1" <<'PY'
import sys, xml.etree.ElementTree as ET
needle = sys.argv[1]
root = ET.parse("visual/window.xml").getroot()
values = [n.attrib.get("text", "") for n in root.iter("node")]
if needle not in values:
    raise SystemExit(f"Missing UI text: {needle!r}. Visible: {values}")
PY
            }

            tap_text() {
              dump_ui
              read X Y < <(python3 - "$1" <<'PY'
import re, sys, xml.etree.ElementTree as ET
needle = sys.argv[1]
root = ET.parse("visual/window.xml").getroot()
for n in root.iter("node"):
    if n.attrib.get("text") == needle:
        m = re.fullmatch(r"\[(\d+),(\d+)\]\[(\d+),(\d+)\]", n.attrib.get("bounds", ""))
        if m:
            x1,y1,x2,y2 = map(int, m.groups())
            print((x1+x2)//2, (y1+y2)//2)
            raise SystemExit
raise SystemExit(f"Could not tap UI text: {needle!r}")
PY
              )
              adb shell input tap "$X" "$Y"
              sleep 2
            }

            assert_text "PaheBatcher"
            assert_text "Explore"
            assert_text "Downloads"
            assert_text "Settings"
            adb exec-out screencap -p > visual/explore.png

            tap_text "Settings"
            assert_text "Web verification"
            assert_text "Open verification browser"
            adb exec-out screencap -p > visual/settings.png

            tap_text "Open verification browser"
            assert_text "Step 1 of 2 · AnimePahe"
            assert_text "I’ve completed AnimePahe"
            adb exec-out screencap -p > visual/verification.png

            adb shell pidof com.night.pahebatcher

      - name: Upload visual smoke
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pahebatcher-visual-smoke
          path: visual/*.png
          if-no-files-found: warn
