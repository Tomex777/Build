name: PaheBatcher Android

concurrency:
  group: pahebatcher-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

on:
  push:
    branches: [pahebatcher-android-ci]
    paths:
      - 'pahebatcher-android/app/**'
      - 'pahebatcher-android/diagnostics/**'
      - 'pahebatcher-android/kwik-manual/**'
      - 'pahebatcher-android/*.gradle.kts'
      - 'pahebatcher-android/gradle.properties'
      - 'pahebatcher-android/ci/visual_smoke.py'
      - '.github/workflows/pahebatcher-android.yml'
  workflow_dispatch:

jobs:
  build-and-visual-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v5

      - name: Publish current run id
        run: |
          mkdir -p ci-status
          printf '%s\n' "$GITHUB_RUN_ID" > ci-status/pahe-diagnostics-latest.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci-status/pahe-diagnostics-latest.txt
          git commit -m "Record Pahe diagnostics CI run $GITHUB_RUN_ID" || true
          git push origin "HEAD:$GITHUB_REF_NAME"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Verify Tor stays CI-only
        run: |
          if grep -R -E -i 'torproject|orbot|socks5|127\.0\.0\.1:9050|10\.0\.2\.2:8118' pahebatcher-android/app pahebatcher-android/diagnostics pahebatcher-android/kwik-manual; then
            echo "Tor/proxy plumbing found inside Android app or diagnostics source" >&2
            exit 1
          fi
          echo "No Tor/Orbot/SOCKS test plumbing is packaged in any APK."

      - name: Build debug APKs
        working-directory: pahebatcher-android
        run: gradle :app:assembleDebug :diagnostics:assembleDebug :kwik-manual:assembleDebug --stacktrace

      - name: Upload app APK
        uses: actions/upload-artifact@v4
        with:
          name: pahebatcher-android-debug
          path: pahebatcher-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload Pahe Trace APK
        uses: actions/upload-artifact@v4
        with:
          name: pahe-trace-debug
          path: pahebatcher-android/diagnostics/build/outputs/apk/debug/diagnostics-debug.apk
          if-no-files-found: error

      - name: Upload Kwik Manual APK
        uses: actions/upload-artifact@v4
        with:
          name: kwik-manual-debug
          path: pahebatcher-android/kwik-manual/build/outputs/apk/debug/kwik-manual-debug.apk
          if-no-files-found: error

      - name: Android 14 visual smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-boot-timeout: 900
          profile: pixel_6
          cores: 2
          ram-size: 3072M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            set -eu
            mkdir -p visual
            trap 'adb logcat -d > visual/logcat.txt 2>&1 || true; adb shell dumpsys activity activities > visual/activity.txt 2>&1 || true; adb shell dumpsys webviewupdate > visual/webview.txt 2>&1 || true' EXIT
            adb wait-for-device
            adb shell 'while [ "$(getprop sys.boot_completed)" != "1" ]; do sleep 1; done'
            sleep 8
            adb install --no-streaming -r pahebatcher-android/app/build/outputs/apk/debug/app-debug.apk
            adb shell wm size 1080x2400
            adb shell wm density 440
            adb shell am start -W -n com.night.pahebatcher/.MainActivity
            sleep 4
            python3 pahebatcher-android/ci/visual_smoke.py
            adb install --no-streaming -r pahebatcher-android/diagnostics/build/outputs/apk/debug/diagnostics-debug.apk
            adb shell am start -W -n com.night.pahediagnostics/.MainActivity
            sleep 3
            adb shell uiautomator dump /sdcard/diagnostics-window.xml >/dev/null
            adb pull /sdcard/diagnostics-window.xml visual/diagnostics-window.xml >/dev/null
            grep -q 'Pahe Diagnostics' visual/diagnostics-window.xml
            adb exec-out screencap -p > visual/diagnostics.png
            test -n "$(adb shell pidof com.night.pahediagnostics | tr -d '\r')"
            adb install --no-streaming -r pahebatcher-android/kwik-manual/build/outputs/apk/debug/kwik-manual-debug.apk
            adb shell am start -W -n com.night.kwikmanual/.MainActivity
            sleep 3
            adb shell uiautomator dump /sdcard/kwik-manual-window.xml >/dev/null
            adb pull /sdcard/kwik-manual-window.xml visual/kwik-manual-window.xml >/dev/null
            grep -q 'Kwik Manual' visual/kwik-manual-window.xml
            adb exec-out screencap -p > visual/kwik-manual.png
            test -n "$(adb shell pidof com.night.kwikmanual | tr -d '\r')"

      - name: Android 8.0 API 26 launch smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 26
          arch: x86_64
          target: google_apis
          emulator-boot-timeout: 900
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            set -eu
            mkdir -p api26
            adb wait-for-device
            adb shell 'while [ "$(getprop sys.boot_completed)" != "1" ]; do sleep 1; done'
            sleep 8
            adb install --no-streaming -r pahebatcher-android/app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -W -n com.night.pahebatcher/.MainActivity
            sleep 5
            adb shell uiautomator dump /sdcard/api26-window.xml >/dev/null
            adb pull /sdcard/api26-window.xml api26/window.xml >/dev/null
            grep -q 'PaheBatcher' api26/window.xml
            adb exec-out screencap -p > api26/launch.png
            test -n "$(adb shell pidof com.night.pahebatcher | tr -d '\r')"
            adb install --no-streaming -r pahebatcher-android/diagnostics/build/outputs/apk/debug/diagnostics-debug.apk
            adb shell am start -W -n com.night.pahediagnostics/.MainActivity
            sleep 3
            adb shell uiautomator dump /sdcard/api26-diagnostics.xml >/dev/null
            adb pull /sdcard/api26-diagnostics.xml api26/diagnostics-window.xml >/dev/null
            grep -q 'Pahe Diagnostics' api26/diagnostics-window.xml
            adb exec-out screencap -p > api26/diagnostics-launch.png
            test -n "$(adb shell pidof com.night.pahediagnostics | tr -d '\r')"
            adb install --no-streaming -r pahebatcher-android/kwik-manual/build/outputs/apk/debug/kwik-manual-debug.apk
            adb shell am start -W -n com.night.kwikmanual/.MainActivity
            sleep 3
            adb shell uiautomator dump /sdcard/api26-kwik-manual.xml >/dev/null
            adb pull /sdcard/api26-kwik-manual.xml api26/kwik-manual-window.xml >/dev/null
            grep -q 'Kwik Manual' api26/kwik-manual-window.xml
            adb exec-out screencap -p > api26/kwik-manual-launch.png
            test -n "$(adb shell pidof com.night.kwikmanual | tr -d '\r')"

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pahebatcher-visual-smoke
          path: |
            visual/**
            api26/**
          if-no-files-found: warn
