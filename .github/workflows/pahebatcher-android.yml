name: Pahe Diagnostic Apps

concurrency:
  group: pahe-diagnostic-apps-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

on:
  push:
    branches: [pahe-diagnostics-ci]
    paths:
      - 'pahebatcher-android/diagnostics/**'
      - 'pahebatcher-android/kwik-manual/**'
      - 'pahebatcher-android/*.gradle.kts'
      - 'pahebatcher-android/gradle.properties'
      - '.github/workflows/pahebatcher-android.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build diagnostic APKs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Publish current run id
        run: |
          mkdir -p ci-status
          printf '%s\n' "$GITHUB_RUN_ID" > ci-status/pahe-diagnostics-latest.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci-status/pahe-diagnostics-latest.txt
          git commit -m "Record Pahe diagnostics CI run $GITHUB_RUN_ID" || true
          git push origin "HEAD:$GITHUB_REF_NAME"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Verify no Tor is packaged
        run: |
          if grep -R -E -i 'torproject|orbot|socks5|127\.0\.0\.1:9050|10\.0\.2\.2:8118'             pahebatcher-android/diagnostics pahebatcher-android/kwik-manual; then
            echo "Tor/proxy plumbing found inside a diagnostic APK source" >&2
            exit 1
          fi
          echo "No Tor/Orbot/SOCKS plumbing is packaged in either diagnostic APK."

      - name: Build Pahe Trace and Kwik Manual
        working-directory: pahebatcher-android
        run: gradle :diagnostics:assembleDebug :kwik-manual:assembleDebug --stacktrace

      - name: Upload Pahe Trace APK
        uses: actions/upload-artifact@v4
        with:
          name: pahe-trace-debug
          path: pahebatcher-android/diagnostics/build/outputs/apk/debug/diagnostics-debug.apk
          if-no-files-found: error

      - name: Upload Kwik Manual APK
        uses: actions/upload-artifact@v4
        with:
          name: kwik-manual-debug
          path: pahebatcher-android/kwik-manual/build/outputs/apk/debug/kwik-manual-debug.apk
          if-no-files-found: error

  smoke-android14:
    name: Android 14 smoke
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build for smoke
        working-directory: pahebatcher-android
        run: gradle :diagnostics:assembleDebug :kwik-manual:assembleDebug
      - name: Launch both apps
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-boot-timeout: 900
          profile: pixel_6
          cores: 2
          ram-size: 3072M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            set -eu
            mkdir -p smoke34

            adb install --no-streaming -r pahebatcher-android/diagnostics/build/outputs/apk/debug/diagnostics-debug.apk
            adb shell am start -W -n com.night.pahediagnostics/.MainActivity
            sleep 3
            adb shell uiautomator dump /sdcard/pahe-trace.xml >/dev/null
            adb pull /sdcard/pahe-trace.xml smoke34/pahe-trace.xml >/dev/null
            grep -q 'Pahe Trace' smoke34/pahe-trace.xml
            grep -q 'Trace AnimePahe' smoke34/pahe-trace.xml
            test -n "$(adb shell pidof com.night.pahediagnostics | tr -d '\r')"
            adb exec-out screencap -p > smoke34/pahe-trace.png

            adb install --no-streaming -r pahebatcher-android/kwik-manual/build/outputs/apk/debug/kwik-manual-debug.apk
            adb shell am start -W -n com.night.kwikmanual/.MainActivity
            sleep 3
            adb shell uiautomator dump /sdcard/kwik-manual.xml >/dev/null
            adb pull /sdcard/kwik-manual.xml smoke34/kwik-manual.xml >/dev/null
            grep -q 'Kwik Manual' smoke34/kwik-manual.xml
            grep -q 'Test Kwik' smoke34/kwik-manual.xml
            test -n "$(adb shell pidof com.night.kwikmanual | tr -d '\r')"
            adb exec-out screencap -p > smoke34/kwik-manual.png
      - name: Upload Android 14 smoke
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pahe-diagnostic-smoke-android14
          path: smoke34/**
          if-no-files-found: warn

  smoke-api26:
    name: API 26 smoke
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build for smoke
        working-directory: pahebatcher-android
        run: gradle :diagnostics:assembleDebug :kwik-manual:assembleDebug
      - name: Launch both apps
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 26
          arch: x86_64
          target: google_apis
          emulator-boot-timeout: 900
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            set -eu
            mkdir -p smoke26

            adb install --no-streaming -r pahebatcher-android/diagnostics/build/outputs/apk/debug/diagnostics-debug.apk
            adb shell am start -W -n com.night.pahediagnostics/.MainActivity
            sleep 3
            adb shell uiautomator dump /sdcard/pahe-trace.xml >/dev/null
            adb pull /sdcard/pahe-trace.xml smoke26/pahe-trace.xml >/dev/null
            grep -q 'Pahe Trace' smoke26/pahe-trace.xml
            test -n "$(adb shell pidof com.night.pahediagnostics | tr -d '\r')"

            adb install --no-streaming -r pahebatcher-android/kwik-manual/build/outputs/apk/debug/kwik-manual-debug.apk
            adb shell am start -W -n com.night.kwikmanual/.MainActivity
            sleep 3
            adb shell uiautomator dump /sdcard/kwik-manual.xml >/dev/null
            adb pull /sdcard/kwik-manual.xml smoke26/kwik-manual.xml >/dev/null
            grep -q 'Kwik Manual' smoke26/kwik-manual.xml
            test -n "$(adb shell pidof com.night.kwikmanual | tr -d '\r')"
      - name: Upload API 26 smoke
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pahe-diagnostic-smoke-api26
          path: smoke26/**
          if-no-files-found: warn
