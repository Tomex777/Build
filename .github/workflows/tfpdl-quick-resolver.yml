name: TFPDL quick resolver probe

on:
  pull_request:
    branches: [main]
  push:
    paths:
      - '.github/workflows/tfpdl-quick-resolver.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Probe wrapper redirects
        shell: bash
        run: |
          python3 - <<'PY'
          import json,re,html,urllib.request,urllib.error
          from urllib.parse import quote,urljoin
          from pathlib import Path

          UA={'User-Agent':'Mozilla/5.0 (Linux; Android 16; SM-A165F) AppleWebKit/537.36 Chrome/140 Mobile Safari/537.36'}

          def get(url, headers=None):
              h=dict(UA); h.update(headers or {})
              req=urllib.request.Request(url,headers=h)
              try:
                  with urllib.request.urlopen(req,timeout=25) as r:
                      return r.status,r.geturl(),dict(r.headers),r.read(300000)
              except urllib.error.HTTPError as e:
                  return e.code,e.geturl(),dict(e.headers),e.read(300000)
              except Exception as e:
                  return 0,url,{},str(e).encode()

          api='https://tfpdl.com/wp-json/wp/v2/posts?search='+quote('Farming Life in Another World')+'&per_page=5&_fields=id,link,title,content'
          st,final,h,b=get(api)
          out=['API %s %s'%(st,final)]
          posts=json.loads(b)
          picked=None; wrapper=None
          for p in posts:
              c=html.unescape(p.get('content',{}).get('rendered',''))
              m=re.search(r'href=["\']([^"\']+/tfpdl\?[^"\']+)["\']',c,re.I)
              if m:
                  picked=p; wrapper=urljoin(p.get('link','https://tfpdl.com/'),m.group(1)); break
          out += ['POST_ID '+str(picked['id']),'POST '+picked['link'],'TITLE '+html.unescape(picked['title']['rendered']),'WRAPPER '+wrapper]

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          opener=urllib.request.build_opener(NoRedirect)

          def onehop(url,ref):
              req=urllib.request.Request(url,headers={**UA,'Referer':ref,'Accept':'text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8'})
              try:
                  r=opener.open(req,timeout=25)
                  body=r.read(300000); return r.status,r.geturl(),dict(r.headers),body
              except urllib.error.HTTPError as e:
                  return e.code,e.geturl(),dict(e.headers),e.read(300000)
              except Exception as e:
                  return 0,url,{},str(e).encode()

          current=wrapper; ref=picked['link']
          for i in range(6):
              st,u,hd,body=onehop(current,ref)
              loc=hd.get('Location') or hd.get('location')
              ct=hd.get('Content-Type') or hd.get('content-type')
              out += [f'HOP {i} status={st} url={u} content-type={ct} location={loc} bytes={len(body)}']
              txt=body.decode('utf-8','ignore')
              out += ['BODY '+re.sub(r'\s+',' ',txt[:2500])]
              if not loc: break
              ref=current
              current=urljoin(current,loc)

          Path('diagnostics').mkdir(exist_ok=True)
          Path('diagnostics/live-tfpdl-http.txt').write_text('\n'.join(out),encoding='utf-8')
          print('\n'.join(out))
          PY
      - name: Commit result
        if: always()
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add diagnostics/live-tfpdl-http.txt 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "record TFPDL quick resolver result"
            git push
          fi
