name: Annie Icon Preview
on:
  push:
    branches: [annie-android-ci]
    paths:
      - 'annie-android/design/icon/**'
      - '.github/workflows/annie-icon-preview.yml'
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SVG renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin imagemagick
      - name: Render Annie icon concepts
        run: |
          set -euo pipefail
          mkdir -p /tmp/annie-icon
          for svg in annie-android/design/icon/concept-*.svg; do
            name="$(basename "$svg" .svg)"
            rsvg-convert -w 1024 -h 1024 "$svg" -o "/tmp/annie-icon/$name.png"
            rsvg-convert -w 96 -h 96 "$svg" -o "/tmp/annie-icon/$name-96.png"
          done
          montage /tmp/annie-icon/concept-a-prompt-cut.png                   /tmp/annie-icon/concept-b-prompt-core.png                   /tmp/annie-icon/concept-c-command-crossbar.png                   /tmp/annie-icon/concept-d-ribbon-prompt.png                   -thumbnail 420x420 -tile 2x2 -geometry +36+58                   -background '#05080D' -fill '#E7EEF8'                   -label '%t' /tmp/annie-icon/contact-sheet.png
          montage /tmp/annie-icon/concept-a-prompt-cut-96.png                   /tmp/annie-icon/concept-b-prompt-core-96.png                   /tmp/annie-icon/concept-c-command-crossbar-96.png                   /tmp/annie-icon/concept-d-ribbon-prompt-96.png                   -tile 4x1 -geometry +24+24 -background '#05080D'                   /tmp/annie-icon/small-size-check.png
      - uses: actions/upload-artifact@v4
        with:
          name: annie-icon-previews
          path: /tmp/annie-icon
          if-no-files-found: error
