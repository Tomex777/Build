name: Secure Rendering Lab APK

on:
  push:
    branches:
      - secure-rendering-lab
    paths:
      - "secure-rendering-lab/**"
      - ".github/workflows/secure-rendering-lab.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36
        run: yes | sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build debug APK
        working-directory: secure-rendering-lab
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: secure-rendering-lab-debug
          path: secure-rendering-lab/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
