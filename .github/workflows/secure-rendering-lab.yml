name: Secure Rendering Lab APK

on:
  push:
    branches:
      - secure-rendering-lab
    paths:
      - "secure-rendering-lab/**"
      - ".github/workflows/secure-rendering-lab.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android 36
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager"
          fi
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build debug APK
        working-directory: secure-rendering-lab
        run: gradle :app:assembleDebug :systemlab:assembleDebug :systemlab:assembleRelease --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: secure-rendering-lab-debug
          path: secure-rendering-lab/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload system-lab sanity APK
        uses: actions/upload-artifact@v4
        with:
          name: secure-rendering-system-lab-sanity
          path: secure-rendering-lab/systemlab/build/outputs/apk/debug/systemlab-debug.apk
          if-no-files-found: error

      - name: Build platform-signed Cuttlefish bundle
        shell: bash
        run: |
          set -euo pipefail

          KEY_URL="https://android.googlesource.com/platform/build/+/refs/heads/android16-release/target/product/security"
          mkdir -p /tmp/aosp-platform-key
          curl -fsSL "$KEY_URL/platform.pk8?format=TEXT" | base64 -d > /tmp/aosp-platform-key/platform.pk8
          curl -fsSL "$KEY_URL/platform.x509.pem?format=TEXT" | base64 -d > /tmp/aosp-platform-key/platform.x509.pem

          BUNDLE="$GITHUB_WORKSPACE/secure-rendering-system-lab-fast-cuttlefish"
          mkdir -p "$BUNDLE"

          APKSIGNER="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}/build-tools/35.0.0/apksigner"
          UNSIGNED="$GITHUB_WORKSPACE/secure-rendering-lab/systemlab/build/outputs/apk/release/systemlab-release-unsigned.apk"

          "$APKSIGNER" sign \
            --key /tmp/aosp-platform-key/platform.pk8 \
            --cert /tmp/aosp-platform-key/platform.x509.pem \
            --out "$BUNDLE/SecureRenderingSystemLab-platform.apk" \
            "$UNSIGNED"

          "$APKSIGNER" verify --verbose --print-certs "$BUNDLE/SecureRenderingSystemLab-platform.apk"

          cp secure-rendering-lab/aosp-system-lab/privapp-permissions-com.tomex.securerenderlab.system.xml "$BUNDLE/"
          cp secure-rendering-lab/aosp-system-lab/fast-cuttlefish/install.sh "$BUNDLE/"
          cp secure-rendering-lab/aosp-system-lab/fast-cuttlefish/verify.sh "$BUNDLE/"
          cp secure-rendering-lab/aosp-system-lab/fast-cuttlefish/README.md "$BUNDLE/"
          chmod +x "$BUNDLE/install.sh" "$BUNDLE/verify.sh"

          zip -qr secure-rendering-system-lab-fast-cuttlefish.zip secure-rendering-system-lab-fast-cuttlefish

      - name: Upload fast Cuttlefish bundle
        uses: actions/upload-artifact@v4
        with:
          name: secure-rendering-system-lab-fast-cuttlefish
          path: secure-rendering-system-lab-fast-cuttlefish.zip
          if-no-files-found: error

      - name: Package AOSP System Lab source
        run: tar -czf secure-rendering-system-lab-aosp-source.tar.gz -C secure-rendering-lab aosp-system-lab

      - name: Upload AOSP System Lab source
        uses: actions/upload-artifact@v4
        with:
          name: secure-rendering-system-lab-aosp-source
          path: secure-rendering-system-lab-aosp-source.tar.gz
          if-no-files-found: error


  privileged-emulator-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download platform-signed bundle
        uses: actions/download-artifact@v4
        with:
          name: secure-rendering-system-lab-fast-cuttlefish
          path: fast-bundle

      - name: Install Android emulator image
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager"
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER"             "platform-tools"             "emulator"             "system-images;android-36;default;x86_64"

          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/emulator" >> "$GITHUB_PATH"

          echo "no" | "$SDK_ROOT/cmdline-tools/latest/bin/avdmanager" create avd             --force             --name securelab             --package "system-images;android-36;default;x86_64"

      - name: Enable KVM access
        shell: bash
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
            ls -l /dev/kvm
          else
            echo "/dev/kvm is unavailable; emulator will fall back to software acceleration."
          fi

      - name: Boot writable AOSP emulator
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          nohup "$SDK_ROOT/emulator/emulator" @securelab             -no-window             -no-audio             -no-snapshot             -no-boot-anim             -gpu swiftshader_indirect             -writable-system             > emulator.log 2>&1 &

          if ! timeout 120 adb wait-for-device; then
            echo "ADB device did not appear. Emulator log:"
            cat emulator.log || true
            exit 11
          fi

          if ! timeout 420 bash -c 'until [[ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" == "1" ]]; do sleep 5; done'; then
            echo "Android did not finish booting. Emulator log:"
            tail -300 emulator.log || true
            adb shell getprop || true
            exit 12
          fi

          echo "Build type: $(adb shell getprop ro.build.type | tr -d "\r")"
          echo "Debuggable: $(adb shell getprop ro.debuggable | tr -d "\r")"
          adb shell getprop ro.build.fingerprint

      - name: Install as platform privileged app
        shell: bash
        run: |
          set -euo pipefail

          unzip -q fast-bundle/secure-rendering-system-lab-fast-cuttlefish.zip -d fast-bundle/payload
          BUNDLE="$GITHUB_WORKSPACE/fast-bundle/payload/secure-rendering-system-lab-fast-cuttlefish"

          DEBUGGABLE="$(adb shell getprop ro.debuggable | tr -d "\r")"
          if [[ "$DEBUGGABLE" != "1" ]]; then
            echo "Expected a debuggable AOSP image, got ro.debuggable=$DEBUGGABLE" >&2
            exit 10
          fi

          adb root
          adb wait-for-device

          set +e
          REMOUNT_OUTPUT="$(adb remount 2>&1)"
          REMOUNT_STATUS=$?
          set -e
          printf '%s\n' "$REMOUNT_OUTPUT"

          NEED_REBOOT=0
          if [[ $REMOUNT_STATUS -ne 0 ]] || grep -qi "reboot" <<<"$REMOUNT_OUTPUT"; then
            NEED_REBOOT=1
          fi

          if ! adb shell 'touch /system_ext/.securelab-write-test 2>/dev/null && rm -f /system_ext/.securelab-write-test'; then
            NEED_REBOOT=1
          fi

          if [[ $NEED_REBOOT -eq 1 ]]; then
            adb disable-verity || true
            adb reboot
            adb wait-for-device
            timeout 300 bash -c 'until [[ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" == "1" ]]; do sleep 5; done'
            adb root
            adb wait-for-device
            adb remount
          fi

          adb shell 'touch /system_ext/.securelab-write-test && rm -f /system_ext/.securelab-write-test'

          adb shell mkdir -p /system_ext/priv-app/SecureRenderingSystemLab
          adb shell mkdir -p /system_ext/etc/permissions

          adb push "$BUNDLE/SecureRenderingSystemLab-platform.apk"             /system_ext/priv-app/SecureRenderingSystemLab/SecureRenderingSystemLab.apk
          adb push "$BUNDLE/privapp-permissions-com.tomex.securerenderlab.system.xml"             /system_ext/etc/permissions/privapp-permissions-com.tomex.securerenderlab.system.xml

          adb shell chmod 0644 /system_ext/priv-app/SecureRenderingSystemLab/SecureRenderingSystemLab.apk
          adb shell chmod 0644 /system_ext/etc/permissions/privapp-permissions-com.tomex.securerenderlab.system.xml
          adb shell restorecon -RF /system_ext/priv-app/SecureRenderingSystemLab || true
          adb shell restorecon -F /system_ext/etc/permissions/privapp-permissions-com.tomex.securerenderlab.system.xml || true

          adb reboot
          adb wait-for-device
          timeout 300 bash -c 'until [[ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" == "1" ]]; do sleep 5; done'

      - name: Verify privileged secure-display capability
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Package path ==="
          adb shell pm path com.tomex.securerenderlab.system

          echo "=== Package permissions ==="
          adb shell dumpsys package com.tomex.securerenderlab.system | grep -E             "CAPTURE_SECURE_VIDEO_OUTPUT|CAPTURE_VIDEO_OUTPUT|CAPTURE_BLACKOUT_CONTENT|READ_FRAME_BUFFER|pkgFlags|privateFlags" || true

          adb logcat -c
          adb shell am start             -n com.tomex.securerenderlab.system/.SystemLabActivity             --ez autorun true

          sleep 6
          adb logcat -d -s SecureRenderingLabSys:I '*:S' | tee secure-rendering-system-lab.log

          grep -q 'CAPABILITIES|.*platformSigned=true.*secureVideo=GRANTED' secure-rendering-system-lab.log
          grep -q 'CREATE|SUCCESS' secure-rendering-system-lab.log

      - name: Upload emulator verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secure-rendering-system-lab-emulator-log
          path: |
            secure-rendering-system-lab.log
            emulator.log
          if-no-files-found: warn
