name: TFPDL SafeTxt static inspect

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tfpdl-safetxt-static.yml'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Inspect SafeTxt
        shell: bash
        run: |
          mkdir -p diagnostics
          cat > /tmp/safetxt.cjs <<'JS'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const target = 'https://safetxt.net/mrGyDpt5a6eHFrJ51KNZsyQrjVzbZ0dHfiiXsVrcoPriHtF90SLcEr5LJr1IM1ewMVcHi';
          const out = { target, startedAt:new Date().toISOString(), events:[], snapshots:[] };
          const save = () => fs.writeFileSync('diagnostics/tfpdl-safetxt-static-result.json', JSON.stringify(out,null,2));
          (async()=>{
            let browser;
            try {
              browser=await chromium.launch({headless:true});
              const context=await browser.newContext({
                userAgent:'Mozilla/5.0 (Linux; Android 16; SM-A165F) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Mobile Safari/537.36',
                viewport:{width:412,height:915},isMobile:true,hasTouch:true,deviceScaleFactor:1,locale:'en-US'
              });
              const page=await context.newPage();
              page.setDefaultTimeout(15000);

              page.on('request',r=>{
                if(/safetxt\.net/i.test(r.url()) && ['document','xhr','fetch','script'].includes(r.resourceType())){
                  out.events.push({type:'request',method:r.method(),rt:r.resourceType(),url:r.url(),postData:r.postData()||null});
                }
              });
              page.on('response',async r=>{
                if(/safetxt\.net/i.test(r.url()) && ['document','xhr','fetch','script'].includes(r.request().resourceType())){
                  const h=await r.allHeaders().catch(()=>({}));
                  out.events.push({type:'response',status:r.status(),rt:r.request().resourceType(),url:r.url(),location:h.location||null,contentType:h['content-type']||null});
                }
              });
              page.on('framenavigated',f=>{if(f===page.mainFrame())out.events.push({type:'nav',url:f.url()});});

              async function snap(label){
                const d=await page.evaluate(()=>({
                  url:location.href,
                  title:document.title,
                  text:(document.body?.innerText||'').slice(0,12000),
                  forms:[...document.forms].map(f=>({
                    action:f.action,method:(f.method||'get').toLowerCase(),id:f.id||null,
                    outer:f.outerHTML.slice(0,25000),
                    fields:[...f.querySelectorAll('input,button,textarea,select')].map(x=>({
                      tag:x.tagName,type:x.getAttribute('type'),name:x.getAttribute('name'),
                      value:x.getAttribute('value'),id:x.id||null,
                      placeholder:x.getAttribute('placeholder'),
                      visible:!!(x.offsetWidth||x.offsetHeight||x.getClientRects().length),
                      text:(x.textContent||'').trim(),
                      outer:x.outerHTML.slice(0,1500)
                    }))
                  })),
                  visibleInputs:[...document.querySelectorAll('input')].filter(x=>!!(x.offsetWidth||x.offsetHeight||x.getClientRects().length)).map(x=>({
                    type:x.getAttribute('type'),name:x.getAttribute('name'),value:x.getAttribute('value'),
                    id:x.id||null,placeholder:x.getAttribute('placeholder'),outer:x.outerHTML.slice(0,1500)
                  })),
                  links:[...document.querySelectorAll('a')].map(a=>({
                    text:(a.textContent||'').trim(),href:a.href,visible:!!(a.offsetWidth||a.offsetHeight||a.getClientRects().length)
                  })).filter(x=>x.href).slice(0,300),
                  scripts:[...document.scripts].map(s=>s.src).filter(Boolean),
                  inline:[...document.scripts].filter(s=>!s.src).map(s=>s.textContent||'')
                    .filter(x=>/captcha|verify|verification|number|code|token|submit|download|ajax|password|secret|answer/i.test(x))
                    .map(x=>x.slice(0,30000))
                }));
                out.snapshots.push({label,...d});
                save();
              }

              await page.goto(target,{waitUntil:'domcontentloaded',timeout:45000}).catch(e=>out.events.push({type:'goto_error',message:e.message}));
              await page.waitForTimeout(2500);
              await snap('entry');
              await page.waitForTimeout(7000);
              await snap('after-7s');
              out.finishedAt=new Date().toISOString();
            } catch(e) {
              out.error={message:e.message,stack:e.stack};
            } finally {
              try { if(browser) await browser.close(); } catch {}
              save();
            }
          })();
          JS
          node /tmp/safetxt.cjs
      - name: Commit result
        if: always()
        run: |
          test -f diagnostics/tfpdl-safetxt-static-result.json || echo '{"error":"no result"}' > diagnostics/tfpdl-safetxt-static-result.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add diagnostics/tfpdl-safetxt-static-result.json
          git commit -m "record SafeTxt static inspection" || true
          git push || true
