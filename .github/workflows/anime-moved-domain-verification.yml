name: Anime moved-domain verification

on:
  push:
    branches: [anime-e2e-continuation-20260930]
    paths:
      - '.github/workflows/anime-moved-domain-verification.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        include:
          - { id: anigo, url: "https://anigo.su/", query: "One Piece" }
          - { id: xprime, url: "https://xprime.stream/", query: "One Piece" }

    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null
          mkdir -p proof

      - name: Verify migrated site to player
        env:
          SOURCE_ID: ${{ matrix.id }}
          TARGET_URL: ${{ matrix.url }}
          QUERY: ${{ matrix.query }}
        shell: bash
        run: |
          cat > moved.mjs <<'NODE'
          import { chromium } from 'playwright';
          import fs from 'node:fs';

          const id=process.env.SOURCE_ID, target=process.env.TARGET_URL, query=process.env.QUERY;
          const browser=await chromium.launch({headless:true,args:['--autoplay-policy=no-user-gesture-required','--disable-blink-features=AutomationControlled']});
          const ctx=await browser.newContext({
            ignoreHTTPSErrors:true,
            viewport:{width:1280,height:850},
            userAgent:'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/153.0.0.0 Safari/537.36'
          });
          const page=await ctx.newPage();
          const rec={id,target,query,media:[],actions:[]};

          page.on('response',async r=>{
            try{
              const h=await r.allHeaders(),ct=h['content-type']||'';
              if(/\.(?:m3u8|mpd|mp4|m4s|ts)(?:$|\?)/i.test(r.url())||/mpegurl|dash\+xml|video\//i.test(ct)){
                rec.media.push({url:r.url(),status:r.status(),contentType:ct});
              }
            }catch{}
          });

          async function search(){
            const sels=['input[type=search]','input[placeholder*="search" i]','input[aria-label*="search" i]','input[name*=search i]','input[name=q]'];
            for(const s of sels){
              const el=page.locator(s).first();
              if(await el.count()) try{
                await el.fill(query,{timeout:2500});
                await el.press('Enter');
                await page.waitForTimeout(3500);
                return {ok:true,method:s};
              }catch{}
            }
            const origin=new URL(page.url()).origin;
            for(const p of ['/search?q='+encodeURIComponent(query),'/search?keyword='+encodeURIComponent(query),'/browser?search='+encodeURIComponent(query)]){
              try{
                await page.goto(origin+p,{waitUntil:'domcontentloaded',timeout:30000});
                await page.waitForTimeout(2500);
                if(/one piece/i.test(await page.locator('body').innerText().catch(()=>''))) return {ok:true,method:p};
              }catch{}
            }
            return {ok:false};
          }

          async function kick(){
            for(let round=0;round<5;round++){
              for(const f of page.frames()){
                try{
                  const v=f.locator('video').first();
                  if(await v.count()) await v.evaluate(el=>{el.muted=true;el.play().catch(()=>{});});
                  const b=f.locator('button[aria-label*="play" i],button[title*="play" i],.jw-icon-playback,.vjs-big-play-button,[class*="play" i]').first();
                  if(await b.count()) try{await b.click({timeout:900})}catch{}
                }catch{}
              }
              await page.waitForTimeout(1800);
            }
          }

          try{
            const nav=await page.goto(target,{waitUntil:'domcontentloaded',timeout:55000});
            await page.waitForTimeout(4000);
            rec.status=nav?.status()??null;
            rec.finalUrl=page.url();
            rec.title=await page.title();
            rec.search=await search();

            const result=await page.locator('a[href]').evaluateAll(xs=>{
              const a=xs.find(a=>/one piece/i.test((a.innerText||'')+' '+a.href));
              return a?{text:(a.innerText||'').trim(),href:a.href}:null;
            });
            rec.result=result;
            if(result?.href){
              await page.goto(result.href,{waitUntil:'domcontentloaded',timeout:45000});
              await page.waitForTimeout(3500);
              rec.detailUrl=page.url();
              const ep=await page.locator('a[href]').evaluateAll(xs=>{
                const a=xs.find(a=>/episode\s*1\b|\/watch\//i.test((a.innerText||'')+' '+a.href));
                return a?.href||null;
              });
              rec.episodeHref=ep;
              if(ep){await page.goto(ep,{waitUntil:'domcontentloaded',timeout:45000});await page.waitForTimeout(3500);}
            }

            const watch=page.getByText(/watch|play/i).first();
            if(await watch.count()) try{await watch.click({timeout:1800});await page.waitForTimeout(2500);rec.actions.push('clicked-watch')}catch{}

            await kick();
            rec.samples=[];
            for(let i=0;i<6;i++){
              await page.waitForTimeout(2500);
              const frames=[];
              for(const f of page.frames()){
                try{
                  frames.push(await f.evaluate(()=>({
                    url:location.href,
                    videos:[...document.querySelectorAll('video')].map(v=>({
                      currentTime:v.currentTime,duration:Number.isFinite(v.duration)?v.duration:null,
                      readyState:v.readyState,width:v.videoWidth,height:v.videoHeight,error:v.error?.code||null
                    }))
                  })));
                }catch{}
              }
              rec.samples.push(frames);
            }
            let max=0,dur=0,ready=false;
            for(const s of rec.samples) for(const f of s) for(const v of f.videos||[]){
              max=Math.max(max,Number(v.currentTime)||0);
              dur=Math.max(dur,Number(v.duration)||0);
              if(v.readyState>=2&&v.width>0&&v.height>0)ready=true;
            }
            rec.player={maxCurrentTime:max,maxDuration:dur,ready,advanced:max>=1,frameCount:page.frames().length};
            rec.media=[...new Map(rec.media.map(x=>[x.url,x])).values()];
            rec.pass=Boolean(rec.player.advanced||rec.media.some(x=>[200,206].includes(x.status)));
            rec.verdict=rec.pass?'MIGRATION_ACTIVE':rec.player.frameCount>1?'EMBED_PRESENT':'NO_PLAYER_PROOF';
          }catch(e){rec.error=String(e);rec.pass=false;rec.verdict='ERROR'}

          fs.writeFileSync('proof/result.json',JSON.stringify(rec,null,2));
          console.log(JSON.stringify({
            id:rec.id,status:rec.status,finalUrl:rec.finalUrl,title:rec.title,search:rec.search,
            result:rec.result,episodeHref:rec.episodeHref,player:rec.player,
            mediaCount:rec.media?.length||0,pass:rec.pass,verdict:rec.verdict,error:rec.error||null
          },null,2));
          await browser.close();
          NODE
          node moved.mjs

      - name: Upload proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anime-moved-domain-${{ matrix.id }}
          path: proof/result.json
          if-no-files-found: error
