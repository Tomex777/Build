name: Slumber Keyboard History Audit

on:
  push:
    branches: ["slumber-087-build"]
    paths:
      - ".github/workflows/slumber-keyboard-history-audit.yml"
      - ".github/scripts/capture-slumber-keyboard-history.sh"
      - ".ci/slumber_payload_041_final/**"
      - ".ci/slumber_patch_042.diff"
      - ".ci/slumber_payload_050/**"
      - ".ci/slumber_070_overlay/**"
      - ".ci/slumber_085_final_scope/**"
      - ".ci/slumber_086_production_merge/**"

permissions:
  actions: read
  contents: read

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct Slumber 0.7.0 from verified historical source
        shell: bash
        run: |
          set -euo pipefail
          OUT=/tmp/slumber-070
          mkdir -p "$OUT"
          cat .ci/slumber_payload_041_final/part01.txt \
              .ci/slumber_payload_041_final/part02.txt \
              .ci/slumber_payload_041_final/part03.txt \
              .ci/slumber_payload_041_final/part04a.txt \
              .ci/slumber_payload_041_final/part04b00.txt \
              .ci/slumber_payload_041_final/part04b01.txt \
              .ci/slumber_payload_041_final/part04b02.txt \
              .ci/slumber_payload_041_final/part04b03a.txt \
              .ci/slumber_payload_041_final/part04b03b.txt \
              .ci/slumber_payload_041_final/part04b03c.txt \
              .ci/slumber_payload_041_final/part04b04.txt \
              .ci/slumber_payload_041_final/part05.txt \
              .ci/slumber_payload_041_final/part06.txt \
              .ci/slumber_payload_041_final/part07.txt \
              .ci/slumber_payload_041_final/part08.txt \
              | tr -d '\n' | base64 --decode > "$OUT/base.tgz"
          echo '0ed8c8e3cecaabc912d3555ad5942576501e35f983d9f7769cc10d131b2194db  /tmp/slumber-070/base.tgz' | sha256sum -c -
          tar -xzf "$OUT/base.tgz" -C "$OUT"
          echo '8c01b09e8fd76f95560f9149498c065950f7cbf7c90eb3e25750d3253ad7671d  .ci/slumber_patch_042.diff' | sha256sum -c -
          patch -d "$OUT" -p1 < .ci/slumber_patch_042.diff
          cat .ci/slumber_payload_050/part00.txt .ci/slumber_payload_050/part01.txt \
              .ci/slumber_payload_050/part02.txt .ci/slumber_payload_050/part03.txt \
              | tr -d '\n' | base64 --decode > "$OUT/delta050.tgz"
          echo 'b8119d9bd76afd30a6675b8a90ce4a19d54cc9278212707d8e285179912462be  /tmp/slumber-070/delta050.tgz' | sha256sum -c -
          tar -xzf "$OUT/delta050.tgz" -C "$OUT"
          cat .ci/slumber_070_overlay/part00.txt .ci/slumber_070_overlay/part01.txt \
              .ci/slumber_070_overlay/part02.txt .ci/slumber_070_overlay/part03.txt \
              .ci/slumber_070_overlay/part04.txt .ci/slumber_070_overlay/part05.txt \
              | tr -d '\n' | base64 --decode > "$OUT/overlay070.tgz"
          echo '9ea02dfa49748f9d259fe3dbbff18a47cd25f4b32e8db0c87c84bf700fd5142c  /tmp/slumber-070/overlay070.tgz' | sha256sum -c -
          tar -xzf "$OUT/overlay070.tgz" -C "$OUT"
          grep -q 'versionName = "0.7.0"' "$OUT/app/build.gradle.kts"
          grep -q 'DEFAULT_C4_TO_C7_VIEWPORT' "$OUT/app/src/main/java/com/night/pianohub/ui/components/PianoKeyboard.kt"
          PIANO="$OUT/app/src/main/java/com/night/pianohub/ui/screens/PianoScreen.kt"
          grep -Fxq 'import androidx.compose.foundation.layout.weight' "$PIANO"
          sed -i '/^import androidx\.compose\.foundation\.layout\.weight$/d' "$PIANO"
          ! grep -Fxq 'import androidx.compose.foundation.layout.weight' "$PIANO"

      - name: Restore and reconstruct Slumber 0.8.6 comparison build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BASE=/tmp/slumber-085-base
          OUT=/tmp/slumber-086
          mkdir -p "$BASE" "$OUT"
          gh run download 34645245543 --repo Tomex777/Build --name slumber-0.8.5-exit-recreation --dir "$BASE"
          SRC=$(find "$BASE" -name 'slumber-production-0.8.5-source.tgz' -type f -print -quit)
          test -n "$SRC"
          tar -xzf "$SRC" -C "$OUT"
          cat .ci/slumber_085_final_scope/final.patch.gz.b64.part00 \
              .ci/slumber_085_final_scope/final.patch.gz.b64.part01 \
              .ci/slumber_085_final_scope/final.patch.gz.b64.part02 \
              .ci/slumber_085_final_scope/final.patch.gz.b64.part03a \
              .ci/slumber_085_final_scope/final.patch.gz.b64.part03b \
              .ci/slumber_085_final_scope/final.patch.gz.b64.part04 \
              .ci/slumber_085_final_scope/final.patch.gz.b64.part05 \
              .ci/slumber_085_final_scope/final.patch.gz.b64.part06 > "$OUT/final085.b64"
          echo '8133f27d9d76d002967f1c53d0a0b27cf89eec9f31cb24ff2188e70951ec504b  /tmp/slumber-086/final085.b64' | sha256sum -c -
          base64 -d "$OUT/final085.b64" | gzip -dc > "$OUT/final085.patch"
          echo '42b4f12ec7496c52712154594c31ca39bfe8f43addc7edaab84acefa37c23fa1  /tmp/slumber-086/final085.patch' | sha256sum -c -
          patch -d "$OUT" -p1 < "$OUT/final085.patch"
          cat .ci/slumber_086_production_merge/production_merge.patch.gz.b64.part* > "$OUT/merge086.b64"
          base64 -d "$OUT/merge086.b64" > "$OUT/merge086.gz"
          echo '4907d3d93f76b970dab78e40a56ae68ae139a9a60725a7c66fe7dc9b12ac28fe  /tmp/slumber-086/merge086.gz' | sha256sum -c -
          gzip -dc "$OUT/merge086.gz" > "$OUT/merge086.patch"
          echo 'de599aad03175f399fa77e23054ab640d9fbb9d037df71f7aff89bb5fd988924  /tmp/slumber-086/merge086.patch' | sha256sum -c -
          patch -d "$OUT" -p1 < "$OUT/merge086.patch"
          grep -q 'versionName = "0.8.6"' "$OUT/app/build.gradle.kts"
          grep -q 'minSdk = 26' "$OUT/app/build.gradle.kts"

      - name: Download verified 0.7.1 and early 0.8.x comparison APKs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ROOT=/tmp/slumber-history-apks
          mkdir -p "$ROOT"
          fetch_apk() {
            run_id="$1"; artifact="$2"; apk_name="$3"; label="$4"
            dir="$ROOT/$label"
            mkdir -p "$dir"
            gh run download "$run_id" --repo Tomex777/Build --name "$artifact" --dir "$dir"
            source_apk=$(find "$dir" -name "$apk_name" -type f -print -quit)
            test -n "$source_apk"
            cp "$source_apk" "$ROOT/$label.apk"
            test -s "$ROOT/$label.apk"
          }
          fetch_apk 34570923649 slumber-0.7.1-two-fixes Slumber-0.7.1-debug.apk 071
          fetch_apk 34572806431 slumber-0.8.0-full-cleanup Slumber-0.8.0-debug.apk 080
          fetch_apk 34632258957 slumber-0.8.1-final-runtime-build Slumber-0.8.1-debug.apk 081
          fetch_apk 34638954405 slumber-0.8.2-landscape-sheets Slumber-0.8.2-debug.apk 082
          fetch_apk 34640084077 slumber-0.8.3-version-and-sheets Slumber-0.8.3-debug.apk 083
          fetch_apk 34643086996 slumber-0.8.4-scrollable-sheets Slumber-0.8.4-debug.apk 084
          fetch_apk 34645245543 slumber-0.8.5-exit-recreation Slumber-0.8.5-debug.apk 085

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Install Android compile SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --channel=3 "platforms;android-37.0" "build-tools;37.0.0"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

      - name: Test and build both historical comparison APKs
        shell: bash
        run: |
          set -euo pipefail
          gradle -p /tmp/slumber-070 --stacktrace testDebugUnitTest assembleDebug
          gradle -p /tmp/slumber-086 --stacktrace testDebugUnitTest assembleDebug

      - name: Enable KVM for Android emulator
        shell: bash
        run: |
          set -euo pipefail
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm

      - name: Capture both piano screens on Android 36
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ANDROID_EMULATOR_WAIT_TIME_BEFORE_KILL: 1
        with:
          api-level: 36
          arch: x86_64
          target: default
          profile: pixel_6
          cores: 2
          emulator-boot-timeout: 360
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot-save -no-metrics
          script: bash .github/scripts/capture-slumber-keyboard-history.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: slumber-keyboard-history-audit
          path: /tmp/slumber-keyboard-audit/*
          if-no-files-found: warn
