name: Sora Android CI

on:
  workflow_dispatch:
  push:
    branches: [sora-android-ci]
    paths:
      - 'sora-ci/v04-build-trigger.txt'

jobs:
  core-without-extension:
    name: Core APK (extensions removed)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct committed Sora source
        run: |
          rm -rf /tmp/sora-src /tmp/sora-core /tmp/sora.zip
          cat sora-ci/chunks/part-*.txt | base64 -d > /tmp/sora.zip
          unzip -q /tmp/sora.zip -d /tmp/sora-src
          ROOT=/tmp/sora-src/Sora_Android_v0_1
          test -f "$ROOT/settings.gradle.kts"
          cp -R sora-overlay/. "$ROOT/"
          ! grep -E "Extension API v1|Files & screenshots|Open Media|Most Likely To|Who Knows Me Best" \
            "$ROOT/app/src/main/java/com/night/sora/ui/screens/HomeScreen.kt" \
            "$ROOT/app/src/main/java/com/night/sora/ui/screens/LibraryScreen.kt" \
            "$ROOT/app/src/main/java/com/night/sora/ui/screens/GamesScreen.kt"
          grep -q 'Top 10' "$ROOT/app/src/main/java/com/night/sora/ui/screens/MediaScreen.kt"
          grep -q 'Generated images' "$ROOT/app/src/main/java/com/night/sora/ui/screens/AiScreen.kt"
          grep -q 'Files' "$ROOT/app/src/main/java/com/night/sora/ui/screens/AiScreen.kt"
          grep -q 'Daily 5' "$ROOT/app/src/main/java/com/night/sora/ui/screens/GamesScreen.kt"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android 36 SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Make isolated Core copy
        run: |
          cp -R /tmp/sora-src/Sora_Android_v0_1 /tmp/sora-core
          rm -rf /tmp/sora-core/test-extension /tmp/sora-core/live-extension
          sed -i '/include(":test-extension")/d' /tmp/sora-core/settings.gradle.kts
          sed -i '/include(":live-extension")/d' /tmp/sora-core/settings.gradle.kts
          test ! -d /tmp/sora-core/test-extension
          test ! -d /tmp/sora-core/live-extension
          ! grep -R "com.night.sora.testextension\|com.night.sora.liveextension\|DemoExtensionService\|LiveExtensionService\|DemoCatalog\|LiveCatalog" /tmp/sora-core/app /tmp/sora-core/extension-api
      - name: Build Sora Core with extension projects absent
        working-directory: /tmp/sora-core
        run: gradle --stacktrace :app:assembleDebug
      - name: Prepare Core artifact
        run: cp /tmp/sora-core/app/build/outputs/apk/debug/app-debug.apk /tmp/Sora-Core-v0.4-html-remake-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: sora-core-v0.4-html-remake-apk
          path: /tmp/Sora-Core-v0.4-html-remake-debug.apk
          if-no-files-found: error
          retention-days: 3

  live-extension:
    name: Live Sources Extension APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct committed Sora source
        run: |
          rm -rf /tmp/sora-src /tmp/sora.zip
          cat sora-ci/chunks/part-*.txt | base64 -d > /tmp/sora.zip
          unzip -q /tmp/sora.zip -d /tmp/sora-src
          ROOT=/tmp/sora-src/Sora_Android_v0_1
          test -f "$ROOT/settings.gradle.kts"
          cp -R sora-overlay/. "$ROOT/"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android 36 SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Build live source extension
        working-directory: /tmp/sora-src/Sora_Android_v0_1
        run: gradle --stacktrace :live-extension:assembleDebug
      - name: Smoke-check public catalog endpoints
        continue-on-error: true
        run: |
          curl -fsSL --retry 2 --max-time 12 'https://api.jikan.moe/v4/top/anime?limit=1' | grep -q '"data"'
          curl -fsSL --retry 2 --max-time 12 'https://api.tvmaze.com/search/shows?q=dark' | grep -q '"show"'
          curl -fsSL --retry 2 --max-time 12 'https://itunes.apple.com/search?term=adele&media=music&entity=song&limit=1&country=US' | grep -q '"resultCount"'
      - name: Prepare live extension artifact
        run: cp /tmp/sora-src/Sora_Android_v0_1/live-extension/build/outputs/apk/debug/live-extension-debug.apk /tmp/Sora-Live-Sources-v0.4-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: sora-live-sources-v0.4-apk
          path: /tmp/Sora-Live-Sources-v0.4-debug.apk
          if-no-files-found: error
          retention-days: 3
