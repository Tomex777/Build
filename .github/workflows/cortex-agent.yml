name: Cortex Agent

on:
  push:
    branches: [cortex-android-live]
    paths:
      - 'cortex-agent/**'
      - '.github/workflows/cortex-agent.yml'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Syntax check
        run: node --check cortex-agent/index.js
      - name: Start Cortex Agent
        shell: bash
        run: |
          mkdir -p /tmp/night/node_modules
          printf 'secret=must-stay-server-side\n' >/tmp/night/.env.production
          printf 'private-key' >/tmp/night/server.pem
          printf 'server-only' >/tmp/night/node_modules/server-only.js
          mkdir -p /tmp/cortex-settings
          printf '{"version":1,"autoCc":false,"replyCc":true,"antiDelete":true}\n' >/tmp/cortex-settings/settings.json
          printf '{"version":1,"service":"mscc","entries":[{"key":"autoCc","label":"Auto CC","description":"Copy V1 automatically","command":"autocc","type":"boolean"}]}\n' >/tmp/cortex-settings/schema.json
          CORTEX_AGENT_TOKEN='test-token-12345678901234567890' \
          NIGHT_ROOT=/tmp/night \
          NIGHT_SERVICE=night.service \
          CORTEX_STATE_DIR=/tmp/cortex-state \
          CORTEX_COMMAND_SETTINGS_FILE=/tmp/cortex-settings/settings.json \
          CORTEX_COMMAND_SETTINGS_SCHEMA_FILE=/tmp/cortex-settings/schema.json \
          HOST=127.0.0.1 \
          PORT=47831 \
          node cortex-agent/index.js >/tmp/cortex-agent.log 2>&1 &
          echo $! >/tmp/cortex-agent.pid
          for i in {1..20}; do
            if curl -fsS -H 'Authorization: Bearer test-token-12345678901234567890' http://127.0.0.1:47831/api/cortex/host/status >/tmp/status.json; then
              exit 0
            fi
            sleep 0.5
          done
          cat /tmp/cortex-agent.log
          exit 1
      - name: Verify authenticated file API
        shell: bash
        run: |
          AUTH='Authorization: Bearer test-token-12345678901234567890'
          curl -fsS -H "$AUTH" -H 'Content-Type: application/json' \
            -d '{"path":"index.js","content":"console.log(\"night\")\n"}' \
            http://127.0.0.1:47831/api/cortex/host/files/content >/tmp/write.json
          curl -fsS -H "$AUTH" 'http://127.0.0.1:47831/api/cortex/host/files/content?path=index.js' >/tmp/read.json
          curl -fsS -H "$AUTH" 'http://127.0.0.1:47831/api/cortex/host/files/raw?path=index.js' >/tmp/index-download.js
          curl -fsS -H "$AUTH" 'http://127.0.0.1:47831/api/cortex/host/files?path=/' >/tmp/list.json
          grep -q 'console.log' /tmp/read.json
          grep -q 'console.log' /tmp/index-download.js
          grep -q 'index.js' /tmp/list.json
          curl -fsS -H "$AUTH" -H 'Content-Type: application/json' \
            -d '{"path":"asset.bin","contentBase64":"AAEC/w=="}' \
            http://127.0.0.1:47831/api/cortex/host/files/binary >/tmp/binary.json
          grep -q 'asset.bin' /tmp/list.json || curl -fsS -H "$AUTH" 'http://127.0.0.1:47831/api/cortex/host/files?path=/' | grep -q 'asset.bin'
      - name: Keep server dependencies off the device workspace
        shell: bash
        run: |
          AUTH='Authorization: Bearer test-token-12345678901234567890'
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "$AUTH" -H 'Content-Type: application/json' \
            -d '{"path":"node_modules/should-not-transfer.js","content":"no"}' \
            http://127.0.0.1:47831/api/cortex/host/files/content)
          test "$code" = '403'
          for protected_path in .env.production server.pem; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -H "$AUTH" -H 'Content-Type: application/json' \
              -d "{\"path\":\"$protected_path\",\"content\":\"no\"}" \
              http://127.0.0.1:47831/api/cortex/host/files/content)
            test "$code" = '403'
          done
          ! curl -fsS -H "$AUTH" 'http://127.0.0.1:47831/api/cortex/host/files?path=/' | grep -Eq 'node_modules|.env.production|server.pem'
      - name: Verify Cortex management operations
        shell: bash
        run: |
          AUTH='Authorization: Bearer test-token-12345678901234567890'
          curl -fsS -H "$AUTH" -H 'Content-Type: application/json'             -d '{"path":"commands"}'             http://127.0.0.1:47831/api/cortex/host/files/directory
          printf 'hello\n' >/tmp/payload.txt
          curl -fsS -H "$AUTH" -H 'Content-Type: application/json'             -d '{"path":"commands/test.js","content":"export default 1\n"}'             http://127.0.0.1:47831/api/cortex/host/files/content
          curl -fsS -H "$AUTH" -H 'Content-Type: application/json'             -d '{"from":"commands/test.js","to":"commands/renamed.js"}'             http://127.0.0.1:47831/api/cortex/host/files/rename
          curl -fsS -H "$AUTH" -H 'Content-Type: application/json'             -d '{"paths":["commands"],"destination":"commands.zip"}'             http://127.0.0.1:47831/api/cortex/host/files/archive
          mkdir -p /tmp/night/extracted
          curl -fsS -H "$AUTH" -H 'Content-Type: application/json'             -d '{"path":"commands.zip","destination":"extracted"}'             http://127.0.0.1:47831/api/cortex/host/files/extract
          test -f /tmp/night/extracted/commands/renamed.js
          curl -fsS -H "$AUTH" http://127.0.0.1:47831/api/cortex/host/startup | grep -q '"runtime":"Node.js"'
          curl -fsS -H "$AUTH" http://127.0.0.1:47831/api/cortex/host/activity?limit=50 | grep -q 'server:file.rename'
      - name: Verify clean project backup excludes server dependencies and secrets
        shell: bash
        run: |
          AUTH='Authorization: Bearer test-token-12345678901234567890'
          curl -fsS -H "$AUTH" -H 'Content-Type: application/json'             -d '{"private":false}'             http://127.0.0.1:47831/api/cortex/host/backups >/tmp/backup.json
          BACKUP=$(python -c 'import json; print(json.load(open("/tmp/backup.json"))["name"])')
          curl -fsS -H "$AUTH" "http://127.0.0.1:47831/api/cortex/host/backups/content?name=$BACKUP" -o /tmp/project.zip
          unzip -l /tmp/project.zip >/tmp/project-list.txt
          grep -q 'index.js' /tmp/project-list.txt
          ! grep -q 'node_modules' /tmp/project-list.txt
          ! grep -q '.env.production' /tmp/project-list.txt
          ! grep -q 'server.pem' /tmp/project-list.txt
          curl -fsS -H "$AUTH" http://127.0.0.1:47831/api/cortex/host/backups | grep -q "$BACKUP"
      - name: Verify command-driven settings contract
        shell: bash
        run: |
          AUTH='Authorization: Bearer test-token-12345678901234567890'
          curl -fsS -H "$AUTH" http://127.0.0.1:47831/api/cortex/host/settings | grep -q '"key":"autoCc"'
          curl -fsS -H "$AUTH" -H 'Content-Type: application/json'             -d '{"key":"autoCc","enabled":true}'             http://127.0.0.1:47831/api/cortex/host/settings | grep -q '"enabled":true'
          grep -q '"autoCc": true' /tmp/cortex-settings/settings.json
      - name: Reject unauthenticated requests
        shell: bash
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:47831/api/cortex/host/status)
          test "$code" = '401'
      - name: Stop Cortex Agent
        if: always()
        run: kill "$(cat /tmp/cortex-agent.pid)" 2>/dev/null || true
