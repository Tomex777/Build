name: Cortex Agent

on:
  push:
    branches: [cortex-android-live]
    paths:
      - 'cortex-agent/**'
      - '.github/workflows/cortex-agent.yml'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Syntax check
        run: node --check cortex-agent/index.js
      - name: Start Cortex Agent
        shell: bash
        run: |
          mkdir -p /tmp/night/node_modules
          printf 'secret=must-stay-server-side\n' >/tmp/night/.env.production
          printf 'private-key' >/tmp/night/server.pem
          printf 'server-only' >/tmp/night/node_modules/server-only.js
          CORTEX_AGENT_TOKEN='test-token-12345678901234567890' \
          NIGHT_ROOT=/tmp/night \
          NIGHT_SERVICE=night.service \
          HOST=127.0.0.1 \
          PORT=47831 \
          node cortex-agent/index.js >/tmp/cortex-agent.log 2>&1 &
          echo $! >/tmp/cortex-agent.pid
          for i in {1..20}; do
            if curl -fsS -H 'Authorization: Bearer test-token-12345678901234567890' http://127.0.0.1:47831/api/cortex/host/status >/tmp/status.json; then
              exit 0
            fi
            sleep 0.5
          done
          cat /tmp/cortex-agent.log
          exit 1
      - name: Verify authenticated file API
        shell: bash
        run: |
          AUTH='Authorization: Bearer test-token-12345678901234567890'
          curl -fsS -H "$AUTH" -H 'Content-Type: application/json' \
            -d '{"path":"index.js","content":"console.log(\"night\")\n"}' \
            http://127.0.0.1:47831/api/cortex/host/files/content >/tmp/write.json
          curl -fsS -H "$AUTH" 'http://127.0.0.1:47831/api/cortex/host/files/content?path=index.js' >/tmp/read.json
          curl -fsS -H "$AUTH" 'http://127.0.0.1:47831/api/cortex/host/files?path=/' >/tmp/list.json
          grep -q 'console.log' /tmp/read.json
          grep -q 'index.js' /tmp/list.json
          curl -fsS -H "$AUTH" -H 'Content-Type: application/json' \
            -d '{"path":"asset.bin","contentBase64":"AAEC/w=="}' \
            http://127.0.0.1:47831/api/cortex/host/files/binary >/tmp/binary.json
          grep -q 'asset.bin' /tmp/list.json || curl -fsS -H "$AUTH" 'http://127.0.0.1:47831/api/cortex/host/files?path=/' | grep -q 'asset.bin'
      - name: Keep server dependencies off the device workspace
        shell: bash
        run: |
          AUTH='Authorization: Bearer test-token-12345678901234567890'
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "$AUTH" -H 'Content-Type: application/json' \
            -d '{"path":"node_modules/should-not-transfer.js","content":"no"}' \
            http://127.0.0.1:47831/api/cortex/host/files/content)
          test "$code" = '403'
          for protected_path in .env.production server.pem; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -H "$AUTH" -H 'Content-Type: application/json' \
              -d "{\"path\":\"$protected_path\",\"content\":\"no\"}" \
              http://127.0.0.1:47831/api/cortex/host/files/content)
            test "$code" = '403'
          done
          ! curl -fsS -H "$AUTH" 'http://127.0.0.1:47831/api/cortex/host/files?path=/' | grep -Eq 'node_modules|.env.production|server.pem'
      - name: Reject unauthenticated requests
        shell: bash
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:47831/api/cortex/host/status)
          test "$code" = '401'
      - name: Stop Cortex Agent
        if: always()
        run: kill "$(cat /tmp/cortex-agent.pid)" 2>/dev/null || true
