name: Cortex Agent

on:
  push:
    branches: [cortex-android-live]
    paths:
      - 'cortex-agent/**'
      - '.github/workflows/cortex-agent.yml'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Syntax check
        run: |
          node --check cortex-agent/index.js
          grep -Fq 'entries.forEach(validateRestoreEntry);' cortex-agent/index.js
          bash -n cortex-agent/install.sh
          bash -n cortex-agent/cortex-agent-control
          grep -Fxq 'User=cortex-agent' cortex-agent/cortex-agent.service
          grep -Fq '/usr/local/libexec/cortex-agent-control' cortex-agent/install.sh
          bash -n cortex-agent/install-azure-ip-https.sh
          grep -Fq 'interfaces=d if isinstance(d,list)' cortex-agent/install-azure-ip-https.sh
          grep -Fq 'https://api.ipify.org' cortex-agent/install-azure-ip-https.sh
          grep -Fq 'Externally visible IPv4 candidate' cortex-agent/install-azure-ip-https.sh
          grep -Fq 'MAX_TRANSFER_BYTES="$(sed -n' cortex-agent/install-azure-ip-https.sh
          grep -Fq 'client_max_body_size $MAX_TRANSFER_BYTES;' cortex-agent/install-azure-ip-https.sh
          runner_unit="$RUNNER_TEMP/cortex-agent-ci.service"
          sed \
            -e "s#^WorkingDirectory=.*#WorkingDirectory=$GITHUB_WORKSPACE/cortex-agent#" \
            -e "s#^EnvironmentFile=.*#Environment=CORTEX_AGENT_TOKEN=ci-validation-token#" \
            -e "s#^ExecStart=.*#ExecStart=$(command -v node) $GITHUB_WORKSPACE/cortex-agent/index.js#" \
            -e "s#^User=.*#User=$(id -un)#" \
            -e "s#^Group=.*#Group=$(id -gn)#" \
            -e 's#^ReadWritePaths=.*#ReadWritePaths=/tmp#' \
            cortex-agent/cortex-agent.service >"$runner_unit"
          systemd-analyze verify "$runner_unit"
      - name: Verify production privilege contract
        shell: bash
        run: |
          set -euo pipefail
          grep -Fxq 'User=cortex-agent' cortex-agent/cortex-agent.service
          ! grep -Fxq 'User=root' cortex-agent/cortex-agent.service
          grep -Fxq 'PrivateDevices=true' cortex-agent/cortex-agent.service
          grep -Fq 'ProtectKernelTunables=true' cortex-agent/cortex-agent.service
          grep -Fq 'ReadWritePaths=/etc/systemd/system ' cortex-agent/cortex-agent.service
          grep -Fq 'cortex-agent ALL=(root) NOPASSWD: /usr/local/libexec/cortex-agent-control start' cortex-agent/install.sh
          grep -Fq 'cortex-agent ALL=(root) NOPASSWD: /usr/local/libexec/cortex-agent-control env-set *' cortex-agent/install.sh
          grep -Fq 'OWNER_NUMBER|CONTROL_NUMBERS|MAX_ACCOUNTS' cortex-agent/cortex-agent-control
          grep -Fq -- '-name node_modules' cortex-agent/install.sh
          grep -Fq 'grant_rw_tree "$PROJECT_ROOT/node_modules"' cortex-agent/install.sh
          grep -Fq -- '-name .git' cortex-agent/install.sh
          set +e
          bash cortex-agent/cortex-agent-control arbitrary-command >/tmp/cortex-control.out 2>/tmp/cortex-control.err
          rc=$?
          set -e
          test "$rc" = '64'
          grep -q 'Unsupported Cortex service action' /tmp/cortex-control.err

      - name: Start Cortex Agent
        shell: bash
        run: |
          mkdir -p /tmp/night/node_modules /tmp/night/modules/demo
          mkdir -p /tmp/cortex-outside
          printf 'outside-secret\n' >/tmp/cortex-outside/secret.txt
          ln -s /tmp/cortex-outside /tmp/night/outside-link
          printf '{"protocol":1,"id":"demo","name":"Demo Module","version":"1.2.3","capabilities":["commands"],"permissions":["whatsapp.send"],"commands":[{"id":"hello","name":"hello","description":"Demo command"}],"settings":[{"key":"enabled","label":"Enabled","type":"boolean"}]}\n' >/tmp/night/modules/demo/bailey.module.json
          printf 'secret=must-stay-server-side\n' >/tmp/night/.env.production
          printf 'private-key' >/tmp/night/server.pem
          printf 'server-only' >/tmp/night/node_modules/server-only.js
          mkdir -p /tmp/night/scripts
          cat >/tmp/night/scripts/cortex-runner-proof.js <<'NODE'
          console.log('runner-ok')
          console.log(process.env.CORTEX_AGENT_TOKEN ? 'token-leaked' : 'token-not-inherited')
          NODE
          cat >/tmp/night/scripts/cortex-runner-stop.sh <<'SH'
          #!/usr/bin/env bash
          echo runner-shell-started
          sleep 30
          SH
          chmod +x /tmp/night/scripts/cortex-runner-stop.sh
          mkdir -p /tmp/cortex-settings /tmp/cortex-private
          printf 'private-auth-state\n' >/tmp/cortex-private/auth.txt
          printf '{"version":1,"autoCc":false,"replyCc":true,"antiDelete":true}\n' >/tmp/cortex-settings/settings.json
          printf '{"version":1,"service":"mscc","entries":[{"key":"autoCc","label":"Auto CC","description":"Copy V1 automatically","command":"autocc","type":"boolean","default":false},{"key":"replyCc","label":"Reply CC","description":"Reply recovery","command":"replycc","type":"boolean","default":true}]}\n' >/tmp/cortex-settings/schema.json
          printf 'OWNER_NUMBER=2348000000001\nCONTROL_NUMBERS=2348000000001,2348000000002\nMAX_ACCOUNTS=4\nMESSAGE_TTL_HOURS=24\nMAX_MESSAGE_CACHE=5000\nGROUP_META_TTL_SECONDS=60\nGROUP_META_CACHE_MAX=128\nLOG_LEVEL=silent\n' >/tmp/mscc.env
          cat >/tmp/mock-mscc.mjs <<'NODE'
          import http from 'node:http'
          let destination = 'account-1'
          let nextAccount = 5
          const accounts = [
            { id:'account-1', displayName:'Main', enabled:true, connected:true, status:'connected', numberMasked:'234••••0001', indexCount:12, indexLimit:5000, pairingMode:'', pairingCode:'', pairingQr:'', pairingError:'' },
            { id:'account-2', displayName:'Second', enabled:true, connected:false, status:'offline', numberMasked:'234••••0002', indexCount:4, indexLimit:5000, pairingMode:'', pairingCode:'', pairingQr:'', pairingError:'' },
            { id:'account-3', displayName:'Work', enabled:true, connected:false, status:'offline', numberMasked:'234••••0003', indexCount:2, indexLimit:5000, pairingMode:'', pairingCode:'', pairingQr:'', pairingError:'' },
            { id:'account-4', displayName:'Archive', enabled:true, connected:false, status:'offline', numberMasked:'234••••0004', indexCount:1, indexLimit:5000, pairingMode:'', pairingCode:'', pairingQr:'', pairingError:'' },
          ]
          const server = http.createServer(async (req,res) => {
            const url = new URL(req.url, 'http://localhost')
            let body = {}
            if (req.method === 'POST') {
              const chunks = []
              for await (const chunk of req) chunks.push(chunk)
              body = chunks.length ? JSON.parse(Buffer.concat(chunks).toString()) : {}
            }
            if (req.method === 'GET' && url.pathname === '/state') {
              res.setHeader('content-type','application/json')
              return res.end(JSON.stringify({
                version:'2.0.0',
                destination,
                settings:{},
                capabilities:{ addAccount:true, perAccountCcOverride:true },
                entitlements:{ maxAccounts:10 },
                accounts,
                system:{ uptime:'1m', rssMb:50, heapMb:20, port:8787 }
              }))
            }
            if (req.method === 'GET' && url.pathname === '/activity') {
              res.setHeader('content-type','application/json')
              return res.end(JSON.stringify({
                entries:[{
                  id:'mscc-event-1',
                  at:'2026-09-26T18:00:00.000Z',
                  action:'cc.forwarded',
                  detail:{ sourceAccount:'account-3', destinationAccount:'account-1', mode:'auto' }
                }]
              }))
            }
            if (req.method === 'POST' && url.pathname === '/accounts') {
              const id = 'account-' + nextAccount++
              const row = {
                id,
                displayName:String(body.displayName || ''),
                enabled:true,
                connected:false,
                status:'offline',
                numberMasked:String(body.phoneNumber || ''),
                indexCount:0,
                indexLimit:5000,
                pairingMode:'',
                pairingCode:'',
                pairingQr:'',
                pairingError:'',
              }
              accounts.push(row)
              res.setHeader('content-type','application/json')
              return res.end(JSON.stringify({ ok:true, account:row }))
            }
            if (req.method === 'POST' && url.pathname === '/destination') {
              if (!accounts.some(row => row.id === body.account)) {
                res.statusCode = 400
                return res.end(JSON.stringify({ error:'bad destination' }))
              }
              destination = body.account
              res.setHeader('content-type','application/json')
              return res.end(JSON.stringify({ ok:true, destination }))
            }
            if (req.method === 'POST' && url.pathname === '/commands/reload') {
              res.setHeader('content-type','application/json')
              return res.end(JSON.stringify({ ok:true, commands:['autocc','replycc','reloadcommands'] }))
            }
            if (req.method === 'POST' && url.pathname === '/modules/demo/reload') {
              res.setHeader('content-type','application/json')
              return res.end(JSON.stringify({ ok:true, module:'demo', commands:['hello'], status:'loaded' }))
            }
            const m = url.pathname.match(/^\/accounts\/([A-Za-z0-9][A-Za-z0-9._-]{0,63})\/(pair|reconnect|disconnect|repair)$/)
            if (req.method === 'POST' && m) {
              const row = accounts.find(x => x.id === m[1])
              if (!row) {
                res.statusCode = 404
                return res.end(JSON.stringify({ error:'unknown account' }))
              }
              if (m[2] === 'reconnect') {
                row.status = 'connecting'
              } else if (m[2] === 'disconnect') {
                row.connected = false
                row.status = 'offline'
              } else {
                row.pairingMode = body.mode === 'qr' ? 'qr' : 'code'
                row.pairingCode = row.pairingMode === 'code' ? 'ABCD-EFGH' : ''
                row.pairingQr = row.pairingMode === 'qr' ? 'data:image/png;base64,AA==' : ''
                row.status = 'pairing'
              }
              res.setHeader('content-type','application/json')
              return res.end(JSON.stringify({ ok:true, account:row.id, status:row.status }))
            }
            const remove = url.pathname.match(/^\/accounts\/([A-Za-z0-9][A-Za-z0-9._-]{0,63})$/)
            if (req.method === 'DELETE' && remove) {
              const index = accounts.findIndex(row => row.id === remove[1])
              if (index < 0) {
                res.statusCode = 404
                return res.end(JSON.stringify({ error:'unknown account' }))
              }
              accounts.splice(index, 1)
              res.setHeader('content-type','application/json')
              return res.end(JSON.stringify({ ok:true, account:remove[1], authPreserved:true }))
            }
            res.statusCode = 404
            res.end('{}')
          })
          server.listen(8788,'127.0.0.1')
          NODE
          node /tmp/mock-mscc.mjs >/tmp/mock-mscc.log 2>&1 &
          echo $! >/tmp/mock-mscc.pid
          CORTEX_AGENT_TOKEN='test-token-12345678901234567890' \
          NIGHT_ROOT=/tmp/night \
          NIGHT_SERVICE=night.service \
          CORTEX_STATE_DIR=/tmp/cortex-state \
          CORTEX_COMMAND_SETTINGS_FILE=/tmp/cortex-settings/settings.json \
          CORTEX_COMMAND_SETTINGS_SCHEMA_FILE=/tmp/cortex-settings/schema.json \
          CORTEX_MSCC_ENV_FILE=/tmp/mscc.env \
          CORTEX_PRIVATE_BACKUP_PATHS=/tmp/cortex-private \
          HOST=127.0.0.1 \
          PORT=47831 \
          node cortex-agent/index.js >/tmp/cortex-agent.log 2>&1 &
          echo $! >/tmp/cortex-agent.pid
          for i in {1..20}; do
            if curl -fsS -H 'Authorization: Bearer test-token-12345678901234567890' http://127.0.0.1:47831/api/cortex/host/status >/tmp/status.json; then
              exit 0
            fi
            sleep 0.5
          done
          cat /tmp/cortex-agent.log
          exit 1
      - name: Verify controlled Startup runner
        shell: bash
        run: |
          set -euo pipefail
          AUTH='Authorization: Bearer test-token-12345678901234567890'

          STARTUP=$(curl -fsS -H "$AUTH" http://127.0.0.1:47831/api/cortex/host/startup)
          echo "$STARTUP" | grep -q '"path":"scripts/cortex-runner-proof.js"'
          echo "$STARTUP" | grep -q '"path":"scripts/cortex-runner-stop.sh"'
          ! echo "$STARTUP" | grep -q 'outside-link'

          curl -fsS -H "$AUTH" -H 'Content-Type: application/json' \
            -d '{"path":"scripts/cortex-runner-proof.js"}' \
            http://127.0.0.1:47831/api/cortex/host/startup/run >/tmp/runner-start.json

          for i in {1..30}; do
            STATE=$(curl -fsS -H "$AUTH" http://127.0.0.1:47831/api/cortex/host/startup)
            if echo "$STATE" | grep -Eq '"status":"(exited|failed)"'; then
              echo "$STATE" >/tmp/runner-finished.json
              break
            fi
            sleep 0.2
          done
          test -s /tmp/runner-finished.json
          grep -q 'runner-ok' /tmp/runner-finished.json
          grep -q 'token-not-inherited' /tmp/runner-finished.json
          ! grep -q 'test-token-12345678901234567890' /tmp/runner-finished.json

          code=$(curl -s -o /tmp/runner-reject.json -w '%{http_code}' \
            -H "$AUTH" -H 'Content-Type: application/json' \
            -d '{"path":"package.json"}' \
            http://127.0.0.1:47831/api/cortex/host/startup/run)
          test "$code" = '403'

          curl -fsS -H "$AUTH" -H 'Content-Type: application/json' \
            -d '{"path":"scripts/cortex-runner-stop.sh"}' \
            http://127.0.0.1:47831/api/cortex/host/startup/run >/tmp/runner-shell.json
          sleep 0.4
          curl -fsS -H "$AUTH" -H 'Content-Type: application/json' -d '{}' \
            http://127.0.0.1:47831/api/cortex/host/startup/stop >/tmp/runner-stop.json
          grep -q 'runner-shell-started' /tmp/runner-stop.json
          ! grep -q '"status":"running"' /tmp/runner-stop.json

      - name: Verify authenticated file API
        shell: bash
        run: |
          AUTH='Authorization: Bearer test-token-12345678901234567890'
          curl -fsS -H "$AUTH" -H 'Content-Type: application/json' \
            -d '{"path":"index.js","content":"console.log(\"night\")\n"}' \
            http://127.0.0.1:47831/api/cortex/host/files/content >/tmp/write.json
          curl -fsS -H "$AUTH" 'http://127.0.0.1:47831/api/cortex/host/files/content?path=index.js' >/tmp/read.json
          curl -fsS -H "$AUTH" 'http://127.0.0.1:47831/api/cortex/host/files/raw?path=index.js' >/tmp/index-download.js
          curl -fsS -H "$AUTH" 'http://127.0.0.1:47831/api/cortex/host/files?path=/' >/tmp/list.json
          grep -q 'console.log' /tmp/read.json
          grep -q 'console.log' /tmp/index-download.js
          grep -q 'index.js' /tmp/list.json
          curl -fsS -H "$AUTH" -H 'Content-Type: application/json' \
            -d '{"path":"asset.bin","contentBase64":"AAEC/w=="}' \
            http://127.0.0.1:47831/api/cortex/host/files/binary >/tmp/binary.json
          grep -q 'asset.bin' /tmp/list.json || curl -fsS -H "$AUTH" 'http://127.0.0.1:47831/api/cortex/host/files?path=/' | grep -q 'asset.bin'

          python3 - <<'PY'
          import json
          with open('/tmp/oversized-text.json','w') as f:
              json.dump({"path":"too-large.txt","content":"x"*(2*1024*1024+1)}, f)
          PY
          oversized_code=$(curl -s -o /tmp/oversized-text-response.json -w '%{http_code}' \
            -H "$AUTH" -H 'Content-Type: application/json' \
            --data-binary @/tmp/oversized-text.json \
            http://127.0.0.1:47831/api/cortex/host/files/content)
          test "$oversized_code" = '413'
          test ! -e /tmp/night/too-large.txt

          # Prove the production raw transfer path no longer buffers/base64-encodes
          # ordinary uploads and works above the legacy 10 MB JSON limit.
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/cortex-stream-upload.bin')
          with p.open('wb') as f:
              chunk=(b'Cortex streaming transfer proof\n' * 4096)
              remaining=12*1024*1024+137
              while remaining:
                  part=chunk[:min(len(chunk),remaining)]
                  f.write(part)
                  remaining-=len(part)
          PY
          curl -fsS -X PUT -H "$AUTH" -H 'Content-Type: application/octet-stream' \
            --data-binary @/tmp/cortex-stream-upload.bin \
            'http://127.0.0.1:47831/api/cortex/host/files/raw?path=stream-upload.bin' >/tmp/stream-upload.json
          grep -q '"ok":true' /tmp/stream-upload.json
          curl -fsS -H "$AUTH" \
            'http://127.0.0.1:47831/api/cortex/host/files/raw?path=stream-upload.bin' >/tmp/cortex-stream-download.bin
          cmp /tmp/cortex-stream-upload.bin /tmp/cortex-stream-download.bin
      - name: Keep server dependencies off the device workspace
        shell: bash
        run: |
          AUTH='Authorization: Bearer test-token-12345678901234567890'
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "$AUTH" -H 'Content-Type: application/json' \
            -d '{"path":"node_modules/should-not-transfer.js","content":"no"}' \
            http://127.0.0.1:47831/api/cortex/host/files/content)
          test "$code" = '403'
          for protected_path in .env.production server.pem; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -H "$AUTH" -H 'Content-Type: application/json' \
              -d "{\"path\":\"$protected_path\",\"content\":\"no\"}" \
              http://127.0.0.1:47831/api/cortex/host/files/content)
            test "$code" = '403'
          done
          ! curl -fsS -H "$AUTH" 'http://127.0.0.1:47831/api/cortex/host/files?path=/' | grep -Eq 'node_modules|.env.production|server.pem'

          read_code=$(curl -s -o /tmp/symlink-read.json -w '%{http_code}' -H "$AUTH" \
            'http://127.0.0.1:47831/api/cortex/host/files/content?path=outside-link%2Fsecret.txt')
          test "$read_code" = '400'
          ! grep -q 'outside-secret' /tmp/symlink-read.json
          grep -q '"error":"Request could not be completed."' /tmp/symlink-read.json
          ! grep -q 'symbolic link' /tmp/symlink-read.json

          write_code=$(curl -s -o /tmp/symlink-write.json -w '%{http_code}' -H "$AUTH" -H 'Content-Type: application/json' \
            -d '{"path":"outside-link/new.txt","content":"must-not-write"}' \
            http://127.0.0.1:47831/api/cortex/host/files/content)
          test "$write_code" = '400'
          test ! -e /tmp/cortex-outside/new.txt

          printf 'blocked' >/tmp/raw-blocked.bin
          raw_code=$(curl -s -o /tmp/raw-protected.json -w '%{http_code}' -X PUT -H "$AUTH" \
            --data-binary @/tmp/raw-blocked.bin \
            'http://127.0.0.1:47831/api/cortex/host/files/raw?path=.env.production')
          test "$raw_code" = '403'
          grep -q '^secret=must-stay-server-side$' /tmp/night/.env.production
      - name: Verify Cortex management operations
        shell: bash
        run: |
          AUTH='Authorization: Bearer test-token-12345678901234567890'
          curl -fsS -H "$AUTH" -H 'Content-Type: application/json'             -d '{"path":"commands"}'             http://127.0.0.1:47831/api/cortex/host/files/directory
          printf 'hello\n' >/tmp/payload.txt
          curl -fsS -H "$AUTH" -H 'Content-Type: application/json'             -d '{"path":"commands/test.js","content":"export default 1\n"}'             http://127.0.0.1:47831/api/cortex/host/files/content
          curl -fsS -H "$AUTH" -H 'Content-Type: application/json'             -d '{"from":"commands/test.js","to":"commands/renamed.js"}'             http://127.0.0.1:47831/api/cortex/host/files/rename
          curl -fsS -H "$AUTH" -H 'Content-Type: application/json'             -d '{"from":"commands/renamed.js","to":"commands/copied.js"}'             http://127.0.0.1:47831/api/cortex/host/files/copy
          test -f /tmp/night/commands/copied.js
          curl -fsS -H "$AUTH" -H 'Content-Type: application/json'             -d '{"from":"commands/copied.js","to":"moved/copied.js"}'             http://127.0.0.1:47831/api/cortex/host/files/rename
          test -f /tmp/night/moved/copied.js
          test ! -f /tmp/night/commands/copied.js
          curl -fsS -H "$AUTH" -H 'Content-Type: application/json'             -d '{"paths":["commands"],"destination":"commands.zip"}'             http://127.0.0.1:47831/api/cortex/host/files/archive
          curl -fsS -H "$AUTH" -H 'Content-Type: application/json' \
            -d '{"paths":["/"],"destination":"safe-project.zip"}' \
            http://127.0.0.1:47831/api/cortex/host/files/archive
          unzip -Z1 /tmp/night/safe-project.zip >/tmp/safe-project-list.txt
          ! grep -q 'node_modules' /tmp/safe-project-list.txt
          ! grep -q '.env.production' /tmp/safe-project-list.txt
          ! grep -q 'server.pem' /tmp/safe-project-list.txt
          ! grep -q 'outside-link' /tmp/safe-project-list.txt
          ! grep -q 'safe-project.zip' /tmp/safe-project-list.txt
          mkdir -p /tmp/night/extracted
          curl -fsS -H "$AUTH" -H 'Content-Type: application/json'             -d '{"path":"commands.zip","destination":"extracted"}'             http://127.0.0.1:47831/api/cortex/host/files/extract
          test -f /tmp/night/extracted/commands/renamed.js
          STARTUP=$(curl -fsS -H "$AUTH" http://127.0.0.1:47831/api/cortex/host/startup)
          echo "$STARTUP" | grep -q '"runtime":"Node.js"'
          echo "$STARTUP" | grep -q '"additionalNodePackages"'
          ACTIVITY=$(curl -fsS -H "$AUTH" http://127.0.0.1:47831/api/cortex/host/activity?limit=50)
          echo "$ACTIVITY" | grep -q 'server:file.rename'
          echo "$ACTIVITY" | grep -q 'server:file.copy'
      - name: Reject hostile archive extraction
        shell: bash
        run: |
          AUTH='Authorization: Bearer test-token-12345678901234567890'
          python3 - <<'PY'
          import stat, zipfile
          with zipfile.ZipFile('/tmp/night/hostile-traversal.zip','w') as z:
              z.writestr('../cortex-agent-escape.txt','escape')
          with zipfile.ZipFile('/tmp/night/hostile-symlink.zip','w') as z:
              entry=zipfile.ZipInfo('outside-link')
              entry.create_system=3
              entry.external_attr=(stat.S_IFLNK | 0o777) << 16
              z.writestr(entry,'/tmp')
              z.writestr('ordinary.txt','safe')
          PY

          for archive in hostile-traversal.zip hostile-symlink.zip; do
            code=$(curl -s -o "/tmp/$archive.response" -w '%{http_code}' \
              -H "$AUTH" -H 'Content-Type: application/json' \
              -d "{\"path\":\"$archive\",\"destination\":\"hostile-extract\"}" \
              http://127.0.0.1:47831/api/cortex/host/files/extract)
            test "$code" = '400'
          done
          test ! -e /tmp/cortex-agent-escape.txt
          test ! -L /tmp/night/hostile-extract/outside-link

      - name: Verify Bailey-style module discovery
        shell: bash
        run: |
          AUTH='Authorization: Bearer test-token-12345678901234567890'
          REGISTRY=$(curl -fsS -H "$AUTH" http://127.0.0.1:47831/api/cortex/mscc/registry)
          echo "$REGISTRY" | grep -q '"source":"filesystem"'
          echo "$REGISTRY" | grep -q '"id":"demo"'
          echo "$REGISTRY" | grep -q '"displayName":"Demo Module"'
          echo "$REGISTRY" | grep -q '"hello"'
          echo "$REGISTRY" | grep -q '"whatsapp.send"'
          echo "$REGISTRY" | grep -q '"key":"enabled"'
      - name: Verify guarded source backup restore
        shell: bash
        run: |
          AUTH='Authorization: Bearer test-token-12345678901234567890'
          curl -fsS -H "$AUTH" -H 'Content-Type: application/json'             -d '{"private":false}'             http://127.0.0.1:47831/api/cortex/host/backups >/tmp/restore-backup.json
          RESTORE_BACKUP=$(python -c 'import json; print(json.load(open("/tmp/restore-backup.json"))["name"])')
          printf 'changed-after-backup\n' >/tmp/night/index.js
          RESTORED=$(curl -fsS -H "$AUTH" -H 'Content-Type: application/json'             -d "{\"name\":\"$RESTORE_BACKUP\"}"             http://127.0.0.1:47831/api/cortex/host/backups/restore)
          echo "$RESTORED" | grep -q '"ok":true'
          echo "$RESTORED" | grep -q '"safetyBackup":"project-'
          grep -q 'console.log("night")' /tmp/night/index.js
          ! grep -q 'changed-after-backup' /tmp/night/index.js

          curl -fsS -H "$AUTH" -H 'Content-Type: application/json'             -d '{"private":true}'             http://127.0.0.1:47831/api/cortex/host/backups >/tmp/private-restore-backup.json
          PRIVATE_RESTORE=$(python -c 'import json; print(json.load(open("/tmp/private-restore-backup.json"))["name"])')
          code=$(curl -s -o /tmp/private-restore-response.json -w '%{http_code}' -H "$AUTH" -H 'Content-Type: application/json'             -d "{\"name\":\"$PRIVATE_RESTORE\"}"             http://127.0.0.1:47831/api/cortex/host/backups/restore)
          test "$code" = '400'

      - name: Verify clean project backup excludes server dependencies and secrets
        shell: bash
        run: |
          AUTH='Authorization: Bearer test-token-12345678901234567890'
          curl -fsS -H "$AUTH" -H 'Content-Type: application/json'             -d '{"private":false}'             http://127.0.0.1:47831/api/cortex/host/backups >/tmp/backup.json
          BACKUP=$(python -c 'import json; print(json.load(open("/tmp/backup.json"))["name"])')
          curl -fsS -H "$AUTH" "http://127.0.0.1:47831/api/cortex/host/backups/content?name=$BACKUP" -o /tmp/project.zip
          unzip -l /tmp/project.zip >/tmp/project-list.txt
          grep -q 'index.js' /tmp/project-list.txt
          ! grep -q 'node_modules' /tmp/project-list.txt
          ! grep -q '.env.production' /tmp/project-list.txt
          ! grep -q 'server.pem' /tmp/project-list.txt
          ! grep -q 'outside-link' /tmp/project-list.txt
          ! grep -q 'cortex-private/auth.txt' /tmp/project-list.txt
          curl -fsS -H "$AUTH" http://127.0.0.1:47831/api/cortex/host/backups | grep -q "$BACKUP"

          curl -fsS -H "$AUTH" -H 'Content-Type: application/json'             -d '{"private":true}'             http://127.0.0.1:47831/api/cortex/host/backups >/tmp/private-backup.json
          PRIVATE_BACKUP=$(python -c 'import json; print(json.load(open("/tmp/private-backup.json"))["name"])')
          curl -fsS -H "$AUTH" "http://127.0.0.1:47831/api/cortex/host/backups/content?name=$PRIVATE_BACKUP" -o /tmp/private.zip
          unzip -l /tmp/private.zip >/tmp/private-list.txt
          grep -q 'tmp/cortex-private/auth.txt' /tmp/private-list.txt
          curl -fsS -X DELETE -H "$AUTH" "http://127.0.0.1:47831/api/cortex/host/backups?name=$BACKUP" | grep -q '"ok":true'
          ! curl -fsS -H "$AUTH" http://127.0.0.1:47831/api/cortex/host/backups | grep -q "$BACKUP"
      - name: Verify secure environment management
        shell: bash
        run: |
          set -euo pipefail
          AUTH='Authorization: Bearer test-token-12345678901234567890'

          ENVIRONMENT=$(curl -fsS -H "$AUTH" http://127.0.0.1:47831/api/cortex/host/environment)
          echo "$ENVIRONMENT" | grep -q '"key":"OWNER_NUMBER"'
          echo "$ENVIRONMENT" | grep -q '"key":"MAX_ACCOUNTS"'
          echo "$ENVIRONMENT" | grep -q '"hasValue":true'
          ! echo "$ENVIRONMENT" | grep -q '2348000000001'

          REVEALED=$(curl -fsS -H "$AUTH" -H 'Content-Type: application/json' \
            -d '{"key":"OWNER_NUMBER"}' \
            http://127.0.0.1:47831/api/cortex/host/environment/reveal)
          echo "$REVEALED" | grep -q '2348000000001'

          SAVED=$(curl -fsS -H "$AUTH" -H 'Content-Type: application/json' \
            -d '{"key":"MAX_ACCOUNTS","value":"6"}' \
            http://127.0.0.1:47831/api/cortex/host/environment)
          echo "$SAVED" | grep -q '"restartRequired":true'
          grep -q '^MAX_ACCOUNTS=6$' /tmp/mscc.env

          code=$(curl -s -o /tmp/env-reject.json -w '%{http_code}' -H "$AUTH" -H 'Content-Type: application/json' \
            -d '{"key":"WEB_SESSION_SECRET","value":"must-not-be-managed"}' \
            http://127.0.0.1:47831/api/cortex/host/environment)
          test "$code" = '400'
          ! grep -q 'must-not-be-managed' /tmp/mscc.env

      - name: Verify command-driven settings contract
        shell: bash
        run: |
          AUTH='Authorization: Bearer test-token-12345678901234567890'
          SETTINGS=$(curl -fsS -H "$AUTH" http://127.0.0.1:47831/api/cortex/host/settings)
          echo "$SETTINGS" | grep -q '"key":"autoCc"'
          echo "$SETTINGS" | grep -q '"key":"replyCc"'
          echo "$SETTINGS" | grep -q '"command":"replycc","enabled":true'
          curl -fsS -H "$AUTH" -H 'Content-Type: application/json'             -d '{"key":"autoCc","enabled":true}'             http://127.0.0.1:47831/api/cortex/host/settings | grep -q '"enabled":true'
          grep -q '"autoCc": true' /tmp/cortex-settings/settings.json
      - name: Merge MSCC runtime events into Cortex Activity
        shell: bash
        run: |
          AUTH='Authorization: Bearer test-token-12345678901234567890'
          ACTIVITY=$(curl -fsS -H "$AUTH" 'http://127.0.0.1:47831/api/cortex/host/activity?limit=100')
          echo "$ACTIVITY" | grep -q '"action":"cc.forwarded"'
          echo "$ACTIVITY" | grep -q '"source":"mscc"'
          echo "$ACTIVITY" | grep -q '"sourceAccount":"account-3"'

      - name: Verify dynamic MSCC control bridge
        shell: bash
        run: |
          AUTH='Authorization: Bearer test-token-12345678901234567890'

          STATE=$(curl -fsS -H "$AUTH" http://127.0.0.1:47831/api/cortex/mscc/pairing)
          echo "initial-state=$STATE"
          echo "$STATE" | grep -q '"id":"account-3"'
          echo "$STATE" | grep -q '"maxAccounts":10'
          echo "$STATE" | grep -q '"addAccount":true'

          ADDED=$(curl -fsS -H "$AUTH" -H 'Content-Type: application/json'             -d '{"phoneNumber":"234000000005","displayName":"Extra"}'             http://127.0.0.1:47831/api/cortex/mscc/accounts)
          echo "added=$ADDED"
          echo "$ADDED" | grep -q '"id":"account-5"'

          PAIRED=$(curl -fsS -H "$AUTH" -H 'Content-Type: application/json'             -d '{"mode":"code"}'             http://127.0.0.1:47831/api/cortex/mscc/accounts/account-3/pair)
          echo "paired=$PAIRED"
          AFTER_PAIR=$(curl -fsS -H "$AUTH" http://127.0.0.1:47831/api/cortex/mscc/pairing)
          echo "$AFTER_PAIR" | grep -q 'ABCD-EFGH'

          REPAIRED=$(curl -fsS -H "$AUTH" -H 'Content-Type: application/json'             -d '{"mode":"qr"}'             http://127.0.0.1:47831/api/cortex/mscc/accounts/account-4/repair)
          echo "repaired=$REPAIRED"
          AFTER_REPAIR=$(curl -fsS -H "$AUTH" http://127.0.0.1:47831/api/cortex/mscc/pairing)
          echo "$AFTER_REPAIR" | grep -q '"pairingMode":"qr"'

          DEST=$(curl -fsS -H "$AUTH" -H 'Content-Type: application/json'             -d '{"account":"account-2"}'             http://127.0.0.1:47831/api/cortex/mscc/destination)
          echo "destination=$DEST"
          echo "$DEST" | grep -q '"destination":"account-2"'
          AFTER_DEST=$(curl -fsS -H "$AUTH" http://127.0.0.1:47831/api/cortex/mscc/pairing)
          echo "$AFTER_DEST" | grep -q '"destination":"account-2"'

          DISCONNECTED=$(curl -fsS -X POST -H "$AUTH" -H 'Content-Type: application/json' -d '{}'             http://127.0.0.1:47831/api/cortex/mscc/accounts/account-3/disconnect)
          echo "disconnected=$DISCONNECTED"
          echo "$DISCONNECTED" | grep -q '"status":"offline"'

          REMOVED=$(curl -fsS -X DELETE -H "$AUTH"             http://127.0.0.1:47831/api/cortex/mscc/accounts/account-3)
          echo "removed=$REMOVED"
          echo "$REMOVED" | grep -q '"authPreserved":true'
          AFTER_REMOVE=$(curl -fsS -H "$AUTH" http://127.0.0.1:47831/api/cortex/mscc/pairing)
          ! echo "$AFTER_REMOVE" | grep -q '"id":"account-3"'

          MODULE=$(curl -fsS -X POST -H "$AUTH"             http://127.0.0.1:47831/api/cortex/mscc/modules/demo/reload)
          echo "module=$MODULE"
          echo "$MODULE" | grep -q '"module":"demo"'

          COMMANDS=$(curl -fsS -X POST -H "$AUTH"             http://127.0.0.1:47831/api/cortex/mscc/commands/reload)
          echo "commands=$COMMANDS"
          echo "$COMMANDS" | grep -q '"reloadcommands"'
      - name: Prove pairing state survives Cortex Agent restart
        shell: bash
        run: |
          AUTH='Authorization: Bearer test-token-12345678901234567890'
          BEFORE=$(curl -fsS -H "$AUTH" http://127.0.0.1:47831/api/cortex/mscc/pairing)
          echo "$BEFORE" | grep -q '"destination":"account-2"'
          echo "$BEFORE" | grep -q '"id":"account-4"'
          echo "$BEFORE" | grep -q '"pairingMode":"qr"'
          ! echo "$BEFORE" | grep -q '"id":"account-3"'

          kill "$(cat /tmp/cortex-agent.pid)"
          for i in {1..20}; do
            if ! kill -0 "$(cat /tmp/cortex-agent.pid)" 2>/dev/null; then break; fi
            sleep 0.25
          done

          CORTEX_AGENT_TOKEN='test-token-12345678901234567890' \
          NIGHT_ROOT=/tmp/night \
          NIGHT_SERVICE=night.service \
          CORTEX_STATE_DIR=/tmp/cortex-state \
          CORTEX_COMMAND_SETTINGS_FILE=/tmp/cortex-settings/settings.json \
          CORTEX_COMMAND_SETTINGS_SCHEMA_FILE=/tmp/cortex-settings/schema.json \
          CORTEX_MSCC_ENV_FILE=/tmp/mscc.env \
          CORTEX_PRIVATE_BACKUP_PATHS=/tmp/cortex-private \
          HOST=127.0.0.1 \
          PORT=47831 \
          node cortex-agent/index.js >/tmp/cortex-agent-restarted.log 2>&1 &
          echo $! >/tmp/cortex-agent.pid

          for i in {1..30}; do
            if AFTER=$(curl -fsS -H "$AUTH" http://127.0.0.1:47831/api/cortex/mscc/pairing 2>/dev/null); then
              echo "$AFTER" >/tmp/cortex-after-agent-restart.json
              break
            fi
            sleep 0.25
          done
          test -s /tmp/cortex-after-agent-restart.json
          AFTER=$(cat /tmp/cortex-after-agent-restart.json)
          echo "$AFTER" | grep -q '"destination":"account-2"'
          echo "$AFTER" | grep -q '"id":"account-4"'
          echo "$AFTER" | grep -q '"pairingMode":"qr"'
          ! echo "$AFTER" | grep -q '"id":"account-3"'

      - name: Reject unauthenticated requests
        shell: bash
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:47831/api/cortex/host/status)
          test "$code" = '401'
      - name: Stop Cortex Agent
        if: always()
        run: |
          kill "$(cat /tmp/cortex-agent.pid)" 2>/dev/null || true
          kill "$(cat /tmp/mock-mscc.pid)" 2>/dev/null || true
