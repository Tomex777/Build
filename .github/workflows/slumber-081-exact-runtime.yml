name: Slumber 0.8.1 Exact APK Runtime QA

on:
  push:
    branches: ["pianohub-ci"]
    paths:
      - ".github/workflows/slumber-081-exact-runtime.yml"

permissions:
  actions: read
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Download exact already-tested 0.8.1 APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/slumber-build /tmp/slumber-runtime
          mkdir -p /tmp/slumber-build /tmp/slumber-runtime
          gh run download 34632258957 --repo Tomex777/Build --name slumber-0.8.1-final-runtime-build --dir /tmp/slumber-build
          APK=$(find /tmp/slumber-build -name 'Slumber-0.8.1-debug.apk' -type f -print -quit)
          test -n "$APK"
          cp "$APK" /tmp/slumber-runtime/app-debug.apk
          echo 'fc2a339193583742415fb61e5f802ee3641715f3c80d90fcb488218380f514de  /tmp/slumber-runtime/app-debug.apk' | sha256sum -c -

      - name: Prepare emulator QA
        shell: bash
        run: |
          cat > /tmp/slumber-runtime/run-qa.sh <<'BASH'
          #!/usr/bin/env bash
          set -euo pipefail
          PKG=com.night.pianohub
          ACT=com.night.pianohub/.MainActivity
          OUT=/tmp/slumber-runtime

          dump_ui() {
            for _ in 1 2 3; do
              if adb shell uiautomator dump /sdcard/slumber-ui.xml >/dev/null 2>&1 && adb pull /sdcard/slumber-ui.xml "$OUT/ui.xml" >/dev/null 2>&1; then return 0; fi
              sleep 1
            done
            return 1
          }

          has_text() {
            dump_ui
            python3 - "$OUT/ui.xml" "$1" <<'PY'
          import sys, xml.etree.ElementTree as ET
          root=ET.parse(sys.argv[1]).getroot(); target=sys.argv[2]
          for n in root.iter('node'):
              if n.attrib.get('text') == target or n.attrib.get('content-desc') == target:
                  raise SystemExit(0)
          raise SystemExit(1)
          PY
          }

          lacks_text() { if has_text "$1"; then return 1; else return 0; fi; }

          wait_text() {
            local t="$1"
            for _ in $(seq 1 24); do if has_text "$t"; then return 0; fi; sleep 1; done
            echo "Timed out waiting for UI text: $t" >&2; return 1
          }

          tap_text() {
            dump_ui
            local xy
            xy=$(python3 - "$OUT/ui.xml" "$1" <<'PY'
          import re, sys, xml.etree.ElementTree as ET
          root=ET.parse(sys.argv[1]).getroot(); target=sys.argv[2]
          for n in root.iter('node'):
              if n.attrib.get('text') == target or n.attrib.get('content-desc') == target:
                  m=re.fullmatch(r'\[(\d+),(\d+)\]\[(\d+),(\d+)\]', n.attrib.get('bounds',''))
                  if m:
                      x1,y1,x2,y2=map(int,m.groups()); print((x1+x2)//2,(y1+y2)//2); raise SystemExit(0)
          raise SystemExit(3)
          PY
          )
            adb shell input tap $xy
            sleep 2
          }

          scroll_until_text() {
            local t="$1"
            for _ in $(seq 1 8); do
              if has_text "$t"; then return 0; fi
              adb shell input swipe 540 2200 540 1350 350
              sleep 1
            done
            echo "Could not scroll to UI text: $t" >&2
            return 1
          }

          shot() { adb exec-out screencap -p > "$OUT/$1.png"; test -s "$OUT/$1.png"; }
          dims() {
            python3 - "$1" <<'PY'
          import struct,sys
          b=open(sys.argv[1],'rb').read(24); w,h=struct.unpack('>II',b[16:24]); print(w,h)
          PY
          }
          assert_portrait() { read w h < <(dims "$1"); echo "portrait check ${w}x${h}"; test "$h" -gt "$w"; }
          assert_landscape() { read w h < <(dims "$1"); echo "landscape check ${w}x${h}"; test "$w" -gt "$h"; }

          adb shell settings put global hide_error_dialogs 1
          adb install -r "$OUT/app-debug.apk"
          adb logcat -c
          adb shell am force-stop "$PKG"
          adb shell am start -W -n "$ACT" > "$OUT/start.txt"
          sleep 4
          test -n "$(adb shell pidof "$PKG")"

          wait_text "Slumber"
          has_text "Ready to practice?"
          shot 01-home
          assert_portrait "$OUT/01-home.png"

          tap_text "Settings"
          wait_text "Make Slumber yours"
          has_text "Sounds"
          has_text "by Night"
          has_text "Version 0.8.1"
          shot 02-settings
          assert_portrait "$OUT/02-settings.png"

          tap_text "Sounds"
          wait_text "SETTINGS · SOUNDS"
          wait_text "Instrument packs"
          shot 03-sounds
          assert_portrait "$OUT/03-sounds.png"

          tap_text "Instrument packs"
          wait_text "Upright Piano KW"
          has_text "Old Piano FB"
          has_text "Install"
          shot 04-pack-catalog-top
          assert_portrait "$OUT/04-pack-catalog-top.png"

          tap_text "Install"
          for _ in $(seq 1 60); do
            if adb shell run-as "$PKG" test -f files/instrument_packs/freepats_upright_kw/manifest.json; then break; fi
            sleep 1
          done
          adb shell run-as "$PKG" test -f files/instrument_packs/freepats_upright_kw/manifest.json
          adb shell run-as "$PKG" cat files/instrument_packs/freepats_upright_kw/manifest.json > "$OUT/installed-pack-manifest.json"
          grep -q 'Upright Piano KW' "$OUT/installed-pack-manifest.json"
          grep -q 'CC0-1.0' "$OUT/installed-pack-manifest.json"
          wait_text "Use"
          shot 05-pack-installed

          scroll_until_text "FM Piano 2"
          scroll_until_text "Drawbar Organ"
          scroll_until_text "Church Organ"
          shot 06-pack-catalog-bottom
          assert_portrait "$OUT/06-pack-catalog-bottom.png"

          # Close the pack sheet, then use the Sounds page's own navigation button.
          adb shell input keyevent KEYCODE_BACK
          sleep 2
          wait_text "SETTINGS · SOUNDS"
          wait_text "Yamaha C5 Concert Grand"
          tap_text "Back"
          wait_text "Make Slumber yours"
          shot 07-settings-return
          assert_portrait "$OUT/07-settings-return.png"

          tap_text "Piano"
          sleep 4
          wait_text "First Melody"
          has_text "BPM"
          has_text "AI Teacher"
          shot 08-piano-landscape
          assert_landscape "$OUT/08-piano-landscape.png"

          tap_text "Increase tempo"
          wait_text "95"
          shot 09-bpm-95
          assert_landscape "$OUT/09-bpm-95.png"

          tap_text "Piano settings"
          wait_text "Piano settings"
          lacks_text "Make Slumber yours"
          has_text "Controls for the playing surface only. App-wide preferences stay in Settings."
          shot 10-piano-settings
          assert_landscape "$OUT/10-piano-settings.png"
          adb shell input keyevent KEYCODE_BACK
          sleep 1

          tap_text "AI Teacher"
          wait_text "Listen & Repeat"
          has_text "Play phrase"
          shot 11-listen-repeat
          assert_landscape "$OUT/11-listen-repeat.png"
          tap_text "Play phrase"
          wait_text "● Your turn"
          has_text "Your turn — play the same four notes."
          shot 12-listen-repeat-turn
          adb shell input keyevent KEYCODE_BACK
          sleep 1

          tap_text "Back"
          wait_text "Ready to practice?"
          shot 13-piano-exit-portrait
          assert_portrait "$OUT/13-piano-exit-portrait.png"

          tap_text "Songs"
          wait_text "Turn a song into a lesson"
          shot 14-songs
          assert_portrait "$OUT/14-songs.png"
          tap_text "Piano"
          sleep 4
          wait_text "First Melody"
          lacks_text "Turn a song into a lesson"
          shot 15-songs-to-piano
          assert_landscape "$OUT/15-songs-to-piano.png"

          tap_text "Back"
          wait_text "Ready to practice?"
          shot 16-final-home
          assert_portrait "$OUT/16-final-home.png"

          adb shell dumpsys meminfo "$PKG" > "$OUT/meminfo.txt"
          adb logcat -d -t 6000 > "$OUT/logcat.txt"
          ! grep -E "ANR in ${PKG}|FATAL EXCEPTION.*${PKG}|Process: ${PKG}.*FATAL EXCEPTION" "$OUT/logcat.txt"
          test -n "$(adb shell pidof "$PKG")"
          BASH
          chmod +x /tmp/slumber-runtime/run-qa.sh

      - name: Enable KVM
        shell: bash
        run: |
          set -euo pipefail
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm

      - name: Run exact APK on Android 36
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ANDROID_EMULATOR_WAIT_TIME_BEFORE_KILL: 1
        with:
          api-level: 36
          arch: x86_64
          target: default
          profile: pixel_6
          cores: 2
          emulator-boot-timeout: 360
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot-save -no-metrics
          script: bash /tmp/slumber-runtime/run-qa.sh

      - name: Upload exact runtime proof
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: slumber-0.8.1-exact-runtime-proof
          path: |
            /tmp/slumber-runtime/*.png
            /tmp/slumber-runtime/*.txt
            /tmp/slumber-runtime/*.xml
            /tmp/slumber-runtime/*.json
          if-no-files-found: warn
