name: Import Spotui Innertube for Sora YouTube Music

on:
  push:
    branches: [sora-android-ci]
    paths:
      - 'sora-ci/apply-youtube-innertube-vendor.txt'

jobs:
  import:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Import pinned upstream source
        run: bash sora-ci/import_spotui_innertube.sh
      - name: Verify pinned isolated vendor
        run: |
          test "$(cat sora-overlay/youtube-innertube/UPSTREAM_REVISION)" = 'f9d05b6450e730469d15f30f9dd4bc790db794db'
          test -f sora-overlay/youtube-innertube/UPSTREAM_LICENSE_GPL-3.0.txt
          test -f sora-overlay/youtube-innertube/src/main/kotlin/com/metrolist/innertube/YouTube.kt
          grep -q 'namespace = "com.metrolist.innertube"' sora-overlay/youtube-innertube/build.gradle.kts
      - name: Commit vendor snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sora-overlay/youtube-innertube
          if git diff --cached --quiet; then
            echo 'No vendor changes to commit'
          else
            git commit -m 'vendor pinned Spotui Innertube for Sora YouTube Music extension'
            git push
          fi
