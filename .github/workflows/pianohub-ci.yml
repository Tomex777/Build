name: Piano Hub Offline-First Android Build

on:
  push:
    branches: ["pianohub-ci"]

permissions:
  actions: read
  contents: read

jobs:
  build-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout Piano Hub staging branch
        uses: actions/checkout@v4

      - name: Restore Piano Hub source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/pianohub
          mkdir -p /tmp/pianohub
          cat .ci/pianohub_payload/part*.txt | tr -d '\n' | base64 --decode > /tmp/pianohub-source.tgz
          tar -xzf /tmp/pianohub-source.tgz -C /tmp/pianohub
          test -f /tmp/pianohub/settings.gradle.kts
          test -f /tmp/pianohub/app/src/main/java/com/night/pianohub/learner/PerformanceEngine.kt
          test -f /tmp/pianohub/app/src/main/java/com/night/pianohub/storage/PianoHubLocalStore.kt
          test -f /tmp/pianohub/app/src/main/java/com/night/pianohub/midi/MidiInputManager.kt

      - name: Verify offline-first architecture source
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'AndroidKeyStore' /tmp/pianohub/app/src/main/java/com/night/pianohub/storage/PianoHubLocalStore.kt
          grep -q 'PerformanceEngine' /tmp/pianohub/app/src/main/java/com/night/pianohub/ui/screens/PianoScreen.kt
          grep -q 'MidiManager' /tmp/pianohub/app/src/main/java/com/night/pianohub/midi/MidiInputManager.kt
          grep -q '127.0.0.1:11434/v1' /tmp/pianohub/app/src/main/java/com/night/pianohub/ai/AiProvider.kt
          echo 'Offline-first source checks passed.'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: "15859902"

      - name: Install compile SDK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --channel=3 "platforms;android-37.0" "build-tools;37.0.0"
          test -f "$ANDROID_SDK_ROOT/platforms/android-37.0/android.jar"

      - name: Build offline-first APK
        working-directory: /tmp/pianohub
        run: gradle --stacktrace assembleDebug

      - name: Verify APK contents
        shell: bash
        run: |
          set -euo pipefail
          APK=/tmp/pianohub/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          COUNT=$(unzip -l "$APK" | grep -E 'assets/piano/.*\.mp3$' | wc -l)
          echo "Bundled sampled-piano recordings: $COUNT"
          test "$COUNT" -eq 30

      - name: Package verified source
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/pianohub
          tar --exclude='./.gradle' --exclude='./build' --exclude='./app/build' --exclude='./screenshots' -czf /tmp/pianohub-offline-first-source.tgz .

      - name: Upload verified source
        uses: actions/upload-artifact@v4
        with:
          name: pianohub-offline-first-source
          path: /tmp/pianohub-offline-first-source.tgz
          if-no-files-found: error

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pianohub-offline-first-apk
          path: /tmp/pianohub/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Boot Android 36 and smoke-test the real APK
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ANDROID_EMULATOR_WAIT_TIME_BEFORE_KILL: 1
        with:
          api-level: 36
          arch: x86_64
          target: default
          profile: pixel_6
          cores: 2
          emulator-boot-timeout: 300
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot-save -no-metrics
          script: |
            set -euo pipefail
            APK=/tmp/pianohub/app/build/outputs/apk/debug/app-debug.apk
            mkdir -p /tmp/pianohub/screenshots
            adb install -r "$APK"
            adb shell am force-stop com.night.pianohub
            adb shell am start -W -n com.night.pianohub/.MainActivity
            sleep 5
            adb shell pidof com.night.pianohub
            adb exec-out screencap -p > /tmp/pianohub/screenshots/01-learn.png
            test -s /tmp/pianohub/screenshots/01-learn.png
            adb logcat -d -t 400 > /tmp/pianohub/screenshots/logcat-tail.txt
            ! grep -E 'FATAL EXCEPTION.*com\.night\.pianohub|Process: com\.night\.pianohub.*FATAL EXCEPTION' /tmp/pianohub/screenshots/logcat-tail.txt

      - name: Upload runtime proof
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pianohub-offline-first-runtime
          path: /tmp/pianohub/screenshots/*
          if-no-files-found: warn
