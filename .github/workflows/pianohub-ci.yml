name: Piano Hub Real Audio + Emulator Screenshots

on:
  push:
    branches: ["pianohub-ci"]

permissions:
  contents: read

jobs:
  build-and-screenshot:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4

      - name: Restore Piano Hub source
        shell: bash
        run: |
          rm -rf /tmp/pianohub && mkdir -p /tmp/pianohub
          cat .ci/pianohub_payload/part*.txt | tr -d '\n' | base64 --decode > /tmp/pianohub-source.tgz
          tar -xzf /tmp/pianohub-source.tgz -C /tmp/pianohub
          test -f /tmp/pianohub/settings.gradle.kts

      - name: Apply Android build and sample-source fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('/tmp/pianohub/app/build.gradle.kts')
          s = p.read_text()
          s = s.replace(
              'val generatedPianoAssets = layout.buildDirectory.dir("generated/pianoSamples/assets")',
              'val generatedPianoAssets = layout.buildDirectory.get().asFile.resolve("generated/pianoSamples/assets")'
          )
          s = s.replace(
              'val pianoDir = generatedPianoAssets.get().asFile.resolve("piano")',
              'val pianoDir = generatedPianoAssets.resolve("piano")'
          )
          s = s.replace(
              'https://unpkg.com/@audio-samples/piano-mp3-velocity8@1.0.5/audio/',
              'https://cdn.jsdelivr.net/npm/@audio-samples/piano-mp3-velocity8@1.0.5/audio/'
          )
          p.write_text(s)
          PY
          grep -n 'generatedPianoAssets\|assets.srcDir\|jsdelivr' /tmp/pianohub/app/build.gradle.kts

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK with real Yamaha C5 samples
        working-directory: /tmp/pianohub
        run: gradle --stacktrace assembleDebug

      - name: Verify 30 real recordings are inside APK
        shell: bash
        run: |
          APK=/tmp/pianohub/app/build/outputs/apk/debug/app-debug.apk
          COUNT=$(unzip -l "$APK" | grep -E 'assets/piano/.*\.mp3$' | wc -l)
          echo "Bundled sampled-piano recordings: $COUNT"
          test "$COUNT" -eq 30

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pianohub-debug-apk
          path: /tmp/pianohub/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Boot Android 36 emulator and capture UI
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          profile: pixel_6
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set -e
            APK=/tmp/pianohub/app/build/outputs/apk/debug/app-debug.apk
            mkdir -p /tmp/pianohub/screenshots
            adb install -r "$APK"
            adb shell am force-stop com.night.pianohub
            adb shell am start -W -n com.night.pianohub/.MainActivity
            sleep 4
            adb exec-out screencap -p > /tmp/pianohub/screenshots/01-learn.png
            SIZE=$(adb shell wm size | tail -n1 | tr -d '\r')
            WIDTH=$(echo "$SIZE" | grep -oE '[0-9]+x[0-9]+' | cut -dx -f1)
            HEIGHT=$(echo "$SIZE" | grep -oE '[0-9]+x[0-9]+' | cut -dx -f2)
            Y=$((HEIGHT * 95 / 100))
            adb shell input tap $((WIDTH * 3 / 10)) "$Y"
            sleep 2
            adb exec-out screencap -p > /tmp/pianohub/screenshots/02-piano.png
            adb shell input tap $((WIDTH * 9 / 10)) "$Y"
            sleep 2
            adb exec-out screencap -p > /tmp/pianohub/screenshots/03-settings.png
            test -s /tmp/pianohub/screenshots/01-learn.png
            test -s /tmp/pianohub/screenshots/02-piano.png
            test -s /tmp/pianohub/screenshots/03-settings.png

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pianohub-ui-screenshots
          path: /tmp/pianohub/screenshots/*.png
          if-no-files-found: warn
