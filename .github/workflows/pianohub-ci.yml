name: Piano Hub Emulator Screenshots

on:
  push:
    branches: ["pianohub-ci"]

permissions:
  actions: read
  contents: read

jobs:
  screenshot-only:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download verified Piano Hub APK
        uses: actions/download-artifact@v4
        with:
          name: pianohub-debug-apk
          path: /tmp/pianohub/apk
          repository: Tomex777/Build
          run-id: 34387774146
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Locate verified APK
        shell: bash
        run: |
          find /tmp/pianohub/apk -type f -maxdepth 3 -print
          APK=$(find /tmp/pianohub/apk -type f -name '*.apk' | head -n1)
          test -n "$APK"
          echo "APK=$APK" >> "$GITHUB_ENV"

      - name: Boot AOSP Android 36 and capture actual UI
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          profile: pixel_6
          target: default
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set -e
            mkdir -p /tmp/pianohub/screenshots
            adb install -r "$APK"
            adb shell am force-stop com.night.pianohub
            adb shell am start -W -n com.night.pianohub/.MainActivity
            sleep 4
            adb shell pidof com.night.pianohub
            adb exec-out screencap -p > /tmp/pianohub/screenshots/01-learn.png
            adb shell uiautomator dump /sdcard/window.xml >/dev/null
            adb pull /sdcard/window.xml /tmp/pianohub/screenshots/01-learn-ui.xml >/dev/null

            SIZE=$(adb shell wm size | tail -n1 | tr -d '\r')
            WIDTH=$(echo "$SIZE" | grep -oE '[0-9]+x[0-9]+' | cut -dx -f1)
            HEIGHT=$(echo "$SIZE" | grep -oE '[0-9]+x[0-9]+' | cut -dx -f2)
            Y=$((HEIGHT * 93 / 100))

            adb shell input tap $((WIDTH * 3 / 10)) "$Y"
            sleep 2
            adb exec-out screencap -p > /tmp/pianohub/screenshots/02-piano.png
            adb shell uiautomator dump /sdcard/window-piano.xml >/dev/null || true
            adb pull /sdcard/window-piano.xml /tmp/pianohub/screenshots/02-piano-ui.xml >/dev/null || true

            adb shell input tap $((WIDTH * 9 / 10)) "$Y"
            sleep 2
            adb exec-out screencap -p > /tmp/pianohub/screenshots/03-settings.png
            adb shell uiautomator dump /sdcard/window-settings.xml >/dev/null || true
            adb pull /sdcard/window-settings.xml /tmp/pianohub/screenshots/03-settings-ui.xml >/dev/null || true

            adb shell dumpsys activity activities | grep -A 4 'mResumedActivity' > /tmp/pianohub/screenshots/activity-state.txt || true
            adb logcat -d -t 500 > /tmp/pianohub/screenshots/logcat-tail.txt
            test -s /tmp/pianohub/screenshots/01-learn.png
            test -s /tmp/pianohub/screenshots/02-piano.png
            test -s /tmp/pianohub/screenshots/03-settings.png

      - name: Upload actual emulator screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pianohub-ui-screenshots-aosp
          path: /tmp/pianohub/screenshots/*
          if-no-files-found: warn
