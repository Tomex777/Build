name: Piano Hub Real Pixel Screenshots

on:
  push:
    branches: ["pianohub-ci"]

permissions:
  actions: read
  contents: read

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download verified Piano Hub APK
        uses: actions/download-artifact@v4
        with:
          name: pianohub-debug-apk
          path: /tmp/pianohub/apk
          repository: Tomex777/Build
          run-id: 34387774146
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Locate APK
        shell: bash
        run: |
          APK=$(find /tmp/pianohub/apk -type f -name '*.apk' | head -n1)
          test -n "$APK"
          echo "APK=$APK" >> "$GITHUB_ENV"

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot full Android 36 Pixel and capture real app UI
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ANDROID_EMULATOR_WAIT_TIME_BEFORE_KILL: 1
        with:
          api-level: 36
          arch: x86_64
          target: default
          profile: pixel_6
          cores: 2
          emulator-boot-timeout: 300
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot-save -no-metrics
          script: |
            mkdir -p /tmp/pianohub/screenshots
            adb install -r "$APK"
            adb shell am force-stop com.night.pianohub
            adb shell am start -W -n com.night.pianohub/.MainActivity
            sleep 5
            adb shell pidof com.night.pianohub
            adb exec-out screencap -p > /tmp/pianohub/screenshots/01-learn.png
            adb shell input tap 324 2232
            sleep 3
            adb exec-out screencap -p > /tmp/pianohub/screenshots/02-piano.png
            adb shell input tap 972 2232
            sleep 3
            adb exec-out screencap -p > /tmp/pianohub/screenshots/03-settings.png
            test -s /tmp/pianohub/screenshots/01-learn.png
            test -s /tmp/pianohub/screenshots/02-piano.png
            test -s /tmp/pianohub/screenshots/03-settings.png

      - name: Upload real screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pianohub-real-ui-screenshots
          path: /tmp/pianohub/screenshots/*.png
          if-no-files-found: error
