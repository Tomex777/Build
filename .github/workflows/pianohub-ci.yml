name: Piano Hub Production 0.3.0 Android Build

on:
  push:
    branches: ["pianohub-ci"]

permissions:
  actions: read
  contents: read

jobs:
  build-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Piano Hub staging branch
        uses: actions/checkout@v4

      - name: Restore checksum-gated Piano Hub 0.3.0 source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/pianohub
          mkdir -p /tmp/pianohub
          test "$(find .ci/pianohub_payload_030_final -maxdepth 1 -name 'part*.txt' | wc -l)" -eq 8
          cat .ci/pianohub_payload_030_final/part*.txt | tr -d '\n' | base64 --decode > /tmp/pianohub-source.tgz
          echo "d4cd1ed269498afdfb111c02be370d61b1108fee3e1de356406a02c0f65200c8  /tmp/pianohub-source.tgz" | sha256sum -c -
          tar -xzf /tmp/pianohub-source.tgz -C /tmp/pianohub
          test -f /tmp/pianohub/settings.gradle.kts
          test -f /tmp/pianohub/app/src/main/java/com/night/pianohub/learner/PerformanceEngine.kt
          test -f /tmp/pianohub/app/src/main/java/com/night/pianohub/instruments/CulturalCatalog.kt
          test -f /tmp/pianohub/app/src/main/java/com/night/pianohub/instruments/InstrumentPack.kt
          test -f /tmp/pianohub/app/src/main/java/com/night/pianohub/instruments/LocalInstrumentPackManager.kt
          test -f /tmp/pianohub/app/src/main/java/com/night/pianohub/ui/screens/SoundsScreen.kt

      - name: Verify production architecture source
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'AndroidKeyStore' /tmp/pianohub/app/src/main/java/com/night/pianohub/storage/PianoHubLocalStore.kt
          grep -q 'ScoreMoment' /tmp/pianohub/app/src/main/java/com/night/pianohub/learner/PerformanceEngine.kt
          grep -q 'InstrumentPackValidator' /tmp/pianohub/app/src/main/java/com/night/pianohub/instruments/InstrumentPack.kt
          grep -q 'LocalInstrumentPackManager' /tmp/pianohub/app/src/main/java/com/night/pianohub/ui/screens/SoundsScreen.kt
          grep -q 'pianoVelocityLayers = listOf(2, 6, 10, 16)' /tmp/pianohub/app/build.gradle.kts
          grep -q '127.0.0.1' /tmp/pianohub/app/src/main/res/xml/network_security_config.xml
          grep -q 'usesCleartextTraffic="false"' /tmp/pianohub/app/src/main/AndroidManifest.xml
          grep -q 'MidiManager' /tmp/pianohub/app/src/main/java/com/night/pianohub/midi/MidiInputManager.kt
          echo 'Piano Hub 0.3.0 production architecture checks passed.'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: "15859902"

      - name: Install compile SDK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --channel=3 "platforms;android-37.0" "build-tools;37.0.0"
          test -f "$ANDROID_SDK_ROOT/platforms/android-37.0/android.jar"

      - name: Run scoring and instrument-pack regression tests
        working-directory: /tmp/pianohub
        run: gradle --stacktrace testDebugUnitTest

      - name: Build Piano Hub 0.3.0 APK
        working-directory: /tmp/pianohub
        run: gradle --stacktrace assembleDebug

      - name: Verify APK contents and real piano layers
        shell: bash
        run: |
          set -euo pipefail
          APK=/tmp/pianohub/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          COUNT=$(unzip -l "$APK" | grep -E 'assets/piano/.*\.mp3$' | wc -l)
          echo "Bundled Yamaha C5 recordings: $COUNT"
          test "$COUNT" -eq 120
          unzip -l "$APK" | grep -q 'classes.dex'

      - name: Package verified source
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/pianohub
          tar --exclude='./.gradle' --exclude='./build' --exclude='./app/build' --exclude='./screenshots' -czf /tmp/pianohub-production-0.3.0-source.tgz .

      - name: Upload verified source
        uses: actions/upload-artifact@v4
        with:
          name: pianohub-production-0.3.0-source
          path: /tmp/pianohub-production-0.3.0-source.tgz
          if-no-files-found: error

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pianohub-production-0.3.0-apk
          path: /tmp/pianohub/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Boot Android 36 and smoke-test Piano Hub 0.3.0
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ANDROID_EMULATOR_WAIT_TIME_BEFORE_KILL: 1
        with:
          api-level: 36
          arch: x86_64
          target: default
          profile: pixel_6
          cores: 2
          emulator-boot-timeout: 300
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot-save -no-metrics
          script: |
            set -euo pipefail
            APK=/tmp/pianohub/app/build/outputs/apk/debug/app-debug.apk
            mkdir -p /tmp/pianohub/screenshots
            adb install -r "$APK"
            adb shell am force-stop com.night.pianohub
            adb shell am start -W -n com.night.pianohub/.MainActivity
            sleep 5
            adb shell pidof com.night.pianohub
            adb exec-out screencap -p > /tmp/pianohub/screenshots/01-learn.png
            test -s /tmp/pianohub/screenshots/01-learn.png
            adb logcat -d -t 500 > /tmp/pianohub/screenshots/logcat-tail.txt
            ! grep -E 'FATAL EXCEPTION.*com\.night\.pianohub|Process: com\.night\.pianohub.*FATAL EXCEPTION' /tmp/pianohub/screenshots/logcat-tail.txt

      - name: Upload runtime proof
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pianohub-production-0.3.0-runtime
          path: /tmp/pianohub/screenshots/*
          if-no-files-found: warn
