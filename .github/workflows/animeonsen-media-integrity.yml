name: AnimeOnsen media integrity

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/animeonsen-media-integrity.yml'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Test resolved AnimeOnsen DASH media
        shell: bash
        run: |
          mkdir -p diagnostics
          python3 - <<'PY'
          import subprocess, json, time, re, urllib.parse, os

          stream='https://cdn.animeonsen.xyz/video/mp4-dash/HjQaSpwuZPFvPqo4/1/manifest.mpd'
          ua='Mozilla/5.0 (Linux; Android 16; SM-A165F) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Mobile Safari/537.36'
          headers=(
              'Referer: https://www.animeonsen.xyz/\r\n'
              'Origin: https://www.animeonsen.xyz\r\n'
              'Accept: */*\r\n'
              'Accept-Language: en-US,en;q=0.9\r\n'
              'Sec-Fetch-Site: same-site\r\n'
              'Sec-Fetch-Mode: cors\r\n'
              'Sec-Fetch-Dest: empty\r\n'
          )
          out={'target':{'host':'cdn.animeonsen.xyz','path':'/video/mp4-dash/HjQaSpwuZPFvPqo4/1/manifest.mpd'}}

          def run(args, timeout):
              t=time.time()
              try:
                  p=subprocess.run(args,capture_output=True,text=True,timeout=timeout)
                  return {'exit':p.returncode,'stdout':p.stdout,'stderr':p.stderr,'wall':round(time.time()-t,2),'timeout':False}
              except subprocess.TimeoutExpired as e:
                  return {'exit':None,'stdout':e.stdout or '','stderr':e.stderr or '','wall':round(time.time()-t,2),'timeout':True}

          # Curl first: confirms exact HTTP response with browser-like request identity.
          curl=run([
              'curl','-L','-sS','--max-time','40','-D','-','-o','/tmp/ao.mpd',
              '-A',ua,
              '-H','Referer: https://www.animeonsen.xyz/',
              '-H','Origin: https://www.animeonsen.xyz',
              '-H','Accept: */*',
              '-H','Sec-Fetch-Site: same-site',
              '-H','Sec-Fetch-Mode: cors',
              '-H','Sec-Fetch-Dest: empty',
              stream
          ],50)
          body=''
          if os.path.exists('/tmp/ao.mpd'):
              body=open('/tmp/ao.mpd','r',errors='ignore').read()
          status_matches=re.findall(r'^HTTP/\S+\s+(\d+)',curl['stdout'],re.M)
          out['http']={
              'exit':curl['exit'],
              'statuses':[int(x) for x in status_matches],
              'finalStatus':int(status_matches[-1]) if status_matches else None,
              'contentType':next((line.split(':',1)[1].strip() for line in curl['stdout'].splitlines() if line.lower().startswith('content-type:')),None),
              'manifestBytes':len(body.encode()),
              'looksLikeMpd':'<MPD' in body,
              'stderr':curl['stderr'][-3000:]
          }

          common=['-user_agent',ua,'-headers',headers]

          probe=run(['ffprobe','-v','error',*common,'-show_streams','-show_format','-of','json',stream],90)
          out['probe']={'exit':probe['exit'],'wall':probe['wall'],'timeout':probe['timeout'],'stderr':probe['stderr'][-6000:]}
          try:
              j=json.loads(probe['stdout'])
              out['probe']['format']={k:j.get('format',{}).get(k) for k in ('format_name','duration','start_time','bit_rate')}
              out['probe']['streams']=[
                  {k:s.get(k) for k in ('index','codec_name','codec_type','profile','width','height','r_frame_rate','avg_frame_rate','sample_rate','channels','bit_rate')}
                  for s in j.get('streams',[])
              ]
          except Exception: pass

          first=run([
              'ffmpeg','-nostdin','-hide_banner','-loglevel','warning',*common,
              '-i',stream,'-t','120','-map','0:v:0?','-map','0:a:0?','-f','null','-'
          ],220)
          out['decodeFirst']={
              'seconds':120,'exit':first['exit'],'wall':first['wall'],'timeout':first['timeout'],
              'warnings':first['stderr'][-12000:]
          }

          late=run([
              'ffmpeg','-nostdin','-hide_banner','-loglevel','warning',*common,
              '-ss','600','-i',stream,'-t','60','-map','0:v:0?','-map','0:a:0?','-f','null','-'
          ],220)
          out['decodeLate']={
              'seekSeconds':600,'seconds':60,'exit':late['exit'],'wall':late['wall'],'timeout':late['timeout'],
              'warnings':late['stderr'][-12000:]
          }

          packets=run([
              'ffprobe','-v','error',*common,'-read_intervals','%+120',
              '-show_packets','-show_entries','packet=stream_index,pts_time,dts_time,duration_time',
              '-of','json',stream
          ],160)
          out['packets']={'exit':packets['exit'],'timeout':packets['timeout'],'stderr':packets['stderr'][-5000:]}
          if packets['exit']==0:
              try:
                  rows=json.loads(packets['stdout']).get('packets',[])
                  by={}
                  for row in rows:
                      raw=row.get('dts_time',row.get('pts_time'))
                      try:t=float(raw)
                      except:continue
                      by.setdefault(str(row.get('stream_index')),[]).append(t)
                  stats={}
                  for k,ts in by.items():
                      gaps=[]
                      backwards=0
                      for a,b in zip(ts,ts[1:]):
                          d=b-a
                          if d < -0.0001: backwards+=1
                          else:gaps.append(d)
                      stats[k]={
                          'packets':len(ts),
                          'backwardTimestampCount':backwards,
                          'maxForwardGapSeconds':max(gaps) if gaps else None,
                          'p99ForwardGapSeconds':sorted(gaps)[int(len(gaps)*0.99)] if gaps else None
                      }
                  out['packets']['stats']=stats
              except Exception as e:
                  out['packets']['parseError']=repr(e)

          json.dump(out,open('diagnostics/animeonsen-media-integrity.json','w'),indent=2)
          print(json.dumps(out,indent=2)[:80000])
          PY

      - name: Commit result
        if: always()
        run: |
          test -f diagnostics/animeonsen-media-integrity.json || echo '{"error":"probe did not produce result"}' > diagnostics/animeonsen-media-integrity.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add diagnostics/animeonsen-media-integrity.json
          git commit -m "record AnimeOnsen media integrity" || true
          git push || true
