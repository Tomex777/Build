name: MangaDex API image E2E

on:
  push:
    branches: [vidbox-e2e-probe-20260929]
    paths:
      - '.github/workflows/mangadex-api-image-e2e.yml'

permissions:
  contents: read

jobs:
  mangadex:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Search feed at-home and image bytes
        shell: bash
        run: |
          mkdir -p proof
          cat > mangadex.mjs <<'NODE'
          import fs from 'node:fs';
          const UA='ExtensionAPIs-E2E/1.0';
          const get=async u=>{
            const r=await fetch(u,{headers:{'User-Agent':UA,'Accept':'application/json'}});
            const text=await r.text();let body;try{body=JSON.parse(text)}catch{body=text}
            return {status:r.status,url:r.url,headers:Object.fromEntries(r.headers),body};
          };
          const out={query:'One Piece',attempts:[]};
          const imageMagic=b=>{
            const h=b.subarray(0,16).toString('hex');
            if(h.startsWith('ffd8ff'))return 'jpeg';
            if(h.startsWith('89504e470d0a1a0a'))return 'png';
            if(b.subarray(0,4).toString('ascii')==='RIFF'&&b.subarray(8,12).toString('ascii')==='WEBP')return 'webp';
            return null;
          };
          try{
            const s=await get('https://api.mangadex.org/manga?title=One%20Piece&limit=10&contentRating[]=safe&order[relevance]=desc');
            out.searchStatus=s.status;out.searchCount=Array.isArray(s.body?.data)?s.body.data.length:0;
            if(!out.searchCount)throw new Error('No search results');

            let chosen=null,feed=null;
            for(const manga of s.body.data){
              const titles=[...Object.values(manga.attributes?.title||{}),...(manga.attributes?.altTitles||[]).flatMap(x=>Object.values(x||{}))];
              let f=await get('https://api.mangadex.org/manga/'+manga.id+'/feed?limit=100&translatedLanguage[]=en&order[chapter]=desc&includeFutureUpdates=0&includeExternalUrl=0');
              let rows=Array.isArray(f.body?.data)?f.body.data.filter(x=>!x.attributes?.externalUrl):[];
              let mode='en';
              if(!rows.length){
                f=await get('https://api.mangadex.org/manga/'+manga.id+'/feed?limit=100&order[chapter]=desc&includeFutureUpdates=0&includeExternalUrl=0');
                rows=Array.isArray(f.body?.data)?f.body.data.filter(x=>!x.attributes?.externalUrl):[];
                mode='any-language';
              }
              out.attempts.push({mangaId:manga.id,titles:titles.slice(0,8),feedStatus:f.status,feedCount:rows.length,mode});
              if(rows.length){chosen=manga;feed={response:f,rows,mode};break}
            }
            if(!chosen||!feed)throw new Error('Search worked but no result had readable chapters');

            out.mangaId=chosen.id;out.title=chosen.attributes?.title;
            out.feedStatus=feed.response.status;out.feedCount=feed.rows.length;out.feedMode=feed.mode;

            let proof=null;
            for(const ch of feed.rows.slice(0,30)){
              const a=await get('https://api.mangadex.org/at-home/server/'+ch.id);
              if(a.status!==200||!a.body?.baseUrl||!a.body?.chapter?.hash||!a.body?.chapter?.data?.length)continue;
              const file=a.body.chapter.data[0];
              const url=a.body.baseUrl+'/data/'+a.body.chapter.hash+'/'+file;
              const ir=await fetch(url,{headers:{'User-Agent':UA,'Referer':'https://mangadex.org/'}});
              const b=Buffer.from(await ir.arrayBuffer());
              const magic=imageMagic(b);
              proof={
                chapterId:ch.id,
                chapter:ch.attributes?.chapter,
                translatedLanguage:ch.attributes?.translatedLanguage,
                atHomeStatus:a.status,
                pageStatus:ir.status,
                bytes:b.length,
                contentType:ir.headers.get('content-type'),
                magic,
                pageCount:a.body.chapter.data.length,
                host:new URL(url).host
              };
              proof.pass=ir.status===200&&b.length>10000&&Boolean(magic);
              if(proof.pass)break;
            }
            out.proof=proof;out.pass=Boolean(proof?.pass);
          }catch(e){out.error=String(e);out.pass=false}
          fs.writeFileSync('proof/result.json',JSON.stringify(out,null,2));
          console.log(JSON.stringify(out,null,2));
          if(!out.pass)process.exitCode=2;
          NODE
          node mangadex.mjs

      - name: Upload proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mangadex-api-image-e2e-proof
          path: proof/result.json
          if-no-files-found: error
