name: MirrorChess v1.2 verification

on:
  push:
    branches:
      - verify/mirrorchess-v12-20260909
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out verification branch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 SDK and emulator
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "emulator" \
            "system-images;android-36;google_apis;x86_64"

      - name: Compile, unit test, lint, and package
        working-directory: mirrorchess-v12/source
        run: |
          chmod +x gradlew scripts/run-core-smoke.sh
          ./gradlew --no-daemon \
            :app:testDebugUnitTest \
            :app:lintDebug \
            :app:assembleDebug \
            --stacktrace

      - name: Download and verify pinned Maia model
        run: |
          mkdir -p verified-model
          curl --fail --location --retry 3 --retry-delay 4 \
            'https://huggingface.co/bqrio/maia3-onnx/resolve/f2582c005a63a034e493d93736ecdd6291dd82e7/maia3-5m.fp16.onnx?download=true' \
            --output verified-model/maia3-5m.fp16.onnx
          echo 'ca22fc3031975932e693f9758149302efc177749165443ed52de828add8864fa  verified-model/maia3-5m.fp16.onnx' \
            | sha256sum -c -

      - name: Boot Android 36 emulator
        run: |
          export ANDROID_AVD_HOME="$GITHUB_WORKSPACE/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | avdmanager create avd \
            --force \
            --name mirrorchess-v12 \
            --package "system-images;android-36;google_apis;x86_64" \
            --device pixel_2
          printf '\ndisk.dataPartition.size=3G\nhw.ramSize=3072\n' \
            >> "$ANDROID_AVD_HOME/mirrorchess-v12.avd/config.ini"
          sudo chmod 666 /dev/kvm || true
          nohup "$ANDROID_HOME/emulator/emulator" @mirrorchess-v12 \
            -no-window \
            -noaudio \
            -no-boot-anim \
            -no-snapshot \
            -wipe-data \
            -partition-size 3072 \
            -gpu swiftshader_indirect \
            > "$GITHUB_WORKSPACE/emulator.log" 2>&1 &
          emulator_pid=$!
          booted=0
          for attempt in {1..120}; do
            if ! kill -0 "$emulator_pid" 2>/dev/null; then
              cat "$GITHUB_WORKSPACE/emulator.log"
              exit 1
            fi
            if [[ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" == "1" ]]; then
              booted=1
              break
            fi
            sleep 5
          done
          test "$booted" = 1
          package_ready=0
          for attempt in {1..120}; do
            if adb shell service check package 2>/dev/null | grep -q found \
              && adb shell pm path android >/dev/null 2>&1; then
              package_ready=1
              break
            fi
            sleep 5
          done
          test "$package_ready" = 1
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb shell settings put global hide_error_dialogs 1
          adb shell settings put global anr_show_background 0
          adb shell settings put global verifier_verify_adb_installs 0
          adb shell settings put global package_verifier_enable 0
          adb shell input keyevent KEYCODE_WAKEUP
          adb shell wm dismiss-keyguard || true
          adb shell input keyevent 82 || true
          adb shell input keyevent KEYCODE_HOME
          sleep 15

      - name: Install APK and verified Maia model
        run: |
          source_apk='mirrorchess-v12/source/app/build/outputs/apk/debug/app-debug.apk'
          test -f "$source_apk"
          cp "$source_apk" "$RUNNER_TEMP/mirrorchess-v12-x86_64-unsigned.apk"
          zip -d "$RUNNER_TEMP/mirrorchess-v12-x86_64-unsigned.apk" \
            'lib/arm64-v8a/*' 'lib/armeabi-v7a/*' 'lib/x86/*'
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -f 4 \
            "$RUNNER_TEMP/mirrorchess-v12-x86_64-unsigned.apk" \
            "$RUNNER_TEMP/mirrorchess-v12-x86_64-aligned.apk"
          keytool -genkeypair -noprompt \
            -keystore "$RUNNER_TEMP/runtime-debug.keystore" \
            -storepass android -keypass android -alias androiddebugkey \
            -dname 'CN=Android Debug,O=Android,C=US' \
            -keyalg RSA -keysize 2048 -validity 10000
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
            --ks "$RUNNER_TEMP/runtime-debug.keystore" \
            --ks-pass pass:android --key-pass pass:android \
            --out "$RUNNER_TEMP/mirrorchess-v12-x86_64.apk" \
            "$RUNNER_TEMP/mirrorchess-v12-x86_64-aligned.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify \
            "$RUNNER_TEMP/mirrorchess-v12-x86_64.apk"
          timeout 240 adb install -r -g "$RUNNER_TEMP/mirrorchess-v12-x86_64.apk"
          adb shell run-as com.night.mirrorchess mkdir -p files/models
          adb push verified-model/maia3-5m.fp16.onnx /data/local/tmp/maia3-5m.fp16.onnx
          adb shell chmod 644 /data/local/tmp/maia3-5m.fp16.onnx
          adb shell run-as com.night.mirrorchess cp \
            /data/local/tmp/maia3-5m.fp16.onnx \
            files/models/maia3-5m.fp16.onnx

      - name: Exercise app and capture every screen
        timeout-minutes: 15
        run: |
          set -euo pipefail
          mkdir -p verification/screens verification/ui

          dump_ui() {
            for attempt in {1..5}; do
              adb shell input keyevent KEYCODE_WAKEUP || true
              adb shell wm dismiss-keyguard || true
              adb shell rm -f /sdcard/window.xml || true
              if timeout 12 adb shell uiautomator dump /sdcard/window.xml >/dev/null 2>&1 \
                && timeout 12 adb pull /sdcard/window.xml verification/current.xml >/dev/null 2>&1 \
                && grep -q '<hierarchy' verification/current.xml; then
                return 0
              fi
              sleep 2
            done
            return 1
          }

          wait_for_text() {
            local needle="$1"
            for attempt in {1..30}; do
              if dump_ui && grep -Fq "$needle" verification/current.xml; then return 0; fi
              sleep 2
            done
            echo "Timed out waiting for: $needle" >&2
            return 1
          }

          tap_match() {
            local needle="$1"
            local mode="${2:-exact}"
            local pick="${3:-first}"
            dump_ui
            local coords
            coords="$(python3 - "$needle" "$mode" "$pick" verification/current.xml <<'PY'
          import re
          import sys
          import xml.etree.ElementTree as ET

          needle, mode, pick, path = sys.argv[1:]
          matches = []
          for node in ET.parse(path).getroot().iter('node'):
              values = (node.attrib.get('text', ''), node.attrib.get('content-desc', ''))
              found = any(v == needle for v in values) if mode == 'exact' else any(needle in v for v in values)
              bounds = re.fullmatch(r'\[(\d+),(\d+)\]\[(\d+),(\d+)\]', node.attrib.get('bounds', ''))
              if found and bounds:
                  x1, y1, x2, y2 = map(int, bounds.groups())
                  matches.append(((x1 + x2) // 2, (y1 + y2) // 2))
          if not matches:
              raise SystemExit(f'Could not find UI match: {needle!r}')
          print(*(matches[-1] if pick == 'last' else matches[0]))
          PY
            )"
            read -r x y <<< "$coords"
            adb shell input tap "$x" "$y"
            sleep 2
          }

          shot() {
            local name="$1"
            sleep 2
            timeout 15 adb exec-out screencap -p > "verification/screens/${name}.png"
            dump_ui
            cp verification/current.xml "verification/ui/${name}.xml"
          }

          adb logcat -c
          adb shell am force-stop com.night.mirrorchess
          adb shell am start -W -n com.night.mirrorchess/.MainActivity | tee verification/launch.txt
          grep -q 'Status: ok' verification/launch.txt
          wait_for_text 'MirrorChess'
          shot 01-play-home

          tap_match 'Mirror · 0%'
          shot 02-play-mirror-learning
          tap_match '1800' exact first

          tap_match 'Settings'
          shot 03-settings-main
          tap_match 'AI Model'
          wait_for_text 'INSTALLED &amp; READY'
          shot 04-ai-model-installed
          tap_match 'Back'
          tap_match 'Mirror Me'
          shot 05-mirror-learning
          tap_match 'Back'
          tap_match 'Board & Pieces'
          shot 06-board-pieces-top
          adb shell input swipe 540 1500 540 760 450
          shot 07-board-pieces-bottom
          tap_match 'Back'
          tap_match 'Gameplay'
          shot 08-gameplay
          tap_match 'Back'
          tap_match 'Coach'
          shot 09-coach
          tap_match 'Back'
          tap_match 'Game Data'
          shot 10-game-data
          tap_match 'Back'
          tap_match 'About & Privacy'
          shot 11-about-night
          tap_match 'Back'
          tap_match 'Back'

          tap_match 'Start game'
          wait_for_text 'MOVE HISTORY'
          shot 12-game-initial
          tap_match 'e2, white pawn' contains
          wait_for_text 'legal move'
          shot 13-legal-moves
          tap_match 'e4, empty, legal move' contains
          wait_for_text 'Maia-3 5M · on-device'
          shot 14-game-after-move-with-maia-coach

          adb shell am force-stop com.night.mirrorchess
          adb shell am start -W -n com.night.mirrorchess/.MainActivity > verification/relaunch.txt
          wait_for_text 'Resume game'
          shot 15-active-game-recovered
          tap_match 'Resume game'
          wait_for_text 'More game actions'
          shot 16-resumed-position

          tap_match 'More game actions'
          tap_match 'Undo move'
          wait_for_text 'MOVE HISTORY'
          dump_ui
          grep -Fq 'e2, white pawn' verification/current.xml
          shot 17-full-turn-undo

          tap_match 'e2, white pawn' contains
          tap_match 'e4, empty, legal move' contains
          wait_for_text 'Maia-3 5M · on-device'
          tap_match 'More game actions'
          shot 18-game-actions
          tap_match 'Resign'
          shot 19-resign-confirmation
          tap_match 'Resign'
          wait_for_text 'You resigned'
          shot 20-game-over
          tap_match 'Done'
          wait_for_text 'RECENT GAMES'
          shot 21-play-with-recent-game

          tap_match 'Maia 1800' exact last
          wait_for_text 'GAME REVIEW'
          shot 22-review-final-position
          tap_match 'Previous'
          tap_match 'Previous'
          wait_for_text 'Starting position'
          shot 23-review-starting-position

          adb shell dumpsys activity activities > verification/activity.txt
          adb logcat -d > verification/logcat.txt
          if grep -A 40 'FATAL EXCEPTION' verification/logcat.txt | grep -q 'com.night.mirrorchess'; then
            echo 'MirrorChess crashed during emulator verification' >&2
            exit 1
          fi
          adb shell pidof com.night.mirrorchess > verification/pid.txt
          test -s verification/pid.txt

          cat > verification/README.txt <<'EOF'
          MirrorChess 1.2.0 — Night
          Fresh Android 36 emulator captures from the exact verified source.
          The checksum-pinned Maia-3 5M ONNX model was installed before launch.
          The tour verifies settings, model detection, legal-move interaction,
          real Maia inference and coach output, process-death recovery, full-turn
          undo, resignation, archive creation, and position-by-position review.
          EOF

      - name: Upload verified build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mirrorchess-v12-build
          if-no-files-found: warn
          retention-days: 14
          path: |
            mirrorchess-v12/source/app/build/outputs/apk/debug/app-debug.apk
            mirrorchess-v12/source/app/build/reports/

      - name: Upload emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mirrorchess-v12-visual-tour
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0
          path: |
            verification/
            emulator.log

      - name: Upload verified Maia model
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: maia3-5m-fp16-verified-v12
          retention-days: 14
          compression-level: 0
          path: verified-model/maia3-5m.fp16.onnx
