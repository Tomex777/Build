name: EchoSpace Android emulator QA

on:
  push:
    branches:
      - feature/echospace-emulator-qa
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emulator-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # The GitHub Ubuntu runner already provides Android SDK and sdkmanager.
      # setup-android@v3 currently fails by requesting removed legacy 'tools'.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Extract EchoSpace native source
        run: |
          tar -xJf EchoSpace/source.tar.xz
          test -f EchoSpace/app/src/main/java/com/nexa/echospace/MainActivity.kt
      - name: Install Android build tools
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)
          test -n "$SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compile and run Kotlin unit tests
        working-directory: EchoSpace
        run: gradle --no-daemon --stacktrace testDebugUnitTest assembleDebug
      - name: Enable emulator acceleration
        run: |
          ls -la /dev/kvm || true
          sudo chmod 666 /dev/kvm || true
      - name: Boot emulator and inspect real Android app
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          cores: 2
          ram-size: 2048M
          disk-size: 4096M
          disable-animations: true
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect
          script: |
            set -e
            mkdir -p qa
            adb install -r EchoSpace/app/build/outputs/apk/debug/app-debug.apk
            adb shell pm grant com.nexa.echospace android.permission.POST_NOTIFICATIONS
            adb shell settings put system screen_off_timeout 600000
            adb shell am start -W -n com.nexa.echospace/.MainActivity
            sleep 8
            python3 EchoSpace/tools/emulator_probe.py assert text EchoSpace
            adb shell screencap -p /sdcard/launch.png
            adb pull /sdcard/launch.png qa/01-launch.png
            python3 EchoSpace/tools/emulator_probe.py tap desc Play
            sleep 4
            python3 EchoSpace/tools/emulator_probe.py assert text Listening
            adb shell screencap -p /sdcard/play.png
            adb pull /sdcard/play.png qa/02-playing.png
            python3 EchoSpace/tools/emulator_probe.py tap text 'Deep Forest'
            sleep 4
            python3 EchoSpace/tools/emulator_probe.py assert text 'Deep Forest'
            python3 EchoSpace/tools/emulator_probe.py assert desc 'Mute Birdsong'
            adb shell screencap -p /sdcard/forest.png
            adb pull /sdcard/forest.png qa/03-deep-forest.png
            python3 EchoSpace/tools/emulator_probe.py tap desc 'Mute Birdsong'
            sleep 1
            python3 EchoSpace/tools/emulator_probe.py assert text Muted
            python3 EchoSpace/tools/emulator_probe.py tap desc 'Unmute Birdsong'
            python3 EchoSpace/tools/emulator_probe.py tap desc 'Add a sound'
            sleep 2
            python3 EchoSpace/tools/emulator_probe.py assert text 'Add a sound'
            adb shell screencap -p /sdcard/sheet.png
            adb pull /sdcard/sheet.png qa/04-add-sound.png
            python3 EchoSpace/tools/emulator_probe.py tap text Fire
            sleep 1
            python3 EchoSpace/tools/emulator_probe.py assert desc 'Mute Fire'
            adb shell screencap -p /sdcard/added.png
            adb pull /sdcard/added.png qa/05-added-source.png
            if cmp -s qa/01-launch.png qa/03-deep-forest.png; then echo 'Preset change invisible'; exit 1; fi
            adb shell logcat -d -v brief -s AndroidRuntime:E > qa/android-crashes.log
            if grep -q 'FATAL EXCEPTION' qa/android-crashes.log; then cat qa/android-crashes.log; exit 1; fi
            adb shell pidof com.nexa.echospace
            echo 'EMULATOR_QA_COMPLETE'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: EchoSpace-emulator-screenshots
          path: qa/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: EchoSpace-debug-apk
          path: EchoSpace/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
