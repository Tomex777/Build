name: NIGHT Browser Android Prototype

on:
  push:
    branches: [feature/night-browser-prototype-20261019, feature/night-browser-multi-agent-20261020]
    paths:
      - 'night-browser/**'
      - '.github/workflows/night-browser-android.yml'
  pull_request:
    branches: [main, feature/night-browser-prototype-20261019, feature/night-browser-multi-agent-20261020]
    paths:
      - 'night-browser/**'
      - '.github/workflows/night-browser-android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Verify Browser integration invariants and guard tests
        run: |
          python3 -m unittest discover -s night-browser/ci -p 'test_integration_guard.py' -v
          python3 night-browser/ci/integration_guard.py
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-37.1 build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'
      - name: Check pure Kotlin tests and compile native debug app
        run: gradle --no-daemon --stacktrace -p night-browser :app:testDebugUnitTest :app:assembleDebug
      - name: Upload installable prototype APK
        uses: actions/upload-artifact@v4
        with:
          name: night-browser-android-arm64-debug
          path: night-browser/app/build/outputs/apk/debug/app-arm64-v8a-debug.apk
          if-no-files-found: error
