name: Sora Anime Manga Source Resume CI

on:
  push:
    branches: [sora-media-ci]
    paths:
      - 'sora-ci/anime-manga-source-resume-trigger.txt'
  workflow_dispatch:

jobs:
  source-resume:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4

      - name: Guard production source separation
        run: |
          set -euo pipefail
          SERVICE='sora-overlay/test-extension/src/main/java/com/night/sora/testextension/DemoExtensionService.kt'
          MANAGER='sora-overlay/app/src/main/java/com/night/sora/extension/ExtensionManager.kt'
          MEDIA='sora-overlay/app/src/main/java/com/night/sora/ui/screens/MediaScreen.kt'
          grep -q '"diagnostic"' "$SERVICE"
          grep -q 'sora.core.anilist' "$MANAGER"
          grep -q 'sora.core.anilist' "$MEDIA"
          ! grep -q 'sora.core.jikan' "$MANAGER" "$MEDIA"

      - name: Reconstruct Sora source
        run: |
          set -euo pipefail
          rm -rf /tmp/sora-src /tmp/sora.zip
          cat sora-ci/chunks/part-*.txt | base64 -d > /tmp/sora.zip
          unzip -q /tmp/sora.zip -d /tmp/sora-src
          ROOT=/tmp/sora-src/Sora_Android_v0_1
          test -f "$ROOT/settings.gradle.kts"
          cp -R sora-overlay/. "$ROOT/"
          echo "SORA_ROOT=$ROOT" >> "$GITHUB_ENV"

      - name: Promote demo as CI-only consumption source
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path('/tmp/sora-src/Sora_Android_v0_1')

          service = root / 'test-extension/src/main/java/com/night/sora/testextension/DemoExtensionService.kt'
          s = service.read_text()
          old = 'capabilities = setOf("diagnostic", "browse", "search", "details", "episodes", "chapters", "pages", "streams", "lyrics", "relatedArtists", "feed")'
          new = 'capabilities = setOf("browse", "search", "details", "episodes", "chapters", "pages", "streams", "lyrics", "relatedArtists", "feed")'
          if s.count(old) != 1:
              raise SystemExit('demo diagnostic capability marker mismatch')
          service.write_text(s.replace(old, new, 1))

          catalog = root / 'test-extension/src/main/java/com/night/sora/testextension/DemoCatalog.kt'
          s = catalog.read_text()
          marker = '        val types = if (type.isBlank()) listOf("anime", "manga", "movie", "tv", "music", "memes") else listOf(type)\n'
          insertion = '''        if (q.isNotBlank() && (type == "anime" || type == "manga")) {
              return JSONArray().put(
                  item("ci-$type-${q.hashCode()}", query.trim(), "CI exact source match", "")
              ).toString()
          }
          '''
          if s.count(marker) != 1:
              raise SystemExit('demo search marker mismatch')

          s = s.replace(
              '"https://example.invalid/$chapterId/page-${index + 1}.jpg"',
              '"http://10.0.2.2:8765/pages/${chapterId}-${index + 1}.jpg"',
          )
          s = s.replace(
              '"https://storage.googleapis.com/exoplayer-test-media-0/play.mp3"',
              '"http://10.0.2.2:8765/media/video.mp4"',
          ).replace(
              '.put("mimeType", "audio/mpeg")',
              '.put("mimeType", "video/mp4")',
          ).replace(
              '.put("label", "Test MP3")',
              '.put("label", "Aniyomi CI Video")',
          )
          catalog.write_text(s.replace(marker, marker + insertion, 1))

          anilist = root / 'app/src/main/java/com/night/sora/catalog/AniListCatalogClient.kt'
          s = anilist.read_text()
          old_url = 'private const val BASE_URL = "https://graphql.anilist.co"'
          new_url = 'private const val BASE_URL = "http://10.0.2.2:8765/graphql"'
          if s.count(old_url) != 1:
              raise SystemExit('AniList BASE_URL marker mismatch')
          anilist.write_text(s.replace(old_url, new_url, 1))

          manifest = root / 'app/src/main/AndroidManifest.xml'
          s = manifest.read_text()
          if 'android:usesCleartextTraffic=' not in s:
              if '<application' not in s:
                  raise SystemExit('application tag missing from manifest')
              s = s.replace('<application', '<application android:usesCleartextTraffic="true"', 1)
          manifest.write_text(s)
          PY

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 36 SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Build Core and CI source APK
        working-directory: /tmp/sora-src/Sora_Android_v0_1
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if gradle --stacktrace :app:assembleDebug :test-extension:assembleDebug; then
              exit 0
            fi
            if [[ "$attempt" -lt 3 ]]; then
              echo "Gradle build attempt $attempt failed; retrying after transient repository/network failure."
              sleep $((attempt * 10))
            fi
          done
          exit 1

      - name: Record packaged native media libraries
        run: |
          set -euo pipefail
          OUT=/tmp/sora-anime-manga-source-resume
          mkdir -p "$OUT"
          APK="$SORA_ROOT/app/build/outputs/apk/debug/app-debug.apk"
          unzip -l "$APK" | awk '/lib\/.*\.so$/ {print $4}' | sort > "$OUT/native-libs.txt"
          echo '=== x86_64 media libraries ==='
          grep '^lib/x86_64/' "$OUT/native-libs.txt" | grep -E 'lib(mpv|player|avcodec|avformat|avutil|avfilter|avdevice|swresample|swscale|c\+\+_shared)\.so$' || true
          echo '=== all ABI counts ==='
          awk -F/ '/^lib\// {count[$2]++} END {for (abi in count) print abi, count[abi]}' "$OUT/native-libs.txt" | sort

      - name: Prepare deterministic Aniyomi engine fixtures
        run: |
          set -euo pipefail
          FIXTURE=/tmp/sora-engine-fixture
          OUT=/tmp/sora-anime-manga-source-resume
          mkdir -p "$FIXTURE" "$OUT"

          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi

          if ! ffmpeg -y -loglevel error             -f lavfi -i "testsrc=size=320x180:rate=24"             -f lavfi -i "sine=frequency=440:sample_rate=44100"             -t 45 -c:v libx264 -preset ultrafast -pix_fmt yuv420p             -c:a aac -b:a 96k -shortest "$FIXTURE/video.mp4"; then
            ffmpeg -y -loglevel error               -f lavfi -i "testsrc=size=320x180:rate=24"               -f lavfi -i "sine=frequency=440:sample_rate=44100"               -t 45 -c:v mpeg4 -q:v 5 -pix_fmt yuv420p               -c:a aac -b:a 96k -shortest "$FIXTURE/video.mp4"
          fi

          # A colored synthetic page makes successful reader image rendering
          # obvious in the uploaded emulator screenshots. It is only a CI asset.
          ffmpeg -y -loglevel error \
            -f lavfi -i "color=c=0xF2E8D5:s=900x1400:d=1" \
            -vf "drawbox=x=30:y=30:w=840:h=90:color=0x372A38:t=fill,drawbox=x=80:y=180:w=350:h=380:color=0xF08080:t=fill,drawbox=x=470:y=180:w=350:h=380:color=0x78A9CF:t=fill,drawbox=x=80:y=620:w=740:h=250:color=0xFFC857:t=fill,drawbox=x=80:y=930:w=350:h=300:color=0x8BC79D:t=fill,drawbox=x=470:y=930:w=350:h=300:color=0xBB9BD6:t=fill" \
            -frames:v 1 "$FIXTURE/page.jpg"

          test -s "$FIXTURE/video.mp4"
          test -s "$FIXTURE/page.jpg"

          ffprobe -v error -show_entries format=duration             -of default=noprint_wrappers=1:nokey=1 "$FIXTURE/video.mp4"             | tee "$OUT/fixture-video-duration.txt"

          nohup env SORA_ENGINE_FIXTURE_ROOT="$FIXTURE"             python3 "$GITHUB_WORKSPACE/sora-ci/aniyomi-media-fixture-server.py"             > "$OUT/fixture-server.log" 2>&1 &
          echo $! > "$OUT/fixture-server.pid"

          for attempt in {1..20}; do
            if curl -fsS http://127.0.0.1:8765/health | grep -q '^ok$'; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8765/health | grep -q '^ok$'

          curl -fsS -H 'Range: bytes=0-1023'             http://127.0.0.1:8765/media/video.mp4             -o "$OUT/range-probe.bin"
          test "$(stat -c%s "$OUT/range-probe.bin")" -eq 1024

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Prove Anime Manga source and exact resume
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash "$GITHUB_WORKSPACE/sora-ci/anime-manga-source-resume-smoke.sh"

      - name: Upload source resume diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sora-anime-manga-source-resume
          path: /tmp/sora-anime-manga-source-resume
          if-no-files-found: warn
          retention-days: 5

      - name: Require full source resume validation
        if: always()
        run: test -f /tmp/sora-anime-manga-source-resume/FULL_SOURCE_RESUME_PASS
