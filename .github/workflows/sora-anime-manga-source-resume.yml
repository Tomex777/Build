name: Sora Anime Manga Source Resume CI

on:
  push:
    branches: [sora-media-ci]
    paths:
      - 'sora-ci/anime-manga-source-resume-trigger.txt'
  workflow_dispatch:

jobs:
  source-resume:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Guard production source separation
        run: |
          set -euo pipefail
          SERVICE='sora-overlay/test-extension/src/main/java/com/night/sora/testextension/DemoExtensionService.kt'
          MANAGER='sora-overlay/app/src/main/java/com/night/sora/extension/ExtensionManager.kt'
          MEDIA='sora-overlay/app/src/main/java/com/night/sora/ui/screens/MediaScreen.kt'
          grep -q '"diagnostic"' "$SERVICE"
          grep -q 'sora.core.anilist' "$MANAGER"
          grep -q 'sora.core.anilist' "$MEDIA"
          ! grep -q 'sora.core.jikan' "$MANAGER" "$MEDIA"

      - name: Reconstruct Sora source
        run: |
          rm -rf /tmp/sora-src /tmp/sora.zip
          cat sora-ci/chunks/part-*.txt | base64 -d > /tmp/sora.zip
          unzip -q /tmp/sora.zip -d /tmp/sora-src
          ROOT=/tmp/sora-src/Sora_Android_v0_1
          test -f "$ROOT/settings.gradle.kts"
          cp -R sora-overlay/. "$ROOT/"
          echo "SORA_ROOT=$ROOT" >> "$GITHUB_ENV"

      - name: Promote demo as CI-only consumption source
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root=Path('/tmp/sora-src/Sora_Android_v0_1')
          service=root/'test-extension/src/main/java/com/night/sora/testextension/DemoExtensionService.kt'
          s=service.read_text()
          old='capabilities = setOf("diagnostic", "browse", "search", "details", "episodes", "chapters", "pages", "streams", "lyrics", "relatedArtists", "feed")'
          new='capabilities = setOf("browse", "search", "details", "episodes", "chapters", "pages", "streams", "lyrics", "relatedArtists", "feed")'
          if s.count(old) != 1:
              raise SystemExit('demo diagnostic capability marker mismatch')
          service.write_text(s.replace(old,new,1))

          catalog=root/'test-extension/src/main/java/com/night/sora/testextension/DemoCatalog.kt'
          s=catalog.read_text()
          marker='        val types = if (type.isBlank()) listOf("anime", "manga", "movie", "tv", "music", "memes") else listOf(type)\n'
          insertion='''        if (q.isNotBlank() && (type == "anime" || type == "manga")) {
              return JSONArray().put(
                  item("ci-$type-${q.hashCode()}", query.trim(), "CI exact source match", "")
              ).toString()
          }
          '''
          if s.count(marker) != 1:
              raise SystemExit('demo search marker mismatch')
          s=s.replace(
              '"https://example.invalid/$chapterId/page-${index + 1}.jpg"',
              '"https://picsum.photos/seed/${chapterId}-${index + 1}/900/1400"',
          )
          s=s.replace(
              '"https://storage.googleapis.com/exoplayer-test-media-0/play.mp3"',
              '"https://storage.googleapis.com/exoplayer-test-media-0/BigBuckBunny_320x180.mp4"',
          ).replace(
              '.put("mimeType", "audio/mpeg")',
              '.put("mimeType", "video/mp4")',
          ).replace(
              '.put("label", "Test MP3")',
              '.put("label", "Aniyomi CI Video")',
          )
          catalog.write_text(s.replace(marker, marker+insertion, 1))
          PY

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 36 SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Build Core and CI source APK
        working-directory: /tmp/sora-src/Sora_Android_v0_1
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if gradle --stacktrace :app:assembleDebug :test-extension:assembleDebug; then
              exit 0
            fi
            if [[ "$attempt" -lt 3 ]]; then
              echo "Gradle build attempt $attempt failed; retrying after transient repository/network failure."
              sleep $((attempt * 10))
            fi
          done
          exit 1

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Prove Anime Manga source and exact resume
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash "$GITHUB_WORKSPACE/sora-ci/anime-manga-source-resume-smoke.sh"

      - name: Upload source resume screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sora-anime-manga-source-resume
          path: /tmp/sora-anime-manga-source-resume
          if-no-files-found: warn
          retention-days: 5

      - name: Require full source resume validation
        if: always()
        run: test -f /tmp/sora-anime-manga-source-resume/FULL_SOURCE_RESUME_PASS
