name: NIGHT Naruto card candidates (preview only)

on:
  push:
    branches: [feature/cards-naruto-20261020]
    paths:
      - 'cards/catalog/naruto*'
      - 'cards/bin/seed-naruto.mjs'
      - 'cards/bin/naruto-gallery.mjs'
      - 'cards/tests/naruto-sources.test.mjs'
      - 'cards/docs/NARUTO.md'
      - 'cards/src/**'
      - '.github/workflows/cards-naruto.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: night-cards-naruto-${{ github.ref }}
  cancel-in-progress: true

jobs:
  candidate-cards:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    defaults:
      run:
        working-directory: cards
    steps:
      - name: Checkout exact candidate branch
        uses: actions/checkout@v5
        with:
          persist-credentials: true
      - name: Node 24 for pinned renderer
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: cards/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Acquire and fingerprint exact official Naruto transparent portraits
        run: node bin/seed-naruto.mjs --write-lock
      - name: Run full card library and Naruto identity tests
        run: npm test
      - name: Install OS packages for Chromium reference renderer
        run: npx playwright install-deps chromium
      - name: Install pinned reference Chrome 131
        run: |
          curl --fail --location --retry 3 \
            https://storage.googleapis.com/chrome-for-testing-public/131.0.6778.204/linux64/chrome-headless-shell-linux64.zip \
            -o "$RUNNER_TEMP/night-chrome.zip"
          unzip -q "$RUNNER_TEMP/night-chrome.zip" -d "$RUNNER_TEMP/night-browser"
          chmod +x "$RUNNER_TEMP/night-browser/chrome-headless-shell-linux64/chrome-headless-shell"
          echo "NIGHT_BROWSER_PATH=$RUNNER_TEMP/night-browser/chrome-headless-shell-linux64/chrome-headless-shell" >> "$GITHUB_ENV"
      - name: Render 3000 by 4800 actual NIGHT cards with real silhouette breakout
        run: npm run build -- --series naruto --width 3000 --out dist/naruto
      - name: Require full catalogue and zero failed cards
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const report=JSON.parse(fs.readFileSync('dist/naruto/build.json','utf8'));
          const src=JSON.parse(fs.readFileSync('catalog/naruto-sources.json','utf8'));
          if(report.width!==3000 || report.failures.length || report.cards.length!==src.sources.length)
            throw Error('Incomplete candidate export: '+JSON.stringify(report.failures));
          for(const card of report.cards)if(!card.qa)throw Error('Missing render QA: '+card.id);
          NODE
      - name: Export the shared-renderer Naruto candidate galleries
        run: |
          npm run gallery -- --series naruto --out dist/naruto --file dist/Naruto-Collection.html
          node bin/naruto-gallery.mjs dist/naruto/index.html
          node bin/naruto-gallery.mjs dist/Naruto-Collection.html
      - name: Stage preview-only phone proofs and 1000px images
        run: |
          mkdir -p naruto-preview
          rm -f naruto-preview/*--view.jpg naruto-preview/*--phone.png
          cp dist/naruto/index.html naruto-preview/index.html
          find dist/naruto -maxdepth 1 -type f \( -name '*--phone.png' -o -name '*--view.jpg' \) -exec cp '{}' naruto-preview/ \;
          printf '%s\n' 'User review required; neither production site nor bot is updated.' > naruto-preview/STATUS.txt
      - name: Commit immutable source pin metadata and standalone preview
        if: success() && github.event_name == 'push'
        working-directory: .
        run: |
          git config user.name "NIGHT Cards Candidates"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cards/catalog/naruto-source-lock.json cards/catalog/naruto.json cards/catalog/power/naruto.json cards/naruto-preview
          if ! git diff --cached --quiet; then
            git commit -m "cards(naruto): publish review-only candidate previews and artwork checksums"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
      - name: Upload complete Naruto master cards and phone proofs for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NIGHT-Naruto-Card-Candidates
          path: |
            cards/dist/naruto/
            cards/dist/Naruto-Collection.html
            cards/catalog/naruto.json
            cards/catalog/power/naruto.json
            cards/catalog/naruto-source-lock.json
          if-no-files-found: warn
          compression-level: 1
          retention-days: 14
