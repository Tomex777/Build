name: Endless Android CI

on:
  push:
    branches:
      - endless-android-ci
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct Endless source
        shell: bash
        run: |
          rm -rf /tmp/endless-src /tmp/endless.zip
          mkdir -p /tmp/endless-src
          cat endless_parts/part*.b64 | tr -d '\n\r ' | base64 --decode > /tmp/endless.zip
          unzip -q /tmp/endless.zip -d /tmp/endless-src
          ENDLESS_PROJECT=/tmp/endless-src/Endless_Android_M1
          test -f "$ENDLESS_PROJECT/settings.gradle.kts"
          cat > "$ENDLESS_PROJECT/app/build.gradle.kts" <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.plugin.compose")
          }

          android {
              namespace = "com.night.endless"
              compileSdk = 36

              defaultConfig {
                  applicationId = "com.night.endless"
                  minSdk = 26
                  targetSdk = 36
                  versionCode = 1
                  versionName = "0.1.0-m1"
              }

              buildFeatures {
                  compose = true
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation("androidx.activity:activity-compose:1.13.0")
              implementation("androidx.compose.ui:ui:1.11.4")
              implementation("androidx.compose.ui:ui-tooling-preview:1.11.4")
              implementation("androidx.compose.foundation:foundation:1.11.4")
              implementation("androidx.compose.material3:material3:1.3.2")
              debugImplementation("androidx.compose.ui:ui-tooling:1.11.4")
          }
          EOF
          echo "ENDLESS_PROJECT=$ENDLESS_PROJECT" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Install required Android SDK packages
        shell: bash
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Build Endless debug APK
        working-directory: ${{ env.ENDLESS_PROJECT }}
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload Endless APK
        uses: actions/upload-artifact@v4
        with:
          name: endless-debug-apk
          path: ${{ env.ENDLESS_PROJECT }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
