name: Endless Android CI

on:
  push:
    branches:
      - endless-android-ci
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct Endless M3.1 source
        shell: bash
        run: |
          rm -rf /tmp/endless-src /tmp/endless.zip
          mkdir -p /tmp/endless-src
          cat endless_parts/part*.b64 | tr -d '\n\r ' | base64 --decode > /tmp/endless.zip
          unzip -q /tmp/endless.zip -d /tmp/endless-src
          ENDLESS_PROJECT=/tmp/endless-src/Endless_Android_M1
          test -f "$ENDLESS_PROJECT/settings.gradle.kts"
          cp -R endless_m2_override/app/. "$ENDLESS_PROJECT/app/"
          grep -q 'screenOrientation="landscape"' "$ENDLESS_PROJECT/app/src/main/AndroidManifest.xml"
          grep -q 'versionName = "0.3.1-m3"' "$ENDLESS_PROJECT/app/build.gradle.kts"
          echo "ENDLESS_PROJECT=$ENDLESS_PROJECT" >> "$GITHUB_ENV"

      - name: Fetch verified real planetary textures
        shell: bash
        run: |
          set -euo pipefail
          OUT="$ENDLESS_PROJECT/app/src/main/res/drawable-nodpi"
          mkdir -p "$OUT"
          ROOT="https://media.githubusercontent.com/media/TanvirAhmedArnab/SolarSystem/main/SourceAssets/ThirdParty/Textures/SolarSystemScope"

          fetch() {
            local remote="$1"
            local local_name="$2"
            echo "Texture: $remote -> $local_name"
            curl -fL --retry 4 --retry-delay 2 --connect-timeout 20 --max-time 180               "$ROOT/$remote" -o "$OUT/$local_name"

            local bytes
            bytes=$(stat -c%s "$OUT/$local_name")
            echo "  bytes=$bytes  type=$(file -b "$OUT/$local_name")"
            test "$bytes" -gt 50000
            file -b "$OUT/$local_name" | grep -Eq 'JPEG image data|PNG image data'
          }

          fetch "2k_sun.jpg" "planet_sun.jpg"
          fetch "2k_mercury.jpg" "planet_mercury.jpg"
          fetch "2k_venus_surface.jpg" "planet_venus.jpg"
          fetch "2k_earth_daymap.jpg" "planet_earth.jpg"
          fetch "2k_moon.jpg" "planet_moon.jpg"
          fetch "2k_mars.jpg" "planet_mars.jpg"
          fetch "2k_jupiter.jpg" "planet_jupiter.jpg"
          fetch "2k_saturn.jpg" "planet_saturn.jpg"
          fetch "2k_uranus.jpg" "planet_uranus.jpg"
          fetch "2k_neptune.jpg" "planet_neptune.jpg"

          fetch "2k_earth_clouds.jpg" "earth_clouds.jpg"
          fetch "2k_earth_nightmap.jpg" "earth_night.jpg"
          fetch "2k_venus_atmosphere.jpg" "venus_atmosphere.jpg"
          fetch "2k_saturn_ring_alpha.png" "saturn_ring.png"

          echo "Verified texture total:"
          du -ch "$OUT"/* | tail -1

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Install required Android SDK packages
        shell: bash
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Build Endless M3.1 debug APK
        working-directory: ${{ env.ENDLESS_PROJECT }}
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify packaged textures
        shell: bash
        run: |
          APK="$ENDLESS_PROJECT/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          unzip -l "$APK" | grep -q 'planet_earth.jpg'
          unzip -l "$APK" | grep -q 'saturn_ring.png'
          unzip -l "$APK" | grep -q 'earth_clouds.jpg'

      - name: Upload Endless M3.1 APK
        uses: actions/upload-artifact@v4
        with:
          name: endless-m3-1-textured-smooth-apk
          path: ${{ env.ENDLESS_PROJECT }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
