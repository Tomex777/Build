name: Endless Android CI

on:
  push:
    branches:
      - endless-android-ci
  workflow_dispatch:

concurrency:
  group: endless-android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # API 36's cold boot can take a long time on hosted runners without KVM.
    timeout-minutes: 60
    env:
      ENDLESS_RELEASE_KEYSTORE_B64: ${{ secrets.ENDLESS_RELEASE_KEYSTORE_B64 }}
      ENDLESS_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ENDLESS_RELEASE_KEYSTORE_PASSWORD }}
      ENDLESS_RELEASE_KEY_ALIAS: ${{ secrets.ENDLESS_RELEASE_KEY_ALIAS }}
      ENDLESS_RELEASE_KEY_PASSWORD: ${{ secrets.ENDLESS_RELEASE_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct Endless foundation source
        shell: bash
        run: |
          rm -rf /tmp/endless-src /tmp/endless.zip
          mkdir -p /tmp/endless-src
          cat endless_parts/part*.b64 | tr -d '\n\r ' | base64 --decode > /tmp/endless.zip
          unzip -q /tmp/endless.zip -d /tmp/endless-src
          ENDLESS_PROJECT=/tmp/endless-src/Endless_Android_M1
          test -f "$ENDLESS_PROJECT/settings.gradle.kts"
          cp -R endless_m2_override/app/. "$ENDLESS_PROJECT/app/"
          grep -q 'screenOrientation="landscape"' "$ENDLESS_PROJECT/app/src/main/AndroidManifest.xml"
          grep -q 'versionName = "1.0.0"' "$ENDLESS_PROJECT/app/build.gradle.kts"
          echo "ENDLESS_PROJECT=$ENDLESS_PROJECT" >> "$GITHUB_ENV"

      - name: Fetch verified real planetary textures
        shell: bash
        run: |
          set -euo pipefail
          OUT="$ENDLESS_PROJECT/app/src/main/res/drawable-nodpi"
          mkdir -p "$OUT"
          ROOT="https://media.githubusercontent.com/media/TanvirAhmedArnab/SolarSystem/main/SourceAssets/ThirdParty/Textures/SolarSystemScope"

          fetch() {
            local remote="$1"
            local local_name="$2"
            echo "Texture: $remote -> $local_name"
            curl -fL --retry 4 --retry-delay 2 --connect-timeout 20 --max-time 180 "$ROOT/$remote" -o "$OUT/$local_name"

            local bytes
            bytes=$(stat -c%s "$OUT/$local_name")
            echo "  bytes=$bytes  type=$(file -b "$OUT/$local_name")"
            test "$bytes" -gt 10000
            file -b "$OUT/$local_name" | grep -Eq 'JPEG image data|PNG image data'
          }

          fetch "2k_sun.jpg" "planet_sun.jpg"
          fetch "2k_mercury.jpg" "planet_mercury.jpg"
          fetch "2k_venus_surface.jpg" "planet_venus.jpg"
          fetch "2k_earth_daymap.jpg" "planet_earth.jpg"
          fetch "2k_moon.jpg" "planet_moon.jpg"
          fetch "2k_mars.jpg" "planet_mars.jpg"
          fetch "2k_jupiter.jpg" "planet_jupiter.jpg"
          fetch "2k_saturn.jpg" "planet_saturn.jpg"
          fetch "2k_uranus.jpg" "planet_uranus.jpg"
          fetch "2k_neptune.jpg" "planet_neptune.jpg"

          fetch "2k_earth_clouds.jpg" "earth_clouds.jpg"
          fetch "2k_earth_nightmap.jpg" "earth_night.jpg"
          fetch "2k_venus_atmosphere.jpg" "venus_atmosphere.jpg"
          fetch "2k_saturn_ring_alpha.png" "saturn_ring.png"

          CLOSE_ROOT="https://raw.githubusercontent.com/zjoooooo/galaxy-explorer/main/images/solar-system"
          curl -fL --retry 4 --retry-delay 2 "$CLOSE_ROOT/mars.jpg" -o "$OUT/mars_close.jpg"
          curl -fL --retry 4 --retry-delay 2 "$CLOSE_ROOT/mars-normal.png" -o "$OUT/mars_normal.png"
          curl -fL --retry 4 --retry-delay 2 "$CLOSE_ROOT/moon.jpg" -o "$OUT/moon_close.jpg"
          curl -fL --retry 4 --retry-delay 2 "$CLOSE_ROOT/moon-normal.png" -o "$OUT/moon_normal.png"
          test $(stat -c%s "$OUT/mars_close.jpg") -gt 500000
          test $(stat -c%s "$OUT/mars_normal.png") -gt 500000
          test $(stat -c%s "$OUT/moon_close.jpg") -gt 1000000
          test $(stat -c%s "$OUT/moon_normal.png") -gt 500000
          file -b "$OUT/mars_close.jpg" | grep -q 'JPEG image data'
          file -b "$OUT/mars_normal.png" | grep -q 'PNG image data'
          file -b "$OUT/moon_close.jpg" | grep -q 'JPEG image data'
          file -b "$OUT/moon_normal.png" | grep -q 'PNG image data'

          echo "Verified texture total:"
          du -ch "$OUT"/* | tail -1

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Install required Android SDK packages
        shell: bash
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Build Endless production and QA variants
        working-directory: ${{ env.ENDLESS_PROJECT }}
        run: gradle :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease :app:bundleRelease --stacktrace

      - name: Verify packaged textures
        shell: bash
        run: |
          APK="$ENDLESS_PROJECT/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          unzip -l "$APK" | grep -q 'planet_earth.jpg'
          unzip -l "$APK" | grep -q 'saturn_ring.png'
          unzip -l "$APK" | grep -q 'earth_clouds.jpg'
          unzip -l "$APK" | grep -q 'mars_close.jpg'
          unzip -l "$APK" | grep -q 'mars_normal.png'
          unzip -l "$APK" | grep -q 'moon_close.jpg'
          unzip -l "$APK" | grep -q 'moon_normal.png'

      - name: Runtime smoke on API 36 emulator
        env:
          API36_EVIDENCE_DIR: artifacts/endless-m5-runtime
        run: bash "$GITHUB_WORKSPACE/endless_ci/start-emulator-api36.sh" "$GITHUB_WORKSPACE/endless_ci/runtime-smoke-api36.sh" "$ENDLESS_PROJECT"

      - name: Upload Endless API 36 emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: endless-api36-evidence
          path: artifacts/endless-m5-runtime/
          if-no-files-found: warn

      - name: Runtime smoke on API 26 emulator
        env:
          API26_EVIDENCE_DIR: artifacts/endless-api26-runtime
        run: bash "$GITHUB_WORKSPACE/endless_ci/start-emulator-api26.sh" "$GITHUB_WORKSPACE/endless_ci/runtime-smoke-api26.sh" "$ENDLESS_PROJECT"

      - name: Upload Endless API 26 emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: endless-api26-evidence
          path: artifacts/endless-api26-runtime/
          if-no-files-found: warn

      - name: Package Endless 1.0.0 APKs
        shell: bash
        run: |
          mkdir -p artifacts/endless-package
          cp "$ENDLESS_PROJECT/app/build/outputs/apk/debug/app-debug.apk" artifacts/endless-package/Endless-1.0.0-universal.apk
          test -s "$ENDLESS_PROJECT/app/build/outputs/apk/release/app-release-unsigned.apk"
          cp "$ENDLESS_PROJECT/app/build/outputs/apk/release/app-release-unsigned.apk" artifacts/endless-package/Endless-1.0.0-release-unsigned.apk
          test -s "$ENDLESS_PROJECT/app/build/outputs/bundle/release/app-release.aab"
          cp "$ENDLESS_PROJECT/app/build/outputs/bundle/release/app-release.aab" artifacts/endless-package/Endless-1.0.0-release-unsigned.aab

      - name: Create owner-signed Endless release when configured
        shell: bash
        run: |
          set -euo pipefail
          OUT="artifacts/endless-package"
          STATUS="$OUT/ENDLESS-SIGNING-STATUS.txt"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"
          state=NOT_CONFIGURED
          if [[ -n "${ENDLESS_RELEASE_KEYSTORE_B64:-}" &&
                -n "${ENDLESS_RELEASE_KEYSTORE_PASSWORD:-}" &&
                -n "${ENDLESS_RELEASE_KEY_ALIAS:-}" &&
                -n "${ENDLESS_RELEASE_KEY_PASSWORD:-}" ]]; then
            KEYSTORE="$RUNNER_TEMP/endless-release.jks"
            printf '%s' "$ENDLESS_RELEASE_KEYSTORE_B64" | base64 --decode > "$KEYSTORE"

            "$APKSIGNER" sign \
              --ks "$KEYSTORE" \
              --ks-key-alias "$ENDLESS_RELEASE_KEY_ALIAS" \
              --ks-pass env:ENDLESS_RELEASE_KEYSTORE_PASSWORD \
              --key-pass env:ENDLESS_RELEASE_KEY_PASSWORD \
              --out "$OUT/Endless-1.0.0-release-production-signed.apk" \
              "$OUT/Endless-1.0.0-release-unsigned.apk"
            "$APKSIGNER" verify --verbose --print-certs "$OUT/Endless-1.0.0-release-production-signed.apk"

            jarsigner \
              -keystore "$KEYSTORE" \
              -storepass "$ENDLESS_RELEASE_KEYSTORE_PASSWORD" \
              -keypass "$ENDLESS_RELEASE_KEY_PASSWORD" \
              -sigalg SHA256withRSA -digestalg SHA-256 \
              -signedjar "$OUT/Endless-1.0.0-release-production-signed.aab" \
              "$OUT/Endless-1.0.0-release-unsigned.aab" \
              "$ENDLESS_RELEASE_KEY_ALIAS"
            jarsigner -verify "$OUT/Endless-1.0.0-release-production-signed.aab"

            rm -f "$KEYSTORE"
            state=SIGNED
          fi
          printf 'productionSigning=%s\n' "$state" > "$STATUS"

      - name: Upload Endless owner-signed release
        uses: actions/upload-artifact@v4
        with:
          name: endless-1.0.0-production-signing
          path: |
            artifacts/endless-package/Endless-1.0.0-release-production-signed.apk
            artifacts/endless-package/Endless-1.0.0-release-production-signed.aab
            artifacts/endless-package/ENDLESS-SIGNING-STATUS.txt
          if-no-files-found: warn

      - name: Upload Endless universal QA APK
        uses: actions/upload-artifact@v4
        with:
          name: endless-universal-apk
          path: artifacts/endless-package/Endless-1.0.0-universal.apk
          if-no-files-found: error

      - name: Upload Endless unsigned release inputs
        uses: actions/upload-artifact@v4
        with:
          name: endless-release-unsigned-inputs
          path: |
            artifacts/endless-package/Endless-1.0.0-release-unsigned.apk
            artifacts/endless-package/Endless-1.0.0-release-unsigned.aab
          if-no-files-found: error
