name: Vivarium fast CDX

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vivarium-fast-cdx.yml'

permissions:
  contents: write

jobs:
  cdx:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Query Wayback quickly
        run: |
          mkdir -p diagnostics
          python3 - <<'PY'
          import requests,json,re,urllib.parse
          s=requests.Session();s.headers.update({'User-Agent':'Mozilla/5.0'})
          out={}
          for d in ['vivarium.wtf','viv.st']:
              try:
                  r=s.get('https://web.archive.org/cdx/search/cdx',params={
                      'url':d+'/*','output':'json','fl':'timestamp,original,statuscode,mimetype',
                      'filter':'statuscode:200','collapse':'digest','limit':'50','from':'2026'
                  },timeout=20)
                  out[d]={'status':r.status_code,'preview':r.text[:10000]}
                  try: out[d]['rows']=r.json()
                  except: pass
              except Exception as e: out[d]={'error':repr(e)}
          json.dump(out,open('diagnostics/vivarium-fast-cdx.json','w'),indent=2)
          print(json.dumps(out,indent=2)[:30000])
          PY
      - name: Commit result
        if: always()
        run: |
          test -f diagnostics/vivarium-fast-cdx.json || echo '{"error":"no result"}' > diagnostics/vivarium-fast-cdx.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add diagnostics/vivarium-fast-cdx.json
          git commit -m "record Vivarium Wayback index" || true
          git push || true
