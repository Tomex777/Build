name: Cortex Android

concurrency:
  group: cortex-android-live-v2
  cancel-in-progress: true

on:
  push:
    branches: [cortex-android-live, cortex-production-finalization]
    paths:
      - 'cortex-android/**'
      - '.github/workflows/cortex-android.yml'
      - '.github/scripts/cortex-api36-emulator.sh'
      - '.github/scripts/cortex-api26-emulator.sh'
      - '.github/scripts/cortex-release-smoke.sh'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate Cortex CI scripts
        shell: bash
        run: |
          bash -n .github/scripts/cortex-api26-emulator.sh
          bash -n .github/scripts/cortex-api36-emulator.sh
          bash -n .github/scripts/cortex-release-smoke.sh
      - name: Install Android SDK 36
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Configure release signing when secrets are available
        shell: bash
        env:
          CORTEX_RELEASE_KEYSTORE_B64: ${{ secrets.CORTEX_RELEASE_KEYSTORE_B64 }}
          CORTEX_RELEASE_STORE_PASSWORD_SECRET: ${{ secrets.CORTEX_RELEASE_STORE_PASSWORD }}
          CORTEX_RELEASE_KEY_ALIAS_SECRET: ${{ secrets.CORTEX_RELEASE_KEY_ALIAS }}
          CORTEX_RELEASE_KEY_PASSWORD_SECRET: ${{ secrets.CORTEX_RELEASE_KEY_PASSWORD }}
        run: |
          if [ -n "$CORTEX_RELEASE_KEYSTORE_B64" ] && [ -n "$CORTEX_RELEASE_STORE_PASSWORD_SECRET" ] && [ -n "$CORTEX_RELEASE_KEY_ALIAS_SECRET" ] && [ -n "$CORTEX_RELEASE_KEY_PASSWORD_SECRET" ]; then
            printf '%s' "$CORTEX_RELEASE_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/cortex-release.jks"
            echo "::add-mask::$CORTEX_RELEASE_STORE_PASSWORD_SECRET"
            echo "::add-mask::$CORTEX_RELEASE_KEY_PASSWORD_SECRET"
            echo "CORTEX_RELEASE_KEYSTORE=$RUNNER_TEMP/cortex-release.jks" >> "$GITHUB_ENV"
            echo "CORTEX_RELEASE_STORE_PASSWORD=$CORTEX_RELEASE_STORE_PASSWORD_SECRET" >> "$GITHUB_ENV"
            echo "CORTEX_RELEASE_KEY_ALIAS=$CORTEX_RELEASE_KEY_ALIAS_SECRET" >> "$GITHUB_ENV"
            echo "CORTEX_RELEASE_KEY_PASSWORD=$CORTEX_RELEASE_KEY_PASSWORD_SECRET" >> "$GITHUB_ENV"
            echo "Release signing configured."
          else
            echo "Release signing secrets are not configured; CI will still validate the unsigned release build."
          fi
      - name: Build debug and production release artifacts
        shell: bash
        run: |
          set -euo pipefail

          # First build the ordinary release bundle from the untouched production
          # source. ABI-specific APK packaging is introduced only for the second
          # assembleRelease invocation below, so the AAB remains the canonical
          # Play-style bundle.
          gradle -p cortex-android :app:assembleDebug :app:assembleDebugAndroidTest :app:assembleRelease :app:bundleRelease --stacktrace

          aab="$(find cortex-android/app/build/outputs/bundle/release -type f -name '*.aab' | head -n1)"
          test -s "$aab"

          # Produce explicit ARM64 and x86_64 standalone release APKs without
          # changing the checked-in Android architecture or the debug test APK.
          python3 - <<'PY'
          from pathlib import Path
          p = Path("cortex-android/app/build.gradle.kts")
          s = p.read_text()
          marker = "    buildTypes {"
          if "splits {" in s:
              raise SystemExit("unexpected permanent ABI split block in Cortex source")
          block = """    splits {
                  abi {
                      isEnable = true
                      reset()
                      include("arm64-v8a", "x86_64")
                      isUniversalApk = false
                  }
              }

          """
          if marker not in s:
              raise SystemExit("Cortex android buildTypes block not found")
          p.write_text(s.replace(marker, block + marker, 1))
          PY

          gradle -p cortex-android :app:assembleRelease --stacktrace

          arm64_apk=''
          x86_64_apk=''
          while IFS= read -r apk; do
            echo "$apk"
            case "$(basename "$apk")" in
              *arm64-v8a*) arm64_apk="$apk" ;;
              *x86_64*) x86_64_apk="$apk" ;;
            esac
          done < <(find cortex-android/app/build/outputs/apk -type f -name '*.apk' -print | sort)

          test -n "$arm64_apk" && test -s "$arm64_apk"
          test -n "$x86_64_apk" && test -s "$x86_64_apk"
          test "$arm64_apk" != "$x86_64_apk"

          mkdir -p cortex-release-package
          cp "$arm64_apk" cortex-release-package/Cortex_ARM64_PRODUCTION_RAW.apk
          cp "$x86_64_apk" cortex-release-package/Cortex_X86_64_PRODUCTION_RAW.apk
          cp "$aab" cortex-release-package/Cortex_RELEASE.aab
          if test -s cortex-android/app/build/outputs/mapping/release/mapping.txt; then
            cp cortex-android/app/build/outputs/mapping/release/mapping.txt cortex-release-package/Cortex_mapping.txt
          fi

          apksigner_bin="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n1)"
          aapt_bin="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n1)"
          test -x "$apksigner_bin"
          test -x "$aapt_bin"

          if "$apksigner_bin" verify "$arm64_apk" >/dev/null 2>&1 &&
             "$apksigner_bin" verify "$x86_64_apk" >/dev/null 2>&1; then
            signing_state='production release APKs were signed by the configured Cortex release signing key'
            cp "$arm64_apk" cortex-release-package/Cortex_ARM64_INSTALLABLE.apk
            cp "$x86_64_apk" cortex-release-package/Cortex_X86_64_INSTALLABLE.apk
          else
            # Production credentials are intentionally optional in CI. Create
            # clearly documented QA-installable copies so the exact minified
            # release code can still be installed and exercised on emulators
            # and ARM64 devices without pretending the QA key is a shipping key.
            if ! test -s "$HOME/.android/debug.keystore"; then
              mkdir -p "$HOME/.android"
              keytool -genkeypair -v \
                -keystore "$HOME/.android/debug.keystore" \
                -storepass android -alias androiddebugkey -keypass android \
                -dname "CN=Android Debug,O=Android,C=US" \
                -keyalg RSA -keysize 2048 -validity 10000
            fi
            signing_state='production signing secrets were unavailable; INSTALLABLE APKs use the CI Android QA/debug key'
            cp "$arm64_apk" cortex-release-package/Cortex_ARM64_INSTALLABLE.apk
            cp "$x86_64_apk" cortex-release-package/Cortex_X86_64_INSTALLABLE.apk
            "$apksigner_bin" sign \
              --ks "$HOME/.android/debug.keystore" \
              --ks-key-alias androiddebugkey \
              --ks-pass pass:android --key-pass pass:android \
              cortex-release-package/Cortex_ARM64_INSTALLABLE.apk
            "$apksigner_bin" sign \
              --ks "$HOME/.android/debug.keystore" \
              --ks-key-alias androiddebugkey \
              --ks-pass pass:android --key-pass pass:android \
              cortex-release-package/Cortex_X86_64_INSTALLABLE.apk
          fi

          "$apksigner_bin" verify --verbose --print-certs cortex-release-package/Cortex_ARM64_INSTALLABLE.apk
          "$apksigner_bin" verify --verbose --print-certs cortex-release-package/Cortex_X86_64_INSTALLABLE.apk
          "$aapt_bin" dump badging cortex-release-package/Cortex_ARM64_INSTALLABLE.apk > cortex-release-package/Cortex_ARM64_badging.txt
          "$aapt_bin" dump badging cortex-release-package/Cortex_X86_64_INSTALLABLE.apk > cortex-release-package/Cortex_X86_64_badging.txt
          for badging in cortex-release-package/Cortex_ARM64_badging.txt cortex-release-package/Cortex_X86_64_badging.txt; do
            grep -q "package: name='com.night.cortex' versionCode='100' versionName='1.0.0'" "$badging"
            grep -q "sdkVersion:'26'" "$badging"
            grep -q "targetSdkVersion:'36'" "$badging"
            grep -Eq "application: label='Cortex' icon='[^']+'" "$badging"
            grep -q "launchable-activity: name='com.night.cortex.MainActivity'" "$badging"
          done
          grep -q "native-code: 'arm64-v8a'" cortex-release-package/Cortex_ARM64_badging.txt
          grep -q "native-code: 'x86_64'" cortex-release-package/Cortex_X86_64_badging.txt

          {
            echo "Cortex release artifact signing"
            echo "$signing_state"
            echo "ARM64_INSTALLABLE is the standalone ARM64 APK used for device installation."
            echo "X86_64_INSTALLABLE is the same minified release build used for CI emulator acceptance."
            echo "PRODUCTION_RAW APKs preserve the original AGP release signing state."
            echo "The AAB preserves the normal production bundle build."
          } > cortex-release-package/SIGNING.txt

          sha256sum cortex-release-package/* > cortex-release-package/SHA256SUMS.txt
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: cortex-debug
          path: cortex-android/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload production release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cortex-production-release
          path: cortex-release-package/
          if-no-files-found: error

  emulator-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Prebuild instrumentation APKs
        working-directory: cortex-android
        run: gradle :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
      - name: Run Cortex instrumentation on Android 16 / API 36
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: aosp_atd
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 3072M
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -camera-back none -camera-front none
          emulator-boot-timeout: 900
          # Do not let the runner issue boot-time settings writes on API 36.
          # On software-only runners those ADB calls can hit system_server while
          # it is still settling and kill an otherwise healthy emulator. The
          # Cortex script performs its own readiness/recovery checks.
          disable-spellchecker: false
          disable-animations: false
          script: bash "$GITHUB_WORKSPACE/.github/scripts/cortex-api36-emulator.sh"
      - name: Upload API 36 emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cortex-android36-emulator-screen
          path: |
            cortex-home-emulator.png
            cortex-home-compose.png
            cortex-home-compose-sanity.txt
            cortex-connection-setup-compose.png
            cortex-connection-setup-compose-sanity.txt
            cortex-api36-ui.xml
            cortex-api36-foreground.txt
            cortex-api36-gfxinfo.txt
            cortex-api36-screenshot-sanity.txt
            cortex-api36-system-dialog.txt
            cortex-api36-diagnostics.txt
            cortex-unpaired-emulator.png
            cortex-unpaired-sanity.txt
            cortex-pairing-method-emulator.png
            cortex-pairing-method-sanity.txt
            cortex-connection-setup-emulator.png
            cortex-connection-setup-sanity.txt
            cortex-pairing-code-emulator.png
            cortex-pairing-code-sanity.txt
            cortex-pairing-qr-emulator.png
            cortex-pairing-qr-sanity.txt
            cortex-session-active-emulator.png
            cortex-session-active-sanity.txt
            cortex-session-expired-emulator.png
            cortex-session-expired-sanity.txt
            cortex-repair-emulator.png
            cortex-repair-sanity.txt
            cortex-console-connected-emulator.png
            cortex-console-connected-sanity.txt
            cortex-files-emulator.png
            cortex-files-sanity.txt
            cortex-editor-emulator.png
            cortex-editor-sanity.txt
            cortex-backups-emulator.png
            cortex-backups-sanity.txt
            cortex-startup-emulator.png
            cortex-startup-sanity.txt
            cortex-settings-emulator.png
            cortex-settings-sanity.txt
            cortex-activity-emulator.png
            cortex-activity-sanity.txt
            cortex-api36-suite.txt
            cortex-android-logcat.txt
            cortex-android-instrumentation.txt
          if-no-files-found: ignore

  min-sdk-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Prebuild minSdk instrumentation APKs
        working-directory: cortex-android
        run: gradle :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
      - name: Run Cortex instrumentation on minSdk / API 26
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 26
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          emulator-boot-timeout: 1200
          disable-spellchecker: true
          disable-animations: true
          script: bash "$GITHUB_WORKSPACE/.github/scripts/cortex-api26-emulator.sh"
      - name: Upload API 26 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cortex-api26-emulator-screen
          path: |
            cortex-api26-home.png
            cortex-connection-setup-emulator.png
            cortex-connection-setup-sanity.txt
            cortex-api26-instrumentation.txt
            cortex-api26-ui.xml
            cortex-api26-foreground.txt
            cortex-api26-logcat.txt
            cortex-api26-diagnostics.txt
            cortex-api26-screenshot-sanity.txt
          if-no-files-found: ignore

  release-api36:
    needs: build
    runs-on: ubuntu-latest
    # Software-rendered Google APIs API 36 images can spend 15+ minutes in boot
    # and package-manager settling before the minified app is exercised.
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: cortex-production-release
          path: cortex-release-package
      - name: Run minified Cortex release on Android 16 / API 36
        uses: ReactiveCircus/android-emulator-runner@v2
        env:
          CORTEX_RELEASE_APK: ${{ github.workspace }}/cortex-release-package/Cortex_X86_64_INSTALLABLE.apk
          CORTEX_RELEASE_API_LEVEL: '36'
        with:
          api-level: 36
          # Use the lean Android Test Device image here too. The Google APIs
          # image repeatedly stalled system_server before Cortex launch on
          # software-only runners. Release acceptance still requires Cortex
          # foreground + semantics + attached-surface proof; any ATD-only black
          # host framebuffer is preserved strictly as diagnostic evidence.
          target: aosp_atd
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 3072M
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -camera-back none -camera-front none
          emulator-boot-timeout: 900
          # API 36 readiness is owned by cortex-release-smoke.sh. Avoid the
          # runner's early settings writes, which can break ADB/system_server on
          # software-emulated boots before Cortex is even launched.
          disable-spellchecker: false
          disable-animations: false
          script: bash "$GITHUB_WORKSPACE/.github/scripts/cortex-release-smoke.sh"
      - name: Upload API 36 release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cortex-release-api36-evidence
          path: cortex-release-api36/
          if-no-files-found: ignore

  release-api26:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: cortex-production-release
          path: cortex-release-package
      - name: Run minified Cortex release on minSdk / API 26
        uses: ReactiveCircus/android-emulator-runner@v2
        env:
          CORTEX_RELEASE_APK: ${{ github.workspace }}/cortex-release-package/Cortex_X86_64_INSTALLABLE.apk
          CORTEX_RELEASE_API_LEVEL: '26'
        with:
          api-level: 26
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          emulator-boot-timeout: 1200
          disable-spellchecker: true
          disable-animations: true
          script: bash "$GITHUB_WORKSPACE/.github/scripts/cortex-release-smoke.sh"
      - name: Upload API 26 release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cortex-release-api26-evidence
          path: cortex-release-api26/
          if-no-files-found: ignore
