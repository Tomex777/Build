name: Cortex Android

on:
  push:
    branches: [cortex-android-live]
    paths:
      - 'cortex-android/**'
      - '.github/workflows/cortex-android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 36
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Build debug APK
        working-directory: cortex-android
        run: gradle :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cortex-debug
          path: cortex-android/app/build/outputs/apk/debug/app-debug.apk

  emulator-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Run app flow in Android 35 emulator and capture screen
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 4
          ram-size: 4096M
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          emulator-boot-timeout: 1200
          disable-spellchecker: true
          disable-animations: true
          script: |
            bash -c 'adb shell settings put global package_verifier_enable 0 || true; adb shell settings put global verifier_verify_adb_installs 0 || true; gradle -p cortex-android :app:connectedDebugAndroidTest --info --stacktrace; test_status=$?; adb logcat -d > "$GITHUB_WORKSPACE/cortex-android-logcat.txt" || true; adb install -r -g cortex-android/app/build/outputs/apk/debug/app-debug.apk || true; adb shell am force-stop com.night.cortex || true; adb shell am start -n com.night.cortex/.MainActivity || true; sleep 3; adb exec-out screencap -p > "$GITHUB_WORKSPACE/cortex-home-emulator.png" || true; exit "$test_status"'
      - name: Upload emulator screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cortex-android35-emulator-screen
          path: |
            cortex-home-emulator.png
            cortex-android-logcat.txt
            cortex-android/app/build/reports/androidTests/connected/debug/
            cortex-android/app/build/outputs/androidTest-results/connected/debug/
          if-no-files-found: ignore
