name: Cortex Android

concurrency:
  group: cortex-android-live
  cancel-in-progress: true

on:
  push:
    branches: [cortex-android-live]
    paths:
      - 'cortex-android/**'
      - '.github/workflows/cortex-android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 36
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Configure release signing when secrets are available
        shell: bash
        env:
          CORTEX_RELEASE_KEYSTORE_B64: ${{ secrets.CORTEX_RELEASE_KEYSTORE_B64 }}
          CORTEX_RELEASE_STORE_PASSWORD_SECRET: ${{ secrets.CORTEX_RELEASE_STORE_PASSWORD }}
          CORTEX_RELEASE_KEY_ALIAS_SECRET: ${{ secrets.CORTEX_RELEASE_KEY_ALIAS }}
          CORTEX_RELEASE_KEY_PASSWORD_SECRET: ${{ secrets.CORTEX_RELEASE_KEY_PASSWORD }}
        run: |
          if [ -n "$CORTEX_RELEASE_KEYSTORE_B64" ] && [ -n "$CORTEX_RELEASE_STORE_PASSWORD_SECRET" ] && [ -n "$CORTEX_RELEASE_KEY_ALIAS_SECRET" ] && [ -n "$CORTEX_RELEASE_KEY_PASSWORD_SECRET" ]; then
            printf '%s' "$CORTEX_RELEASE_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/cortex-release.jks"
            echo "::add-mask::$CORTEX_RELEASE_STORE_PASSWORD_SECRET"
            echo "::add-mask::$CORTEX_RELEASE_KEY_PASSWORD_SECRET"
            echo "CORTEX_RELEASE_KEYSTORE=$RUNNER_TEMP/cortex-release.jks" >> "$GITHUB_ENV"
            echo "CORTEX_RELEASE_STORE_PASSWORD=$CORTEX_RELEASE_STORE_PASSWORD_SECRET" >> "$GITHUB_ENV"
            echo "CORTEX_RELEASE_KEY_ALIAS=$CORTEX_RELEASE_KEY_ALIAS_SECRET" >> "$GITHUB_ENV"
            echo "CORTEX_RELEASE_KEY_PASSWORD=$CORTEX_RELEASE_KEY_PASSWORD_SECRET" >> "$GITHUB_ENV"
            echo "Release signing configured."
          else
            echo "Release signing secrets are not configured; CI will still validate the unsigned release build."
          fi
      - name: Build debug and production release artifacts
        working-directory: cortex-android
        run: gradle :app:assembleDebug :app:assembleDebugAndroidTest :app:assembleRelease :app:bundleRelease --stacktrace
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: cortex-debug
          path: cortex-android/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload production release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cortex-production-release
          path: |
            cortex-android/app/build/outputs/apk/release/*.apk
            cortex-android/app/build/outputs/bundle/release/*.aab
            cortex-android/app/build/outputs/mapping/release/
          if-no-files-found: error

  emulator-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Prebuild instrumentation APKs
        working-directory: cortex-android
        run: gradle :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
      - name: Run Cortex instrumentation on Android 16 / API 36
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 3072M
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          emulator-boot-timeout: 1200
          disable-spellchecker: true
          disable-animations: true
          script: |
            set -eu

            wait_for_android() {
              adb start-server >/dev/null 2>&1 || true
              for attempt in $(seq 1 90); do
                state="$(adb get-state 2>/dev/null || true)"
                boot="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
                if [ "$state" = "device" ] && [ "$boot" = "1" ] && adb shell true >/dev/null 2>&1; then
                  echo "Android is ready (attempt $attempt)."
                  return 0
                fi
                if [ $((attempt % 10)) -eq 0 ]; then
                  echo "Still waiting for Android (state=$state boot=$boot, attempt=$attempt)..."
                  adb devices -l || true
                  adb reconnect offline >/dev/null 2>&1 || true
                fi
                sleep 2
              done
              echo "Android emulator did not become healthy."
              adb devices -l || true
              return 1
            }

            adb_retry() {
              local description="$1"
              shift
              for attempt in 1 2 3; do
                if adb "$@"; then
                  return 0
                fi
                echo "$description failed on attempt $attempt; recovering adb..."
                adb kill-server >/dev/null 2>&1 || true
                sleep 2
                wait_for_android
              done
              echo "$description failed after retries."
              return 1
            }

            wait_for_android
            adb_retry "Disable package verifier" shell settings put global package_verifier_enable 0 || true
            adb_retry "Disable adb install verifier" shell settings put global verifier_verify_adb_installs 0 || true

            adb_retry "Install Cortex APK" install -r -g "$GITHUB_WORKSPACE/cortex-android/app/build/outputs/apk/debug/app-debug.apk"
            adb_retry "Install Cortex test APK" install -r -g "$GITHUB_WORKSPACE/cortex-android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk"

            INSTRUMENTATION="$GITHUB_WORKSPACE/cortex-android-instrumentation.txt"
            set +e
            timeout 10m adb shell am instrument -w -r com.night.cortex.test/androidx.test.runner.AndroidJUnitRunner > "$INSTRUMENTATION" 2>&1
            TEST_RC=$?
            set -e

            if [ "$TEST_RC" -ne 0 ] && grep -Eqi 'device offline|no devices|device.*not found|closed|transport error|protocol fault' "$INSTRUMENTATION"; then
              echo "Instrumentation lost adb transport; recovering once..."
              adb kill-server >/dev/null 2>&1 || true
              sleep 2
              wait_for_android
              set +e
              timeout 10m adb shell am instrument -w -r com.night.cortex.test/androidx.test.runner.AndroidJUnitRunner > "$INSTRUMENTATION" 2>&1
              TEST_RC=$?
              set -e
            fi

            cat "$INSTRUMENTATION"
            [ "$TEST_RC" -eq 0 ]
            grep -q '^OK (' "$INSTRUMENTATION"

            wait_for_android
            adb logcat -d > "$GITHUB_WORKSPACE/cortex-android-logcat.txt" || true
            adb_retry "Force-stop Cortex" shell am force-stop com.night.cortex || true
            adb_retry "Launch Cortex" shell am start -W -n com.night.cortex/.MainActivity
            sleep 3
            wait_for_android
            adb exec-out screencap -p > "$GITHUB_WORKSPACE/cortex-home-emulator.png"
            test -s "$GITHUB_WORKSPACE/cortex-home-emulator.png"
      - name: Upload API 36 emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cortex-android36-emulator-screen
          path: |
            cortex-home-emulator.png
            cortex-android-logcat.txt
            cortex-android-instrumentation.txt
          if-no-files-found: ignore

  min-sdk-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Prebuild minSdk instrumentation APKs
        working-directory: cortex-android
        run: gradle :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
      - name: Run Cortex instrumentation on minSdk / API 26
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 26
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          emulator-boot-timeout: 1200
          disable-spellchecker: true
          disable-animations: true
          script: |
            adb wait-for-device
            adb shell 'while [ "$(getprop sys.boot_completed)" != "1" ]; do sleep 2; done'
            adb install -r -g "$GITHUB_WORKSPACE/cortex-android/app/build/outputs/apk/debug/app-debug.apk"
            adb install -r -g "$GITHUB_WORKSPACE/cortex-android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk"
            adb shell am instrument -w -r com.night.cortex.test/androidx.test.runner.AndroidJUnitRunner > "$GITHUB_WORKSPACE/cortex-api26-instrumentation.txt"
            cat "$GITHUB_WORKSPACE/cortex-api26-instrumentation.txt"
            grep -q '^OK (' "$GITHUB_WORKSPACE/cortex-api26-instrumentation.txt"
            adb shell am start -W -n com.night.cortex/.MainActivity
            sleep 2
            adb exec-out screencap -p > "$GITHUB_WORKSPACE/cortex-api26-home.png"
      - name: Upload API 26 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cortex-api26-emulator-screen
          path: |
            cortex-api26-home.png
            cortex-api26-instrumentation.txt
          if-no-files-found: ignore
