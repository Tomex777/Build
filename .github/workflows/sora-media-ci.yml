name: Sora Anime Manga Media CI

on:
  workflow_dispatch:
  push:
    branches: [sora-media-ci]
    paths:
      - 'sora-ci/sora-media-ci-trigger.txt'

jobs:
  anime-manga-flow:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4

      - name: Enforce AniList Anime Manga truthfulness
        run: |
          set -euo pipefail
          ANILIST='sora-overlay/app/src/main/java/com/night/sora/catalog/AniListCatalogClient.kt'
          SERVICE='sora-overlay/app/src/main/java/com/night/sora/catalog/AniListCatalogService.kt'
          MANAGER='sora-overlay/app/src/main/java/com/night/sora/extension/ExtensionManager.kt'
          MEDIA='sora-overlay/app/src/main/java/com/night/sora/ui/screens/MediaScreen.kt'
          DETAIL='sora-overlay/app/src/main/java/com/night/sora/ui/screens/MediaDetailScreen.kt'
          CACHE='sora-overlay/app/src/main/java/com/night/sora/data/MediaCatalogCache.kt'
          MANIFEST='sora-overlay/app/src/main/AndroidManifest.xml'

          test -f "$ANILIST"
          test -f "$SERVICE"
          test ! -f 'sora-overlay/app/src/main/java/com/night/sora/catalog/JikanCatalogClient.kt'
          test ! -f 'sora-overlay/app/src/main/java/com/night/sora/catalog/JikanCatalogService.kt'

          grep -q 'https://graphql.anilist.co' "$ANILIST"
          grep -q 'idMal' "$ANILIST"
          grep -q 'expectedRelation = if (type == ContentType.ANIME) "SOURCE" else "ADAPTATION"' "$ANILIST"
          test "$(grep -c 'relationType(version: 2)' "$ANILIST")" -ge 2
          grep -q 'relationType") != expectedRelation' "$ANILIST"
          grep -q 'SEARCH_MATCH' "$ANILIST"
          grep -q 'POPULARITY_DESC' "$ANILIST"
          grep -q 'START_DATE_DESC' "$ANILIST"
          grep -q 'MAX_REQUEST_ATTEMPTS = 3' "$ANILIST"
          grep -q 'sora.core.anilist' "$MANAGER"
          grep -q 'graphql.anilist.co' "$MANAGER"
          grep -q 'findBuiltInAniListCounterpart' "$DETAIL"
          grep -q 'sora.core.anilist' "$MEDIA"
          grep -q 'AniList did not return live' "$MEDIA"
          grep -q 'Popular this season' "$MEDIA"
          grep -q 'Recently started' "$MEDIA"
          grep -q 'CachedMediaSnapshot' "$CACHE"
          grep -q 'sourceId.startsWith("jikan."' "$CACHE"
          grep -q '.catalog.AniListCatalogService' "$MANIFEST"
          grep -q 'sora.core.anilist' "$MANIFEST"

          ! grep -q 'api.jikan.moe' "$MANAGER" "$MEDIA" "$DETAIL" "$MANIFEST"
          ! grep -q 'sora.core.jikan' "$MANAGER" "$MEDIA" "$DETAIL" "$MANIFEST"
          ! grep -q 'best ?: array.optJSONObject(0)' "$DETAIL"
          ! grep -q 'name.contains(normalized)' "$DETAIL"
          ! grep -q 'The Last Platform\|After Rain' "$MEDIA"

      - name: Enforce Reddit OAuth configuration
        run: |
          set -euo pipefail
          REDDIT='sora-overlay/meme-extension/src/main/java/com/night/sora/memeextension/RedditMemeCatalog.kt'
          SERVICE='sora-overlay/meme-extension/src/main/java/com/night/sora/memeextension/RedditMemeExtensionService.kt'
          SETTINGS='sora-overlay/app/src/main/java/com/night/sora/ui/screens/ExtensionsScreen.kt'
          grep -q 'oauth.reddit.com' "$REDDIT"
          grep -q 'installed_client' "$REDDIT"
          grep -q 'redditClientId' "$SERVICE"
          grep -q 'Installed-app client ID' "$SETTINGS"
          ! grep -q 'www.reddit.com/r/memes' "$REDDIT"

      - name: Enforce TMDB movie catalog configuration
        run: |
          set -euo pipefail
          LIVE='sora-overlay/live-extension/src/main/java/com/night/sora/liveextension/LiveCatalog.kt'
          SERVICE='sora-overlay/live-extension/src/main/java/com/night/sora/liveextension/LiveExtensionService.kt'
          SETTINGS='sora-overlay/app/src/main/java/com/night/sora/ui/screens/ExtensionsScreen.kt'
          MEDIA='sora-overlay/app/src/main/java/com/night/sora/ui/screens/MediaScreen.kt'
          grep -q 'api.themoviedb.org/3/trending/movie/week' "$LIVE"
          grep -q 'live.tmdb.movies' "$SERVICE"
          grep -q 'tmdbReadAccessToken' "$SERVICE"
          grep -q 'TMDB API Read Access Token' "$SETTINGS"
          grep -q 'ext.packageName == "com.night.sora.ext.live" && source.id == "live.tmdb.movies"' "$MEDIA"
          ! grep -q 'itunesSearch("new movie"' "$LIVE"

      - name: Reconstruct current Android source
        run: |
          rm -rf /tmp/sora-src /tmp/sora.zip
          cat sora-ci/chunks/part-*.txt | base64 -d > /tmp/sora.zip
          unzip -q /tmp/sora.zip -d /tmp/sora-src
          ROOT=/tmp/sora-src/Sora_Android_v0_1
          test -f "$ROOT/settings.gradle.kts"
          cp -R sora-overlay/. "$ROOT/"
          python3 - "$ROOT" <<'PY'
          from pathlib import Path
          import sys

          root = Path(sys.argv[1])
          repository = root / 'app/src/main/java/com/night/sora/data/BibleRepository.kt'
          text = repository.read_text()
          old = 'https://bible-api.com/'
          if text.count(old) != 2:
              raise SystemExit('Bible API fixture endpoint markers mismatch')
          repository.write_text(text.replace(old, 'http://10.0.2.2:8765/'))

          manifest = root / 'app/src/main/AndroidManifest.xml'
          text = manifest.read_text()
          if 'android:usesCleartextTraffic=' not in text:
              if '<application' not in text:
                  raise SystemExit('application tag missing for Bible CI fixture')
              text = text.replace('<application', '<application android:usesCleartextTraffic="true"', 1)
          manifest.write_text(text)
          PY
          echo "SORA_ROOT=$ROOT" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 36 SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Build Sora Core
        working-directory: /tmp/sora-src/Sora_Android_v0_1
        run: gradle --stacktrace :app:assembleDebug :live-extension:assembleDebug :meme-extension:assembleDebug

      - name: Probe AniList availability
        id: anilist_probe
        run: |
          set +e
          cat > /tmp/anilist-probe-payload.json <<'JSON'
          {"query":"query { anime: Page(page:1, perPage:2) { media(type:ANIME, status:RELEASING, isAdult:false, sort:[POPULARITY_DESC]) { id title { romaji english } } } manga: Page(page:1, perPage:2) { media(type:MANGA, status:RELEASING, isAdult:false, sort:[POPULARITY_DESC]) { id title { romaji english } } } search: Page(page:1, perPage:2) { media(type:ANIME, search:\"Naruto\", isAdult:false, sort:[SEARCH_MATCH, POPULARITY_DESC]) { id title { romaji english } } } }"}
          JSON
          code="$(curl -sS -o /tmp/anilist-probe.json -w '%{http_code}' --retry 2 --retry-delay 2 --max-time 20             -H 'Accept: application/json'             -H 'Content-Type: application/json'             --data-binary @/tmp/anilist-probe-payload.json             https://graphql.anilist.co)"

          python3 - "$code" <<'PY'
          import json, os, sys
          code=sys.argv[1]
          healthy=False
          try:
              root=json.load(open('/tmp/anilist-probe.json'))
              data=root.get('data') or {}
              healthy=(
                  code.startswith('2')
                  and not root.get('errors')
                  and bool((data.get('anime') or {}).get('media'))
                  and bool((data.get('manga') or {}).get('media'))
                  and bool((data.get('search') or {}).get('media'))
              )
          except Exception:
              healthy=False
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('healthy=%s\n' % ('1' if healthy else '0'))
          print('AniList preflight healthy.' if healthy else 'AniList preflight unavailable/incomplete; emulator will verify the honest fallback state.')
          PY
          exit 0

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Validate Anime Manga flow in emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ANILIST_HEALTHY: ${{ steps.anilist_probe.outputs.healthy }}
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set -eu
            python3 "$GITHUB_WORKSPACE/sora-ci/bible-fixture-server.py" > /tmp/sora-bible-fixture.log 2>&1 &
            bible_fixture_pid=$!
            finish_bible_fixture() {
              status=$?
              trap - 0
              if [ "$status" -ne 0 ]; then
                echo 'Bible fixture access log:'
                cat /tmp/sora-bible-fixture.log || true
              fi
              kill "$bible_fixture_pid" 2>/dev/null || true
              exit "$status"
            }
            trap finish_bible_fixture 0
            attempt=1
            while [ "$attempt" -le 20 ]; do
              if curl -fsS http://127.0.0.1:8765/health | grep -q '"status": "ok"'; then break; fi
              sleep 1
              attempt=$((attempt + 1))
            done
            curl -fsS http://127.0.0.1:8765/health | grep -q '"status": "ok"'
            curl -fsS 'http://127.0.0.1:8765/Genesis+1?translation=web' | python3 -c 'import json,sys; assert json.load(sys.stdin)["verses"][0]["text"].startswith("In the beginning")'
            bash "$GITHUB_WORKSPACE/sora-ci/anime-manga-live-smoke.sh"
            bash "$GITHUB_WORKSPACE/sora-ci/hub-tabs-smoke.sh"

      - name: Upload Anime Manga screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sora-anime-manga-live-ui
          path: /tmp/sora-anime-manga-live
          if-no-files-found: warn
          retention-days: 5

      - name: Upload hub tabs screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sora-hub-tabs-emulator-ui
          path: /tmp/sora-hub-tabs
          if-no-files-found: warn
          retention-days: 5

      - name: Upload installable Sora APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sora-android-apks
          path: |
            /tmp/sora-src/Sora_Android_v0_1/app/build/outputs/apk/debug/app-debug.apk
            /tmp/sora-src/Sora_Android_v0_1/live-extension/build/outputs/apk/debug/live-extension-debug.apk
            /tmp/sora-src/Sora_Android_v0_1/meme-extension/build/outputs/apk/debug/meme-extension-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Evaluate emulator live gate
        id: live_gate
        if: always()
        run: |
          if [[ -f /tmp/sora-anime-manga-live/FULL_LIVE_PASS ]]; then
            echo 'fully_validated=1' >> "$GITHUB_OUTPUT"
            echo 'The emulator completed the full real-data AniList Anime/Manga flow.'
          else
            echo 'fully_validated=0' >> "$GITHUB_OUTPUT"
            echo 'The build/emulator path passed, but the complete AniList live-data flow was not available in this run.'
          fi

      - name: Require full AniList live validation
        if: always()
        run: |
          test '${{ steps.live_gate.outputs.fully_validated }}' = '1'
