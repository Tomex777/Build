name: MSCC Azure Postdeploy Smoke Contract

on:
  pull_request:
    branches: [mscc-azure]
    paths:
      - 'mscc/tools/azure-smoke*'
      - '.github/workflows/mscc-azure-smoke.yml'
  push:
    branches: [mscc-azure]
    paths:
      - 'mscc/tools/azure-smoke*'
      - '.github/workflows/mscc-azure-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Check smoke probe syntax
        run: |
          node --check mscc/tools/azure-smoke.mjs
          node --check mscc/tools/azure-smoke-selftest.mjs
      - name: Verify read-only postdeploy smoke contract
        run: node mscc/tools/azure-smoke-selftest.mjs
