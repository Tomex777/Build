name: TFPDL public-route matrix
on:
  push:
    paths: [".github/workflows/tfpdl-route-matrix.yml"]
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Probe public routes only
        shell: bash
        run: |
          set +e
          urls=(
            'https://tfp.re/wp-json/'
            'https://tfp.re/tfpdl/wp-json/'
            'https://tfp.re/tfpdl/wp-json/wp/v2/posts?per_page=1'
            'https://tfp.re/feed/'
            'https://tfp.re/tfpdl/feed/'
            'https://tfp.re/robots.txt'
            'https://tfp.re/sitemap_index.xml'
            'https://tfp.re/tfpdl/sitemap_index.xml'
            'https://tfpdl.com/wp-json/'
            'https://tfpdl.com/feed/'
          )
          for u in "${urls[@]}"; do
            echo "=== $u ==="
            curl -sS --max-time 20 --connect-timeout 8 -A 'Mozilla/5.0'               -D /tmp/h -o /tmp/b -w 'status=%{http_code} type=%{content_type} size=%{size_download} final=%{url_effective}\n' "$u"
            grep -Ei '^(HTTP/|location:|content-type:|cf-mitigated:|server:)' /tmp/h || true
            head -c 220 /tmp/b | tr '\n' ' '
            echo
          done