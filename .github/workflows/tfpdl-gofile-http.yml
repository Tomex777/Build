name: TFPDL GoFile HTTP trace
on:
  push:
    branches: [main]
    paths: ['.github/workflows/tfpdl-gofile-http.yml']
permissions:
  contents: write
jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Resolve GoFile share
        shell: bash
        run: |
          mkdir -p diagnostics
          python3 - <<'PY'
          import urllib.request,urllib.error,json,re,hashlib
          UA='Mozilla/5.0 (Linux; Android 16; SM-A165F) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Mobile Safari/537.36'
          out={'share':'VRiTEpLC','steps':[]}
          def req(url,method='GET',headers=None,data=None):
              h={'User-Agent':UA,'Accept':'application/json,text/plain,*/*'}
              if headers:h.update(headers)
              r=urllib.request.Request(url,method=method,headers=h,data=data)
              try:
                  with urllib.request.urlopen(r,timeout=25) as x:
                      b=x.read(1500000)
                      return x.status,x.geturl(),dict(x.headers),b
              except urllib.error.HTTPError as e:
                  return e.code,url,dict(e.headers),e.read(1500000)
          try:
              st,u,h,b=req('https://api.gofile.io/accounts',method='POST',headers={'Content-Type':'application/json'},data=b'{}')
              txt=b.decode('utf-8','ignore')
              out['steps'].append({'name':'guest-account','status':st,'body':txt[:5000]})
              tok=''
              try: tok=json.loads(txt).get('data',{}).get('token','')
              except: pass
              out['guestTokenPresent']=bool(tok)

              st,u,h,b=req('https://gofile.io/dist/js/config.js')
              js=b.decode('utf-8','ignore')
              out['steps'].append({'name':'config','status':st,'bodyPreview':js[:5000]})
              wt=''
              for pat in [r'appdata\.wt\s*=\s*["\']([^"\']+)',r'wt\s*:\s*["\']([^"\']+)']:
                  m=re.search(pat,js)
                  if m: wt=m.group(1);break
              out['websiteToken']=wt or None

              candidates=[]
              if tok:
                  import time
                  slot=int(time.time())//14400
                  salt='5d4f7g8sd45fsd'
                  exact=hashlib.sha256(f"{UA}::en-US::{tok}::{slot}::{salt}".encode()).hexdigest()
                  candidates.append(('dynamic-current',exact))
                  # One previous 4-hour slot handles a clock-boundary mismatch.
                  prev=hashlib.sha256(f"{UA}::en-US::{tok}::{slot-1}::{salt}".encode()).hexdigest()
                  candidates.append(('dynamic-previous',prev))
              seen=set()
              for label,w in candidates:
                  if w in seen: continue
                  seen.add(w)
                  url='https://api.gofile.io/contents/VRiTEpLC?contentFilter=&page=1&pageSize=1000&sortField=name&sortDirection=1'
                  for attempt in range(3):
                      st,u,h,b=req(url,headers={
                        'Authorization':'Bearer '+tok,
                        'X-Website-Token':w,
                        'X-BL':'en-US',
                        'Referer':'https://gofile.io/d/VRiTEpLC',
                        'Origin':'https://gofile.io',
                        'Cookie':'accountToken='+tok
                      })
                      txt=b.decode('utf-8','ignore')
                      out['steps'].append({'name':'contents-'+label,'attempt':attempt+1,'status':st,'url':url,'body':txt[:120000]})
                      try:
                          j=json.loads(txt)
                          if j.get('status')=='ok':
                              out['contents']=j
                              break
                          if j.get('status')=='error-rateLimit':
                              import time
                              time.sleep(35)
                              continue
                      except: pass
                      break
                  if out.get('contents'): break

              if out.get('contents'):
                  d=out['contents'].get('data',{})
                  vals=[]
                  if d.get('type')=='file': vals=[d]
                  ch=d.get('children',{})
                  if isinstance(ch,dict): vals+=list(ch.values())
                  elif isinstance(ch,list): vals+=ch
                  out['files']=[{
                    k:x.get(k) for k in ['id','name','size','mimetype','link','md5','servers','createTime']
                  } for x in vals if isinstance(x,dict) and x.get('type')=='file']
                  if out['files'] and out['files'][0].get('link'):
                      raw=out['files'][0]['link']
                      st,u,h,b=req(raw,headers={'Range':'bytes=0-0','Referer':'https://gofile.io/d/VRiTEpLC'})
                      out['rawProbe']={'status':st,'url':raw,'finalUrl':u,'contentType':h.get('Content-Type'),'contentLength':h.get('Content-Length'),'contentRange':h.get('Content-Range'),'contentDisposition':h.get('Content-Disposition'),'acceptRanges':h.get('Accept-Ranges'),'firstBytesHex':b[:16].hex()}
          except Exception as e:
              out['error']=repr(e)
          json.dump(out,open('diagnostics/tfpdl-gofile-http-result.json','w'),indent=2)
          print(json.dumps(out,indent=2)[:40000])
          PY
      - name: Commit result
        if: always()
        run: |
          test -f diagnostics/tfpdl-gofile-http-result.json || echo '{"error":"no result"}' > diagnostics/tfpdl-gofile-http-result.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add diagnostics/tfpdl-gofile-http-result.json
          git commit -m "record TFPDL GoFile HTTP trace" || true
          git push || true
