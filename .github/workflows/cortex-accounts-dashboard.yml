name: Cortex Accounts Dashboard
on:
  push:
    branches: [feat/cortex-accounts-dashboard-p5-20261009]
    paths:
      - 'cortex-agent/**'
      - 'cortex-android/**'
      - '.github/workflows/cortex-accounts-dashboard.yml'
  pull_request:
    branches: [feat/cortex-account-diagnostics-p4-20261009]
    paths:
      - 'cortex-agent/**'
      - 'cortex-android/**'
      - '.github/workflows/cortex-accounts-dashboard.yml'
  workflow_dispatch:

concurrency:
  group: cortex-accounts-dashboard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Check agent and new account controls
        run: |
          node --check cortex-agent/index.js
          node --check cortex-agent/account-controls-selftest.js
          node cortex-agent/account-controls-selftest.js
          grep -q 'accountDiagnostics' cortex-android/app/src/main/java/com/night/cortex/server/CortexServerApi.kt
          grep -q 'visibleAccounts' cortex-android/app/src/main/java/com/night/cortex/server/CortexPairingScreen.kt
          grep -q 'fixed-cc-destination-note' cortex-android/app/src/main/java/com/night/cortex/server/CortexPairingScreen.kt
          grep -q 'account.profile-changed' cortex-agent/index.js
          grep -q '/profile' cortex-android/app/src/main/java/com/night/cortex/server/CortexServerApi.kt
      - name: Install Android SDK 36
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - name: Compile and test Cortex Accounts dashboard
        run: gradle -p cortex-android :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace

  account-ui-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Build Cortex Android + UI tests
        run: gradle -p cortex-android :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
      - name: Exercise rename and bot-profile picker on Android emulator
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: aosp_atd
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 3072M
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          emulator-boot-timeout: 600
          script: bash "$GITHUB_WORKSPACE/.github/scripts/cortex-account-ui-emulator.sh"
      - name: Upload account UI emulator results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cortex-account-ui-emulator
          path: cortex-account-ui-results.txt
          if-no-files-found: ignore
