name: Cortex Agent release eligibility

on:
  workflow_dispatch:
  push:
    branches: [cortex-android-live]
    paths:
      - 'cortex-agent/**'
      - '.github/workflows/cortex-agent-azure-deploy.yml'
  pull_request:
    branches: [cortex-android-live]
    paths:
      - 'cortex-agent/**'
      - '.github/workflows/cortex-agent-azure-deploy.yml'

permissions:
  contents: read

concurrency:
  group: cortex-agent-azure-deploy
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Validate Agent without touching WhatsApp
        shell: bash
        run: |
          set -euo pipefail
          node --check cortex-agent/index.js
          bash -n cortex-agent/cortex-agent-control
          grep -Fq 'MSCC_MEGA_SHARED_FOLDERS' cortex-agent/cortex-agent-control
          grep -Fq "key: 'MSCC_MEGA_PASSWORD'" cortex-agent/index.js
          grep -Fq "'/api/cortex/host/cloud'" cortex-agent/index.js
          grep -Fq "'/api/cortex/host/cloud/discover'" cortex-agent/index.js
          grep -Fq "'/api/cortex/host/cloud/verify'" cortex-agent/index.js
          grep -Fq "'/api/cortex/host/environment'" cortex-agent/index.js
          grep -Fq 'function presentAccountSlots(state)' cortex-agent/index.js
          grep -Fq "mscc:account.profile-changed" cortex-agent/index.js
          sha256sum cortex-agent/index.js

# Agent installation must occur only through a reviewed, combined MSCC Azure
# production release, using the protected pinned bootstrap and its rollback.
# Do not issue standalone SSH commands: the VM deploy key enforces a restricted
# forced command, so the old direct-agent deploy job could not install anything.
# This workflow now validates eligibility; it never touches a running service.
