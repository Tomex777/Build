name: Night Mods Target Compatibility UI

on:
  push:
    branches:
      - nightmods-ci
    paths:
      - '.github/workflows/nightmods-target-ui-ci.yml'
  workflow_dispatch:

jobs:
  target-ui:
    name: Verify Night Core target statuses on Android 16
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android API 36
        shell: bash
        run: |
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

      - name: Build Night Mods manager
        shell: bash
        run: |
          git clone --depth 1 https://github.com/EzequielDevTeam/LSPosed-ET.git lsposed-et
          git config --global --add safe.directory '*'
          cd lsposed-et
          git submodule update --init --depth 1
          git -C external/lsplant rm -q --cached -r test || true
          rm -rf external/lsplant/test
          git -C external/lsplant submodule update --init --recursive --depth 1
          cd ..
          python3 nightmods/manager-overlay/apply_nightmods.py lsposed-et
          cd lsposed-et
          ./gradlew --no-daemon --stacktrace -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g" -Dorg.gradle.workers.max=2 :app:assembleDebug

      - name: Build Night Core and fake WhatsApp target
        working-directory: nightmods/nightcore
        run: gradle --no-daemon --stacktrace :app:assembleDebug :target-probe:assembleDebug

      - name: Verify APK identities
        shell: bash
        run: |
          AAPT="${ANDROID_SDK_ROOT}/build-tools/36.0.0/aapt"
          MANAGER="$(find lsposed-et/app/build/outputs -type f -name '*.apk' -print -quit)"
          CORE="$(find nightmods/nightcore/app/build/outputs -type f -name '*.apk' -print -quit)"
          TARGET="$(find nightmods/nightcore/target-probe/build/outputs -type f -name '*.apk' -print -quit)"
          test -n "$MANAGER" && test -n "$CORE" && test -n "$TARGET"
          "$AAPT" dump badging "$MANAGER" | grep -q "package: name='org.lsposed.manager'"
          "$AAPT" dump badging "$CORE" | grep -q "package: name='dev.nightmods.core'"
          "$AAPT" dump badging "$TARGET" | grep -q "package: name='com.whatsapp'"
          sha256sum "$MANAGER" "$CORE" "$TARGET" | tee target-ui-apk-sha256.txt

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          sudo chmod 666 /dev/kvm || true

      - name: Verify target compatibility UI on Android 16
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            mkdir -p target-ui-smoke
            adb wait-for-device
            test "$(adb shell getprop ro.build.version.sdk | tr -d '\r')" = "36"
            adb install -r "$(find lsposed-et/app/build/outputs -type f -name '*.apk' -print -quit)"
            adb install -r "$(find nightmods/nightcore/app/build/outputs -type f -name '*.apk' -print -quit)"
            adb install -r "$(find nightmods/nightcore/target-probe/build/outputs -type f -name '*.apk' -print -quit)"
            adb logcat -c

            adb shell am force-stop org.lsposed.manager || true
            adb shell am start -W -a android.intent.action.VIEW -d 'lsposed://night-core' -n org.lsposed.manager/.ui.activity.MainActivity | tee target-ui-smoke/night-core-start.txt
            sleep 5
            adb shell uiautomator dump /sdcard/nightmods-night-core.xml || true
            adb pull /sdcard/nightmods-night-core.xml target-ui-smoke/nightmods-night-core.xml || true
            grep -q 'Night Core' target-ui-smoke/nightmods-night-core.xml
            grep -q 'WhatsApp' target-ui-smoke/nightmods-night-core.xml
            grep -q 'Instagram' target-ui-smoke/nightmods-night-core.xml
            grep -q 'Analysis required' target-ui-smoke/nightmods-night-core.xml
            grep -q 'Not installed' target-ui-smoke/nightmods-night-core.xml
            adb exec-out screencap -p > target-ui-smoke/nightmods-target-status-android16.png

            adb logcat -d > target-ui-smoke/logcat.txt
            adb logcat -b crash -d > target-ui-smoke/crash.txt || true
            test -z "$(grep -E 'org\.lsposed\.manager|dev\.nightmods\.core|com\.whatsapp' target-ui-smoke/crash.txt || true)"
            echo 'Night Core target compatibility UI passed on Android 16.'

      - name: Upload target UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Night-Mods-target-status-Android16
          path: |
            target-ui-smoke/**
            target-ui-apk-sha256.txt
          if-no-files-found: warn
