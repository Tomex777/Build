name: WCO live player network E2E

on:
  push:
    branches: [anime-e2e-continuation-20260930]
    paths:
      - '.github/workflows/wco-live-player-network-e2e.yml'

permissions:
  contents: read

jobs:
  strict:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null
          mkdir -p proof
      - name: Complete handshake then execute player
        shell: bash
        run: |
          cat > wco-live.mjs <<'NODE'
          import { chromium } from 'playwright';
          import crypto from 'node:crypto';
          import fs from 'node:fs';

          const EP='https://www.wco.tv/one-piece-episode-1180-english-subbed';
          const UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/151.0.0.0 Safari/537.36';
          const browser=await chromium.launch({headless:true,args:['--autoplay-policy=no-user-gesture-required','--disable-blink-features=AutomationControlled']});
          const ctx=await browser.newContext({userAgent:UA,ignoreHTTPSErrors:true,viewport:{width:1280,height:800}});
          const outer=await ctx.newPage();
          const out={episode:EP,network:[],media:[],proofs:[],steps:[]};

          function oldIframe(html){
            const scripts=[...String(html).matchAll(/<script[^>]*>([\s\S]*?)<\/script>/gi)].map(x=>x[1]).filter(x=>/decodeURIComponent/.test(x));
            for(const script of scripts){
              const lb=script.indexOf('['),rb=script.indexOf(']',lb+1);
              if(lb<0||rb<0)continue;
              let list;try{list=JSON.parse('['+script.slice(lb+1,rb).replace(/,\s*$/,'')+']')}catch{continue}
              const sm=script.match(/-\s*(\d+)\s*\)\s*;?/g);
              if(!sm?.length)continue;
              const shift=Number((sm.at(-1).match(/\d+/)||[])[0]);if(!Number.isFinite(shift))continue;
              let decoded='';
              for(const item of list){const raw=Buffer.from(String(item),'base64').toString('utf8'),n=Number(raw.replace(/\D/g,''));if(Number.isFinite(n))decoded+=String.fromCharCode(n-shift)}
              const m=decoded.match(/<iframe[^>]+src=["']([^"']+)["']/i);if(m)return m[1];
            }
            return null;
          }
          function clean(h={}){
            const o={};
            for(const [k,v] of Object.entries(h)){
              if(k.startsWith(':')||['host','content-length','accept-encoding','connection'].includes(k.toLowerCase()))continue;
              o[k]=v;
            }o['User-Agent']=UA;return o;
          }
          async function prove(m){
            const h=clean(m.requestHeaders||{});
            try{
              const r=await ctx.request.get(m.url,{headers:h,timeout:25000,failOnStatusCode:false});
              const b=await r.body(),ct=r.headers()['content-type']||'',head=b.subarray(0,65536);
              if(/\.m3u8(?:$|\?)/i.test(m.url)||/mpegurl/i.test(ct)){
                const text=b.toString('utf8');if(!text.trimStart().startsWith('#EXTM3U'))return {kind:'hls',status:r.status(),pass:false};
                let urls=[];for(const line of text.split(/\r?\n/)){const t=line.trim();if(t&&!t.startsWith('#'))urls.push(t);for(const x of t.matchAll(/URI="([^"]+)"/g))urls.push(x[1])}
                for(const u0 of [...new Set(urls)].slice(0,12)){
                  const u=new URL(u0,m.url).href;
                  const r1=await ctx.request.get(u,{headers:h,timeout:25000,failOnStatusCode:false});
                  const bb=await r1.body(),tt=bb.toString('utf8');
                  if(tt.trimStart().startsWith('#EXTM3U')){
                    let ps=[];for(const line of tt.split(/\r?\n/)){const z=line.trim();if(z&&!z.startsWith('#'))ps.push(z);for(const x of z.matchAll(/URI="([^"]+)"/g))ps.push(x[1])}
                    for(const s0 of [...new Set(ps)].slice(0,8)){
                      const su=new URL(s0,u).href;const sr=await ctx.request.get(su,{headers:{...h,Range:'bytes=0-131071'},timeout:25000,failOnStatusCode:false});
                      const sb=await sr.body();if([200,206].includes(sr.status())&&sb.length>2048)return {kind:'hls',masterStatus:r.status(),playlistStatus:r1.status(),segmentStatus:sr.status(),segmentBytes:sb.length,pass:true};
                    }
                  }else if([200,206].includes(r1.status())&&bb.length>2048)return {kind:'hls-child',status:r1.status(),bytes:bb.length,pass:true};
                }
                return {kind:'hls',status:r.status(),pass:false};
              }
              const mp4=head.includes(Buffer.from('ftyp')),mkv=head.subarray(0,4).toString('hex')==='1a45dfa3',ts=head.length>188&&head[0]===0x47;
              return {kind:'direct',status:r.status(),bytes:b.length,contentType:ct,mp4,mkv,ts,pass:[200,206].includes(r.status())&&b.length>2048&&(mp4||mkv||ts||/^video\//i.test(ct)||/octet-stream/i.test(ct))};
            }catch(e){return {pass:false,error:String(e)}}
          }

          try{
            const nav=await outer.goto(EP,{waitUntil:'domcontentloaded',timeout:55000});await outer.waitForTimeout(4000);
            out.episodeStatus=nav?.status()??null;const html=await outer.content();let iframe=oldIframe(html);
            if(!iframe)iframe=await outer.locator('iframe').evaluateAll(xs=>xs.map(x=>x.src).find(x=>/wcostream|embed/i.test(x))||null);
            if(iframe?.startsWith('//'))iframe='https:'+iframe;out.iframe=iframe;
            if(!iframe)throw new Error('No iframe');
            const iu=new URL(iframe),domain=iu.origin,pid=iu.searchParams.get('pid');out.pid=pid;if(!pid)throw new Error('No pid');

            const navH={'User-Agent':UA,Accept:'text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8',Referer:EP,'Sec-Fetch-Dest':'iframe','Sec-Fetch-Site':'cross-site'};
            const ir=await ctx.request.get(iframe,{headers:navH,timeout:30000,failOnStatusCode:false});out.steps.push({name:'iframe',status:ir.status()});
            const pre=await ctx.request.get(domain+'/inc/embed/pre-init.js?v2',{headers:navH,timeout:30000,failOnStatusCode:false});out.steps.push({name:'pre-init',status:pre.status()});
            const bait=await ctx.request.get(domain+'/assets/ads/advertisement.js',{headers:navH,timeout:30000,failOnStatusCode:false});out.steps.push({name:'bait',status:bait.status()});
            await new Promise(r=>setTimeout(r,400));
            const nonce=crypto.randomBytes(16).toString('hex');
            const br=await ctx.request.post(domain+'/ad-verify',{headers:{'User-Agent':UA,Accept:'*/*',Origin:domain,Referer:iframe,'Content-Type':'application/json'},data:{nonce,status:'clear',id:pid},timeout:30000,failOnStatusCode:false});
            out.steps.push({name:'beacon',status:br.status()});await new Promise(r=>setTimeout(r,12500));

            const playerUrl=domain+'/inc/embed/video-js.php?n='+encodeURIComponent(nonce);out.playerUrl=playerUrl;
            const p=await ctx.newPage();
            p.on('response',async r=>{
              try{
                const h=await r.allHeaders(),ct=h['content-type']||'',u=r.url(),type=r.request().resourceType();
                if(['xhr','fetch','media'].includes(type)||/getvid|json|video-js|api|source|stream|m3u8|mp4/i.test(u)){
                  let body=null;if(/json|text|javascript/i.test(ct)||['xhr','fetch'].includes(type))try{body=(await r.text()).slice(0,50000)}catch{}
                  const row={url:u,status:r.status(),type,contentType:ct,requestHeaders:await r.request().allHeaders(),body};out.network.push(row);
                  if(/\.m3u8|\.mp4|getvid|mpegurl|^video\//i.test(u+' '+ct))out.media.push(row);
                }
              }catch{}
            });
            const pr=await p.goto(playerUrl,{waitUntil:'domcontentloaded',timeout:45000});out.playerStatus=pr?.status()??null;await p.waitForTimeout(8000);
            for(let round=0;round<6;round++){
              for(const f of p.frames()){
                try{
                  const v=f.locator('video').first();if(await v.count())await v.evaluate(el=>{el.muted=true;el.play().catch(()=>{});});
                  const b=f.locator('button[aria-label*="play" i],button[title*="play" i],.jw-icon-playback,.vjs-big-play-button,[class*="play" i]').first();if(await b.count())try{await b.click({timeout:700})}catch{}
                }catch{}
              }await p.waitForTimeout(1600);
            }
            let max=0,dur=0,ready=false;
            for(const f of p.frames())try{const vs=await f.locator('video').evaluateAll(xs=>xs.map(v=>({t:v.currentTime,d:Number.isFinite(v.duration)?v.duration:0,r:v.readyState,w:v.videoWidth,h:v.videoHeight})));for(const v of vs){max=Math.max(max,v.t||0);dur=Math.max(dur,v.d||0);if(v.r>=2&&v.w>0&&v.h>0)ready=true}}catch{}
            out.player={maxCurrentTime:max,maxDuration:dur,ready,advanced:max>=1,frameCount:p.frames().length};
            out.network=[...new Map(out.network.map(x=>[x.url,x])).values()];out.media=[...new Map(out.media.map(x=>[x.url,x])).values()];
            for(const m of out.media.filter(x=>[200,206].includes(x.status)).slice(0,20)){const pp=await prove(m);out.proofs.push({url:m.url,proof:pp});if(pp.pass)break}
            out.pass=Boolean(out.player.advanced||out.proofs.some(x=>x.proof?.pass));
            out.verdict=out.pass?'STRICT_PASS':out.media.length?'MEDIA_NOT_PROVEN':out.network.some(x=>['xhr','fetch'].includes(x.type))?'PLAYER_API_SEEN':'NO_PLAYER_NETWORK';
            await p.close();
          }catch(e){out.error=String(e);out.pass=false;out.verdict='ERROR'}

          fs.writeFileSync('proof/result.json',JSON.stringify(out,null,2));
          console.log(JSON.stringify({episodeStatus:out.episodeStatus,iframe:out.iframe,pid:out.pid,steps:out.steps,playerStatus:out.playerStatus,networkCount:out.network.length,mediaCount:out.media.length,
            interesting:out.network.slice(0,40).map(x=>({url:x.url,status:x.status,type:x.type,contentType:x.contentType,body:x.body?.slice(0,1000)||null})),
            player:out.player,winningProof:out.proofs.find(x=>x.proof?.pass)||null,pass:out.pass,verdict:out.verdict,error:out.error||null},null,2));
          await browser.close();
          NODE
          node wco-live.mjs
      - name: Upload proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wco-live-player-network-e2e
          path: proof/result.json
          if-no-files-found: error
