name: TFPDL API diagnostics

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - tfpdl-api-diagnostics
    paths:
      - '.github/workflows/tfpdl-api-diagnostics.yml'
      - 'diagnostics/tfpdl-probe.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tfpdl-api-diagnostics

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run TFPDL network probe
        env:
          OUT_DIR: tfpdl-probe-output
        run: node diagnostics/tfpdl-probe.mjs

      - name: Print endpoint summary
        if: always()
        run: |
          echo '===== summary.json ====='
          cat tfpdl-probe-output/summary.json 2>/dev/null || true
          echo '===== forms ====='
          for f in tfpdl-probe-output/*-forms.json; do echo "--- $f"; cat "$f"; done 2>/dev/null || true

      - name: Publish latest trace to diagnostic branch
        if: always()
        run: |
          cp tfpdl-probe-output/summary.json diagnostics/tfpdl-latest-summary.json 2>/dev/null || true
          cp tfpdl-probe-output/network-events.json diagnostics/tfpdl-latest-network.json 2>/dev/null || true
          latest_forms="$(ls -1 tfpdl-probe-output/*-forms.json 2>/dev/null | tail -n1 || true)"
          latest_text="$(ls -1 tfpdl-probe-output/*.txt 2>/dev/null | tail -n1 || true)"
          [ -n "$latest_forms" ] && cp "$latest_forms" diagnostics/tfpdl-latest-forms.json || true
          [ -n "$latest_text" ] && cp "$latest_text" diagnostics/tfpdl-latest-page.txt || true
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add diagnostics/tfpdl-latest-summary.json diagnostics/tfpdl-latest-network.json diagnostics/tfpdl-latest-forms.json diagnostics/tfpdl-latest-page.txt 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Record latest TFPDL endpoint trace"
            git push origin HEAD:tfpdl-api-diagnostics
          fi

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tfpdl-api-diagnostics
          path: tfpdl-probe-output/
          retention-days: 3
          if-no-files-found: warn
