name: Poetry Android — Build & API 26/35 Emulator
run-name: Poetry Android QA • ${{ github.ref_name }}

on:
  push:
    branches: [poetry-android]
    paths:
      - '.github/workflows/poetry-android-qa.yml'
      - 'poetry-android/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: poetry-android-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: poetry-android
    steps:
      - uses: actions/checkout@v4
      - name: Extract audited Poetry Android V8 source
        run: |
          set -euo pipefail
          if [ ! -s app/src/main/java/com/night/poetry/MainActivity.kt ]; then
            test -s source-bundle.tar.gz.base64
            base64 --decode source-bundle.tar.gz.base64 > /tmp/poetry-source.tar.gz
            echo '285dfea28dd523375844137d2f006ff1d435a491c4c3117256a3a56ba7a39738  /tmp/poetry-source.tar.gz' | sha256sum -c -
            tar -xzf /tmp/poetry-source.tar.gz
          fi
          grep -Eq 'minSdk[[:space:]]*=[[:space:]]*26' app/build.gradle.kts
          test -s app/src/main/java/com/night/poetry/MainActivity.kt
      - name: Publish extracted project as readable source files
        run: |
          set -euo pipefail
          git config user.name "poetry-qa[bot]"
          git config user.email "poetry-qa[bot]@users.noreply.github.com"
          git add app/ design-assets/ build.gradle.kts settings.gradle.kts gradle.properties
          if ! git diff --cached --quiet; then
            git commit -m "feat(poetry): materialize auditable Android V8 source with API 26 compatibility"
            git push origin "HEAD:poetry-android" || echo "::warning::Could not push expanded files; build will still run against extracted source."
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android 35 build packages
        run: |
          yes | "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0' || true
          test -d "${ANDROID_HOME:-/usr/local/lib/android/sdk}/platforms/android-35"
          test -d "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools/35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile and assemble debug APK
        run: gradle :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon --stacktrace
      - name: Run JVM tests
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: poetry-android-build-outputs
          path: |
            poetry-android/app/build/outputs/apk/debug/*.apk
            poetry-android/app/build/outputs/apk/androidTest/debug/*.apk
            poetry-android/app/build/reports/tests/
          if-no-files-found: warn

  emulator:
    needs: compile
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        api-level: [26, 35]
    defaults:
      run:
        working-directory: poetry-android
    steps:
      - uses: actions/checkout@v4
      - name: Extract audited source (works if source commit could not push)
        run: |
          set -euo pipefail
          if [ ! -s app/src/main/java/com/night/poetry/MainActivity.kt ]; then
            base64 --decode source-bundle.tar.gz.base64 | tar -xz
          fi
          grep -Eq 'minSdk[[:space:]]*=[[:space:]]*26' app/build.gradle.kts
      - uses: actions/download-artifact@v4
        with:
          name: poetry-android-build-outputs
          path: /tmp/poetry-build
      - name: Enable /dev/kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and exercise native app on Android API ${{ matrix.api-level }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          working-directory: poetry-android
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash scripts/emulator-smoke.sh ${{ matrix.api-level }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: poetry-api${{ matrix.api-level }}-emulator-proof
          path: |
            poetry-android/poetry-api*-*.png
            poetry-android/poetry-api*-logcat.txt
            poetry-android/poetry-api*-instrumentation.txt
            poetry-android/app/build/reports/androidTests/
            poetry-android/app/build/outputs/androidTest-results/
          if-no-files-found: warn
