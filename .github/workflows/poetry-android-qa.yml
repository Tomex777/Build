name: Poetry Android — Build & Emulator QA
run-name: Poetry Android QA • ${{ github.ref_name }}

on:
  push:
    branches: [poetry-android]
    paths:
      - 'poetry-android/app/**'
      - 'poetry-android/build.gradle.kts'
      - 'poetry-android/settings.gradle.kts'
      - 'poetry-android/gradle.properties'
      - 'poetry-android/design-assets/**'
  pull_request:
    paths:
      - 'poetry-android/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: poetry-android-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: poetry-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android 35 build packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify actual Android source is present
        run: |
          test -s settings.gradle.kts
          test -s app/build.gradle.kts
          test -s app/src/main/java/com/night/poetry/MainActivity.kt
      - name: Compile and assemble Android debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: poetry-debug-apk
          path: poetry-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  emulator:
    needs: compile
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: poetry-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install app and run Compose instrumentation on Android API 35
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          working-directory: poetry-android
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            set -e
            gradle :app:assembleDebug :app:connectedDebugAndroidTest --no-daemon --stacktrace
            adb shell am start -n com.night.poetry/.MainActivity
            sleep 5
            adb shell screencap -p /sdcard/poetry-home.png
            adb pull /sdcard/poetry-home.png poetry-home.png
            adb logcat -d -t 5000 > emulator-logcat.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: poetry-api35-emulator-proof
          path: |
            poetry-android/poetry-home.png
            poetry-android/emulator-logcat.txt
            poetry-android/app/build/reports/androidTests/
            poetry-android/app/build/outputs/androidTest-results/
          if-no-files-found: warn
