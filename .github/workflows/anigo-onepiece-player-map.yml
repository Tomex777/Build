name: AniGo One Piece player map

on:
  push:
    branches: [anime-e2e-continuation-20260930]
    paths:
      - '.github/workflows/anigo-onepiece-player-map.yml'

permissions:
  contents: read

jobs:
  map:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null
          mkdir -p proof
      - name: Map exact One Piece player
        shell: bash
        run: |
          cat > anigo-player.mjs <<'NODE'
          import { chromium } from 'playwright';
          import fs from 'node:fs';

          const TARGET='https://anigo.su/watch/21/one-piece?ep=1';
          const UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/153.0.0.0 Safari/537.36';
          const browser=await chromium.launch({headless:true,args:['--autoplay-policy=no-user-gesture-required','--disable-blink-features=AutomationControlled']});
          const ctx=await browser.newContext({userAgent:UA,ignoreHTTPSErrors:true,viewport:{width:1365,height:900}});
          const page=await ctx.newPage();
          const out={target:TARGET,responses:[],requests:[],actions:[],frames:[],proofs:[]};

          const interesting=(u,ct='',type='') =>
            ['xhr','fetch','media'].includes(type) ||
            /api|episode|stream|server|source|player|embed|watch|m3u8|mpd|mp4|m4s|\.ts(?:$|\?)/i.test(u) ||
            /json|mpegurl|dash\+xml|^video\//i.test(ct);

          page.on('request',async q=>{
            try{
              if(interesting(q.url(),'',q.resourceType()))out.requests.push({url:q.url(),type:q.resourceType(),method:q.method(),headers:await q.allHeaders(),postData:q.postData()?.slice(0,5000)||null});
            }catch{}
          });
          page.on('response',async r=>{
            try{
              const h=await r.allHeaders(),ct=h['content-type']||'',u=r.url(),type=r.request().resourceType();
              if(!interesting(u,ct,type))return;
              let body=null;
              if(/json|text|javascript/i.test(ct)||['xhr','fetch'].includes(type)){
                try{body=(await r.text()).slice(0,100000)}catch{}
              }
              out.responses.push({url:u,status:r.status(),type,contentType:ct,headers:h,requestHeaders:await r.request().allHeaders(),body});
            }catch{}
          });

          function clean(h={}){
            const o={};
            for(const [k,v] of Object.entries(h)){
              if(k.startsWith(':')||['host','content-length','accept-encoding','connection'].includes(k.toLowerCase()))continue;
              o[k]=v;
            }
            o['User-Agent']=UA;
            return o;
          }
          async function prove(row){
            const h=clean(row.requestHeaders||{});
            try{
              const r=await ctx.request.get(row.url,{headers:h,timeout:25000,failOnStatusCode:false});
              const b=await r.body(),ct=r.headers()['content-type']||'';
              if(/\.m3u8(?:$|\?)/i.test(row.url)||/mpegurl/i.test(ct)){
                const text=b.toString('utf8');
                if(!text.trimStart().startsWith('#EXTM3U'))return {kind:'hls',status:r.status(),pass:false};
                let urls=[];
                for(const line of text.split(/\r?\n/)){const t=line.trim();if(t&&!t.startsWith('#'))urls.push(t);for(const m of t.matchAll(/URI="([^"]+)"/g))urls.push(m[1]);}
                for(const u0 of [...new Set(urls)].slice(0,12)){
                  const u=new URL(u0,row.url).href;
                  const r1=await ctx.request.get(u,{headers:h,timeout:25000,failOnStatusCode:false});
                  let bb=await r1.body(),tt=bb.toString('utf8');
                  if(tt.trimStart().startsWith('#EXTM3U')){
                    let parts=[];for(const line of tt.split(/\r?\n/)){const z=line.trim();if(z&&!z.startsWith('#'))parts.push(z);for(const m of z.matchAll(/URI="([^"]+)"/g))parts.push(m[1]);}
                    for(const s0 of [...new Set(parts)].slice(0,8)){
                      const su=new URL(s0,u).href;
                      const sr=await ctx.request.get(su,{headers:{...h,Range:'bytes=0-131071'},timeout:25000,failOnStatusCode:false});
                      const sb=await sr.body();
                      if([200,206].includes(sr.status())&&sb.length>2048)return {kind:'hls',masterStatus:r.status(),playlistStatus:r1.status(),segmentStatus:sr.status(),segmentBytes:sb.length,pass:true};
                    }
                  }else if([200,206].includes(r1.status())&&bb.length>2048)return {kind:'hls-child',status:r1.status(),bytes:bb.length,pass:true};
                }
                return {kind:'hls',status:r.status(),pass:false};
              }
              const head=b.subarray(0,65536),mp4=head.includes(Buffer.from('ftyp')),mkv=head.subarray(0,4).toString('hex')==='1a45dfa3';
              return {kind:'direct',status:r.status(),bytes:b.length,contentType:ct,mp4,mkv,pass:[200,206].includes(r.status())&&b.length>2048&&(mp4||mkv||/^video\//i.test(ct)||/octet-stream/i.test(ct))};
            }catch(e){return {pass:false,error:String(e)}}
          }

          try{
            const nav=await page.goto(TARGET,{waitUntil:'domcontentloaded',timeout:55000});
            await page.waitForTimeout(7000);
            out.status=nav?.status()??null;out.title=await page.title();
            out.bodyText=(await page.locator('body').innerText().catch(()=>'' )).replace(/\s+/g,' ').trim().slice(0,12000);

            const buttons=await page.locator('button,[role=button],a').evaluateAll(xs=>xs.map(x=>({text:(x.innerText||x.textContent||'').replace(/\s+/g,' ').trim().slice(0,120),href:x.href||null})).filter(x=>/play|server|sub|dub|episode|source|watch/i.test(x.text)).slice(0,80));
            out.controls=buttons;
            for(const rx of [/server\s*1/i,/sub/i,/play/i,/watch/i]){
              const el=page.getByText(rx).first();
              if(await el.count())try{await el.click({timeout:1600});out.actions.push({rx:String(rx),ok:true});await page.waitForTimeout(2600)}catch(e){out.actions.push({rx:String(rx),ok:false,error:String(e).slice(0,300)})}
            }

            for(let round=0;round<8;round++){
              for(const f of page.frames()){
                try{
                  const v=f.locator('video').first();
                  if(await v.count())await v.evaluate(el=>{el.muted=true;el.volume=0;el.play().catch(()=>{});});
                  const b=f.locator('button[aria-label*="play" i],button[title*="play" i],.jw-icon-playback,.vjs-big-play-button,[class*="play" i]').first();
                  if(await b.count())try{await b.click({timeout:800})}catch{}
                }catch{}
              }
              await page.waitForTimeout(1800);
            }

            let max=0,dur=0,ready=false;
            for(const f of page.frames()){
              try{
                const s=await f.evaluate(()=>({
                  url:location.href,
                  videos:[...document.querySelectorAll('video')].map(v=>({t:v.currentTime,d:Number.isFinite(v.duration)?v.duration:0,r:v.readyState,w:v.videoWidth,h:v.videoHeight,error:v.error?.code||null}))
                }));
                out.frames.push(s);
                for(const v of s.videos){max=Math.max(max,v.t||0);dur=Math.max(dur,v.d||0);if(v.r>=2&&v.w>0&&v.h>0)ready=true}
              }catch{}
            }
            out.player={maxCurrentTime:max,maxDuration:dur,ready,advanced:max>=1,frameCount:page.frames().length};
            out.responses=[...new Map(out.responses.map(x=>[x.url,x])).values()];
            out.requests=[...new Map(out.requests.map(x=>[x.url,x])).values()];
            const media=out.responses.filter(x=>[200,206].includes(x.status)&&(/\.m3u8|\.mpd|\.mp4|mpegurl|dash\+xml|^video\//i.test(x.url+' '+x.contentType)));
            out.media=media;
            for(const m of media.slice(0,20)){const p=await prove(m);out.proofs.push({url:m.url,proof:p});if(p.pass)break}
            out.pass=Boolean(out.player.advanced||out.proofs.some(x=>x.proof?.pass));
            out.verdict=out.pass?'STRICT_PASS':media.length?'MEDIA_SEEN_NOT_PROVEN':out.responses.some(x=>/api|source|stream|server/i.test(x.url))?'PLAYER_API_SEEN':'NO_PLAYER_TRAFFIC';
          }catch(e){out.error=String(e);out.pass=false;out.verdict='ERROR'}

          fs.writeFileSync('proof/result.json',JSON.stringify(out,null,2));
          console.log(JSON.stringify({
            status:out.status,title:out.title,controlCount:out.controls?.length||0,actions:out.actions,
            responseCount:out.responses.length,mediaCount:out.media?.length||0,
            interesting:out.responses.filter(x=>/api|source|stream|server|m3u8|video|embed|player/i.test(x.url+' '+x.contentType)).slice(0,35).map(x=>({url:x.url,status:x.status,type:x.type,contentType:x.contentType,body:x.body?.slice(0,900)||null})),
            frames:out.frames.map(x=>x.url),player:out.player,winningProof:out.proofs.find(x=>x.proof?.pass)||null,
            pass:out.pass,verdict:out.verdict,error:out.error||null
          },null,2));
          await browser.close();
          NODE
          node anigo-player.mjs
      - name: Upload proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anigo-onepiece-player-map
          path: proof/result.json
          if-no-files-found: error
