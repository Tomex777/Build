name: Sora Direct Media Resume Smoke

on:
  push:
    branches: [sora-android-ci]
    paths:
      - 'sora-ci/media-resume-smoke-trigger.txt'
  workflow_dispatch:

jobs:
  resume-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct Sora source
        run: |
          rm -rf /tmp/sora-src /tmp/sora.zip
          cat sora-ci/chunks/part-*.txt | base64 -d > /tmp/sora.zip
          unzip -q /tmp/sora.zip -d /tmp/sora-src
          ROOT=/tmp/sora-src/Sora_Android_v0_1
          test -f "$ROOT/settings.gradle.kts"
          cp -R sora-overlay/. "$ROOT/"
          echo "SORA_ROOT=$ROOT" >> "$GITHUB_ENV"

      - name: Promote demo source only inside CI fixture
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/sora-src/Sora_Android_v0_1/test-extension/src/main/java/com/night/sora/testextension/DemoExtensionService.kt')
          s=p.read_text()
          old='capabilities = setOf("diagnostic", "browse", "search", "details", "episodes", "chapters", "pages", "streams", "lyrics", "relatedArtists", "feed")'
          new='capabilities = setOf("catalog", "browse", "search", "details", "episodes", "chapters", "pages", "streams", "lyrics", "relatedArtists", "feed")'
          if s.count(old) != 1: raise SystemExit('demo capability marker mismatch')
          p.write_text(s.replace(old,new,1))
          PY

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Build Core and deterministic demo extension
        working-directory: /tmp/sora-src/Sora_Android_v0_1
        run: gradle --stacktrace :app:assembleDebug :test-extension:assembleDebug

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Prove exact movie and manga resume
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash "$GITHUB_WORKSPACE/sora-ci/media-resume-smoke.sh"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sora-media-resume-smoke
          path: /tmp/sora-media-resume
          if-no-files-found: warn
          retention-days: 3
