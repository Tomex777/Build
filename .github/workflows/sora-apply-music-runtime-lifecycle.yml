name: Apply Sora Music Runtime Lifecycle

on:
  push:
    branches: [sora-android-ci]
    paths:
      - 'sora-ci/apply-music-runtime-lifecycle.txt'

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply runtime lifecycle fix
        run: python sora-ci/patch_music_runtime_lifecycle.py
      - name: Verify process-wide player ownership
        run: |
          ! grep -q 'musicPlayer.release()' sora-overlay/app/src/main/java/com/night/sora/ui/SoraApp.kt
          grep -q 'MusicPlaybackRuntime.get' sora-overlay/app/src/main/java/com/night/sora/ui/SoraApp.kt
          grep -q 'MusicPlaybackService' sora-overlay/app/src/main/AndroidManifest.xml
      - name: Commit lifecycle fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sora-overlay/app/src/main/java/com/night/sora/ui/SoraApp.kt
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'fix Sora music runtime ownership across activity lifecycle'
            git push
          fi
