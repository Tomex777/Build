<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<meta name="theme-color" content="#d6d0c4" />
<title>Room Study — Three.js</title>
<link rel="stylesheet" href="./room.css" />
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="app">
  <canvas id="scene"></canvas>
  <button id="resetView" aria-label="Reset view" title="Reset view">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M4.8 8.2A8 8 0 1 1 4 14"/>
      <path d="M4.8 8.2V4.6M4.8 8.2h3.6"/>
    </svg>
  </button>
  <div id="hint">Drag to orbit · pinch to zoom · tap the desk lamp</div>
  <div id="error" hidden></div>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
