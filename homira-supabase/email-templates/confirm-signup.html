<!doctype html>
<html>
  <body style="margin:0;padding:0;background:#0A0E13;font-family:Arial,Helvetica,sans-serif;color:#F4F7FA;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#0A0E13;padding:28px 12px;">
      <tr><td align="center">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;background:#111821;border:1px solid #24303D;border-radius:28px;overflow:hidden;">
          <tr>
            <td align="center" style="padding:34px 28px 12px;">
              <img src="https://raw.githubusercontent.com/Tomex777/Build/homira-call-ci/homira-android/app/src/main/res/drawable-nodpi/homira_call_mascot.webp" width="132" alt="Homira mascot" style="display:block;width:132px;max-width:45%;height:auto;border:0;">
            </td>
          </tr>
          <tr>
            <td align="center" style="padding:4px 34px 0;">
              <div style="font-size:28px;line-height:36px;font-weight:800;color:#F4F7FA;">Hey! We’re so glad you’re joining us ✨</div>
              <div style="margin-top:12px;font-size:15px;line-height:23px;color:#95A2B2;">One tiny step and your Homira space is ready.</div>
            </td>
          </tr>
          <tr>
            <td style="padding:28px 34px 8px;">
              <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#18212C;border:1px solid #24303D;border-radius:22px;">
                <tr><td align="center" style="padding:22px 18px 8px;font-size:12px;letter-spacing:1.6px;text-transform:uppercase;color:#95A2B2;">Your verification code</td></tr>
                <tr><td align="center" style="padding:0 18px 22px;font-size:36px;line-height:44px;font-weight:800;letter-spacing:8px;color:#25D47A;">{{ .Token }}</td></tr>
              </table>
            </td>
          </tr>
          <tr>
            <td align="center" style="padding:14px 34px 34px;font-size:13px;line-height:20px;color:#95A2B2;">
              Enter this code in Homira. Don’t share it with anyone.<br>
              <span style="color:#72A9FF;">If you didn’t ask for this, you can safely ignore this email.</span>
            </td>
          </tr>
          <tr>
            <td align="center" style="background:#0F151D;padding:18px 28px;font-size:11px;color:#6F7C8B;border-top:1px solid #24303D;">
              Homira · calls that feel a little more human 💚
            </td>
          </tr>
        </table>
      </td></tr>
    </table>
  </body>
</html>
