<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1114">
<title>MSCC</title>
<style>
:root{color-scheme:dark;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0f1114;color:#f4f5f7}
*{box-sizing:border-box}
body{margin:0;background:#0f1114;min-height:100vh}
button,input{font:inherit}
button{cursor:pointer}
.wrap{max-width:820px;margin:auto;padding:24px 16px 56px}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
h1{font-size:30px;line-height:1;margin:0;letter-spacing:-.04em}
.muted{color:#8d949e}
.sub{font-size:13px;margin-top:6px}
.card{background:#171a1f;border:1px solid #292e36;border-radius:15px;padding:18px}
.grid{display:grid;gap:14px}
.accounts{grid-template-columns:1fr}
.accountTop{display:flex;justify-content:space-between;gap:16px;align-items:start}
.accountName{font-weight:800;font-size:20px}
.meta{font-size:13px;color:#8d949e;margin-top:5px}
.status{font-size:12px;font-weight:700;border-radius:999px;padding:6px 10px;background:#2a2e35;color:#c8cdd4}
.status.connected{background:#143523;color:#73dea0}
.status.wait{background:#3b3014;color:#f0cd72}
.status.bad{background:#3b1d22;color:#ff969f}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.btn{border:1px solid #343a44;background:#22262d;color:#f4f5f7;padding:9px 12px;border-radius:10px;font-weight:700;font-size:13px}
.btn.primary{background:#f1f3f5;color:#111318;border-color:#f1f3f5}
.btn.danger{background:#24171a;color:#ff9ba4;border-color:#563139}
.btn:disabled{opacity:.4;cursor:not-allowed}
.box{margin-top:14px;background:#111318;border:1px solid #292f37;border-radius:12px;padding:14px}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#7e8792}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:25px;letter-spacing:.13em;font-weight:800;margin-top:7px}
.qr{width:min(300px,100%);background:#fff;padding:10px;border-radius:10px;margin-top:10px}
.notice{font-size:12px;color:#98a1ab;margin-top:8px;line-height:1.5}
.error{font-size:12px;color:#ff9ba4;margin-top:10px}
.section{margin-top:14px}
.sectionTitle{font-weight:800;font-size:15px;margin-bottom:12px}
.setting{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:9px 0;border-top:1px solid #252a31}
.setting:first-of-type{border-top:0}
.settingTitle{font-weight:700}
.settingSub{font-size:12px;color:#828b96;margin-top:3px}
.switch{width:46px;height:27px;border-radius:999px;border:0;background:#343a43;position:relative;padding:0}
.switch:after{content:"";position:absolute;width:21px;height:21px;left:3px;top:3px;border-radius:50%;background:#eef1f4;transition:.16s}
.switch.on{background:#32b866}
.switch.on:after{transform:translateX(19px)}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.stat{background:#111318;border:1px solid #262c34;border-radius:10px;padding:12px}
.statK{font-size:10px;text-transform:uppercase;letter-spacing:.09em;color:#747d88}
.statV{font-size:16px;font-weight:800;margin-top:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.login{position:fixed;inset:0;display:grid;place-items:center;background:#0f1114;padding:20px;z-index:50}
.login.hidden{display:none}
.loginCard{width:min(390px,100%);background:#171a1f;border:1px solid #292e36;border-radius:15px;padding:22px}
.loginTitle{font-size:28px;font-weight:900;letter-spacing:-.04em}
.field{margin-top:18px;width:100%;background:#111318;border:1px solid #343a44;color:#f5f6f7;border-radius:10px;padding:12px;outline:none}
.field:focus{border-color:#747d89}
.loginBtn{margin-top:10px;width:100%;border:0;background:#f2f4f6;color:#111318;border-radius:10px;padding:12px;font-weight:900}
.loginError{font-size:12px;color:#ff9ba4;min-height:18px;margin-top:8px}
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,70px);opacity:0;background:#f0f2f4;color:#111318;padding:10px 14px;border-radius:9px;font-size:13px;font-weight:800;transition:.2s;z-index:80}
.toast.show{opacity:1;transform:translate(-50%,0)}
.footer{text-align:center;color:#626b76;font-size:11px;margin-top:16px;word-break:break-all}
@media(min-width:700px){.accounts{grid-template-columns:1fr 1fr}.stats{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<div id="login" class="login">
  <form id="loginForm" class="loginCard">
    <div class="loginTitle">MSCC</div>
    <div class="sub muted">Private control panel</div>
    <input id="password" class="field" type="password" autocomplete="current-password" placeholder="Password" required>
    <button class="loginBtn">Unlock</button>
    <div id="loginError" class="loginError"></div>
  </form>
</div>

<main id="app" class="wrap" hidden>
  <header>
    <div><h1>MSCC</h1><div class="sub muted">Private WhatsApp companion</div></div>
    <button id="logout" class="btn">Lock</button>
  </header>
  <div id="accounts" class="grid accounts"></div>

  <section class="card section">
    <div class="sectionTitle">Features</div>
    <div id="settings"></div>
  </section>

  <section class="card section">
    <div class="sectionTitle">System</div>
    <div id="stats" class="stats"></div>
    <div id="origin" class="footer"></div>
  </section>
</main>
<div id="toast" class="toast"></div>

<script>
const q=s=>document.querySelector(s);
let state=null,timer=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(t){const e=q('#toast');e.textContent=t;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('show'),2200)}
async function api(path,opts={}){const r=await fetch(path,{...opts,headers:{'content-type':'application/json',...(opts.headers||{})}});let d={};try{d=await r.json()}catch{}if(r.status===401){showLogin();throw new Error('Locked')}if(!r.ok)throw new Error(d.error||'Request failed');return d}
function showLogin(){q('#login').classList.remove('hidden');q('#app').hidden=true;if(timer){clearInterval(timer);timer=null}}
function showApp(){q('#login').classList.add('hidden');q('#app').hidden=false;if(!timer)timer=setInterval(refresh,3000)}
function cls(s){return s==='connected'?'connected':(s==='pairing'||s==='connecting'||s==='ready')?'wait':(s==='auth-invalid'?'bad':'')}
function label(s){return ({connected:'Connected',pairing:'Pairing',connecting:'Connecting',ready:'Ready',offline:'Offline','auth-invalid':'Auth needs re-pair',disabled:'Disabled'})[s]||s}
function accountCard(a){
  const enabled=a.enabled;
  let pairing='';
  if(a.pairingMode==='code'&&(a.pairingCode||a.pairingError)){
    pairing='<div class="box"><div class="label">Pairing code</div>'+(a.pairingCode?'<div class="code">'+esc(a.pairingCode)+'</div><div class="notice">WhatsApp → Linked devices → Link with phone number</div><div class="actions"><button class="btn" data-copy="'+esc(a.pairingCode)+'">Copy code</button><button class="btn" data-pair="code" data-id="'+a.id+'">New code</button></div>':'')+(a.pairingError?'<div class="error">'+esc(a.pairingError)+'</div>':'')+'</div>';
  } else if(a.pairingMode==='qr'&&(a.pairingQr||a.pairingError)){
    pairing='<div class="box"><div class="label">QR pairing</div>'+(a.pairingQr?'<img class="qr" src="'+esc(a.pairingQr)+'" alt="WhatsApp pairing QR"><div class="notice">Scan this only when you intentionally choose QR pairing.</div>':'')+(a.pairingError?'<div class="error">'+esc(a.pairingError)+'</div>':'')+'</div>';
  }
  const pairButtons=!enabled||a.connected?'':'<button class="btn primary" data-pair="code" data-id="'+a.id+'">Pair by code</button><button class="btn" data-pair="qr" data-id="'+a.id+'">Pair by QR</button>';
  return '<section class="card"><div class="accountTop"><div><div class="accountName">Account '+a.id+'</div><div class="meta">'+esc(a.numberMasked||'Not configured')+' · Index '+a.indexCount.toLocaleString()+' / '+a.indexLimit.toLocaleString()+'</div></div><span class="status '+cls(a.status)+'">'+label(a.status)+'</span></div>'+pairing+'<div class="actions">'+pairButtons+'<button class="btn" data-act="reconnect" data-id="'+a.id+'" '+(!enabled?'disabled':'')+'>Reconnect</button><button class="btn danger" data-act="repair" data-id="'+a.id+'" '+(!enabled?'disabled':'')+'>Re-pair</button></div></section>';
}
function setting(k,title,sub,v){return '<div class="setting"><div><div class="settingTitle">'+title+'</div><div class="settingSub">'+sub+'</div></div><button class="switch '+(v?'on':'')+'" data-setting="'+k+'"></button></div>'}
function stat(k,v){return '<div class="stat"><div class="statK">'+esc(k)+'</div><div class="statV" title="'+esc(v)+'">'+esc(v)+'</div></div>'}
function render(s){state=s;q('#accounts').innerHTML=s.accounts.map(accountCard).join('');q('#settings').innerHTML=setting('autoCc','Auto CC','Copy incoming view-once immediately',s.settings.autoCc)+setting('replyCc','Reply CC','Copy a view-once when anyone replies to it',s.settings.replyCc)+setting('antiDelete','Anti-delete','Mirror deleted messages to the private inbox',s.settings.antiDelete);q('#stats').innerHTML=stat('Destination','Account '+s.destination)+stat('RAM',s.system.rssMb+' MB')+stat('Uptime',s.system.uptime)+stat('Port',s.system.port);q('#origin').textContent=location.origin}
async function refresh(){try{const s=await api('/api/state');showApp();render(s)}catch(e){if(e.message!=='Locked')toast(e.message)}}
q('#loginForm').addEventListener('submit',async e=>{e.preventDefault();q('#loginError').textContent='';try{await api('/api/login',{method:'POST',body:JSON.stringify({password:q('#password').value})});q('#password').value='';await refresh()}catch(err){q('#loginError').textContent=err.message}})
q('#logout').onclick=async()=>{try{await api('/api/logout',{method:'POST',body:'{}'})}finally{showLogin()}}
document.addEventListener('click',async e=>{
 const b=e.target.closest('button');if(!b)return;
 if(b.dataset.copy){await navigator.clipboard?.writeText(b.dataset.copy);toast('Code copied');return}
 if(b.dataset.setting){try{await api('/api/settings',{method:'POST',body:JSON.stringify({key:b.dataset.setting,value:!state.settings[b.dataset.setting]})});await refresh();toast('Saved')}catch(err){toast(err.message)}return}
 const id=b.dataset.id;
 if(b.dataset.pair&&id){try{await api('/api/accounts/'+id+'/pair',{method:'POST',body:JSON.stringify({mode:b.dataset.pair})});toast('Pairing started');setTimeout(refresh,350)}catch(err){toast(err.message)}return}
 const act=b.dataset.act;if(!act||!id)return;
 if(act==='repair'&&!confirm('Re-pair Account '+id+'? Its current local auth will be backed up first.'))return;
 try{await api('/api/accounts/'+id+'/'+act,{method:'POST',body:JSON.stringify({confirm:act==='repair'})});toast(act==='repair'?'Re-pair started':'Reconnecting');setTimeout(refresh,350)}catch(err){toast(err.message)}
});
refresh();
</script>
</body>
</html>
